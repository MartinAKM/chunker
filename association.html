 de materiais no botão “Lista Materiais”, possibilitando ao usuário selecionar o que deseja, então, neste caso:\na rotina deve distribuir as qtdes da coluna “Quantidade” do botão “Lista Materiais” (exemplo\ntela abaixo) somente dentre as OFs que tem necessidades previstas (necessidades que podem ser\nvisualizado pelo programa ESTO25) e que estão selecionadas no botão “Ordem Fabricação” (sendo\nque podem estar selecionadas todas as OFs de tal Plano de Produção).\n\nDocum"], "250-16": ["Plano de Necessidades de Compras (COMP13) — SOLICITAÇÕES VINCULADAS A PLANOS DE PROD. JÁ APONTADOS NÃO SÃO LISTADOS NO MRP", "Solicitações.pdf", "Pedido Serviço 5713:\n\nSolicitação:\nSOLICITAÇÕES VINCULADAS A PLANOS DE PROD. JÁ APONTADOS NÃO SÃO LISTADOS NO MRP\nQuando os usuários realizam a elaboração de uma Solicitação de Necessidade de Materiais, pelo motivo de um\nconserto e/ou reposição e há a vinculação de um plano de produção que já tenha todos os seus processos\n\napontados, essa solicitação quando buscada pelo dpto de compras no programa Consulta Plano de Necessidade de\nCompras não é listada. O cliente enfatiza, que alguns materiais não estão sendo comprados devido a esta questão.\nConversei com o Jean sobre esta questão e ele me colocou que isso ocorre devido ao apontamento da produção e\nque a rotina do programa não foi alterada. M"], "250-21": ["Transferência entre Localização (ESTO23) — almox, utilizado na amcm, central", "Solicitações.pdf", "Documentação:\nAs alterações solicitadas no pedido de serviço foram realizadas.\n\nZzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz\nConfigurei este programa Solicitação ESTO93 para ser utilizado na AMCM em 15092016.\n\nIsso para a seguinte função:\nTem um Almoxarifado Central, e 1 Almox Recurtimento e 1 Almox Acabamento.\nOs Almox Recurtimento e Almox Acabamento solicitam o material para o Almoxarifado Central.\n\nE este programa Solicitação ESTO93 configurei para o pessoal solicitar para o Almoxarifado Central.\n\nExemplo:\n\nAqui o pessoal do Central faz o abastecimento...pode efetuar via informar o Numero da Solicitação, na seleção: \nE ocorre automático a transferência:\n\nDetalhe posterior no relatório:\n\n"], "252-6": ["Transferência entre Localização (ESTO23) — smart: estive revisando alguns estoques aí da BD Smart, e encontrei uma situação que acho…", "Transferência entre Localização - ESTO23.pdf", "De: Marcio Reni Schneider <marcio@kunden.com.br>\nEnviada em: sexta-feira, 22 de março de 2024 16:10\nPara: Marcio Reni Schneider <marcio@kunden.com.br>\nAssunto: smart: estive revisando alguns estoques aí da BD Smart, e encontrei uma situação que acho que estão fazendo não corretamente\n\n[16:03, 22/03/2024] Marcio Schneider: Olá Andrei,\n[16:03, 22/03/2024] Marcio Schneider: estive revisando alguns estoques aí da BD Smart, e encontrei uma situação\nque acho que estão fazendo não corretamente\n[16:05, 22/03/2024] Marcio Schneider: então, queria revisar isso com voce, numa reunião teams viever...aí posso te\napresentar em tela e avaliar contigo.\n[16:05, 22/03/2024] Marcio Schneider: Quando puder, hoj"], "252-11": ["Transferência entre Localização (ESTO23) — transferência de lotes, confirmado com roberto, cancelar uma entrega", "Transferência entre Localização - ESTO23.pdf", "3. Se eles conseguem transferir quando não tem reserva, eles não poderiam depois refazer essa reserva? Se\nsim, qual é o procedimento?\nMarcio 230424: aí eu não me arrisco a dar uma posição sem ter feito uma avaliação e bateria de testes e\nreunião com o cliente, imaginando tudo o que pode ser impactado com um tipo de alteração assim =\nenvolvendo todas as áreas...(4 a 8 horas de testes e reunião com o cliente)...\nMas eles mesmo poderiam testar e avaliar esta alternativa, e ver se atende a todas as suas áreas: podem\ncancelar uma entrega de Pedido de Venda, para o estoque vir ao disponível e logo imediatamente fazer a\ntransferência de Localização e criar uma nova entrega reservando este Disponíve"], "252-12": ["Transferência entre Localização (ESTO23) — Desabilitar produtos a nível sintético. [Imagem: ESTO7] Rotina", "Transferência entre Localização - ESTO23.pdf", "Pedido Serviço: 64851 Cliente: Kunden Solicitação:\nDesabilitar produtos a nível sintético.  Rotina:\n\nSuprimentos Estoque Lançamentos Implantação de Saldo Alteração:\n\nAlterar o filtro de \"Produto\" nos programas abaixo para que não seja possivel selecionar produtos de nivel sintético,\nfazendo com que a lista retorne apenas os produtos analiticos (ulitmo nivel).\nIsso evitará que produtos de nivel sintético recebam estoque de maneira equivocada.\nHoje, o filtro de produtos do ESTO15 já faz filtra desta forma.\nProgramas que devem ser alterados:\n- ESTO2 Implantação de Saldo;\n- ESTO3 Devoluções;\n- ESTO23 Transferencia Entre Localizações;\n- COMP3 Pedidos de Compra;\n- FATU3 Notas Fiscais de Entrada;\n-"], "254-0": ["Geração Rótulos para compostos de venda (FATU16) — montagem do layout, imprime de acordo, contendo a program", "Unidade Logistica.pdf", "Unidade Logistica..\n\nDe: Marcio Reni Schneider (Kunden Systems)\nEnviada em: sexta-feira, 9 de agosto de 2013 13:59\nPara: Jean Marcel Becker (Kunden Systems)\nAssunto: Sobre a “Unidade Logistica” que te comentei de manhã que tinha sido desenvolvida para a Imeco Olá Jean,\n\nSobre a “Unidade Logistica” que te comentei de manhã que tinha sido desenvolvida para a Imeco, está um pouco\ndocumentada no pedido serviço 16395 do Administrativo V3.\nA documentação de desenvolvimento é a abaixo.\n\nMarquei o que achei de mais interessante.\n\nTalvez se voce bater o olho nisso vais entender melhor...\nCaso queiras que eu me aprofunde para tentar entender e montar um exemplo para ser se é aproveitável, me fala.\n\nzz"], "257-38": ["Liberação Pedidos Faturamento (PEDI4) — Assunto: Re: A NF numero 266280 de ontem foi feita com problemas", "Liberação Pedidos Faturamento - PEDI4.pdf", "De: Laís - Faturamento AMCM [mailto:faturamento@amcm.ind.br]\nEnviada em: quarta-feira, 18 de janeiro de 2017 07:15\nPara: Marcio - Kunden\nCc: cpd@amcm.ind.br; 'Caligiuri Santos'\nAssunto: Re: A NF numero 266280 de ontem foi feita com problemas\nNão fiz nada de diferente !\nUsei o liberação faturamento OF, e não ocorreu nada de diferente.\n\nAtenciosamente, Laís Rodrigues\nAMCM IND COM IMP EXP SERV TECN 0055 51 30676220 zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz\n\nEm 18/01/2017 06:15, Marcio - Kunden escreveu:\nBom dia, Lais,\n\nA NF numero 266280 de ontem foi feita com problemas (exemplo tela abaixo).\nVeja que, dentro dos itens, no botão onde mostra os Lotes, não tem nenhuma informação do"], "257-61": ["Liberação Pedidos Faturamento (PEDI4) — vezes o usuario, tinha feito nada, sequencia quis excluir", "Liberação Pedidos Faturamento - PEDI4.pdf", "Visto em 240522, na AB, que as vezes o usuario do sistema “simples mortal” / “Não Administrador”, não consegue\nexcluir uma NF que ele gerou anteriormente...\n\nExemplo:\n-usuario gerou a NF pelo programa PEDI4, e na sequencia quis excluir a mesma (cfe informou, não tinha feito nada\nnesta NF, não tentou emitir, não editou, mas, não se tem certeza que talvez tenha feito uma manutenção nela)...\n\nO fato é que na tentativa deste usuario excluir a NF, dava mensagem de “Exclusão de registro não autorizada.”, cfe tela abaixo...\n\nSolução: excluir com o usuário Administrador “Kunden” (aí não deu nenhuma mensagem, sem problemas).\nAline confirmou que as vezes passou pela mesma situação (porém não tem nada "], "257-62": ["Liberação Pedidos Faturamento (PEDI4) — pedidos faturamento controle, grava na liberação, cadastro transportadora preferencial", "Liberação Pedidos Faturamento - PEDI4.pdf", "Sobre a Transportadora que é sugerida nos programas de Liberação para Faturamento (PEDI4, PEDI44, PEDI73,...):\n\n-O sistema “grava” a Transportadora para o faturamento no momento que é feito a aba “Liberação” nos programas\ncitados acima (PEDI4, PEDI44, PEDI73,...)...\n\n-primeiramente olha se tem a Transportadora gravado no Pedido de Venda.\n-Caso não esteja gravado no Pedido de Venda, busca do cadastro Transportadora Preferencial ADMI228.\nE aí grava na Liberação do Pedido de Venda e passa a trazer na aba “Faturamento”, ou aqui no botão Liberação\nPedidos Faturamento – Controle Carga PEDI73:  "], "257-63": ["Liberação Pedidos Faturamento (PEDI4) — PROGRAMA LIBERAÇÃO PEDIDOS FATURAMENTO ¿ PEDI4, ABA ¿FATURAMENTO¿, CAMPOS ¿QTD VOLUME¿ E", "Liberação Pedidos Faturamento - PEDI4.pdf", "Pedido Serviço: 58227 Cliente: AB Solicitação:\nPROGRAMA LIBERAÇÃO PEDIDOS FATURAMENTO ¿ PEDI4, ABA ¿FATURAMENTO¿, CAMPOS ¿QTD VOLUME¿ E\n¿NUMERO¿: ACUMULAR/SOMAR LIBERAÇÕES MANUAIS E COMPLEMENTARES DE RÓTULOS.\n\n1. Programa Liberação Pedidos Faturamento ¿ PEDI4, aba ¿Faturamento¿, bloco ¿Transp./Volumes¿, campos\n¿Qtd Volume¿ e ¿Numero¿:\n- nestes campos acumular/somar a qtde de novas liberações de rótulos, liberados manualmente na aba Liberação,\njuntando às qtdes já existentes anteriores do mesmo ¿agrupamento¿ (juntar nestes 2 campos).\n- Atualmente a rotina substitui as qtdes destes 2 campos, passando a mostrar a qtde da ultima liberação efetuada, e\nnão somando ao que já havia anteriormente lib"], "257-65": ["Liberação Pedidos Faturamento (PEDI4) — gerar o controle, fiscais de saída, distribuição faturamento notas", "Liberação Pedidos Faturamento - PEDI4.pdf", "Pedido Serviço: 61520 Cliente: Pegada Solicitação:\n\nRotina:\n\nVendas e Distribuição Faturamento Notas Fiscais\nNotas Fiscais de Sa\n\ne: Pegada Solicitação:\n\nRotina:\n\nVendas e Distribuição Faturamento Notas Fiscais\nNotas Fiscais de Saída Alteração:\nNão está sendo possível gerar o controle de uma nota fiscal de saída. Mensagem “KND-003050” Documentação:  Vendas e Distribuição Faturamento Notas Fiscais\nNotas Fiscais de Saída Detalhamento:\nNada foi feito.\n\nObservação:\nNão é possível faturar produtos que controlam rótulo pelo PEDI4."], "258-14": ["Liberação Pedidos Faturamento (PEDI44) — entrega de avulso, rótulo sistema, entregas liberadas", "Liberação Pedidos Faturamento Rotulos - PEDI44.pdf", "Pedido Serviço: 28888 Solicitação:\n\nROTINA:\n\nVendas e Distribuição Faturamento Notas Fiscais\nLiberação Pedidos Venda Faturamento ALTERAÇÃO:\n\n- Quando temos uma entrega de avulso e rótulo, sistema não está f\n\nidos Venda Faturamento ALTERAÇÃO:\n\n- Quando temos uma entrega de avulso e rótulo, sistema não está fazendo a validação do cancelamento de entrega\ncorretamente. Situação ocorre, tanto em pedidos que vem pelo B2B, quanto em pedidos digitados no ERP.\n- Na liberação de pedidos deve trazer somente as entregas ativas.\n\nDocumentação:\n\nVendas e Distribuição Faturamento Notas Fiscais\nLiberação Pedidos Venda Faturamento Detalhamento:\nAlterado programa para mostrar a opção \"Entregas Liberadas\" na a"], "258-16": ["Liberação Pedidos Faturamento (PEDI44) — qtde de caixas, agrupar pedidos, cfe visto", "Liberação Pedidos Faturamento Rotulos - PEDI44.pdf", "Cfe visto em testes, o bloco de Volumes no FATU44 é por Agrupamento...aba faturamento\n\nCfe testes: na real é por Agrupamento...mas quando o parâmetro do programa AGRUPAR_PEDIDOS está N, então\ncada pedido vai ter a sua qtde de caixas...cfe tela abaixo"], "258-25": ["Liberação Pedidos Faturamento (PEDI44) — LIBERAÇÃO PEDIDOS VENDA FATURAMENTO - SALDO DE UMA ENTREGA COM FATURAMENTO PARCIAL NÃO…", "Liberação Pedidos Faturamento Rotulos - PEDI44.pdf", "Pedido Serviço: 44874 Cliente: TEA Solicitação:\nLIBERAÇÃO PEDIDOS VENDA FATURAMENTO - SALDO DE UMA ENTREGA COM FATURAMENTO PARCIAL NÃO ESTÁ\nVINCULANDO A TRANSPORTADORA PREFERENCIAL.\n\nRotina:\n\nVendas e Distribuição Faturamento Notas Fiscais\nLiberação Pedidos Venda Faturamento Alteração:\n\n- Saldo de uma entrega com faturamento parcial não está vinculando a transportadora preferencial, definida no\nADMI228 causando quebra do agrupamento do pedido no faturamento.\n\nDocumentação:\nVendas e Distribuição Faturamento Notas Fiscais\nLiberação Pedidos Venda Faturamento Detalhamento:\nAjustado."], "258-28": ["Liberação Pedidos Faturamento (PEDI44) — rótulos ou avulsos, produto não possui, pedidos venda faturamento", "Liberação Pedidos Faturamento Rotulos - PEDI44.pdf", "Pedido Serviço: 52538 Cliente: Pegada Solicitação:\n\nRotina:\nVendas e Distribuição Faturamento Notas Fiscais\nLiberação Pedidos Venda Faturamento Alteração:\nOs pedidos na base de produção serão faturados pelo programa PEDI4 para não atrasar o faturamento.\nErro em produto na liberação de faturamento. O mesmo esta apresentando o seguinte erro \" KND-003050: Os itens\nna nota não foram gerados\" ao selecionar somente ele.\nPedidos que estão ocorrendo erro:\n40.22589.1352 40.22589.1353 40.22589.1357 40.22589.1356 40.22589.1359 40.22589.1358 40.22589.1348 40.22589.1355 Documentação:\nVendas e Distribuição Faturamento Notas Fiscais\nLiberação Pedidos Venda Faturamento Detalhamento:\nNada foi feito.\n\nObserva"], "258-30": ["Liberação Pedidos Faturamento (PEDI44) — pedidos faturamento controle, grava na liberação, cadastro transportadora preferencial", "Liberação Pedidos Faturamento Rotulos - PEDI44.pdf", "\nSobre a Transportadora que é sugerida nos programas de Liberação para Faturamento (PEDI4, PEDI44, PEDI73,...):\n\n-O sistema “grava” a Transportadora para o faturamento no momento que é feito a aba “Liberação” nos programas\ncitados acima (PEDI4, PEDI44, PEDI73,...)...\n\n-primeiramente olha se tem a Transportadora gravado no Pedido de Venda.\n-Caso não esteja gravado no Pedido de Venda, busca do cadastro Transportadora Preferencial ADMI228.\nE aí grava na Liberação do Pedido de Venda e passa a trazer na aba “Faturamento”, ou aqui no botão Liberação\nPedidos Faturamento – Controle Carga PEDI73:"], "258-31": ["Liberação Pedidos Faturamento (PEDI44) — PEDI44 - PROGRAMA PEDI44 NÃO ESTA FAZENDO A VALIDAÇÃO DO CAMPO \"LIMITE CRÉDITO…", "Liberação Pedidos Faturamento Rotulos - PEDI44.pdf", "  Pedido Serviço: 53522 Cliente: Pegada Solicitação:\nPEDI44 - PROGRAMA PEDI44 NÃO ESTA FAZENDO A VALIDAÇÃO DO CAMPO \"LIMITE CRÉDITO FATURAMENTO\"\nQUANDO UM PRODUTO ESTA SENDO FATURADO PARCIALMENTE.\n\nRotina:\n\nVendas e Distribuição Faturamento Notas Fiscais\nLiberação Pedidos Venda Faturamento Alteração:\n\nAjustar programa PEDI44 para que quando um produto ser faturado parcialmente ele deve olhar para o campo\n\"Limite Crédito Faturamento\" e visualizar o valor que esta liberado, e não olhar para o valor total do pedido de venda.\n\nDocumentação:\nVendas e Distribuição Faturamento Notas Fiscais\nLiberação Pedidos Venda Faturamento Detalhamento:\nNada foi feito.\n\nObservações:\nPedido não pode ser classific"], "258-36": ["Liberação Pedidos Faturamento (PEDI44) — LIBERAÇÃO PEDIDOS VENDA FATURAMENTO - IDENTIFICAR MOTIVO DE ESTAR SENDO LEVADO DESCONTO", "Liberação Pedidos Faturamento Rotulos - PEDI44.pdf", "Pedido Serviço: 69283 Cliente: Atta  Solicitação:\nLIBERAÇÃO PEDIDOS VENDA FATURAMENTO - IDENTIFICAR MOTIVO DE ESTAR SENDO LEVADO DESCONTO\nNEGATIVO PARA A NF Rotina:\n\nVendas e Distribuição Faturamento Notas Fiscais\nLiberação Pedidos Venda Faturamento Alteração:\n\n- Identificar motivo/configuração de estar levando desconto negativo para a NF.\n\n1=Pedido de venda vem do B2B e possui ajuste de preço:  \n2.1. Gerada a NF está levando o valor unitário de 39,1116, quando o correto seria 40,10. E também leva o desconto\nnegativo, quando não deve haver desconto nos itens:\n\nConfigurações que foram revisadas:\n3.1. Parâmetro geral 269 (DESCONTO UTILIZADO - DEFINE O TIPO DE DESCONTO UTILIZADO PELO CLIENTE:\nG"], "258-41": ["Liberação Pedidos Faturamento (PEDI44) — exibido a mensagem, entrarem no estoque, apontamentos e rótulos", "Liberação Pedidos Faturamento Rotulos - PEDI44.pdf", "3. Quando produção efetuar os apontamentos e rótulos entrarem no estoque reservado para os pedidos, permitir usuário baixar\nestas quantidades(rótulos) pelo programa CEXC101, semelhante o que faz atualmente com produtos que não controlam rótulo no estoque.\n\nDocumentação:\n\nVendas e Distribuição Faturamento Notas Fiscais Liberações Liberação Pedidos Faturamento Parâmetro Inicialização:\nFATURAMENTO_SEM_ESTOQUE | Define Se Permite Faturar Itens Do Pedido Que Ainda Não Possuem Estoque Em Parte Ou Total.\n\nDetalhamento:\nQuando o parâmetro de inicialização FATURAMENTO_SEM_ESTOQUE estiver como \"S\" não será exibido a mensagem\n“KND-003050-Os itens da nota não foram gerados”.\n\nSuprimentos Estoque Lançame"], "258-49": ["Liberação Pedidos Faturamento (PEDI44) — verifica status faturamento, saldo de crédito, questões financeiras", "Liberação Pedidos Faturamento Rotulos - PEDI44.pdf", "Abaixo passo a passo envia para Atta no RA 260709017 https://kundencloud.com.br:3825/atendimento?id=260709017&callType=customer \nPEDI44 com VERIFICA_STATUS_FATURAMENTO = “S”\n\nAvaliação na BD Atta em 130726, no programa PEDI44, a partir de configurado o parâmetro\nVERIFICA_STATUS_FATURAMENTO com atributo “S”...ou seja, validações que ocorrem a partir desta configuração,\nque em resumo são:\n-Validações envolvendo questões financeiras e de saldo de crédito; (Posição Posterior: cfe visto em testes\nposteriores, as questões financeiras e de saldo de crédito independem deste parâmetro\nVERIFICA_STATUS_FATURAMENTO = “S”, ou seja, mesmo com atributo “N” elas ocorrem, desde que as\nconfigurações pertinent"], "258-50": ["Liberação Pedidos Faturamento (PEDI44) — campos: Aceita Embarque Parcial, Permite Embarque Parcial, Ficha Financeira e Classe…", "Liberação Pedidos Faturamento Rotulos - PEDI44.pdf", "Onde é configurada tal Validação:\n-Aqui no Pedido Venda, exemplo tela e campo abaixo “Aceita Embarque Parcial”: neste exemplo de validação\nocorrida acima, veja que no Pedido Venda estava desmarcado a possibilidade de embarque parcial.\n-Detalhe: este campo Aceita Embarque Parcial no Pedido Venda, é sugerido/preenchido de acordo conforme está no\ncadastro do Cliente-ADMI34, campo “Permite Embarque Parcial”...  \n...aqui testando e comprovando:\n-Quando selecionado a opção “Aceita Embarque Parcial”...\n\n...no programa PEDI44 o mesmo item de Pedido Venda passa a ter a situação OK para faturamento (diferentemente\ndo primeiro teste acima) Zzzzzzzzzzzzzzzzzzzzzzzzzzz  \nExemplo 2: mensagem “Entrega não "], "259-9": ["Operação no cadastro de Operações (RECE2) — RECE2 - AO CONFIRMAR CONTROLE COM OPERAÇÃO QUE CONTROLA ESTOQUE, PORÉM O CAMPO \"EXIGE", "Operação - RECE2.pdf", "Pedido Serviço: 56052 Cliente: Pegada Solicitação:\nRECE2 - AO CONFIRMAR CONTROLE COM OPERAÇÃO QUE CONTROLA ESTOQUE, PORÉM O CAMPO \"EXIGE\nLOCALIZAÇÃO\" ESTÁ COMO NÃO, O SISTEMA GERA ERRO NO ESTOQUE POR NÃO GERAR AS MOVIMENTAÇÕES.\n\nRotina:\n\nSuprimentos Recebimento Cadastros Operações Alteração: \nAjustar programa RECE2 para que quando forem cadastradas novas operações com a opção de \"Controla Estoque\"\nestiver \"Sim\" o campo \"Exige Localização\" por padrão deve vir \"Sim\", mas ainda sim deve ser possível alterar para \"Não\".\n\n...complementando e registrado na Validação:\nSegue abaixo posicionamento quanto ao Impedimento registrado em 23/03/2022 (Pedido Com Impedimento\nAlterado Para = Sim. Motivo: \"Agu"], "259-11": ["Operação no cadastro de Operações (RECE2) — Arquivar...este campo faz com que o sistema gere automaticamente o consumo, na requisição", "Operação - RECE2.pdf", "De: Marcio Schneider [mailto:marcio@kunden.com.br]\nEnviada em: quinta-feira, 6 de janeiro de 2022 10:11 Para: 'Marcio Schneider'\nAssunto: Arquivar...este campo faz com que o sistema gere automaticamente o consumo, na requisição...\n\nArquivar...este campo “Efetua Consumo” do RECE2 faz com que o sistema gere automaticamente o consumo, na requisição...\nQuando enviado por exemplo materiais para terceirização = atelier, com atualização de estoque e ficando na conta Industrialização do Estoque...\nE na volta tem que voltar ao Disponível e ocorrer o consumo registrado numa requisição.\n(detalhe que para isso, o campo mais abaixo “Apropriação: Estoque Industrialização” tem que estar configurado com\nNÃO"], "259-19": ["Operação no cadastro de Operações (RECE2) — CRIAR UM PARÂMETRO GERAL AONDE TODAS AS NOTAS FISCAIS DE ENTRADA COM PIS/COFINS ENTRARÃO…", "Operação - RECE2.pdf", "Pedido Serviço: 61839 Cliente: Brisa  Solicitação:\nCRIAR UM PARÂMETRO GERAL AONDE TODAS AS NOTAS FISCAIS DE ENTRADA COM PIS/COFINS ENTRARÃO COM\nREDUÇÃO NA BASE DE CÁLCULO, AONDE SERÁ DEDUZIDO O VALOR DO ICMS NA BASE DE CALCULO DO PIS/COFINS.\n\nRotina:\n\nSuprimentos Recebimento Notas Fiscais\nNota Fiscal de Entrada Alteração:\n- Criar um parâmetro geral aonde todas as notas fiscais de entrada com PIS/COFINS entrarão com redução na base\nde cálculo, aonde será deduzido o valor do ICMS na base de calculo do PIS/COFINS.\n\nDocumentação:\n\nParâmetro Geral:\n50276 | DESCONTA ICMS DA BASE DE CÁLCULO DO PIS E COFINS NFE/COTAÇÃO/FPV | DESCONTA ICMS DA BASE\nDE CÁLCULO DO PIS E COFINS DAS NOTAS DE ENTRADA COM C"], "259-22": ["Operação no cadastro de Operações (RECE2) — Dúvida CFOP Boa tarde Marcio, Agradeço pelo retorno!", "Operação - RECE2.pdf", "De: Juliana Fazolim <fiscal@vpsleather.com.br>\nEnviada em: terça-feira, 16 de julho de 2024 14:35\nPara: Marcio Reni Schneider <marcio@kunden.com.br>  \nCc: simone@vpsleather.com.br; compras@vpsleather.com.br; Ismael de Paula <ismael@kunden.com.br>\nAssunto: RES: Dúvida CFOP Boa tarde Marcio, Agradeço pelo retorno!\n\nAinda me resta a seguinte dúvida: ao lançar a nota nós teremos que selecionar\n\ngradeço pelo retorno!\n\nAinda me resta a seguinte dúvida: ao lançar a nota nós teremos que selecionar a operação correta, e\ndentro dessa operação temos que escolher a CFOP ou não?"], "259-27": ["Operação no cadastro de Operações (RECE2) — OPERAÇÕES (ESTOQUE) - ESTO1 - CRIAR ABA PARA CADASTRAR OS PARAMETROS DE RETORNO DE…", "Operação - RECE2.pdf", "Documentação:\n\nParâmetro Geral:\n114 | CATEGORIA PRODUTO TERCEIRIZAÇÃO\nEste parâmetro é opcional e visa especificar a categoria de produtos a serem criados durante o processo de geração\nde remessa para industrialização. Destina-se exclusivamente a produtos do tipo 'Produto semi-acabado'.\n\nSuprimentos\nPlanejamento Necessidade de Materiais Abastecimento (MRP)\nPlano Abastecimento Materiais - Remessa Industrialização Detalhamento:\n1. Processo de Criação de Produto:\nProgramas Afetados: ESTO25, ESTO129 (com MENU_CLASSE = RI) e TERC1.\nNova Rotina: Ao criar o pedido de compra, primeiro cria-se um produto na engenharia, que será o item do pedido.\nCategoria do Produto: Conforme definido no parâmetro CA"], "259-28": ["Operação no cadastro de Operações (RECE2) — Testes feitos em 10026, para avaliar a situação do RA 260103001 da VPS", "Operação - RECE2.pdf", "Testes feitos em 10026, para avaliar a situação do RA 260103001 da VPS:\n\nAvaliando aqui a sobre a configuração do campo “Controla Depósito” tanto do RECE2-Recebimento como do RECE2-\nFaturamento...e como funciona a rotina de controle do Depósito Disponível...\n\n...testes feitos na Desenv, com estas Operações assim configuradas:\nVeja que acima, que o campo “Controle Depósito” está NÃO...com isso olhando o teste abaixo, isso comprova que:\n-Que a rotina não utiliza este campo “Controle Depósito” para atualizar as qtdes no Controle de Estoque / Tipo Estoque = Depósito...\n...e sim utiliza este campo “Controle Depósito” para atualizar as qtdes no Controle de Estoque / Tipo Estoque\n= Depósito Disponí"], "261-0": ["Cadastro de Configuração Especial (FATU94) — especial de operações, frigorificos, letavo", "Cadastro de Configuração Especial de Operações – FATU94.pdf", "Cadastro de Configuração Especial de Operações – FATU94..\n\n-Funciona no FATU44, FATU4\n-No FATU153 de Frigorificos: a desenvolver...provável para a Letavo."], "261-5": ["Cadastro de Configuração Especial (FATU94) — controlar e integrar, sugerir a operação, rotina do sugere", "Cadastro de Configuração Especial de Operações – FATU94.pdf", "Avaliado em 070624, na implantação VPS...a rotina do RECE94 sugere OK a operação no programa ESTO71:\n\nConfigurei o programa FATU94, para sugerir a Operação para a Emissão da NF de Saída gerada pelo programa\nESTO71, de acordo com os critérios de:\nMatéria Prima: Operação configurada para controlar e integrar o movimento com o Estoque.\nProduto em Fabricação “201-PEÇAS CORTADAS P/ COSTURA”: Operação configurada para NÃO controlar e integrar\no movimento com o Estoque (conforme já esclarecido em treinamentos anteriores, os Produtos em Fabricação só\nsão gerados para o Estoque por ocasião do final do mês, não sendo controlado a sua movimentação durante o mês).\n(e mantive a configuração no ESTO71, pa"], "262-2": ["Recebimentos (RECE32) — Assunto: Pedido Serviço abaixo, pedido serviço 11594, programa RECE32", "Cadastro de Configuração Especial de Operações – Recebimentos – RECE32.pdf", "De: Marcio Reni Schneider <marcio@kunden.com.br>\nEnviada em: terça-feira, 23 de setembro de 2025 06:33\nPara: Cesar Wagner <cesar@kunden.com.br>\nAssunto: Pedido Serviço abaixo, pedido serviço 11594, programa RECE32\n\nBom dia Cesar, beleza?\n\nPergunta...\n-Veja a tela do Pedido Serviço abaixo, pedido serviço 11594...\n-Ali foi o Pedido Serviço original que criou o programa RECE32 que sugere as Operações nas NFs de Saida e Entrada...\n-Voce se lembra se na época o Martinho participou desta definição, e algum tipo de participação para a sua criação?\n\nPorque eu pergunto isso...\n-Porque agora estamos num embate com ele, Martinho, no Henrich...\n\n-Ano passado, quando implantei na VPS, fiz via Pedido Serv"], "262-7": ["Recebimentos (RECE32) — especial de operações, produtos materiais, maneira correta", "Cadastro de Configuração Especial de Operações – Recebimentos – RECE32.pdf", "Teste feito posterior, complementando o teste acima (porém não temos printado as telas):\n-Invertemos a ordem dos cadastros das “Classe Operação” = “Compras” e “Retorno Industrialização” no RECE32, e\nmesmo assim sugeriu OK no programa RECE7...\n\n-Também fizemos um teste com um Pedido Compras do mesmo Fornecedor e Produto no COMP5, e gerou a NF de\nCompras com a Operação correta.\n\nPosição dada ao cliente no RA 250220023:\n\n“Jhanrie.Sup 09/10/2025 - 07:58:32 Bom dia,\n\nEntendemos a sua preocupação.\n\nNo entanto também entendemos que, se utilizarem as regras do programa RECE32-Cadastro de Configuração\nEspecial de Operações, atenderá as suas necessidades:\n-Vão estar efetuando de maneira correta o proc"], "263-1": ["FATU146 — configurações de notas, ver o anexo, segurança onde deve-se", "Configuração de Serviços de Documentos Fiscais Eletrônicos (DF-e) - FATU146.pdf", "De: Deisy Hoff (Kunden Systems)\nEnviado: sexta-feira, 19 de julho de 2019 12:25:42\nPara: Lucas Schorr (Kunden Systems); William Boll (Kunden Systems); Deise Nara (Kunden Systems); Aline Kaefer\n(Kunden Systems); Augusto Willrich (Kunden Systems); Denise Aparecida de Oliveira Both (Kunden Systems); Ismael\nde Paula; Letierson da Silva (Kunden Systems); Marcio Reni Schneider (Kunden Systems); Martin Schneider (Kunden\nSystems); Marti Bauer; Micail K. Zabalotzki (Kunden Systems); Roberto Schumacher (Kunden Systems); Simão Meyrer\n(Kunden Systems); Angélica Schuh (Kunden Systems); Ericsson G. dos Santos(Kunden Systems); Lucas Schuh (Kunden Systems)\nCc: Cesar André Wagner (Kunden Systems)\nAssunto: Pa"], "263-9": ["FATU146 — CRIAR UMA NOVA OPÇÃO NO PROGRAMA CONFIGURAÇÕES DE NOTAS FISCAIS- 'GRADE/DESC.COMPL.PROD'…", "Configuração de Serviços de Documentos Fiscais Eletrônicos (DF-e) - FATU146.pdf", "Pedido Serviço: 19007 Cliente: Malu Solicitação:\nCRIAR UMA NOVA OPÇÃO NO PROGRAMA CONFIGURAÇÕES DE NOTAS FISCAIS- 'GRADE/DESC.COMPL.PROD' PARA\nGERAR A GRANDE NOS DADOS ADICIONAIS DO PRODUTO.  ROTINA Faturamento Notas Fiscais\nConfigurações de notas fiscais.\n\nALTERAÇÃO\n\nCliente tem a necessidade de que a grade dos produtos saia na descrição complementar do item.\nIsso porque o campo descrição do item aceita 120 caracteres, e em grande parte dos produtos a descrição ocupa\ntodos esses caracteres, deixando de fora a grade que está sendo digitada de forma manual na descrição complementar do produto.\n\nA sugestão é criar na configuração de Notas uma nova forma de impressão da Grade, manter a atual op"], "267-0": ["FATU1 — Faturamento", "Conta e Ordem_e_Faturamento_Triangular_Brisa.pdf", "A rotina de NFS conta e orde Brisa foi desenvolvido sob Pedido Serviço 14793..\nObs.: provalvel que na operação 118 3, tem que colocar atualiza estoque = sim.\n\n(Na Brisa é Calçados Cariri, Schmidt,...)\n\nObs.: no exemplo abaixo, na Brisa está sendo utilizado a Intexco no campo Cliente Faturamento.\n\nOperações:\n\nCadastro de Programas: no programa Liberação Pedidos faturamento e Notas Fiscais Saída:\n\nObs.: O pedido é feito para o cliente codigo 19 (cfe este exemplo. Na Brisa é Calçados Cariri, Schmidt,...). A primeira\nNF de cobrança/venda sai para destinatario 35 (na Brisa é Intexco) \n\nImpressão de Nfs de cobrança/venda (o exemplo de impressão é de outra NF em relação à NF acima):\n\nUtilizar o pro"], "269-1": ["Nota Fiscal de Saída (FATU2) — Controle de Entrada e Retorno de Consertos no Kunden ERP - Lutheuz", "Controle de Entrada e Retorno de Consertos.pdf", "De: Alexis Rafael Villarroel Ramirez <alexis.villarroel@kunden.com.br>\nEnviada em: terça-feira, 24 de junho de 2025 16:35\nPara: Marcio Reni Schneider <marcio@kunden.com.br>\nAssunto: RE: Controle de Entrada e Retorno de Consertos no Kunden ERP - Lutheuz\nBoa tarde, segue o anexo em Word.\nxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx\nControle de Entrada e Retorno de Consertos no Kunden ERP - Lutheuz.\nProgramas:\n• Notas Fiscais de Entrada – FATU3.\n• Notas Fiscais de Saída – FATU2.\n• Retorno de Remessa De Conserto LCTO – FATU9.\n• Relatório Controle de Deposito – Recebimento e Retorno – RECE21.\n• Operações Recebimento – RECE2.\n• Operações Faturamento – RECE2.\nPara simplificar "], "271-4": ["FATU98 — com isso gerando assim a NF Entrada...sendo necessário ajustar manualmente", "Cópia de Nota Fiscal de Saída – FATU98.pdf", "...com isso gerando assim a NF Entrada...sendo necessário ajustar manualmente:\nNatureza (não entendi o porquê a rotina gerou como Emissão ao invés de Lançamento), Data Entrada, Nro NF, Série\n(trocar para poder salvar a NF de Entrada = porque já existe uma NF com este nro e série), Localização) e confirmar... \nFicando assim cfe abaixo: só restou Confirmar:\n\nXxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx \nAcompanhei uma situação na Cristófoli, em 110326, na qual a Cristófoli utilizou o programa de Cópia de NF ...\n\n...no caso, essa foi a NF Saída usada de base, sendo que esta NF tem o produto com controle de Rótulo, e a\nconfiguração se “separar” um Item separado para cada tamanho de grade*"], "272-8": ["FATU9 — NOTA FISCAL DE SAÍDA - AJUSTAR VALOR BASE CÁLCULO DO ICMS QUE NÃO ESTÁ CONTABILIZANDO O…", "Devolução de Compras - FATU9.pdf", "Pedido Serviço: 66272 Cliente: HK Solicitação:\nNOTA FISCAL DE SAÍDA - AJUSTAR VALOR BASE CÁLCULO DO ICMS QUE NÃO ESTÁ CONTABILIZANDO O VALOR DO IPI ROTINA:   Vendas e Distribuição Faturamento Notas Fiscais\nNota Fiscal de Saída ALTERAÇÃO:\n\nQuando operação configurada para aplicar valor IPI, ao realizar uma devolução de compra pelo FATU9, valor base\ncálculo do ICMS não está contabilizando o valor do IPI.\n\nDocumentação:\n\nVendas e Distribuição Faturamento Notas Fiscais\nNota Fiscal de Saída Detalhamento:\nAjustado."], "274-12": ["Rótulos (FATU104) + Recebimento Devoluções de Consignação (FATU6) — Esta situação creio que também tenha haver com Devolução", "Devolução de Venda - FATU6 e FATU104.pdf", "Esta situação creio que também tenha haver com Devolução:\n\nSituação Frigolaste em 140119\n\nNecessitavam que o Estorno voltasse para o Estoque Reservado, e que o programa de Liberação (no caso do\nprograma FATU153, Liberação Faturamento Pedidos Rotas) permita seu novo faturamento.\n\nNeste caso, o Estorno* da NFS gera uma NF Entrada “Emissão” (como se fosse uma Devolução).\n*Estorno é feito quando não é mais possível “Cancelar” a NFS porque perdeu o tempo hábil de horas disponibilizado\npelo Sefaz para fazer o cancelamento.\n\nExemplo:\nVeja que na NFS fica referenciada a NF de Entrada:\n...e veja aqui a NF de Entrada “Emissão” que é gerada automaticamente após usar o botão “Gera NF Estorno” na tela\nac"], "274-27": ["Rótulos (FATU104) + Recebimento Devoluções de Consignação (FATU6) — reserva qtd ped, grade atm where, localização diferente", "Devolução de Venda - FATU6 e FATU104.pdf", "Situação na VPS em 220824...gerava esta mensagem “KND-003495” ao tentar gerar a NF pelo PEDI4...\n\n(IMPORTANTE, posterior em 091024: talvez esta situação abaixo tenha ficado resolvido pós atualização dos\ndesenvolvimentos do patch 258 “pacotão”, onde foi atualizado a rotina de controle de estoques, que tive a\nreformulação de grande parte das rotinas de Estoque. Até este dia não testei com esta versão de patch e estoque).   Olhando os Estoque:\n-não tinha reserva em mais de 1 Localização...veja tela abaixo...\n-mas o que estava no estoque reservado, estava em localização diferente do faturamento inicial deste pedido de\nvenda...isso porque as qtdes em reservado são decorrentes de lançamento de Dev"], "274-30": ["Rótulos (FATU104) + Recebimento Devoluções de Consignação (FATU6) — Passo a passo elaborado para Planet e enviado no protocolo 250116015, em 210125", "Devolução de Venda - FATU6 e FATU104.pdf", "Passo a passo elaborado para Planet e enviado no protocolo 250116015, em 210125:\n\nPlanet_250116015_Passo a Passo\n\nCom base na sua documentação registrada no protocolo 250116015, referente à necessidade de controle das\ndevoluções e de acordo com o seu esquema e fluxo disponibilizado, recomendamos utilizar da seguinte maneira no Kunden ERP:\n\n1= No módulo de CEP, o 1º cadastro é no programa “Indcadores-CPRO1”, exemplo tela abaixo.\n\nPara as Devoluções de Vendas, já está criado o Indicador “DEVOLUÇÕES VENDA”.\nPodem iniciar com este indicador já criado.\n\n2= Ainda no módulo de CEP, o 2º cadastro é no programa “Eventos-CPRO3”, exemplo tela abaixo.\n\nVejam que ainda não há nenhum Evento cadastrado par"], "276-7": ["Emissão Etiqueta com Documento Fiscal (FATU55) — programa “Emissão Etiqueta com Documento Fiscal” está agora gerando as etiquetas na ordem…", "Emissão Etiqueta com Documento Fiscal – FATU55.pdf", "De: Marcio Schneider [mailto:marcio@kunden.com.br]\nEnviada em: quarta-feira, 10 de novembro de 2021 08:02\nPara: 'ab.marcus2021@gmail.com'; 'jonas santos'\nAssunto: programa “Emissão Etiqueta com Documento Fiscal” está agora gerando as etiquetas na ordem dos números de caixas\n\nSó para avisar (talvez já tenham percebido), que o programa “Emissão Etiqueta com Documento Fiscal” está agora\ngerando as etiquetas na ordem dos números de caixas, conforme exemplo tela 1 abaixo.\n\n-Também, assim como já estava previsto na impressão da etiqueta, está sendo impressão o Numero do “Item\nArezzo”, que é o mesmo que está gravado no Pedido de Venda (tela 2 abaixo).\n\nTela 1:\nTela 2:\n\nCadastro necessário para o “I"], "278-1": ["FATU26 — nfs selecionadas, vistas na implantação, minuta", "Emissão Minuta – FATU26.pdf", "Opções de minuta vistas na Implantação VPS (tem empresas que chamam de “Romaneio de Transporte” para transporte, transportadoras):\n\nEsta opção FATU26/FATU27, o sistema gera um “documento” de Minuta por NF...(vai 2 “documentos” por pagina)...\nEsta opção FATU26/FATU92, todas as NFs selecionadas vão no mesmo “documento”:  \nEsta opção FATU26/FATU164, todas as NFs selecionadas vão no mesmo “documento”: "], "280-1": ["Emissão Rótulos com Documento Fiscal (FATU24) — ROTULO - AJUSTES FINAIS Ajustes finais", "Emissão Rótulos com Documento Fiscal – FATU24.pdf", "Pedido Serviço: 11993 Solicitação:\nROTULO - AJUSTES FINAIS Ajustes finais:\n\n1- Centralizar imagem;\n2- Linha da grade BRASIL é fixo assim como dos demais países. Foto em anexo mostra a coordenação que deve ser obedecida;\n3- Criar parâmetro de inicialização para identificar qual FLEXFIELD do pedido de venda devera sair impresso. No\nrelatório trazer essa informação junto/concatenada com o destinatário;\n4- ERRO GERA_FATURAMENTO_8TMP_P quando filtrado CLIENTE e DATA DE ENTREGA na base de DESENVV4.\nFiltrando pedido + data de entrega e gera a mesma mensagem.\n\nDocumentação:\nNovo parâmetro de inicialização FLEXFIELD, o qual indica qual o flexfield que será concatenado no destinatário. Este\nflexfield "], "281-2": ["Emissão Rotulos Nota Fiscal (FATU107) — Melhoria Impressão Rótulo Kunden em Inglês / Espanhol Documentação", "Emissão Rótulos com Nota Fiscal – FATU107.pdf", "Pedido Serviço: 60372 Cliente: Pegada Solicitação:\nMelhoria Impressão Rótulo Kunden em Inglês / Espanhol Documentação:\n\nAdministração Cadastros Dicionário-ADMI224 Detalhamento:\nA largura e altura do programa foram aumentadas para exibir mais registros em tela.\n\nVendas e Distribuição Faturamento Rótulos\nEmissão Rotulos Nota Fiscal- FATU107 Detalhamento:\nAdicionado em tela o campo de filtro de idiomas.\n\nRelatório:\nFATU17_PEGADA_GRD_MARCAR | Sequência 1 Vendas e Distribuição Faturamento\n\nro de idiomas.\n\nRelatório:\nFATU17_PEGADA_GRD_MARCAR | Sequência 1 Vendas e Distribuição Faturamento Rótulos\nEmissão Rótulos - Pedidos Distribuição Pegada Europa- FATU16 Detalhamento:\nAdicionado em tela o campo "], "282-5": ["Encerramento Notas Fiscais (FATU111) — Ajustar produtos que constam em industrialização porém não existe nota vinculada", "Encerramento Notas Fiscais - FATU111.pdf", "Pedido Serviço: 65846 Cliente: Pegada Solicitação:\nAjustar produtos que constam em industrialização porém não existe nota vinculada.\n\nRotina:\n\nSuprimentos Estoque Consultas Consulta Estoque Produto Alteração:\nAjustar produtos que constam em industrialização porém não existe nota vinculada.\n\nDocumentação:\nSuprimentos Estoque Consultas Consulta Estoque Produto Detalhamento:\nNada foi feito.\n\nObservação:\nSituação ocorre pois as notas foram encerradas pelo programa FATU111:\n\nNota fiscal de saída número 76174 está encerrada:\n\nE é esta nota que falta 0,0001 para receber: \nMas por ela estar encerrada, ela não aparece no ESTO7 para retornar ainda.\n\nE o mesmo acontece com a nota número 131092: "], "286-2": ["Gera Nota Fiscal de Saída Consignação (FATU119) — CONTROLE ESTA GERANDO COM A OPERAÇÃO ERRADA APÓS INFORMAR A MESMA NO FATU119", "Gera Nota Fiscal de Saída Consignação – FATU119.pdf", "Pedido Serviço: 60428 Cliente: Pegada Solicitação:\nCONTROLE ESTA GERANDO COM A OPERAÇÃO ERRADA APÓS INFORMAR A MESMA NO FATU119.\n\nRotina:\n\nVendas e Distribuição Faturamento Notas Fiscais\nGera Notas Fiscais Saída Consignação Alteração:\n\nOperação não esta sendo levada corretamente para o programa FATU2 quando a mesma é informada no programa FATU119.\n\nDocumentação:\n\nVendas e Distribuição Faturamento Notas Fiscais\nGera Notas Fiscais Saída Consignação Detalhamento:\nErro ajustado. \nApós selecionar o pedido ou algum item do pedido, se estiver configurado os filtros no programa \"Cadastro de Config.\nEspecial (FATU94)\", será sugerido a operação de venda cadastrada no programa.\n\nObservações:\nEste pedid"], "288-5": ["Gera Nota Fiscal T alão (FATU74) — knd rótulo, transferências de rótulos, produto vinculado", "Gera Nota Fiscal Rótulo - FATU74.pdf", "Pedido Serviço: 23661 Solicitação:\n\nROTINA:\n\nVendas e Distribuição Faturamento Notas Fiscais\nGera Notas Fiscais Rótulo ALTERAÇÃO:\n\n- Alterar programa de transferência para que permita realizar transferências de rótulos que possuam mais de um produto vinculado.\n\nDocumentação:\n\nRotina:\nManufatura\nEngenharia e Desenvolviment\n\npossuam mais de um produto vinculado.\n\nDocumentação:\n\nRotina:\nManufatura\nEngenharia e Desenvolvimento de Produto Cadastros Mensagens:\nKND-004064 - Rótulo \"(:A)\" inexistente.\nKND-004065 - Rótulo \"(:A)\" não se encontra em estoque na localização indicada.\nKND-004066 - O rótulo \"(:A)\" é parte integrante de um conjunto de rótulos, portanto, todo o conjunto será deletado.\nDeseja"], "288-10": ["Gera Nota Fiscal T alão (FATU74) — CARGUE DE PT EN KUNDEN Bom dia Davenir, [Imagem: FATU2]", "Gera Nota Fiscal Rótulo - FATU74.pdf", "De: Marcio Schneider [mailto:marcio@kunden.com.br]\nEnviada em: segunda-feira, 10 de agosto de 2020 09:41 Para: 'Davenir Hennemann'\nCc: 'Roberto Schumacher (Kunden Systems)'\nAssunto: RES: CARGUE DE PT EN KUNDEN Bom dia Davenir, \n\nDeu para evoluirmos aqui internamente em mais alguns testes, mudando algumas configurações, e entendo que\nficou melhor agora para a parte do controle de Chão de Fabrica, a questão de transferir da Bodega Producto\nTerminado en Planta de Produccion, para a Bodega Producto Terminado en Despacho\n\nNeste programa conseguimos fazer a leitura do “Rotulo”...ao clicar no botão “Gerar NF”...\n\n...já gera dados neste programa, que é uma factura de Transferencia...  \n...e que daí "], "288-16": ["Gera Nota Fiscal T alão (FATU74) — Atta_nova rotina Geração NFS Transferência pelo FATU74 sem integrar com Estoque", "Gera Nota Fiscal Rótulo - FATU74.pdf", "Atta_nova rotina Geração NFS Transferência pelo FATU74 sem integrar com Estoque\nAlteração no processo de Geração de Nota Fiscal de Transferência no programa FATU74 sem integrar com Estoque.\nPedido 70060, original\nPedido 70977, ajuste do 70060.\n\nEntrou no ar agora, 090726, pós atualização do extrapatch destes Pedidos Serviço.\n\nTreinamento realizado e gravado em:\nhttps://kundencloud.sharepoint.com/sites/KundenAmbienteOficial/Treinamento/Forms/AllItems.aspx?id=%2Fsites %2FKundenAmbienteOficial%2FTreinamento%2FPassagem%20de%20clientes%2FATTA&viewid=525f9fc9%2Dc4cc% 2D423b%2D931b%2D27c7151dc578&TeamsCID=e68efd06%2Db977%2D42d8%2Da664%2D38eafe8378b6\n\nTópicos visto no Treinamento:\n\nExemplo de Produt"], "292-8": ["CFOP ATRIBUÍDA ESTÁ INCORRETA Rotina (FATU124) — cadastro da pessoa, ultimo check box, traz as nfs", "Importação de Notas Fiscais de Entrada por XML - FATU124.pdf", "Fluxo da Rotina de “Importação de Notas Fiscais de Entrada por XML”, de acordo com o acompanhado na\nimplantação da Smart, em 042021:\n\n1º: no programa Monitor – FATU61: necessário “importar” do Sefaz os dados das NFs dos Fornecedores emitidas conta a empresa.\nUtilizar esta seleção...\nObs.: sugestão: deixar desmarcado ultimo check box...porque cfe recomendação no campo, pode deixar lento a\nbusca...e cfe visto com Ismael, no dia a dia não necessário.\nObs: este procedimento poderá ser feito, mesmo não tendo o cadastro da Pessoa ainda feito no Kunden ERP (o\ncadastro da Pessoa pode ser feito depois, quando estiver sendo feito os vínculos de Pessoa no FATU124).\nEste primeiro procedimento acima, de "], "292-18": ["CFOP ATRIBUÍDA ESTÁ INCORRETA Rotina (FATU124) — Caminhos configurados das pastas, na Smart (visto em 250621)", "Importação de Notas Fiscais de Entrada por XML - FATU124.pdf", " \nCaminhos configurados das pastas, na Smart (visto em 250621):\n\nD:\\Kunden_ERP\\SMG\\Documentos\\FATU\\EMPRESA1\\MDE\\DOWNLOAD\\ D:\\Kunden_ERP\\SMG\\Documentos\\FATU\\EMPRESA1\\MDE\\PROCESSADOS\\"], "292-35": ["CFOP ATRIBUÍDA ESTÁ INCORRETA Rotina (FATU124) — CRIAR NOVOS PARÂMETROS DE INICIALIZAÇÃO E REVISAR PROGRAMA FATU124 Rotina", "Importação de Notas Fiscais de Entrada por XML - FATU124.pdf", "Pedido Serviço: 62680 Cliente: AKS Solicitação:\nCRIAR NOVOS PARÂMETROS DE INICIALIZAÇÃO E REVISAR PROGRAMA FATU124 Rotina:\n\nSuprimentos Recebimento Notas Fiscais\nImportação de Notas Fiscais de Entrada por XML Alteração:\n1- Criar novos parâmetros de inicialização para definir: empresa, unidade de negócio, localização, pasta e pasta importados.\n2- Revisar as abas ¿Notas Fiscais¿, ¿Vínculos¿ e ¿Log¿, deverá trazer as informações em função da empresa selecionada.\n3- Campos dos filtros na aba ¿Importação¿ também deverão trazer apenas informações em função da empresa.\n\nDocumentação:\n\nSuprimentos Recebimento Notas Fiscais\nImportação de Notas Fiscais de Entrada por XML Parâmetro Inicialização:\nEMPRE"], "305-6": ["Agora está dando a mensagem KND-001039 abaixo, ao tentar confirmar uma “Reversion Factura…", "Notas Fiscais_situações em rotinas em espanhol.pdf", "De: Marcio Reni Schneider (Kunden Systems)\nEnviada em: sexta-feira, 17 de maio de 2013 07:00\nPara: 'Diego Barbieri (Kunden Systems)'\nAssunto: Agora está dando a mensagem KND-001039 abaixo, ao tentar confirmar uma “Reversion Factura Salida”.\n\nBom dia Diego,\n\nAgora está dando a mensagem abaixo KND-001039, ao tentar confirmar uma “Reversion Factura Salida”.\n\nMuito provável é porque de fato já tem movimentos para estes produtos no dia 16/05.\n\nEntão minha pergunta:\n-como não posso nem excluir este lançamento de “Reversion Factura Salida” porque o sistema não deixa e se\ndeixasse iria perder os links com demais rotinas, posso tentar fazer um UPDATE nesta Data de Entrada para ver se aí passa a confi"], "308-0": ["Usuários (ADMI1) — PDV: Treinamento – Meat House 1", "PDV_Treinamento – Meat House.pdf", "PDV: Treinamento – Meat House 1\n(Treinamento feito por Deise, em 011021)..\nInformações Básicas:\nLink BD desenv.: http://192.168.20.239:8080/desenvv4/f?p=1667:LOGIN_DESKTOP:29888276493960:::::\nUsuário configurado Kunden/Senha: KUNDEN PDV/123 Configurações Gerais:\nADMI1 - Usuários\nPara que o usuário possa utilizar o PDV é necessário que o check-box \"Kunden PDV\" esteja marcado na aba WEB do programa,\na senha utilizada também é cadastrada nesta aba.\n\nVEND2 - Lista de Preço\nPara que os produtos sejam disponibilizados à venda no PDV, é necessário criar uma lista de preço e habilitar a \"Venda PDV\"\npara “Sim” (na nova aba \"Kunden PDV”).\nIMPORTANTE: atualmente, somente 1 lista de preço sobe para a ap"], "308-2": ["Condições de Pagamento (ADMI19) — treinamento meat house, forma de pagamento, vendas em dinheiro", "PDV_Treinamento – Meat House.pdf", "Botão Fluxo de Caixa: exibe os movimentos das operações de caixa.\nEsta tela sofrerá grandes modificações. Terão 3 visões novas: resumo das vendas, controle de caixa (vendas em dinheiro) e\ncontrole cartão. Para possibilitar o correto fechamento de caixa. Atualmente, está tudo junto: incorreto.\n\nPDV: Treinamento – Meat House 8\nPara a inserção de itens existem três componentes envolvidos:\n\n- Campo QTD: indica quantos itens de uma determinada etiqueta devem ser registrados;\n- Campo Código de Barras: Que está preparado para leitura de códigos EAN13 (campo Cód. de Barras do EPRO15 = 13\ndígitos) e dos códigos de barras dos lotes (14 dígitos), cuja etiqueta foi desenvolvida no pedido 51608 (do Rober"], "310-2": ["Plano de Necessidades de Compras (COMP13) — bahia lindolfo collor, ordem de industrialização, controla depósito", "Quarteirização_rotina.pdf", " Treinamento em 011116.\nMarcio, Wagner, Thomas, Caio, Gabriel Avaliado abaixo:\n- quando tem mais de um processo envolvido; exemplo corte/costura + pre-fabricado.\n- querem validação para não permitir fazer remessa de mat, quando já houve o retorno do terceirizado para o\nrespectivo serviço e OF.\n- ver motivo do campo “Pedido”, no programa ESTO25, Plano de Abastecimento Materiais remessa Industrialização.\n\nZzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz\n\nValidação do pedido: 19585 (por Wagner) ROTINA:\nLOGICA DE QUARTERIZAÇÃO (BAHIA - LINDOLFO COLLOR) OBJETOS:\nMensagens:\nVALIDAÇÃO:  \nObs.: a compra não precisa ter o vinculo das mesmas OFs terceirizadas...pode ser uma compra “livre” sem vinculo"], "310-7": ["ESTO1 — controle de depósito, criada a coluna, controla deposito", "Quarteirização_rotina.pdf", "Pedido Serviço: 19444 Solicitação:\n\nROTINA:\n\nManufatura Chão de Fabrica\nEngenharia e Desenvolvimento de Produto\nPlanejamento e Capacidade de Recursos Terceirizados Suprimentos Compras Estoque\nPlanejamento Necessidade de Materiais Abastecimento Recebimentos Vendas e Distribuição Faturamento Pedidos ALTERAÇÃO:\n\nDesenvolvimento e alterações necessárias em rotinas e programas para tratar o pr\n\nPedidos ALTERAÇÃO:\n\nDesenvolvimento e alterações necessárias em rotinas e programas para tratar o processo de quarteirização.\nDetalhamento conforme documentação anexa, arquivo 19444_PROJETO_ QUARTEIRIZAÇÃO_MALU_sem_Desenv_9_10.docx Documentação:\n\nCadastro de Operações do Estoque (ESTO1):\n\n- Criada a coluna"], "311-1": ["RECE35 — entrada na empresa, retorno dos materiais, produção das ofs", "Recebimento de Notas de Empresa do mesmo Grupo – RECE35.pdf", "Pedido Serviço: 10763 Cliente: BF\n\nROTINA NOVA PARA EFETUAR A GESTÃO DE TERCEIRIZAÇÃO/MOVIMENTAÇÃO DE MATERIAIS ENTRE EMPRESAS DO\nPROPRIO GRUPO, QUE EFETUARÃO A PRODUÇÃO SOB TERCEIRIZAÇÃO\n\nvisão macro das empresas:\n- Empresa principal: BFX. neste empresa será efetuada:\n- engenharia;\n- pedido de venda;\n- geração do Plano de Produção, OF e necessidades de materiais;\n- fará a gestão de materiais (compras, abastecimento e consumos);\n- faturamento;\n\n- Empresas que efetuarão a toda terceirização para a BFX: Wots e Logistica.\ncada uma destas 2 empresas fará parte dos processos necessários à produção dos calçados.\n\nvisão macro do fluxo a ser desenvolvido:\n- A partir da empresa BFX, efetuar a Remessa"], "311-2": ["RECE35 — RECEBIMENTO DE NOTAS DE EMPRESA DO MESMO GRUPO - AJUSTAR PARA MOSTRAR O REMETENTE REAL…", "Recebimento de Notas de Empresa do mesmo Grupo – RECE35.pdf", "Documentação:\n\n-------- Para utilizar a nova rotina\n- A primeira coisa a fazer, é configurar as operações que serão usadas(para as notas e requisições) para trabalhar com depósito disponível.\n\nO caminho que precisa ser seguido é o seguinte.\n\n- Fazer um pedido de venda, e após um plano de produção com este pedido, até aqui é normal.\n\n- A partir deste plano deve ser gerado uma remessa para industrialização.\n- Suprimentos -> Planejamento Necessidade de Materiais Abastecimento (MRP) - > Plano Abastecimento Materiais - Remessa Industrialização.\n\n- Com isso será gerado a nota, que deve ser recebida pelo programa RECE35 (Recebimento de Notas de Empresa do Mesmo Grupo).\n\n- Suprimentos -> Recebimento"], "327-3": ["Disponível (FATU110) — OPERAÇÕES (ESTOQUE) - ESTO1 - CRIAR ABA PARA CADASTRAR OS PARAMETROS DE RETORNO DE…", "Retorno de Industrialização Depósito Disponível – FATU110.pdf", "Pedido Serviço: 14092 Solicitação:\nOPERAÇÕES (ESTOQUE) - ESTO1 - CRIAR ABA PARA CADASTRAR OS PARAMETROS DE RETORNO DE INDUSTRIALIZAÇÃO\nCriar aba para cadastrar os parametros de Retorno de Industrialização, ou seja a CFOP que deverá ser sugerida no\nprograma FATU110 para geração da NF de retorno. Utilizar a mesma lógica da aba ESTORNO.\n\nDocumentação:\nRECEBIMENTO - CADASTRO DE OPERAÇÕES (RECE2)\n\n- Na aba Operações Vinculadas, foi criada a opção para vincular uma operação de retorno.\n\nRETORNO DE INDUSTRIALIZAÇÃO DEPÓSITO DISPONÍVEL (FATU110)\n\n- Este programa irá sugerir a operação vinculada na operação da nota fiscal de remessa."], "327-14": ["Disponível (FATU110) — parciais do bloco, retorno nos blocos, qtde de unidade", "Retorno de Industrialização Depósito Disponível – FATU110.pdf", "Pedido Serviço: 19195 e 19263 Solicitação:\n19195:\n\nROTINA:\n\nVendas e Distribuição Faturamento Notas Fiscais\nRetorno de Industrialização Depósito Disponível ALTERAÇÃO:\nSugerir as qtdes parciais de retorno nos blocos \"Matéria Prima\" e \"Nota Fiscal de Entrada\", de acordo com as qtdes\nparciais do bloco \"Ordem Fabricação\".\n\nAs quantidades parciais do Bloco \"Ordem de fabricação\" podem ser de acordo:\n- de acordo com as qtdes parciais produzidas até o momento;\n- de acordo com a qtde que o usuário poderá informar manualmente neste bloco.\n\nPorém estas qtdes parciais sugeridas para estes blocos \"Matéria Prima\" e \"Nota Fiscal de Entrada\" deverão ainda\npermitir alteração manual como é até o momento.\n\nImp"], "327-16": ["Disponível (FATU110) — (2º item de retorno = também 75 peças)", "Retorno de Industrialização Depósito Disponível – FATU110.pdf", "(2º item de retorno = também 75 peças):\n\nAlterei para estas qtdes:   3ª apontamento:   \nAqui OK...2º item de retorno = 19 peças 4º apontamento:  \n2º item de retorno = 10 peças (no bloco OF, são 20 peças)\n\nAqui, o teste de alteração da qtde manualmente como se comporta: está OK (apenas que, neste caso, não\nfunciona a questão de poder alterar a qtde de retorno...porque o procedimento de alterar a qtde no bloco “OF” e\ndepois clicar no check box de seleção, sempre recalcula a qtde dos blocos MP e NFE de acordo com a qtde do bloco OF).\n\nPara alterar manualmente a qtde do bloco OF (é a qtde a faturar):\nModificar a qtde primaria e secundaria...  \n...e depois clicar no check box do bloco OF...\nCom i"], "327-45": ["Disponível (FATU110) — Visto na Implantação Smart, em 270521", "Retorno de Industrialização Depósito Disponível – FATU110.pdf", " \nVisto na Implantação Smart, em 270521:\n\nSituação de, após selecionado a OF 443, trouxe estas qtdes:\nVeja que o retorno sugerido é de 99,90, sugerido pela mesma qtde do produto da OF (que será feito cobrança)...\n\n...apesar do abastecimento ser de 100,0000 ....  \n...motivo deve ser porque o ultimo processo não foi todo apontado (a qtde produzida deu a menos), e por isso o\nsistema entende que pode ter um complemento de produção)...se fosse curtume, temos o controle de unidades\nsecundarias, que definem que a OF está toda produzida, mesmo que tenha dado menos metragem (porem na Smart\nnão temos unidade secudaria no produto)...\n\n...feito finalização aqui para a OF ficar produzida...  \n...mesmo as"], "331-2": ["Retorno Remessas (RECE7) — ROTINA Suprimentos Recebimento Notas Fiscais Retorno Remessa Industrialização ALTERAÇÃO", "Retornos de Remessa Industrialização – RECE7.pdf", "Pedido Serviço: 27556 Solicitação:\nROTINA Suprimentos Recebimento Notas Fiscais Retorno Remessa Industrialização ALTERAÇÃO\n\n- Na rotina de triangulação de industrialização, no segundo retorno, item está vindo duplicado.\nPedido de compra gerado a partir do plano de necessidades: \nPara gerar a NF de saída   Primeiro retorno, ok:\n\nGerada a remessa triangular:  Ao gerar o\nsegundo retorno, o item é exibido 2 vezes:   Documentação:\nSuprimentos Recebimento Notas Fiscais Retorno Remessa Industrialização Detalhamento:\nNenhuma alteração foi realizada.\nConsiderando o contexto desse processo, deve-se configurar a opção \"Apropriação\" -> \"Estoque Industrialização\"\ncom o valor \"Sim\", na operação do item de"], "331-5": ["Retorno Remessas (RECE7) — programa de Remessa de Terceirização, já trazer automaticamente os dados", "Retornos de Remessa Industrialização – RECE7.pdf", "De: Isabel (Oksebra) [mailto:isabel@oksebra.com.br]\nEnviada em: segunda-feira, 26 de outubro de 2020 13:34\nPara: Marcio Schneider; Recepcao (Oksebra)\nAssunto: programa de Remessa de Terceirização, já trazer automaticamente os dados\n\nEstamos com a seguinte dúvida:\n\nA entra\n\nemessa de Terceirização, já trazer automaticamente os dados\n\nEstamos com a seguinte dúvida:\n\nA entrada do retorno das nf do atelier já devem ser apontadas pelo lançamento da nf o processo da costura externa (processo 2).\nCadastramos hoje pela manhã para que a emissão das notas fiscais já aponte o setor da costura interna (processo 7).\nPorém, a Cintia não estava conseguindo\nSalvar o lançamento desta nf 7921, acusava que o s"], "331-6": ["Retorno Remessas (RECE7) — programa de Remessa de Terceirização, já trazer automaticamente os dados Bom dia [Imagem:…", "Retornos de Remessa Industrialização – RECE7.pdf", "De: Marcio Schneider [mailto:marcio@kunden.com.br]\nEnviada em: terça-feira, 27 de outubro de 2020 06:52\nPara: 'Isabel (Oksebra)'; 'Recepcao (Oksebra)'\nAssunto: RES: programa de Remessa de Terceirização, já trazer automaticamente os dados Bom dia  \n-já identifiquei o motivo da rotina estar tentando apontar o processo 7 e não ter apontado o processo 2 (isso quando\nestão fazendo o Retorno da Terceirização no programa RECE7-Retorno de Remessa Terceirização)\nÉ porque estas 2 OFs, que saíram com a NF 26512, tiveram o Processo 7 vinculado na Remessa (deveria ter ocorrido\no vinculo do processo 2). Dá para ver pela tela abaixo (mas o certo teria sido o processo 2, porque o serviço 6002\ntem sim vincul"], "331-20": ["Retorno Remessas (RECE7) — PROGRAMA \"RETORNOS DE REMESSA-RECE7\": PASSAR A SUGERIR AS OPERAÇÕES PARA OS ITENS DA…", "Retornos de Remessa Industrialização – RECE7.pdf", "Pedido Serviço: 65769\nCliente: Kunden / VPS Solicitação:\nPROGRAMA \"RETORNOS DE REMESSA-RECE7\": PASSAR A SUGERIR AS OPERAÇÕES PARA OS ITENS DA CLASSE DE OPERAÇÕES \"RETORNO INDUSTRIALIZAÇÃO\" Rotina:\n\nSuprimentos Recebimento Notas Fiscais\nRetorno de Remessa Industrialização Alteração:\n\nPrograma \"Retornos de Remessa-RECE7\": passar a sugerir as operações para os itens da classe de operações\n\"Retorno Industrialização\" de acordo o programa \"Cadastro de Configuração Especial de Operações - Recebimentos- RECE32\".\n\nDocumentação:\n\nSuprimentos Recebimento Notas Fiscais\nRetorno de Remessa Industrialização Detalhamento:\nAjustada a rotina para que seja buscada primeiramente a operação de estoque cadastrada"], "335-3": ["CFAB11 — TIRAS FEITAS EM TERCEIRIZADOS Bom Dia Márcio,", "Rotina de Beneficiamento de Tiras.pdf", "De: José Leandro Wiest [mailto:jose.wiest@henrich.com.br]\nEnviada em: quarta-feira, 23 de setembro de 2020 08:11 Para: Marcio Schneider\nAssunto: RE: TIRAS FEITAS EM TERCEIRIZADOS Bom Dia Márcio,\n\nSobre as tiras feitas em terceiros, a Ivete já está cadastrando alguma coisa para a Schutz e Arezzo e está\nfuncionando, mas gostaria que você olhasse também pelo menos duas destas estruturas para comparar com a\nproposta que eu montei no banco de testes para ver o que é melhor e mais correto.\n\nNa proposta que ela montou, ela não está criando um semi-acabado (conjunto), ela está colocando um componente\ndo couro (em m²) e outro componente da tira pronta (em metros).\n\nOs modelos que estão abertos no ban"], "335-5": ["Posição Remessa/Retorno (TERC3) — Visita do dia 30/09/2020", "Rotina de Beneficiamento de Tiras.pdf", "De: Marcio Schneider [mailto:marcio@kunden.com.br]\nEnviada em: quinta-feira, 1 de outubro de 2020 04:57 Para: 'Marcio Schneider'\nAssunto: Visita do dia 30/09/2020\n\nVisita do dia 30/09/2020\nParticipantes: Jose Leandro Jose das Compras, Gelson\nAssuntos: revisão/avaliação de opções para controlar o serviço de virado de tiras e demais controles pertinentes ao tema.  \nIdeia final que será adotada:\n\n-Jose Leandro vai incluir o cadastro da “Tira Virada” na Lista de Material da Estruturação de Produto, como qualquer\noutra peça de couro/componente (será cadastrado itens Tiras semelhante a um material).\n\n-Também vai incluir o material necessário para a “Tira Virada”, no caso normalmente são couros em "], "336-27": ["COMP25 — qtd terc atm, descricao from pessoa, situação da pegada", "Rotina de Beneficiamento.pdf", "\nAvaliação da rotina envolvendo rotina Triangular, na qual a empresa compra de um Fornecedor, mas o Fornecedor\nentrega em outro Fornecedor...\nAvaliação em 032026, para uma situação da Pegada*, relatada no Pedido Serviço 70393...\n\nExemplo:\nAqui Pegada comprou do Fornecedor 274306, com NF 23...\n\n...mas o Fornecedor acima entregou para este aqui, NF 24... \n...aqui mostrando como ocorreu a movimentação...(neste caso deste exemplo, esta NF foi totalmente recebida)...veja\na NF selecionada/controlada é a 24... \n...aqui também ocorre o controle...(apenas é um exemplo...a NF 24 já retornou tudo...mas o controle é como na NF 55)...\n\n...nas tabelas, aqui está todo o controle:\nSELECT * FROM NFE_ITEM_ATM"], "338-4": ["COMP25 — categoria de compras, blue em terceiros, nota fiscal remessa", "Rotina de Controle de wet blue em terceiros.pdf", "Relatório Controle de Industrialização efetuada:  Xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx\n\nTestes realizados, utilizando a rotina de Recebimento “Triangular”.\n\nNo Recebimento (lançamento da NF de Entrada) da compra deste Wet Blue, utilizar o botão “Dados NF Triangular”\npara indicar em qual terceiro será entregue o material (tela 1 abaixo).\nPorém isso não atende a este controle de Wet Blue em terceiros, porque o sistema não reconhece o registro da NF\nno terceiro: não traz na Lista de Valores do campo “Nota Fiscal Remessa” do Pedido de Beneficiamento, cfe telas acima.\n\nVisto com Jean em 25062014:\n- para que isso seja possível: provável tem que a rotina de recebimento triangular, gerar para a ta"], "338-5": ["COMP25 — exigir remessa industrialização, blue em terceiros, controle de wet", "Rotina de Controle de wet blue em terceiros.pdf", "Agora aqui um teste na Pegada, criando uma Categoria com esta rotina “Exigir Remessa Industrialização”...\n\n...e de fato no Pedido de Beneficiamento, na lista de valores só traz NFs lançadas internamente e não NF de Recebimento Triangular...  \n...por exemplo não mostra na Lista acima esta NF Triangular que tem saldo*:\n\n*O que comprova a avaliação de 25062014 no .docx “Rotina de Controle de wet blue em terceiros.docx”  \n...e na listagem de NFs no Pedido de Compra, mostra este tipo de NF, feito a emissão diretamente no sistema, não sendo triangular:\n\nAgora novo teste...partindo desta outra NF de Saída e outro Produto, feito a emissão direta\n\nngular:\n\nAgora novo teste...partindo desta outra NF d"], "342-1": ["Transferências (FATU12) — TRANSFERÊNCIAS RECEBIMENTO - TRATAR RESERVAS (AO LANÇAR O RECEBIMENTO DE…", "Transferencia (Recebimento) - FATU12.pdf", "Pedido Serviço: 10873 Solicitação:\nTRANSFERÊNCIAS RECEBIMENTO - TRATAR RESERVAS (AO LANÇAR O RECEBIMENTO DE TRANSF.COMRESERVA,\nDEVERÁ ENTRAR NO ESTOQUE DESTINO COMO RESERVADO Transferências Recebimento.\n\nQUando remessar teve origem em reservas, na entrada o estoque também deverá ficr reservado.\natualmente está ficando como disponível.\n\nDocumentação:\nPLANO ABASTECIMENTO MATERIAIS - TRANFERÊNCIA PARA PRODUÇÃO (ESTO25)\n\nAo validar o parâmetro de inicialização OPERACAO_NF_TRANS, irá permitir operações de classe \"ESTO\" e \"FATU\".\nAnteriormente, permitia somente classe \"ESTO\".\n\nFoi realizada ruebas 205 (y después así que se actualizar la BD Producción) Buenos dias,\n\nPlaneación, a partir de los patchs actualizados, en la BD de Pruebas 205 (y después así que se actualizar la BD Producción):\n\nEs necesario que revisen el catalogo “Calendario Recursos” (está en Manufactura / CRP / Catastros).\n\nEl turno debe ser vinculado en solamente uno de los niveles de la estructura.\n\nHoy, en sus catálogos, lo tienen informado en el nivel de Recurso, de Recurso Base Pla"], "343-102": ["Planejamento (MPSP2) — atualiza meta planejamento, ficha de operaciones, recursos processos processos", "Planejamento_rotina e dados gerais - MPSP2.pdf", "  Pedido Serviço: 19980 Solicitação:\n\nROTINA:\n\nManufatura\nPlanejamento Capacidade de Recursos Processos Processos ALTERAÇÃO:\n\n- Criar um parâmetro no programa PREC7 que possibilite atualizar a meta no planejamento quando ela seja alterada\nna ficha de operações.\nNome do parâmetro: ATUALIZA_META_PLANEJAMENTO\nNão = Valor Padrão.\nSim = Se tem meta informada na carga do recurso do planejamento mantem a informada, caso contrario atualiza o\nplanejamento com a nova meta informada na ficha de operações.\n\nObservação: Após alterar a meta, os planos devem ser atualizados no planejamento para que calculem com a meta nova.\n\nRUTINA:\n\nManufactura\nPlanificación Capacidade de Recursos Processos Processos ALTE"], "343-174": ["Planejamento (MPSP2) — Planejamento- MPSP2: Passar a considerar as configurações/cadastro do programa…", "Planejamento_rotina e dados gerais - MPSP2.pdf", "Pedido Serviço: 53786 Cliente: Duramas Solicitação:\nPlanejamento- MPSP2: Passar a considerar as configurações/cadastro do programa ¿Configurador de\nMeta/Eficiência Prevista por Recurso-PREC33¿ Documentação:\nManufatura\nPlano Mestre de Produção (MPS)\nPlano Mestre de Produção Planejamento Parâmetro Inicialização:\nBUSCAR_DADOS_PREC33 | DEFINE SE AO EFETUAR O PROCEDIMENTO \"ATUALIZAR CONSOLIDADA\", OS DADOS DE\n\"PESSOAS\" E \"EFICIÊNCIA\" SERÃO BUSCADOS DO PROGRAMA PREC33.\n\nDetalhamento:\nCriado o parâmetro de inicialização BUSCAR_DADOS_PREC33 que define se a opção \"Atualizar Consolidada\" do\nMPSP2 (Planejamento) irá considerar os dados de eficiência e pessoas balanceadas caso estejam cadastrados no\nprog"], "344-13": ["CFAB11 — Fluxo da rotina de formulas de acabamento", "Ordem de Fabricação_Geração e Abastecimento - MPSP46_ate pagina 100.pdf", "Fluxo da rotina de formulas de acabamento:\n- permite alterar a qtde a ser gerada...\n- permite informar uma qtde de “Aproveitamento...”\nBaixar os materiais necessários para a formula a partir do botão “Materiais”...\n\nEsta baixa poderá ser visualizada no programa ESTO25, e a partir do ESTO25 poderá ser excluída esta baixa.\n\nA partir do botão de impressão permite imprimir a formula...\nSó não permite a partir da Visualização, porque tem um controle de “Reimpressão”, que o sistema imprime\nautomática “Reimpressão” quando é impresso a OF a partir do programa normal de Emissão de OFs. \nFazer o procedimento de apontamento da OF (que vai gerar a tinta para o estoque) \n\nDepois de dar o OK na mensagem K"], "344-19": ["Estruturação de Produto (EPRO15) — fiz o apontamento, pesagem, mostrado de maneira", "Ordem de Fabricação_Geração e Abastecimento - MPSP46_ate pagina 100.pdf", "FUNCIONAMENTO DA ROTINA DO PROGRAMA, NAS ALTERAÇÕES, INCLUSÕES E EXCLUSÕES DA LISTA DE\nMATERIAIS DA ESTRTUTURAÇÃO DE PRODUTO, E COMO A ROTINA PROCEDE:\n\nEM RESUMO:\nASSIM QUE ALTERADO NA LISTA DE MATERIAIS, NA UTILIZAÇÃO DO PROGRAMA JÁ TRAZ ALTERADO ONLINE, NÃO\nPRECISANDO “ATUALIZAR MRP” NEM FAZER O APONTAMENTO DO PROCESSO QUE TEM A “PESAGEM” PARA QUE OS\nMATERIAIS E SUAS QTDES ESTEJAM ATUALIZADOS CONFORME A ALTERAÇÃO NA LISTA DE MATERIAIS.\nOU SEJA,\nO PROGRAMA BUSCA A INFORMAÇÃO DIRETAMENTE DA LISTA DE MATERIAIS, NÃO DE UMA TABELA QUE TENHA\nGRAVADO AS NECESSIDADES A PARTIR DE UMA GERAÇÃO COMO O PLANO DE PRODUÇÃO OU A PESAGEM.\n\nTestes na rotina de geração de formulas/pesagem (item 1 acima)\nTeste"], "344-38": ["Estruturação de Produto (EPRO15) — ORDEM FABRICACAO - GERACAO ABASTECIMENTO - MPSP46 - QDO UMA FORMULA TIVER UMA FORMULA NA…", "Ordem de Fabricação_Geração e Abastecimento - MPSP46_ate pagina 100.pdf", "1=Pedido Serviço: 14772 (Nimo) Solicitação:\nORDEM FABRICACAO - GERACAO ABASTECIMENTO - MPSP46 - QDO UMA FORMULA TIVER UMA FORMULA NA LISTA\nDE MATERIAIS IMPRIMIR OS PRODUTOS DA FORMULA NA ORDEM CERTA DO CADASTRO\n\nQDO CADASTRADA NA LISTA DE MATERIAIS UMA FORMULA (DEMONIMODADA MATIZ) DENTRO DE UMA FORMULA\nAO LISTAR ESTA FORMULA LISTAR A MESMA NA MESMA ORDEM QUE ESTA NO CADASTRO.\n\nNO MERCADO DE CURTUMES DENOMINAMOS ESTAS FORMULAS QUE ESTÃO DENTRO DAS FOR\n\nEM QUE ESTA NO CADASTRO.\n\nNO MERCADO DE CURTUMES DENOMINAMOS ESTAS FORMULAS QUE ESTÃO DENTRO DAS FORMULAS DE MATIZES\n\nCONFORME CONVERSAMOS JAN, SUGIRO COLOCARMOS NO PARAMETRO DE INICIALIZAÇÃO QUAIS AS\nCATEGORIAS DE PRODUTOS PODEM SER VINCULADOS"], "344-44": ["ESTO81 — ORDEM DE FABRICAÇÃO - GERAÇÃO E ABASTECIMENTO: CRIAR NOVA VERSÃO DE IMPRESSÃO DE…", "Ordem de Fabricação_Geração e Abastecimento - MPSP46_ate pagina 100.pdf", "Pedido Serviço: 16603 Cliente: Wellour Solicitação:\nORDEM DE FABRICAÇÃO - GERAÇÃO E ABASTECIMENTO: CRIAR NOVA VERSÃO DE IMPRESSÃO DE RELATÓRIO,\nAGREGAR FUNCIONALIDADE NO CADASTRO DE ESPECIFICAÇÕES TÉCNICAS ROTINA:\n Manufatura\nPlano Mestre de Produção (MPS)\nPlano Mestre de Produção\nOrdem de Fabricação - Geração e Abastecimento ALTERAÇÃO:\nCriar nova versão de impressão do relatório de Formulações.\nBase: versão ESTO81\nNo Cabeçalho imprimir os campos:\nData de Emissão e numero da pagina\nEmpresa e Unidade Negocio\nFormula: conteúdo idem versão ESTO81\nProcesso: Processo ao qual está vinculado o produto da \"Formula\"\nProduto: conteúdo idem versão ESTO81\nÀ direita, em campo destacado: descritivo do Rec"], "344-56": ["Remessa Industrialização (ESTO25) — plano de abastecimento, indevidamente as qtdes, mensagem ao usuário", "Ordem de Fabricação_Geração e Abastecimento - MPSP46_ate pagina 100.pdf", "Pedido Serviço: 18684 Cliente: Nimo ROTINA:\n\nManufatura\nPlano Mestre de Produção (MPS)\nPlano Mestre de Produção  \nOrdem de Fabricação - Geração e Abastecimento ALTERAÇÃO:\nCriar validação que não permita duplicar, indevidamente, as qtdes de formulação (campo Quantidade).\nQuando tentar ocorre esta situação, abortar e dar mensagem ao usuário, algo como: Mensagem KND-003620:\n\"Geração de Plano de Abastecimento não permitida, devido tentativa de duplicação das qtdes dos materiais (Pedido Serviço 18684).\" Documentação:\n\nFoi criado no programa Ordem de Fabricação - Geração e Abastecimento (MPSP46) uma tranca (mensagem\nKND-003620) para não inserir materiais duplicados ao gerar o plano de abasteciment"], "344-59": ["CFAB11 — campos: OF, Recurso, Misturas, Apontar/Baixar Produtos, Materiais (a", "Ordem de Fabricação_Geração e Abastecimento - MPSP46_ate pagina 100.pdf", "Nova opção para o procedimento de \"Apontar/Baixar Produtos\" (atualmente feito na tela \"Monitoramento\"):\nDetalhamento no anexo.\n\nDocumentação:\nO programa Estruturação do Produto (EPRO15) foi alterado para permitir informar a quantidade de perda por recurso.\nO programa Ordem de Fabricação - Geração e Abastecimento (MPSP46) recebeu as seguintes alterações:\n- Na tela de filtros, foi adicionado o filtro de Recurso, que será aplicado apenas sobre o planejamento, portanto, ao\nutilizar este filtro, todas as ordens de fabricação que não estiverem planejadas serão descartadas.\n- Na aba \"OF\" foi adicionado o campo \"Recurso\", permitindo vincular e calcular a quantidade de perda de acordo com seu recurso"], "344-67": ["ADMI229 — atm requisicao lcto, neces prod alteracao, where codigo codigo", "Ordem de Fabricação_Geração e Abastecimento - MPSP46_ate pagina 100.pdf", "osterior quais as alterações efetuadas no programa MPSP46... \nAqui um select de Cristiano que mostra dados da tabela envolvida acima:\n[11:20:35] Cristiano Andres: SELECT * FROM NECES_PROD_ALTERACAO_ATM WHERE NECES_PROD_ID IN (SELECT ID\nFROM NECES_PROD_ATM WHERE OF_ID IN (SELECT ID FROM OF_ATM WHERE CODIGO = '&CODIGO_OF'));\n\nAqui orientação de Cristiano em quais tabelas colocar LOG\n[11:24:24] Cristiano Andres: NECES_PROD_ALTERACAO_ATM MEDICAO_GTB_ATM MEDICAO_NECES_AGRUP_GTB_ATM\n\n(Além do mais, penso ser importante colocar também nas 2 tabelas:\n-NECES_PROD_ATM\n-PRODUTO_MATERIAL_ATM (já está listada abaixo na tela)\nIsso porque, conforme mais abaixo, a tabela que faz trazer as formulas na aba “O"], "345-12": ["CFAB182 — /Krumenauer...referente a consumos", "Ordem de Fabricação_Geração e Abastecimento - MPSP46_ate pagina final.pdf", "/Krumenauer...referente a consumos\nadicionais/acréscimos e posteriores ao consumo inicial da fórmula:\n\n“Quanto à segunda forma que exemplificou (pela Solicitação + ESTO25), achei o processo um tanto burocrático, visto\nque o consumo é feito diretamente pelos pesadores de PQ, são usuários mais limitados para o uso do sistema.\nEntão este procedimento de gerar a necessidade, informar OF , incluir materiais, ...... para só depois consumir, se\ntornaria muito pouco prático para a rotina do setor.\n\nE utilizando o MPSP46, como é a forma de fazer?\nNão sou familiarizado com este programa, e não consegui adicionar linhas ou produtos...\nSeria o ideal utilizar esta mesma tela que pesadores já estão abitua"], "345-15": ["Programas (ADMI6) — campos: OF, Quantidade, Considerar Medição Atualização MRP, Medição, FATOR", "Ordem de Fabricação_Geração e Abastecimento - MPSP46_ate pagina final.pdf", "Marcio, 070525: em testes na Implantação da Couros Hidro...\n...para identificar, no programa MPSP46, aba “OF” campo “Quantidade”, qual a rotina que atualiza esta “Quantidade”:  \n...isso ocorre com esta configuração, no programa “Estruturação de Produtos – Abastecimento-EPRO59”, campo\n“Considerar Medição Atualização MRP”...\n\n(também não sei se, a configuração abaixo seja necessário...no caso, para este teste aqui, deixei configurado assim):  \nEntão, fiz o apontamento no programa ESTO112, com estes parâmetros: \n...e aqui tendo efetuado o consumo: fiz assim:\n\n...o que fez atualizar desta maneira a OF e o campo “Medição”:  \n...e com isso, conforme citado acima, aqui no MPSP46, atualizou o campo "], "345-18": ["Cópia de Ordem de Fabricação (CFAB59) — exclusão do abastecimento, usados deste lote, tive que desfazer", "Ordem de Fabricação_Geração e Abastecimento - MPSP46_ate pagina final.pdf", " \nHidro_situação em 040925 em que foi necessário excluir o abastecimento WB que havia sido feito no ESTO112:\n-A necessidade porque utilizar de um Lote “errado” = porque na pratica este Lote teve que ser devolvido ao\nFornecedor através de uma NF de Saída...e na NF de Saída houve a validação do sistema que não permite a\nDevolução de outros Lotes que não sejam dos Lotes da Compra...\n...então, tive que desfazer o consumo destes Lotes abaixo (porque fisicamente não foram usados deste Lote para\nfazer o consumo, tanto é, que foi devolvido fisicamente este Lote/esta NF de Entrada)\n\nEstava assim antes da Exclusão do abastecimento...este era o movimento...estas tela abaixo é antes da Exclusão deste ab"], "345-19": ["Cópia de Ordem de Fabricação (CFAB59) — processos e auxiliares, prod alteracao atm, where numero plano", "Ordem de Fabricação_Geração e Abastecimento - MPSP46_ate pagina final.pdf", "Hidro_situação em 092025, em que determinado item da Lista de Material da Fórmula, no caso o “Material” 4-\nCORANTES (que não é exatamente um “Material”, mas sim um dos “Materiais” PROCESSOS E AUXILIARES (como\nAgua, Esgotar,...)...no caso, PROCESSOS E AUXILIARES = é uma Categoria específica para estes cadastros...  \n...na qual num “Plano Abastecimento” a rotina não respeitava a “exclusão” ou “substituição” deste “Material” 4-\nCORANTES por um outro Código de Material...\n...O que acontecia:\n-Em reconsultas do Plano Abastecimento que teve alterações neste “Material” 4- CORANTES, as “exclusão” ou\n“substituição” não ficavam efetivadas no Plano Abastecimento: sempre “voltava” o mesmo “Material” 4- "], "345-20": ["Relatório Posição Plano de Produção (CFAB24) — corantes, atm where material, alteramos o insumo", "Ordem de Fabricação_Geração e Abastecimento - MPSP46_ate pagina final.pdf", "zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz\nO abaixo foi realizado por Alexis, em extensão ao acima:\nAlterando a fórmula conforme solicitado pelo Sr. Marcio.\n\nHoje a fórmula tem os corantes assim: \nExcluímos parte dos corantes (cfe acordado com equipe Hidro) e ajustamos os insumos dos corantes que ficaram.\n\nReconsultando na fórmula.   Pedido para teste.   Antes das alterações. \nO primeiro corante alteramos para outro código e insumo e o segundo excluímos.\n\nSalvar e gerar o plano.  Gerar relatório. \n\nVoltamos e reconsultamos aqui.\n\nAlterações ficaram salvas. \n\nReconsulta voltando da aba seleção. Alterações são ficaram salvas.\n\nApaguei o teste acima no Cliente zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz\n\nVerific"], "345-26": ["Estruturação de Produto (EPRO15) — acessando de novo, veja que ficou, materiais no check", "Ordem de Fabricação_Geração e Abastecimento - MPSP46_ate pagina final.pdf", "No voltar da tela acima, veja que o sistema atualizou OK o campo “Status” com BAIXADO:  ZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZ\nAqui mais um teste feito, com mesmo procedimento acima, porém com mais OFs = 2 OFs: aqui selecionando 2 novas OFs...\n\n...Na próxima tela preenchido o Recurso e gerado o “Plano Abastecimento” e Voltado... \nDepois, acessando de novo este Plano de Abastecimento, selecionado e clicado no botão “Materiais”...\n\n....dentro do botão e na aba “Materiais”, selecionado os Materiais no check box da direita, clicando no botão\n“Baixar” e “Confirmar” da tela abaixo: o programa retornou que as Baixas foram efetuadas...  \n...no “Voltar” para a aba OF: veja que ficou com o campo “Status” "], "346-3": ["Apontamento Rótulos (CFAB134) — gerado a mensagem, validações são feitas, sucesso serão descelecionados", "Apontamento de Rótulos Completo – CFAB134.pdf", "Quando efetuado o procedimento de Confirmar, e existem alguns registros que não atendem, e vão gerar erro de Validação:\nGerou esta mensagem KND-000249:\n\nDando OK e fechando o programa...\n\n...a rotina “pára” de efetuar o processamento no registro que gerou a mensagem KND-000249: neste caso, poderia\nser desmarcado esta leitura, para seguir com demais processamentos (ver a documentação do pedido serviço, que é\nassim: Após a leitura, é possível selecioná-los um a um para então confirmar o apontamento dos selecionados. As\nvalidações são feitas registro a registro, portanto, se ocorrer erro no processo, este registro ficará selecionado e a\nmensagem de erro KND-000249 será exibida, mas os rótulos s"], "346-4": ["Apontamento Rótulos (CFAB134) — leitura de caixa, apontamento e faturamento, corretamente a qtde", "Apontamento de Rótulos Completo – CFAB134.pdf", "Conferindo, está OK o apontamento deste Pedido/Plano de Produção:   zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz Testando esta condição:\nTestar faturamento em pedidos separados...\n\nOu seja:\nCriar 3 pedidos , com 3 caixas cada...(pode colocar no mesmo Plano de Produção)\nApontar completo os 3 pedidos.\n\nIr no programa PEDI4 e ver como vai se comportar para faturamento, fazendo pedido\n\nto os 3 pedidos.\n\nIr no programa PEDI4 e ver como vai se comportar para faturamento, fazendo pedido a pedido...\nOlhar principalmente a parte de volumes\n\nTeste realizado...1º: efetuado a leitura de 1 caixa de cada pedido, ficou assim as qtdes lidas:  Aqui OK:  \nSelecionando só 1 pedido para faturar: gera esta"], "349-6": ["Configurador de Produto (EPRO28) — CÁLCULO PREÇO DE VENDA - FVEN5 - CRIAR CAMPO PARA DEFINIR DATA DE TARIFA A SER UTILIZADA…", "Aprovação de Produto para Cálculo de Custos - EPRO28.pdf", "Pedido Serviço: 42741 Cliente: Pegada Solicitação:\nCÁLCULO PREÇO DE VENDA - FVEN5 - CRIAR CAMPO PARA DEFINIR DATA DE TARIFA A SER UTILIZADA NO CÁLCULO Rotina:\n\nVendas e Distribuição\nFormação de Preço de Venda\nCálculo Preço de Venda Alteração:\n\nCliente solicita que seja criado um campo para definir a data tarifa que será utilizada no cálculo formação preço de venda.\n\nDocumentação:\nVendas e Distribuição\nFormação Preço de Venda\nAprovação de Produto para Cálculo de Custos Detalhamento;\n- Criado um novo campo, \"Data Tarifa\", para poder ser informada a data desejada para busca das tarifas.\n\nVendas e Distribuição\nFormação Preço de Venda\nCálculo Preço de Venda Detalhamento:\n- Criado um novo campo, \""], "349-8": ["Configurador de Produto (EPRO28) — nível do produto, níveis da estrutura, cálculo de custos", "Aprovação de Produto para Cálculo de Custos - EPRO28.pdf", "Erro em 250422, para testes FPV do Henrich...ocorreu depois de dar um F7, colocar o produto 89547.1 e em seguida\nF8, gerou mensagem de erro “Código de erro 99999- Error 7343 occurred. See the release notes file (relnotes) for\ninformation about this error..”...\n...neste caso foi porque o produto pesquisado, 89547.1, não fazia parte deste parâmetro de inicialização CATEGORIA...\nOu seja, tentou-se pesquisar algo, mas este registro não fazia parte do parâmetro do programa...\n\nZzzzzzzzzzzzzzzzzzzzzzzzz\n\nExtensão do acima, situação semelhante em 180424, na implantação da VPS...\nSó que neste caso não trazia nada abaixo do nível do Produto Acabado, que deveria ser calculado...  \nDetalhe: neste caso "], "350-3": ["Atualizar MRP (MPSP33) — QUANDO ALTERADA A DATA DE VALIDADE FINAL DE UM MATERIAL E SE CRIA UM NOVO, AO ATUALIZAR O…", "Atualizar MRP - MPSP33.pdf", "Pedido Serviço: 64210 Cliente: Pegada Solicitação:\nQUANDO ALTERADA A DATA DE VALIDADE FINAL DE UM MATERIAL E SE CRIA UM NOVO, AO ATUALIZAR O MRP DE\nUM PLANO COM UMA DATA DE CADASTRO ANTERIOR, OCORRE A EXCLUSÃO INDEVIDA DAS NECESSIDADES.\n\nRotina:\n\nUM PLANO COM UMA DATA DE CADASTRO ANTERIOR, OCORRE A EXCLUSÃO INDEVIDA DAS NECESSIDADES.\n\nRotina:\n\nManufatura\nPlano mestre de
