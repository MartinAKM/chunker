dex-clipboard-1c880e70-9df2-4e0f-b039-71c598e4d3f3.png\nPrint 044 - codex-clipboard-2b36762d-c158-4a91-87b0-073c01b4c75b.png\n<b>Leitura tecnica:<\/b> Filtro ADMI102 com ambas situacoes de fatura. Apoio para comparar conhecimentos com e sem DOCCOB. Caminho original: C:\\Users\\GuilhermeNosch"], "88-25": ["ADMI96 — users guilhermenoschang appdata, local temp codex-clipboard, handoff tecnico fretes", "Handoff_Tecnico_Fretes_Kunden_CONEMB_DOCCOB_LIMPO.pdf", "Handoff Tecnico Fretes Kunden ERP - 22/07/2026 Pagina 57\nPrint 101 - codex-clipboard-7f6ffc4b-b2d1-4c40-880a-78e30196dad6.png\n<b>Leitura tecnica:<\/b> Erro ADMI96 em CONEMB Expresso Sao Miguel:\nBUSCA_ROTA_TRANSPORTE_P.FORMULA_CALCULO com ORA-06502 e ORA-01403. Inicio da causa raiz atual.\nCaminho original: C:\\Users\\GuilhermeNoschang\\AppData\\Local\\Temp\\codex-clipboard-7f6ffc4b-b2d1-4c40-880a-78e30196dad6.png\nPrint 102 - codex-clipboard-b49953a9-16a3-402f-bbdf-32e576f4ec12.png\n<b>Leitura tecnica:<\/b> Select com bind :frete_rota_id e erro em FORMULA_ID por coluna inexistente. Mostrou\nnecessidade de validar schema antes de montar joins.\nCaminho original: C:\\Users\\GuilhermeNoschang\\AppData\\Local\\Te"], "89-6": ["Administração Cadastros Parâmetros (ADMI8) — validação para que no apontamento de produção a rotina valide e confira se foi feito o…", "Apontamento de Produção_e_ Apontamento Rotulos.pdf", "De: Marcio Schneider [mailto:marcio@kunden.com.br]\nEnviada em: quarta-feira, 21 de outubro de 2020 06:53\nPara: 'Davenir Lisandro Hennemann'\nAssunto: validação para que no apontamento de produção a rotina valide e confira se foi feito o abastecimento Só para recordar:\n-conforme solicitaram, ativei validação para que no apontamento de produção a rotina valide e confira se foi feito o\nabastecimento dos materiais necessários e vinculados ao Processo que está sendo apontado.\n\nDeixei configurado conforme a tela abaixo:\n-veja que deixei de tolerância 0,0001%, ou seja, deixei uma tolerância mínima, praticamente tolerância zero, o que\nvai obrigar a ter o abastecimento total feito...e informei isso no"], "89-7": ["ADMI111 — Parâmetro 101 (LIBERAÇÃO AUTOMÁTICA APÓS APONTAMENTO DOS RÓTULOS)", "Apontamento de Produção_e_ Apontamento Rotulos.pdf", "Parâmetro 101 (LIBERAÇÃO AUTOMÁTICA APÓS APONTAMENTO DOS RÓTULOS):\n\nLiberação automática ocorre apenas para quando for apontamento de rótulos (não Apontamento de OF)\nOpção E ou P (LIBERA AUTOMATICAMENTE APÓS PRODUÇÃO DA ENTREGA OU DO PEDIDO) \nNa Brisa, para que não ocorra automaticamente, foi configurado o seguinte:\nPrograma Classificação do Produto (no CEP), que é verificado quando utilizado o programa Revisão, foi desmarcado a opção “Libera Faturamento”."], "89-13": ["APONTAMENTO DE OF: DESENVOLVER ROTINA PARA EFETUAR ENTRADA DE MAIS DE UM PRODUTO PRONTO…", "Apontamento de Produção_e_ Apontamento Rotulos.pdf", "Pedido Serviço 5993:\n\nSolicitação:\nAPONTAMENTO DE OF: DESENVOLVER ROTINA PARA EFETUAR ENTRADA DE MAIS DE UM PRODUTO PRONTO Situação que ocorre:\n- a OF é gerada com determinado produto acabado, porém na conclusão da produção a entrada ao estoque é de\ndiferentes códigos de produtos, de acordocom a classificação do produto.\nExemplo:\nOrdem de Fabricação de couro, onde o produto da OF é Wet Blue \"X\";\nporém na entrada ao estoque vão ocorrer entradas:\nWet Blue III Wet Blue IV Wet Blue V\n...de acordo com as diversas classificações que podem ocorrer.\n\n- Para atender a rotina de custeio:\n- No apontamento: apontar para o produto d\n\ns que podem ocorrer.\n\n- Para atender a rotina de custeio:\n- No apontame"], "89-20": ["Erro que está acontecendo na Estofados, ao tentar apontamento de Talão", "Apontamento de Produção_e_ Apontamento Rotulos.pdf", "Erro que está acontecendo na Estofados, ao tentar apontamento de Talão:\n\n“ORA-20000: Erro OF_PROCESSO_APONT_T.ATUALIZA_OF_PROC_APONT_RESUM:\nORA-01400: cannot insert NULL into (“KUNDEN”.”OF_PROCESSO_APONT_RESUM_ATM”.”RECURSO_ID”)\n\nMotivo: tem haver com o processo configurado como back flush, onde que a mensagem provável é porque tenta\napontar um processo anterior, mas nesta tentativa de apontar o processo anterior há um problema, alguma\nconfiguração faltante ou semelhante."], "89-42": ["set qtd secundaria, sql update, row updated", "Apontamento de Produção_e_ Apontamento Rotulos.pdf", "Situação no Curtume, que devido Descarte completo das qtdes da OF, não permite mais desapontar o\nprocesso que gerou este descarte:\n\nGera a mensagem abaixo: ORA-20000: Erro REFAZ_OF_P: ORA-01476: divisor is equal to zero\n\nIsso porque está tudo zerado, qtde principal e secundaria...\n\nPorque foi descartado tudo:\nSolução:\n- exclui os lançamentos do CEP manualmente (os lançamentos da tela acima...)\n\nE fiz um update para voltar a ter qtde da OF e permitir excluir:\n\nSQL> UPDATE OF_ATM\nSET QTD = 348.7395 (esta qtde peguei da consulta acima, programa “Copia…”...qtde do pedido de venda)\nWHERE ID = 373557;\n\n1 row updated.\n\nSQL> UPDATE OF_ATM\nSET QTD_SECUNDARIA = 83\nWHERE ID = 373557;\n\n1 row updated.\n\nz"], "89-72": ["Encerramento de Ordem de Fabricação (CFAB1) — busca o maior, apontamento de ordem, fabricação talão lote", "Apontamento de Produção_e_ Apontamento Rotulos.pdf", "Pedido Serviço: 23463 Solicitação:\n\nROTINA:\n\nManufatura Chão de Fábrica Lançamentos\nApontamento de Ordem de Fabricação/Talão/Lote ALTERAÇÃO:\n\nQuando é feito o apontamento do produto pronto, o sistema busca o maior preço de venda do período.\nSolicita-se que seja implementado uma função p/desconsiderar as vendas de determinada operação, para que na\nbusca do maior preço de venda o sistema desconsidere as vendas dessa operação.\n\nDocumentação:\n\nRotina:\nManufatura Chão de Fábrica Lançamentos\nApontamento de\n\nvendas dessa operação.\n\nDocumentação:\n\nRotina:\nManufatura Chão de Fábrica Lançamentos\nApontamento de Ordem de Fabricação/Talão/Lote Detalhamento:\nRotina que busca o maior preço de venda foi alt"], "89-77": ["Encerramento de Ordem de Fabricação (CFAB1) — indicadores no cep, útil em situações, utilizem esta rotina", "Apontamento de Produção_e_ Apontamento Rotulos.pdf", "Verificado em testes na implantação da Smart em 052021, referente a coluna “Controle Indicadores no CEP”, que\nestando marcado para a respectiva Classificação, impacta na seguinte situação:\n\nA rotina faz o Apontamento de Produção (gerando o SKU), faz a entrada ao Estoque desta qtde, e na sequencia já faz\numa saída de estoque automaticamente.\nPode ser útil em situações na qual se quer registrar a produção efetuada (mesmo que de um produto com\nproblemas, como Retalhos na Smart), mas não se quer controlar no estoque estas qtdes (é o caso na Smart).\n\n(imagino que na Brisa também utilizem esta rotina) Exemplo:\n\nAqui configurado o cadastro do programa de Apontamento, com a Classificação 3...\nClassi"], "89-90": ["Exercício Fiscal (ADMI53) — Verificar o motivo do erro ao apontar OF, sendo que o pedido possui valor unitário", "Apontamento de Produção_e_ Apontamento Rotulos.pdf", "Pedido Serviço: 61764 Cliente: Wellour Solicitação:\nVerificar o motivo do erro ao apontar OF, sendo que o pedido possui valor unitário.\n\nMensagem : KND-003374  Documentação:\n\nAdministração Configuração Exercício Fiscal Detalhamento:\nAjustado o programa de Exercício Fiscal (ADMI53) para somente permitir a criação de um exercício fiscal com duração\nde um ano, iniciando em Janeiro e terminando em Dezembro.\n\nObservação:\nIdentificamos que o cliente tinha 2 exercícios fiscais para o ano de 2023. Um deles era somente do mês de janeiro e o\noutro do mês de fevereiro a dezembro. Via banco, arrumamos para que exista somente um periodo de exercício fiscal\npara o ano de 2023.\n\nZzzzzzzzzzzzzzzzzzzzzzzzzzz"], "89-95": ["Encerramento de Ordem de Fabricação (CFAB1) — APONTAMENTO DE ORDEM DE FABRICAÇÃO/TALÃO/LOTE - AJUSTAR APONTAMENTO DE OF DE PRODUTO QUE…", "Apontamento de Produção_e_ Apontamento Rotulos.pdf", "Pedido Serviço: 60321 Cliente: Aniger Solicitação:\nAPONTAMENTO DE ORDEM DE FABRICAÇÃO/TALÃO/LOTE - AJUSTAR APONTAMENTO DE OF DE PRODUTO QUE CONTROLA LOTE Rotina:\n\nManufatura Chão de Fábrica Lançamentos\nApontamento de Ordem de Fabricação/Talão/Lote Alteração:\n\n1.Ajustar Apontamento de OF de produto que controla lote - reservar somente a quantidade necessária para o\nplano, restante deve ir para o disponível.\n\nApontamento de OF de produto que controla lote, precisa ajustar para reservar somente a quantidade necessária\npara o plano, restante deve ir para o disponível.\nExemplo base demo: Plano criado com dois compostas diferentes de 70 kg cada, um com controle de lote e outro\nnão. Ambos também nã"], "89-104": ["Encerramento de Ordem de Fabricação (CFAB1) — apontamento de ordem, preparada para receber, apenas um recurso", "Apontamento de Produção_e_ Apontamento Rotulos.pdf", "Pedido Serviço: 66086 Cliente: Planet Solicitação:\n\nROTINA:\nManufatura Chão de Fábrica Lançamentos\nApontamento de Ordem de Fabricação (CFAB1) ALTERAÇÃO:\nCorrigir mensagem de erro KND-000793 no apontamento de Ordem de Fabricação para o recurso 2 (INJEÇÃO HORIZONTAL) \nMensagem abaixo: “APONTAMENTO_PRODUCAO.RETORNA_RECURSO: ORA-06502: PL/SQL: numeric or value error:\nCharacter to number conversion error”   Documentação:\nManufatura Chão de Fábrica Lançamentos\nApontamento de Ordem de Fabricação (CFAB1) Detalhamento:\nNada feito.\n\nObservação:\nA lógica não está preparada para receber mais de um recurso para o mesmo agrupamento de informações.\nDeve ser cadastrado apenas um recurso no parâmetro 81.\n\nCa"], "89-106": ["Estorno de Apontamento de Ordem de Fabricação (CFAB10) — Importante vc fazer constar no seu pedido de serviço nro 66591 (EVOLUÇÕES NO PROGRAMA…", "Apontamento de Produção_e_ Apontamento Rotulos.pdf", "De: Marcio Reni Schneider\nEnviada em: terça-feira, 8 de outubro de 2024 20:53\nPara: Gustavo Luis Wiest <gustavo.wiest@kunden.com.br>\nAssunto: Importante vc fazer constar no seu pedido de serviço nro 66591 (EVOLUÇÕES NO PROGRAMA ESTORNO\nDE ORDEM DE FABRICAÇÃO ¿ CFAB10.):\n\nOlá Gustavo,\n\nImportante vc fazer constar no seu pedido de serviço nro 66591 (EVOLUÇÕES NO PROGRAMA ESTORNO DE ORDEM\nDE FABRICAÇÃO ¿ CFAB10.):\n\nA rotina a ser desenvolvida, permitindo fazer o Estorno de Apontamento informando o Plano, não deverá gerar\nmensagem de erro/de validação da mensagem “KND-000290”, quando alguma(s) da(s) OFs de tal Plano não tenham apontamento para desapontar...\nOu seja, não poderá gerar esta mensage"], "89-107": ["Encerramento de Ordem de Fabricação (CFAB1) — ROTINA DE APONTAMENTO DE PRODUÇÃO, DE PRODUTO COM CONTROLE DE LOTE + CONFIGURAÇÃO DE", "Apontamento de Produção_e_ Apontamento Rotulos.pdf", "Pedido Serviço: 65845 Cliente: Kunden Solicitação:\nROTINA DE APONTAMENTO DE PRODUÇÃO, DE PRODUTO COM CONTROLE DE LOTE + CONFIGURAÇÃO DE\nCONTROLE DE UNIDADE SECUNDARIA NO ESTOQUE + CONFIGURAÇÃO PARA RESERVAR NO APONTAMENTO DE\nPRODUÇÃO: AJUSTAR A ROTINA Rotina:\n\nManufatura Chão de Fábrica Lançamentos\nApontamento de Ordem de Fabricação/Talão/Lote Alteração:\n\n1. Rotina de Apontamento de Produção, de Produto com Controle de Lote + configuração de controle de\nUnidade Secundaria no Estoque + configuração para Reservar no Apontamento de Produção: ajustar a rotina.\n\n1.1. O que ocorre:\n-Nestas condições citadas acima, a rotina não está gerando o Lote;\n-Também gera mensagem indevida KND-004784 na tenta"], "89-108": ["Encerramento de Ordem de Fabricação (CFAB1) — APONTAMENTO DE ORDEM DE FABRICAÇÃO - AJUSTAR ERRO AO APONTAR OF QUANDO POSSUI PEDIDO…", "Apontamento de Produção_e_ Apontamento Rotulos.pdf", "Pedido Serviço: 67100 Cliente: HK Solicitação:\nAPONTAMENTO DE ORDEM DE FABRICAÇÃO - AJUSTAR ERRO AO APONTAR OF QUANDO POSSUI PEDIDO RESERVANDO ESTOQUE FUTURO ROTINA:\n\nManufatura Chão de Fábrica Lançamentos\nApontamento de Ordem de Fabricação/Talão/Lote ALTERAÇÃO:\n\nAjustar erro ao apontar OF quando possui pedido reservando estoque futuro, na base de testes do cliente.   Gerou mensagem  “ORA-20000: Erro ATUALIZA_RESERVA_PP_P.INCLUSAO.ESTOQUE_FUTURO.INSERE_ATUALIZA_NOVA_ENTREGA:\nORA-01400: cannot insert NULL into (“ATM”.”PEDIDO_VENDA_ENTREGA_ATM”.“CATEGORIA_PEDIDO_ENTREGA_ID”)” Documentação:\nManufatura Chão de Fábrica Lançamentos\nApontamento de Ordem de Fabricação/Talão/Lote Detalhamento:\nAdicio"], "89-112": ["CFAB22 + Apontamento Rótulos (CFAB65) — regerar os rótulos, geracao rotulo, vincular as quantidades", "Apontamento de Produção_e_ Apontamento Rotulos.pdf", "3. Ao tentar efetuar apontamento de rótulos (CFAB65, CFAB22 ou apontamento WEB), destes itens que\ncontém tabela filha gravada com as OFs dos rótulos, deve gerar apontamento parcial das OFs vinculadas ao rótulo.\n3.1. Analisar a possibilidade de criar um programa específico de apontamento desta situação.\n\nDocumentação:\n\nVendas e Distribuição Faturamento Rótulos\nGera Rótulos Unidades Armazenamento Parâmetro Inicialização:\nMODO_GERACAO_ROTULO | DEFINE O MODO DE GERAÇÃO DOS RÓTULOS.\n\nDetalhamento:\nCaso o parâmetro de inicialização MODO_GERACAO_ROTULO estiver como \"2\" não irá permitir regerar os rótulos e irá\nvincular as quantidades das OFs no rótulo. Caso estiver como \"1\" permitirá regerar os rót"], "89-116": ["CFAB169 — ficou registrado, depois da meia-noite, hora de apontamento", "Apontamento de Produção_e_ Apontamento Rotulos.pdf", "Avaliação em 180226, para o desenvolvimento do Pedido Serviço Pegada para “Criar Painel de Produção e Painel de\nLançamentos de CEP Web, detalhado por Faixas Horárias e Resumos dos Eventos de CEP” (tema do RA 251010030:\nhttps://kundencloud.com.br:3825/atendimento?id=251010030&callType=customer\n\nAvaliado e a rotina considera para o “dia” anterior, algo que é apontado depois das 00:00 (depois da meia-noite) cujo\nturno começou no dia anterior.\n\nExemplo:\nAbaixo mostra a data/hora de Apontamento como sendo 130226, 00:16:31, e na parte de cima do relatório mostra data = 120226...\n\n-Veja que a Data do Apontamento ficou registrado no dia anterior à data que foi apontada em horário\ndepois das 00:00 hr"], "90-0": ["CFAB22 — CFAB22 - Verificar apontamento de rótulos, onde o rótulo não vinculou a nenhuma OF mesmo o", "Apontamento de Rótulos – CFAB22.pdf", "Apontamento de Rótulos – CFAB22..\n\nPedido Serviço: 68135 Cliente: Atta Solicitação:\nCFAB22 - Verificar apontamento de rótulos, onde o rótulo não vinculou a nenhuma OF mesmo o\npedido estando no plano.\n\nRotina:\n\nManufatura Chão de Fábrica Lançamentos Apontamento Rótulos Alteração:\nApontamento não encontra processo, pois o rótulo não possui vinculo a nenhuma OF , mesmo o\npedido estando vinculado ao plano.\nGera Mensagem KND-000249 - Processo (:A) inexistente para a ordem de fabricação (:B).\n\nNo anexo:  Documentação:\n\nManufatura Chão de Fábrica Lançamentos Apontamento Rótulos Detalhamento:\nApós análise, foi verificado que não possuía registro na tabela ROTULO_OF_ATM para os rótulos, com isso, foi"], "90-1": ["CFAB22 — Erro apontamento expedição referente a saldo do processo anterior, onde existe saldo e…", "Apontamento de Rótulos – CFAB22.pdf", "Pedido Serviço: 68929 Cliente: Atta Solicitação:\nErro apontamento expedição referente a saldo do processo anterior, onde existe saldo e deveria apontar.\n\nRotina:\n\nManufatura Chão de Fábrica Lançamentos Apontamento Rótulos Alteração:\nAjustar rotina de apontamento de rótulo que está gerando erro de saldo do processo anterior, sendo\nque ele tem saldo baixado e deveria permitir apontar.\n\nExemplo:\nO processo montagem já foi apontado total, ou seja, para apontar a expedição tem saldo de sequenciamento corretamente.\n\nMas ao apontar, gera o erro KND-000304 como se não tivesse o saldo.  Documentação:\n\nManufatura Chão de Fábrica Lançamentos Apontamento Rótulos Detalhamento:\nNada foi desenvolvido.\n\nObs"], "91-1": ["Apontamento Rótulos (CFAB65) — APONTAMENTO DE ROTULOS: NOVAS COLUNAS E AVISOS", "Apontamento de Rótulos com Consulta - CFAB65.pdf", "Pedido Serviço: 12027 Solicitação:\nAPONTAMENTO DE ROTULOS: NOVAS COLUNAS E AVISOS\nAdicionar as seguintes colunas no programa:\n- Cliente do pedido de venda;\n- Nº do pedido de venda* - Status**\n- Rotulo 1/4,2/4... 4/4\n- Semana: código/numero dela\n- Data inicial da semana\n- Data final da semana\n\n* Abrir consulta do mesmo (não permitir alteração só consulta)\n** Em relação ao status: enquanto não fechado todos os rótulos do pedido, o pedido fica \"em aberto\", quando\napontado todos os rótulos do pedido, status fica OK e gerar mensagem tela confirmando que todos os rótulos do pedido foram apontados.\n\nDocumentação:\nNovas Mensagens:\n- KND-002835: Pedido com Rótulos em aberto;\n- KND-002836: Pedido sem "], "93-0": ["Emissão de Etiqueta por Unidade de Produto (PEDI7) — APONTAMENTO DO PAR: DESENVOLVER A ROTINA DE APONTAMENTO DO PAR A PAR", "Apontamento do Par.pdf", "Apontamento do Par..\n\nPedido Serviço 3582 Solicitação:\nAPONTAMENTO DO PAR: DESENVOLVER A ROTINA DE APONTAMENTO DO PAR A PAR.\n\nNecessário também:\n- impressão de etiqueta do par;\n- programa de apontamento, via coletor;\n- relatório que mostre os dados da tabela de par e situação de apontamento.\n\nNecessário avaliar rotina existente na V3, e desenvolver as mesmas funcionalidades.\n\nSobre a impressão da etiqueta do apontamento do par:\nA empresa utiliza a versão V3, o programa Emissão Etiquetas p/ Apontamento, com classificação DATAMAX\nObservar a alteração efetuada no Pedido serviço 3209:Alterar ordem de impressão das etiquetas:\npassar a impressão para a seguinte ordem:\nOrdem de Fabricação, largura,"], "93-7": ["Pedido de Venda (PEDI1) — Henrich - Etq unidade de produto Bom dia", "Apontamento do Par.pdf", "De: Marcio Schneider [mailto:marcio@kunden.com.br]\nEnviada em: quinta-feira, 4 de junho de 2020 11:26\nPara: 'Gelson Luiz Müller'\nAssunto: RES: Henrich - Etq unidade de produto Bom dia\n\n1º: Verifiquei que nesta tabela ETIQUETA_UNIDADE_PRODUTO_ATM é necessário ter vinculo com Plano e OF.\n\n2º: acho que temos que fazer assim então, conforme abaixo:\nfiz um teste na sua BD (e já exclui o teste)...telas abaixo:\n\n-pesquisei um produto de Exportação que não tinha informações na tabela ETIQUETA_UNIDADE_PRODUTO_ATM;\n\n- Fiz um Pedido de Venda, e um Plano de Produção;\n\n-gerei a etiqueta no programa de Emissão de Etiqueta (visualizei em tela);\n\n-a partir d\n\ne Produção;\n\n-gerei a etiqueta no programa de Em"], "95-5": ["Encerramento de Ordem de Fabricação (CFAB1) — campos: Classificação, Produto Destino, Características", "Classificação_Curtumes.pdf", "Pedido serviço 19839:\n\nDIVERSOS: CRIAR O CADASTRO \"CLASSIFICAÇÃO\" PARA SER VINCULADO NA ESTRUTURA DO PRODUTO. TRATAR RELATÓRIOS Manufatura\nEngenharia e Desenvolvimento de Produto Cadastros Classificação (cadastro novo) Engenharia Estruturação de Produto Chão de Fábrica Relatórios de Produção\nRelatório de Produção da Classificação - Análise da Classificação - CFAB79\nRelatório Analise de Compras Matéria-Prima Couro / Fornecedor - CFAB101\nRelatório da Ficha Técnica, programas EPRO34 E EPRO35_CURTUME ALTERAÇÃO: \n1=Criar cadastro novo \"Classificação\":\nNeste cadastro serão cadastradas as classificações utilizadas pelos curtumes.\nExemplo:\nTR1 TR2 TR3 IV V VI VII\n\n2= Na Estruturação de Produto, Fich"], "96-0": ["Descritivos Técnicos (EPRO54) — descritivos técnicos, relatório epro curtume, emissões de ofs", "Descritivos Técnicos – EPRO54.pdf", "Descritivos Técnicos – EPRO54..\n\nExemplo de utilização do programa Descritivos Técnicos – EPRO54:\n\nVinculado no EPRO15...\n\n...e passa a gerar no Relatório EPRO34/ EPRO35_CURTUME  \n...e em emissões de OFs: "], "97-2": ["CFAB19 — EMISSÃO DE OF: ADEQUAR A IMPRESSÃO DA OF (CAMPOS, LAYOUT)", "Emissão de OF Curtume.pdf", "De: Marcio Reni Schneider\nEnviada em: quarta-feira, 7 de maio de 2025 14:59\nPara: Alexis Rafael Villarroel Ramirez <alexis.villarroel@kunden.com.br>\nAssunto: Alexis, precisava que você orçasse um Pedido de Serviço Especificação para AKS...\n\n...tendo como base a mesma funcionalidade já existente neste pedido de serviço 8328 abaixo...(Só a funcionalidade\nque está em vermelho) Pedido Serviço: 8328 Solicitação:\nEMISSÃO DE OF: ADEQUAR A IMPRESSÃO DA OF (CAMPOS, LAYOUT)\nAdequar a impressão da OF (campos, layout). Possivelmente versões diferentes de acordo com produto (Estofamento, tapetes,...) Documentação:\nEMISSÃO ORDEM DE FABRICAÇÃO (CFAB7)\nRelatório Emissão de Ordem de Fabricação Tapetes (CFAB1"], "97-9": ["CFAB19 — materiais baixados, parâmetro inicialização componente, marcar este check", "Emissão de OF Curtume.pdf", "os no Estoque”, é necessário que...\n\n...é necessário que:\n- parâmetro inicialização COMPONENTE_CODIGO esteja de acordo... \nSe marcar este check box (NÃO PODE), também é impresso desconfigurado, porque traz o campo “Detalhe Técnico\nPedido varias vezes, e não imprime o bloco “Materiais baixados no Estoque”:\n\nE para imprimir estar versão do relatório a partir do programa de Abastecimento ESTO112, que imprima de maneira\ncorreta e como acima, com o bloco “Materiais baixados no Estoque”, é necessário o parâmetro OF_MEDIÇÃO estar N."], "97-10": ["ADMI125 — [Imagem: ADMI6 | CFAB7] [Imagem: CFAB19 | ESTO112] [Imagem: ADMI125 | ADMI6 | ESTO112]…", "Emissão de OF Curtume.pdf", "Pedido Serviço: 21030 Solicitação:    Manufatura Chão de Fabrica Relatórios de Produção\nEmissão de Ordem de Fabricação - CFAB19_AMC ALTERAÇÃO\nCampo \"Fator\" foi assim definido no pedido 20315 (pedido na qual foi criada esta nova versão de impressão):\n\"O Campo Fator deverá vir do campo Insumo Bruto do tipo de formula que estiver cadastrada no parâmetro de inicialização sua categoria\".\nNeste rotina faltou considerar que este parâmetro de inicialização CATEGORIA_PRODUTO_FORMULA% pode (e\nprecisa) ser cadastrado diversas vezes para as diversas\nCategorias de Formulas de um produto acabado: isso é necessário para que as diversas formulas sejam impressas\naos seus respectivos processos.\nMas o campo \"F"], "97-17": ["Programas (ADMI6) — Exemplo de utilização do programa Descritivos Técnicos – EPRO54", "Emissão de OF Curtume.pdf", "Exemplo de utilização do programa Descritivos Técnicos – EPRO54:\n\nVinculado no EPRO15... \n...e passa a gerar no Relatório EPRO34/ EPRO35_CURTUME  \n...e em emissões de OFs:"], "97-19": ["CFAB184 — cópia de ordem, couros hidro, plano mestre", "Emissão de OF Curtume.pdf", "Pedido Serviço: 68443 Cliente: Couros Hidro Solicitação:\n\nRotina:\n\nManufatura\nPlano mestre de produção (MPS)\nPlano mestre de produção\nCópia de Ordem de Fabricação Alteração:\n\nPrograma \"Cópia de Ordem de Fabricação-CFAB59\": criar nova versão de impressão da OF, a partir da versão \"CFAB19_AMC\" Documentação:\nManufatura\nPlano mestre de produção (MPS)\nPlano mestre de produção\nCópia de Ordem de Fabricação Detalhamento:\nCriado relatório CFAB184 se sequência 1 para geração a partir do programa CFAB59. Este relatório traz a\npossibilidade de demonstrar até 43 processos de produção.\n\nRelatórios:\nCFAB184 | Sequência 1 (Report)   Pedido Serviço: 69289 Cliente: Couros Hidro Solicitação:\nPROGRAMA \"CÓPIA DE"], "100-0": ["Implantação de Saldo (ESTO2) — ocorrer o procedimento, devolução de empréstimo, primária e secundária", "Empréstimo no produto couro com controle de Lote.pdf", "Empréstimo no produto couro com controle de Lote..\n\nSituação original:\nConsumi tudo...zerou qtdes em estoque:\n\nFui ao mercado e compramos qtde desta material...\n\nUsando o programa gerador de devolução:\n\nGerou esta NFS:    \nConclusão: há problema...esta alternativa não funciona, não tem tratativa.\n\nZzzzzzzzzzzzzzzzzzzzzzzzzzzz\n\nNovo teste, informando manualmente o Lote que se tem estoque, e não o que tem vinculo com doc referencia:\n\nConclusão: também há problema...esta alternativa não funciona, não tem tratativa.   Zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz\n\nAlternativa pensada: pelo programa de Reclassificação não dá...não permite entrada ao Lote original...\n\nZzzzzzzzzzzzzzzzzzzzz"], "101-4": ["Estruturação de Produto (EPRO15) — pistolar cobertura, possível incluir, revisar a partir", "Estruturação de Produto_Curtume.pdf", "\nAvaliação feita em 271023 na Krumenauer, em função da implantação na Curpisco...referente se é possível incluir +\nde 1 vez o mesmo Processo na aba Manufatura...\nsegue avaliação abaixo...\n\nAqui exemplo Krumenauer em que utilizam o mesmo Processo + de 1 vez no mesmo produto...ver abaixo o Processo 49:\n\nEste select mostra a qtde de Produtos que tem o mesmo Processo mais de 1 X no mesmo Produto (detalhe: talvez\nparte dos registros encontrados, um destes Processos que estaria “duplo” na real está Inativado):\n\nSELECT PRODUTO_ID, PROCESSO_ID, COUNT (PROCESSO_ID) FROM PRODUTO_PROCESSO_ATM\nWHERE PRODUTO_ID > 0 --(detalhe: aqui é uma condição...se o campo for Varchar é necessário algo como “IS NOT NU"], "101-8": ["EPRO09 — sequencia de apontamento, obriga vezes, habilitar", "Estruturação de Produto_Curtume.pdf", " \nPara habilitar este campo “Sequencia de apontamento.” dentro do campo “Processo” na Lista de Material...\n\n...é necessário o parâmetro de inicialização “OBRIGA_VEZES_PROCESSO” do EPRO15 estar S\n\n...aqui uma BD nova: "], "102-1": ["Encerramento de Ordem de Fabricação (CFAB1) — Novo fluxo testado na BD Desenvolvimento, e avaliado com Claudemir", "Flujo_fresco a WB.pdf", " \nNovo fluxo testado na BD Desenvolvimento, e avaliado com Claudemir:\n- exemplo OF 409343\n- recebem o couro verde/salgado;\n- marcam o couro com “Marca”...utilizando marca com 4 algarismos...sendo o 1º a letra do fornecedor, e os 3\núltimos um numero sequencial de controle manual...para cada dia um novo numero de 3 digitos, sendo o mesmo\nnumero para os diversos fornecedores que vão entregar neste dia.\nExemplo:\nA082 B082 O082\n- fazer o lançamento da NF Entrada, sendo que o item couro terá que ter registrado:\nA marca, junto a aba do Lote, informando manualmente;\nO numero do Lote será gerado automático.\n- cadastrar o LE.\nQtde: indiferente, porque vai se ajustar de acordo com a qtde de abastecimen"], "103-0": ["Estruturação de Produto (EPRO15) — formulas de acabamento, gerar as ofs, mesma formula", "Formulas de Acabamento.pdf", "Formulas de Acabamento:..\n\n(IMPORTANTE SOBRE O ABAIXO...VER NOVA DEFINIÇÃO NA PAG 18, “Novo Teste agora, em 05102016”) Teste em 250816\nMotivo do teste: comprovar que é possível usar um processo padrão “Mistura” vinculado à formula de\nacabamento...desta maneira facilitando o cadastramento das formulas de acabamento.\nPor exemplo neste caso é possível configurar padrão no processo “Gerar Produto Pronto = SIM”...e não se precisa\npreocupar em utilizar o mesmo processo que é utilizado no produto acabado.\nTambém com isso não necessário se preocupar com o processo que depois será utilizado para consumir tinta, no\nproduto acabado....(não se precisa utilizar o mesmo processo que se consome a tinta...o"], "103-1": ["CFAB11 — Este abastecimento corrigiu qtde da OF", "Formulas de Acabamento.pdf", "Este abastecimento corrigiu qtde da OF:  \nGerou estas qtdes de tintas: BAIXADO?? (posteriormente arrumado isso...era outro problema).\n(qtdes calculadas está OK) Aqui gerou OK:  \nGerou OK a OF:\nDetalhe: veja que na OF 410143 tem (MA), e por isso a qtde de ingredientes somando é maior que a qtde da\nformula...é que na real este (MA) não será utilizado...ou deixará de ser utilizado o titular que é o 34925.1\n\nEm seguida, apontar/baixar as OFs:      Mensagem KND-002718\n\nCom isso ocorreu a geração da OF e o consumo da tinta:  \nVãos para a parte de consumo de Materiais (pós o OK na mensagem na 3ª tela acima)   \nOcorreu o consumo dos materiais:\n\nAqui, mostrando o consumo gerado às OFs: está OK...apen"], "103-4": ["Consulta Ordem de Fabricação (CFAB2) — ofs de tinta, mesma formula, sempre era diferente", "Formulas de Acabamento.pdf", "Situação vista em 03/2017, na tentativa de fazer um passo a passo para PDS.\nConstatado que, na geração da Ofs de tinta, a rotina ao que parece nunca gerou agrupado a tinta, quando as OFs de\nacabado são de Planos diferentes...\n\nResolvi deixar assim de momento, até que alguém de fato utilize.\n\nMas há uma avaliação prévia da situação, cfe abaixo:\n\nEm 18/03/2017 05:22, Marcio - Kunden escreveu:\nOlá Cristiano,\n\nMPSP46 tem uma situação que acho que sempre era diferente...e que agora está fazendo de um jeito que não deveria...  \nVocê poderia dar uma olhada nesta parte do programa?\n\nSeguinte:\nFormulas de Acabamento, quando se usa o botão “Gerar OF”.\nQuando se tem 2 ou mais OFs de acabado que necessi"], "103-12": ["Cópia de Ordem de Fabricação (CFAB59) — sequencia no assunto formulas de acabamento Marcelo,", "Formulas de Acabamento.pdf", "De: Marcio - Kunden [mailto:marcio@kunden.com.br]\nEnviada em: sexta-feira, 15 de setembro de 2017 16:51 Para: cpd@amcm.ind.br\nCc: 'Caligiuri Santos'; roberto@kunden.com.br\nAssunto: RES: sequencia no assunto formulas de acabamento Marcelo,\n\nEm anexo, passo a passo para utilizar a rotina de Formulas de Acabamento, segundo a necessidade que foi nos\ncolocado em reunião, aí na Amcm, em 13/09/17.\n\nAmcm_rotina_Formulas_Acabamento\n\nCadastro da “formula base” com suas resinas... \nCadastro da “formula final” com seus pigmentos/corantes...\n\nVincular primeiramente no produto acabado a formula “Base”...isso porque não se tem a informação da fórmula\nfinal quando se cadastra o produto acabado. O insumo é o"], "103-16": ["Estruturação de Produto (EPRO15) — Para que funcione bien grabar el código y secuencia de Proceso en las Formulas (asunto…", "Formulas de Acabamento.pdf", "De: Marcio Reni Schneider\nEnviada em: quarta-feira, 15 de novembro de 2023 05:07 Para: BETTORE <bettore@a2-comm.com>\nCc: Alexis Rafael Villarroel Ramirez <alexis.villarroel@kunden.com.br>\nAssunto: Para que funcione bien grabar el código y secuencia de Proceso en las Formulas (asunto que miramos juntos ayer),\ntiene que hacer el catastro así, por favor:\n\nEn el 1º material incluido en la formula (en la 1ª línea), llenar el Componente, después seguir (seguir con la tecla TAB\nde la computadora) para la derecha de los próximos campos…\n\n...y al llegar en el campo “Proceso”, tiene que abrir la Lista de Procesos (haga clic en el botón de la fleja azul),\nseleccionar con 2 clics este proceso que muestr"], "104-2": ["Componente (EPRO14) — Preciso para esta semana que vc teste na BD Desenvolvimento a seguinte rotina Bom dia,…", "Formulas de Recurtimento.pdf", "De: Marcio - Kunden [mailto:marcio@kunden.com.br]\nEnviada em: domingo, 16 de julho de 2017 06:52 Para: 'Caligiuri Santos' Cc: roberto@kunden.com.br\nAssunto: Preciso para esta semana que vc teste na BD Desenvolvimento a seguinte rotina Bom dia, Cali,\nPreciso para esta semana que vc teste na BD Desenvolvimento a seguinte rotina, e abra pedido de serviço de erro\npara ajustar a situação tela abaixo.\n(problema que eu vi ocorrer na BD Oficial Amcm)\n\nProblema: a rotina da Lista de Materiais não está sugerindo/gravando o Processo/Sequencia no Material, apesar das\nconfigurações da rotina estarem de acordo.\n(ocorre quando se inicia uma Lista de Materiais do zero, sem ser por cópia de outro “produto”)\n"], "104-6": ["Programas (ADMI6) — fator conversão, vinculadas no produto, qtde de químicos", "Formulas de Recurtimento.pdf", "Visto em 200123 além das recomendações já vistas acima, extensão da avaliação logo abaixo, visto que Krumenauer\ntem configurado assim o campo “Fator Conversão” da tela Abastecimento...  \n...que é para que seja sugerido assim aqui nas formulas: todos os materiais das formulas (e agua e demais\n“processos”) tem o campo Fator Conversão = 100, que é para gerar corretamente as qtde de químicos...\n\n...olhando esta situação no Nimo: é o mesmo, veja...\nA esquerda, não está definido o Fator Conversão 100 no nível superior, mas todos os materiais tem a definição do\nFator Conversão 100 como no exemplo...\n...e na Formula, mostra este Fator Conversão 100 que é sugerido da aba de Abastecimento:\n\nVisto em 2"], "104-7": ["ESTO81 — campos: Materiais, QTD, Alterar Produto, Quantidade", "Formulas de Recurtimento.pdf", "...aí no relatório, acessado a partir do acima, inclusive mostra aqui a “pesagem” como estes 546,875 KG:\nSelecionando acima e clicando no botão “Materiais” do acima, abre esta tela... \nVER com Krumenauer SE UTILIZAM A OPÇÃO DO “GERAR PLANO ABAST”....:\nPosição de Joziel é de que não utilizam.\n\n...Ver abaixo que o campo “QTD. PESAGEM” mostra os 546,875 KG:\n\nVER SE ESTE É O CONCEITO DA PESAGEM...:  \nPosição de Joziel: sim, assim mesmo.\nVER SE USAM ASSIM PARA CALEIRO E CURTIMENTO...:\nPosição de Joziel: Não efetuam mais Caleiro, mas Curtimento sim, e é assim mesmo.\n\nCfe verificado: utilizam a opção abaixo para:\n-Trocar formula, selecionando no check box da direita e clicando no botão “Alterar Pro"], "107-8": ["ADMI122 — Validação efetuada, ped serv 22619", "Interface com medidora de couros modelo Mediplan 2000, marca Master.pdf", "Validação efetuada, ped serv 22619:\n\nProcedimentos efetuados para a validação:\nCriado arquivo de teste, no bloco de notas, arquivo 437256.lth também salvo na validação.\n\nCriado as pastas no servidor:\n\nConfigurações:\n\nGerou isso:  \nNo apontamento realizado a partir do programa com o parâmetro SUGERE_QUANTIDADE_MEDIDORA = S\n*abaixo configuração de parâmetros para este programa  \nCom Tab, traz as qtdes medidas:\n\nAqui, abre a tela do Lote = OK.\nApós o Confirmar: o cursor posicionou-se no primeiro bloco do programa. OK\n\nEfetuou apontamentos e entrada ao estoque, cfe abaixo:   \n*Programa de Apontamento na Wellour está com esta configuração:\n\nzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz   zzzzzzzzzzzzzzzzzzzzzz"], "109-6": ["EPRO36 — Relatório troca de insumo químico Bom dia, Felipe,", "LWG.pdf", "De: Marcio Schneider <marcio@kunden.com.br>\nEnviada em: quarta-feira, 15 de janeiro de 2020 11:27\nPara: 'Felipe' <suporte@soubach.com.br>; 'Cassiano | Soubach' <cassiano@soubach.com.br>\nAssunto: RES: Relatório troca de insumo químico Bom dia, Felipe,\nFavor renomear o programa “EPRO51.rep” para “EPRO51_backup150120.rep”, conforme mostra na tela abaixo (eu\nnão consegui fazer por aqui, porque estou sem permissão).\nNa sequencia, voce terá que baixar o programa “EPRO51.rep” que está anexo neste email, baixar aí na pasta\nconforme mostra na tela abaixo.\n\n\\\\srv001\\SED\\SW\\Kunden_ERP\\Programas\\EPRO\nDepois disso o Cassiano pode usar o relatório que ele precisa:\n\nUtilizar o relatório cadastrado no camin"], "110-1": ["Manutenção de Apontamentos MultiTarefa (CFAB93) — PROGRAMA NOVO - MANUTENÇÃO DE APONTAMENTOS COM HORA INICIO E FIM ROTINA", "Manutenção de Apontamentos MultiTarefa – CFAB93.pdf", "Pedido Serviço: 15814 Solicitação:\nPROGRAMA NOVO - MANUTENÇÃO DE APONTAMENTOS COM HORA INICIO E FIM ROTINA:\n\nManufatura Chao de Fabrica Lançamentos Manutenção Apontamentos On-line ALTERAÇÃO:\n\nCriar Programa Novo para atender a necessidade da manutenção dos apontamentos realizados pelo Programa de Apontamentos On-line.\n\nEste programa deve ser possivel filtro de Máquina, Data, e Truno onde devem ser listados todos os registros\ngravados pelo Programa de Apontamentos On-line com hora inicio e Fim assim como os Eventos de parada e ser\npossivel efetuar a manutenção dos apontamentos.\nVer detalhamento Técnico a respeito de Regas para este programa;\n\nDocumentação:\n-- Novo programa de manutenção de ap"], "110-7": ["Manutenção de Apontamentos MultiTarefa (CFAB93) — Exemplo na BD Curtume", "Manutenção de Apontamentos MultiTarefa – CFAB93.pdf", "Exemplo na BD Curtume:\n\nPermite editar as “Data/Hora”...\n\n...e com isso traz atualizado aqui no Relatório Extrato Maquina CFAB96:  "], "111-1": ["Relatório Posição Plano de Produção (CFAB24) — Visto em 041016, estrutura e formula de Recurtimento", "Minuano_histórico de como usam o sistema.pdf", "Visto em 041016, estrutura e formula de Recurtimento:  \nVeja que o processo já está vinculado no Componente ao qual se está vinculando ao produto, e por isso traz automático o processo:  \nNa Minuano, na fórmula em si não está sendo vinculado o processo, na aba Processos."], "112-0": ["Cópia de Ordem de Fabricação (CFAB59) — trazendo o material, validação de apontamento, rotina efetuou", "MP_Materia Prima_na Engenharia e geração necessidades.pdf", "MP_Materia Prima_na Engenharia e geração necessidades..\n\nEm 16/06/17, BD Amcm_teste, colocando WB em nível superior:\n\nAqui, vinculando o WB num nível bem superior...\n\nPlano de teste, na qual vai gerar necess deste nível superior:\n\nAqui...esto25 trazendo o material: \nMRP de compras: traz:\n\nEFETUEI APONTAMENTO do processo anterior ao PP (na qual vai validar o abastecimento): apontamento OK  \nRotina efetuou OK a validação de apontamento:   Zzzzzzzzzzzzzzzzzzzzzzzzz Fiz os consumos:   OF ficou assim:\n\nAponamento final: OK:  Ficou OK, produzido: "], "112-3": ["Melhorias na alteração e cadastro de insumos (EPRO39) — Para FPV: tem que informar o % de rendimento previsto", "MP_Materia Prima_na Engenharia e geração necessidades.pdf", "Para FPV: tem que informar o % de rendimento previsto:\n\nCfe desenvolvimentos efetuado no FPV, teria que tratar a situação (pedidos serviço de Douglas,...).  "], "113-3": ["Curtume (PEDI128) — pós abastecimento, apontamento final, faturamento cfe", "Relatório Acompanhamento de Pedidos – Curtume – PEDI128.pdf", "Sessão de Testes para ver como o relatório se comporta, pós abastecimento e ajuste na qtde da OF, pós\napontamento final e pós faturamento:\n\nQtde da OF: qtde original era 100 (qtde do Pedido de Venda)...\n\nOK aqui pós abastecimento: \nOK aqui após apontamento final acima:   OCORREU A EMISSÃO:\n\nVEJA QUE OK os dados: qtde de faturamento cfe foi produzido e em seguida faturado: "], "114-1": ["Prima Couro / Fornecedor (CFAB101) — ROTINA Manufatura Chão de Fábrica Relatórios de Produção", "Relatório Analise de Compras Matéria-Prima Couro - Fornecedor – CFAB101.pdf", "Pedido Serviço: 16793 Solicitação:\nROTINA Manufatura Chão de Fábrica Relatórios de Produção\nRelatório - Analise de Compras Matéria-Prima Couro / Fornecedor ALTERAÇÃO\n\nCriar relatório para se poder analisar o resultado da compra de Matéria-Prima Couro mesclando dados imputados no\nprograma de Inspeção Recebimento e Apontamento de OFs no que diz respeito ao encerramento da OF utilizando a\nentrada de Múltiplos Produtos em estoque já utilizados no relatório de produção por classificação (programa CFAB79).\n\nPara gerar o relatório a NF de compra deverá dar entrada em estoque e deverá ser emitida uma (s) OF (s) para\nretirar o couro do estoque e encerrar a mesma dando entrada novamente no estoque com"], "114-3": ["Prima Couro / Fornecedor (CFAB101) — fiscal de entrada, exibir os dados, criado o relatório", "Relatório Analise de Compras Matéria-Prima Couro - Fornecedor – CFAB101.pdf", "Documentação:\n- Criado o Relatório - Analise de Compras Matéria-Prima Couro / Fornecedor(CFAB101) e (CFAB102) - Filtros:\n- Empresa\n- Unidade de Negócio - Fornecedor\n- Número Nota Fiscal de Entrada\n- Data Emissão Nota Fiscal de Entrada\n- Data Entrada Nota Fiscal de Entrada - Número Lote\n- Núemro Lote Fornecedor - Lote Marca - Característica\n\nO filtro \"Característica\" é utilizado para exibir os dados da classificação. Exemplo na BD Desenvolvimento: "], "114-7": ["Prima Couro / Fornecedor (CFAB101) — DIVERSOS: CRIAR O CADASTRO \"CLASSIFICAÇÃO\" PARA SER VINCULADO NA ESTRUTURA DO PRODUTO.…", "Relatório Analise de Compras Matéria-Prima Couro - Fornecedor – CFAB101.pdf", "Pedido Serviço: 19839\nCliente: Pieles del Sur Solicitação:\nDIVERSOS: CRIAR O CADASTRO \"CLASSIFICAÇÃO\" PARA SER VINCULADO NA ESTRUTURA DO PRODUTO. TRATAR RELATÓRIOS Manufatura\nEngenharia e Desenvolvimento de Produto Cadastros Classificação (cadastro novo) Engenharia Estruturação de Produto Chão de Fábrica Relatórios de Produção\nRelatório de Produção da Classificação - Análise da Classificação - CFAB79\nRelatório Analise de Compras Matéria-Prima Couro / Fornecedor - CFAB101\nRelatório da Ficha Técnica, programas EPRO34 E EPRO35_CURTUME ALTERAÇÃO:\n\n1=Criar cadastro novo \"Classificação\": \nNeste cadastro serão cadastradas as classificações utilizadas pelos curtumes.\nExemplo:\nTR1 TR2 TR3 IV V VI VII"], "118-0": ["Relatório de Extrato por Maquina (CFAB96) — horas extras, roberto para nimo, relatório de extrato", "Relatório de Extrato por Maquina – CFAB96.pdf", "Relatório de Extrato por Maquina – CFAB96..\n\nExemplo na BD Curtume:\n\nXxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx\n\nAvaliação feita por Roberto para Nimo, em 072018:\nao que parece, o relatório tem deficiências no controle de Horas Extras, por exemplo:\n-quando se inicia a produção de determinada OF às 16:00 hrs, e o turno registrado no calendário de Recursos\ntermina às 17:18, porém o Recurso trabalhou, terminou a OF e apontou o final desta OF só as 19:18, o relatório\nconsidera tudo como “Hora Normal”, sendo que neste caso, seriam 2 horas extras.\n\n-outra questão que levantamos e ficamos na duvida:\nQuando a OF inicia num dia e termina no outro dia:\nQuando não há um registro intermediár"], "118-1": ["Relatório de Extrato por Maquina (CFAB96) — evento de parada, relatórios gerenciais extrato, incluir a coluna", "Relatório de Extrato por Maquina – CFAB96.pdf", "De: Roberto Schumacher [mailto:roberto@kunden.com.br]\nEnviada em: quinta-feira, 12 de julho de 2018 17:28 Para: tiago@nimo.com.br\nCc: 'Marcio - Kunden' Assunto: Re: RELATORIO\n\nQuanto ao relatório Extrato Máquina, tem a opção de poder fazer um lançamento de evento de parada no final do\nexpediente e inicio no outro dia, para poder gerar com as horas corretas de tempo que foi produzida a OF. Segue\nanexo documento explicando essa rotina.\n\nDeve ser criado um evento de parada\n\nApós efetuar o apontamento inicial da OF, digitando o recurso, é possível ver o que tem naquele recurso \nSuponhamos que seja final de turno, e a OF ainda não ficou concluída, então, deverá ser lançado o evento de parada, con"], "118-5": ["Relatório de Extrato por Maquina (CFAB96) — PROGRAMA RELATÓRIO EXTRATO MÁQUINA ¿ CFAB96: REVISAR MENSAGEM DE ERRO Rotina", "Relatório de Extrato por Maquina – CFAB96.pdf", "Pedido Serviço: 60733 Cliente: Aniger Solicitação:\nPROGRAMA RELATÓRIO EXTRATO MÁQUINA ¿ CFAB96: REVISAR MENSAGEM DE ERRO Rotina:\nManufatura Chão de Fábrica Relatórios Gerenciais Extrato Maquina  Alteração:\nPrograma Relatório Extrato Máquina ¿ CFAB96: revisar mensagem de erro ao tentar gerar os dados no relatório, na BD Aniger HML.\nMensagem “ORA-20000: Erro GERA_MANUFATURA_181TMP_P: ORA-01847: day of month must be...” Documentação:\nManufatura Chão de Fábrica Relatórios Gerenciais Extrato Máquina Detalhamento:\nAjustado.\nObservações:\nA rotina não considerava ordens de fabricação que não eram oriundas de um pedido de venda.\nModificada a tratativa de datas, para não causar mais erros. "], "119-8": ["Análise da Classificação (CFAB79) — 4= Relatório da Ficha Técnica, programas EPRO34 E EPRO35_CURTUME", "Relatório de Produção da Classificação - Análise da Classificação - CFAB79.pdf", "4= Relatório da Ficha Técnica, programas EPRO34 E EPRO35_CURTUME:\nBloco \"Produto Final\":\nQuando existir \"Produto Destino\" vinculado ao Produto listado na Ficha Técnica (produto que consta na 1ª linha do\nrelatório), então passar a listar os \"Produtos Destino\" neste bloco.\nJunto aos \"Produtos Destino\", listar também a sua respectiva \"Classificação\" de cada \"Produto Destino\" (criar label \"Classificação\").\nNeste bloco, eliminar o campo \"% Previsto\".\n\n5= criar script para permitir gravar os dados do campo novo \"Classificação\", buscando do campo da Característica.\n\nDocumentação:\n\nZzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz Extensão do acima:\n-em 281123, testado para a implantação Curpisco:\n\nO relatório nã"], "120-3": ["CFAB78 — entrada e final, unidade de parâmetro, cálculo do rendimento", "Relatório de Rendimento - CFAB78.pdf", "RENDIMENTO: Listar o % de Rendimento conforme fórmulas na planilha excel e ou exemplos abaixo. Deverá\nter um total para a coluna RENDIMENTO sendo esta não um somatório e sim a mesma fórmula da linha da\nOF. Acompanhado do valor do rendimento conforme fórmula abaixo deverá vir à unidade de parâmetro do\nmesmo (% ou KG/M²) onde se as U.M. de entrada e final forem as mesmas a unidade de parâmetro deverá\nser % e se elas forem diferentes deverá ser KG/M². Formato do campo Alfanumérico. PADRÃO PAR A\nCURTUME - CAMPO PADRÃO PARA TODOS OS MODELOS\n\nImportante: O Rendimento em % sempre deve rá ser calculado com base nos fatores médio de sa ída e\nentrada e o Rendimento KG/M² sempre deverá ser calculado pe"], "120-4": ["CFAB78 — ROTINA Manufatura Chão de Fabrica Relatórios de Produção", "Relatório de Rendimento - CFAB78.pdf", "Pedido Serviço: 16464 Solicitação:\nROTINA Manufatura Chão de Fabrica Relatórios de Produção\nRelatório de Rendimento (CFAB78)\nRelatório de Rendimento com Custos Gerenciais (CFAB85) ALTERAÇÃO\n\nO relatório, quando a OF tenha uma operação (processo) que esteja gravando o campo medição, que irá atualizar a\nquantidade da OF, através do Pedido Serviço 16723, as quantidades base para cálculo de rendimento que deverão\nser listadas na coluna ENTRADA deverão ser as quantidades da OF e não as quantidades da matéria-prima Couro\nbaixados do estoque. Caso não tenha uma operação (processo) que exija uma quantidade no campo medição os\ndados a serem listados no campo ENTRADA deverão ser o padrão do relatório."], "120-7": ["CFAB78 — unidade primaria metragem, problema de duplicação, custos e rendimento", "Relatório de Rendimento - CFAB78.pdf", "Problema de duplicação e/ou qtde de unidade primaria/metragem maior (de Medição) que a realmente abastecida:\n\nAnexo (do cliente) deste protocolo:\n\n“OF 16395 METRAGEM ABASTECIDA ESTÁ CORRETA MAS NO RELATORIO DE CUSTOS E RENDIMENTO APARECE\nOUTRA METRAGEM QUE NÃO FOI ABASTECIDA! ”   Zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz Motivo:\nInicialmente foi aberto pedido serviço 24243 por Cali, para que:"], "120-8": ["CFAB78 — apontamento medição, rotina está somando, vinculo link direto", "Relatório de Rendimento - CFAB78.pdf", "ROTINA:\n\nSuprimentos\nPlanejamento Necessidade de Materiais Abastecimento (MRP)\nPlano Abastecimento Materiais - Requisição ALTERAÇÃO:\n\nAo fazer um estorno de abastecimento a quantidade referente a medição deve ser zerada, por que hoje a rotina não\nestá zerando, e ao fazer um novo abastecimento com uma nova medição, a rotina está somando a medição anterior\ncom a nova logo, deixando errada a informação em tela e nos demais relatório que usam essa informação.\n\nAnexo do pedido serviço:\n\nMedição 80.  \nDeleta o abastecimento e faz um novo, conforme prints abaixo.\n\nO correto é 180,2 e não 260,2. A rotina está somando as medições já existentes, não está certo.    Zzzzzzzzzzzzzzzzzzzzzzzzzz\n\nPorém Can"], "121-0": ["Relatório de Rendimento com Custo (CFAB85) — RELATÓRIO DE CUSTOS - COMPLEMENTO DO PEDIDO SERVIÇO 13585", "Relatório de Rendimento com Custo - CFAB85.pdf", "Relatório de Rendimento com Custo..\n\nPedido Serviço: 14497 Solicitação:\nRELATÓRIO DE CUSTOS - COMPLEMENTO DO PEDIDO SERVIÇO 13585\nDESENVOLVER COMPLEMENTO DO RELATORIO CONFORME DOCUMENTO ANEXO\n\nA ideia deste relatório é ter uma analise do que foi produzido para um ou “N” cliente(s), ou seja, com base no que já\nlançado no Kunden como movimentação de uma OF listar os dados conforme colunas do relatório que estão abaixo descriminadas.\n\nA base de pesquisa é o que foi lançado no programa CFAB1-Encerramento de Ordem de Fabricação - Multiplos\nProdutos (Curtume) onde deve ser buscar tudo o que existe de lançamentos efetuados para as OFs que tem\nlançamentos neste programa de acordo com a necessidade d"], "121-4": ["Relatório de Rendimento com Custo (CFAB85) — relatório não funcionar, referente à matéria, moeda com casas", "Relatório de Rendimento com Custo - CFAB85.pdf", "MATÉRIA-PRIMA: Listar o somatório dos valores (custo médio ou se existir a possibilidade escolher outro tipo\nde valorização) baixados do estoque referente à matéria prima COURO – componente 17-MATÉRIA PRIMA\nRIBEIRA ou 14 -MATÉRIA PRIMA WB ( como vejo que o componente poderá mudar de cliente para cliente da\nKunden sugiro criarmos um tipo de CATEGORIA (MATÉRIA PRIMA COURO ao invés de utilizar MATERIAIS\ncomo esta no cadastro da Estrutura de Produto ) no programa EPRO2 para não termos problemas deste\nrelatório não funcionar em outro curtume ), no programa EST25-Plano de Abastecimento Materiais -\nRequisição (Curtume) listadas para a OF na coluna ENTRADAS. Formato do campo: Moeda com 02 casas\ndeci"], "121-13": ["Relatório de Rendimento com Custo (CFAB85) — entrada e final, unidade de parâmetro, cálculo do rendimento", "Relatório de Rendimento com Custo - CFAB85.pdf", "RENDIMENTO: Listar o % de Rendimento conforme fórmulas na planilha excel e ou exemplos abaixo. Deverá\nter um total para a coluna RENDIMENTO sendo esta não um somatório e sim a mesma fórmula da linha da\nOF. Acompanhado do valor do rendimento conforme fórmula abaixo deverá vir à unidade de parâmetro do\nmesmo (% ou KG/M²) onde se as U.M. de entrada e final forem as mesmas a unidade de parâmetro deverá\nser % e se elas forem diferentes deverá ser KG/M². Formato do campo Alfanumérico. CAMPO PADRÃO\nPARA TODOS OS MODELOS\n\nImportante: O Rendimento em % sempre deve rá ser calculado com base nos fatores médio de sa ída e\nentrada e o Rendimento KG/M² sempre deverá ser calculado pegando a quantidade na U"], "121-18": ["Relatório de Rendimento com Custo (CFAB85) — custo fixo, mostrados no relatório, conferencia do funcionamento", "Relatório de Rendimento com Custo - CFAB85.pdf", "\nColuna Custo Fixo; conferencia do funcionamento.\nNeste exemplo, selecionado OF 1152 da BD Curtume (BD Interna da Kunden):\n\nO custo fixo deste exemplo, de 410,00 foi gerado através dos apontamentos dos processos Recurtir e Medir (eram\nestes cujos Recursos tinham no momento um Centro Trabalho vinculado)... \n\n...verificou o tempo de cada um destes 2 processos...\n\nTotal de tempo: (200 X 1,0000 minuto) + (210 X 1,0000 Minuto) = 410,0000 minutos...\n\n...E multiplicou pela tarifa prevista de 1,0000 = R$ 410,00 mostrados no relatório acima."], "121-26": ["Relatório de Rendimento com Custo (CFAB85) — ROTINA Manufatura Chão de Fabrica Relatórios de Produção", "Relatório de Rendimento com Custo - CFAB85.pdf", "Pedido Serviço: 16464 Solicitação:\nROTINA Manufatura Chão de Fabrica Relatórios de Produção\nRelatório de Rendimento (CFAB78)\nRelatório de Rendimento com Custos Gerenciais (CFAB85) ALTERAÇÃO\n\nO relatório, quando a OF tenha uma operação (processo) que esteja gravando o campo medição, que irá atualizar a\nquantidade da OF, através do Pedido Serviço 16723, as quantidades base para cálculo de rendimento que deverão\nser listadas na coluna ENTRADA deverão ser as quantidades da OF e não as quantidades da matéria-prima Couro\nbaixados do estoque. Caso não tenha uma operação (processo) que exija uma quantidade no campo medição os\ndados a serem listados no campo ENTRADA deverão ser o padrão do relatório."], "121-44": ["Relatório de Rendimento com Custo (CFAB85) — apontamento medição, rotina está somando, vinculo link direto", "Relatório de Rendimento com Custo - CFAB85.pdf", "ROTINA:\n\nSuprimentos\nPlanejamento Necessidade de Materiais Abastecimento (MRP)\nPlano Abastecimento Materiais - Requisição ALTERAÇÃO:\n\nAo fazer um estorno de abastecimento a quantidade referente a medição deve ser zerada, por que hoje a rotina não\nestá zerando, e ao fazer um novo abastecimento com uma nova medição, a rotina está somando a medição anterior\ncom a nova logo, deixando errada a informação em tela e nos demais relatório que usam essa informação.\n\nAnexo do pedido serviço:\n\nMedição 80.  \nDeleta o abastecimento e faz um novo, conforme prints abaixo.\n\nO correto é 180,2 e não 260,2. A rotina está somando as medições já existentes, não está certo.    Zzzzzzzzzzzzzzzzzzzzzzzzzz\n\nPorém Can"], "121-46": ["Relatório de Rendimento com Custo (CFAB85) — rendimento com custo, quantidade de entrada, posterior ao abastecimento", "Relatório de Rendimento com Custo - CFAB85.pdf", "Pedido Serviço: 23164 Solicitação:\n\nROTINA:\n\nManufatura\nChão de Fábrica (SCF) Relatórios de Produção\nRelatório de Rendimento com Custo ALTERAÇÃO:\n\n- Ajustar relatório (CFAB86 e CFAB107) gerado pelo programa \"Relatório Rendimento com Custo - CFAB85\", para\ntrazer na coluna da quantidade primária, a medição informada no abastecimento da matéria prima, ou seja, a\nprimeira medição informada = a 1ª medição que encontrar... Hoje está trazendo a medição do processo que faz\nmedição intermediária, posterior ao abastecimento, como por exemplo, a medição do processo de semiacabado.\n\n- Fazer o mesmo ajuste no relatório (CFAB83) gerado pelo programa \"Relatório Rendimentos - CFAB78\".\n\nDocumentação:\nManufat"], "121-52": ["Relatório de Rendimento com Custo (CFAB85) — linha de totalização, gerado no relatório, respectivos componentes", "Relatório de Rendimento com Custo - CFAB85.pdf", "2. Criar uma opção para agrupar os materiais pelo componente.\n\nDocumentação:\nManufatura\nChão de Fábrica (SCF) Relatórios de Produção\nRelatório de Rendimento com Custo Detalhamento:\nCriado novo Relatório CFAB182 que pode ser configurado com a sequência 1 para geração no programa CFAB85 -\nRelatório de Rendimento com Custo.\nEsta nova versão é similiar ao CFAB86, porém, gera os dados de custo abertos por componente.\n\nRelatórios:\nCFAB182 | Sequência 1 (Report) Validação:\n\n63529_Val_241024\n\nPartindo da validação anterior “63529_Val_231024”...para concluir os itens vistos nas validações anteriores:\n\naqui, gerando o relatório selecionando um Produto, onde serão gerados todas as OFs de um Produto (ne"], "121-53": ["Relatório de Rendimento com Custo (CFAB85) — utiliza o custo, qtde de consumo, junto com wagner", "Relatório de Rendimento com Custo - CFAB85.pdf", "Em 10 ha Técnica Curtume – EPRO34-EPRO35_CURTUME...pdf", "Exemplo de utilização do programa Descritivos Técnicos – EPRO54:\n\nVinculado no EPRO15...\n...e passa a gerar no Relatório EPRO34/ EPRO35_CURTUME  \n...e em emissões de OFs:"], "125-5": ["Relatório Ficha Técnica Curtume (EPRO34) — Exemplo de “Relatório Ficha Técnica Curtume – EPRO34-EPRO35_CURTUME”", "Relatório Ficha Técnica Curtume – EPRO34-EPRO35_CURTUME...pdf", "Exemplo de “Relatório Ficha Técnica Curtume – EPRO34-EPRO35_CURTUME”:\nAcessado o Krumenauer em 190525...exemplo tela abaixo...\n...e o PDF completo está salvo na mesma pasta deste .docx, com o nome:\n-“Relatório Ficha Técnica Curtume – EPRO34-EPRO35_CURTUME.PDF”   xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx  "], "126-0": ["Remessa Industrialização (ESTO25) + ESTO81 — relatório de formulações, agregado, posteriormente", "Relatório Formulações (ESTO81, gerado a partir do programa ESTO25).pdf", "Relatório de Formulações (ESTO81), posteriormente este relatório também foi agregado ao programa MPSP46.."], "129-1": ["Encerramento de Ordem de Fabricação (CFAB1) — Teste Wellour, questão dos semi-acabados", "Rotina Beneficiamento com a produção intermediaria interna de semi-acab de terceiros.pdf", "De: Marcio - Kunden [mailto:marcio@kunden.com.br]\nEnviada em: terça-feira, 25 de outubro de 2016 19:03\nPara: Marcio Reni Schneider (Kunden Systems)\nAssunto: Teste Wellour, questão dos semi-acabados...\nPartindo desta NFE Excluir:  Abastecimento para semi-acabado... \n\nAqui, como ficou pos abastecimento:\n\nGerou OK aqui...  \nApontado e gerou o semi-acabado...\n\nGerou OK para cá...   Pedido beneficiamento final...\n\nAbastecimento...unica questão: traz tudo o que é disponível...\nAí neste caso, talvez teria que se criar um grupo para semi-acabados por cliente, e vincular no produto acabado...   Abastecido:\n\nEstoque ficou OK:   OF OK:\n\nApontamento final:   Trouxe para cá...OK:\nOK os 41,55 m2 / 50 pcs,"], "130-1": ["Programas (ADMI6) — recebimento de nota, venda que terá, utilização deste material", "Rotina Beneficiamento recebendo uma nota triangular de um material para beneficiar, e posterior retorno.pdf", " \nAqui, mais um exemplo de Estoque em Depósito, advindo de um recebimento de nota triangular.\nEste exemplo será utilizado no teste abaixo de posterior utilização deste material (consumo) e seu Retorno (NF de Retorno e Faturamento)...\n\n...aqui, detalhando os Lotes vinculados ao recebimento da NF de Entrada Triangular. \nAqui, Pedido de Venda que terá utilizado o material do recebimento de nota triangular...\n\n...e aqui o respectivo Plano de Produção gerado pelo Pedido de Venda acima...  \nAbastecimento sendo realizado pelo material do recebimento de nota triangular... \nSituação do Estoque antes e depois do abastecimento realizado...\n\nAqui, tendo ocorrido o apontamento da Produção final respectiv"], "131-1": ["Encerramento de Ordem de Fabricação (CFAB1) — PROGRAMA/ROTINA NOVA: CALCULO DA NECESSIDADE DE FORMULA PARA CURTUME, COM BASE NA PESAGEM…", "Rotina Calculo da Necessidade de Formula para Curtume.pdf", "Pedido Serviço 5013:\n\nSolicitação:\nPROGRAMA/ROTINA NOVA: CALCULO DA NECESSIDADE DE FORMULA PARA CURTUME, COM BASE NA PESAGEM DA OF\n\nPara processo de Recurtimento:\né necessário haver um processo de registrar a pesagem da OF.\nÉ uma terceira unidade de medida do produto (já controlado em M2 e couros (rotina de Unidade de Controle,\nconfigurado na Estrutura de Produto).\nA partir desta pesagem da OF, a geração de necessidade de fórmula de recurtimento tem que ser baseado nesta pesagem.\n\nDocumentação:\nPROCESSOS (PREC7)\nO programa passa a apresentar dentro de um quadro denominado Apontamento a coluna Excedente.\nTambém, neste quadro, está a nova coluna denominada Informar Pesagem no apontamento.\nO va"], "132-7": ["CFAB39 — Testes feitos para Soubach, em 082017", "Rotina Custos_Custeio para Curtume.pdf", "Testes feitos para Soubach, em 082017:\n\nSoubach_CEPs, refila (subproduto), e descartes de couro semi-acabado.\nFeito em 210817:\n\nConfiguração tudo como Integrado:\n\nOF original: \nApontamento de CEP de Subproduto:\n\nCEP utilizado:  \nCusto: fez 5,50 (custo Standard) x 0,70 = 3,85\nDetalhe: criei operação especifica, vinculada ao cadastro no CEP  \nAqui, desclassificação ocorrida junto com o apontamento (abrindo a tela do CEP junto com o apontamento):\n\nDe novo, fez pelo custo Standard:\nCusto Standard 30,00 X 0,70 = 21,00  \nAqui, apontamento final: desclassifiquei mais alguns couros no final (semelhante acima):\n\nE o apontamento final: \nEntrada ao estoque ocorre de novo de acordo com o custo standard "], "132-8": ["Administração Cadastros Parâmetros (ADMI8) — cadastro de tempos, venda e custeio, separar matéria prima", "Rotina Custos_Custeio para Curtume.pdf", "Pedido Serviço 20283_Val_0401171\nCÁLCULO PREÇO DE VENDA E APROPRIAÇÃO DO CUSTEIO: PASSAR A UTILIZAR OS TEMPOS PADRÕES REGISTRADOS\nNO PROGRAMA \"CADASTRO DE TEMPOS - PREC36\" ROTINA:\n\nVendas e Distribuição\nFormação Preço de Venda\nCálculo Preço de Venda Controladoria Custos Apropriação do Custeio ALTERAÇÃO:\n\nPassar a utilizar os tempos padrões registrados no programa \"Cadastro de Tempos - PREC36\" para as rotinas dos\ncálculos de FPV e Custeio, para as empresas que utilizam o cadastro de tempos padrões por este programa ao invés\ndo programa \"Ficha de Operações\" (que está em Manufatura/Processos/Processos).\n\nDocumentação:\nNo programa Máquinas x Operações x Demãos(PREC32) foi adicionado um \"Check-bo"], "132-10": ["Relatório de Rendimento com Custo (CFAB85) — Gerou estes dados", "Rotina Custos_Custeio para Curtume.pdf", "Gerou estes dados:  \nExemplo 1º processo, onde há apenas 1 registro de tempo, 1 Recurso, 1 Processo:\n\nUtilizou tempo abaixo 0,0880 min X Tarifa FPV $0,60 = custo total deste processo = $ 0,0528 zzzzzzzzzzzzzzzzzzzzzzzzzzzzz\n\nExemplo Processo que tenha mais Recursos com diversos tempos:\nNeste caso utilizado opção de efetuar media dos tempos, não marcando o “Recurso Padrão”:  \nVeja o tempo cadastrado: media dos 3 registros de recursos diferentes: 0,7653 minutos\n\nEntão: 0, 7653 min X Tarifa FPV $0,60 = custo total deste processo = $ 0,4592 (de acordo com FPV acima).\n\nZzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz\n\nExemplo Processo 173 que tenha mais Recursos com diversos tempos:\nNeste caso utilizado "], "132-17": ["Estorno de Apontamento de Ordem de Fabricação (CFAB10) — Soubach_Avaliação da OF que ficou com qtde zerada, pós exclusão de abastecimento", "Rotina Custos_Custeio para Curtume.pdf", "\n\nSoubach_Avaliação da OF que ficou com qtde zerada, pós exclusão de abastecimento\n\nSituação de problema de custeio ocorrida no Soubach, no fechamento do Custeio...de março/20.\nOcorre quando fica zerado após uma exclusão de abastecimento de Wet Blue...\n(mas tinha consumo de formulas)\nNesta situação, distorceu custeio, porque como zerou a qtde da OF, considerou como Produzida...\nMas não tinha apontamento, com isso não tinha entrada ao estoque de Produto Pronto para levar o custo do consumo de formulas...\nColocar uma trava?\nVoltar à qtde original da OF?\n\nTeste efetuado na BD Desenv:\nAqui, a situação da OF original...\n\nEfetuado o abastecimento...  \nAtualizou qtde da OF...   ...mostra abastecime"], "133-2": ["Encerramento de Ordem de Fabricação (CFAB1) — atualizou estoque, vinculada a categoria, questão do abastecimento", "Rotina de Correção.pdf", "Testes feitos em 30052016.\n\n-Deixei vinculada a categoria de Pedido de Venda “normal”, que permite faturamentos (a mesma categoria utilizada\npara fazer o beneficiamento normal).\n- também o parâmetro de inicialização ALTERACAO_LIBERADA = S.\n\nAlterar a “Categoria” deste Lote Produção para “Beneficiamento”. Também necessário informar o valor de cobrança,\nna aba Itens, para ser sugerido ao gerar NF de Saída Faturamento. \n...e no programa “Copia de Ordem de Fabricação”:\nÉ necessário substituir o processo final 38- MEDIR EXPED CORREÇÃO, pelo processo 26-MEDIR EXPEDICAO (é para\ndesfazer o que foi feito inicialmente, documentado acima nos primeiros procedimentos).\n\nE com isso fazer o apontamento pel"], "134-1": ["Cópia de Ordem de Fabricação (CFAB59) — Em 191120: Xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx Testes em 231120", "Soubach_TESTE, QUESTÃO DE USAR U.M. DIFERENTE DO PADRÃO M2.pdf", "Em 191120:   Xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx Testes em 231120:\n\nEstava assim antes da originalmente:  \nInclui a Configuração “E” no PREC35...\n\nEfetuado o apontamento pelo CFAB90:  \n...porém de igual maneira não trouxe o tempo no Custeio, aqui:\n\nZzzzzzzzzzzzzzzzzzzzzzzzzzz\n\nNovo teste: agora, incluindo um novo registro no PREC36 (apenas com o acréscimo da Unidade de Medida).  \nEfetuado o apontamento pelo CFAB90:\n\n...porém de igual maneira não trouxe o tempo no Custeio, aqui:\n\nXxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx  \nNovo teste: agora, incluindo:\n-no PREC35: incluindo configuração “C” do Produto\n-no PREC36: um novo registro no PREC36 (com o acréscimo de Produto e da Unidade de Medida)."], "135-0": ["Tipo de Ordem de Fabricação (CFAB103) — tipo de ordem, cfab curtume, produção da classificação", "Tipo de Ordem de Fabricação – CFAB103.pdf", "Tipo de Ordem de Fabricação – CFAB103..\n\n19918_Val_300816 Pedido Serviço: 19918 Solicitação:\n\nROTINA:\n\nManufatura Ordem de Fabricação ALTERAÇÃO:\n\n1= Criar cadastro novo \"Tipo OF\".\nExemplos de Tipos de OF que serão utilizados no segmento Curtume: Amostras, Retrabalho, Venda, Beneficiamento,...\n\n2= No programa Categorias de Pedido - PEDI2, permitir vincular qual o \"Tipo de OF\" padrão a ser vinculado na OF, na\ngeração das OFs a partir do Plano de Produção e a partir do Pedido de Venda com parâmetro de inicialização PEDIDO_SIMPLIFICADO = S.\nNão é obrigatório o vinculo do Tipo OF neste cadastro.\n\n3= No programa \"Cópia de OF\" ao criar uma nova OF possibilitar escolher o tipo de OF (trazer o padrão"], "135-4": ["Tipo de Ordem de Fabricação (CFAB103) — Criar check box que  gravado ao digitar\no apontamento pelo CFAB1 quando é um processo marcado como retrabalho que utiliza o Parâmetro 50104 para\ngravar o registro no PREC12.\n\nVer exem"], "138-17": ["CFAB90 — APONTAMENTO MULTITAREFA: TRATAR MOTIVO PELA QUAL ESTÁ GERANDO MENSAGEM INDEVIDA ROTINA", "Apontamento MultiTarefa – CFAB90.pdf", "Pedido Serviço: 18925 Solicitação:\nAPONTAMENTO MULTITAREFA: TRATAR MOTIVO PELA QUAL ESTÁ GERANDO MENSAGEM INDEVIDA ROTINA:\n\nManufatura Chão de Fabrica Lançamentos Apontamento MultiTarefa ALTERAÇÃO:\nAvaliar/tratar motivo pela qual está gerando mensagem indevida de \"ORA-06502: PL/SQL: numeric or value error\nORA-01403: o data found\" ao informar o recurso número 499 no apontamento.\n\nE após clicado no OK na mensagem, já traz o campo Turno informado (indevidamente)...onde o correto é trazer o\nturno da entrada de dado que o usuário informa, após ter informado o Recurso. Ou seja, o turno nunca é sugerido.\n\nSituações na BD Desenvolvimento.\n\nDocumentação:\nO programa Apontamento MultiTarefa (CFAB90) fo"], "138-35": ["CFAB90 — Para registrar evento de parada: testado em 160318, para instrução para Nimo", "Apontamento MultiTarefa – CFAB90.pdf", "Para registrar evento de parada: testado em 160318, para instrução para Nimo:\n\nTem que ter aqui o cadastro do evento a utilizar:\n\n1º informar o Recurso: \n2º informar o evento (do cadastro de Eventos de CRP):\n\n3º: das SIM, e vai limpar a tela... \nEnquanto estiver em limpeza, consultando vai mostrar:\n\nDepois que concluir a limpeza:\n\n1º Colocar o recurso: \n2º e SIM: aí vai limpar e concluir na tabela a limpeza...\n\nVeja que com isso gerou os dados do Evento no Extrato (no abaixo, fiz 3 testes de Limpeza): "], "138-36": ["CFAB90 — Erro que ocorreu na BD Amcm", "Apontamento MultiTarefa – CFAB90.pdf", "Erro que ocorreu na BD Amcm:\n“ORA-20000: Erro CALCULA_CUSTO_APONTAMENTO_P: ORA-01476: divisor is equal to zero”.\n\nMotivo:\nÉ quando houve apontamento nos primeiros processos...na qtde da OF de acor xxxxxxxxxxxxxxxxxx\n\nPara um “Desvio de Processo”:\n“Desvio de Processo” significa acrescer mais um processo no fluxo...pode ser ou não ser um processo que já está no\nfluxo normal."], "141-8": ["CFAB90 — *Extensão do acima, sobre “Eficiência”", "Instruções programa CFAB90.pdf", "*Extensão do acima, sobre “Eficiência”:\n-os apontamentos feitos por esta rotina do programa CFAB90, integram para a eficiência, porém integram com o\ntempo da Ficha Descritiva vinculada nos Produtos (assim como os demais apontamentos, exemplo pelo CFAB1 usado\npelos Calçados)...para o calculo de não é considerado o intervalo de tempo entre o Apontamento de Início e\nApontamento de Término do CFAB90.  \nEu e Roberto entendemos que esteja correto assim...porque se fosse diferente, considerando o tempo entre início e\ntérmino do CFAB90 como os “Minutos Produtivos”, então a eficiência/produtividade sempre seria 100%, o que não seria o real...\n\nO controle pelo Apontamento de Início e Apontamento de Té"], "141-9": ["CFAB90 — controle producao, tabela que grava, início do apontamento", "Instruções programa CFAB90.pdf", "De: Cristiano Andres [mailto:cristiano@kunden.com.br]\nEnviada em: sexta-feira, 21 de outubro de 2016 07:49\nPara: Marcio Reni Schneider (Kunden Systems) Assunto: CFAB90 Oi Marcio,\n\nSegue a tabela que grava o início do apontamento no CFAB90;\n\nSELECT * FROM CONTROLE_PRODUCAO_OF_ATM;\nDELETE CONTROLE_PRODUCAO_OF_ATM; "], "141-11": ["CFAB90 — Para registrar evento de parada: testado em 160318, para instrução para Nimo", "Instruções programa CFAB90.pdf", "Para registrar evento de parada: testado em 160318, para instrução para Nimo:\n\nTem que ter aqui o cadastro do evento a utilizar:\n\n1º informar o Recurso:\n\n2º informar o evento (do cadastro de Eventos de CRP):  \n3º: dar SIM, e vai limpar a tela...\n\nEnquanto estiver em limpeza, consultando vai mostrar: \nDepois que concluir a limpeza:\n\n1º Colocar o recurso:\n\n2º e SIM: aí\n\nDepois que concluir a limpeza:\n\n1º Colocar o recurso:\n\n2º e SIM: aí vai limpar e concluir na tabela a limpeza... \nVeja que com isso gerou os dados do Evento no Extrato (no abaixo, fiz 3 testes de Limpeza):\n\nZzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz\n\nExtensão da questão de registrar os Eventos pelo CFAB90, testado em 031122 na im"], "141-12": ["CFAB90 — Como utilizar a função de AGRUPAMENTO – comando AG", "Instruções programa CFAB90.pdf", "Como utilizar a função de AGRUPAMENTO – comando AG:\n\nNo caso, efetuar a produção agrupando varias OFs sendo feito no mesmo apontamento, sendo produzidas no mesmo\nmomento e pelo mesmo Recurso:\n\nUtilizando esta configuração:\n\n(Tiago: esta configuração está feita no Nimo...basta você utilizar o novo programa que deixei configurado no Menu,\nconforme mostra na 2ª tela abaixo...) \n...na Nimo, utilizar este programa, que tem as configurações acima:\n\nIniciando o apontamento:\n1º, informar o Recurso \n2º, informar o comando AG, de Agrupamento\n\nAqui (apenas para conferir), veja que a rotina trouxe automático a palavra AGRUPAMENTO: \n3º fazer a leitura do código de barras das OF (código que representa a s"], "142-0": ["Consulta Ordem de Fabricação (CFAB2) — mês de março, couros hidro, voce me enviou", "Couros_Hidro_Descarte de OFs para não gerar “Em Fabricação”.pdf", "Couros_Hidro_Descarte de OFs para não gerar “Em Fabricação”..\n-Situação inicial apresentada:\n-Os marcados com “X” é, cfe solicitado, para “tirar do Estoque” (ou seja, neste caso, deixar de gerar\ncomo “Em Fabricação” pelo programa ESTO41)\n\nComo tratar tal situação:\nExemplo este produto código 5126, tem 2 OFs que foram geradas como “Em Fabricação”: podes ver\nna tela abaixo, no campo “OF” Apenas para entendimento:\nEstas 2 OFs tiverem o “Abastecimento WB” realizado, por isso é que estão considerados como “Em Fabricação”  \nPara fazer um “Descarte” destas OFs e zerar a quantidade da OF:\n\nIr neste programa CPRO4 e fazer um lançamento de “Couro Desclassificado” para cada OF ...\n-Os\n\nOF:\n\nIr neste pr"], "143-2": ["EPRO105 — Vai abrir esta tela", "Hidro_Passo a Passo para criar um novo Produto, com Formulas e Processos.pdf", "Vai abrir esta tela:\n-Clicar na aba “Processo”\n-Vai abrir a listagem dos Processos do Artigo utilizado como base para a cópia;\n-Vai permitir incluir novos processos, ou excluir Processos, ou substituir diretamente o código dos\nprocessos, exemplo tela abaixo.\n-Se precisar incluir ou substituir o código dos processos, podes clicar no botão da flecha azul\npara abrir a lista de processos, e escolher o novo processo  \nNesta mesma aba, tem o campo dos “Descritivos Técnicos” , exemplo tela abaixo...\n-Esta coluna está mais à direita da coluna dos Processos, então é necessário usar a barra de rolagem indicada abaixo...\n-Pode incluir, apagar ou substituir os “Descritivos Técnicos” .\n-Se precisar inclu"], "144-1": ["Gerar Remessa para Embarque (CEXT18) — venda exportação, volumes peso liquido, seguir o próximo", "PROCESSO DE EXPORTAÇÃO.pdf", "De: Claudia (Krumenauer) <krumenauer@krumenauer.com.br>\nEnviada em: quarta-feira, 6 de novembro de 2024 08:23\nPara: Marcio Reni Schneider <marcio@kunden.com.br>\nAssunto: Processo de exportação Bom dia Marcio,\nConforme nosso contato telefônico, segue passo a passo dos processos que são feitos na área da exportação.\nEle foi feito há muito tempo mas pode ser considerado, pois utilizamos o mesmo processo atualmente.\nCaso precise acompanhar um processo, podemos marcar.\nObrigada, Claudia Rocha Export/Import Cortume Krumenauer\n\n1- Pedido de Venda Exportação\n\nCriar PEDIDO DE EXPORTAÇÃO: Pedido de Venda Exportação >\n\nPreencher na aba ITEM os seguintes campos:\n\n- PRODUTO: Cód do Produto indicado na fi"], "144-3": ["CEXT84 — embarques a faturar, frete nacional, onicron", "PROCESSO DE EXPORTAÇÃO.pdf", "EMAIL P/ EURO: INVOICE + PACKING + COMISS + NF PDF +XML Aéreo: mauricio@euroamerica.com.br groll@euroamerica.com.br Marítimo ÁSIA: jardel@euroamerica.com.br Marítimo EUA: jessica@euroamerica.com.br\nMarítimo Europa: Camila camilat@euroamerica.com.br\nColocar junto aos e-mails SEMPRE: neider@euroamerica e certificados01@bioseta.com.br (em caso de embarque de pallets). \nNOTA FISCAL DE EXPORTAÇÃO:\n1º PASSO\n• Calcular o valor da NOTA FISCAL (R$) que é: valor total da fatura em USD X ptax do dia\n• Frete internacional em reais R$ e USD\n• Frete Nacional em reais R$ e USD\n• Se for caixas pequenas pedir coleta SEM CUSTO com a Euro-América (confirmar com Rafael ou Maurício).\nP/ calcular o Frete Nacional"], "144-5": ["Gerar Remessa para Embarque (CEXT18) — 1- Pedido de Venda Exportação Pedido cadastrado", "PROCESSO DE EXPORTAÇÃO.pdf", "1- Pedido de Venda Exportação Pedido cadastrado: \n...o que permite abrir a tela “Fator de Conversão” acima é esta configuração abaixo...   Importante:\n-O Pedido de Venda acima foi cadastrado como “A Produzir”, gerado as OFs e Apontado.\n-O Apontamento foi feito com as qtdes de Unidade Primária e Unidade Secundária exatamente com a mesma qtde\nda OF (o que permitiu que fosse utilizado a configuração de Reserva (sem ainda estar desenvolvido o pedido de\nserviço 66755), e com isso ocorrido a reserva no Estoque cfe tela abaixo):  \n3. PROCESSO DE EXPORTAÇÃO: programa CEXT84\nBuscar pelo último processo (f7 + f8) do cliente da ficha, copiar e duplicar (f6 + f4) e preencher os seguintes campos...\n“ABA "], "146-0": ["Prima Couro / Fornecedor (CFAB101) — parte do apontamento, couro verde, entrada ao estoque", "PDS_avaliação das rotinas utilizadas_avaliação pós atualização patch 171.pdf", "PDS_avaliação das rotinas utilizadas_avaliação pós atualização patch 171..\n\nBD Pieles Interna.\n\nEste exemplo para usar de base:\n\nNFE de compra do Fresco:\n\nObs.: frete acima é de 150,00\n\nEstoque OK, custo e qtde:\n\nCalculo do Custo:\nCusto total dos 2 Produtos 7670,70 .....Frete Para estes 2 Produtos: 150,00\nCusto do 1º item 7585,20 => necessita agregar o valor “X” para o frete.\n\n((7585,20 * 150) / 7670,70) = 148,32 é o valor do frete correspondente ao 1º item.\nO resto dos 150,00 de frete, é para o 2º item. \n\nEntão, custo para o estoque do 1º item:\n7585,20 + 148,32 de frete = 7733,54, sendo que, unitário será 7733,54 / 1204 = 6,4232 Criado o LE:  Efetuado abastecimento:\n\nDetalhe: na qtde de med"], "146-1": ["Prima Couro / Fornecedor (CFAB101) — marca e produto, entradas ao estoque, tive que excluir", "PDS_avaliação das rotinas utilizadas_avaliação pós atualização patch 171.pdf", "Confirmado o acima, fez certo aqui a qtde...5, devido ser tiras (meios):   Estoque ok:  \nAbaixo, a sequencia dos apontamentos...\nImportante: não pode fazer como no exemplo abaixo, colocando os vários apontamentos dos vários produtos com\n“Marca” diferentes num único “Apontamento”.\nFiz esta tentativa abaixo mas tive que excluir todos os apontamentos, porque a rotina não gerou novos Lotes...ele\nacumulou tudo num mesmo Lote, e manteve a ultima Marca informada...e isso não pode para separar os dados no\nrelatório CFAB101 (já citado acima).\n\nÉ necessário fazer produto a produto, marca a marca diferente, e sempre clicando na opção “Lote Novo”, para gerar\num novo Lote no Estoque a cada marca e produt"], "147-7": ["Livro Inventário (ESTO15) — Guia de Remissión e Factura Olá Magoo,", "PDS_fluxo de Recebimentos e Faturamentos.pdf", "De: Cesar André Wagner (Kunden Systems) [mailto:cesar@kunden.com.br]\nEnviada em: sexta-feira, 4 de novembro de 2016 07:50\nPara: Claudemir Weber (Kunden Systems); Marcio Reni Schneider (Kunden Systems)\nCc: Thomas Fensterseifer (Kunden Systems)\nAssunto: RES: Guia de Remissión e Factura Olá Magoo,\n\nOk entendo, porém é desenvolvimento completamente novo.\nAté porque desta maneira vc não tem preço gravado.. o produto entra no estoque sem preço algum...\n\nA fatura só gera financeiro então o estoque e custo entram pela guia, pra isto ele precisa do pedido de compra... ele\nse baseia no preço do pedido para entrada no estoque, mesmo não exibindo.\nDepois a fatura busca isto pra gerar a nota,
