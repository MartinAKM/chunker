<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Program associations</title>
<style>
  :root{--ink:#1d2433;--muted:#5d6678;--line:#d6dbe4;--paper:#f7f8fa;--panel:#fff;--focus:#2f5fd0;--cross:#8a5a00}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 system-ui,"Segoe UI",sans-serif;color:var(--ink);background:var(--paper)}
  header{padding:14px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
  h1{font-size:17px;margin:0 0 4px}
  .muted{color:var(--muted)}
  main{max-width:1100px;margin:0 auto;padding:18px 20px 60px}
  .controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:end;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
  label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
  input,select,button{font:inherit;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 10px;background:#fff}
  #items{min-width:320px}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
  .chip{font:12px ui-monospace,Consolas,monospace;border:1px solid var(--line);border-radius:4px;padding:2px 7px;background:#fff;cursor:pointer}
  .chip.cross{border-color:var(--cross);color:var(--cross)}
  table{border-collapse:collapse;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
  th,td{text-align:left;padding:7px 10px;border-top:1px solid var(--line);vertical-align:top}
  th{background:var(--paper);font-weight:600;font-size:12px;color:var(--muted);border-top:0}
  td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .code{font-family:ui-monospace,Consolas,monospace;font-weight:600}
  .bar{height:6px;background:var(--line);border-radius:3px;min-width:60px}
  .bar i{display:block;height:100%;background:var(--focus);border-radius:3px}
  .tag{font-size:11px;color:var(--cross);border:1px solid var(--cross);border-radius:3px;padding:0 4px;margin-left:4px}
  details{margin-top:4px}
  summary{cursor:pointer;color:var(--focus);font-size:12px}
  .ev{border-left:3px solid var(--line);padding:4px 10px;margin:6px 0}
  .ev pre{white-space:pre-wrap;font:12px/1.5 ui-monospace,Consolas,monospace;margin:4px 0 0;max-height:220px;overflow:auto}
  mark{background:#ffe38a}
  h2{font-size:15px;margin:22px 0 8px}
  .empty{padding:20px;color:var(--muted)}
  .wrap{overflow-x:auto}
</style>
</head>
<body>
<header>
  <h1>Program associations</h1>
  <div class="muted" id="info"></div>
</header>
<main>
  <div class="controls">
    <label>Programs or messages changed (separate with spaces or commas)
      <input id="items" list="all" placeholder="e.g. PEDI4 FATU61" autocomplete="off">
      <datalist id="all"></datalist>
    </label>
    <label>Min. documents <input id="mindocs" type="number" min="1" value="2" style="width:80px"></label>
    <label>Min. lift <input id="minlift" type="number" min="1" step="0.5" value="2" style="width:80px"></label>
    <label>Show <select id="scope"><option value="all">all recommendations</option><option value="cross">other modules only</option></select></label>
    <button id="go">Recommend</button>
  </div>
  <div class="chips" id="picked"></div>
  <section id="result"></section>
</main>

ulta, posicionar-se no campo Descrição, informar a descrição do nível pai desejado.\n\nInformar a descrição completa, ou informar a descrição parcial sendo que neste caso deverá ser utilizado o sinal de ao início e ao final de cada parcial da descrição informada, que representará o início, a inter"], "0-1": ["Pessoas Físicas/Jurídicas (ADMI34) — campos: Empresa, Unidade Negócio, Nome, Cidade, CNPJ", "Documentação IA_Cadastro de Produto até Faturamento.pdf", "2. Abrir o programa Pessoas Físicas/Jurídicas-ADMI34 2.1. Posicionar-se no campo Empresa. Tendo a informação do código da Empresa, informar diretamente o código da Empresa desejada.\nCaso contrário, tecle F9 ou clique no botão Lista para abrir a lista de valores do campo.\n\nLocalizar a Empresa desejada, e efetuar 2 clics sobre esta Empresa ou clique no botão OK, que fechará a lista de valores e voltará à tela inicial do programa Estruturação de Produto-EPRO15 com a Empresa selecionada.\n2.2. Posicionar-se no campo Unidade Negócio. Tendo a informação do código da Unidade Negócio, informar diretamente o código da Unidade Negócio desejada.\nCaso contrário, tecle F9 ou clique no botão Lista para abr"], "0-3": ["Liberação Pedidos Faturamento (PEDI4) — campos: Liberação, Entrega, Liberar, Operação, Faturar", "Documentação IA_Cadastro de Produto até Faturamento.pdf", "4. Abrir o programa Pedido Venda-PEDI4 4.1. Posicionar-se no campo Pedido e informar o Pedido. 4.2. Navegue para a aba Liberação. 4.3. Na sub aba Entrega: selecionar a(s) Entrega(s) que deverão ter realizada a liberação, clicando no(s) respectivo(s) check box da direita da tela.\n\n4.4. Clique no botão Liberar. 4.5. Navegue para a aba Liberação. 4.6. Posicionar-se no campo Operação. Tecle F9 ou clique no botão Lista para abrir a lista de valores do campo. Localizar a Operação desejada, e efetuar 2 clics sobre esta Operação ou clique no botão OK.\n4.7. Clique no botão Faturar. Neste momento será gerada e aberta a tela do programa Nota Fiscal de Saída-FATU2.\n4.8. Navegar para a aba Volume, posici"], "2-0": ["Materiais e Controle de Ordem de Fabricação (ESTO112) — nfs de entrada, quantidade secundária, utiliza uma operação", "Documentação frigorificos.docx", "Frigorífico recebe suínos de produtores rurais e de cooperativas .\nAs NF são lançadas manualmente, mas poderiam muito bem serem recebimentos de pedidos de compra.\nNas NF de entrada, quando lançado de produtor rural que não possui NF eletrônica, consta apenas um item que na operação movimenta apenas estoque. Quando lançado de cooperativa ou de produtor que emite NF eletrônica, deve ter dois itens na NF, uma com o item da NF que está recebendo, a operação deve controlar entradas, livros, etc , mas não controla o estoque, e o segundo item utiliza uma operação que só controla estoque e não controla outros registros de entrada.\n\nNa NF de entrada, é informado a marca dos animais(suínos) , assim co"], "2-3": ["Prima Couro / Fornecedor (CFAB101) — contra nota, seria dos itens, relação ao item", "Documentação frigorificos.docx", "No RECE50 também é possível gerar a contra nota , veja que o item de cozido, já exibe a quantidade de quebra .\nNos itens, são exibidos as condenas que na configuração de eventos contra nota, é pago um percentual pela condena.\n\nJá os produtos de graxaria ou que não são pagos nada para o produtor, essas condenas são exibidas nas observações da contra nota.\n\nPara produtores que emitem NF eletrônica, deve ser gerad o o relatório de diferenças no próprio RECE50.\nEste relatório compara os dados que seria dos itens da contra nota em relação ao item que apenas movimenta financeiro . Essa diferença deve ser base para NF complementar ou de devolução.\nNo exemplo abaixo, seria uma NF de devolução com 12"], "2-5": ["Liberação Pedidos Faturamento por Rota (FATU153) — Ivendre Android", "Documentação frigorificos.docx", "Ivendre Android\nNo iVendre vai exibir o estoque de lotes que estão liberados\nVeja que o produto 25.2534 não possui estoque no iVendre\nMas se consultar no ERP, exibe um total de 47,30kg... todos os lotes com produção no dia de hoje 04/06/2024.\nNão exibiu no iVendre , pois neste produto tem uma configuração que só libera para venda depois de 2 dias.\n\nAo tentar enviar um pedido de produtos a produzir, gera mensagem que produto não possui planejamento de vendas , isso ocorre pois a categoria de pedido está marcada para exigir planejamento de vendas. \nO planejamento de venda é feito no programa VEND122\nApós o planejamento, o pedido entrou na base\n1 item a produzir e 1 item venda estoque (pronta e"], "3-0": ["Registro Controle Produção e Estoque (ESTO19) — TESTE CONSIGNAÇÃO", "Rotina Consignação.pdf", "TESTE CONSIGNAÇÃO –\nUsaremos o produto 306876 que não tem movimentações:\n\nImplanto saldo:\nCom o saldo na localização vou criar rótulos através do ESTO89:\n\nVamos agora usar o programa ESTO23:\nRótulos estão na localização 166:\n\nCom os rótulos na localização correta vamos criar um pedido de venda:\n\nComo nestes casos estamos selecionando os rótulos da localização de consignados, teríamos que saber quais que\nsão, ou fazer a transferências diretamente do saldo avulso para ser mais simples a identificação do saldo ao selecionar no pedido.\nE para conseguirmos fazer isso será necessário adicionar a localização nos seus respectivos centros de distribuição, conforme fiz aqui:\n\nApós isso vamos ao progra"], "5-0": ["CONT40 — preparar e contabilizar, gerar relatório publisher, tiveram apontamento", "Rotina Custeio e Conferencias Pós Custeio Kunden.docx", "1° - Contabilizar estoque, notas de entrada , CPV, notas de saída e financeiro, realizar ajustes e conciliações.\n2° - No programa CUST20, informar o período e fazer uma primeira verificação de tarifas, caso apresente LOGs , deverão ser analisados e corrigidos antes do próximo passo. \n3° - Gerar relatório Publisher para verificação dos tempos trabalhados de todos setores que tiveram apontamento de produção: \n4° - Cadastrar tempos do relatório do item 3 no programa CONT40 nos seus devidos Centro de Custo. \nSugestão: informar 0,00 nos centos de custo que não tiveram apontamento no mês, isso facilita encontrar possíveis diferenças no fechamento.\n5° - Copiar/Criar Tarifas de Mão de Obra e GGF no "], "6-0": ["CONT59 — geração das tarifas, regras de rateio, verá ser ajustada", "Rotina Custeio Kunden.docx", "O proces so de custeio da Kunden toma como base as o rdens de fabricação . Cada ordem de fabricação vai ter seu custo de materiai s, mão de obra , gasto gerais de fabricação e terceirizações . Durante o mês a ordem de fabricação s ó car rega t empos, materia i s e terceiros . Os demais gastos devem ser agregados pela rotina de custeio . Para agregar estes cu sto s , deve -se gerar uma tarifa de cu sto minuto para depois atualizar rodando o r ecalculo de custeio . A ro tina de recalculo va i atualizar o cu sto das ordens de fabricação e também os registros de inventario. Por este motivo é muito importante que inicie o proce s so de cu ste i o depois que toda a contabilidad e do mês esteja con"], "6-1": ["CONT53 — relatório contábil, entrada de produ, conciliação do custeio", "Rotina Custeio Kunden.docx", "Isto não pode ser completamente detectado antes da primeira geração de bases de rateio e tarifas, pois o rateio não havia sido executado ainda. Atualização das tarifas. Uma vez rodada a rotina acima, o sistema irá atualizar os valores das novas tarifas no cadastro de tarifas. Tanto para mão de obra, quanto para GGF.  Recálculo do Custeio. Nesta fase do processo, as OF’s com movimentos no mês terão seus movimentos do mês em questão atualizados. Ele irá atualizar Materiais pelo custo médio correto, MOD e GGF pelas tarifas acima geradas. O valor de terceiros não mudará devido a alocação direta por valores da nota de retorno de terceirização. Também serão atualizados os custos de entrada no esto"], "6-2": ["CONT12 — Ge rar P rodutos em Elaboração", "Rotina Custeio Kunden.docx", "Ge rar P rodutos em Elaboração\nEsta ro tina va i gerar os produtos em fabricação dos mê s com base no custeio . Este s valor es são sempre os valores das ordens de produç ão que ainda não t i veram apontados todos os proces s os. Sempre ao final do mês esta rotina deve ser ge rada. Com isto a rotina guarda os valores mensa is, revertendo os valores do mês anterior e agregando os valores e qu antidad es no vos.    \nContabilização do Cu ste i o\nContabilização do cu ste i o. Para contabilizar o cu ste i o deve -se sele cionar as opções “Cu ste i o” e “Prod. Fabricação ”. Fazer a preparação e a contabilização . \nFechando os valores ge rado s pelo cu ste io na contabilidad e . Primeiramente olham"], "7-0": ["Remessa Industrialização (ESTO25) — ESSA É A ROTINA CERTO DE GERAÇÃO DO FCI ATRAVES DO esto71 BASE DESENVOVLIMENTO", "teste_69828.docx", "ESSA É A ROTINA CERTO DE GERAÇÃO DO FCI ATRAVES DO esto71 BASE DESENVOVLIMENTO\nUTILIZO O PROGRAMA ESTO25 PARA FAZER A TRASFERÊNCIA DE PRODUÇÃO, INFORMO UM PLANO, INSIRO SALDO POR IMPLANTAÇÃO NOS ITENS QUE NÃO TEM ESTOQUE, E SELECIONO \nAQUI, VOU TRANSFERIR OS MATERIAIS DA LOCALIÇÃO 9938 PARA A 5116 QUE É DE OUTRO ESTABELECIMENTO: \nMOVIMENTO GERADO, ENTÃO AGORA, ELE VAI ESTAR POSICIONADO NO PROGRAMA ESTO71 PARA GERAR A NOTA: \nNO PROGRAMA ESTO71, FILTREI O DESTINO, E VOU INFORMAR A OPERAÇÃO QUE SERÁ UTILIZADA NA NOTA: \nUTILIZO A OPERAÇÃO 151.1 QUE É DE TRANSFERÊNCIA, RETIRANDO O SALDO DE DISPONIVEL PARA O EM TRÂNSITO QUANDO A NOTA FOR CONFIRMADA: \nNOTA FOI GERADA, E O ITEM EM DESTAQUE COM UM QU"], "9-0": ["Transferência entre Localização (ESTO23) — estoque na localização, transferir as qtdes, sequência é utilizado", "CONSIGNAÇÃO, Passo a Passo.pdf", "CONSIGNAÇÃO, Passo a Passo (este .docx disponibilizado por Guilherme em 160526, porém elaborado em 2022)\nEste passo a passo criado em resposta ao RA 260514017:\nhttps://kundencloud.com.br:3825/atendimento?id=260514017&callType=customer\nImportante: atentar-se às configurações das Operações, às Classes de Operações a serem vinculadas.\nAbaixo exemplo de um Produto, com saldo em Estoque, na Localização padrão dos Produtos Prontos...\n\n-Na sequência, é utilizado o programa “Transferência Localização-ESTO23”, para transferir as qtdes que serão\nenviadas na Remessa de Consignação.\n-É utilizado o controle de uma Localização diferenciada, para facilitar o controle das qtdes enviadas e em saldo “em consi"], "9-1": ["Relatório Posição Plano de Produção (CFAB24) — efetua a efetiva, remessa oper, configuração da operação", "CONSIGNAÇÃO, Passo a Passo.pdf", "Fazer o retorno, com o lançamento da NF Entrada, através do programa “Recebimento Devoluções de Consignação-FATU6”: \nNFE gerada e confirmada:\n\nOperação utilizada na NF Entrada acima: 919 (neste caso foi efetivamente vendido (neste caso a NF Entrada\nserá com a Operação 919)):\nImportante: A Classe Operação desta operação deve ser “Retorno Consignação”: \n\nQuando o controle da NF entrada é confirmado o saldo em consignação atualiza para o estoque disponível:\n\nAgora, criar um novo pedido para selecionar o saldo que o “Cliente” efetivamente vendeu e retornou para o faturamento final:\nTipo de Entrega = Pronta Entrega / Reserva Estoque (o Estoque ficará reservado a tal Pedido Venda)  \nE para faturar"], "10-0": ["Condições de Pagamento (ADMI19) — Estruturação de produto", "Labelli.docx", "Estruturação de produto \nOs produtos acabados estão separados pelas marcas que eles produzem. A estrutura da pegada est á desta maneira e deve continuar assim, para a integração funcionar corretamente. Os processos estão cadastrados a nivel de linha . Pedidos são integrados pela integração. Pedidos\nA grande maioria dos pedidos atualmente do cliente Labelli são da Pegada, com isso foi criado uma integração para tais pedidos. Seguem padrões que precisam ser mantidos para não causarem erros: O campo código referência sempre tem que ser o mesmo que o integrado pela API: \nEntão quando for criado um produto novo no lado da Labelli está ado pelo Nordeste;\nAbas GGF e Despesas Adm/Comerciais: tem o mesmo conceito da aba Mão de Obra. \nPrograma acima só vai abrir CCustos definidos com “ Centro FPV (Formação Preço de Venda) ” \nDetalhe para a funcionalidade da Cópia: é feito a cópia de depois se informa os valores dos novos registros copiados:  Xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx CUST3:\nUtilizado para o calculo dos valores finais do mark-up, para o valor presente... "], "54-6": ["Configurador de Produto (EPRO28) — Calculo, FVEN5", "FPV_Desenvolvimentos a partir do patch 191 - Funcionalidades novas.docx", "Calculo, FVEN5: \nCampo de auto lista da Coleção FPV \nSituação “Em Desenvolvimento” não bloqueia o cálculo: botão direto para Aprovar... \nVeja os campos novos... \nUsando a opção “Atualizando preços unitários...”: vai buscar de novo o custo das cotações, tarifas... \nUsando a opção “Calcular Preço de venda”, sem nada atrás: usado quando se alterou direto os preços aqui no calculo: \nOpção “Calcular...Personalizado”: é para poder definir o que se quer atualizar o custo. \nDetalhamento de Materiais: evitar de alterar o preço aqui...porque facilmente pode se perder um “atualizar”, “calcular...” \nOpção de Gerar Copia:\n“Copia para Simulação”: é a funcionalidade que já existia...perde o vinculo com a E"], "56-0": ["Pedido de Venda (PEDI1) — produtos no ipad, imagens fotos, marca coleção construção", "iVendre iOS Documentação.docx", "IMPORTANTE:\nDependendo da BD que deseja ser exibida no iPAD , deve-se colocar seu respectivo link no painel de configurações, conforme exemplo da imagem abaixo:\n\nOBS.: depois de fazer o teste, ou a demonstração, com a BD configurada, voltar para os dados da BD desenv . para que o programador consiga efetuar possíveis desenvolvimentos. PRODUTOS QUE DEVERÃO DEMONSTRAR NO IVENDRE\nPRODUTOS QUE APARECEM NO iVENDRE iOS : TAGS <PRODUTOS NO IPAD><DEMONSTRAR PRODUTOS NO IPAD>\nExiste um campo via banco de dados chamado “Configurado Pedido”, onde se: S = Não aparece no iPad ,\nN = Aparece no iPad ,\nSe criado pedido com variação, porém que o produto acabado não existe, o produto será criado automaticamen"], "61-0": ["FPAG137 — campos: Operação, Ind, Enviar, E", "MODULO E-SOCIAL.docx", "MODULO DE E-SOCIAL Sumário\nGerenciador Arquivos E-Social (FPAG137)3\nEnvio do evento S-10105\nEnvio do evento S-22309\nEnvio do evento S-300011\nFLUXOGRAMA DADOS DO EMPREGADOR E TABELAS DO EMPREGADOR\nFLUXOGRAMA EMPREGADOS E TRABALHADORES SEM VINCULO DE EMPREGO\nGerenciador Arquivos E-Social (FPAG137)\nEnvio do evento S-1010 - Inclusão\nQuando a rubrica (evento) ainda não foi enviada, deve s eleciona o layout referente à Tabela de Rubricas (S-1010), na aba de Enviar e-Social : \nNa aba de Configurações Monitor , no campo Operação , para os eventos iniciais e tabela, deve estar como “Inclusão” e o campo Ind. Retificação deve estar como “Arquivo Original”: \nBuscar o evento realizando o filtro pelo botã"], "62-0": ["ADMI122 — Objetivo Acesso Solicitações Detalhamento das Solicitações", "Passo a Passo API Labelli 1.docx", "Objetivo Acesso Solicitações Detalhamento das Solicitações\nA API começa no lado do cliente Pegada, no agendador de tarefa ADMI63, JOB (Descrição - FAZ EXPORTAÇÃO DOS DADOS PARA INTEGRAR COM A API. ) \nNos parâmetros de inicialização deve ter as seguintes infromações:\nOrganização Codigo - 7\nEmpresa Código - 12\nUnidade Negócio Código - 1\nLista Preço Código - 0400\nCategorias Produto – Modelo\nEstas configurações são necessárias para o JOB funcionar da maneira correta. Com os parâmetros, existe ainda 1 regra para os pedidos exportarem. O pedido precisa estar CONFIRMADO para exportar.\nCaso o JOB apresente algum erro, o sistema irá gerar tais erros no programa PEDI83: \nNo programa PEDI83, devem apar"], "64-0": ["Planejamento (MPSP2) — PLANEJAMENTO – MPSP2 Rotina", "Planejamento – MPSP2.docx", "PLANEJAMENTO – MPSP2 Rotina:\nManufatura\nPlano Mestre de Produção\nPlano Mestre de Produção Planejamento\nPrimeiro passo, entrar no : Clicar no check box para informar o “PEDIDO/ LOTE PRODUÇÃO” Confirmar  Plano informado \nInformar: Alterar Situação de “Aberto” para “Cheio” \nClicar em “GERAR MRP”  Clicar em “CONFIRMAR” \nAguardar até o monitoramento informar “PROCESSAMENTO CONCLUÍDO”, e clicar em “VOLTAR"], "67-2": ["Programas (ADMI6) — respeitando padrão citado, escolher o ícone, nível da árvore", "Programas - ADMI6.docx", "Atributo: preencher o atributo do parâmetro;\nUsuário: caso o parâmetro seja específico para um determinado usuário, selecioná-lo na lista;\nGrupo: caso o parâmetro seja específico para um determinado grupo de usuários, selecioná-lo na lista;\nPermitir Alteração: selecionar, na lista, se permite alteração, ou não, do parâmetro.\nBotão:\nConsulta Parâmetros Inicialização: chama programa ADMI125, que contém todos os parâmetros de inicia lização do programa selecionado . Todos os campos terão est as informações , sem possibilidade de edição, uma vez que sua finalidade é de consulta.  xxxxxxxxxxxxxxxxxxxxxxxxxxxxx\nCATEGORIA RELATÓRIO (5º nível da árvore)  Campos:\nCódigo: gera automaticamente, identif"], "68-0": ["Nota Fiscal de Saída (FATU2) — Rotina do Controle de Embarque", "Projeto Controle de Embarque.docx", "Rotina do Controle de Embarque\nFaturistas emitem a nota de saída do pedido e após imprimem os rótulos da nota.\nApós a impressão, o pessoal da expedição cola estes rótulos impressos nos volumes que irão embarcar no caminhão para entrega no cliente.\nAntes de a expedição carregar o caminhão com os volumes da nota, irá ser feita a leitura destes volumes para apontar o que irá embarcar no caminhão.\nEsta leitura, que irá acontecer no controle de embarque, irá validar se todos os volumes da nota foram embarcados, e após todos carregados, irá liberar a impressão da minuta.\nQuando a minuta for impressa, a mesma irá ser assinada e tirada uma foto desta assinada para ser armazenada junto com as informa"], "68-8": ["Nota Fiscal de Saída (FATU2) — Check box para controle de embarque", "Projeto Controle de Embarque.docx", "Check box para controle de embarque\nNo programa de liberação de pedidos de venda e no programa Notas Fiscais de Saída, deverá ser adicionado a check box “Controle de Embarque”. Esta check box servirá para informar se a nota de saída poderá ser selecionada no controle de embarque , sendo que estando marcada é Sim, irá para o controle de embarque, ou não marcada, Não irá para o controle de embarque. Este campo virá como padrão marcado, e deve ser possível alterar ele mesmo que a nota já esteja emitida e autorizada. Na liberação:  Na nota: \nCampo do Controle de Embarque no FATU2\nAdicionar campos no FATU2, aba Volumes, para, quando o for apontada a nota no controle de embarque, vincular as infor"], "70-0": ["Recebimento de compras (COMP5) — Recebimento de Pedidos de Compra – COMP5 Rotina", "Recebimento de Pedidos de Compra – COMP5 - 160419.docx", "Recebimento de Pedidos de Compra – COMP5 Rotina:\n- Suprimentos - Compras\n- Pedido - Recebimento de Pedidos de Compra \nEm Seleção, i nserir o número do P edido de Compra e clicar na aba Pedidos a Receber : \nInserir Operação e sele cionar pedido a receber, após, Confirmar Recebimento : \nNota Fiscal: Número da Nota Fiscal Data Entrada: Data do recebimento da Nota Fiscal.\nConfirmar : \nO sistema irá gerar a Nota Fiscal de entrada com Situação N.F. “Aguardando Confirmação” , então é necessário C onfirmar : "], "71-1": ["ADMI265 — contato principal, contas a receber, e-mail cadastrado", "Rotina de Envio de Email, para Pedido de Compras (nova rotina).docx", "Pedido Serviço : 24460 Solicitação :\n\nROTINA:\nAdministração Configurações Rotina Envia E-mail ALTERAÇÃO:\nContinuação pedido 23392:\n1- Criar programa novo para cadastro de conta de e-mail por programa do ERP. Nele permitir que seja configurado:\na. Empresa / Unidade de Negócio;\nb. Descrição para a configuração. Exemplo: Envio Financeiro; Envio Compras....;\nc. Cadastro dos programas que irão usar essa configuração;\nd ópria de email. \nNecessário a confi"], "71-22": ["ADMI264 — conta de email, compras mcmartefatos, recebido a senha", "Rotina de Envio de Email, para Pedido de Compras (nova rotina).docx", "De: Marcio Schneider [ mailto:marcio@kunden.com.br ] Enviada em: terça-feira, 14 de janeiro de 2020 08:23 Para: 'Controladoria - MCM' < controladoria@mcmartefatos.com.br > Cc: 'Claudinei' < compras@mcmartefatos.com.br >; william.giehl@kunden.com.br Assunto: RES: Cadastro e-mail envio ordem de compra Bom dia, Carmem,\nOK, podemos auxiliar para fazer juntos...precisamos de uma informação sua...\n...primeiramente precisamos cadastrar aqui a conta de email...mas para isso precisamos da senha do email compras@mcmartefatos.com.br\nFavor nos informar a senha desta conta de email para que possamos fazer o cadastro abaixo... \nDepois de termos feito o cadastro acima, ele precisa ser vinculado abaixo, nes"], "71-27": ["Pedido de Compras (COMP3) — ordenes de compras, hacer la liberación, utilizados en procesos", "Rotina de Envio de Email, para Pedido de Compras (nova rotina).docx", "De: Roberto Schumacher [mailto:roberto@kunden.com.br] Enviada em: terça-feira, 21 de julho de 2020 17:46 Para: Davenir Lisandro Hennemann; Jordan Castro; Lina Rodriguez Cc: Marcio Reni Schneider (Kunden Systems) Assunto: Rutina de la aprobación y envió de las Ordenes de compras Buenas tardes.\nAdjunto un paso a paso de la rutina de liberación y envió por correo de las ordenes de compra.\n-Miren que, la rutina ya tiene la funcionalidad de mostrar al final de la orden de compra (pantalla abajo), junto al espacio de firmas, queda registrado el usuario/responsable de la liberación, que en este caso pasa a traer, donde dice “Kunden”, la Coordinadora de Compras o el Sr. Leonardo Mora, que serán los "], "71-32": ["Usuários (ADMI1) — tentando fazer funcionar, sistema dos pedidos, email a partir", "Rotina de Envio de Email, para Pedido de Compras (nova rotina).docx", "De: Marcio Schneider [mailto:marcio@kunden.com.br] En sse Remessa Industrialização. Operação REMBEN. Perceba que neste caso, na operação de saída a apropriação, o campo Esto que industrialização está como N ão . \nEntendemos que nesta saída dos couros para o terceiro, as quantidades entraram no estoque Industrialização (terceiros no livro inventario), por ter como classe de operação Remessa de Industrialização. Ou seja, a class"], "72-1": ["Relatório Posição Plano de Produção (CFAB24) — terceiros no livro, classe remessa industrialização, configurar a operação", "Sobre Operações de Insdustrializacao.docx", "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxx\nPor exemplo abai xo com esta remessa de conserto do couro que entrou no exemplo acima, da VPS. \nNesta remessa a operação é de classe Remessa industrialização, ou seja, as quantidades vão para o estoque Industrialização (terceiros no livro inventario).\n\nNa nota de entrada, após realizado o concerto, temos apenas a entrada do produto, neste caso sem dupla pois o fornecedor não cobrou a mão de obra, entendo que por ser um conserto de um serviço que já foi pago. \nNa operação da nota observamos uma configuração errada. O campo na apropriação deveria estar como não, pois neste caso não há transformação de um produto que vai sair de industrialização e vai entrar no es"], "73-0": ["Solicitações (COMP6) — Solicitação de Pedidos – COMP6 Rotina", "Solicitação de Pedidos - COMP6 170419.docx", "Solicitação de Pedidos – COMP6 Rotina:\n- Suprimentos - Compras\n- Pedido - Solicitação de Pedidos  Inserir: Empresa Unidade Negócio Estabelecimento\nData Necessidade Emitente: É preenchido (automático após salvar) com o nome do usuário que está fazendo a solicitação. Solicitante : Quem solicitou o pedido de compra.\nProduto Quantidade\nApós estes campos inseridos e salvar a solicitação, será gerado um número para a solicitação para depois realizar o pedido de compra filtrando por este numero. "], "74-0": ["Cotação (COMP14) — materiais de cabedal, filtrado o plano, baixa na remessa", "Terceirizacao_Planet.docx", "Serviço de terceirização para a produção completa do calçado. \nComo é gerado OFs de cabedal e do calçado acabado , e a cobrança será apenas sobre o calçado acabado, então, os materiais de cabedal deverão ser gerados pelo programa ESTO25 - Simples Remessa, esse não gera OC do serviço, apenas serve para enviar os materiais para terceiros. Caso o solado seja produzido também pelo mesmo terceiro, este também deve ser gerado simples remessa. Neste exemplo, filtrado o plano e o estrutural dos cabedais . \nNa aba necessidades, exibe os materiais de cabedais, selecione os materiais e quantidades que serão enviados. \nAo clicar em Simples Remessa, informe o destinatário e deixe marcado para efetuar a b"], "74-1": ["Consulta Ordem de Fabricação (CFAB2) — operação de cobrança, controla estoque, apontar as ofs", "Terceirizacao_Planet.docx", "\nDesta forma é montada a NF dos materiais do acabado. \nOperação usada no teste, onde não controla estoque. \nApós o terceiro efetuar a produção e retornar os materiais com cobrança de mão de obra, deve ser filtrada as NF das remessas no programa RECE7 e de acordo as quantidades que o terceiro enviou nas NF, selecionar os itens. \nNa aba de recebimento, já consta o retorno dos materiais com operação que não controla estoque, e no final deve ser informado a operação de cobrança de mão de obra, que não atualize estoque e que exija pedido , para assim, informar o pedido de compra que foi gerado na remessa. \nCaso não esteja retornando todas as OFs da OC, nos três pontinhos pode ser selecionada as O"], "75-0": ["Pessoas Físicas/Jurídicas (ADMI34) — campos: Geral, Vendas, Categoria", "Vendas -  iVendre.docx", "Venda s - iVendre Manufatura\nEngenharia e Desenvolvimento de Produto (EDP) Engenharia\nEstruturação do Produto – Venda\nTudo começa a partir das configurações do produto na engenharia. As configurações de Venda do produto se encontram na aba “Geral” no campo “Vendas”. \nApós selecionar “Vendas” o programa “Estruturação do Produto - Venda” é chamado, sendo ele o programa que configura a venda do referido produto. \nA principal opção que se deve marcar é “Venda Habilitada ( Produção)” como “Sim” para que o produto esteja habilitado para ser vendido. Sem esta opção marcada , o seu produto não poderia ser selecionado para um pedido de venda. \nComo cada campo funciona: - Venda Habilitada (Estoque): H"], "75-1": ["ADMI130 — ADMI130 | ADMI34]", "Vendas -  iVendre.docx", "ADMI130 | ADMI34]\nBastam apenas a “Empresa”, “Unidade Negócio” e “Descrição” para ser criada a categoria, podendo ela ter algumas restrições desejadas para aquele representante que tiver esta classe informada (restringindo alguns produtos que ele poderá comprar). \nVinculamos a classe anteriormente criada ao representante e adicionamos um codinome para ele.  Xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx Vendas e Distribuição Vendas Lista de Preço\nLista de Preço (Estrutural)\nCadastrado o nosso representante, podemos criar uma Lista de Preço para o mesmo, para que ele possa comprar os produtos.  Informações dos campos: - Código: O código da lista de preço podendo ser em números ou letras. É "], "75-3": ["Estruturação de Produto (EPRO15) — produto no ivendre, tamanho final, diferente do cadastrado", "Vendas -  iVendre.docx", "Coloca-se o código estrutural dos produtos que desejar colocar à venda, podendo ser o nível mais alto da estruturação até o produto final . - U.M: Unidade de medida do produto, ele vem automaticamente da estruturação de produtos em “U.M”  - Descrição SKU: - Código SKU: - Cód. Prod. SKU: - Preço Custo: - Preço Final: É o preço que o produto será vendido no iVendre . - Preço PDV: Preço Origin. - Desconto: Porcentagem de desconto que será aplicado em cima do preço final. Não é obrigatório. - Prazo Comissão: - Royalties: - Entr . Inicial: - Entr . Final: - Tamanho Inicial: Pode-se colocar um tamanho de grade diferente do cadastrado na estruturação de produtos, podendo colocar um número inicial m"], "76-0" nuais de cada campo disponível. Assim, podem-se criar uma comunicação entre 2 aplicações.\nPara a utilização da API, são necessárias configurações prévias no painel administrativo (ou integrador, como chamamos internamente). Link: https://kundencloud.com.br:3604 . Seguem orientações gerais sobre o uso do integrador : OBS.: sobre as configurações específicas de cada plataforma, serão abordadas no decorrer do documento, quando abordarmos sobre os campos integrados de cada site.\n\n- N o canto superio"], "77-2": ["Estruturação de Produto (EPRO15) — campos: Marca, Vendas, Características, Descrição, Detalhe Técnico Venda", "Kunden Integrator_MCM.docx", "- Marca (somente Dooca) : a informação da marca do produto (EPRO15) irá carregar no campo “Marca” do site; \n- Botão Vendas: para habilitar o produto para venda e efetuar configurações de algumas informações que vão para a descrição do produto no site. \nAo clicar no botão Vendas, abrirá o programa EPRO61.\nCaso o produto não esteja habilitado para venda (produção ou estoque), nem será possível adicioná-lo a uma lista de preço. Portanto, primeiro passo é habilitar algum tipo de venda.\nPelo que percebi, o pessoal da engenharia habilita no nível da coleção já. \nO utra informação importante no EPRO61 é, no nível de modelo, preencher a “Descrição Produto Vendas”. Este será o nome do produto (ou tít"], "77-3": ["Estruturação de Produto (EPRO15) — configurado no painel, vinculado ao componente, descrição de vendas", "Kunden Integrator_MCM.docx", "Ainda na Dooca, aproveitando a tela acima, a informação do peso da embalagem (primeiro campo do bloco “Dimensões da embalagem”) é oriundo do campo “Peso Bruto” do EPRO15 – aba ficha técnica: \n- Materiais: para os produtos serem integrados, necessitam ter Ficha Técnica, ou seja, materiais vinculados (aba materiais); \nE xiste integração do material principal (cabedal) com campos das plataformas . A configuração da integração se dá no menu “Componentes” do painel da API: \n\nAtualmente, estão configurados os componentes cód. 1 (CAB 1) e cód. 36 (CAB).\nDesta forma, o material vinculado a um desses componentes na lista de materiais será exibido nos seguintes campos de cada API:\nSHOPIFY\nCampo “Mater"], "77-5": ["ADMI35 — painel da api, centro de distribuição, vinculado à pessoa", "Kunden Integrator_MCM.docx", "na Dooca 1º cria ou atualiza pessoa no ERP. A validação ocorre pela informação do CPF da pessoa: se já existe, atualiza os outros dados (se tiver alguma alteração), se não existe, cria; \n2º cria pedido no ERP, com - a categoria definida no painel da API - e mesmo nº de pedido do site (esta informação também vai para o campo “pedido cliente”: plataforma_nº ped. ) ;\n\nSobre a categoria de pedidos:\n- é utilizada para aplicar regras quando enviado o pedido (opções marcadas ou não na aba dados gerais a direita);\n- é utilizada também para definir o tipo de ação que o pedido terá (lembrando que este item depende também da configuração do site, ex. flag “ Venda Sem Estoque ” , da Docca) . P or exempl"], "77-6": ["Agendador de Tarefas (ADMI63) — contas a receber, criado no erp, condição de pagamento", "Kunden Integrator_MCM.docx", "Vincula campos condição de pagamento e cobrança (de acordo com a configuração do menu “Condições de Pagamento” no painel da API )\n\nEste vínculo se dará da seguinte forma: Quando um pedido é gerado, no site, com um tipo novo de condição, este registro é criado automaticamente na tela abaixo e ficará aguardando o preenchimento dos campos “Modalidade”, “Cobrança” e “Espécie” com os dados do ERP. Somente a partir do momento que esses campos são vinculados, o pedido e contas a receber é criado no ERP.\n\nVincula campos: transportadora e frete . D a mesma forma que funciona a condição de pagamento, existe um menu para vínculo das transportadoras. Surgiu um pedido pago com transportadora que não exis"], "77-7": ["Administração Cadastros Parâmetros (ADMI8) — Exemplo de como gera com condição boleto", "Kunden Integrator_MCM.docx", "Exemplo de como gera com condição boleto: \nExemplo com condição cartão 3x:\nParcela 1  Parcela 2  Parcela 3 \nConcluindo, então, vimos acima os seguintes itens (destacados em verde) do painel integrador: \nOs menus “Produtos” , “Cores” e “Marcas” servem para exportar produtos do site para o ERP. Permitindo fazer um de/para dessas informações.\n\nParâmetro importante:\n- 50170 (Exclui precificação no bloqueio da lista): para o funcionamento correto da integração com os sites (principalmente do estoque em real time), é necessário que este parâmetro esteja com atributo N. "], "80-2": ["Estruturação de Produto (EPRO15) — Desenvolvido Pedido Serviço 3714 Solicitado", "Estruturação de Produto - EPRO15.pdf", "Desenvolvido Pedido Serviço 3714 Solicitado:\nESTRUTURAÇÃO DE PRODUTO: NA GRADE, POSSIBILITAR DEFINIR TAMANHOS QUE SERÃO HABILITADOS NO PEDIDO DE VENDA\nSemelhante à versão 3, pasta grade, com possibilidade de Ativar/Inativar tamanhos.\nA ser tratado no pedido de venda, permitindo utilizar apenas tamanhos ativos.\nIdéia, na Estrutura do Produto K11, pasta Grade:\nabrir no 2º bloco os tamanhos da grade selecionada no 1º bloco, e permitir \"Inativar\" tamanhos.\n\nDocumentação:\nESTRUTURAÇÃO DO PRODUTO (EPRO15)\nNa aba Grade, abaixo da aba Inventário, quando o produto possuir grade informada, passa a ser exibida em primeiro\nlugar uma nova aba: Grade.\nNesta aba poderá ser alterada a situação de um tamanho"], "80-3": ["Estruturação de Produto (EPRO15) — Desenvolvido Pedido Serviço 4316 Solicitado", "Estruturação de Produto - EPRO15.pdf", "Desenvolvido Pedido Serviço 4316 Solicitado:\nESTRUTURA DE PRODUTOS - VERIFICAR PORQUE É OBRIGATÓRIO VÍNCULAR A IMAGEM EM TODOS OS NÍVEIS, INCLUSIVE NOS SKU\nVerificar porque é obrigatório víncular a imagem em todos os níveis, principalmente no último, mesmo esse sendo um SKU.\nCaso contrário a imagem não aparece nos relatórios.\nEntendo que a solução não é replicar a imagem na estrutura, pois consumirá espaço desnecessário no banco.\nSolução é buscar a imagem onde essa for encontrada, sempre do mais específico para o mais genérico.\nExistirão casos em em a imagem será colocada a nível de cor do produto.\n\nDocumentação:\nTodos os relatórios que imitem a imagem do produto da estruturação do produto a"], "80-7": ["Estruturação de Produto (EPRO15) — mensagem será exibida, hierarquia da estruturação, geração de mrp", "Estruturação de Produto - EPRO15.pdf", "2) Também bloquear quando existir processo duplicado.\nAvaliar a possibilidade de fazer esse bloqueio já na estrutura de produtos, algo que Eu(João) acho que é\ncomplicado em função que os processos podem estar vinculados em diversos níveis e ainda em semi-acabados,\nporém, se for feito pela primeira opção, será necessário achar uma solução para permitir que o usuário consiga\nexcluir os processos duplos.\nPoderá acontercer a seguimte situação:\nPara um produto já ter sido criadas as OFs, quando os processos estavam OK, e elguém por engano informar o\nprocesso novamente no produto, talvez em outro nível e ao tentar gerar o MRP retornará erro de duplicidade.\nNesse caso o sistema não permitirá exclui"], "80-15": ["Estruturação de Produto (EPRO15) — segmento do material, materiais alternativos, através da estruturação", "Estruturação de Produto - EPRO15.pdf", "Documentação:\nVARIAÇÃO DE MATERIAL\n\nESTRUTURAÇÃO DO PRODUTO (EPRO15)\nNa aba Lista Materiais, a coluna do segmento do material não será mais uma coluna obrigatória.\nPara representar um registro da lista de materiais sem a informação do segmento do material, passa a ser mostrado na\ndescrição do material o código e a descrição do componente.\nNão será possível vincular materiais alternativos numa lista de materiais com a característica acima. O botão Materiais Alternativos estará bloqueado.\nDetalhe: possivelmente será necessário configurar, via barra de ferramentas superior, na pasta \"Propriedades\", alterando para\n\"Não\" obrigatório o campo de código de material.\n\nNova coluna: Componente Variação"], "80-35": ["Estruturação de Produto (EPRO15) — ESTRUTURAÇÃO DO PRODUTO: PERMITIR \"OCULTAR\" PROCESSOS", "Estruturação de Produto - EPRO15.pdf", "Pedido Serviço: 6828 Solicitação:\nESTRUTURAÇÃO DO PRODUTO: PERMITIR \"OCULTAR\" PROCESSOS\n\nSolicitado poder \"ocultar\" Processos, da pasta de Processos da Estrutura de Produto.\nEm resumoo desenvolvimento seria o seguinte:\n- criar campo de \"Ativo/Inativo\"\n- Criar um campo de Data Validade Final na linha do processo na Estrutura do Produto (exemplo abaixo, o campo\npoderia estar \"escondido\" depois do roteiro utilizando barra de rolagem)\n- Quando colocado data de valida de final, os campos Apontamento Processo e Apontamento Obrigatório colocar \"Não\" e inabilitar.\n- Na copia, não copiar este processo;\n- Ocultar da pasta de processos.\nUtilizar o mesmo critério do parâmetro inicialização \"EXIBIR_SOMEN"], "80-49": ["Estruturação de Produto (EPRO15) — ESTR. PRODUTO - CRIAÇÃO DE NOVOS CAMPOS PARA CATEGORIAÇÃO DOS PRODUTOS", "Estruturação de Produto - EPRO15.pdf", "Pedido Serviço: 8381 Solicitação:\nESTR. PRODUTO - CRIAÇÃO DE NOVOS CAMPOS PARA CATEGORIAÇÃO DOS PRODUTOS\n1-Criar novos programas para o cadastro de:\n- Segmento - Grupo - Subgrupo - Subcategoria - Subtipo - Gênero - Sexo - Marca\n- Coleção: considerar período de tempo (de até)\n\nOBS: Grupo e subGrupo são vinculados, ou seja, ao cadastrar um grupo é cadastrado os subGrupos. Os demais campos independentes.\n\n2- Estes cadastros servirão para categorizar e identificar o produto que será criado novo na Estruturação do Produto.\nDeverá ser adicionada nova aba na estruturação de produto que permita classificar o produto dentre estes\ncadastros. Criar uma aba: Caraterísticas do produto dentro da aba \"Fich"], "80-50": ["Estruturação de Produto (EPRO15) — CARACTERÍSTICAS PRODUTO (EPRO49)", "Estruturação de Produto - EPRO15.pdf", "CARACTERÍSTICAS PRODUTO (EPRO49)\nNovo programa disponível em Manufatura/Engenharia e Desenvolvimento de Produto/Cadastros.\nÉ o programa onde serão cadastradas as informações pertinentes a cada umas das características definidas na configuração característica produto.\nParâmetro de inicialização: CARACTERISTICA\nÉ a identificação da característica que será inserida/consultada/alterada quando o programa será acessado.\nEste parâmetro de inicialização é obrigatório.\n\nA primeira coluna exibida pelo programa é a descrição.\nCaso a confi\n\nde inicialização é obrigatório.\n\nA primeira coluna exibida pelo programa é a descrição.\nCaso a configuração característica produto tenha definido uma coluna Faz Refe"], "80-52": ["Estruturação de Produto (EPRO15) — ESTRUTURAÇÃO DE PRODUTO: INCLUIR NA PASTA LISTA DE MATERIAIS COM CAMPOS NECESSÁRIOS PARA…", "Estruturação de Produto - EPRO15.pdf", "Pedido Serviço: 8303 Solicitação:\nESTRUTURAÇÃO DE PRODUTO: INCLUIR NA PASTA LISTA DE MATERIAIS COM CAMPOS NECESSÁRIOS PARA ATENDER\nNECESSIDADES DE DEFINIÇÕES DE FÓRMULAS.\nIdeia:\ncriar 2 pastas abaixo do bloco de materiais (1 para as informações existentes...outra para estas informações\nespecificas). Quanto às informações especificas, seguir a rotina do \"Especificações Tecnicas\". No cadastro de\ncomponentes vincular uma \"Especificação tecnica\" para trazer automatico na Lista de Materiais. Ideia posterior:\nutilizar o mesmo cadastro de especificações tecnicas.\nTambém haviamos registrado na análise interna: \"ver se ajuda se colocarmos no componente padróes de \"Especificação Tecnica\"\" Documentação"], "80-53": ["Estruturação de Produto (EPRO15) — ESTRUTURAÇÃO DO PRODUTO: OPÇÃO PARA INIBIR A MENSAGEM DE QUE O MATERIAL X JÁ ESTÁ…", "Estruturação de Produto - EPRO15.pdf", "Pedido Serviço: 8304 Solicitação:\nESTRUTURAÇÃO DO PRODUTO: OPÇÃO PARA INIBIR A MENSAGEM DE QUE O MATERIAL X JÁ ESTÁ INCLUIDO NA LISTA DE MATERIAIS.\n\nNa inclusão de materiais na Lista de Materiais (nas formulas): opção para inibir a mensagem de que o material X já\nestá incluido na Lista de Materiais. Também opção para já sugerir o mesmo componente do item anterior da Lista de Materiais.\n\nIdeia:\n1= parametro de inicialização para inibir mensagem.\n2=criar um novo parametro no cad de Categoria (aumentar a tela da categoria) e passar a sugerir o componente do material anterior.\n\nNota: ao iniciar o desenvolvimento, contatar a consultoria para obter maiores detalhes sobre a questão.\n\nDocumentação:\n"], "80-63": ["Estruturação de Produto (EPRO15) — Campos “Concentração” e “Densidade”, na pasta Inventario/Dados Gerais", "Estruturação de Produto - EPRO15.pdf", "Campos “Concentração” e “Densidade”, na pasta Inventario/Dados Gerais:\n\nDesenvolvido no pedido serviço 8755:\n- são específicos para alimentar o arquivo de Mapa de Produtos Químicos (arquivo fiscal a ser enviado a um órgão).\n- são campos para o controle junto a policia federal, de alguns produtos controlados.  Xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx\n\nSobre problema na cópia de produto acabado, gerando mensagem estranha cfe abaixo:"], "80-81": ["Estruturação de Produto (EPRO15) — ESTRUTURAÇÃO DE PRODUTO (ENGENHARIA) - EPRO15 - PERMITIR INCLUIR UMA MESMA OPERAÇÃO…", "Estruturação de Produto - EPRO15.pdf", "Pedido Serviço: 15905 Solicitação:\nESTRUTURAÇÃO DE PRODUTO (ENGENHARIA) - EPRO15 - PERMITIR INCLUIR UMA MESMA OPERAÇÃO (PROCESSO)\nMAIS QUE UMA VEZ NO FLUXO OPERACIONAL - CONTROLAR PELA SEQUENCIA ROTINA Manufatura\nEngenharia e Desenvolvimento de Produto Engenharia Estruturação de Produtos ALTERAÇÃO\n\nEm virtude de uma necessidade de mercado de Curtumes precisamos que sejam permitidas as seguintes situações:\n01 - Inclusão de uma mesma operação (processo) mais que uma vez no fluxo operacional de um produto onde sugiro\ncontrolar isto pela sequência do fluxo operacional junto com o operação (processo) a qual nunca serão as mesmas.\n02 - Também é necessário termos o campo de Demãos do lado de cada o"], "80-86": ["Estruturação de Produto (EPRO15) — controle de armazenamento, alterar a configuração, produto estiver configurado", "Estruturação de Produto - EPRO15.pdf", "Pedido Serviço: 19181 Solicitação:\n\nROTINA:\n\nManufatura\nEngenharia de Desenvolvimento de Produto Engenharia Estruturação de Produto ALTERAÇÃO:\n\n1 - Quando um produto estiver configurado, na aba Inventário, \"CONTROLE DE ARMAZENAMENTO RÓTULO: \"SIM\" e\nestiver com registros gravados com esta configuração não deve permitir alterar a configuração para \"CONTROLE DE\nLOTE: \"SIM\", exibir mensagem \"CONFIGURAÇÃO NÃO PERMITIDA\".\n\n2 - Quando um produto estiver configurado, na aba Inventário,\"CONTROLE DE LOTE: \"SIM\" e estiver com registros\ngravados com esta configuração não deve permitir alterar a configuração para \"CONTROLE DE ARMAZENAMENTO\nRÓTULO: \"SIM\", exibir mensagem \"CONFIGURAÇÃO NÃO PERMITIDA\".\n\n3 -"], "80-90": ["Estruturação de Produto (EPRO15) — DIVERSOS: CRIAR O CADASTRO \"CLASSIFICAÇÃO\" PARA SER VINCULADO NA ESTRUTURA DO PRODUTO.…", "Estruturação de Produto - EPRO15.pdf", "  Pedido Serviço: 19839 Solicitação:\nDIVERSOS: CRIAR O CADASTRO \"CLASSIFICAÇÃO\" PARA SER VINCULADO NA ESTRUTURA DO PRODUTO. TRATAR RELATÓRIOS Manufatura\nEngenharia e Desenvolvimento de Produto Cadastros Classificação (cadastro novo) Engenharia Estruturação de Produto Chão de Fábrica Relatórios de Produção\nRelatório de Produção da Classificação - Análise da Classificação - CFAB79\nRelatório Analise de Compras Matéria-Prima Couro / Fornecedor - CFAB101\nRelatório da Ficha Técnica, programas EPRO34 E EPRO35_CURTUME ALTERAÇÃO:\n\n1=Criar cadastro novo \"Classificação\":\nNeste cadastro serão cadastradas as classificações utilizadas pelos curtumes.\nExemplo:\nTR1 TR2 TR3 IV V VI VII\n\n2= Na Estruturação de"], "80-95": ["Estruturação de Produto (EPRO15) — aprovação de custos, materiais parâmetro, engenharia e desenvolvimento", "Estruturação de Produto - EPRO15.pdf", "Pedido Serviço: 21859 Solicitação:\n\nROTINA:\nManufatura\nEngenharia e Desenvolvimento de Produto Engenharia Estruturação de Produto ALTERAÇÃO:\n- Na aba de lista de materiais criar um botão para abrir os materiais como se fosse uma tabela. Isto vai facilitar a inserção/edição dos materiais.\n- Criar um programa para poder dizer quais colunas serão exibidas nesta tela nova e a ordem destas. Este programa\nirá conter todos os campos existente na lista de\nmateriais. Até os botões.\n\nDocumentação:\nManufatura\nEngenharia e Desenvolvimento de Produto Engenharia Estruturação de Produto Detalhamento:\n\nCriado na aba \"Manufatura\", a opção de cadastro de um ou mais materiais alternativos para o produto. Se fo"], "80-99": ["Estruturação de Produto (EPRO15) — lote máximo musical, balanceado forma, produto para calcular", "Estruturação de Produto - EPRO15.pdf", "Pedido Serviço: 22365 Solicitação:\n\nROTINA:\nManufatura\nEngenharia e Desenvolvimento de Produto Engenharia Estruturação de Produto ALTERAÇÃO:\n- Permitir configurar o produto para calcular o lote, quando este possuir o cálculo LOTE MÁXIMO MUSICAL.\nAtualmente, somente existe esta configuração para o cálculo de BASE RÓTULOS.\n\nDocumentação:\nRotina de geração de planos de produção:\n- Tipo de Cálculos: \n- Além do cálculo \"Base Rótulos\", que já permitia a geração de lotes de ordens de fabricação, agora os cálculos abaixo também permitem:\n* Lote Máximo Cálculo 1\n* Lote Máximo Cálculo 2\n* Lote Máximo Musical * Médio Musical * Médio Musical/Rótulos * Médio Sólido\n* Balanceado Forma OF\n* Balanceado Form"], "80-103": ["Estruturação de Produto (EPRO15) — Baena Mora - Kunden ERP", "Estruturação de Produto - EPRO15.pdf", "De: Marcio Reni Schneider (Kunden Systems)\nEnviado: sábado, 2 de maio de 2020 10:53\nPara: Nícolas Jacobs (Kunden Systems)\nAssunto: RES: Baena Mora - Kunden ERP\nPoderias dar uma olhada no abaixo, para podermos vincular as imagens na Baenamora?\nEstá gerando esta mensagem “ORA-22288 file or LOB”, e não mostra nos relatórios. \n...talvez seja algo da configuração abaixo...mas eu não sei ao certo como é o que colocar aí:\nA pasta é esta aí citada que eu quero que coloquem as imagens...\n\nNicolas fez esta alteração aqui, para fazer funcionar:   Zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz\n\nAinda sobre imagens...mensagem “ORA-22288” na implantação na AKS Studio, em 040520:"], "80-106": ["Estruturação de Produto (EPRO15) — realizados por roberto, produtos para compras, olhado na geração", "Estruturação de Produto - EPRO15.pdf", "Definição de campos da Estruturação de Produtos para Compras, testes realizados por Roberto em 042018:\n\nLote Mínimo Produto: este campo é olhado na geração do pedido de compras, não vai eixar criar pedido com qtde\nmenor que o indicado aqui. \nLote Econômico Compra: funciona como um “múltiplo” para comprar. Exemplo: se informado 10, só deixa fazer\npedido de compra de 10 em 10, não permitindo por exemplo 12.\n\nTempo Ressuprimento (dias): isso é olhado para estabelecer o lead time do fornecedor: na real quantos dias antes\ntem que encaminhar o Pedido de compras, para o fornecedor ter prazo hábil para entregar na data de entrega\nprevista. Exemplo 2ª tela abaixo, inclusive numa solicitação este camp"], "80-116": ["Estruturação de Produto (EPRO15) — deixar o campo \"Origem Mercadoria\" em branco por enquanto na GS", "Estruturação de Produto - EPRO15.pdf", "De: Marcio Reni Schneider (Kunden Systems)\nEnviado: terça-feira, 26 de março de 2019 09:11\nPara: Cesar André Wagner (Kunden Systems)\nCc: Ericsson G. dos Santos(Kunden Systems)\nAssunto: deixar o campo \"Origem Mercadoria\" em branco por enquanto na GS\nTu vê algum problema em eu deixar o campo “Origem Mercadoria” em branco por enquanto na GS?\nIsso seria problema ou trancar para o faturamento, ou em outro lugar do Administrativo?\nOu só pode refletir no arquivo que é gerado para o escritório contábil Unescon? (será que eles vão precisar?)\nÉ que, como a usuária da engenharia não tem muito claro isso, o que colocar (eles tem hoje um campo “Genero”\nque parece ser algo semelhante – tela 2 abaixo), ent"], "80-121": ["Estruturação de Produto (EPRO15) — remessa de terceirização, manufatura terceirizados lançamentos, remessas que possibilite", "Estruturação de Produto - EPRO15.pdf", "Pedido Serviço: 31354 Cliente: GS Solicitação:\n\nROTINA:\n\nManufatura Terceirizados Lançamentos Remessa ALTERAÇÃO:\n\nNa ger\n\n54 Cliente: GS Solicitação:\n\nROTINA:\n\nManufatura Terceirizados Lançamentos Remessa ALTERAÇÃO:\n\nNa geração de remessa:\n-permitir efetuar apontamento de determinado processo (apontamento de Lote e de OF, semelhante rotina do\napontamento efetuado pelo \"Retorno\" de Terceirização).\n\n-Criar parâmetro de inicialização para os programas que geram as remessas, que possibilite configurar para que\nefetue o apontamento ou não no momento da Remessa. Parâmetro semelhante aos programas que geram o\nRetorno de Terceirização, através do parâmetro APONTAR_PRODUCAO = S.\nProgramas que necessi"], "80-128": ["Estruturação de Produto (EPRO15) — tempo segurança entrega, dias uteis, partir da data", "Estruturação de Produto - EPRO15.pdf", "Definição de como calcula dos campos “Tempo Segurança Entrega (Dias)” e “Tempo Ressuprimento (Dias)”:\n\nTeste feito para Baenamora em 200720:\n-considera sempre dias uteis, sendo semana com 5 dias uteis.\nNo exemplo abaixo, os 20 dias passarão a ser 28 dias corridos.\nE os 32 dias, serão em torno de 45 dias corridos.\nDetalhe: o “Tempo Ressuprimento (Dias)” é calculado a partir da data gerada já considerando o “Tempo Segurança\nEntrega (Dias)”. Ou seja, não precisa começar a calcular a partir da data que precisa o Planejamento, e sim a “Data\nNecessidade” já com a margem do “Tempo Segurança Entrega (Dias)”.\n\nVeja exemplo abaixo:\n\nData corte 29/09--------→+20dias uteis(semana de 5 dias) = 01/09-----"], "80-134": ["Estruturação de Produto (EPRO15) — [Imagem: COMP13 | MPSP33 | KND-000263 | KND-000290 | KND-000294 | KND-000264] [Imagem:…", "Estruturação de Produto - EPRO15.pdf", "Pedido Serviço: 44162 Cliente: Baenamora Solicitação:  \nESTRUTURAÇÃO DE PRODUTOS - ABASTECIMENTO: REVISAR A VALIDAÇÃO DE \"TOLERÂNCIA ABASTECIMENTO A MENOR\" Rotina:\n\nManufatura\nEngenharia e Desenvolvimento de Produto Engenharia\nEstruturação de Produtos - Abastecimento Alteração:\n\nRevisar/tratar rotina do programa Estruturação de Produtos - Abastecimento, campo \"Tolerância Abastecimento a Menor\":\n- a rotina não está efetuando a validação indicada.\n\nDocumentação:\nManufatura\nEngenharia e Desenvolvimento de Produto Engenharia\nEstruturação de Produtos - Abastecimento Detalhamento:\n\nRotina de abastecimento alterada para controle a tolerância a menor do material.\n\nMarcio 181120: validação e testes c"], "80-135": ["Estruturação de Produto (EPRO15) — COMP3 - LOTE ECONÔMICO DE COMPRA ESTÁ SENDO VALIDADO DE FORMA INCORRETA", "Estruturação de Produto - EPRO15.pdf", "  Pedido Serviço: 47228 Cliente: TEA Solicitação:\nCOMP3 - LOTE ECONÔMICO DE COMPRA ESTÁ SENDO VALIDADO DE FORMA INCORRETA.\n\nRotina:\n\nSuprimentos Compras Pedido Pedido de Compra Alteração:\n\n- Lote econômico de compra está sendo validado de forma incorreta. Gera mensagem “KND-002533”...\n\nDocumentação:\nSuprimentos Compras Pedido Pedido de Compra Detalhamento:   Nada doi feito.\n\nObservação:\nA validação está sendo feita da maneira planejada, ou seja, quando o lote econômico está cadastrado o produto só\npode ser comprado sendo múltiplo do lote econômico."], "80-154": ["Estruturação de Produto (EPRO15) — Visto nos testes para a POC Aniger, em 090322, testes feitos por Roberto…", "Estruturação de Produto - EPRO15.pdf", "Visto nos testes para a POC Aniger, em 090322, testes feitos por Roberto…\n\nSituação: gerar as necessidades de materiais dos conjuntos de embalagem, cujos conjuntos de\nembalagens serão especificados no Pedido de Venda, na aba Multi-Seleção do Pedido.\n\nPelos testes efetuados, usamos a seguinte configuração:\nNa Lista de materiais do “Modelo”*… \n*Modelo com esta configuração de Categoria de Produto:\n(utilizado “Tipo Produto” = Variação, que é um conceito criado para Henrich, registrado no .doc\n“Estruturação de Produto - EPRO15 com rotina nova de criação de Produto Acabado pelas\nMarcas_Variação, para Henrich”…porém não é a intenção nesta POC em usar esta rotina complete…a\nintenção é usar a rotina"], "80-156": ["Estruturação de Produto (EPRO15) — PROGRAMA ESTRUTURAÇÃO DE PRODUTO ¿ EPRO15, ABA FICHA TÉCNICA, CAMPO COLEÇÃO: PERMITIR…", "Estruturação de Produto - EPRO15.pdf", "Pedido Serviço: 55360 Cliente: Kunden Solicitação:\nPROGRAMA ESTRUTURAÇÃO DE PRODUTO ¿ EPRO15, ABA FICHA TÉCNICA, CAMPO COLEÇÃO: PERMITIR VINCULAR AS DIVERSAS COLEÇÕES\n\n1. Programa Estruturação de Produto ¿ EPRO15, aba Ficha Técnica, campo Coleção;\n1.1. O campo deverá passar a ter um cadastro próprio de ¿Coleção¿.\n1.2. O campo Coleção (no EPRO15) deverá passar a ter um botão para permitir informar multi-seleção de registros de coleções.\n1.3. ; O campo atual será apenas ¿display¿, mostrando a ultima coleção vinculada.\n1.4. ; rotina deverá possibilitar informar este campo nos níveis superiores.\n\nDocumentação:\nOutros Detalhamento:\nCriada versão especial do EPRO15. "], "80-168": ["Estruturação de Produto (EPRO15) — Ferramental e produto acabado mesmo código", "Estruturação de Produto - EPRO15.pdf", "De: Roberto Schumacher | Kunden Systems <roberto@kunden.com.br>\nEnviada em: terça-feira, 14 de março de 2023 13:15\nPara: Ernani Martini <ernani.martini@aniger.com.br>\nCc: Marcio Reni Schneider | Kunden Systems <marcio@kunden.com.br>\nAssunto: Ferramental e produto acabado mesmo código\n\nDe acordo testes efetuados em nossa base, é possível criar apenas um código para a produção de um\nproduto que será ferramental em outro, tanto com grade como também sem grade.\nNo exemplo uma matriz com categoria ferramental, permitiu gerar OF para produzir e também vincular\ncomo ferramental no solado, para o FPV esta mesma matriz aparece como ferramental do produto\nacabado e permite fazer o cálculo dela própria"], "80-173": ["Estruturação de Produto (EPRO15) — gerava este erro, lob operation fileopen, deixou de gerar", "Estruturação de Produto - EPRO15.pdf", "Questão de erro ao vincular imagem, na Cordato/Season em 261023...\n\nGerava este erro ao incluir a imagem e ao abrir a tela da imagem:\n\n“ORA-20000: Erro CARREGA_IMAGEM_PRODUTO_XE_P:\nORA-22288: file or LOB operation FILEOPEN falied\nNo such file or...”  \nAo clicar no botão de zoom, gerava este erro...\n“...ORA-00936:...”\n\nMotivo: no nome do arquivo, existia hifens...  \nDepois de copiar e colar e mudar o padrão para “_” ao invés de “-“ como na tela abaixo...e vincular este novo arquivo...\n\n...aí deixou de gerar o erro... "], "80-193": ["Estruturação de Produto (EPRO15) — ESTRUTURAÇÃO DE PRODUTO (EPRO15) - TER POSSIBILIDADE DE INFORMAR MAIS DE UM CÓD. DE…", "Estruturação de Produto - EPRO15.pdf", "Pedido Serviço: 59706 Cliente: Aniger Solicitação:\nESTRUTURAÇÃO DE PRODUTO (EPRO15) - TER POSSIBILIDADE DE INFORMAR MAIS DE UM CÓD. DE BARRAS NA\nGRADE DO MESMO PRODUTO.\n\nRotina:\n\nManufatura\nEngenharia e Desenvolvimento de Produto Engenharia Estruturação de Produto Alteração:\n\nTer possibilidade de informar mais de um cód. de barras na grade do mesmo produto.\nDefinir qual cód. usar no cliente.\nDemanda criação de cadastro: \"Grupo cód. barras\".\n\nDocumentação:\nParâmetro Geral:\n50251 | HABILITA O CONTROLE DE GRUPO DE CÓDIGO DE BARRAS | DEFINE SE O SISTEMA HABILITARÁ O\nCONTROLE DE GRUPOS DE CÓDIGOS DE BARRAS NO CADASTRO DO CLIENTE E NA ENGENHARIA DO PRODUTO.\nATRIBUTOS POSSÍVEIS SÃO S (IRÁ HABILITAR"], "80-204": ["Estruturação de Produto (EPRO15) — informações comerciais, segmento e grupo, ocasião de uso", "Estruturação de Produto - EPRO15.pdf", "3. Programa Estruturação de Produto - EPRO15 e EPRO15_ANIGER, campo já existente \"Grupo Segmento\":\ncriar um cadastro próprio do campo, passar a abrir lista de valores deste novo cadastro e atualizar esta alteração dos\nprogramas nos clientes através do patch.\n\nDocumentação:\n\nPrograma/Rotina Nova Detalhamento:\nForam criados os programas EPRO96, para cadastro das Informações Técnicas, EPRO97, para cadastro das\nInformações Comerciais, EPRO98, para cadastro das Ocasiões de Uso, EPRO99, para cadastro dos Segmentos e\nEPRO100, para cadastro dos Grupos de Segmento.\n\nNo programa EPRO61, foram adicionados os campos Informações Técnicas, Informações Comerciais e Ocasião de Uso.\n\nNo EPRO15 e EPRO16, na a"], "80-207": ["Estruturação de Produto (EPRO15) — Corrigir a inconsistência na rotina de ativação e inativação de tamanhos na grade do…", "Estruturação de Produto - EPRO15.pdf", "  Pedido Serviço: 67056 Cliente: VPS Solicitação:\nCorrigir a inconsistência na rotina de ativação e inativação de tamanhos na grade do produto.\n\nROTINA:\nManufatura\nEngenharia e Desenvolvimento de Produto Engenharia Estruturação de Produtos ALTERAÇÃO:\nÉ necessário corrigir a inconsistência no momento de inativar ou ativar um tamanho na grade do produto. Após\nrealizar a alteração e salvar com F10, o registro é aparentemente salvo, porém, ao consultar novamente o produto, a\nalteração não surte efeito (não salva/não grava), permanecendo com a configuração anterior.\n\nAqui exemplo, Ativando o tamanho 38...\n\nDocumentação:\n\nManufatura\nEngenharia e Desenvolvimento de Produto Engenharia Estruturação d"], "80-208": ["Estruturação de Produto (EPRO15) — Não existe variação de grade entre grade \"GRADE 34 AO 43\" e grade \"GRADE 34 AO 44\" na…", "Estruturação de Produto - EPRO15.pdf", "Pedido Serviço: 66316 Cliente: Planet Solicitação:\nNão existe variação de grade entre grade \"GRADE 34 AO 43\" e grade \"GRADE 34 AO 44\" na largura \" \" e tamanho\n\"39\" na variação \"7\".\n\nRotina:\n\nManufatura\nEngenharia e Desenvolvimento de Produto Cadastros Variação de Grade Alteração:\nVerificar o motivo de ao tentar criar o plano de produção, é exibida a mensagem de que não existe variação de grade\nsendo que as mesmas estão corretas no programa EPRO19 e estão vinculada ocumento de cobranca.\nConfiguracao de Diretorio Padrao\nCaminhos de entrada/importado usados pelos jobs.\nTabela de frete por transportadora\nCadastro de rotas, calculos, formulas, faixas e vigencias.\nRelatorio/log por transportadora\nConsulta de logs quando rotina roda por job.\nRecalculo de frete\nValidar divergencias entre valor importado, calculado e bloqueios."], "88-0": ["Handoff Tecnico Fretes Kunden ERP - 22/07/2026 Pagina 1", "Handoff_Tecnico_Fretes_Kunden_CONEMB_DOCCOB_LIMPO.pdf", "Handoff Tecnico Fretes Kunden ERP - 22/07/2026 Pagina 1\nHandoff Tecnico - Fretes Kunden ERP\nVersao limpa com prints filtrados deste chat Item Informacao Finalidade\nDocumento de transferencia de contexto para outra IA, analista ou suporte tecnico.\nOrigem\nConsolidacao das analises feitas no chat sobre importacao de fretes no ERP Kunden.\nData de referencia 22/07/2026 Escopo\nFluxo operacional e diagnostico tecnico de NOTFIS, CONEMB, XML, DOCCOB, CTe e calculo de frete.\n<b>Resumo executivo<\/b><br/>A cadeia de frete deve ser analisada por cadastro, arquivo, procedure e tabela. A principal\ndescoberta recente foi que um erro CONEMB em BUSCA_ROTA_TRANSPORTE_P nao estava no TXT, mas em\nTAXA_ADM_SERVIC"], "88-1": ["unidade de calculo, importa conhecimentos embarcados, formula e faixas", "Handoff_Tecnico_Fretes_Kunden_CONEMB_DOCCOB_LIMPO.pdf", "1. Fluxo operacional Artefato Papel Risco tecnico NOTFIS\nCarrega notas fiscais base.\nPode afetar cidade, nota, produto e unidade de calculo.\nCONEMB Importa conhecimentos embarcados.\nPode quebrar no calculo de frete por cadastro incompleto.\nXML CTe\nImporta CTe quando o fluxo usa XML.\nNao usar como obrigatorio se cliente opera sem XML.\nDOCCOB Importa cobranca/fatura.\nDepende do parametro 50004 e registro 352/353.\nTabela de frete\nDefine rota, formula e faixas.\nConfig sem faixa causa ORA-01403/ORA-06502."], "88-9": ["ADMI101 — users guilhermenoschang appdata, handoff tecnico fretes, local temp", "Handoff_Tecnico_Fretes_Kunden_CON
