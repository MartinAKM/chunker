...chamando de “Despesas Administrativas/Comerciais”.\n\nSobre 2= sobre como usar a opção “Ciclo Financeiro”:\nCfe posição Cesar, metade dos clientes usa, metade não.\nOs dados de “Descrição” j"], "534-83": ["Cotação (COMP14) — ROTINA Vendas", "FPV.pdf", "Pedido Serviço: 22140 Solicitação:\nROTINA Vendas\nFormação Preço de Venda  \nCálculo Preço de Venda - Fven5 ALTERAÇÃO\n\n- Não está carregando despesas Administrativas e Comerciais válidas no período.\n- Ao carregar MOD para processo com serviço vinculado o sistema carrega mal a cotação.\nConsidera o tempo como base, porém a tarifa de MOD externa deve considerar tarifa unitária.\ndesta forma deveria ser quantidade 1 x tarifa.\n\nDocumentação:\nVendas\nFormação Preço de Venda\nCálculo Preço de Venda - Fven5\n\nPara se utilizar as tarifas do CUST1, é necessário que o parâmetro geral UTILIZA TARIFA ESPECÍFICA FPV (50183)\nesteja como 'N', pois do contrário, as tarifas levadas em consideração serão as do progr"], "534-155": ["ADMI49 — CRIAR UM PARÂMETRO GERAL AONDE TODAS AS NOTAS FISCAIS DE ENTRADA COM PIS/COFINS ENTRARÃO…", "FPV.pdf", "Pedido Serviço: 61839 Cliente: Brisa Solicitação:\nCRIAR UM PARÂMETRO GERAL AONDE TODAS AS NOTAS FISCAIS DE ENTRADA COM PIS/COFINS ENTRARÃO COM\nREDUÇÃO NA BASE DE CÁLCULO, AONDE SERÁ DEDUZIDO O VALOR DO ICMS NA BASE DE CALCULO DO PIS/COFINS.\n\nRotina:\n\nSuprimentos Recebimento Notas Fiscais\nNota Fiscal de Entrada Alteração:\n- Criar um parâmetro geral aonde todas as notas fiscais de entrada com PIS/COFINS entrarão com redução na base\nde cálculo, aonde será deduzido o valor do ICMS na base de calculo do PIS/COFINS.\n\nDocumentação:\n\nParâmetro Geral:\n50276 | DESCONTA ICMS DA BASE DE CÁLCULO DO PIS E COFINS NFE/COTAÇÃ\n\nDocumentação:\n\nParâmetro Geral:\n50276 | DESCONTA ICMS DA BASE DE CÁLCULO DO PIS E "], "534-160": ["ADMI36 — GGF e mão de obra não estão sendo gerados mesmo com tarifas cadastradas Rotina", "FPV.pdf", "Situação ocorrida em 170325, numa reunião com Duramas...RA: 250313033\n\nDuramas FPV revisar com Cesar...foi criado assim os Centros de Custo em 2024 na nossa visita...Centros de Custo\nparece que direcionando especificamente a Mão de Obra, GGF e Despesas Administrativas... \n...mas o fato é, que para funcionar, tive que vincular só o Centro de Custo da “Mão de Obra”... \n...e aí gerou OK o GGF e Despesas Administrativas (antes, quando equipe Duramas tinha vinculado os respectivos\nCentros de Custos criados acima, não gerava o valor no FPV)...  \nPenso que o fato do corrido acima de não ter calculado, foi porque veja abaixo, está vinculado só a este CCusto:\n\nEste é o exemplo apresentado por Duramas"], "535-0": ["Tarifas (CUST1) — cadastro de tempos, venda e custeio, buscar os dados", "FPV_Curtume.pdf", "FPV_Curtume..\n\nPedido Serviço 20283_Val_0401171\nCÁLCULO PREÇO DE VENDA E APROPRIAÇÃO DO CUSTEIO: PASSAR A UTILIZAR OS TEMPOS PADRÕES REGISTRADOS\nNO PROGRAMA \"CADASTRO DE TEMPOS - PREC36\" ROTINA:\n\nVendas e Distribuição\nFormação Preço de Venda\nCálculo Preço de Venda Controladoria Custos Apropriação do Custeio ALTERAÇÃO:\n\nPassar a utilizar os tempos padrões registrados no programa \"Cadastro de Tempos - PREC36\" para as rotinas dos\ncálculos de FPV e Custeio, para as empresas que utilizam o cadastro de tempos padrões por este programa ao invés\ndo programa \"Ficha de Operações\" (que está em Manufatura/Processos/Processos).\n\nDocumentação:\nNo programa Máquinas x Operações x Demãos(PREC32) foi adiciona"], "537-17": ["Administração Cadastros Parâmetros (ADMI8) — Demonstração efetuada por Cesar em 140518", "FPV_Desenvolvimentos a partir do patch 191 – Funcionalidades novas Pegada.pdf", "Demonstração efetuada por Cesar em 140518:\n\nParâmetro Geral 50183:\nN, para o formato antigo\nS*, para o novo formato, Pegada.\nFVEN4 Categoria FPV:\n\nDetalhes:\nPreço por tamanho: não funciona. É como se fosse não.\nCalcular a Valor Presente: pouco usado.\nCarregar materiais Semi-Acabados: criado para os curtumes...(Obs.: a categoria tem que ser “semi-acabado”)\nCarregar Despesas Administrativas: sugestão: é melhor configurar “sim”.\nEstabelecimento: herança da V3, utilizado em algumas funcionalidades para, por exemplo, trazer a tarifa (reduziu a\nnecessidade com últimos desenvolvimentos).   *Marcio 220324:\nCfe verifiquei com Cesar, quando Parâmetro Geral 50183 = S, então necessariamente o cadastro d"], "537-20": ["ADMI36 — tarifa será usado, venda daqui coluna, subdivisões de cod", "FPV_Desenvolvimentos a partir do patch 191 – Funcionalidades novas Pegada.pdf", "FVEN10:\nPara quem vai usar a nova rotina, utiliza as Taifas de Venda daqui, coluna Venda.\n\nVeja que já na aba “Mão de Obra” tem subdivisões de Cod Estrutural.\n\nExemplo do conceito de Grupo de Tarifas:\nTarifa 1 será usado pelo Sul;\nTarifa 2 será usado pelo Nordeste;\n\nAbas GGF e Despesas Adm/Comerciais: tem o mesmo conceito da aba Mão de Obra. \nPrograma acima só vai abrir CCustos definidos com “Centro FPV (Formação Preço de Venda)”  \nDetalhe para a funcionalidade da Cópia: é feito a cópia e depois se informa os valores dos novos registros copiados:\n\nXxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx CUST3:\n\nUtilizado para o calculo dos valores finais do mark-up, para o valor presente..."], "537-41": ["FVEN4 — venda categoria, markup, podendo o usuário", "FPV_Desenvolvimentos a partir do patch 191 – Funcionalidades novas Pegada.pdf", "Pedido Serviço: 26865 Cliente: Pegada Solicitação:\n\nROTINA:\n\nVendas e Distribuição\nFormação Preço de Venda Categoria FPV ALTERAÇÃO:\n1- Criar os campos abaixo no programa FVEN4:\n- Mercado - Moeda - Lista Preço\n- Markup Loja (%) - Prazo\n\n2- A informação dos campos criados no item 1 serão levadas para o programa FVEN5 (FPV - CÁLCULO) como\nsugestão, podendo o usuário editar os campos conforme necessidade.\n\nNo FVEN5 (Detalhamento do Markup)\na. O mesmo Produto poderá ter vários markups padrões desde que tenha listas de preço diferentes\n\nb. O Campo Markup loja será calculado junto com a lucratividade (Serão campos fixos que serão alterados pelo\nsistema conforme as alterações realizadas nos campos \""], "541-0": ["Cotação (COMP14) — gerar os custos, modulo de fpv, usar esta configuração", "GS_Treinamento interno, 310519, para GS.pdf", "GS_Treinamento interno, 310519, para GS..\n\nFluxo:\nA partir do botão FPV do EPRO15:\nNo programa EPRO28, informar:\nCalculo custos = sim\nEstimativa... = informar qtde de pares previstos para fazer rateio de custos (para custos de formas, navalhas...)\nData aprovação = informar a data atual\nSituação = Aprovado p/ calculo custos...\n...e salvar:\n\nDepois, acessar o calculo no modulo de FPV:   Zzzzzzzzzzzzzzzzzzzzzzzz Anteriormente configurado:\n\nzzzzzzzzzzzzzzzzzzzzzzzzzzz  \nPara gerar os custos de “Mão Obra Direta”, que a GS considera atualmente (com valor fixo de 12,76):\n\nzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz \nPara gerar os custos de terceirização: necessário estes 2 cadastros:\n\nZzzzzzzzzzzzzzzzzz"], "546-0": ["PEDI89 — controle de grade, dar certo, vale a pena", "Cancelamento de Entrega Pedido (p Produtos com Controle Rótulo)-PEDI89.pdf", "Cancelamento de Entrega Pedido (p/ Produtos com Controle Rótulo)-PEDI89..\n\nMarcio 070526:\n-Cfe visto com Martin, este programa foi criado em 2025 para melhor atender à Produtos com\nControle de Rótulos...(atender à Pegada e demais clientes que utilizam controle de Rotulo no\nEstoque e movimentação...pois o PEDI3 não mais atendia perfeitamente a rótulos)\n-Até esta data, não trata 070526 a movimentação de Lote...e por isso mantive ativo na BD\nImplantação a versão PEDI3.\n\nzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz Marcio:\nMartin...esse PEDI89...sabe se ele atende a...\n-Produto configurado só com Controle de Grade:\n-Produto configurado sem controle de Grade, sem controle de Lote?\n\nMartin:\noie\n\nna e"], "547-24": ["Pedido de Compras (PEDI3) — Sobre Cancelamento parcial, segue uma avaliação interna em 250321", "Cancelamento de Pedidos e Entregas - PEDI3.pdf", "Sobre Cancelamento parcial, segue uma avaliação interna em 250321:\n\nMarcio Reni Schneider — Hoje às 09:14\noi, tu não se lembra também de ter possibilidade de cancelar uma parte de uma Entrega de Pedido de Venda, né?\n[09:14]\n(isso quando não envolva controle de Rotulo) [09:15]\nquando tem controle de rotulo, acho que isso é possivel...\n[09:15]\nmas quando o produto não tem controle de rotulo, aí acho que não é possivel de alguma maneira, cancelar\napenas parte da entrega de Pedido, né?\n\nRoberto Schumacher — Hoje às 09:21\nBom dia. Realmente não me recordo, inclusive a rotina do rótulo, sei que o Martin criou para a Pegada, mas\nnão cheguei a testar 100% ainda\n\nMarcio Reni Schneider — Hoje às 09:24"], "547-31": ["Pedido de Compras (PEDI3) — ofs de semi-acabados, semi acabados, ver como ficam", "Cancelamento de Pedidos e Entregas - PEDI3.pdf", "Situação constatada na implantação Aniger, com relação à atualização das OFs, de OFs de Semi -Acabados que tem\ncomo origem outras OFs de Semi-Acabados (e estas ultimas sim tem como origem OFs de Acabado)...ou seja, numa\nsituação em que há mais níveis na cadeia da Estruturação de Produtos, ou seja, Semi -Acabados dentro de Semi- Acabados...\n...em resumo: nestas condições a rotina não Cancela as OFs de Semi-Acabados que tem como origem outro Semi- Acabado....\n...abaixo um teste:\n\nAniger_Cancelamento de Entrega Pedido-PEDI3 Antes do Cancelamento...  Pós Cancelamento Produção:\n\nA rotina Cancela o Produto Acabado, e também o semi-acabado imediatamente ligado direto às OFs do\nAcabado...porém não c"], "547-33": ["Pedido de Compras (PEDI3) — ADMI25 ¿ PERMISSÕES - CRIAR NOVA CAMADA DE TIPO DE PERMISSÃO. SERÁ A OPÇÃO DE…", "Cancelamento de Pedidos e Entregas - PEDI3.pdf", "Pedido Serviço: 60635 Cliente: Aniger Solicitação:\nADMI25 ¿ PERMISSÕES - CRIAR NOVA CAMADA DE TIPO DE PERMISSÃO. SERÁ A OPÇÃO DE ¿APROVAÇÃO¿, QUE\nIMPACTARÁ NOS PROGRAMAS PEDI3 E PEDI44.\n\nRotina:\n\nAdministração Acesso Permissões (ADMI25) Alterações:\n\nCriar nova camada de tipo de permissão, no ADMI25 ¿ Permissões. Será a opção de ¿Aprovação¿. Marcando esta\nnova opção nos programas PEDI3 e PEDI44, os usuários do grupo conseguirão aprovar ações que não competem a usuários comuns.\n\nDocumentação:\n\nMensagem:\nKND-004541 | Existem entregas vinculadas aos combos que não estão em tela. Não é possível alterar as mesmas.\nKND-004540 | Existem itens vinculados a combos que não estão na liberação ou não est"], "549-8": ["PEDI112 — jhanrie boa tarde, cancelamento da reserva, olá vinicius", "Cancelamento Saldo de Embarque - PEDI112.pdf", "Registrado em 060125, já utilizando o sistema na VPS desde 010824: Situações que ocorrem em que é necessário\npoder buscar qtdes produzidas e reservadas para um determinado pedido de venda, e faturar emergencialmente em\noutro pedido de venda...\n...evolvendo utilização dos programas PEDI22 e PEDI112\n...exemplo relatado neste RA 250106017:\n\nVinicius.VPS   06/01/2025 - 13:56:41\nURGENTE !!!! FATURAMENTO !!!\n\nTime Kunden, boa tarde!\nTudo bem?\n\nPor favor, solciito uma orientação referente erro abaixo KND-000908.\n\nObjetivo: Cancelar saldo do pedido de venda 642 Jhanrie.Sup 06/01/2025 - 14:17:37 Situação\nEm Aberto Ag. Retorno Kunden Jhanrie.Sup 06/01/2025 - 14:25:17\nOlá Vinicius tudo bem?\n\nPara fazer"], "550-3": ["Cancelamento Saldo de Reserva (PEDI22) — mensagem indevida knd, feitos na desenv, cancelamento de saldo", "Cancelamento Saldo de Reserva – PEDI22.pdf", "Testes feitos na Desenv, com mesmos dados e critérios acima...aqui testando fazer o Cancelamento de Saldo de Reserva... \nPosição: gerou o mesmo problema que na VPS, gerando mensagem indevida KND-004786 (indevida porque sim temos estoque)\nEstará sendo aberto pedido de serviço em 080125 para esta situação."], "551-13": ["Categorias de Pedido (PEDI2) — ROTINA Vendas e Distribuição Pedido Pedidos Pedido de Venda ALTERAÇÃO [Imagem: PEDI12]", "Categoria de Pedido - PEDI2.pdf", "Pedido Serviço: 16526 Cliente:  Antiga (porque a BD produção Grafdil"], "608-57": ["Cadastro de Usuários (ADMI260) — Documento Franquia – Franqueado", "B2B.pdf", "Documento Franquia – Franqueado\nFranquia trataremos como Representante.\nFranqueado trataremos como Cliente.\n\nConforme dados fornecidos:\nBom dia Marcio! Tudo bem?\n\nCliente: Bocattino\nGrupo: GP Gestao de Ativos - Eireli (8258)\nLista de Preço: BOCATTINO_001\n\nA franqueadora pode comprar para as franquias, assim como cada franquia pode comprar para si.\nEntão precisamos que a franqueadora tenha um usuário em que possa comprar para todas, além\nde cada uma ter o seu próprio usuário.\nConsultando os cadastros/clientes que pertencem ao grupo 8258: vinculados 23 cadastros.\n\nDefinir o grupo (franquia) como Representante. Cadastrar como representante em cada cliente\n(franqueado). Para esta guia vinculamos"], "609-2": ["Lista de Preço (VEND2) — Lista de Preços", "B2B_Grafdil Implantação_Comercial_tutorial.pdf", "Lista de Preços\n\nCriar o cabeçalho na aba Lista de Preço...\nDefinir Condição de Pagamento e Frete cfe tela abaixo...\n\nNa aba “Validação”:\nPara Lista de Preços para frete FOB:   12\n\nNo campo “Verificação Valor Total Mínimo” informar NÃO:\n\nNa aba “B2B”:\nAqui estes 2 campos, Venda B2B e Venda Produção, definir com “SIM”:\n\nNa aba “Precificação”:\nVincular os Produtos e o “Preço Final”:  13 Xxxxxxxxxxxxxxxxxxxxxxxxxxxxxx\n\nDepois de Concluída e preenchida a Lista de Preços:\nNo programa “Liberação Lista Preço”:\nNa aba “Seleção” Selecionar a lista de Preço...\n\n...e depois na próxima aba “Listas Preço” selecionar à direita e clicar no botão abaixo:  14\n\nImportante: para cada inclusão, alteração e excl"], "609-3": ["Cadastro de Usuários (ADMI260) — Configuração de Filtro Ivendre", "B2B_Grafdil Implantação_Comercial_tutorial.pdf", "Configuração de Filtro Ivendre:\n\nXxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx   17 Acesso B2B:\n\nLink:\nhttps://kundencloud.com.br:5602\n\nAcesso com usuário e senha definidos acima  no programa Coletores do ERP ou não está vinculado na aba\n\"Acesso\" da aplicação. Entre em contato com um Administrador.”\n\nPara resolver: acessar com um usuário definido ADMINISTRADOR aqui nesta aplicação...aí aparece a aba ACESSO\n(ver bem abaixo, ultimo icone)...\n\n...ao clicar nele, abre o abaixo:\n-É necessário incluir numa nova linha o "], "615-41": ["Consulta Ordem de Fabricação (CFAB2) — motivo deste erro, dar um enter, cadastro da cor", "Chão de Fábrica WEB.pdf", "Ocorreu em 280825, nos testes dos Desenvolvimentos da Injepar, Pedido Serviço 67799...\n\nVer o motivo deste erro...ao informar a OF e dar um ENTER para a rot\n\njepar, Pedido Serviço 67799...\n\nVer o motivo deste erro...ao informar a OF e dar um ENTER para a rotina efetuar o procedimento de apontamento...gerou este erro:\nErro APONTAMENTO_COLETOR_WEB_P: ORA-20000: Erro POPULA_GTB_APONTAMENTO_OF_P: ORA-20100: JSON\nScanner exception @ line: 4 column: 138 - expected: \" \\ / b f n r t u   Motivo:\n\nO cadastro da Cor, vinculada ao Produto da OF , estava com este caracter “\\” na sua descrição...\n\nPara resolver: colocar assim: "], "620-4": ["ADMI1255 — Configurações necessárias", "Encaixotamento e Liberação para Faturamento WEB - Lutheuz.pdf", "Configurações necessárias:\n\n-obrigatório o uso da geração de talões para funcionar a rotina (os talões serão “lidos” mais abaixo, na aplicação WEB)...  4\n\n...aqui demonstra utilização de talões...\n\nZzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz\n\nNecessário gerar os códigos de apontamento par a par aqui* (gerar o código de etiqueta aqui...)...\n...estes códigos de apontamento par a par não serão usado efetivamente pelo usuário, mas a rotina como foi\nmontada necessita de este código par a par gerado, apesar de não ser usado/lido diretamente na rotina (cfe Deise,\nDesenvolvimento/Wagner informou que não teria outra alternativa rápida no momento)...   5\n\nVersão de Impressão: PEDI8_LTZ\n\nNão precisa emit"], "620-35": ["ADMI176 — faturamento e estoque, parte dos talões, informado neste parâmetro", "Encaixotamento e Liberação para Faturamento WEB - Lutheuz.pdf", "Em 120626, Teste na rotina a pedido de Lutheuz, agora para avaliar se atenderia a questão de trabalhar com\nconfiguração de “Reserva” no apontamento do Produto Pronto...\n...e consideração o período de transição entre os Planos que não reservam, e o 1º a Reservar...\n-Veja abaixo, informei um determinado Plano no parâmetro 95, sendo assim, os Planos antigos que tivessem saldo de\nprodução, continuariam a não reservar...e os novos Planos a partir do Plano informado neste parâmetro, sim, reservariam...  63\n\nEfetuado o apontamento de parte do 1º Plano, apontamento feito pelos Talões...\n\n...estoque sendo gerado no Disponível...   64\n\nAgora, na aplicação “Encaixotamento e Liberação para Faturamento W"], "621-1": ["Consulta Ordem de Fabricação (CFAB2) — APLICAÇÃO \"ENCAIXOTAMENTO E LIBERAÇÃO PARA FATURAMENTO WEB\": EVOLUIR COM A ROTINA,", "Encaixotamento e Liberação para Faturamento WEB – VPS.pdf", "Pedido Serviço: 65384 Cliente: VPS Solicitação:\nAPLICAÇÃO \"ENCAIXOTAMENTO E LIBERAÇÃO PARA FATURAMENTO WEB\": EVOLUIR COM A ROTINA,\nPOSSIBILITANDO \"ENCAIXOTAR\" PEDIDOS DE VENDA QUE TENHAM A AÇÃO \"RESERVAR ESTOQUE FUTURO\" Rotina:\n\nWEB\nEncaixotamento e Liberação para Faturamento - Web Alteração:\n\n1. Aplicação \"Encaixotamento e Liberação para Faturamento WEB\": evoluir com a rotina, possibilitando\n\"encaixotar\" Pedidos de Venda que tenham a ação \"Reservar Estoque Futuro\" através das leituras de\netiquetas/talões que sejam dos respectivos LE's (Lotes Estoques).\n\n1.1. Esta alteração precisa ser parametrizada, para não afetar ao cliente que utiliza a rotina como está atualmente.\n\nDetalhamento nos anex"], "621-7": ["Administração Cadastros Parâmetros (ADMI8) — gerada e emitida, ficou correto, peças que entrarão", "Encaixotamento e Liberação para Faturamento WEB – VPS.pdf", "Encaixotando.\nVamos fazer uma caixa de 5 talões.\nFeita a leitura dest
