nObs/Detalhe: porém tem uma falha, que o sistema não é “cumulativo”, ou seja, no exemplo abaixo:\n- Os 5% estabelecidos através da configuração da Ficha Tecnica, representam 0,004885.\n- Desta maneira, o sistema não deixa fazer uma baixa de 0,0050\n- Porém deixa fazer 2 baixas de 0,0040 + 0,0040, ou seja, desta maneira foram baixados a mais 0,0080 (maior que o\n% de tolerância estabelecido na Ficha Tecnica).\nPORÉM SOBRE ESTA Obs/Detalhe ACIMA: \n\nFiz novo teste em 060722, e agora mostra OK a validação...não deixa gerar problema e funciona OK a validação do\nabastecimento a maior"], "202-20": ["Remessa Industrialização (ESTO25) — PLANO ABASTECIMENTO DE MATERIAIS - REQUISIÇÃO - VALIDAR NA MULTI-SELECÃO PARA NÃO PERMTIR", "Plano Abastecimento Materiais _Requisições ESTO25.pdf", "Pedido Serviço: 8354 Solicitação:\nPLANO ABASTECIMENTO DE MATERIAIS - REQUISIÇÃO - VALIDAR NA MULTI-SELECÃO PARA NÃO PERMTIR\nINFORMAÇÃO DE PLANOS COM SITUAÇÃO DIFERENTE DE FIRME\n\nNo filtro de plano, se informar plano que esteja com situação diferente de Firme, retorna mensagem KND-000389 - Não foram encontradas.......\nO mesmo acontece quando o pano está informado na multi-seleção.\n***Correto****\n\nO Problema, quando informa-se nos filtros multi-seleção, planos cheios, e firmes misturados.\nSe tiver apenas um como situação firme, passa batido, mostrando as necessidades somente dos planos firme, e isso\ngerou falta de materiais na produção.\n\nSolicitação: Não permitir informar planos com situação d"], "202-30": ["Remessa Industrialização (ESTO25) — geral for igual, classe de custo, vinculado ao recurso", "Plano Abastecimento Materiais _Requisições ESTO25.pdf", "3) Plano de Abastecimento Requisição (Esto25), Baixa de Requisição c/cod.Barras(Esto79)\nSugerir centro de custo.\nValidação: Verificar parâmetro 20, se etiver como SIM exigir centro de custo.\nbloquear quando, com OF e a classe de custo estiver informada (obtida através da conta contábil consumo do produto)\n*** essa validaçao deve ser feita no momento de informar o produto Documentação:\nMensagens Novas: KND-002812 - Centro de custo obrigatório, quando o parâmetro geral 20 for igual a \"S\" e o\nproduto \"(:B)\" possuir conta contábil consumo com classe de custo informada.\nKND-002859 - Centro de custo obrigatório, quando o parâmetro geral 20 for igual a \"S\".\n\nIMPLANTAÇÃO DE SALDO (ESTO2) DEVOLUÇÕES "], "202-77": ["Remessa Industrialização (ESTO25) — ESTRUTURAÇÃO DE PRODUTOS - ABASTECIMENTO: REVISAR A VALIDAÇÃO DE \"TOLERÂNCIA…", "Plano Abastecimento Materiais _Requisições ESTO25.pdf", "Pedido Serviço: 44162 Cliente: Baenamora Solicitação:\nESTRUTURAÇÃO DE PRODUTOS - ABASTECIMENTO: REVISAR A VALIDAÇÃO DE \"TOLERÂNCIA ABASTECIMENTO A MENOR\" Rotina:\n\nManufatura\nEngenharia e Desenvolvimento de Produto Engenharia\nEstruturação de Produtos - Abastecimento Alteração:\n\nRevisar/tratar rotina do programa Estruturação de Produtos - Abastecimento, campo \"Tolerância Abastecimento a Menor\":\n- a rotina não está efetuando a validação indicada.\n\nDocumentação:\nManufatura\nEngenharia e Desenvolvimento de Produto Engenharia\nEstruturação de Produtos - Abastecimento Detalhamento:\n\nRotina de abastecimento alterada para controle a tolerância a menor do material.\n\nMarcio 181120: validação e testes com"], "202-83": ["Remessa Industrialização (ESTO25) — ESTO25 - CHECK BOX NÃO ESTÁ FUNCIONANDO Rotina", "Plano Abastecimento Materiais _Requisições ESTO25.pdf", "Pedido Serviço: 38718 Cliente: Pegada Solicitação:\nESTO25 - CHECK BOX NÃO ESTÁ FUNCIONANDO Rotina:\n\nSuprimentos\nPlanejamento Necessidade de Materiais Abastecimento (MRP)\nPlano Abastecimento Materiais - Requisição Alteração:\n\nCkeck box \"Desconsiderar OFs Produzidas em meses diferentes do atual\" não está funcionando corretamente.\n\nMesmo com a ckeck box marcada, OFs que foram produzidas em meses anteriores aparecem para fazer o\nabastecimento, porém não podem ser abastecidas.\n\nCom elas sendo levadas para a aba Necessidades, está dificultando o abastecimento de outras OFs que ainda não\nforam produzidas e abastecidas.\nAo tentar Confirmar a baixa:\n\nMensagem “KND-002495...”...\n\nDocumentação:\nSuprime"], "202-86": ["Remessa Industrialização (ESTO25) — tirar da reserva, and qtd saldo, ped atm where", "Plano Abastecimento Materiais _Requisições ESTO25.pdf", "tive que ajustar para Smart, em 072021;\nGerou mensagem “KND-000226...” não sei exatamente o porquê...enfim:\nSmart_Eliminado saldo reservado de mistura com...\nSELECT * FROM RESERVA_QTD_PED_ATM WHERE PRODUTO_ID = 272 AND QTD_SALDO > 0;\nDELETE FROM RESERVA_QTD_PED_ATM WHERE PRODUTO_ID = 272 AND QTD_SALDO > 0 AND ID = 262;\n\nDepois feito baixa via “requisição Informada” Estava assim; \nImportante: Roberto tem um pedido de serviço, Pedido 47701, para permitir selecionar via programa o que se\nprecisa tirar da reserva e tirar da Reserva (vinculado a Plano), e aí fazer poder fazer a Requisição Informada."], "202-98": ["Remessa Industrialização (ESTO25) — necessidade do material, centro de custo, verificar o porque", "Plano Abastecimento Materiais _Requisições ESTO25.pdf", "Pedido Serviço: 63421 Cliente: Frigolaste Solicitação:\n\nRotina:\n\nSuprimentos\nPlanejamento Necessidade de Materiais Abastecimento (MRP)\nPlano Abastecimento Materiais - Requisição Alteração:\nVerificar de onde está vindo a informação do centro de custo, no campo “Centro Custo”, e verificar o porque não\n“assume” o Centro de Custo que está vindo sugerido.    Documentação:\nSuprimentos\nPlanejamento Necessidade de Materiais Abastecimento (MRP)\nPlano Abastecimento Materiais - Requisição Detalhamento:\nNada foi feito.\n\nObsevação:\nO centro de custo está vindo da solicitação de necessidade do material, ela pode ser vista no programa ESTO93 Solicitação número 445.\nQuando o usuário selecionar uma localizaç"], "202-100": ["Remessa Industrialização (ESTO25) — linha do material, veja que zerou, trazido no abastecimento", "Plano Abastecimento Materiais _Requisições ESTO25.pdf", "Em 121124, avaliação realizada para atender a um questionamento ao protocolo 241107009/Wellour, referente a...\n\n“Monica.Wellour 07/11/2024 - 10:09:45\nBom dia, tudo bem?\nconseguem ver a movimentação que foi feita nessa OF? ela foi estornada, a princípio corretamente, porém as peças\ncontinuam aparecendo (olhando a tela abaixo a qtde de 532 PC (TAMBÉM MOSTRA NO CFAB59) Monica.Wellour 11/11/2024 - 14:27:55\nOlá, só existem dois programas que são obrigatórios para estornar uma OF\nprimeiro esse, onde é informada a of nessa tela e após, na aba requisições é alterado e excluído a matéria prima que foi abastecida \n\napós esse processo, vem nesse programa aqui, informa o numero da OF e o número 2, aí ab"], "202-109": ["Remessa Industrialização (ESTO25) — vinculadas na requisição, usuário do estoque, selecionadas e permite", "Plano Abastecimento Materiais _Requisições ESTO25.pdf", "Para registro: A ROTINA NO ESTO129 tem a seguinte opção (acho que não tem no ESTO25:\n\nTeste feito em 081025, para verificar a possibilidade de Impressão direta a partir de gerar a Requisição...teste feito:  \n...depois de confirmar acima, a rotina pergunta na mensagem KND-004026: “Deseja imprimir as Requisições geradas?”\n\nOptando por SIM: a rotina abre a tela do ESTO27 com as respectivas Requisições já selecionadas, e permite impressão das Requisições:   zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz\n\nExtensão do acima, fizemos um raciocínio junto com Roberto, para atender a ATTA, no seguinte intuito:\n\n-Abastecer de acordo com o Planejamento...\n-Mas aí, como o Planejamento é muito dinâmico, e vai alter"], "203-0": ["Remessa Industrialização (ESTO25) — abastecimento materiais simples, inicio pós implantação, remessa baixa", "Plano Abastecimento Materiais _Simples Remessa ESTO25.pdf", "Plano Abastecimento Materiais _Simples Remessa ESTO25..\n\nEsta mensagem KND-000358 abaixo gerou na T&A, no inicio pós implantação.\n\nPara resolver a mensagem KND-000358:\nDefinir parâmetro de inicialização OPERACAO_NF_REMESSA_MANUAL e OPERACAO_NF_REMESSA_BAIXA tanto\nneste programa como no programa “Gera Nota Fiscal Abastecimento Materiais - Simples Remessa”, com mesmos atributos."], "204-0": ["Remessa Industrialização (ESTO25) — nro de documento, inicio pós implantação, desenvolvido para myrabel", "Plano Abastecimento Materiais _Transferencia ESTO25.pdf", "Plano Abastecimento Materiais _Transferencia ESTO25..\n\nPrograma ESTO25, com menu_classe diferenciado.\n\nPode ser utilizado para transferências internas, onde o sistema gera um lançamento de “Transferência Localização”.\n\nExemplo abaixo. Gera com um nro de documento sequencial automático.\n\nQuando a Localização informada no campo “Localização Destino” não é do mesmo estabelecimento da “Localização Origem”:\nGera uma NFS de Transferencia de filial. \nInclusive: há um programa onde mostra todas as transferências efetuadas e que estão pendentes de gerar a NFS (usado/desenvolvido para Myrabel).\n\nXxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx\n\nEsta mensagem KND-000358 abaixo gerou na T&A, no in"], "209-2": ["Registro Controle Produção e Estoque (ESTO19) — ESTO19 - VERIFICAR LÓGICA DE CÁLCULO DO CUSTO UNITÁRIO", "Registro Controle Produção e Estoque – ESTO19.pdf", "Pedido Serviço: 46164 Cliente: Crislli Solicitação:\nESTO19 - VERIFICAR LÓGICA DE CÁLCULO DO CUSTO UNITÁRIO.\n\nRotina:\n\nSuprimentos Estoque Relatórios\nRegistro Controle Produção e Estoque Alteração:\n\n- Verificar lógica de cálculo do custo unitário.\n\nDocumentação:\nSuprimentos Estoque Relatórios\nRegistro Controle Produção e Estoque Detalhamento:\nA coluna de Custo unitário do relatório é populada da seguinte maneira:\n- Pega o valor do custo unitário do lançamento que é possível ver nos lançamentos de estoque, pelo ESTO7.\n- Caso este campo não possúa valor para o lançamento, o mesmo busca o valor da coluna CM_CONTABIL_UNI da\ntabela LCTO_GTB_ATM, que é populada utilizando o valor da coluna no regis"], "210-3": ["Registro Produtos em Fabricação (ESTO40) — partir disso passou, calendário de recursos, gerar o estabelecimento", "Registro Produtos em Fabricação – ESTO40.pdf", "questão de gerar o Estabelecimento nulo/em branco no ESTO40...situação vista de novo na Implantação VPS em 200524...\n\n...informei aqui o Estabelecimento, no Calendário de Recursos...\n\n...e a partir disso passou a gerar OK o registro, com o Estabel\n\nmento, no Calendário de Recursos...\n\n...e a partir disso passou a gerar OK o registro, com o Estabelecimento aqui no ESTO40:  "], "210-4": ["Registro Produtos em Fabricação (ESTO40) — ESTO40 - Registros de Produtos em Fabricação não estão gravando a Conta Contábil Rotina", "Registro Produtos em Fabricação – ESTO40.pdf", "Pedido Serviço: 69230 Cliente: Pegada Solicitação:\nESTO40 - Registros de Produtos em Fabricação não estão gravando a Conta Contábil Rotina:\n\nSuprimentos Estoque Lançamentos Registro Produtos Prontos Alteração:\n1 - Ao gerar os Produtos em Fabricação, quando informamos uma regra de contabilização vinculada a uma\nconta contábil cadastrada no produto, essa conta não está sendo considerada nem gravada no programa\nESTO40 para aquele produto.\n2 - Atualizar no cliente.\n\nDocumentação:\n\nSuprimentos Estoque Lançamentos Registro Produtos Prontos Detalhamento:\nOs registros de produtos em fabricação não estão trazendo a conta contábil, pois, no programa ESTO77, a definição\nda conta contábil é feita de dua"], "211-31": ["Geração da NF de transferência (ESTO71) — CRIAR PARAMETROS DE INICIALIZAÇÃO DE ESTABELECIMENTO E SERIE", "Rotina de Faturamento_Notas Fiscais Saída, situações.pdf", "Pedido Serviço: 12875 Solicitação:\nCRIAR PARAMETROS DE INICIALIZAÇÃO DE ESTABELECIMENTO E SERIE\nCriar os seguintes parametros de inicialização nos programas abaixo:\nFATU3 - Notas Fiscais de Entrada -ESTAB_PADRAO\n\nFATU6 - Devoluções de Venda - ESTAB_PADRAO\n\nRECE7 - Retorno Remessas - ESTAB_PADRAO\n\nMIND16 - Gera NF Ordem Transferência - ESTAB_PADRAO\n\nESTO71 - Gera Nota Fiscal Abastecimento Materiais - ESTAB_PADRAO\n\nPEDI44 - Liberação Pedidos Faturamento - ESTAB_PADRAO\n\nTERC10 - Gera Notas Fiscais Remessa Industrialização - ESTAB_PADRAO\n\nFATU9 - Gera Nota de Devoluções de Empréstimo / Gera Nota de Devoluções de Compra - ESTAB_PADRAO\n\nA ideia é ter configurado um FATU3, FATU6, RECE7 (os geradore"], "211-32": ["CEXT85 — PARAMETRO DE INICIALIZAÇÃO NOVO NOS PROGRAMAS QUE MONTAM NF (SAIDA ENTRADA)", "Rotina de Faturamento_Notas Fiscais Saída, situações.pdf", "Pedido Serviço: 12953 Solicitação:\nPARAMETRO DE INICIALIZAÇÃO NOVO NOS PROGRAMAS QUE MONTAM NF (SAIDA ENTRADA)\nCriar um parametro de inicialização nos programas que geram/montam as NF de entrada e Saida\n(lançamento/emisão) para que chame determinado programa de Notas Fiscais.\nPorque: podem haver varios programas de NF (FATU2 e FATU3) cadastrados no Menu (um para cada\nestabelecimento), e dessa forma será fixado qual FATU2/3 o gerador da NF deverá chamar.\n\nAbaixo segue a relação dos programas que deverão ser alterados:\n- FATU6 - RECE7 - MIND16 - ESTO71 - ESTO25 - PEDI4 - PEDI44 - TERC10 - FATU9\nCaso seja mapeado mais algum programa fazer a alterção também, ou então comunicar a consultoria qual"], "211-40": ["Pessoas Físicas/Jurídicas (ADMI34) — Na BD Desenvolvimento, nos testes na Kunden, para cancelar uma NF de saída fiz", "Rotina de Faturamento_Notas Fiscais Saída, situações.pdf", "Na BD Desenvolvimento, nos testes na Kunden, para cancelar uma NF de saída fiz:\n\nSQL> UPDATE nfs_atm SET SITUACAO_NF_ELETRONICA = 'L' WHERE ID = 26266;\n\n1 row updated.\n\nSQL> COMMIT;  Commit complete.\n\nSQL> UPDATE nfs_atm SET MODELO_NF = '01' WHERE ID = 26266;\n\n1 row updated.\n\n(isso qdo parâmetro 89 de NF Eletronica estando S) Zzzzzzzzzzzzzz\n\nWHERE ID = 26266;\n\n1 row updated.\n\n(isso qdo parâmetro 89 de NF Eletronica estando S) Zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz\n\nNova situação, visto em 241018...auxilio de Deisy...(foi em NF de Entrada...mas serve para NF Saida...só trocar abaixo as tabelas.\n\nNF que estava Emitida: controle 24200 update nfe_atm\nset SITUACAO_NF"], "211-49": ["Nota Fiscal de Saída (FATU2) — Vendas e Distribuição Faturamento Notas Fiscais", "Rotina de Faturamento_Notas Fiscais Saída, situações.pdf", " Pedido Serviço: 22202 Solicitação:\nVendas e Distribuição Faturamento Notas Fiscais\nNota Fiscal de Saída ALTERAÇÃO:\n-Cliente tem a necessidade que seja gerado o e-mail do destinatário nas observações da nota fiscais de saída.\nSugestão: Criar a opção no programa Configurações de notas. (FATU4) Documentação:\nVendas e Distribuição Faturamento Notas Fiscais\nNota Fiscal de Saída\nFoi criada uma nova opção \"E-mail Destinatário\" na Configuração de Notas Fiscais, na lista de valores do campo\nDados Adicionais dentro da aba Dados Complementares.\nQuando esta opção for utilizada na configuração irá concatenar o e-mail do destinatário na tag <infCpl>.\n\nZzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz"], "211-52": ["Pessoas Físicas/Jurídicas (ADMI34) — Vendas e Distribuição Faturamento Notas fiscais", "Rotina de Faturamento_Notas Fiscais Saída, situações.pdf", "Pedido Serviço: 22254 Solicitação:\nVendas e Distribuição Faturamento Notas fiscais\nNotas fiscais de saída.\nALTERAÇÃO:\nCriar opção para que o seja possível fazer um de-para de Código produto Kunden x Cód produto cliente.\nEssa opção deve ser a nível de cliente, pois o mesmo produto é vendido p/vários os clientes, porém para um\ndeterminado grupo de clientes é necessário que na DANFE\ngere a informação do CÓDIGO DO PRODUTO DELE\n\nObs: (Essa parte será utilizado o programa EPRO32)\nEssa informação deve ser impressa na DANFE.\n***Prevêr essa informação em todas as notas de emissão- Entrada e Saida.\nDetalhamento em anexo Documentação:\nPrograma Pessoas Físicas/Jurídicas(ADMI34):\n> Aba \"Nota Fsical\"\n> Cr"], "211-76": ["ADMI35 — tava, issqn, mensagem knd", "Rotina de Faturamento_Notas Fiscais Saída, situações.pdf", "Mensagem KND-000358: Para esta mensagem em 220119, a solução foi informar o ISSQN na Cidade, tela 3. Tava nulo.  "], "211-80": ["CREC4 — favor pesquisa sobre a rotina de Estornos de NF, e como isso se comporta no Ctas a…", "Rotina de Faturamento_Notas Fiscais Saída, situações.pdf", "De: Marcio Reni Schneider (Kunden Systems)\nEnviada em: quarta-feira, 30 de janeiro de 2019 12:02\nPara: Cesar André Wagner (Kunden Systems)  \nCc: Micail K. Zabalotzki (Kunden Systems)\nAssunto: ENC: favor pesquisa sobre a rotina de Estornos de NF, e como isso se comporta no Ctas a Receber Oi Cesar,\n\nO que temos pendente de esclarecer o fluxo de como funciona, é quando tem estorno de NF de Saida (e aí o sistema\ngerar uma emissão de NF de Entrada), como fica a parte financeira disso...\n\nPorque o Ademir está me questionando e colocando como uma pendencia...ele está nos questionando:\n“Sistema não esta baixando o Financeiro, continua com o Doc pendentes no Contas a Receber”\n\nEntão, teríamos que pos"], "211-88": ["FATU146 — quantidade de horas, ultrapassou a determinada, respeitadas as configurações", "Rotina de Faturamento_Notas Fiscais Saída, situações.pdf", "Pedido Serviço: 28005 Solicitação:\n\nROTINA:\n\nVendas e Distribuição Faturamento Notas Fiscais\nNota Fiscal de Saída\nMesmo configurando horas para cancelamento no FATU4, ao tentar realizar o cancelamento de uma nota fiscal\nocorre o aviso de que já ultrapassou a determinada quantidade de horas (mesmo que estas não tenham passado).\n\nALTERAÇÃO:\n-Verificar a quantidade de horas que está no FATU4 e fazer o disparo da mensagem APENAS quando essa quantidade for ultrapassada.\n*Sugestão se for viável: verificar no programa FATU146 a quantidade de horas de cancelamento, ao invés do FATU4\n(para clientes que utilizem o Kunden Monitor).\n\nDocumentação:\nVendas e Distribuição Faturamento Notas Fiscais\nNota Fis"], "211-89": ["Transferência Externa (MIND15) — centro de trabalho, vir devidamente preenchidos, transferência da manutenção", "Rotina de Faturamento_Notas Fiscais Saída, situações.pdf", "Pedido Serviço: 21771 Solicitação:\n\nROTINA:\n\nVendas e Distribuição Faturamento Notas Fiscais\nNota Fiscal de Saída ALTERAÇÃO:\n\n- Aba Manutenção Industrial deverá ser um campo obrigatório (emissão e lançamento) quando esta aba estiver\nsendo exibida, tanto quando a NF for manual, quanto quando for gerada pelos programas de transferência. Deverá\nser exibido o centro de trabalho 'ORIGEM' (de onde está saindo) e o 'DESTINO' (para onde vai). Ambos os campos\ndeverão vir devidamente preenchidos quando a NF for gerada pelos programas de transferência da Manutenção\nIndustrial (MIND15 - gerador da transferência / MIND16 - gerador da NF).\n\nDocumentação:\nVendas e Distribuição Faturamento Notas Fiscais\nNot"], "211-96": ["ADMI11 — voltar a qtde, fiscais para gerar, configuração de notas", "Rotina de Faturamento_Notas Fiscais Saída, situações.pdf", " \nQuando precisar alterar a configuração de Notas Fiscais, para gerar “Estorno” ao invés de “Cancelamento”:\n\nExemplo na GS em 051020, se já tem CTE na NF, aí não pode cancelar a NFS...neste caso no FATU146, mudar horas\nCancelamento para zero, para permitir Estornar a NF, e depois voltar a qtde de horas para o original."], "211-101": ["Nota Fiscal de Saída (FATU2) — ocorrência das notas, saída consta, venda tenha sido", "Rotina de Faturamento_Notas Fiscais Saída, situações.pdf", "\nPara identificar que determinado Pedido de Venda tenha sido Faturado (efetuado a respectiva NF de Saída) mas que\ntenha ocorrido Cancelamento, Estorno, ou Devolução de Venda desta NF, o que de uma certa maneira “anularia” o\n“Faturamento” deste Pedido de Venda. Identificado nos seguintes campos abaixo:\n\nNo Pedido de Venda:\nNas Ocorrências vai constar:\n\n-Ocorrência das Notas Fiscais Canceladas:\n\n-Ocorrência das Notas Fiscais Devolução:  \n-Ocorrência das Notas Fiscais Estorno:\n\nNas NF Saída vai constar:\n\n-Informação do Cancelamento:  \n-Informação da Devolução: aqui a NF de Devolução (neste não consta o Pedido, apenas o Vinculo da NF de Saida)...\n\n...mas na NF de Saída consta que houve a Devoluç"], "211-107": ["Administração Cadastros Parâmetros (ADMI8) — homologação do sefaz, gerar a danfe, desenv enviando", "Rotina de Faturamento_Notas Fiscais Saída, situações.pdf", "Visto em 160321...para fazer testes na BD Desenv, enviando para o ambiente Homologação do Sefaz e com isso\ngerar a Danfe e XML, utilizar:\nEmpresa 1\nUnidade de Negocio 1 Estabelecimento 31\n\nMarcio 180326: abaixo exemplo na BD Desenv, de Guilherme:\n“Exemplo autorizado na base desenv” Empresa 210 Estabelecimento 115  Marcio 200326:\nEu mesmo montei um teste para anexo do Pedido Serviço 70547...gerei esta NFS com XML e Danfe (anexados no\nPedido Serviço 70547), com NF gerada a partir do PEDI4...utilizei:\nEmpresa: 210 Unidade Negócio: 1 Estabelecimento: 115 "], "211-108": ["Disponível (FATU110) — funciona para tais, efetuando o faturamento, operação não atualiza", "Rotina de Faturamento_Notas Fiscais Saída, situações.pdf", "Visto na Implantação da Smart em 090421, rotina de Faturamento/NF Saída/FATU2 de Produtos Acabados que tem\nconfiguração de controle de SKU (e tendo controle de Estoque para este movimento*):\n\n-Só funciona para tais produtos*, efetuando o faturamento gerando a NFS pelo PEDI4, ou seja,\n\nnto*):\n\n-Só funciona para tais produtos*, efetuando o faturamento gerando a NFS pelo PEDI4, ou seja, e com isso tendo a\nnecessidade de ter um Pedido de Venda.\n-Não funciona fazer uma NF Saída manualmente tentando informar os SKUs...gera mensagem cfe tela abaixo e não\npermite incluir dados de SKUs e qtdes .\n(esta condição visto em testes, e cfe posicionamento de Deisy/Suporte).\n******************ATENÇÃO: ESTA PO"], "211-113": ["Disponível (FATU110) — gerei a nfs, venda vai gerar, impresso no relatório", "Rotina de Faturamento_Notas Fiscais Saída, situações.pdf", "Testes feitos em 300921, para ver se, informando o campo Complemento no Pedido de Venda, vai gerar na NFS (na\nminha necessidade, não precisaria gerar na NF...preciso deste campo Complemento, para ser impresso no relatório VEND78...\n\n...informei no Pedido de Venda, campo Complemento... \n...gerei a NFS pelo FATU110...e veja que não trouxe o campo Complemento para a NFS:  \n...agora gerei a NFS pelo PEDI4...e veja que por este programa sim trouxe o campo Complemento para a NFS:\nIsso, para o meu caso que queria ver só no Relatório VEND78, é problema...porque vai afetar o faturamento...\nEm todos os casos, funciona para quem usar o PEDI4 com esta funcionalidade:\n\nNo relatório VEND78 geraria assim o"], "211-114": ["Disponível (FATU110) — veio deste parâmetro, junto na danfe, excluir o atributo", "Rotina de Faturamento_Notas Fiscais Saída, situações.pdf", "Situação vista em 010621, na implantação da Smart...\n\nNF emitida pelo Kunden, mostrando assim no FATU2 (ver 3º item, que é item de Venda, com Vinculo com Pedido de\nVenda, NF gerada pelo FATU110)...  \n...veja como gerou na Danfe o 3º item...veja o descritivo “cProdCliente: “56427””...que não está diretamente em\nnenhum campo do FATU2...(e não se queria que isso fosse mostrar junto na Danfe)...\n\nMotivo:\n\nVeio deste Parâmetro geral 50085 com este atributo...(foi por engano...) \n\n...e aí como estava informado no Pedido de venda no campo FLEXFIELD1 (das Inf. Complementares), trouxe para a Danfe acima.\nSolução (para não aparecer mais): excluir o atributo do parâmetro acima."], "211-120": ["CEXT84 — FATU2 - CRIAÇÃO DE CAMPO LOCAL EMBARQUE NO FATU2 CONFORME ESTA NO CEXT84 PARA GERAR A TAG", "Rotina de Faturamento_Notas Fiscais Saída, situações.pdf", "Pedido Serviço: 46216 Cliente: Pegada Solicitação:\nFATU2 - CRIAÇÃO DE CAMPO LOCAL EMBARQUE NO FATU2 CONFORME ESTA NO CEXT84 PARA GERAR A TAG\n<UFSAIDAPAIS><\/UFSAIDAPAIS> CORRETAMENTE NO XML.\n\nRotina:\n\nVendas e Distribuição Faturamento Notas Fiscais\nNota Fiscal de Saída Alteração:\n\nCriação de campo Local Embarque no FATU2 conforme esta no CEXT84 para gerar a tag\n<UFSaidaPais><\/UFSaidaPais> corretamente no XML.\n\nDocumentação:\nVendas e Distribuição Faturamento Notas Fiscais\nNota Fiscal de Saída Detalhamento:\nNa aba Dados Gerais foi criado o campo \"UF Local Embarque\" que fica ao lado do campo \"Local Embarque\". Esse\ncampo fará com que a tag \"<UFSaidaPais>\" seja gerada com a UF correta."], "211-132": ["ADMI125 — Arquivar esta situação", "Rotina de Faturamento_Notas Fiscais Saída, situações.pdf", "De: Marcio Reni Schneider\nEnviada em: quinta-feira, 16 de novembro de 2023 11:18\nPara: Marcio Reni Schneider <marcio@kunden.com.br>\nAssunto: Arquivar esta situação...\n\nNF de Saida ficou “travada” sem abrir o monitor (situação ocorrido para Ismael na Season , em 161123)...detalhe:\nera o registro abaixo, mas não tinha nro de NF ainda...  \n...olhando aqui, estava “processando” = sim, e depois de derrubar a sessão aberta que estava “travada” e na\nsequência alterar de “Processando” de SIM para NÃO...\nDetalhe: a 1ª vez olhando aqui, estava mostrando Nro NF = 53, sendo que já existia a NF 54 emitida e autorizada, ou\nseja, ao que parece a rotina não tinha atualizado OK o nro da NF...aí foi alterado "], "211-137": ["Devolução (CPRO29) — NOTA FISCAL DE SAÍDA - CRIAR UMA TRAVA DE CANCELAMENTO E ESTORNO DE NF QUE EXIJA UMA…", "Rotina de Faturamento_Notas Fiscais Saída, situações.pdf", "Pedido Serviço: 60110 Cliente: Frigolaste Solicitação:\nNOTA FISCAL DE SAÍDA - CRIAR UMA TRAVA DE CANCELAMENTO E ESTORNO DE NF QUE EXIJA UMA AUTORIZAÇÃO Rotina:\n\nVendas e Distribuição Faturamento Notas Fiscais\nNota Fiscal de Saída Alteração:\n\nCriar uma trava de cancelamento e estorno de NF que exija uma autorização.\n\nDocumentação:\n\n4503 | Cancelamento necessita de autorização.\n4504 | Estorno necessita de autorização.\n\nVendas e Distribuição Faturamento Notas Fiscais Notas\nNotas Fiscais de Saída Parâmetro Inicialização:\nAUTORIZADO_CANCELAR_ESTORNAR | DEFINE SE É PERMITIDO CANCELAR/ESTORNAR NOTA FISCAL DE SAÍDA.\nEXIGE_EVENTO_CANCELAMENTO_ESTORNO | DEFINE SE EXIGE A INFORMAÇÃO DE EVENTO PARA\nCANC"], "211-151": ["Registro Controle Produção e Estoque (ESTO19) — Revisar o cálculo do custo médio, e custo de entrada de estoque, do Produto 1041196", "Rotina de Faturamento_Notas Fiscais Saída, situações.pdf", "Pedido Serviço: 66983 Cliente: Henrich Solicitação:\nRevisar o cálculo do custo médio, e custo de entrada de estoque, do Produto 1041196.\n(envolvendo movimento de Transferência entre Estabelecimento, sendo que é Estabelecimento em outro Estado, na\nqual há incidência de DIFAL (ICMS Diferencial Alíquota) e na qual é agregado/juntado/aumentado o valor de ICMS ao\ncusto de Estoque com este movimento de Transferência entre Estabelecimento.\n\nRotina:\n\nSuprimentos Estoque Relatórios\nRegistro Controle Produção e Estoque Alteração:\n¿ Revisar o cálculo do custo médio, e custo de entrada de estoque, do Produto 1041196;\n1.1. Revisar:\nPartindo dos movimentos deste produto 1041196, a partir de novembro/24 (a"], "211-168": ["Gravar ID da Regra de Tributação Especial (ADMI66) — regra de tributação, nota para melhorar, especial no item", "Rotina de Faturamento_Notas Fiscais Saída, situações.pdf", "Pedido Serviço: 64431   Cliente: Kunden Solicitação:\n\nRotina:\n\nVendas e Distribuição Faturamento Notas Fiscais\nNota Fiscal de Saída Alteração:\nGravar ID da Regra de Tributação Especial no Item da NFE e NFS.\n\nDocumentação:\n\nVendas e Distri\n\nção:\nGravar ID da Regra de Tributação Especial no Item da NFE e NFS.\n\nDocumentação:\n\nVendas e Distribuição Faturamento Notas Fiscais\nNota Fiscal de Saída Detalhamento:\nAdicionada nova coluna ao item da nota para melhorar a rastreabilidade da regra de tributação especial.\n\nSuprimentos Recebimentos Notas Fiscais\nNotas Fiscais de Entrada Detalhamento:\nAdicionada nova coluna ao item da nota para melhorar a rastreabilidade da regra de tributação especial. \nUtil"], "211-170": ["Nota Fiscal de Saída (FATU2) — LIBERAÇÃO PEDIDOS VENDA FATURAMENTO - IDENTIFICAR MOTIVO DE ESTAR SENDO LEVADO DESCONTO", "Rotina de Faturamento_Notas Fiscais Saída, situações.pdf", "Pedido Serviço: 69283 Cliente: Atta Solicitação:\nLIBERAÇÃO PEDIDOS VENDA FATURAMENTO - IDENTIFICAR MOTIVO DE ESTAR SENDO LEVADO DESCONTO\nNEGATIVO PARA A NF Rotina:\n\nVendas e Distribuição Faturamento Notas Fiscais\nLiberação Pedidos Venda Faturamento Alteração:\n\n- Identificar motivo/configuração de estar levando desconto negativo para a NF.\n\n1=Pedido de venda vem do B2B e possui ajuste de preço:  \n2.1. Gerada a NF está levando o valor unitário de 39,1116, quando o correto seria 40,10. E também leva o desconto\nnegativo, quando não deve haver desconto nos itens:\n\nConfigurações que foram revisadas:\n3.1. Parâmetro geral 269 (DESCONTO UTILIZADO - DEFINE O TIPO DE DESCONTO UTILIZADO PELO CLIENTE:\nG="], "211-172": ["ADMI35 — horas cancelamento, viram que estava, via monitor retornou", "Rotina de Faturamento_Notas Fiscais Saída, situações.pdf", "Situação em 110326, RA 260311042 da Cristófoli...\nhttps://kundencloud.com.br:3825/atendimento?id=260311042&callType=customer\n\nNa tentativa da Cristófoli em Cancelar uma NFS, que haviam gerado e emitido, e viram que estava errado a Operação\nutilizada nos itens, desta maneira a necessidade de cancelar esta NFS para poder gerar nova NF com a Operação\ncrreta...ao tentar “Cancelar”, o retorno ocorrido a partir do procedimento para cancelar via monitor retornou isso:\n“Rejeicao: Pedido de Cancelamento para NF-e com CT-e ou MDF-e”  \nO cliente então tentou Estornar, porém não possibilitou, porque o Estorno verifica este campo “Horas Cancelamento”\nno FATU146...e não permite estornar quando a qtde de h"], "211-175": ["Consulta Estoque Produto (ESTO7) — tributacao ipi, lcto estoque seq, from nfs item", "Rotina de Faturamento_Notas Fiscais Saída, situações.pdf", "Situação ocorrida em 200526, na Cristófoli...\nhttps://kundencloud.com.br:3825/atendimento?id=260520027&callType=customer\n\nNa NF Saída de Faturamento, gerou a mensagem abaixo:\nKND-004786 - Quantidade insuficiente no estoque. Identificação (:A). Qtd. Consumir: (:B), Qtd. Estoque: (:C).\nLocalização (:D), Produto (:E).\n\nAqui os Itens da NFS, do produto informado acima... \nO estoque estava correto:\n\nNeste caso, o que aconteceu foi o seguinte:\nMarcio.Cons 21/05/2026 - 15:01:49 oi,\nconseguiria colocar numa \"fila\" para olhar proxima semana, quando der um tempinho?\n\nO motivo pelo ocorrido é porque tinha 1 dos campos abaixo em destaque como null...foi colocado manualmente como N...\nA pergunta é:\n\n-O q"], "212-9": ["ESTO20 — Situação que ocorria no Henrich, em 08/2011, após migração para a K11", "Rotina de Recebimentos, situações.pdf", "\nSituação que ocorria no Henrich, em 08/2011, após migração para a K11:\n\nEm partes dos lançamentos de NFE, após a a NFE estar confirmada, os usuários acessavam a\n\nra a K11:\n\nEm partes dos lançamentos de NFE, após a a NFE estar confirmada, os usuários acessavam a NFE Confirmada,\nclicavam em “Alterar”, faziam a alteração pretendida, e após tentar novamente confirmar, aparecia a mensagem\nKND-000226 de que não existia saldo Disponível...inclusive pela mensagem KND-000226 e pelas qtdes apresentadas\nnesta mensagem, as qtdes não estavam de acordo com as qtdes registradas no estoque.\nEsta situação foi replicada na BD Suporte.\nA mensagem era a seguinte KND-000226:\n\nVerificando pelos relatórios e cons"], "212-18": ["ocorrido na adoc, violated child record, int", "Rotina de Recebimentos, situações.pdf", "Erro “ORA-20000: Erro GERA_ATO_CONCESSORIO_INT_P: ORA-02292: integrity constraint\n(KUNDEN.ATO_CONCESSORIO_INT_COMP_FK1) violated - child record found” ocorrido na Adoc, ao tentar excluir um\nlançamento de NF de Entrada:\n\nMotivo:"], "212-20": ["cesar wagner, situação na adoc, contas a pagar", "Rotina de Recebimentos, situações.pdf", "x\n\nSituação na Adoc em 19/07/2013:\n\nEstão com uma NFE, que mudaram uma qtde. Diz que digitaram mal.\nSegundo informaram a qtde não estava correta.\n\nAí desconfirmaram a NFE, alteraram e aí agora ao tentar confirmar gera a mensagem “ORA-20000: Erro\nATUALIZA_CONTAS_PAGAR_P(INSERE_DOCUMENTO): ORA-00001: unique constraint (KUNDEN.DOCUMENTO_CP_UK0) violated” abaixo.\n\nNo contas a pagar, a tela é conforme abaixo...não sei se há um pagamento para isso\n\nolated” abaixo.\n\nNo contas a pagar, a tela é conforme abaixo...não sei se há um pagamento para isso que está bloqueando a nova\nconfirmação (pelo condição de pagamento parece que sim deve ter um pagamento, pois a condição é antecipo).\n\nO sistema permitiu"], "212-29": ["Geração da NF de transferência (ESTO71) — CRIAR PARAMETROS DE INICIALIZAÇÃO DE ESTABELECIMENTO E SERIE", "Rotina de Recebimentos, situações.pdf", "Pedido Serviço: 12875 Solicitação:\nCRIAR PARAMETROS DE INICIALIZAÇÃO DE ESTABELECIMENTO E SERIE\nCriar os seguintes parametros de inicialização nos programas abaixo:\nFATU3 - Notas Fiscais de Entrada -ESTAB_PADRAO\n\nFATU6 - Devoluções de Venda - ESTAB_PADRAO\n\nRECE7 - Retorno Remessas - ESTAB_PADRAO\n\nMIND16 - Gera NF Ordem Transferência - ESTAB_PADRAO\n\nESTO71 - Gera Nota Fiscal Abastecimento Materiais - ESTAB_PADRAO\n\nPEDI44 - Liberação Pedidos Faturamento - ESTAB_PADRAO\n\nTERC10 - Gera Notas Fiscais Remessa Industrialização - ESTAB_PADRAO\n\nFATU9 - Gera Nota de Devoluções de Empréstimo / Gera Nota de Devoluções de Compra - ESTAB_PADRAO \nA ideia é ter configurado um FATU3, FATU6, RECE7 (os geradore"], "212-35": ["ESTO16 — sql select data, linha atualizada, commit concluído", "Rotina de Recebimentos, situações.pdf", "E também trocado a data de entrada da NFE, porque não permite alterar manualmente a data na NFE:\n1º select para confirmar o que mostra na tela...\nSQL> SELECT DATA_ENTRADA FROM NFE_ATM\nWHERE ID = 17163;\n\nDATA_ENT 03/12/14\n\n…e aqui o update:\nSQL> UPDATE NFE_ATM\nSET\n\nENTRADA FROM NFE_ATM\nWHERE ID = 17163;\n\nDATA_ENT 03/12/14\n\n…e aqui o update:\nSQL> UPDATE NFE_ATM\nSET DATA_ENTRADA = '28-NOV-14'\nWHERE ID = 17163;\n1 linha atualizada.\n\nSQL> COMMIT;\n\nCommit concluído.\n\nSQL> Zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz\nTambém ajustado no Contas a Pagar (o nro de documento consegui ajustar manualmente):\n\nSQL> select DATA_ENTRADA 2 FROM documento_cp_atm\n3 WHERE ID = 274858;\n\nDATA_EN"], "212-68": ["Transferência Externa (MIND15) — centro de trabalho, vir devidamente preenchidos, transferência da manutenção", "Rotina de Recebimentos, situações.pdf", "Pedido Serviço: 21770 Solicitação:\n\nROTINA:\n\nSuprimentos Recebimento Notas Fiscais\nNota Fiscal de Entrada ALTERAÇÃO:\n\n- Aba Manutenção Industrial deverá ser um campo obrigatório (emissão e lançamento) quando esta aba estiver\nsendo exibida, tanto quando a NF for manual, quanto quando for gerada pelos programas de transferência. Deverá\nser exibido o centro de trabalho 'ORIGEM' (de onde está vindo) e o 'DESTINO' (para onde vai). Ambos os campos\ndeverão vir devidamente preenchidos quando a NF for gerada pelos programas de transferência da Manutenção\nIndustrial (MIND15 - gerador da transferência / MIND16 - gerador da NF).\n\nDocumentação:\nSuprimentos Recebimento Notas Fiscais\nNota Fiscal de Entrada"], "212-70": ["Recebimento de compras (COMP5) — cadastro configuração especial, visto com cesar, sugeridas", "Rotina de Recebimentos, situações.pdf", "Sobre as Operações, que podem ser sugeridas no COMP5 para gerar a NF de Entrada: usar o programa RECE32 -\nCadastro Configuração Especial (Operação):\n\nVisto com Cesar em 092020, para Baenamora:"], "212-71": ["Pessoas Físicas/Jurídicas (ADMI34) — Marcio, 141220, numa avaliação do pedido serviço 44063, Lutheuz", "Rotina de Recebimentos, situações.pdf", "Marcio, 141220, numa avaliação do pedido serviço 44063, Lutheuz:\nPara funcionar o IPI, na geração da NF de Entrada:  \nCadastro de Pessoa Física Juridica:\n\nProduto com Classificação Fiscal com vinculo com IPI:\n\n...e a própria empresa acho que precisa ser Contribuinte de IPI:\n\n(porque no teste que fiz, estando desmarcado, não gera o IPI na NFE....  \nEstando marcado como exemplo tela acima, sim gera o IPI cfe abaixo:"], "212-80": ["Administração Cadastros Parâmetros (ADMI8) — PARÂMETROS - ADMI8 - CRIAR PARÂMETRO GERAL VALIDA_LOTE_FAT_REC Rotina", "Rotina de Recebimentos, situações.pdf", "Pedido Serviço: 52559\nCliente: Frigolaste / Duramas / Kunden Solicitação:\nPARÂMETROS - ADMI8 - CRIAR PARÂMETRO GERAL VALIDA_LOTE_FAT_REC Rotina:\n\nAdministração Cadastros Parâmetros - ADMI8 Alteração:\n\nCriar parâmetro geral VALIDA_LOTE_FAT_REC = S/N\nS = Não vai deixar emitir/receber (FATU2/FATU3) o produto sem que seja informado o lote, quando esse produto\npossuir o controle de lote (PADRÃO);\nN = Irá deixar emitir/receber (FATU2/FATU3) o produto sem que seja informado o lote, quando esse produto possuir\no controle de lote.\nA validação deve ser realizada no momento da emitir/confirmar a NF para operações que não controlam estoque.\n\nDocumentação:\nParâmetro Geral:\n50232 | VALIDAR LOTES NO FATURA"], "212-85": ["Pessoas Físicas/Jurídicas (ADMI34) — vista em visita, ismael para identificar, importação de material", "Rotina de Recebimentos, situações.pdf", "Ocorrido em 190523 numa situação na Smart...Situação vista em visita na Smart, e com apoio de Ismael para identificar a situação:\nNuma “Emissão” de NF de Entrada, para gerar a NF de Importação de Material (na qual é necessário a empresa emitir\numa NF de Entrada para buscara mercadoria que foi importada, aguardando a sua retirada/busca)\n\nMensagem de “KND-004040: NF possui vencimentos com modalidade não informada” ao tentar Emitir tal NF de Entrada...  \n...motivo: veja que aqui abaixo não carregou a Modalidade...\n\n...motivo que não tinha a informação abaixo no campo Modalidade (informado posterior)...\n\nNa NF teve que ser informado via update na tabela, para não precisar excluir a NF."], "212-88": ["CUST2 — validação do custeio, retorno de terceiros, ofs já produzidas", "Rotina de Recebimentos, situações.pdf", "Pedido Serviço: 59085 Cliente: HK Solicitação:\n\nROTINA:\n\nSuprimentos Recebimento Notas Fiscais\nNota Fiscal de Entrada ALTERAÇÃO:\n\nAnalisar validação do custeio referente a retorno de terceiros de OFs já produzidas em meses anteriores ao mês de retorno.\n\nAnalisar validação do custeio referente a retorno de terceiros de OFs já produzidas em meses anteriores ao mês de\nretorno. Validação da rotina criada no Pedido 52764.\nOF produzida no mês 05... \nRealizando o retorno agora no mês 06...\n\nMensagem “KND-004363”:   Documentação:\n\nDetalhamento:\nPedido validado sob orientação do Wagner M.\n\nUm novo pedido foi solicitado ao consultor, para entrega em abril e com novo exemplo. Este deve ser mencionado\nn"], "212-96": ["Gravar ID da Regra de Tributação Especial (ADMI66) — CRIAR UM PARÂMETRO GERAL AONDE TODAS AS NOTAS FISCAIS DE ENTRADA COM PIS/COFINS ENTRARÃO…", "Rotina de Recebimentos, situações.pdf", "Pedido Serviço: 61839 Cliente: Brisa Solicitação:\nCRIAR UM PARÂMETRO GERAL AONDE TODAS AS NOTAS FISCAIS DE ENTRADA COM PIS/COFINS ENTRARÃO COM\nREDUÇÃO NA BASE DE CÁLCULO, AONDE SERÁ DEDUZIDO O VALOR DO ICMS NA BASE DE CALCULO DO PIS/COFINS.\n\nRotina:\n\nSuprimentos Recebimento Notas Fiscais\nNota Fiscal de Entrada Alteração:\n\n- Criar um parâmetro geral aonde todas as notas fiscais de entrada com PIS/COFINS entrarão com redução na base\nde cálculo, aonde será deduzido o valor do ICMS na base de calculo do PIS/COFINS.\n\nDocumentação:\n\nParâmetro Geral:\n50276 | DESCONTA ICMS DA BASE DE CÁLCULO DO PIS E COFINS NFE/COTAÇÃO/FPV | DESCONTA ICMS DA BASE\nDE CÁLCULO DO PIS E COFINS DAS NOTAS DE ENTRADA COM C"], "212-103": ["Registro Controle Produção e Estoque (ESTO19) — Revisar o cálculo do custo médio, e custo de entrada de estoque, do Produto 1041196", "Rotina de Recebimentos, situações.pdf", "Pedido Serviço: 66983 Cliente: Henrich Solicitação:\nRevisar o cálculo do custo médio, e custo de entrada de estoque, do Produto 1041196.\n(envolvendo movimento de Transferência entre Estabelecimento, sendo que é Estabelecimento em outro Estado, na\nqual há incidência de DIFAL (ICMS Diferencial Alíquota) e na qual é agregado/juntado/aumentado o valor de ICMS ao\ncusto de Estoque com este movimento de Transferência entre Estabelecimento.\n\nRotina:\n Suprimentos Estoque Relatórios\nRegistro Controle Produção e Estoque Alteração:\n¿ Revisar o cálculo do custo médio, e custo de entrada de estoque, do Produto 1041196;\n1.1. Revisar:\nPartindo dos movimentos deste produto 1041196, a partir de novembro/24 (a"], "212-114": ["Notas Fiscais de Entrada (FATU3) — Verificar e resolver a razão do erro KND-001039 ao tentar confirmar nota fiscal de…", "Rotina de Recebimentos, situações.pdf", "Pedido Serviço: 64326 Cliente: Planet Solicitação:\nVerificar e resolver a razão do erro KND-001039 ao tentar confirmar nota fiscal de entrada (FATU3), visto que ocorre\nerro de data retroativa, mesmo inserindo a data de hoje como data de entrada.\n\nRotina:\n\nSuprimentos  Recebimento Notas Fiscais\nNota Fiscal de Entrada\n\nAlteração: Verificar e resolver a razão do erro KND-001039 ao tentar confirmar nota fiscal de entrada (FATU3), visto\nque ocorre erro de data retroativa, mesmo inserindo a data de hoje como data de entrada.\n\nPrimeiramente, o cliente estava tentando confirmar a nota com a data 19/12/2023, onde apresentava o erro KND-001039 abaixo:\n\nFizemos alguns testes e verificamos que, mesmo in"], "212-117": ["ESTO16 — Verificar e ajustar diferenças entre estoque físico X inventário - EM TRÂNSITO", "Rotina de Recebimentos, situações.pdf", "Pedido Serviço: 70101 Cliente: Pegada Solicitação:\nVerificar e ajustar diferenças entre estoque físico X inventário - EM TRÂNSITO\n\nNota de saída de transferência 238795: Esta nota ela foi emitida dia 19/11/25   Documentação:\n\nSuprimentos Estoque Consultas Consulta Estoque Produto Detalhamento do desenvolvimento:\nNada foi feito.\n\nObservação:\nA operação 152.2 da nota de entrada não controla estoque, por isso não movimentou o estoque. "], "212-119": ["Nota Fiscal de Entrada (CEXC1024) — estoque os lotes, terceirização está ocorrendo, lançada sem vinculo", "Rotina de Recebimentos, situações.pdf", "Apoio no RA 260504014 https://kundencloud.com.br:3825/atendimento?id=260504014&callType=customer Elenir.Frigolaste 04/05/2026 - 09:07:08 Bom dia\n\nPor gentileza favor verificar.\n\nEssa nota de estorno ficou pendente e agora não permite emitir e nem fazer a inutilização Mensagem: “KND-003895” Detalhe:\n-Essa é uma Emissão de NF Entrada de Estorno, que não autorizou no Sefaz em 010426, e agora estão com problema\nem 040526, mais de 1 mês depois...\n-Não conseguem mais nem inutilizar a NF...  Motivo:\nRenan.Sup 04/05/2026 - 10:02:17\nNão é possível emitir a NF novamente pois ela foi emitida no dia 01/04/2026 e teve movimentações posteriores que\nse confirmar a NF novamente pode gerar inconsistências no"], "213-10": ["Monitor Notas Fiscais Saída (FATU61) — Referente a questão de faturamento, envolvendo questões de impressão das Notas Fiscais", "Monitor Notas Fiscais Eletrônicas – FATU61.pdf", "De: Roberto Schumacher [mailto:roberto@kunden.com.br]\nEnviada em: terça-feira, 15 de janeiro de 2019 16:25\nPara: Marcio Schneider; 'Celso A Andriolli' Cc: 'Ademir Sartori'\nAssunto: Re: RES: Referente a questão de faturamento, envolvendo questões de impressão das Notas Fiscais:\nBoa tarde.\nCaso ocorra alguma falha de comunicação no momento do faturamento, deverá ser fechado o monitor e aberto\nnovamente... esse programa está instalado no servidor, e o usuário terá que ter acesso a essa conexão.\nAbaixo o programa aberto, caso falhe, feche e abra novamente no ícone selecionado abaixo... Após este\nprocedimento, poderá dar continuidade no faturamento. \n\nOBSERVAÇÃO: ESSA É A OPÇÃO “EXECUTAVEL” DO MO"], "213-12": ["Monitor Notas Fiscais Saída (FATU61) — segurança onde deve-se, possibilitar o envio, host for gmail", "Monitor Notas Fiscais Eletrônicas – FATU61.pdf", "Pedido Serviço: 27463 Solicitação:\n\nROTINA:\n\nVendas e Distribuição Faturamento Notas Fiscais\nMonitor Notas Fiscais Eletrônica\n\nAo cadastrar e-mail no FATU146 com Host do Gmail, ocorre erro ao enviar e-mail para qualquer cliente durante a\nemissão de notas fiscais.\n\nALTERAÇÃO:\nSolicita-se:\n-Possibilitar o envio de e-mail quando o Host for Gmail.\n\nDocumentação:\nO ajuste deve acontecer na conta do Gmail, nas configurações de segurança, onde deve-se permitir outros programas para o envio."], "213-22": ["Monitor Notas Fiscais Saída (FATU61) — quantidade de horas, ultrapassou a determinada, respeitadas as configurações", "Monitor Notas Fiscais Eletrônicas – FATU61.pdf", "Pedido Serviço: 28005 Solicitação:\n\nROTINA:\n\nVendas e Distribuição Faturamento Notas Fiscais\nNota Fiscal de Saída\n\nMesmo configurando horas para cancelamento no FATU4, ao tentar realizar o cancelamento de uma nota fiscal\nocorre o aviso de que já ultrapassou a determinada quantidade de horas (mesmo que estas não tenham passado).\n\nALTERAÇÃO:\n-Verificar a quantidade de horas que está no FATU4 e fazer o disparo da mensagem APENAS quando essa quantidade for ultrapassada.\n*Sugestão se for viável: verificar no programa FATU146 a quantidade de horas de cancelamento, ao invés do FATU4\n(para clientes que utilizem o Kunden Monitor).\n\nDocumentação:\nVendas e Distribuição Faturamento Notas Fiscais\nNota Fi"], "213-60": ["Monitor Notas Fiscais Saída (FATU61) — situação sefaz, conclusão que chegamos, apresentou a mensagem", "Monitor Notas Fiscais Eletrônicas – FATU61.pdf", "Para a mensagem de “KND-002175 : Tempo de processamento excedido. Deseja continuar aguardando?” +\nmensagem “...resposta do monitor não encontrada...”\nOcorrido em 050820 durante a noite, na Frigolaste...  \n-não resolveu reiniciar o Serviço...\n-Efetuado o atendimento com apoio de Thomas.\n-conclusão que chegamos é que estava demasiadamente demorado para ter o retorno do Sefaz, olhando estas\npastas onde grava as 4 sequencias de procedimentos...de pelo menos 2 minutos...\n\n-efetuado por Thomas: excluído os arquivos antigos destas pastas acima, porque haviam muitos, milhares de\nregistros em cada pasta...\n-com isso melhorou a performance.\n-Thomas ficou de tratar com Celso questão de melhorias necess"], "213-69": ["Monitor Notas Fiscais Saída (FATU61) — MONITOR NOTAS FISCAIS - CÓDIGO PRODUTO E DESCRIÇÃO DO CLIENTE DEVEM SER LEVADOS PARA XML…", "Monitor Notas Fiscais Eletrônicas – FATU61.pdf", " Pedido Serviço: 46933 Cliente: TEA Solicitação:\nMONITOR NOTAS FISCAIS - CÓDIGO PRODUTO E DESCRIÇÃO DO CLIENTE DEVEM SER LEVADOS PARA XML E DANFE Rotina:\n\nVendas e Distribuição Faturamento Notas Fiscais\nMonitor Notas Fiscais Eletrônica Alteração:\n\n- Código Produto e Descrição Cliente devem ser levados para o XML e Danfe. Esta informação deve ser gerada por\ntamanho, de acordo com o cadastro efetuado no EPRO32.\nTag <cProd> deve ser preenchida com o código do cliente, por tamanho.\nTag <xProd> deve levar a descrição do cliente, concatenando o código cliente e numeração.\n\nDocumentação:\nVendas e Distribuição Faturamento Notas Fiscais\nMonitor Notas Fis\n\nliente e numeração.\n\nDocumentação:\nVendas e D"], "213-87": ["Monitor Notas Fiscais Saída (FATU61) — mostrando casas decimais, alterei a descrição, erp smg", "Monitor Notas Fiscais Eletrônicas – FATU61.pdf", "Sobre a questão de mostrar 2 ou 4 casas decimais na Danfe...\nCaso da Smart...em 140621...\nEstava mostrando 2 casas decimais na Danfe, apesar de no programa FATU2 estava mostrando as 4 casas decimais...\nSmart estava precisando que seja mostrando 4 casas decimais (idem como já mostra para os Frigorificos)...\n\nPara configurar isso:\n\nNesta pasta “D:\\Kunden_ERP\\SMG\\K11\\Monitor\\MONITOR\\Modelo_Danfe” inclui o arquivo\n“Danfe4CasasDecimais.rpt” (que peguei do Desenvolvimento)...\n\n...em seguida, fui no FATU146 e alterei a descrição desta parte final diretamente aqui onde estou posicionado... \n...cliquei no “Gerar PDF” do FATU61 (mesmo que a respectiva NF já estivesse emitida e enviada ao cliente)...\n\n"], "213-102": ["Monitor Notas Fiscais Saída (FATU61) — revisar a questão, nfs de saida, empresas do grupo", "Monitor Notas Fiscais Eletrônicas – FATU61.pdf", "De: Marcio Reni Schneider | Kunden Systems [mailto:marcio@kunden.com.br]\nEnviada em: terça-feira, 8 de março de 2022 17:36\nPara: Marcio Reni Schneider | Kunden Systems Assunto: Aniger, POC Aniger, POC\nrevisar a questão do FATU124: tem que ter o de/para de produto (Vínculos Produtos), mesmo sendo o mesmo\ncódigo de produto sendo usado em todas as empresas do grupo ?? (configuração de tabela = PRODUTO_ATM = ÚNICO)\n(isso quando houverem as NFs de Saida de uma empresa, e depois o recebimento pelo FATU124 por outra empresa\ndo mesmo grupo (caso do Aniger)....\n\nZzzzzzzzzzzzzzzzzzzz\n\nPosição: cfe testes de Roberto para a POC, nestes casos não precisa o de/para...o sistema funciona sem o de/para."], "213-112": ["Monitor Notas Fiscais Saída (FATU61) — tipo de mensagem, teve que intervir, comercializacao e quantidade", "Monitor Notas Fiscais Eletrônicas – FATU61.pdf", "[\n\nSituação ocorrida entre 090323 e 100323, na implantação Aniger:  \n-NF não autorizava e dava a mensagem aqui...\n\n“Rejeicao: Valor do Produto difere do produto Valor Unitario de Comercializacao e Quantidade Comercial”...\n\n...Ou seja, este tipo de mensagem é quando a qtde X valor unitário é maior que a qtde em centav\n\n...\n\n...Ou seja, este tipo de mensagem é quando a qtde X valor unitário é maior que a qtde em centavos (maior que a\ntolerância em centavos admitida pelo Sefaz)...\n\nMotivo:\n\nNa linha abaixo, realmente o valor estava diferente = inicialmente estava 1.140,00 (depois foi arrumado, no exemplo\nabaixo já está arrumado)...\n...o valor não estava de acordo qtde X valor unitário...  Prová"], "213-121": ["Monitor Notas Fiscais Saída (FATU61) — vlr total from, nfs item atm, num dos itens", "Monitor Notas Fiscais Eletrônicas – FATU61.pdf", "Visto em 041023...na implantação Aniger...Para esta mensagem...\n\n“Rejeicao: Valor do Produto difere do produto Valor Unitario de Comercializacao e Quantidade Comercial”  \n[15:44] Aline Kaefer | Kunden Systems\nisso significa que a quantidade x o valor unitario é diferente do valor total\nno item da NF exemplo, QTD = 1\nVLR UNI = 1\nValor Total = 3\n[15:44] Aline Kaefer | Kunden Systems\nesse exemplo daria esse mesmo erro ali que ta dando pra ti\n\nEste caso está acontecendo porque tem um agravante, porque na BD Aniger está configurado para agrupar por\nproduto no XML e na Danfe, e aí as diferenças encontradas tendem a ser maiores (porque faz a soma dos itens).\nPara resolver...:\nabri o XML que está ne"], "215-5": ["ESTO30 — RELATÓRIO ANÁLISE DE CONSUMO PREVISTO X REALIZADO | AGRUPAR E FAZER UM TOTALIZADOR POR…", "Relatório Analise Consumo Previsto X Realizado - ESTO30.pdf", "Pedido Serviço: 9896 Solicitação:\nRELATÓRIO ANÁLISE DE CONSUMO PREVISTO X REALIZADO | AGRUPAR E FAZER UM TOTALIZADOR POR SOLICITANTE.\n\nEste agrupamento e subtotal por solicitante deve ser feito para este relatório substituir o relatório que tínhamos na\nV3 de (ANALISE DE CONSUMO INDIVIDUAL).\n\nNo programa de abastecimento adicionar o campo aonde possamos informar o \"solicitante\", que vai receber o material.\n\nDocumentação:\n- Criado programa cadastro de Solicitantes (ESTO84).\n- A partir de agora nos programas \"Apontamento de Requisição (ESTO79)\" e \"Plano Abastecimento Materiais -\nRequisição (ESTO25)\", será possível informar também o solicitante no momento da baixa.\n- No relatório \"Relatório de C"], "215-16": ["ESTO30 — CRIAR UMA NOVA LÓGICA PARA VINCULAR NO PLANO DE PRODUÇÃO QUAL A SUA SITUAÇÃO PARA CONSUMO", "Relatório Analise Consumo Previsto X Realizado - ESTO30.pdf", "Pedido Serviço: 22098 Cliente: Pegada Solicitação:\n\nCRIAR UMA NOVA LÓGICA PARA VINCULAR NO PLANO DE PRODUÇÃO QUAL A SUA SITUAÇÃO PARA CONSUMO.\n\nROTINA:\n\nPrograma / Rotina Nova ALTERAÇÃO:\n\nCriar uma nova coluna no plano de produção(MPSP5) que indicará a situação para consumo. Este coluna deverá ser\numa listagem com base em um novo programa de \"Situações para Consumo\". Este novo pograma terá as\ninformações de Empresa, Unidade de Negócio, Código (sequencial), Descrição e Situação.\n\nCriar também um filtro novo no programa Relatório Análise Consumo Previsto x Realizado (ESTO30) para selecionar\nquais \"Situações para consumo\" devem ser listadas.\n\nCriar um parâmetro de inicialização para permitir so"], "215-19": ["ESTO30 — ESTO30 - RELATÓRIO ESTA DIVIDINDO INFORMAÇÕES DOS MATERIAIS, E OS MATERIAIS QUE NÃO…", "Relatório Analise Consumo Previsto X Realizado - ESTO30.pdf", "Teste feito na Oksebra, em 190821, que tem o patch 226, referente caso do pedido serviço 51905, na qual Pegada\nestava solicitando que voltasse a gerar as informações no relatório, mesmo de necessidades/materiais que não\ntiveram nenhum consumo até o momento (cfe Pegada, depois da atualização do patch 228, não está mais trazendo\ndados no relatório se não tiver consumo...(inclusive enviaram relatório impresso anteriormente onde comprova que\na rotina gerava dados no relatório com esta condição)...\nPorém no teste feito na Oksebra, pela conclusão deste teste a rotina não gera dados no relatório se não tiver consumo do material:\n\nCfe analisado abaixo, se lista ou não lista materiais não abastecidos"], "232-0": ["Relatório Posição Estoque (ESTO13) — suprimento tmp atm, relatório posição estoque, tabelas temporárias", "Relatório Posição Estoque - ESTO13.pdf", "Relatório Posição Estoque..\n\nO sistema só habilita o filtro de produtos com qtde negativa no Relatório Posição Estoque, quando o parâmetro 32 está D (Diário)\n\nPorque a principio só poderia ter qtdes negativas quando o parâmetro está D.\n\nXxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx\n\nPesquisado para Wolmir, que ficou de criar um relatório excel partindo das tabelas temporárias:\n(isso para obter dados de valores por mês, que não gravados em tabelas Kunden (
