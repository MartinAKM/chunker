produção (MPS) \nPlano mestre de produção Atualizar MRP Alteração:\nAjustar o programa de atualização do MRP para considerar a data de cadastro do plano. Dessa forma, mesmo que o\nmaterial tenha sido inativado, não deverá excluir as necessidades, desde que a data de validade final seja posterior à\ndata de cadastro do plano de pr"], "353-3": ["Estruturação de Produto (EPRO15) — Explicações adicionais para Piagui em 09052016", "Características de Produto.pdf", "Explicações adicionais para Piagui em 09052016:\n\nEn el catálogo programa “Configuración Características Producto”, es posible utilizar:\n\nEs posible definir un vínculo de “Referencia” de una Característica en base a otra característica ya en el catálogo.\nEjemplo pantallas abajo.\nEn la característica “Segmento”, configurar que es dependiente de la definición del “Grupo Segmento”…\n\nAcá, el catálogo de Grupo Segmento y Segmento…\nEn el Segmento ya hay el vínculo con el Grupo Segmento…\n\nY al hacer el catalogo en la Estructuración del Producto, después de vincular el Grupo Segmento, trae solamente\nopciones de Segmento de acuerdo el Grupo Segmento definido arriba.   Zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz"], "353-4": ["Estruturação de Produto (EPRO15) — config caract produto, somente a nível, replicá-las aos itens", "Características de Produto.pdf", "Visto na implantação/migração de Produtos e suas características, na Aniger, em nov/dez/22:\n\nTabela onde são gravados os dados das Características:\n\nPRODUTO_CARACT_ATM Zzzzzzzzzzzzzzzzzzzzzzzzzzzz\n\nResumo de todas as tabelas envolvidas na característica, do seu cadastro, até chegar na informação no programa Estruturação de Produto-EPRO15:\n\nExemplo:\nSELECT * FROM CONFIG_CARACT_PRODUTO_ATM;\n\nSELECT * FROM CARACT_PRODUTO_ATM WHERE config_caract_produto_id = 225854;\n\nselect * from produto_caract_atm WHERE caract_produto_id IN (SELECT ID FROM CARACT_PRODUTO_ATM WHERE config_caract_produto_id = 225854);\n\nExemplo do acima, nos programas: \nSELECT * FROM CONFIG_CARACT_PRODUTO_ATM;\n\nSELECT * FROM CARA"], "353-6": ["EPRO02 — ROTINA \"CARACTERÍSTICAS\": EVOLUIR COM NOVAS FUNCIONALIDADES", "Características de Produto.pdf", "Pedido Serviço: 66751 Cliente: Piagui Solicitação:\nROTINA \"CARACTERÍSTICAS\": EVOLUIR COM NOVAS FUNCIONALIDADES.\n\n1. Rotina “Características”: evoluir com novas funcionalidades.\n\n1.1. No programa “Categoria-EPRO2”:\n-Incluir um botão “Config. Caract.” (Configuração de Características), e ao seu lado esquerdo um\ncampo que identifica se há algum preenchimento de Configuração de Característica neste botão (a\nrotina deve preencher este campo com “Sim” quando há algum preenchimento no botão, e “Não”\nquando não há algum preenchimento no botão = funcionalidade semelhante ao campo “Cat. Mat.” já existente).\n\nNeste botão “Configuração de Características” (tela abaixo), abrir a seguinte tela e campos:\nC"], "353-8": ["EPRO02 — posicionado na característica, veja que acessei, referente às características", "Características de Produto.pdf", "1.2.3 Quando no Produto tenha uma Categoria cujo botão “Configuração de Características” não\ntenha selecionado a definição “Categoria sem Características” e também não tenha vinculado Características:\n-Neste caso manter a rotina como está atualmente, ou seja, na aba Características serão\nmostradas todas as Características cadastradas no programa “Configuração Características\nProduto-EPRO48” (apenas registros “Ativos”).\n\n1.3. Revisar a maneira como está sendo mostrado no botão da aba “Propriedades”, a informação do ID\nda Característica vinculada ao Produto.   Exemplo tela abaixo...\nVeja que acessei o botão de Propriedades, e estando posicionado na 1ª característica preenchida, é\nmostrado o ID"], "357-4": ["Componente (EPRO14) — coluna emitir cartão, materiais da estruturação, definida no produto", "Cartão Componente.pdf", "Documentação:\nCOMPONENTE (EPRO14)\nNa aba padrões passa a ser disponibilizada a coluna Emitir Cartão.\nEsta coluna tem como padrão o valor 'Sim' quando criado um novo componente.\nÉ IMPORTANTE/FUNDAMENTAL que a coluna Emitir Cartão seja configurada de forma apropriada neste cadastro,\npois o seu valor será replicado como padrão na lista de materiais da estruturação do produto.\n\nESTRUTURAÇÃO DO PRODUTO (EPRO15)\nNa aba Configuração/Manufatura/Dados Gerais foi excluída a coluna Emitir Cartão.\nAté o momento esta era uma definição efetuada no produto.\nA partir deste pedido serviço, esta definição passa a ser efetuada na lista de materiais.\nA coluna Agrupamento Cartão continua sendo definida no produt"], "361-1": ["Categoria (EPRO2) — Sabes como transformar uma imagem em extensão .ico?", "Categoria – EPRO2.pdf", "De: Diego Teixeira [mailto:diego.t@kunden.com.br]\nEnviada em: terça-feira, 3 de outubro de 2017 07:56\nPara: Marcio - Kunden\nAssunto: Re: ENC: Sabes como transformar uma imagem em extensão .ico?\n\nBom dia,\neu utilizei um site que faz o serviço de transformar a imagem em ícone.\n\nhttps://convertio.co/pt/jpg-ico/\n\nSobre diminuir o ícone, teria que utilizar um editor de imagem. \n Zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz"], "361-4": ["Categoria (EPRO2) — rotina da categoria, modelos produtos acabados, produto em específico", "Categoria – EPRO2.pdf", "Detalhamento:\nCriado novo programa para inserção / alteração / exclusão de materiais da lista de materiais de um produto em específico.\n\nLayout do programa é em estilo tabela.\n\nSerá aberto pela Estruturação do Produto (Programa EPRO15), ao clicar na aba \"Lista Materiais Especial\".\n\nManufatura\nEngenharia e Desenvolvimento de Produto Cadastros Categoria Detalhamento:\n\nAdicionada funcionalidade para vincular categorias de materiais à categoria do produto.\nFuncionalidade para permitir definir quais os materiais das categorias de produtos que serão permitidos\nvincular na Lista de Materiais (e mostrar na sua lista de valores).\nNo programa Categoria, há um novo campo “Cat. Mat.” indicando se a cate"], "362-0": ["Classificação (EPRO67) — DIVERSOS: CRIAR O CADASTRO \"CLASSIFICAÇÃO\" PARA SER VINCULADO NA ESTRUTURA DO PRODUTO.…", "Classificação – EPRO67.pdf", "Classificação – EPRO67..\n\nPedido Serviço: 19839 Solicitação:\nDIVERSOS: CRIAR O CADASTRO \"CLASSIFICAÇÃO\" PARA SER VINCULADO NA ESTRUTURA DO PRODUTO. TRATAR RELATÓRIOS Manufatura\nEngenharia e Desenvolvimento de Produto Cadastros Classificação (cadastro novo) Engenharia Estruturação de Produto Chão de Fábrica Relatórios de Produção\nRelatório de Produção da Classificação - Análise da Classificação - CFAB79\nRelatório Analise de Compras Matéria-Prima Couro / Fornecedor - CFAB101\nRelatório da Ficha Técnica, programas EPRO34 E EPRO35_CURTUME ALTERAÇÃO:\n\n1=Criar cadastro novo \"Classificação\":\nNeste cadastro serão cadastradas as classificações utilizadas pelos curtumes.\nExemplo:\nTR1 TR2 TR3 IV V VI VI"], "363-6": ["ADMI16 — Etiqueta EAN Boa tarde,", "Códigos EAN de Produtos Acabados_e Emissão de suas Etiquetas.pdf", "De: Marcio Schneider [mailto:marcio@kunden.com.br]\nEnviada em: quarta-feira, 29 de janeiro de 2020 16:28\nPara: 'Controladoria - MCM'\nCc: 'Planejamento - MCM Artefatos'\nAssunto: RES: Etiqueta EAN Boa tarde,\n-a intenção é a MCM comprar licenças de códigos EAN, e codificar seus produtos próprios com esta codificação?\nSe sim, apenas adiantando, no sistema o registro das licenças compradas de códigos EAN é feita neste programa:\n\nA partir de ter registrado a numeração disponível pela EAN, e querendo iniciar a utilização e vinculação nos seus\nprodutos, configura-se este parâmetro para “S” de sim:  \n...e neste programa, onde se emite as etiquetas unitárias para cada produto, o sistema vai gerenciand"], "364-1": ["Composição Plano Produção (CFAB20) — CFAB20 - Analisar relatório não está exibindo todas as quantidades que realmente estão no…", "Composição Plano Produção – CFAB20.pdf", "\nREFERENTE AO ABAIXO, EU NÃO ENTENDI O QUE TEM HAVER O QUE FOI ESCRITO NA “DOCUMENTAÇÃO” COM A\nREAL SITUAÇÃO DESCRITA NO PEDIDO SERVIÇO (O QUE EU TAMBÉM TENHO DÚVIDAS...IDEAL SERIA REVISAR\nCOMO FOI DESENVOLVIDO ORIGINALMENTE ESTA OPÇÃO DO “Listar com Aproveitamento” DO RELATÓRIO) Pedido Serviço: 69204 Cliente: Labelli Solicitação:\nCFAB20 - Analisar relatório não está exibindo todas as quantidades que realmente estão no plano Rotina:\nManufatura Chão de Fabrica Relatório de Produção\nComposição Plano de Produção Alteração:\n1 - Verificar o relatório CFAB180, que atualmente não exibe a quantidade de aproveitamento nas seguintes situações:\nAo gerar o plano de produção com aproveitamento, temos um "], "369-1": ["Consulta Etiqueta Unidade Produto (CFAB56) — APONTAMENTO DO PAR: DESENVOLVER A ROTINA DE APONTAMENTO DO PAR A PAR", "Consulta Etiqueta Unidade Produto – CFAB56.pdf", "Pedido Serviço 3582 Solicitação:\nAPONTAMENTO DO PAR: DESENVOLVER A ROTINA DE APONTAMENTO DO PAR A PAR.\n\nNecessário também:\n- impressão de etiqueta do par;\n- programa de apontamento, via coletor;\n- relatório que mostre os dados da tabela de par e situação de apontamento.\n\nNecessário avaliar rotina existente na V3, e desenvolver as mesmas funcionalidades.\n\nSobre a impressão da etiqueta do apontamento do par:\nA empresa utiliza a versão V3, o programa Emissão Etiquetas p/ Apontamento, com classificação DATAMAX\nObservar a alteração efetuada no Pedido serviço 3209:Alterar ordem de impressão das etiquetas:\npassar a impressão para a seguinte ordem:\nOrdem de Fabricação, largura, tamanho.\n\nDocumentaçã"], "369-3": ["Consulta Etiqueta Unidade Produto (CFAB56) — KUNDEN ENCAIXOTAMENTO - NECESSÁRIO CONSULTA DOS TALÕES QUE AINDA NÃO FORAM LIDOS NA…", "Consulta Etiqueta Unidade Produto – CFAB56.pdf", "Pedido Serviço: 57551 Cliente: Lutheuz Solicitação:\nKUNDEN ENCAIXOTAMENTO - NECESSÁRIO CONSULTA DOS TALÕES QUE AINDA NÃO FORAM LIDOS NA APLICAÇÃO.\n\nRotina:\n\nManufatura Chão de Fábrica Consultas\nConsulta Ordem de Fabricação – CFAB2 Alteração:\n\nNecessário consulta dos talões que ainda não foram lidos na aplicação de \"Encaixotamento e Liberação Faturamento\".\n\nDocumentação:\nManufatura Chão de Fábrica Consultas\nConsulta Ordem de Fabricação – CFAB2 Detalhamento:\nAdicionada a Check Box \"Exibir Apenas Talões não Encaixotados\" para filtrar somente os talões “não encaixotados”*\nna aba de \"Talão\".\n\n*no caso, referente ao “não encaixotados”, este procedimento ocorre na leitura de talões no programa\n“Enc"], "370-6": ["Consulta Ordem de Fabricação (CFAB2) — necessidade de compra, três vezes, triplicado", "Consulta Ordem de Fabricação - CFAB2.pdf", "Pedido Serviço: 42116 Cliente: TEA Solicitação:\n\nRotina:\nSuprimentos\nPlanejamento Necessidade de Materiais Abastecimento (MRP)\nPlano Abastecimento Materiais - Requisição Alteração:\n- No programa ESTO25, a necessidade de sintetico está diferente da necessidade de compra pelo COMP13,\nVer e se necessário, ajustar a rotina para que no ESTO25 também mostre a mesma quantidade.\n\nNo ESTO25, filtrando o plano 689 e o produto 20834\nGerou necessidade de 113,4 metros = triplicado, porque a necessidade real é 37,80\nNo COMP13, também filtrado o mesmo plano e produto\nGerou necessidade de compra de 37,8 metros = aqui correto...\n\nAnalisando o plano... as OFs que necessitam deste material são as três abaixo.\n"], "370-7": ["Consulta Ordem de Fabricação (CFAB2) — Situação vista na Aniger em 210223", "Consulta Ordem de Fabricação - CFAB2.pdf", "Situação vista na Aniger em 210223:\n\nUtilizei este select para identificar os Recursos Base Planejamento do cada\n\nta na Aniger em 210223:\n\nUtilizei este select para identificar os Recursos Base Planejamento do cadastro do PREC8, que tem vinculado mais de\n1 vez o mesmo Processo...\n\nSELECT RECURSO_BASE_ID, PROCESSO_ID, COUNT (PROCESSO_ID) FROM CONFIG_RECURSO_BASE_ATM\nWHERE PROCESSO_ID > 0\nHAVING COUNT (PROCESSO_ID) > 1 GROUP BY RECURSO_BASE_ID,PROCESSO_ID;\n\nSELECT * FROM RECURSO_ATM WHERE ID IN (609, 611); \nTendo mais de 1 vez o mesmo código de Processo, gera duplicação de dados visualizados em alguns\nprogramas/consultas, como o abaixo...(revisado por Roberto, abaixo):\n\n[17/02 10:31] Roberto S"], "372-22": ["Cópia de Ordem de Fabricação (CFAB59) — linha do material, veja que zerou, trazido no abastecimento", "Copia Ordens de Fabricação - CFAB59.pdf", "Em 121124, avaliação realizada para atender a um questionamento ao protocolo 241107009/Wellour, referente a...\n\n“Monica.Wellour 07/11/2024 - 10:09:45\nBom dia, tudo bem?\nconseguem ver a movimentação que foi feita nessa OF? ela foi estornada, a princípio corretamente, porém as peças\ncontinuam aparecendo (olhando a tela abaixo a qtde de 532 PC (TAMBÉM MOSTRA NO CFAB59) Monica.Wellour 11/11/2024 - 14:27:55\nOlá, só existem dois programas que são obrigatórios para estornar uma OF\nprimeiro esse, onde é informada a of nessa tela e após, na aba requisições é alterado e excluído a matéria prima que foi abastecida\n\napós esse processo, vem nesse programa aqui, informa o numero da OF e o número 2, aí abr"], "372-24": ["Cópia de Ordem de Fabricação (CFAB59) — exclusão do abastecimento, usados deste lote, tive que desfazer", "Copia Ordens de Fabricação - CFAB59.pdf", "Hidro_situação em 040925 em que foi necessário excluir o abastecimento WB que havia sido feito no ESTO112:\n-A necessidade porque utilizar de um Lote “errado” = porque na pratica este Lote teve que ser devolvido ao\nFornecedor através de uma NF de Saída...e na NF de Saída houve a validação do sistema que não permite a\nDevolução de outros Lotes que não sejam dos Lotes da Compra...\n...então, tive que desfazer o consumo destes Lotes abaixo (porque fisicamente não foram usados deste Lote para\nfazer o consumo, tanto é, que foi devolvido fisicamente este Lote/esta NF de Entrada)  \nEstava assim antes da Exclusão do abastecimento...este era o movimento...estas tela abaixo é antes da Exclusão deste aba"], "374-21": ["Emissão Ordem de Fabricação (CEXC55) — EMISSÃO ORDEM DE FABRICAÇÃO - RELATÓRIO NÃO ESTÁ LISTANDO OFS DA MANEIRA CORRETA ROTINA…", "Emissão de OF.pdf", "Pedido Serviço: 50571 Cliente: Brisa Solicitação:\nEMISSÃO ORDEM DE FABRICAÇÃO - RELATÓRIO NÃO ESTÁ LISTANDO OFS DA MANEIRA CORRETA ROTINA Manufatura Chão de Fábrica Relatórios Gerenciais\nEmissão de Ordem de Fabricação – CEXC55 ALTERAÇÃO\n\n- Relatório não está listando OFs da maneira correta.\nDevem ser listadas primeiro as OFs dos produtos acabados e em seguida as OFs das soluções.  Documentação:\nManufatura Chão de Fábrica Relatórios Gerenciais\nEmissão de Ordem de Fabricação Detalhamento:\nNada foi feito."], "374-22": ["Emissão Ordem de Fabricação (CEXC55) — EMISSÃO DE ORDEM DE FABRICAÇÃO - CEXC55 - REPORT CEXC56 - TRAZER A ORDEM DOS MATERIAIS…", "Emissão de OF.pdf", "Observação:\nO relatório gera as informações ordenando primeiramente pela OF origem, após o código da OF e por último a descrição do produto.\n\nZzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz\n\nEm 090525, avaliação feita do relatório CEXC55, para entendimento do protocolo nro 250409032, campo “QTD.\nRESERVADA:”\n\n“Favor verificar, esse problema no consumo das Ofs. Não está constando nas Ofs a quantidade reservada.\nSegue telas”\n\nAvaliado e a conclusão é a seguinte:\nEste campo teve manutenções nos pedidos serviço 2243 e 2763 (através da informação de Deisy para Gabriela que\n“...a Brisa tem uma procedure específica para esse relatório “BRISA_GERA_MANUFATURA_1TMP_P ...”...então,\npartindo deste "], "374-24": ["Consulta Ordem de Fabricação (CFAB2) — cordato na tentativa, colocamos o atributo, listar somente materiais", "Emissão de OF.pdf", "Em 240522, mensagem “ORA-20000: Erro GERA_MANUFATURA_1TMP_P: ORA-00936: missing expression”...\nOcorrido na implantação da Cordato, na tentativa de Emissão de OF – CFAB7...\n\nIdentificado que ocorre quando o parâmetro de Inicialização\nLISTAR_SOMENTE_MATERIAIS_COM_NECESSIDADES_GERADAS está com Atributo = N, então gera esta mensagem... \nPara resolver: colocamos o atributo com S, e aí gerou o relatório:"], "374-28": ["CFAB155 — passando a imprimir, versão de impressão, emissão ordem", "Emissão de OF.pdf", " Pedido Serviço: 65427 Cliente: VPS Solicitação:\n\nRotina:\n\nManufatura Chão de Fábrica Relatórios de Produção\nEmissão Ordem de Fabricação Alteração:\n\nPrograma \"Emissão de Ordem de Fabricação-CFAB7\": criar nova versão de impressão, a partir da versão CFAB155,\nalterando os seguintes 3 itens abaixo:\n\n-O código de barras, passando a imprimir o código de barras com a informação apenas do nro da OF (sem a\ninformação do Processo) para possibilitar que o código de barras seja lido em programas de Apontamento de\nProdução \"APONTAMENTO PRODUCAO OF UNICO\".\n-A descrição do código de barras (que é impresso logo abaixo do Código de Barras) passando a imprimir cfe a\nalteração do item acima.\n-Deixar de imprim"], "374-32": ["CFAB11 — EMISSÃO DE OF: ADEQUAR A IMPRESSÃO DA OF (CAMPOS, LAYOUT)", "Emissão de OF.pdf", "De: Marcio Reni Schneider\nEnviada em: quarta-feira, 7 de maio de 2025 14:59\nPara: Alexis Rafael Villarroel Ramirez <alexis.villarroel@kunden.com.br>\nAssunto: Alexis, precisava que você orçasse um Pedido de Serviço Especificação para AKS...\n\n...tendo como base a mesma funcionalidade já existente neste pedido de serviço 8328 abaixo...(Só a funcionalidade\nque está em vermelho) Pedido Serviço: 8328 Solicitação:\nEMISSÃO DE OF: ADEQUAR A IMPRESSÃO DA OF (CAMPOS, LAYOUT)\nAdequar a impressão da OF (campos, layout). Possivelmente versões diferentes de acordo com produto (Estofamento, tapetes,...) Documentação:\nEMISSÃO ORDEM DE FABRICAÇÃO (CFAB7)\nRelatório Emissão de Ordem de Fabricação Tapetes (CFAB1"], "375-2": ["CFAB158 — CFAB7 - CRIAR NOVA VERSÃO DO RELATÓRIO Rotina", "Emissão de OF_Tipos de emissão de OF e variações de Report.pdf", "Pedido Serviço: 39805 Cliente: Pegada Solicitação:\nCFAB7 - CRIAR NOVA VERSÃO DO RELATÓRIO Rotina:\n\nManufatura Chão de Fábrica Relatórios de Produção\nEmissão Ordem de Fabricação Alteração:\n\nCriar nova versão do relatório com base do relatório CFAB11_HKUNTZLER_2_OFS_PAGINA.\n\nEsta nova versão do relatório, irá ter a observação do componente atrás do nome do produto, excluindo uma linha\nque não estava sendo usada.\n\nCom esta alteração, será criado um novo campo chamado INSUMO UNIT., que irá trazer o insumo bruto unitário por material.\n\nDocumentação:\nManufatura Chão de Fábrica Relatórios de Produção\nEmissão Ordem de Fabricação Detalhamento:\nCriado novo relatório CFAB158 com as alterações solicitad"], "375-3": ["Emissão Ordem de Fabricação (CEXC55) — EMISSÃO ORDEM DE FABRICAÇÃO: CRIAR NOVA VERSÃO DE EMISSÃO DE ORDEM DE FABRICAÇÃO Rotina", "Emissão de OF_Tipos de emissão de OF e variações de Report.pdf", "Pedido Serviço: 48041 Cliente: Smart Solicitação:\nEMISSÃO ORDEM DE FABRICAÇÃO: CRIAR NOVA VERSÃO DE EMISSÃO DE ORDEM DE FABRICAÇÃO Rotina:\n\nManufatura Chão de Fábrica Relatórios de Produção\nEmissão Ordem de Fabricação Alteração:\n\nRotina:\n\nManufatura Chão de Fábrica Relatórios de Produção\nEmissão Ordem de Fabricação Alteração:\n\nCriar nova versão de Emissão de Ordem de Fabricação, fazendo uma cópia da versão atual CEXC55/CEXC56, e\nefetuar as seguintes alterações:\n\n1= Incluir a coluna “Recurso” ao lado direito da coluna “Processo” (para obter espaço, colunas que ficam mais a\ndireita de preenchimento manual de 1 a 9 reduzir para 1 a 4 (mais abaixo, item 2, será necessário mais espaço para\naument"], "375-6": ["CFAB155 — Versão CFAB155, emissão OF em etiqueta adesiva Térmica, para TEA/Terra e Agua", "Emissão de OF_Tipos de emissão de OF e variações de Report.pdf", "Versão CFAB155, emissão OF em etiqueta adesiva Térmica, para TEA/Terra e Agua:\n\nxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx\n\nCFAB176 | Sequência 1 (Report) emissão OF em etiqueta adesiva Térmica, VPS:    "], "383-13": ["Estruturação de Produto (EPRO15) — tipo produto, marca no item, implantação na pacific", "Estruturação de Produto - EPRO15 com rotina nova de criação de Produto Acabado pelas Marcas_Variação, para Henrich.pdf", "Informações gerais desta nova rotina, com base nos meus testes e pesquisas efetuados:\n\n- a rotina não utiliza mais o a versão antiga do programa “Configurador de Produto” EPRO28 (coordenado por mim na\nvirada da K11 no Henrich).\n\nTelas, testes e conceitos da rotina nova:\nDesenvolvido a partir do pedido de serviço 31967\n...aqui determinação dos componentes Dependentes*(ver postagem de 030920 sobre Dependentes), Cartelas\n...todas as regras quanto às Especificações são definidas aqui nesta tela, no bloco “Especificação” (este programa\nEPRO77 acessado pela aba “Mat Esp.” do EPRO15) criado especialmente para atender à rotina nova.\nTelas abaixo do Henrich...\n\n...aqui o cadastro de Marca, e o vincul"], "383-49": ["Estruturação de Produto (EPRO15) — SKUs duplicadas", "Estruturação de Produto - EPRO15 com rotina nova de criação de Produto Acabado pelas Marcas_Variação, para Henrich.pdf", "De: Marcio Schneider <marcio@kunden.com.br>\nEnviado: terça-feira, 8 de dezembro de 2020 09:24\nPara: José Leandro Wiest <jose.wiest@henrich.com.br>\nAssunto: RES: SKUs duplicadas\n\nBom dia Jose Leandro\n\nChegaram a avaliar sobre o abaixo?\n\nEu dei mais uma olhada, e ao que me parece, é devido a uma maneira como foram criadas as opções nas\n“Variações”. Exemplo tela abaixo:\nTem 2 opções de conjuntos para a cor “240-BRANCO” e a cor “8584-RAISIN” (outras cores desta variação não tem\nestas duplicidades de conjuntos, e aí não vai gerar produtos acabados duplos).\nPara mim, é errado ter este cadastro desta maneira, 2 conjuntos diferentes para a mesma cor.\nEntão, da maneira que está, logicamente vão estar"], "383-72": ["Estruturação de Produto (EPRO15) — PEDIDO DE VENDA: MOSTRAR OS COMPONENTES COM OS RESPETIVOS MATERIAIS QUE FORAM…", "Estruturação de Produto - EPRO15 com rotina nova de criação de Produto Acabado pelas Marcas_Variação, para Henrich.pdf", "  Pedido Serviço: 39547 Cliente: Henrich Solicitação:\nPEDIDO DE VENDA: MOSTRAR OS COMPONENTES COM OS RESPETIVOS MATERIAIS QUE FORAM ESPECIFICADOS, NO\nBOTÃO \"P+\" E NA IMPRESSÃO Rotina:\n\nVendas e Distribuição Pedidos Pedido Pedido de Venda Alteração:\n\n1= Criar parâmetro de inicialização no programa de Pedido de Venda PEDI1, para criar opção de obrigar informar o\ncampo \"Marca\" na aba Dados Gerais.\n\n2= Mostrar no Pedido de Venda PEDI1, ao clicar no botão \"P+\":\n- os componentes com os respetivos materiais que foram especificados no item de Pedido de Venda posicionado\n(seja especificado diretamente ou através da configuração de \"Dependente\").\n- além de também mostrar a cadeia de \"Conjuntos\" que fi"], "386-3": ["Compras (EPRO60) — Avaliado os campos abaixo, na implantação Aniger", "Estruturação de Produtos – Compras – EPRO60.pdf", "Avaliado os campos abaixo, na implantação Aniger:\n\n“Lote Econômico Compras”: tem a função de ser o Lote Multiplo. Exemplo em sintéticos que o fornecedor só venda de\n50 em 50. Neste caso, ao gerar o Pedido de Compras pelo MRP, vai gerar de 50 em 50.\n\n“Pedido”: informei que não se aplica.\n\n“Agrupamento Plano Necessidades”: é a configuração de como mostrar no COMP13, aba “Necessidades” (e, neste\nprograma, na aba Opções/Agrupamento, ainda tem a possibilidade de optar pela configuração abaixo, ou uma outra).\n\n“Tipo Agrupamento Entrega”, com as opções Diária e Única...\n...exemplo tela abaixo, sendo “Única”, então vai agrupar na mesma Datas de Entrega toda a qtde do Plano de\nProdução (exemplo telas"], "387-1": ["EPRO58 — cotações de compras, wms, utilizados apenas", "Estruturação de Produtos – Inventário – EPRO58.pdf", " \nEm 201222, para a implantação Aniger, analisado a utilização do campo Fator Conversão para indicar a Largura dos\nSintéticos, para que seja exportado a informação da largura ao WMS , e o WMS fazer o calculo de qtde de ML a\nseparar (sendo o controle de Estoque tanto no Kunden como no WMS em M2)...\n\nEfetuado vários testes para ver o impacto no programa de Cotações de Compras-COMP14 e no Ped\n\nM2)...\n\nEfetuado vários testes para ver o impacto no programa de Cotações de Compras-COMP14 e no Pedido de Compras-\nCOMP3 e no Recebimento-COMP5, e em nenhum dos 3 programas refletiu/impactou ter a definição de Fator de\nConversão do EPRO58 tela acima (não sugeriu em diversos testes, de diversas maneiras r"], "389-7": ["Emissão de Etiqueta por Unidade de Produto (PEDI7) — viernes de noviembre, buenos dias erandi, systems ana mailto", "Etiquetas Térmicas, funcionamento.pdf", "De: Kunden Systems | Ana [mailto:Ana@Kunden.com.br]\nEnviado el: viernes, 11 de noviembre de 2011 05:59 a.m.\nPara: etrechuelo@kunden.com.mx\nCC: jorge@kunden.com.br; 'Alfredo Hernández'; 'Denisse Ramírez'; max@kunden.com.br; marcio@kunden.com.br\nAsunto: RE: K11 - Etiquetas Buenos dias Erandi,\n\nAnexo ejemplos de los distintos modelos de etiquetas existentes.\n\nLa imagen abajo corresponde al programa/reporte para emisión de etiquetas en impresora láser. (Forms: PEDI7) "], "393-10": ["CFAB51 — FINALIZAÇÃO DE PRODUÇÃO - PEDIDO RELACIONADO AO PEDIDO 7934 E 9056", "Finalização de Produção - CFAB51.pdf", "Pedido Serviço: 9057 Solicitação:\nFINALIZAÇÃO DE PRODUÇÃO - PEDIDO RELACIONADO AO PEDIDO 7934 E 9056\nManufatura | Chão de Fábrica | Consultas | Consulta Ordem de Fabricação\n\nHoje, quando uma OF é finalizada ou encerrada, não há como buscar essa informação no sistema. A OF apenas não é\nmais considerada para o Planejamento.\n\nSugestão: criar uma coluna no programa Consulta Ordem de Fabricação onde a situação da OF seja indicada,\nquando Encerrada ou Finalizada. Sendo assim, seria necessário a inclusão de novas colunas: uma para a Finalização\nque é tratada na rotina por OF; e uma para o Encerramento que é tratada por processo.\nAs colunas podem ser nomeadas como OF Finalizada (opções SIM / NÃO com"], "395-6": ["Esta configuração é feita no programa Grade (EPRO10) — Visto no treinamento interno com Roberto em 210521", "Grades - EPRO10.pdf", "Visto no treinamento interno com Roberto em 210521:\n\nBotão “Grade Exportação”:\n\nExiste para atender empresas como TEA, na emissão de Etiquetas dos calçados.\nO que informar aqui, vai imprimir na mesma etiqueta as diversas opções de tamanhos, no mesmo calçado.\nExemplo pratico: em calçados que tenham impresso o tamanho por exemplo em vários padrões, como Brasil, Mercosul, USA,...\nA “Descrição” que colocar aqui, vai ser impressa na etiqueta. \nÉ uma funcionalidade bem restrita à impressão de etiquetas: não tem haver diretamente com a rotina do\nGrade a Marcar do Kunden ERP.\n\nCheck box “Tamanho base”: é usado para sugerir no EPRO15, na Lista de Materiais, no campo “Variação de\nConsumo” para indicar"], "396-0": ["Grupo Código Barras (EPRO101) — ESTRUTURAÇÃO DE PRODUTO (EPRO15) - TER POSSIBILIDADE DE INFORMAR MAIS DE UM CÓD. DE", "Grupo Código Barras – EPRO101.pdf", "Grupo Código Barras – EPRO101..\n\nPedido Serviço: 59706 Cliente: Aniger Solicitação:\nESTRUTURAÇÃO DE PRODUTO (EPRO15) - TER POSSIBILIDADE DE INFORMAR MAIS DE UM CÓD. DE\nBARRAS NA GRADE DO MESMO PRODUTO.\n\nRotina:\n\nManufatura\nEngenharia e Desenvolvimento de Produto Engenharia Estruturação de Produto Alteração:\n\nTer possibilidade de informar mais de um cód. de barras na grade do mesmo produto.\nDefinir qual cód. usar no cliente.\nDemanda criação de cadastro: \"Grupo cód. barras\" .\n\nDocumentação:\n\nParâmetro Geral:\n50251 | HABILITA O CONTROLE DE GRUPO DE CÓDIGO DE BARRAS | DEFINE SE O SISTEMA HABILITARÁ O\nCONTROLE DE GRUPOS DE CÓDIGOS DE BARRAS NO CADASTRO DO CLIENTE E NA ENGENHARIA DO PRODUTO.\nATRIB"], "397-2": ["Importação de Talonamento (PEDI87) — através da configuração, tamanho do produto, criar vínculo", "Importação de Talonamento – PEDI87.pdf", "2. Criar vínculo com itens do pedido de venda\n2.1. Sequência 12 buscar vínculo com campo ¿Pedido Cliente¿, no pedido de venda (PEDI1).\n2.2. Sequência 13 e 14 buscar vínculo com o produto do pedido de venda através da configuração feita no programa EPRO32\n2.2.1. Seq 13 refere-se aos 6 primeiros dígitos do vínculo.\n2.2.2. Seq 14 refere-se aos próximos 6 dígitos do vínculo.\n2.3. Os campos de numeração vincular com o tamanho do produto"], "401-2": ["Lote Produção Estoque p/ Venda Estoque Futuro (MPSP20) — rotina permite alterar, qtdes a serem, questão de poder", "Liberação Lote Produção Estoque para Venda Estoque Futuro - MPSP20.pdf", "Avaliação feita em 250220, para Brisa, em que está envolvido questão de poder alterar qtde do LE original, para\ndeixar de mostrar como saldo de Estoque Futuro para Venda (quando a produção real do LE será menor do que a\nqtde prevista do LE)...neste caso, rotina permite alterar a qtde de “saldo...” (configurando as Propriedades do campo para permitir alterar):\n36737_Val_250220_questão de poder diminuir a qtde de Pedido de EF\nTeste abaixo OK, permite alterar a qtde no Pedido de Venda, pós o item do Pedido estar num Plano de Produção.\nIsso para atender ao que foi solicitado por sr Jose Claudio, de ter uma Instrução de Revisão (ao menos uma\nalternativa ao que foi solicitado).\n\nTestes na rotina d"], "401-3": ["Lote Produção Estoque p/ Venda Estoque Futuro (MPSP20) — permitir faturar, algum saldo, tenha ficado", "Liberação Lote Produção Estoque para Venda Estoque Futuro - MPSP20.pdf", "...e não deixou digitar novo pedido com algum saldo que porventura tenha ficado em uma tabela: \nFazendo a Revisão dos 180 M:\n\nVeja que até aqui resolveu, na Revisão: trouxe as qtdes dos 180, e não mais 200...\n\nEfetuado todos os apóntamentos, cfe qtdes acima:\n\nE o LE de teste saiu daqui, desta listagem:\n\n***Faturamento é consequência, e já visto em teste anterior que vai permitir faturar a qtde reservada pelos apontamentos realizados acima."], "401-4": ["Lote Produção Estoque p/ Venda Estoque Futuro (MPSP20) — lote produção estoque, iriamos dar continuidade, futuro em tais", "Liberação Lote Produção Estoque para Venda Estoque Futuro - MPSP20.pdf", "Contato com Brisa em 070422, para atender à duvidas da rotina de Lote Produção Estoque...RA 220331026\n\nAssunto citado pela Brisa no RA:\n\nOi boa tarde, o Comercial e o PPCP vem enfrentando muita dificuldade com o LEs, gostaria de\nmarcamos um reunião para que eles explanem as dificuldades e também verificar se a rotina\nestá sendo utilizada para a finalidade correta. Peço o máximo de brevidade.\n\nRetorno/posição:\n\nBoa tarde. Para registro:\n\nefetuado reunião com equipe Brisa nesta manhã (Lizie, Luciana,\n\nposição:\n\nBoa tarde. Para registro:\n\nefetuado reunião com equipe Brisa nesta manhã (Lizie, Luciana, Gabriel), das 10:00 hrs às 11:300 hrs, referente a\nrotina de Lote Produção Estoque.\n\nCitado pel"], "402-4": ["Pedido de Venda (PEDI1) — PERMITIR INFORMAR UMA DATA DE ENTREGA PARA CADA ITEM", "Lote Produção Estoque - PEDI1.pdf", "Pedido Serviço: 11195 Solicitação:\nPERMITIR INFORMAR UMA DATA DE ENTREGA PARA CADA ITEM\nPermitir informar uma data de entrega para cada item do Lote de Produção Estoque.\n\nAtualmente o programa permite apenas informar 1 data para todos os itens.\n\nDoc\n\nde Produção Estoque.\n\nAtualmente o programa permite apenas informar 1 data para todos os itens.\n\nDocumentação:\nPEDIDO DE VENDA (PEDI1)\n\n- Novo parâmetro de inicialização: LOTE_PRODUCAO_PEDIDO, o qual indica se utilizará as regras de lote produção\nestoque ou pedido de venda.\n- Esta alteração abolirá o programa \"Lote Produção Estoque\" (MPSP19). Pois, o no próprio pedido de venda será\npossível criar um lote de produção."], "402-5": ["Pedido de Venda (PEDI1) — lote produção estoque, equipe brisa, volta para permitir", "Lote Produção Estoque - PEDI1.pdf", "Contato com Brisa em 070422, para atender à duvidas da rotina de Lote Produção Estoque...RA 220331026\n\nAssunto citado pela Brisa no RA:\n\nOi boa tarde, o Comercial e o PPCP vem enfrentando muita dificuldade com o LEs, gostaria de\nmarcamos um reunião para que eles explanem as dificuldades e também verificar se a rotina\nestá sendo utilizada para a finalidade correta. Peço o máximo de brevidade.\n\nRetorno/posição:\n\nBoa tarde. Para registro:\n\nefetuado reunião com equipe Brisa nesta manhã (Lizie, Luciana, Gabriel), das 10:00 hrs às 11:300 hrs, referente a\nrotina de Lote Produção Estoque.\n\nCitado pela equipe Brisa que, depois da atualização do ultimo patch em 29/01/2022, não estão mais conseguindo\ne"], "403-6": ["Manutenção de Transferência OF (CFAB106) — Ficou assim as OFs: está OK...porque de ativo mesmo ficou apenas a OF nova", "Manutenção de Transferência OF - CFAB106.pdf", "Ficou assim as OFs: está OK...porque de ativo mesmo ficou apenas a OF nova  \nO que ocorre na Manutenção: nenhum registro de pendencia...nada pendente de “voltar”  \nAqui, o consumo simplesmente trocou de OF\n\nRepassou tudo para a OF nova, transferida:\n\nApontei a expedição desta OF e consegui faturar normal: baixou do estoque normal.   zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz\n\nVenda para Beneficiamento, neste exemplo abastecimento total:\n\nOF original:   Materiais abastecidos:  \nAqui, transferência parcial para outro pedido, neste caso pedido de Beneficiamento 193288: informei pela metragem...\n\nNova OF gerada:  \nFracionou ok os consumos:\n\nAQUI, como mostra no programa de ma"], "409-5": ["CEXC109 — PLANEJAMENTO - NO PLANEJAMENTO (MPSP2), PASSAR A CALCULAR O TEMPO DE SETUP POR TAMANHO NA…", "Planejamento Matrizaria.pdf", "Pedido Serviço: 40989 Cliente: TEA Solicitação:\nPLANEJAMENTO - NO PLANEJAMENTO (MPSP2), PASSAR A CALCULAR O TEMPO DE SETUP POR TAMANHO NA OF Rotina:  Manufatura\nPlano Mestre de Produção\nPlano Mestre de Produção Planejamento CRP Processos Alteração:\n\n- Criar flag \"Calcular Setup por tamanho\" no programa de cadastro de fichas de operações (PREC7). Essa flag,\nhabilitar apenas caso o processo seja de carga \"máquina\".\n- No planejamento (MPSP2), passar a calcular o tempo de setup por tamanho na OF.\n\nDocumentação:\nManufatura\nPlano Mestre de Produção\nPlano Mestre de Produção Planejamento CRP Processos Detalhamento:\n\nCriado novo Checkbox 'Calcular Setup p/ tamanho' que será habilitado somente se o ti"], "409-9": ["Estruturação de Produto (EPRO15) — minutos minutos, setup, smart a rotina", "Planejamento Matrizaria.pdf", "Testes em 190123, para tentar implantar na Smart a rotina de Planejamento setup de Cores (config do programa PREC30).  \nTestes abaixo com esta config de “Tipo Agrupamento Planejamento”, está por “Plano”...ou seja, entendo que não\ntenha que ser necessariamente cfe uma tela acima por “Cor e Matrizaria” para funcionar os setups...\n\nCfe citado acima, referente a Recurso Base Planejamento, defini aqui um padrão...\n\nAqui definido este campo, “Tipo Cálculo Setup”:  \nAqui abaixo, teste com o Processo “Jumbo” = que é o processo “Gargalo”...RECURSO = JUMBO.\n...no PREC30 configurado um setup “padrão” de 20 minutos... RECURSO = JUMBO\n...veja que para a OF 13559 posicionada abaixo, o intervalo de produçã"], "414-1": ["Posição de Saldos por Plano e Cliente (MPSP83) — Desenvolver relatório novo Forms/Report(PDF): Posição de Saldos por Planos e Clientes", "Posição de Saldos por Plano e Cliente – MPSP83.pdf", "Pedido Serviço: 67836 Cliente: AKS Solicitação:\nDesenvolver relatório novo Forms/Report(PDF): Posição de Saldos por Planos e Clientes.\nO detalhamento do desenvolvimento deste Pedido de Serviço está no anexo 67836.PDF.\n\n1. Desenvolver relatório novo Forms/Report(PDF): Posição de Saldos por Planos e Clientes.\nO relatório está baseado nos Planos de Produção, Clientes vinculados nos planos (através dos\npedidos de venda e LEs vinculados aos planos) e os saldos dos processos de produção.\nÉ necessário considerar, tratar e retornar também os dados de LE's, pois os Planos de Produção\npodem ser compostos tanto por Pedidos de Venda quanto por LE's. Além disso, no LE também é\npossível vincular um Client"], "416-9": ["Consulta Etiqueta Unidade Produto (CFAB56) — principal desta operação, unidade de produto, vinculado ao rótulo", "Projeto HK para automação da expedição_rotulos_autorização embarque.pdf", "9.\nÉ o código de barras lido a partir do rótulo cabeçalho (primeira página do rótulo).\n3-ETIQ.:\nÉ o código de barras da etiqueta unidade de produto.\nVerifica se a etiqueta é do pedido vinculado ao rótulo lido na sequência 2.\nSe a etiqueta é do pedido vinculado ao rótulo, a etiqueta será apontada e vinculada ao rótulo. O apontamento de\nprodução irá ocorrer somente para etiquetas não reabertas.\nSe a etiqueta não é do pedido vinculado ao rótulo, a rotina passa para a sequência 4.\nPara cada leitura de etiqueta de unidade de produto será verificado se todas as etiquetas do pedido estão lidas. Caso\nseja verdadeiro, o rótulo será finalizado e passa(am) a ser impressa(s) a(s) página(s) do rótulo, ex"], "416-37": ["Gera Nota Fiscal T alão (FATU74) — Etiqueta (rótulo) Boa tarde Sobre o abaixo,", "Projeto HK para automação da expedição_rotulos_autorização embarque.pdf", "De: Marcio Schneider <marcio@kunden.com.br>\nEnviada em: quinta-feira, 1 de outubro de 2020 14:05\nPara: 'Davenir Lisandro Hennemann' <lider.kunden@baenamora.com>\nCc: 'Roberto Schumacher' <roberto@kunden.com.br>\nAssunto: RES: Etiqueta (rótulo) Boa tarde Sobre o abaixo,\nFizemos uma bateria de testes, com uma rotina que temos em funcionamento em outra empresa.\n\nEla é utilizada para imprimir etiquetas unitárias (par a par), fazer a leitura e gerar um rotulo (no anexo* coloquei um\npasso a passo com as principais informações).\n\nMas, tem que ver se tudo isso compensa para só trafegar o produto de uma Localização para outra, porque:\n-tem que imprimir etiqueta (teria que ver se a versão de impressão e"], "420-1": ["Class Fiscal e Codigos EAN (EPRO81) — RELATÓRIO NOVO - DESENVOLVER RELATÓRIO QUE LISTE INFORMAÇÕES DO PRODUTO, NCM E CÓDIGO EAN…", "Relatório de Produtos, Class Fiscal e Codigos EAN – EPRO81.pdf", "Pedido Serviço: 44274 Cliente: TEA Solicitação:\nRELATÓRIO NOVO - DESENVOLVER RELATÓRIO QUE LISTE INFORMAÇÕES DO PRODUTO, NCM E CÓDIGO EAN ROTINA Manufatura\nEngenharia e Desenvolvimento de Produto Relatórios\nRelatório de Produto com NCM e EAN ALTERAÇÃO\n\n- Desenvolver relatório que liste informações do produto:\n* Código do produto;\n* Descrição do produto;\n* Estrutural do produto;\n* UM do produto;\n* NCM do produto, atribuída na aba Contábil/Fiscal do EPRO15;\n* Código EAN, de acordo com o que for gerado por tamanho. Listar todos.\n\nRelatório EPRO40 pode ser utilizado como base para o desenvolvimento, considerando os filtros existentes, porém\ndeve ser incluído o filtro de Pedido (Pedidos de Venda)"], "423-13": ["Relatório Ficha Técnica Curtume (EPRO34) — relatório estrutura, produto relatórios, engenharia e desenvolvimento", "Relatório Estrutura de Produto – EPRO34.pdf", "Pedido Serviço: 64313 Cliente: Cordato Solicitação:\n\nRotina:\nManufatura\nEngenharia e Desenvolvimento de Produto Relatórios\nRelatório Estrutura de Produto Alteração:\nAlterar relatórios EPRO34 e EPRO23 para gerar materiais repetidos cadastrados na estrutura do produto.\n\nDocumentação:\n\nManufatura\nEngenharia e Desenvolvimento de Produto Relatórios\nRelatório Estrutura de Produto Detalhamento:\nAjustado."], "427-0": ["Relatório de Extrato por Maquina (CFAB96) — ROTINA Manufatura Chão de Fabrica Relatórios de Produção", "Relatório Extrato Máquina – CFAB96.pdf", "Relatório Extrato Máquina – CFAB96 Pedido Serviço: 16567 Solicitação:\nROTINA Manufatura Chão de Fabrica Relatórios de Produção\nRelatório - Extrato Máquina (Novo Relatório) ALTERAÇÃO\n\nCriar relatório conforme modelo anexo onde as explicações dos campos estão como comentários em cada campo\n\nFiltros para o relatório:\n- Período (dos apontamentos efetuados, sempre tomando como base a data e hora inicio) - Deverá listar os dados\ndo período filtrado - Deverá ser obrigatório fazer o filtro do período\n- Máquina (s) / Recurso (s) - Deverá listar os dados das Máquinas (Recursos) filtradas - Default em branco onde deverá listar tudo\n- OF (s) - Deverá listar os dados das OFs filtradas - Default em branco"], "433-1": ["Relatório Plano Mestre de Produção (CEXC83) — RELATÓRIO PLANO MESTRE DE PRODUÇÃO: CRIAR NOVA VERSÃO DE RELATÓRIO PLANO MESTRE DE…", "Relatório Plano Mestre de Produção com Componentes - CEXC83.pdf", "Pedido Serviço: 48470 Cliente: Smart Solicitação:\nRELATÓRIO PLANO MESTRE DE PRODUÇÃO: CRIAR NOVA VERSÃO DE RELATÓRIO PLANO MESTRE DE PRODUÇÃO,\nFAZENDO CÓPIA DE OUTRA VERSÃO Rotina:\n\nManufatura\nPlano Mestre de Produção Relatórios\nRelatório Plano Mestre de Produção c/ Componentes Alteração:\n\nCriar nova versão de Relatório Plano Mestre de Produção, fazendo uma cópia da versão atual CEXC50 / CEXC51/\nCEXC52, e efetuar as seguintes alterações:\n\n1=no bloco \"Lista Materiais\": passar a listar todos os materiais configurados para gerar neste bloco.\nAtualmente há um limite de só listar 4 materiais.\nDesta maneira aumentar as linhas para baixo, quando se fizer necessário para imprimir todos os materiais "], "436-2": ["MPSP74 + MPSP76 — produção por plano, produtos dos planos, produto pai salva", "Relatório Plano Mestre de Produção por Grupos de Planos de Produção - MPSP74 – MPSP76.pdf", "Pedido Serviço: 61309 Cliente: MCM Solicitação:\n\nRotina:\n\nManufatura\nPlano Mestre de Produção Relatórios\nRelatório Plano Mestre de Produção por Plano/Produto Alteração:\nVerificar o motivo do relatório MPSP79 não estar gerando as imagens corretas dos produtos.\n\nDocumentação:\nManufatura\nPlano Mestre de Produção Relatórios\nRelatório Plano Mestre de Produção por Plano/Produto Detalhamento:\nNada foi feito.\n\nObservação:\nOs produtos dos planos de produção do anexo são da mesma forma, modelo e marca, portanto apenas a imagem do\nproduto pai será exibida. Caso o parâmetro número 4 estiver como 'B', funcionará da mesma forma, todos os\nprodutos serão exibidos com a mesma imagem do produto pai salva no b"], "439-0": ["MPSP74 + MPSP75 — plano e produto, mestre de produção", "Relatório Plano Mestre de Produção por Plano e Produto – MPSP74 – MPSP75.pdf", "Relatório Plano Mestre de Produção por Plano e Produto – MPSP74 – MPSP75.."], "439-2": ["MPSP74 + MPSP75 — RELATÓRIO PLANO MESTRE DE PRODUÇÃO POR PLANO/PRODUTO: COMPLEMENTO DO PEDIDO DE SERVIÇO…", "Relatório Plano Mestre de Produção por Plano e Produto – MPSP74 – MPSP75.pdf", "Pedido Serviço: 33555 Cliente: GS Solicitação:\nRELATÓRIO PLANO MESTRE DE PRODUÇÃO POR PLANO/PRODUTO: COMPLEMENTO DO PEDIDO DE SERVIÇO 32278 Rotina:\n\nManufatura\nPlano Mestre de Produção Relatórios\nRelatório Plano Mestre de Produção por Plano/Produto-MPSP74 Alteração:\n\nComplemento do pedido de serviço 32278:\n\nIncluir uma nova funcionalidade:\n\nPossibilidade de definir uma Observação para o Plano de Produção, e que esta Observação seja impressa no\nrelatório, logo abaixo do respectivo Plano de Produção no relatório.\n\nBuscando a observação do cadastro CFAB50.\nUtilizar a observação, mesmo que esteja vinculada em apenas 1 das diversas OFs do Plano.\n\nDocumentação:\nManufatura\nPlano Mestre de Produção "], "439-13": ["MPSP74 + MPSP75 — produção por plano, produtos dos planos, produto pai salva", "Relatório Plano Mestre de Produção por Plano e Produto – MPSP74 – MPSP75.pdf", "Pedido Serviço: 61309 Cliente: MCM Solicitação:\n\nRotina:\n\nManufatura\nPlano Mestre de Produção Relatórios\nRelatório Plano Mestre de Produção por Plano/Produto Alteração:\nVerificar o motivo do relatório MPSP79 não estar gerando as imagens corretas dos produtos.\n\nDocumentação:\nManufatura\nPlano Mestre de Produção Relatórios\nRelatório Plano Mestre de Produção por Plano/Produto Detalhamento:\nNada foi feito.\n\nObservação:\nOs produtos dos planos de produção do anexo são da mesma forma, modelo e marca, portanto apenas a imagem do\nproduto pai será exibida. Caso o parâmetro número 4 estiver como 'B', funcionará da mesma forma, todos os\nprodutos serão exibidos com a mesma imagem do produto pai salva no b"], "441-0": ["MPSP74 + MPSP77 — produção por plano, mestre", "Relatório Plano Mestre de Produção por Plano, Produto e Cliente – MPSP74 – MPSP77.pdf", "Relatório Plano Mestre de Produção por Plano, Produto e Cliente – MPSP74 – MPSP77.."], "441-1": ["MPSP74 + MPSP77 — RELATÓRIO PLANO MESTRE DE PRODUÇÃO – NOVO Rotina", "Relatório Plano Mestre de Produção por Plano, Produto e Cliente – MPSP74 – MPSP77.pdf", "Pedido Serviço: 35226 Cliente: Pacific Solicitação:\nRELATÓRIO PLANO MESTRE DE PRODUÇÃO – NOVO Rotina:\n\nManufatura\nPlano Mestre de Produção Relatórios\nRelatório Plano Mestre de Produção - novo Alteração:\n\nCriar novo Relatório Plano Mestre de Produção, com base no Relatório Plano Mestre de Produção por Plano/Produto\n(MPSP74/MPSP75), com as seguintes alterações:\n\nde acordo com a documentação dos arquivos 35226.doc e 35226.xlsx:\n\n-Criar 2 novas colunas: “O.F. Inicial” e “O.F. Final”:\nPosição destas 2 novas colunas: no espaço das 2 primeiras colunas de “Processos” do relatório base (logo após a\ncoluna “QTD”), desta maneira passando a imprimir 2 processos a menos que o relatório base. Manter a mes"], "441-6": ["MPSP74 + MPSP77 — produção por plano, produtos dos planos, produto pai salva", "Relatório Plano Mestre de Produção por Plano, Produto e Cliente – MPSP74 – MPSP77.pdf", " Pedido Serviço: 61309 Cliente: MCM Solicitação:\n\nRotina:\n\nManufatura\nPlano Mestre de Produção Relatórios\nRelatório Plano Mestre de Produção por Plano/Produto Alteração:\nVerificar o motivo do relatório MPSP79 não estar gerando as imagens corretas dos produtos.\n\nDocumentação:\nManufatura\nPlano Mestre de Produção Relatórios\nRelatório Plano Mestre de Produção por Plano/Produto Detalhamento:\nNada foi feito.\n\nObservação:\nOs produtos dos planos de produção do anexo são da mesma forma, modelo e marca, portanto apenas a imagem do\nproduto pai será exibida. Caso o parâmetro número 4 estiver como 'B', funcionará da mesma forma, todos os\nprodutos serão exibidos com a mesma imagem do produto pai salva no "], "442-1": ["Plano Mestre de Produção por Plano/Produto (MPSP79) + MPSP80 — RELATÓRIO PLANO MESTRE DE PRODUÇÃO POR PLANO/PRODUTO - CORRIGIR INFORMAÇÕES NO RELATÓRIO", "Relatório Plano Mestre de Produção por Plano, Produto e Entrega – MPSP79 - MPSP80.pdf", "Pedido Serviço: 42783 Cliente: AKS Solicitação:\nRELATÓRIO PLANO MESTRE DE PRODUÇÃO POR PLANO/PRODUTO - CORRIGIR INFORMAÇÕES NO RELATÓRIO\nPLANO MESTRE DE PRODUÇÃO POR PLANO/PRODUTO.\n\nRotina:\n\nManufatura\nPlano Mestre de Produção Relatórios\nRelatório Plano Mestre de Produção por Plano/Produto Alteração:\n\nCorrigir informações no relatório Plano Mestre de Produção por Plano/Produto (MPSP74), reports MPSP75 e MPSP77.\n\nDocumentação:\nManufatura\nPlano Mestre de Produção Relatórios\nRelatório Plano Mestre de Produção por Plano/Produto Detalhamento:\nCriado nova versão de relatório de acordo com os ajustes solicitados; "], "452-21": ["Relatório Planejamento Brisa (CEXC50) — produção por recurso, corte troquel, relatório plano mestre", "Relatórios programação consolidada, Relat de Produção e Consulta de Produção.pdf", "Pedido Serviço: 60906 Cliente: Smart Zzzzzzzzzzzzzzzzzzzzzzzzzzzzz\n\nExtensão do acima, avaliação em 301020 para a implantação Baenamora, na qual fui questionado de onde poder\nfiltrar e enxergar em relatórios o que está Planejado para determinado Recurso (neste caso, o Recurso final, o\n“setor” = não o Recurso Base Planejamento).\n\nQuestionado abaixo:\n“Buen día Marcio...un favor tengo una pregunta ¿Es posible que se visualice que recurso de corte está planeado en\ndocumentos de plan maestro de producción o en Órdenes de Fabricación?”\n\nPesquisado na própria BD Baenamora:\n\nVeja como está o Planejamento...ver exemplo do Recurso CORTE TROQUEL  Selecionado assim:\n\nGerou assim:\nVeja que na parte de ci"], "454-0": ["Geração Rótulos para compostos de venda (FATU16) — tipos de corrugadas, rotina é utilizada, gera rótulos pedidos", "Rotulos_Emissão_Caixas_Corrugadas - FATU16.pdf", "Esta rotina é utilizada pelo Myrabel..\nExemplo de Rotulo.\n\nPrograma \"Gera Rótulos - Pedidos\".\nUtilizar após feito o Plano de Produção.\n\nAleanza Aleanza Calçados Ltda (117) \n\nDepois de gerados os rótulos, na tela acima, é necessário ir na tela Rotulos, para fazer a emissão do rotulo.\n\nObs: O sistema calcula a melhor maneira de encaixotamento (há um algoritmo para isso).\nExemplo: se o pedido for de 16 pares, vai gerar 1 rotulo de 10 pares, e 1 rotulo de 6 pares.\n(isso quando definido no programa de Pedidos o tipo de encaixotamento = solido)\n\nRotulo que imprime 2 rótulos por pagina de papel A4. Exemplo acima.\nPara ele funcionar é necessário:\n- Incluir na Lista de Materiais da Estrutura do produ"], "454-6": ["Geração Rótulos para compostos de venda (FATU16) — componentes e materiais, vinculados à necessidade, emissão de rótulo", "Rotulos_Emissão_Caixas_Corrugadas - FATU16.pdf", "Pedido Serviço 3710:\n\nSolicitado:\nEMISSÃO DE ROTULO: DESENVOLVER LAYOUT UTILIZADO PELA EMPRESA NA VERSÃO V3\n\nA empresa utiliza na versão V3, o programa Emissão de Rotulos SNF199ML\n\nDetalhes a serem observados no desenvolvimento:\n- Código de produto impresso junto à descrição do produto;\n- Tamanho de fonte a utilizar:\nNome (do cliente), endereço, bairro, cidade, CEP, Estado (passar o descritivo para \"UF\"): utilizar tamanho de fonte\nidem impresso no campo Pedido Cliente e Pedido Interno.\nDemais campos utilizar a mesma fonte do programa SNF199ML Versão 3. Idem para o layout e campos impressos =\nconforme programa SNF199ML Versão 3.\n\n- Ao final do rótulo:\nImprimir até 4 Componentes e Materiais vi"], "454-13": ["Geração Rótulos para compostos de venda (FATU16) — fracionado para embarque, frações, apontamento de rótulos", "Rotulos_Emissão_Caixas_Corrugadas - FATU16.pdf", "Documentação:\nENGENHARIA DO PRODUTO (EPRO15)\nAlterações efetuadas na aba Configuração/Venda/Dados Gerais.\nForam criadas três novas colunas: Fracionado para Embarque, Número de Frações e Conciliar Embarque com Produto.\nFracionado para Embarque: indica se o rótulo do produto será composto por frações.\nNúmero de Frações: quando não informado assume o valor 1.\nConciliar Embarque com Produto: indica o produto com o qual este produto será embarcado. Será considerado no faturamento\ncomo um único volume.\nNão poderá ser utilizado ao mesmo tempo Fracionado para Embarque e Conciliar Embarque com Produto.\n\nGERA/EMISSÃO RÓTULO UNIDADE ARMAZENAMENTO (FATU16)\nPassa a ser levado em conta a coluna Fracionado"], "454-20": ["Geração Rótulos para compostos de venda (FATU16) — Geração de Rótulos. CRIAR OPÇAO PARA POSSIBILITAR MANUTENÇÃO DOS RÓTULOS", "Rotulos_Emissão_Caixas_Corrugadas - FATU16.pdf", "Pedido Serviço: 11568 Cliente: HK Solicitação:\nGeração de Rótulos. CRIAR OPÇAO PARA POSSIBILITAR MANUTENÇÃO DOS RÓTULOS\n\n1) Abrir opção para manutenção dos rótulos, podendo excluir, incluir,......\nMotivo: Rótulo pode ter sido criado quando existiam somente corrugado de 12 pares informado e depois ter sido\nliberado corrugados de menor ou maior quantidade.\n\n2) Colocar check box para filtrar somente corrugados do plano que gerar alguma divergência na atualização do MRP.\nRetornar somente rótulos onde a quantidade de pares é maior que o tamanho do corrugado (fator de conversão).\n\nDocumentação:\nNova mensagem: KND-002839 - Volume já existente na entrega.\nNovo parâmetro de inicialização: ALTERACAO_R"], "454-21": ["Geração Rótulos para compostos de venda (FATU16) — rotulo original, compras e abastecimentos, usando a funcionalidade", "Rotulos_Emissão_Caixas_Corrugadas - FATU16.pdf", "-Teste feito para a Piagui, que queria poder alterar as qtdes de rótulos, porque tem casos em que não vão produzir\ntoda a qtde total do rótulo e da respectiva OF devido problemas internos (sendo que seu cliente tolera receber qtdes\na menor que o definido no Pedido de Venda)...\n\nAqui neste exemplo, o rótulo 2311109 era de 15 pares (havia 1 par nro 26)...diminui 1 par, salvou e ficou 14...\n\n...em seguida, cliquei no botão “Duplicar Rótulo”: a rotina duplicou a qtde deste rótulo...exclui então as qtdes dos\ntamanhos que já estavam atendidos pelo rótulo anterior, e deixei só 1 par 26, para compensar o eliminado no rótulo\nanterior (era a necessidade da Piagui ser algo assim...queriam poder manter "], "454-22": ["Geração Rótulos para compostos de venda (FATU16) — atualização do plano, compras e abastecimentos, gerou esta mensagem", "Rotulos_Emissão_Caixas_Corrugadas - FATU16.pdf", "...a partir disso, fui no Pedido de Venda, desconfirmei, selecionei junto a corrugada menor desejada....gerou esta mensagem KND-002099...  \n...permitiu selecionar e confirmar o Pedido de Venda... \n...e com isso OK passou a mostrar aqui na Lista de Valores e trocar/substituir o corrugado no rotulo que foi desmembrado:\n\n...e com a atualização do Plano de Produção no MPSP33, atualizou qtdes de Compras e Abastecimentos...veja:"], "454-38": ["Geração Rótulos para compostos de venda (FATU16) — PREVER A GERAÇÃO DE RÓTULOS COM MAIS DE UM PRODUTO (agrupamento de mais produtos no mesmo…", "Rotulos_Emissão_Caixas_Corrugadas - FATU16.pdf", "Pedido Serviço: 22561 Cliente: Kildare Solicitação:\nPREVER A GERAÇÃO DE RÓTULOS COM MAIS DE UM PRODUTO (agrupamento de mais produtos no mesmo rótulo).\n\nROTINA:\n\nPrograma / Rotina Nova ALTERAÇÃO:\n\n-\n\nODUTO (agrupamento de mais produtos no mesmo rótulo).\n\nROTINA:\n\nPrograma / Rotina Nova ALTERAÇÃO:\n\n- Rotina nova para prever que um rótulo pode ter mais de um produto.\n\nDocumentação:\n>>> Gera/Emissão Rótulo Unidade Armazenamento(FATU16)\n>>> Gera/Emissão Rótulo Unidade Armazenamento(FATU17_KDR) - Detalhamento:\n* Alterado para prever a emissão com mais de um produto no mesmo rótulo.\n* Criado uma nova versão de emissão de rótulo.\n* Para que o rótulo seja emitido corretamente, o parâmetro de iniciali"], "454-39": ["Geração Rótulos para compostos de venda (FATU16) — >>> Manutenção de Rótulos(ESTO89) - Mensagem", "Rotulos_Emissão_Caixas_Corrugadas - FATU16.pdf", ">>> Manutenção de Rótulos(ESTO89) - Mensagem:\n* KND-003980 - Atenção! Rótulo \"(:A)\" possui mais de um produto. Deseja continuar?\n- Detalhamento:\n* Alterado para prever rótulos com mais de um produto.\n* Adicionado um campo com a quantidade total do rótulo ao lado da quantidade correspondente ao produto em questão.\n\n>>> Consulta Estoque Produto(ESTO7) - Detalhamento:\n* Alterado para exibir a quantidade total do rótulo ao lado da quantidade correspondete ao produto em questão.\n\n>>> Apontamento de Rótulos(CFAB22)\n>>> Apontamento de Rótulos(CFAB65) - Mensagem:\n* KND-003971 - O rótulo \"(:A)\" faz parte do rótulo \"(:B)\" e não pode ser apontado separadamente - Detalhamento:\n* Alterado para prever rót"], "454-57": ["Geração Rótulos para compostos de venda (FATU16) — tipos de corrugadas, calculo base rotulo, seguintes condições", "Rotulos_Emissão_Caixas_Corrugadas - FATU16.pdf", "\nAvaliação feita por Wagner em 310323, para um desenvolvimento da Kabek envolvendo geração de distribuição das\nqtdes entre diversos tipos de corrugadas, com fator conversão diferentes...\n\n...avaliação analisada aqui...onde tem as seguintes condições:\n-Item de Pedido de Vend\n\niferentes...\n\n...avaliação analisada aqui...onde tem as seguintes condições:\n-Item de Pedido de Venda com 62 pares...\n-Encaixotamento Solido, e com o “Agrupar com Saldo da Próxima caixa”...\n-tendo corrugadas na Engenharia com Fator de Conversão de 12,10,8,6,4,2\n- cfe sua avaliação a rotina utiliza esta lógica...\nTela 1...\n\nTela 2 com extensão à direita da tela acima\n\n...sendo que neste caso, a rotina atual com estas vari"], "455-0": ["Geração Rótulos para compostos de venda (FATU16) — unidade armazenamento henrich, emissão rótulo, compartilhado", "Rotulos_Emissão_Caixas_Corrugadas - FATU16_FATU17_exemplos impressão.pdf", "Modelos de rótulos FATU17, para cada programa FATU16 (.doc compartilhado por Deise em 250723)..\nPara todos os programas utilizamos o mesmo plano.\n1 – Emissão Rótulo Unidade Armazenamento - HENRICH"], "459-2": ["Unidades de Medida (EPRO3) — medida deste material, configuração na unidade, apenas estava previsto", "Unidades de Medida - EPRO3.pdf", "Zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz\nTestado com Jean em 050717:\n\n(obs.: no exemplo tela abaixo, foram selecionados todas as OFs na tela acima).\n\n- Programa Unidades de Medida (EPRO3)\n- Adicionado o campo \"Permite Decimais\", que possibilita definir se a unidade de medida poderá gerar\nquantidades com casas decimais.\n\n**** Esta funcionalidade terá efeito apenas para os programas/relatórios que estiverem adequados para usá-la (em\n050717, apenas estava previsto nos programas deste desenvolvimento: ESTO25 + ESTO123)   zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz\n\nNovo Teste em 111022:\n\nConfiguração na Unidade de Medida deste material:   Solicitação criada...\n\nNo abastecimento no ESTO25: "], "463-0": ["Variação de Grade (EPRO19) — Não existe variação de grade entre grade \"GRADE 34 AO 43\" e grade \"GRADE 34 AO 44\" na…", "Variação de Grade – EPRO19.pdf", "Variação de Grade – EPRO19..\n\nPedido Serviço: 66316 Cliente: Planet Solicitação:\nNão existe variação de grade entre grade \"GRADE 34 AO 43\" e grade \"GRADE 34 AO 44\" na largura \" \" e\ntamanho \"39\" na variação \"7\".\n\nRotina:\n\nManufatura\nEngenharia e Desenvolvimento de Produto Cadastros Variação de Grade Alteração:\nVerificar o motivo de ao tentar criar o plano de produção, é exibida a mensagem de que não existe variação de\ngrade sendo que as mesmas estão corretas no programa EPRO19 e estão vinculadas nos materiais no programa EPRO15.\n\nDocumentação:\nManufatura\nEngenharia e Desenvolvimento de Produto Cadastros Variação de Grade Detalhamento:\nOs erros na geração do plano estavam acontecendo, pois, o "], "464-2": ["Vínculo Produto/Produto Cliente (EPRO32) — MONITOR NOTAS FISCAIS - CÓDIGO PRODUTO E DESCRIÇÃO DO CLIENTE DEVEM SER LEVADOS PARA XML…", "Vínculo Produto_Produto Cliente - EPRO32.pdf", "Pedido Serviço: 46933 Cliente: TEA Solicitação:\nMONITOR NOTAS FISCAIS - CÓDIGO PRODUTO E DESCRIÇÃO DO CLIENTE DEVEM SER LEVADOS PARA XML E DANFE Rotina:\n\nVendas e Distribuição Faturamento Notas Fiscais\nMonitor Notas Fiscais Eletrônica Alteração:\n\n- Código Produto e Descrição Cliente devem ser levados para o XML e Danfe. Esta informação deve ser gerada por\ntamanho, de acordo com o cadastro efetuado no EPRO32.\nTag <cProd> deve ser preenchida com o código do cliente, por tamanho.\nTag <xProd> deve levar a descrição do cliente, concatenando o código cliente e numeração.\n\nDocumentação:\nVendas e Distribuição Faturamento Notas Fiscais\nMonitor Notas Fiscais Eletrônica Detalhamento:\nCódigo do Produto "], "467-2": ["Controle de Lote (ESTO129) — listar os lotes, controle de lote, permitir escolher", "Controle de Lote em Materiais_passo a passo para a Brisa.pdf", "5= Tendo feito este a implantação acima, passarão a enxergar o estoque pelo controle de Lote. Também mostra\nnesta consulta, exemplo tela abaixo (também na aba “Lançamentos”, mostra as movimentações e os Lotes gravados na movimentação).  \n6= Relatório Posição de Estoque e Relatório Lançamentos tem opção para listar os Lotes:\n\n7= Movimentação de abastecimento dos Planos de Produção: Ideal fazer por este programa Plano Abastecimento\nMateriais - Requisição - Controle de Lote - ESTO129: vai permitir escolher o Lote a ser abastecido:  \nE depois na aba Requisições mostra o abastecimento feito com o numero do Lote: "], "469-0": ["Locais de Armazenagem (EPRO26) — locais de armazenagem, numero do lote, vinculação inclusão inserção", "ROTINA DE CONTROLE DE ARMAZENAGEM POR LOTE _passo a passo para a Brisa.pdf", "ROTINA DE CONTROLE DE ARMAZENAGEM POR LOTE _passo a passo para a Brisa..\n\nCriar o cadastro de Locais de Armazenagem, que representam os lugares físicos do seu depósito.\nExemplo tela abaixo...\nPodem representar uma estrutura de controle de, por exemplo CORREDOR, MÓDULO/PRATELEIRA, NÍVEL, VÃO, que\nrepresentam estruturas padrões de armazenagem em depósitos.\nMas podem ser representados aqui quaisquer outros tipos de Locais de Armazenamento sem ter que ser a estrutura\ncitada acima, tais como Paletes, Setor A, B, C,...,Depósito 1, Depósito 2,...etc...\n\nPara a vinculação/inclusão/inserção dos Lotes em seus devidos Locais de Armazenagem:\n\nÉ pela aplicação web que pode ser utilizado por exemplo num T"], "471-5": ["Programas (ADMI6) — papel release coagulado, mostra as informações, desde o inicio", "Rotinas Brisa.pdf", "Marcio, 010421:\n\nEmissões de OF utilizados pela Brisa (usam a impressão de 2 documentos para a mesma OF...até tem um protocolo\nna qual a Brisa solicitou um estudo para unir no mesmo documento):\n\nEsta versão é mais para ter as especificações técnicas: \nEsta versão é o modelo adotado desde o inicio e vão as informações principais, os semi-acabados,...:  \nObs.: no campo “Papel Release/Coagulado”, mostra as informações de acordo como configurado este campo\n“Imprimir Material Cartão” com “SIM”: "], "471-6": ["Relatório Planejamento Brisa (CEXC50) — Versão de Relatório Consolidada que utilizam: CEXC50, CEXC51, CEXC52", "Rotinas Brisa.pdf", "Versão de Relatório Consolidada que utilizam: CEXC50, CEXC51, CEXC52  \n“Material” que imprime no relatório: idem impressão da OF, detalhes mais acima:\nno campo “Papel Release/Coagulado”, mostra as informações de acordo como configurado este campo “Imprimir\nMaterial Cartão” com “SIM”.\n\nOutro detalhe deste relatório: tem a possibilidade de quebrar o cabeçalho dos Processos, que são diferentes de\nproduto a produto, usando esta opção:  "], "471-9": ["Classificação do Produto (CPRO2) — Avaliação específico do OFF Spec", "Rotinas Brisa.pdf", "Avaliação específico do OFF Spec:\nRastreado uma situação em 270623 com Guilherme Noschang para avaliar virada de utilização de Lotes:\n\nFoi desenvolvido pelo pedido de serviço 8406 = tem detalhes importantes nesta documentação (pode ter mais pedidos de evoluções)\n\nNo Apontamento, olha a Classificação que é informada no Apontamento (programa Revisão)...  \nQuando é diferente de 1ª qualidade:\n\nAí aponta no código da OF, e depois faz uma reclassificação...gerando a saída no produtos da\n\nidade:\n\nAí aponta no código da OF, e depois faz uma reclassificação...gerando a saída no produtos da OF...\n\n...E a entrada no produto Off Spec (Produto Off Spec é criado automático pela rotina, e tem o campo\nOFFSP"], "472-1": ["Laudos Padrões (CPRO23) — carcaça inteira, partes e cabeça, condenação", "Conceitos de “Parcial” e “Total” para os cadastros de Eventos e Laudos_Diferenças entre os conceitos.pdf", "3-CONDENAÇÃO PARCIAL: na relação com os Indicadores de Eventos citado acima, pode ser tanto para PARTES E\nCABEÇA como para CARCAÇA INTEIRA.\nTambém: pode ser o “Tipo Condena” tanto AC-Aproveitamento Condicional (desde que seja para CARCAÇA INTEIRA)\nou Condena/Graxaria (desde que seja para PARTES E CABEÇA (porque se fosse uma Graxaria de CARCAÇA INTEIRA, aí\njá sería CONDENAÇÃO TOTAL), porque:\nEm resumo:\nÉ 3-CONDENAÇÃO PARCIAL no caso em que o CEP é referente uma CARCAÇA INTEIRA, mas na qual poderá haver o\nAC-Aproveitamento Condicional. Neste caso, o “PARCIAL” refere-se a que a condenação será parcial, porque a\nCarcaça não vai para a Graxaria, e sim terá um aproveitamento não total, mas sim “co"], "473-12": ["Controle de Flexibilidade de Vendas (VEND113) — Teste para avaliação...em 100420", "Controle de Flexibilidade de Vendas - VEND113.pdf", "Teste para avaliação...em 100420:\n”Testar se a rotina grava o preço da LP no momento de gerar o pedido...e depois tendo uma alteração na mesma\nLista de Preço e um novo pedido passa a mostrar um preço novo...e se mantem o preço original no 1º Pedido = do preço inicial/original”.\n\nAqui, o controle Flex original, mostrando os dados referente ao Pedido RFM60...neste registro, veja que houve uma\n“redução” de preço na venda ocorrida... \n...aqui a Lista de Preços original...\n\n...aqui a Lista de Preços com a alteração... \nAqui as condições gerais do Pedido de Venda Original e o novo...\n\n..detalhe da Lista de Preço, quanto ao desconto de acordo com a Condição de Pagamento escolhida...  \n...1º pedido "], "474-2": ["Processamento de Leituras (ADMI144) — dois lotes, clicado em gerar, aparece a quantidade", "Controle Rotativo de Inventario com Lote sem Qtd - Operações Coletor WEB.pdf", "Detalhamento:\nFoi criada uma nova operação para o coletor Web: 31 - \"CONTROLE ROTATIVO DE INVENTARIO C/ LOTE S/ QTD\".\nAs informações dessa nova operação estão disponíveis no programa ADMI145 (\"Operações Coletor WEB\").\n\nCriada validação para não permitir ler o mesmo lote mais de uma vez para operação 31, caso aconteça irá exibir a mensagem KND-004080.\n\nZzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz\n\nTestado na Letavo em 130721:\nEste cadastro ADMI145 já vem configurado da Kunden, da instalação... \nNecessário efetuar este cadastro de Funcionários no programa RHUM19:\n\nKunden disponibiliza este link de acesso Web/Coletor (existe um serviço desta aplicação que precisa estar rodando)...\n\n...e depois ac"], "476-1": ["Emissão de Laudos (CPRO24) — Detalhes no anexo 23523.xlsx xxx Manufatura", "Emissão de Laudos - CPRO24.pdf", "Detalhes no anexo 23523.xlsx xxx Manufatura\nControle Estatístico de Processos (CEP) Cadastros Lançamentos\n\nCriar os seguintes campos:\n1= \"Qtde c/ Acréscimo Quebra\": Esta qtde é calculado considerando o campo novo solicitado na Estruturação de\nProduto \"% Acréscimo Quebra\" (na Estruturação de Produto, este campo será preenchido no seguinte formato:\n21,26,28...que representam 21%,26%,28%...).\nEntão para o calculo efetuar com a seguinte formula:\n100/((100-\"% da Estruturação de Produto, de acordo com o Produto\")/100) = resultado (arredondamento\nem zero casas decimais) Onde,\nCampo Quantidade do Lançamento de CEP/((fixo 100-\"% da Estruturação de Produto, de acordo com o\nProduto\")/fixo 100) = result"], "477-1": ["FATU26 — rótulos emissão minuta, placa veículo, informado a data", "Emissão Minuta_Frigoríficos – FATU26.pdf", "Pedido Serviço: 30830 Cliente: Frigolaste Solicitação:\n\nROTINA:\n\nVendas e Distribuição Faturamento Rótulos Emissão Minuta ALTERAÇÃO:\n\n- Criar novo programa para geração de minutas Frigoríficos com base no FATU26:\n- Acrescentar filtros de Rota, Placa Veículo, Destino, e Hora Emissão.\n1º campo de Hora, refere-se a hora inicial da Data Emissão ¿De¿\n2º campo de Hora, refere-se a hora final da Data Emissão ¿Até¿ (quando não informado a Data ¿Até¿,\nfica valendo a mesma Data ¿De¿)\n- Criar opção de Agrupamento por Rota, Cidade e Placa Veículo.\n- Para o report, usar como base o FATU92\n- Retirar os campos de assinatura da empresa e da transportadora, assim como, os campos de preenchimento\nde data, hor"], "479-1": ["Emissão de Laudos (CPRO24) — Fluxo para testes Frigorificos", "Fluxo_Frigoríficos_Documentação frigorificos_Base_Val_Patch.pdf", "De: Roberto Schumacher <roberto@kunden.com.br>\nEnviadas: Quarta-feira, 15 de Outubro de 2025 14:07\nPara: Wagner Battessini <wagner.battessini@kunden.com.br>; Thomas Emanuel Albino Simon\n<thomas.simon@kunden.com.br>; Gabriel Augusto Deconto <gabriel.deconto@kunden.com.br>\nAssunto: Fluxo para testes Frigorificos.\n\nBoa tarde.\nAbaixo segue um fluxo básico dos frigoríficos que pode ser usado para validação de Patch.\nO que está em laranja é o fluxo de abate e em verde o fluxo de entrada do pedido até o faturamento.\n\nCom base neste fluxo, segue no link abaixo a documentação efetuada de testes anteriores.\nDocumentação frigorificos.docx \n\nFrigorífico recebe suínos de produtores rurais e de cooperativ"], "479-4": ["Prima Couro / Fornecedor (CFAB101) — O Evento de CEP é configurado para gerar lançamento no estoque", "Fluxo_Frigoríficos_Documentação frigorificos_Base_Val_Patch.pdf", "O Evento de CEP é configurado para gerar lançamento no estoque\n\nNo estoque, miúdo entra no disponivel.\n\nControle sanitário ocorre junto aos miúdos, e serve para controle de miúdos com problemas (doenças).  \nControle sanitário também gera lançamento de CEP, mas os eventos não controlam estoque.\n\nAs quebras em relação ao peso vivo até este momento foram calculadas pelo percentual informado no\nproduto, porém, no programa RECE50, existe a possibilidade de calcular pela quebra real do abate. \nAté este momento, a coluna QTD_ABATE_QUEBRA está null\n\nAo Calcular Quebra Abate no programa RECE50, é recalculado a quebra e gerado valor na coluna. Assim, temos:\nQTD – quantidade informada no painel\nQTD_ACR"], "479-7": ["ADMI35 — Ivendre Android", "Fluxo_Frigoríficos_Documentação frigorificos_Base_Val_Patch.pdf", "Ivendre Android\nNo iVendre vai exibir o estoque de lotes que estão liberados\nVeja que o produto 25.2534 não possui estoque no iVendre\n\nMas se consultar no ERP, exibe um total de 47,30kg... todos os lotes com produção no dia de hoje 04/06/2024.\n\nNão exibiu no iVendre, pois neste produto tem uma configuração que só libera para venda depois de 2 dias.\n\nAo tentar enviar um pedido de produtos a produzir, gera mensagem KND-004325 que produto não possui\nplanejamento de vendas, isso ocorre pois a categoria de pedido está marcada para exigir planejamento de vendas.  \nO planejamento de venda é feito no programa VEND122\n\nApós o planejamento, o pedido entrou na base\n1 item a produzir e 1 item venda esto"], "480-0": ["Cópia de Ordem de Fabricação (CFAB59) — nfs de entrada, utiliza uma operação, transformar em duas", "Fluxo_Resumo_Frigoríficos.pdf", "Fluxo_Resumo_Frigoríficos..\n(documentação disponibilizada por Guilherme, em 120326)\nFrigorífico recebe suínos de produtores rurais e de cooperativas.\n\nAs NF são lançadas manualmente, mas poderiam muito bem serem recebimentos de pedidos de compra.\nNas NF de entrada, quando lançado de produtor rural que não possui NF eletrônica, consta apenas um item\nque na operação movimenta apenas estoque. Quando lançado de cooperativa ou de produtor que emite NF\neletrônica, deve ter dois itens na NF, uma com o item da NF que está recebendo, a operação deve controlar\nentradas, livros, etc, mas não controla o estoque, e o segundo item utiliza uma operação que só controla\nestoque e não controla outros registro"], "480-2": ["Eventos (CPRO3) — quebra quantidade calculada, cep é configurado, base no percentual", "Fluxo_Resumo_Frigoríficos.pdf", "Mas neste só deu entrada no estoque, pois o evento não está configurado para baixar estoque, e lotes entram no disponivel. \nO valor Quantidade Acr. Quebra que exibe no lançamento de CEP, vem do percentual a considerar como\nquebra cadastrado no produto. No último exemplo foi condenado 80kg, portanto, este peso representa 75,3%\ndo peso vivo (100-24,7), assim, 80÷0,753 = 106,2417, este peso representa o peso vivo do animal, ou seja, 100%. \nJá a condena de parte da carcaça, o vínculo está na lista de materiais, ou seja, quando selecionado a carcaça,\nlista todos os produtos que tem essa carcaça na lista de materiais e pertencem a categoria do parâmetro CATEGORIA_PRODUTO_CONDENA.\n\nOs apontamentos "], "480-3": ["Prima Couro / Fornecedor (CFAB101) — gerado o relatório, contra nota, quebras e configurados", "Fluxo_Resumo_Frigoríficos.pdf", "Comparado com o peso da NF isso representa 68,2716% → 553/810= 0,682716 * 100 = 68,2716\nSabendo que o abate representa 68,2716% é calculado o peso vivo (100%) para cada condena, exemplo,\n80kg de condena representa 122,179kg vivo → 80÷68,2716% = 117,179kg e com no produto ainda tem um\nvalor de acréscimo por faixa de peso, soma-se mais 5kg, dando um total de 122,179\n\nNo RECE50 também é possível gerar a contra nota, veja que o item de cozido, já exibe a quantidade de quebra.\n\nNos itens, são exibidos as condenas que na configuração de eventos contra nota, é pago um percentual pela condena.  \nJá os produtos de graxaria ou que não são pagos nada para o produtor, essas condenas são exibidas nas\nobs"], "485-3": ["Frigorífico (RECE50) — configuração de eventos, documentos fiscais eletrônicos, contra nota", "Gera Contra Nota Fiscal de Entrada - Frigorífico - RECE50.pdf", "Detalhamento:\nNo programa FATU3 (\"Nota Fiscal de Entrada\"), foi desenvolvida a nova aba \"GTA\" para os itens da nota fiscal, que\nestará disponível quando o novo parâmetro de inicialização estiver configurado para isso. Além disso, foram ajustadas\nas rotinas necessárias para gerar a observação na nota fiscal, referente aos dados informados na aba GTA mencionada.\n\nVendas e Distribuição Faturamento Cadastros\nConfiguração de Serviços de Documentos Fiscais Eletrônicos (DF-e) Detalhamento:\nAdicionadas as opções abaixo a lista de dados adicionais da aba NF-e -> Opções Impressão:\n- Vlr. Contribuição Rural (Detalhado)\n- Informação Bancária Fornecedor\n- NF Produtor Rural Referência - GTA\n- Lançamento C"], "485-14": ["Frigorífico (RECE50) — iniciais e finais, faixas de peso, quebra do abate", "Gera Contra Nota Fiscal de Entrada - Frigorífico - RECE50.pdf", "2. Criar um botão para Calcular Quebra do Abate, e outro para desfazer o cálculo. Quando calculado pelo botão\ncriado, na linha da NF exibir um ícone de verificado, e caso desfazer o cálculo, deixar de exibir este ícone;\nApós refazer o recálculo das quebras, atualizar os valores dos itens para a contra nota.\n\nDocumentação:\nSuprimentos Recebimentos Notas Fiscais\nGera Contra Nota Fiscal de Entrada - Frigorífico - RECE50 Detalhamento:\nNa programa EPRO58, foi criado um novo botão para efetuar o cadastramento dos acréscimos de peso ao produto\nconforme faixas de peso iniciais e finais.\n\nNo programa RECE50, foram criados dois novos botões para efetuar o cálculo e descaclulo conforme as faixas de\npes"], "487-74": ["Lista de Preço (VEND2) — 'eduardoletavo@gmail.com'", "Ivendre_Android_Frigorificos.pdf", "De: Marcio Schneider [mailto:marcio@kunden.com.br]\nEnviada em: sexta-feira, 17 de setembro de 2021 13:22\nPara: 'CONTROLADORIA LETAVO'; 'compras.letavoalimentos@gmail.com'; 'admletavo@gmail.com';\n'eduardoletavo@gmail.com'\nCc: 'Roberto Schumacher | Kunden Systems'\nAssunto: RES: atualização do
