ag <appSettings>: alterar o valor da chave \""], "634-13": ["ADMI265 — regras de busca, e-mails destinatários, contato principal", "Analise de Crédito.pdf", "ROTINA:\n\nAdministração Configurações Rotina Envia E-mail ALTERAÇÃO:\n\nContinuação pedido 23392:\n\n1- Criar programa novo para cadastro de conta de e-mail por programa do ERP. Nele permitir que seja configurado:\na. Empresa / Unidade de Negócio;\nb. Descrição para a configuração. Exemplo: Envio Financeiro; Envio Compras....;\nc. Cadastro dos programas que irão usar essa configuração;\nd. Dados de servidor e login do e-mail enviador;\ne. Opção de Cópia para remetente;\nf. Assunto;\ng. Corpo do e-mail;\nh. Rodapé: texto padrão e concatenar no final e-mail do remetente com hiperlink para eventual possível\nretorno por este e-mail por parte de quem recebe-lo.\n\n2- Criar regras de busca dos e-mails Destinatár"], "634-16": ["ADMI35 — Pedidos faturados com a configuração de análise de crédito do cliente definida como…", "Analise de Crédito.pdf", "Pedido Serviço: 63278 Cliente: Pegada Solicitação:\nPedidos faturados com a configuração de análise de crédito do cliente definida como 'Cliente' descontam o valor do\nlimite de crédito do grupo.\n\nRotina:\n\nVendas e Distribuição Faturamento Notas Fiscais\nLiberação Pedidos Venda Faturamento Alteração:\nVerificar o motivo pelo qual os pedidos faturados, com a configuração de análise de crédito do cliente como\n'Cliente', descontam o valor do limite de crédito tanto do cliente quanto do grupo, quando deveriam descontar apenas do cliente.\n\nDocumentação:\n\nVendas e Di\n\ndo cliente quanto do grupo, quando deveriam descontar apenas do cliente.\n\nDocumentação:\n\nVendas e Distribuição  Faturamento Notas Fisca"], "635-0": ["Cadastro de Usuários (ADMI260) — pessoa este email, loja de cnpj, mesma franquia", "Cadastro de Usuários – ADMI260.pdf", "Cadastro de Usuários – ADMI260..\n\nSituação na Grafdil, em 012025...Grafdil tem a seguinte necessidade:\n\nNo ADMI260 o mesmo cadastro de email poder acessar + de 1 cliente...isso porque:\nGrafdil vai disponibilizar o B2B para Franquias...\nE aí tem algumas franquias que comprarão da Grafdil pela mesma pessoa/pelo mesmo email de usuario do\nB2B (provável esta pessoa/este email é dono de mais de 1 Loja/de 1 CNPJ/de 1 cadastro de Pessoa da mesma franquia).\n\nSolução pensada (foi possível na Grafdil, porque na Grafdil o “Representante” não é utilizado de fato nos seus\ncontroles...por isso utilizamos tal Pessoa acima, como um Representante (mas de fato não é um Representante).\n\nOlhando na BD Grafdil An"], "635-1": ["Cadastro de Usuários (ADMI260) — Conforme dados fornecidos", "Cadastro de Usuários – ADMI260.pdf", "Conforme dados fornecidos:\nBom dia Marcio! Tudo bem?\n\nCliente: Bocattino\nGrupo: GP Gestao de Ativos - Eireli (8258)\nLista de Preço: BOCATTINO_001\n\nA franqueadora pode comprar para as franquias, assim como cada franquia pode comprar para si.\nEntão precisamos que a franqueadora tenha um usuário em que possa comprar para todas, além\nde cada uma ter o seu próprio usuário.\nConsultando os cadastros/clientes que pertencem ao grupo 8258: vinculados 23 cadastros. \nDefinir o grupo (franquia) como Representante. Cadastrar como representante em cada cliente\n(franqueado). Para esta guia vinculamos em três clientes.\n\nNo representante (franquia) definir uma classe de representante. Criar se necessário. Nes"], "639-6": ["ADMI114 — Configurações comissões Potatoes Boa tarde, Ju Tudo?", "Comissões.pdf", "De: Deise Nara de Souza [mailto:deise.nara@kunden.com.br]\nEnviada em: quarta-feira, 21 de outubro de 2020 13:09 Para: programacao@itrnh.com.br\nCc: Ismael de Paula; Marcio Reni Schneider (Kunden Systems)\nAssunto: Configurações comissões Potatoes Boa tarde, Ju Tudo?\n\nConsiderando as seguintes informações...\n\n... as configurações das comissões da Potatoes serão da seguinte forma:\n\n1. cadastrar os representantes no \"Pessoas Físicas/Jurídicas (ADMI34)\", marcando a categoria \"Representante\";\n\n2. clicar sobre a palavra \"Representante\", para abrir o respectivo cadastro e, na aba \"Comissão\", informar\ncomo será a liberação e o % da comissão. Também vincularemos o Marcelo e o Cleo como \"Supervisores\".\n"], "646-3": ["Liberação Comercial Detalhada (VEND100) — ADMI35 - QUANDO O CAMPO \"ANÁLISE DE CRÉDITO\" ESTIVER COM A OPÇÃO DE \"LIBERAÇÃO…", "Liberação Comercial Detalhada – VEND100.pdf", "Pedido Serviço: 52426 Cliente: Pegada Solicitação:\nADMI35 - QUANDO O CAMPO \"ANÁLISE DE CRÉDITO\" ESTIVER COM A OPÇÃO DE \"LIBERAÇÃO AUTOMÁTICA\",\nINDIFERENTE A OPÇÃO QUE ESTIVER NO CAMPO \"CÓDIGO REFERÊNCIA\" NA CLASSE DE RISCO, DEVE SER LIBERADO\nPARA PODER CRIAR PEDIDOS NO ERP.\n\nRotina:\n\nAdministração Cadastros Clientes Alteração:\n\nAjustar o sistema para que quando o campo \"Situação de Crédito\" estiver com a opção \"Liberação Automática\", o\nmesmo não olhei para o campo \"Código Referência\" da classe de risco. E com isso consiga libera pedidos através do programa VEND100.\n\nCONTINUAÇÃO DO PEDIDO 48833.  Documentação:\nAdministração Cadastros Clientes Detalhamento:\nModificada a lógica conforme solicit"], "650-1": ["ADMI235 — Programa ADMI235", "Openfield_ Regra_Comercial.pdf", "Programa ADMI235\nTrabalha em conjunto com o programa acima VEND98:\nNo sentido de, o valor de desconto é defino acima, e no programa abaixo calcula quanto este desconto representa\nem % no item do pedido de venda, e enquadra a redução da comissão de acordo com a faixa encontrada/de acordo.\n\nMas também este programa pode trabalhar em separado.  \nEste cadastro VEND94 é um complemento/vinculo para o programa acima ADMI235.\n\nExemplo: a coluna “Comissão”. Exemplo o “5” ao qual estou posicionado abaixo, refere-se ao código “5” do cadastro acima.\nOu seja, a coluna “Comissão” quer dizer “Código do Cadastro de Comissões VEND235”."], "652-22": ["Pedido de Venda (PEDI1) — descontos alteração, obriga o preenchimento, alterado para carregar", "Pegada_Rotina_Descontos.pdf", "Pedido Serviço: 18882 Solicitação:\n\nROTINA:\n\nVendas e Distribuição Vendas Regra Comercial Descontos ALTERAÇÃO:\n\n1- Remover obrigatoriedade dos campos Cliente e Grupo Cliente, para que possa ser inserido um desconto geral\npara todos os produtos, assim fazendo com que sempre entre na regra de concessão de comissão;\n2- Com essa alteração, será possível criar descontos com percentual zero que, se necessário poderão ser alterados\nno pedido de venda;\n3- No programa de Pedidos de Venda, janela de descontos, tratar esta alteração para que este segundo desconto\nseja aplicado corretamente sob a nova condição de cadastro.\n\nDocumentação:\nO programa Descontos(VEND93) foi alterado para permitir cadastrar "], "653-0": ["Planejamento de Vendas (VEND14) — planejamento de vendas, configuração para funcionar, controle cotas planej", "Planejamento de Vendas - VEND14.pdf", "Planejamento de Vendas – VEND14..\n\nConfiguração para funcionar o Planejamento de Vendas:\nNa Categoria de Pedidos, e na Estrutura de Produto.\n\nQuando não há Cotas no programa Planejamento de Vendas, gera a validação abaixo ao confirmar.\nDetalhe no teste abaixo: um dos produtos estava com o campo “Controle Cotas Planej. Vendas” = SIM, o outro\nnão...por isso a mensagem KND-000463 foi só num dos produtos. \nAbaixo, o sistema retorna a qtde efetiva no próprio cadastro.\nO cadastramento pode ser mensal ou semanal."], "653-10": ["Planejamento de Vendas (VEND14) — PLANEJAMENTO DE VENDAS: ACRESCER CAMPO DE OBSERVAÇÃO E NÃO CONSIDERAR ENTREGAS DE PEDIDOS…", "Planejamento de Vendas - VEND14.pdf", "Pedido Serviço: 7898\n\nSolicitação:\nPLANEJAMENTO DE VENDAS: ACRESCER CAMPO DE OBSERVAÇÃO E NÃO CONSIDERAR ENTREGAS DE PEDIDOS DE\nVENDA COM PRODUÇÃO CANCELADA\n\nIncluir o campo de Observação junto ao bloco de estabelecimento das quantidades de planejamento, após o campo \"Qtd Efetiva\".\nCriar barra de rolagem para consulta a este campo.\nTamanho do campo: o maior possivel. Campo tipo \"Long\"?\n\nTambém:\nQuando a entrega de um pedido de venda tiver alterada a situação para Produção Cancelada, eliminar esta qtde da \"Qtd Efetiva\".\n\nTambém: acrescer um botão de consulta trazendo os pedidos de venda e as respectivas qtdes que estão vinculadas a cada \"Qtd Efetiva\";\n\nDocumentação:\nPrograma Planejamento de V"], "653-12": ["Planejamento de Vendas (VEND14) — Planejamento de Vendas", "Planejamento de Vendas - VEND14.pdf", "Planejamento de Vendas\n\nExemplo criado em 031018, para Ademir/Primevo.\n\n1= necessário configurar as Categorias de Pedido que devem atualizar a informação no Planejamento de Vendas.\nExemplo tela abaixo.\n\n2= no cadastro do Produto, tem que estar marcado o campo “Controle Cotas Planej Vendas”.\nÉ possível estabelecer nas estruturas “pai”.  \nA partir de configurado acima, com os próximos pedidos de venda passa a ser gerado e mostrados os dados\ncomparativos de Previsto X Efetivo no programa Planejamento de Vendas...\n\n...e no seu relatório:"], "654-2": ["Posição Financeira de Clientes (VEND31) — ADMI35 - CLIENTE NÃO TEM DOCUMENTOS VENCIDOS E ESTA SE ENCAIXANDO EM CLASSE DE RISCO…", "Posição Financeira – VEND31.pdf", "Pedido Serviço: 48628 Cliente: Pegada Solicitação:\nADMI35 - CLIENTE NÃO TEM DOCUMENTOS VENCIDOS E ESTA SE ENCAIXANDO EM CLASSE DE RISCO DIFERENTE DA QUE DEVERIA.  Rotina:\n\nAdministração Cadastros Clientes Alteração:\n\nCliente esta se encaixando em classe de risco que não deveria pois foi ajustada pelo job SETA_CLASSE_RISCO_CLIENTE_P.\n\nDocumentação:\nAdministração Cadastros Clientes Detalhamento:\nNada foi feito.\n\nObservações:\nFoi indentificado documentos vencidos para as pessoas que estão víncualdas ao grupo 545. Os documentos foram\npassados ao consultor responsável pelo pedido*.\n\nComo o cliente 545 é um grupo foi identificado que ao menos um cliente que está vinculado à ele contém um\ndocumento"], "662-1": ["ADMI228 — TRANSPORTADORA PREFERENCIAL - ADMI228 - ALTERAÇÕES E CRIAÇÃO DE NOVA ROTINA Rotina", "Transportadora Preferencial – ADMI228.pdf", "Pedido Serviço: 32578 Cliente: Pegada Solicitação:\nTRANSPORTADORA PREFERENCIAL - ADMI228 - ALTERAÇÕES E CRIAÇÃO DE NOVA ROTINA Rotina:\n\nAdministração Cadastros Transportadora Preferencial Alteração:\n\n- Objetivo, passar a determinar a transportadora no faturamento com base na regra de Estabelecimento origem para\ncidade ou UF destino.\n- Atualmente o sistema busca a transportadora do pedido de venda por meio de uma regra bastante complexa.\n- Sistema pode continuar a buscar do pedido de venda, porém quando o mesmo estiver em branco deve trazer\nsempre do programa ADMI228.\n- Criar nova rotina onde o PEDI44 vai buscar a transportadora do pedido de venda e caso não encontre nada, buscar do ADMI228.\n"], "662-2": ["ADMI228 — pedidos faturamento controle, grava na liberação, cadastro transportadora preferencial", "Transportadora Preferencial – ADMI228.pdf", "Sobre a Transportadora que é sugerida nos programas de Liberação para Faturamento (PEDI4, PEDI44, PEDI73,...):\n-O sistema “grava” a Transportadora para o faturamento no momento que é feito a aba “Liberação” nos programas\ncitados acima (PEDI4, PEDI44, PEDI73,...)...\n\n-primeiramente olha se tem a Transportadora gravado no Pedido de Venda.\n-Caso não esteja gravado no Pedido de Venda, busca do cadastro Transportadora Preferencial ADMI228.\nE aí grava na Liberação do Pedido de Venda e passa a trazer na aba “Faturamento”, ou aqui no botão Liberação\nPedidos Faturamento – Controle Carga PEDI73:  "], "663-0": ["Consulta Pedidos de Compra (COMP12) — orden de compra, aprobación por asignación, misma forma", "Alçada.pdf", "Alçada..\n\nPedido Serviço: 45752 Cliente: Baenamora Solicitação:\nRutina:\n\nAprobación por Asignación Desarrollo:\n\nCrear nueva opción en la rutina de Aprobación por Asignación: \"Cancelar Aprobación\".\nAl hacer \"clic\" en esta opción (en este botón), debe abrir una pantalla para poder registrar el motivo de la\ncancelación (no obligatorio llenar el motivo).\nEl motivo registrado de la cancelación quedará registrada en las ocurrencias de la Orden de Compra como histórico.\n\nCuando utilizado esta nueva opción, en la Orden de Compras deberá:\n- La \"Situación\" de la orden de compra también debe cambiarse y es necesario crear una nueva \"Situación\" de la\norden de compra: \"Aprobación cancelada\".\n- con esta s"], "663-10": ["Usuários (ADMI1) — Link na BD Produção Duramas (em 240726)", "Alçada.pdf", "Link na BD Produção Duramas (em 240726):\n\nhttp://192.168.16.193:8585/drmpro/f?p=109 Usuario: KUNDEN\nSenha: cfe registrado no cadastro do usuário Kunden.\n\nXxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx \nLink na BD Produção Brisa (em 270726):\n\nhttp://192.168.1.24:8585/bripro/f?p=109 Usuario: KND.GUILHERMEN Senha:123\n\nTeste efetuado por Guilherme, para implantação desta rotina na Brisa, vinculado a este RA:\nhttps://kundencloud.com.br:3825/atendimento?id=260304007&callType=customer\n(com apoio de Leo para funcionar a geração do email, pois antes gerava mensagem de erro de procedure ao clicar no\n“Confirmar” do Pedido Compras...\nConfiguração da Categoria:\n\nAqui após Confirmar o Pedido: \n"], "663-11": ["Usuários (ADMI1) — Testes feitos em Duramas, em 290726", "Alçada.pdf", "Testes feitos em Duramas, em 290726:\nAqui os cadastros envolvidos:\nNo programa “Categoria de Pedido-COMP4” \nNo programa “Usuários”-ADMI1” os usuários responsáveis que farão a autorização da alçada, precisam destas\nconfigurações: de seu email, de habilitação web e habilitação ao “Controle de Alçadas”...\n\nNa aplicação web “Alçada”: aqui os usuários responsáveis que farão a autorização da alçada precisam destas\nconfigurações de Valor da Alçada e definição se “Recebe email”... \n\nTambém necessário estas configurações para o envio de emails, aqui no programa ADMI264...\n\n...sendo que, ao que parece, conforme testes já registrados acima, a rotina busca as configurações do 1º ID que encontrar:\n\nAqui "], "663-12": ["Plano de Necessidades de Compras (COMP13) — rotina de alçada, aguardando aprobación, gerando mensagem knd", "Alçada.pdf", "A rotina gravou OK no Pedido Compras...e mostra o usuário da próxima “Aprovação / liberação”...\n\nAqui acessando com o usuário da próxima aprovação...\n\n...aqui o usuário efetuando a ultima aprovação, gerando mensagem KND-004735 \n...e o Pedido Compras fica autorizado e confirmado por completo:\n\nExtensão dos testes na Duramas, aqui abaixo efetuado treinamento com Duramas no RA...\nhttps://kundencloud.com.br:3825/atendimento?id=260723013&callType=customer\nSendo que abaixo está descrito o comportamento da rotina de Alçada (enquanto está “Aguardando Aprovação” e\n“Cancelado Aprovação”), em relação ao MRP de Compras, nos programas como COMP13 e COMP75.\n\nMarcio.Cons 31/07/2026 - 16:38:49 Buenas tardes"], "663-13": ["ADMI122 — Testes na BD Pruebas Duramas", "Alçada.pdf", "Testes na BD Pruebas Duramas:\n\nLink:\nhttp://192.168.16.193:8585/drmhml/f?p=109\n\nErros encontrados para fazer funcionar:\n\n1º erro:\nORA-04062: signature of package \"KUNDEN.ENVIА_EMAIL_APEX_P\" has been changedORA-04062: signature of\npackage \"KUNDEN.ENVIА_EMAIL_APEX_P\" has been changed 2º erro:\nORA-20000: Erro EMAIL_MONITOR_P.ENVIА: ORA-29289: directory access denied   3º erro:\nKND-002175\n\nCfe Leo/Infra Kunden, o motivo dos três erros foram:\nO 1º erro: Estava com o programa COMP3 em uma versão que não funcionava, foi atualizado = tarefa da Infra Kunden.\nO 2º erro: Faltava cadastrar no programa ADMI122 o diretório da pasta de protocolos e result, + junto com isso\nprecisa colocar no programa ADMI2"], "665-0": ["COMP1 — comprador no cadastro, vinculo de grupo, permitir multi seleção", "Compradores – COMP1.pdf", "Compradores – COMP1..\n\nAvaliação em 260922, na implantação Aniger:\nAvaliar possibilidade de permitir multi seleção de Grupo Comprador no cadastro de Comprador.\n\nSITUAÇÃO ATUAL...\n\nNão identificado o porquê do vinculo de Grupo Comprador no cadastro do Comprador...\nAtualmente não efetua nenhum tipo de validação, nem nenhum tipo de “vantagem”.\n\nTentar ver o porquê serve o vinculo de Grupo Comprador no cadastro do Comprador...(poderia ser visto via pesquisa nas rotinas/programas??)\n\nExemplo Comprador Suporte vinculado ao Grupo Cotação “Quimico”...e um material com outro Grupo Cotação... \n...Permite Plano de Necessidades de Compras: utilizar tal produto sem o vinculo com o Grupo Comprador acima.."], "667-2": ["Consulta Plano de Necessidades de Compras (COMP39) — COMP37 - VERIFICAR LOGICA DO RELATORIO Rotina", "Consulta Plano de Necessidades de Compras – COMP39.pdf", "Pedido Serviço: 43289 Cliente: Oksebra Solicitação:\nCOMP37 - VERIFICAR LOGICA DO RELATORIO Rotina:\n\nSuprimentos Compras Relatórios\nRelatório Resumo Plano Necessidade de Compras COMP37+ Plano Necessidades de Compras MRP COMP13 +\nConsulta Plano de Necessidades de Compras – COMP39 Alteração:\n\n- Dúvida sobre qual critério o relatório leva em consideração para contemplar a quantidade do pedido de compra.\n\nDocumentação:\n\nSuprimentos Compras Relatórios\nResumo Plano Necessidade de Compras Detalhamento:\nIndependente da situação do pedido de compra, enquanto não houver recebimento, a quantidade do pedido será\ncontemplada no relatório. A lógica não leva em consideração a situação do pedido de compra.\n\n"], "667-6": ["Consulta Plano de Necessidades de Compras (COMP39) — seguintes funcionalidades, anos atrás, rotina está mostrando", "Consulta Plano de Necessidades de Compras – COMP39.pdf", "Avaliação feitas no programa COMP39 em 060324, em testes feitos na BD Duramas...\n\nIdentificado que o COMP39 tem as seguintes “deficiências/incoerências/problemas” na sua utilização, porque não\ntrata/não considera as seguintes funcionalidades que já são utilizadas no COMP13 e COMP75:\n\nVeja à direita, bloco de Estoque...\nVeja que a rotina está mostrando qtdes disponíveis de Estoque para o MRP, da Localização 61 -Rechazados (entendo\nque se é Rechazado não é algo utilizável pelo MRP)... \n...e aqui comprova que a rotina do COMP39 tem deficiência, porque não está olhando esta configuração da\nLocalização, que não indica utilizar a Loc 61 para o MRP (nenhuma Localização indicada aqui):\n\nZzzzzzzzzzzz"], "668-1": ["Cotação (COMP14) — COTAÇÕES DE COMPRAS - HABILITAR FUNCIONALIDADE DE COTAÇÃO POR TAMANHOS DE GRADE", "Cotações - COMP14.pdf", "Pedido Serviço: 11356 Cliente: Pegada Solicitação:\nCOTAÇÕES DE COMPRAS - HABILITAR FUNCIONALIDADE DE COTAÇÃO POR TAMANHOS DE GRADE\nCliente utiliza para deternimados produtos preços diferentes para tamanhos diferentes (situação nova identificada em 04/02/2014 ).\nProdutos com atacadores e alguns zippers serão cadastrados com grade.\nAlterações:\n- Cotações de Pedidos de Compra: habilitar preço por tamanho;\n- Quando for compra por MRP: gerar um item no pedido de compra e trazer em uma aba abaixo uma tabela com as\nseguintes informações: tamanho, quantidade e valor;\n- Quando for compra manual de itens com cotação e houver preços pro tamanho, seguir o padrão da compra com MRP.\n\nDocumentação:\nNovas M"], "668-29": ["Cotação (COMP14) — lote mínimo compra, qtde é baseada, compras com base", "Cotações - COMP14.pdf", "...aqui na Cotação configurado qtde de 30... \n...e no Produto: 50:  \nAgora aqui o COMP13 ao gerar o pedido de Compras, na qual a necessidade original é menor que os Estoques Mínimos definidos acima...\n\n...detalhe abaixo utilizei a opção “Agrupar” para gerar só 1 item agrupado no Pedido de Compras (cfe teste mais\nacima, numa outra avaliação do Lote Mínimo Compra, quando a rotina reparte em mais de 1 Entrega, fica estranho o Lote Mínimo gerado... \n...aqui gerou a mensagem KND-000361 = OK...veja que a qtde é baseada no Campo “Lote Mínimo Compra” da Cotação...\n\n...veja que gerou o Pedido de Compras, com base no Campo “Lote Mínimo Compra” da Cotação: qtde de 30:\n\nAgora, para comprovar que a rotin"], "674-1": ["Pedidos de Compras (COMP74) — 1. Criar programa novo: \"Envio de Email de Pedidos de Compras\";", "Envio de E-mail de Pedidos de Compras – COMP74.pdf", "Pedido Serviço: 58960 Cliente: Aniger Solicitação:\n1. Criar programa novo: \"Envio de Email de Pedidos de Compras\";\n1.1. Tela do programa: utilizar como base o programa \"Gera Pedido de Compra - EDI - COMP23\" . Exemplo\ndeste programa conforme tela abaixo (porém com algumas alterações citadas mais abaixo nos próximos itens).\n\n1.2. Altura de tela: utilizar altura máxima, para que possibilite mostrar a qtde máxima de registros de\nPedidos de Compras; Exemplo de tela mais abaixo.\n1.3. Criar aba \"Classificação\" para permitir classificar/ordenar os registros na aba \"Pedidos\" . Criar exemplo\nprograma COMP5 (exemplo tela abaixo). Permitir Classificação por todas as colunas mostradas na aba\n\"Pedidos\" . "], "678-14": ["Pedido de Compras (COMP3) — lote econômico, mínimo de compra, cálculo que considera", "Pedido de Compras - COMP3.pdf", "Documentação:\n- A partir de agora o programa conta com validação de lote mínimo de compra.\n\n- Da mesma maneira que o programa, validada o lote mínimo de compra, passa a validar também o lote econômico.\n- O programa busca o lote econômico primeiramente na cotação de compra, ou caso não encontre, verifica também\nno cadastro do produto.\n\n- Para pedidos gerados pelo \"Plano de Necessidades\":\nA validação é feita no momento em que o pedido é gerado, exibindo uma mensagem caso a quantidade não\ncoincida com o cálculo que considera o lote econômico. Caso o usuário não confirme o ajuste da quantidade, o pedido não é gerado.\n\n- Para pedido de compra lançado manualmente:\nO sistema bloqueia a confirmação "], "678-26": ["Pedido de Compras (COMP3) — INCLUIR FICHA TÉCNICA NA EMISSÃO DOS PEDIDOS DE COMPRAS", "Pedido de Compras - COMP3.pdf", "Pedido Serviço: 11928 Solicitação:\nINCLUIR FICHA TÉCNICA NA EMISSÃO DOS PEDIDOS DE COMPRAS\n* Cliente gostaria de poder enviar juntamente com a ordem de compras de amostras a ficha tecnica dos modelos envolvidos no pedido.\nO layout seria uma ficha um pouco mais limpa do que a que possuimos hoje, sem consumos dos materiais, apenas\ncom os materiais e observação de compras que consta na ficha.\nEm anexo um layout básico de como deveria ser a ficha que iria juntamente com o pedido de compras.\n\n* Cliente tambem solicita que se possa determinar na impressão do pedido de compras o nome dado ao campo\nonde consta o numero do pedido.\nEx: Um Usuario irá fazer somente ordens solicitando amostras para as f"], "678-28": ["Pedido de Compras (COMP3) — PEDIDO DE COMPRAS Y COTIZACIONES, CAMPO CONDICION DE PAGO: SUGERIR DEL CATALOGO DE…", "Pedido de Compras - COMP3.pdf", "Pedido Serviço: 12327 Solicitação:\nPEDIDO DE COMPRAS Y COTIZACIONES, CAMPO CONDICION DE PAGO: SUGERIR DEL CATALOGO DE PROVEEDORES Y\nPARAMETRO GENERAL POR COMPAÑIA.\n\nCrear el campo de Condición de Pago en el catálogo de Proveedores;\nCrear el parámetro general de Condición de Pago por compañía.\n\nzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz\nPasar a sugerir la condición de pago en los programas:\nCotización de Compras;\nPedido de Compras;\nCatálogo de Proveedores;\n\nzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz\nLa sugerencia en los programas:\nPrograma Catálogo de Proveedores:\nDe acuerdo el parámetro general de Condición de Pago por compañía.\n\nPrograma Cotización de Compras:\n1º de acuerdo el catálogo de Proveedores;\n2º c"], "678-52": ["Pedido de Compras (COMP3) — sobre trazer a descrição do Modelo ao lado do Numero do Plano de Produção nos Pedidos de…", "Pedido de Compras - COMP3.pdf", "De: Marcio Schneider [mailto:marcio@kunden.com.br]\nEnviada em: terça-feira, 23 de novembro de 2021 21:15 Para: 'ab.marcus2021@gmail.com'\nAssunto: sobre trazer a descrição do Modelo ao lado do Numero do Plano de Produção nos Pedidos de Compras\nReferente ao que voce me solicitou hoje de tarde, de trazer a descrição do Modelo ao lado do Numero do Plano de\nProdução nos Pedidos de Compras:\n\n-temos algo que poderá ser utilizado, que é semelhante ao que voce solicita...que teria que fazer os seguintes procedimentos:\n\n-No programa Plano de Produção, preencher em cada Plano de Produção o campo “Sit. Consumo”.\n\n(este campo “Sit Consumo” tem um cadastro próprio, que vocês podem “chamar” este cadastro a"], "678-65": ["Pedido de Compras (COMP3) — vista em duramas, orientação dada, cotação", "Pedido de Compras - COMP3.pdf", "Situação vista em Duramas, em 112021...\nReferente mensagem “KND-000359: Produto...X......sem cotação...”...orientação dada:"], "678-71": ["Pedido de Compras (COMP3) — descrição de compra, selecionando um fornecedor, acordo o idioma", "Pedido de Compras - COMP3.pdf", "Avaliação feita por Roberto em 230922, referente campo “Descrição Produto Compras” no EPRO60:\n\nInformado descrição de compra no material\n\nQuando informado o material na cotação, está carregando a descrição de venda do idioma português, mesmo\nselecionando um fornecedor de idioma inglês.\n\nSe não informar descrição na cotação, a impressão da OC busca de acordo o idioma do fornecedor\n\n“Roberto Schumacher — Ontem às 09:44\nVou colocar em um DOC, mas só para te avisar, o campo quando preenchido com idioma\nportuguês e inglês, está levando para a cotação automaticamente o que está no idioma\nportuguês, porém, mesmo selecionando um fornecedor externo, não está alterando a descrição \n\nna cotação, já na "], "678-75": ["Pedido de Compras (COMP3) — PEDIDO DE COMPRAS - PREVER EMISSÃO DO CARTÃO COMPONENTE A PARTIR DO PEDIDO DE COMPRAS", "Pedido de Compras - COMP3.pdf", "Cartão Componente por Pedido Compra – CFAB52 Pedido Serviço: 3232 Cliente: HK Solicitação:\nPEDIDO DE COMPRAS - PREVER EMISSÃO DO CARTÃO COMPONENTE A PARTIR DO PEDIDO DE COMPRAS\nDesenvolver uma opção para emissão de cartão componente a partir do pedido de compras, utilizando como\npadrão de agrupamento sempre a OF.\n\nObs.: Na V3 havia sido criado, na opção visualizar, um check box para imprimir o cartão componente não.\n\nDocumentação:\nPrograma CFAB52 - Emissão Cartão Componente por Pedido Compra\nRelatório CFAB53 - Sequencia 1\n\nEsta emissão de cartão componente obtém as informações a partir do pedido de compra.\nSomente serão processadas as entregas de pedido de compra que possuirem ordens de fabr"], "678-91": ["Pedido de Compras (COMP3) — Efetuar instalação/instalar do Monitor Kunden e configurações necessárias, para o…", "Pedido de Compras - COMP3.pdf", "Pedido Serviço: 64939 Cliente: Duramas Solicitação:\n\nEfetuar instalação/instalar do Monitor Kunden e configurações necessárias, para o funcionamento da rotina de envio\nde email dos Pedidos de Compra.\n\nDocumentação:\n\nDetalhamento:\nMonitor C# instalado.\n\nzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz Pedido Serviço: 65052 Cliente: Duramas Solicitação:\n\nRotina:\n\nSuprimentos Compras Pedido Pedido de Compra Alteração:\n\nPrograma Pedido de Compras-COMP3: Verificar motivo do envio de emails não estar funcionando no cl\n\n:\n\nPrograma Pedido de Compras-COMP3: Verificar motivo do envio de emails não estar funcionando no cliente.\n\nA infra instalou o monitor C# para envio de emails no cliente "], "678-94": ["Pedido de Compras (COMP3) — Listar as notas fiscais de remessa para beneficiamento no COMP3 Rotina", "Pedido de Compras - COMP3.pdf", "Pedido Serviço: 65277 Cliente: Pegada Solicitação:\nListar as notas fiscais de remessa para beneficiamento no COMP3 Rotina:\n\nSuprimentos Compras Pedido Pedido de Compra Alteração:\nAdicionar campo Data Emissão e Nota Remessa na aba Beneficiamento do programa COMP3.\n\n(isso quando o Pedido de Compra é com Categoria do Pedido Compra que tem a Flag “Exigir Beneficiamento” marcada).  Documentação:\nSuprimentos Compras Pedido Pedido de Compra Detalhamento:\nAdicionados os campos \"Data Emissão\" e \"Nro N.F.\" na aba \"Beneficiamento\" para mostrar a data de emissão e o\nnúmero da nota fiscal de beneficiamento, caso a mesma já esteja emitida.\n\nNo COMP42 é gerado a NF de Saída com base neste Pedido de Compras"], "678-101": ["Pedido de Compras (COMP3) — sequencia do item, edi de compra, incluir sequência", "Pedido de Compras - COMP3.pdf", "Pedido Serviço: 62561 Cliente: Aniger Solicitação:\n\nRotina:\n\nSuprimentos Compras Pedido\nRelatório Pedido de Compra Alteração:\n\nIncluir Sequência do Item no Relatório do Pedido de Compra (COMP9) e na Geração do EDI de compra (COMP23).\n\nDocumentação:\n\nSuprimentos Compras Pedido\nRelatório Pedido de Compra Detalhamento:\nAdicionada informação de Sequencia do Item ao relatório COMP9 e ao arquivo EDI."], "679-3": ["Plano de Necessidades de Compra Agrupado (COMP75) — dados de mrp, utilizamos a mesma, separada das empresas", "Plano de Necessidades de Compras Agrupado – COMP75.pdf", "Na Implantação Aniger em 290823, houve a necessidade de separar os dados de MRP das empresas 1 -Aniger e 2-\nMelbros (compras em separados, cada uma tendo produção própria)...\n\n...utilizamos a mesma configuração citada acima do Henrich*...: Configuração de Tabela PEDIDO_COMPRA_ATM para EMPRESA.\n*ver no .doc do COMP13.\n\nCom isso, já resolveu a necessidade apresentada de fazer a gestão de MRP totalmente separada das 2 empresas:  \nOu seja, separa todos os dados de MRP...\n(não tem estoques acima, nem Recebimentos previstos, mas visto na BD Homologação que sim fica separado de\nacordo com a empresa selecionada na aba Seleção)"], "679-5": ["Plano de Necessidades de Compra Agrupado (COMP75) — Visto em 100124, na instalação do programa na BD Duramas", "Plano de Necessidades de Compras Agrupado – COMP75.pdf", "Visto em 100124, na instalação do programa na BD Duramas:\n-Rotina está gerando no Pedido de Compras qtde maior que a qtde mostrada no MRP do COMP75\nConsta na validação: 64163_Val_1001242\n\nAqui situação original deste material...  \nAgora gerando um Pedido de Compras: \n\nGerou com qtde não de acordo com o acima...gerou 295...  \nFazendo uma seleção não por Plano e sim por este material, idem gera o Pedido de Compras com problema, com 295...  Posição Posterior:\nIdentificado que o motivo é este:\nLote Mínimo de Compra...\nConsegui identificar o motivo através do teste mais abaixo no COMP13: este sim alerta deste “Lote Mínimo Compra” na Cotação:\n\nQuando fui testar pelo COMP13   Dando SIM...gerou 295 "], "679-6": ["Plano de Necessidades de Compra Agrupado (COMP75) — ponto de reposição, essas necessidades, material está esperando", "Plano de Necessidades de Compras Agrupado – COMP75.pdf", "Situação apresentada por Krumenauer no RA 230727050 em que, a partir de feito o Pedido de Compras a partir de\numa Solicitação gerada pelo Ponto de Reposição, tal Solicitação deixa de ser mostrada na aba “Necessidades” do COMP13 e COMP75...\n...o que não acontece quando a Solicitação for feito manualmente pelo usuário (sem ser pela rotina de Ponto de Reposição)...\n\nDetalhes e o nosso retorno foi cfe abaixo:  17/01/2024 - 11:34:32 Augusto, referente ao COMP75.\n\nAlmoxarifado gerou uma solicitação de pedido numero 150 no COMP6.\nO pedido apareceu na tela do novo COMP75, e comprador gerou o\npedido 12384 cfme telas abaixo.\nPorém, mesmo tendo sido gerado o pedido o programa não limpou os\nítens da lis"], "679-11": ["Plano de Necessidades de Compra Agrupado (COMP75) — manual não deveria, pilhas, solicitado por lucas", "Plano de Necessidades de Compras Agrupado – COMP75.pdf", "Pedido Serviço: 65193 Cliente: Krumenauer Solicitação:\n\nRotina:\n\nSuprimentos Compras Pedido\nPlano de Necessidades de Compra Agrupado-COMP75 Alteração:\nCriar parâmetro geral para inibir solicitação manual da tela do MRP de compras.\n\nMotivo: para atender à solicitação de Lucas/Krumenauer, de acordo com o conceito aplicado no Cortume\nKrumenauer (e que entendo ser também um conceito “válido”, é apenas uma maneira diferente de avaliar\nnecessidades de Compras de Ponto de Reposição)...ou seja, não consideram que Solicitações-COMP6 feitas\nmanualmente pelo usuário devam ser consideradas na aba MRP como “Necessidade” = não deveria nem aparecer na\naba Necessidades, e não aparecendo na aba MRP*, não ser"], "681-1": ["Plano de Necessidades de Compras (COMP13) — Cria versão Plano Necessidade de Compras por Plano de Produção, utilizar como base o…", "Plano de Necessidades de Compras Resumida.pdf", "Pedido Serviço: 9622 Solicitação:\nCria versão Plano Necessidade de Compras por Plano de Produção, utilizar como base o programa COMP13 - Plano\nNecessidade de Compras MRP.\n\nFiltros: Os mesmos, porém a orogem sempre será plano de produção, portanto não precisa os check box.\n\nOpções: Agrupamento - Por plano, Estabelecimento, componente\nSe marcado agrupamento por plano, irá mostrar os produtos/quantidades agrupadas por plano,estabelecimento,componente,....\nValerá a mesma regra para estabelecimento ou componente, se marcaado irá agrupar.\nquando não assinalado, mostras na colunas correspondentes em branco.\n\nClassificações: Manter, porém somente as opções, plano, estabelecimento, componente e produ"], "682-3": ["COMP49 Documentação (COMP50) — COMP50 - AO TENTAR GERAR O PEDIDO DE COMPRA, ESTÁ BUSCANDO A COTAÇÃO VENCIDA Rotina", "Plano Necessidades de Compras por Estabelecimento - COMP50.pdf", "Pedido Serviço: 43287 Cliente: Pegada Solicitação:\nCOMP50 - AO TENTAR GERAR O PEDIDO DE COMPRA, ESTÁ BUSCANDO A COTAÇÃO VENCIDA Rotina:\n\nSuprimento Compras Pedido\nPlano de Necessidade de Compras por Estabelecimento Alteração:\n\nQuando possuímos uma cotação para um material já vencida e uma cotação para um nível estrutural maior que do\nmaterial final, quando clicamos para gerar o pedido de compra, o sistema está buscando a cotação sem validade, o\nque está incorreto e bloqueando o usuário de gerar o pedido de compra.\n\nDocumentação:\nParâmetro Geral:\n50216 | UTILIZA DATA ATUAL COMO BASE PARA BUSCA DE COTAÇÃO DE PRODUTO QUANDO NÃO INFORMADA |\nUTILIZA A DATA ATUAL COMO BASE PARA A BUSCA DE COTAÇÃO "], "683-7": ["Plano de Necessidades de Compras (COMP13) — MRP DE COMPRAS: NA ROTINA DE NECESSIDADES GERADAS PELAS SOLICITAÇÕES DE COMPRAS, NÃO…", "Plano Necessidades de Compras_MRP - COMP13.pdf", "x Pedido Serviço: 6411 Solicitação:\nMRP DE COMPRAS: NA ROTINA DE NECESSIDADES GERADAS PELAS SOLICITAÇÕES DE COMPRAS, NÃO OCULTAR ESTAS NECESSIDADES PELO LANÇAMENTO DA NF ENTRADA\n\nEfetuar esta funcionalidade criando um parametro geral.\n\nA \"ocultação\" desta necessidade será efetuada pelo usuario, utilizando o programa \"Cancelamento Saldo Solicitações de Pedidos\" Documentação:\nPLANO DE NECESSIDADES DE COMPRAS (COMP13)\nRELATÓRIO PLANO DE NECESSIDADES DE COMPRAS (COMP16)\nRELATÓRIO PLANO DE NECESSIDADES DE COMPRAS POR PLANO DE PRODUÇÃO (COMP28)\nRELATÓRIO POSIÇÃO DE NECESSIDADES DE MATERIAIS (COMP32)\nRESUMO PLANO DE NECESSIDADES DE COMPRAS (COMP37)\nCONSULTA PLANO DE NECESSIDADES DE COMPRAS (COMP39)"], "683-12": ["Plano de Necessidades de Compras (COMP13) — Criar um programa que permita o encerramento dos itens de uma solicitação", "Plano Necessidades de Compras_MRP - COMP13.pdf", "Pedido de Serviço 5553 (isso também está documentado no programa Solicitações, de Compras):\n\nSolicitação:\nCriar um programa que permita o encerramento dos itens de uma solicitação.\nAs mesmas informações que forem marcadas neste novo programa terão que aparecer nos itens do programa de \"Solicitação de compras\", através de um Check Box por\nitem, se ele estiver marcado significara que o item em questão esta encerrado.\nConferir para que quando um item for encerrado o mesmo não pode mais aparecer para os demais programas, no caso não aparecera mais para o MRP, para o consulta de\nMRP, para gerar um novo pedido de compra e todos os demais programas que envolvem a solicitação.\nO programa de \"Encerra"], "683-16": ["Plano de Necessidades de Compras (COMP13) — LIB. PEDIDOS FATURAMENTO - RESERVA --> NECESSIDADES RESERVADAS CONTINUAM NO MRP PARA…", "Plano Necessidades de Compras_MRP - COMP13.pdf", "Zzzzzzzzzzzzzzzzzzzzzzzzzzzzzz Pedido Serviço: 10119 Solicitação:\nLIB. PEDIDOS FATURAMENTO - RESERVA --> NECESSIDADES RESERVADAS CONTINUAM NO MRP PARA COMPRAR\nNa rotina de MRP de Compras de Produto Pronto estão aparecendo necessidades de pedidos de venda que estão quantidades em estoque reservadas.\nO que ocorre:\n1- a quantidade reservada é abatida da quantidade disponível\n2- porem a necessidade permanece no MRP\nEm anexo segue exemplo feito na base de suporte da Kunden.\n\nDocumentação:\nPrograma 'Liberação Pedidos para Faturamento - Reserva' foi alterado para excluir o MRP de compras ao fazer a reserva e incluir o MRP quando desfazer, desde que o\nparâmetro 50058 (GERAR MRP DA ENTREGA DO ITEM DO"], "683-35": ["Plano de Necessidades de Compras (COMP13) — MRP de Materiais: necessario agregar tratativa para os estabelecimentos \"Depositos\", que…", "Plano Necessidades de Compras_MRP - COMP13.pdf", "Pedido Serviço: 10170 Cliente: Pegada Solicitação:\nMRP de Materiais: necessario agregar tratativa para os estabelecimentos \"Depositos\", que atenderão estabelecimentos \"Produtivos\".\n\nProposta: Ideia: linkar via cadastro de Localização: identificar a Localizaçao/Estabelecimento ao qual gerará o estoque para a produção.\n\nDocumentação:\nCADASTRO DE LOCALIZAÇÃO (ADMI44)\nNa aba \"Compras\", foi criada a coluna \"Localização Depósito\".\n\nPLANO NECESSIDADE DE COMPRAS\n\nQuando a lógida de MRP de Compras estiver buscando o estoque dos produtos, buscará, também, o estoque da localização depósito das localizações encontradas na primeira\nbusca. Nesta busca dos depósito, não serão validados os grupos compradore"], "683-36": ["Plano de Necessidades de Compras (COMP13) — PLANO DE NECESSIDADES DE COMPRAS, TELA \"PEDIDO\": PERMITIR ALTERAR O CAMPO \"NECESSIDADE\" E…", "Plano Necessidades de Compras_MRP - COMP13.pdf", "Pedido Serviço: 11758 Solicitação:\nPLANO DE NECESSIDADES DE COMPRAS, TELA \"PEDIDO\": PERMITIR ALTERAR O CAMPO \"NECESSIDADE\" E GERAR A QTDE NO PEDIDO DE COMPRAS DE ACORDO COM ESTA ALTERAÇÃO\n\nApenas disponivel para materiais sem grade.\n\nDocumentação:\nPLANO DE NECESSIDADES DE COMPRAS (COMP13)\nPLANO DE NECESSIDADES DE COMPRAS RESUMIDA (COMP49)\nPLANO DE NECESSIDADES DE COMPRAS POR ESTABELECIMENTO (COMP50)\n\nNa tela de geração do pedido de compra, será permitida a alteração da coluna \"Necessidade\" para produtos SEM grade."], "683-51": ["Plano de Necessidades de Compras (COMP13) — apostrofe, sql command not, produção o motivo", "Plano Necessidades de Compras_MRP - COMP13.pdf", "Para esta mensagem “ORA-20000: Erro GERA_MRP_COMPRA_GTB_P: ORA-00933: SQL command not properly ended”, que apareceu em todos os programas de MRP de\nCompras, filtrando um determinado Plano de Produção, o motivo é...\n...é que foi colocado uma apostrofe na Estruturação de Produto, campo “Obs Compras”.\nCfe definição de Jean, não há como prever isso nos programas, nem evitar que ocorra, nem colocar mensagem. Não se pode colocar apostrofe em nenhum lugar cadastro\ndo sistema, porque de acordo como são feitos os selects nos programas podem gerar estes inconvenientes.\n\nVeja abaixo a apostrofe, ao final da Obs. "], "683-83": ["Plano de Necessidades de Compras (COMP13) — ESTRUTURAÇÃO DE PRODUTO - EPRO15 / Agendador de Tarefas: GERAÇÃO MRP COMPRA PEDIDOS EM…", "Plano Necessidades de Compras_MRP - COMP13.pdf", "Pedido Serviço: 44183 Cliente: TEA Solicitação:\nESTRUTURAÇÃO DE PRODUTO - EPRO15 / Agendador de Tarefas: GERAÇÃO MRP COMPRA PEDIDOS EM CARTEIRA Rotina:\n\nManufatura\nEngenharia e Desenvolvimento de Produto Engenharia\nEstruturação de Produto - EPRO15\n\nAgendador de Tarefas: GERAÇÃO MRP COMPRA PEDIDOS EM CARTEIRA Alteração:\n\nVerificar o motivo do log que aparece no agendador de tarefas.\nROTINA do Agendador de Tarefas: GERAÇÃO MRP COMPRA PEDIDOS EM CARTEIRA\n\nMensagem: “KND-000201...Não existe coeficiente na Variação de Consumo...”  Documentação:\nManufatura\nEngenharia e Desenvolvimento de Produto Engenharia\nEstruturação de Produto - EPRO15 Detalhamento:\nNada foi feito.\n\nObservação:\nFoi necessário r"], "683-93": ["Plano de Necessidades de Compras (COMP13) — campos: Data Necessidade e Data Compra Revisar, Tempo Segurança Entrega (Dias), Tempo…", "Plano Necessidades de Compras_MRP - COMP13.pdf", "Avaliação feita em 131021, na visita a Duramas...\n\nArquivar em COMP13, definições campo Data Necessidade e Data Compra\n\nRevisar …Tiempo Reprovisión días (40)…utilies o corridos? Y, porque de 08/10/21 a 13/08?\nY porque 08/10/21, teniendo la solicitud fecha de 15/10/21?\nPosición:\nSolicitud: 15/10/21\nFecha Necesidad: 15/10/21 – (menos) 5 días útiles Tiempo seguridad = 08/10/21\nFecha Compra: parte de la fecha 08/10/21 – (menos) 40 días útiles Tiempo Reprovisión/Lead time de proveedor = 13/08/21 Traduzindo… No COMP13, colunas…:\nData Necessidade: considera dias úteis/uteis, partindo do cadastro feito no EPRO15, campo “Tempo Segurança Entrega (Dias)”\nData Compra: considera dias uteis, partindo do c"], "683-99": ["Plano de Necessidades de Compras (COMP13) — PROGRAMA PLANO DE NECESSIDADES DE COMPRAS ¿ COMP13: PASSAR A MOSTRAR AS QTDES…", "Plano Necessidades de Compras_MRP - COMP13.pdf", "Pedido Serviço: 55353 Cliente: Kunden Solicitação:\nPROGRAMA PLANO DE NECESSIDADES DE COMPRAS ¿ COMP13: PASSAR A MOSTRAR AS QTDES ¿PRÉ-RECEBIDAS¿ DAS NF¿S DE ENTRADA\n1. Programa Plano de Necessidades de Compras ¿ COMP13, quando houver registros de Pré-Recebimento de Pedidos de Compras:\n1.1. Na tela ¿Necessidades¿ (aberta a partir do botão ¿MRP¿) passar a mostrar as qtdes ¿Pré-Recebidas¿ das NF¿s de Entrada;\n1.2. Para espaço para esta nova coluna: aumentar a largura da tela, idem programa PEDI118;\n1.3. Qtdes do botão de Grade também deverão ser tratadas e de acordo com as qtdes totais;\n1.4. Colunas Necessidade Liquida e Estoque Projetado: deverão passar a considerar esta nova coluna, com a mes"], "683-108": ["Plano de Necessidades de Compras (COMP13) — ponto de reposição, essas necessidades, vinda do material", "Plano Necessidades de Compras_MRP - COMP13.pdf", "\nSituação apresentada por Krumenauer no RA 230727050 em que, a partir de feito o Pedido de Compras a partir de uma Solicitação gerada pelo Ponto de Reposição, tal\nSolicitação deixa de ser mostrada na aba “Necessidades” do COMP13 e COMP75...\n...o que não acontece quando a Solicitação for feito manualmente pelo usuário (sem ser pela rotina de Ponto de Reposição)...\n\nDetalhes e o nosso retorno foi cfe abaixo:\n\n17/01/2024 - 11:34:32 Augusto, referente ao COMP75.\n\nAlmoxarifado gerou uma solicitação de pedido numero 150 no COMP6.\nO pedido apareceu na tela do novo COMP75, e comprador gerou o pedido 12384 cfme telas abaixo.\nPorém, mesmo tendo sido gerado o pedido o programa não limpou os ítens da li"], "684-18": ["Agendador de Tarefas (ADMI63) — Smart_Ponto Reposição", "Ponto de Reposição.pdf", "Smart_Ponto Reposição\nTeste efetuado em 290721, para comprovar a funcionalidade da rotina, considerando tanto necessidades geradas\npelos Planos de Produção + Pedidos em Carteira (e que são mostrados na tela do MRP), em conjunto com a rotina de\nPonto de Reposição/Estoque Mínimo, para alertar quando a qtde chegar a um limite mínimo “X”.\n\nTeste efetuado:\nAgendador de Tarefas de geração de necessidades Pedidos em Carteira: vai rodar às 22:00 horas.\nAgendador de Tarefas de Ponto de Reposição/Estoque Mínimo: vai rodar às 23:00 horas.\nPosição de 2 materiais de teste em 290721 2022hrs...: \n Zzzzzzzzzzzzzzzzzzzzzzzzzz\nOlhando em 300721, 0800 hrs, a rotina do agendador rodou OK...\n\nProduto 117: gerou "], "684-26": ["Recebimento de compras (COMP5) — gerar a reposição, porque o usuário, planos de produção", "Ponto de Reposição.pdf", "Extensão da implantação da rotina acima, ocorrida em 120624 e registrada no RA 230727050:  Posição Kunden:\n\nO usuário MATHEUS fez uma mudança no cadastro de alguns materiais ontem, o campo que mudaram foi tipo de\nfornecimento para Externo, dessa maneira o MRP de compras está olhando para os planos de produção, o que faz\ncom que gere uma solicitação com uma grande quantidade, precisam manter esse campo como \"Interno\", dessa\nmaneira o JOB vai olhar o estoque e rodar/gerar a reposição como estava gerando antes.\n\nAparentemente essa mudança foi por causa do que foi comentado no RA 240611004, consegues dar uma olhada\nporque o usuário quer que os planos de produção gerem necessidades? "], "686-7": ["Plano de Necessidades de Compras (COMP13) — Avaliação feito em 291119, para a POC Aniger", "Pré-Recebimento.pdf", "Avaliação feito em 291119, para a POC Aniger:\n\nPré-Recebimento...\nAntes de haver o Recebimento...(do Pré-Recebimento):\n\nEfetuado o lançamento...(pelo programa de Recebimento Pedido de Compra, com parâmetro para PRE-\nRECEBIMENTO)...gerou esta NFE, Aguardando Confirmação: não permite confirmar no momento de gerada pelo\nprograma “Recebimento Pedido de Compra”...só fechando o programa de NFE e entrar de novo...\n(Obs.: neste momento não atualiza dados no Contas a Pagar)\n\nPedido compra ficou assim:  \nVeja que, se consultar assim: não retornará mais o Pedido Compra para ser cobrado o fornecedor...\n\n...mas no MRP mostra inalterado:  \n... não há uma marcação de que já foi Pré-Recebido...(seria bom qu"], "688-2": ["Recebimento de compras (COMP5) — RECEBIMENTO PEDIDOS DE COMPRA - CRIAR PRE-RECEBIMENTO PARA A ROTINA DE PRÉNOTA", "Recebimento Pedidos de Compras - COMP5.pdf", "Pedido Serviço: 11813 Solicitação:\nRECEBIMENTO PEDIDOS DE COMPRA - CRIAR PRE-RECEBIMENTO PARA A ROTINA DE PRÉNOTA\nCriar um parametro de inicialização no programa de Recebimento de Pedidos de Compra para que seja permitido\ntrocar o status do pedido de compra para \"Em Transito\".\nO fluxo do processo no cliente será:\n1- emitir o pedido de compra normalmente\n2- fazer o pré-recebimento deste pedido de compra neste programa com o parametro MENU_CLASSE =\nPRE_RECEBIMENTO --> primeira etapa\n3- ao fazer isso, o sistema deverá trocar o status de \"Confirmado\" para \"Pré-Recebido\" e gerar a NF de entrada para\nser conferida (situação ficará Aguardado Confirmação);\n4- essa NF de entrada gerada nesse programa"], "688-8": ["Recebimento de compras (COMP5) — cadastro configuração especial, visto com cesar, sugeridas", "Recebimento Pedidos de Compras - COMP5.pdf", "Sobre as Operações, que podem ser sugeridas aqui no COMP5: usar o programa RECE32 - Cadastro Configuração Especial (Operação):\n\nVisto com Cesar em 092020, para Baenamora:"], "690-5": ["Relatório Controle Industrialização (COMP24) — item da nfs, coluna industrialização, equipe vps", "Relatório Controle de Industrialização - COMP24.pdf", "Testes feitos junto com equipe VPS em 090425, utilizando esta opção da Categoria de Pedidos de Compras... “Exigir Remessa Industrialização”...\n\n...isso para que se possa ter a informação dos saldos nos Curtumes, Saldos de NFs de Remessa, que ainda estão nos\nCurtumes em produção, mas cujas NFs estão “empenhadas” na produção de Pedidos de Beneficiamento em aberto...\n\n...aqui um Pedido de Beneficiamento com vinculo num Item de NF Saida...  \n...que gerou este saldo...veja acima no 1º item deste relatório, o saldo na coluna INDUSTRIALIZAÇÃO = 41,4000\n\n...agora testando lançando a NF de Entrada...só que neste caso, como teste, lançamento a NF de Entrada com um\noutro Item de NF de saída, para ver c"], "691-3": ["Relatório Plano de Necessidades de Compras (COMP16) — utilização do sistema na AB", "Relatório Plano de Necessidades de Compras - COMP16.pdf", "De: Marcus Vinicius [mailto:ab.marcus2021@gmail.com]\nEnviada em: quinta-feira, 7 de abril de 2022 09:02 Para: Marcio Schneider\nAssunto: Re: utilização do sistema na AB\n\nPrecisamos de um relatório que está em anexo o modelo, precisamos tirar por modelo, o relatório das\nordens de compras atendidas e o que falta atender de todo o modelo. (uma vez nós falamos sobre mas\nnão lembro como ficou)\nPosição: o que falta vocês encaminhar Pedido de Compras com os fornecedores (ou pendente de analisar o estoque\ne ver que tem o estoque o suficiente), vocês poderão utilizar o Relatório Plano de Necessidades de Compras –\nCOMP16, marcando a opção “Necessidades a Confirmar” (e deixar desmarcado a opção “Necessi"], "695-9": ["COMP7 — pedidos de compra, selecionando o plano, gera no relatório", "Relatório Posição de Entregas - COMP7.pdf", "Visto em 051121, contato da AB...precisava gerar no relatório todos os Pedidos de Compra, referente a\ndeterminados Planos de Produção...só que não aparece todos os Pedidos de Compra no Relatório, mesmo que no\nPedido de Compra tenha o tal Plano vinculado...exemplo:\nPedido de Compra tendo o Plano 14...\n\n...não gera no relatório:\n\nMotivo:\n\n[17:23, 05/11/2021] Marcio Schneider: Sobre o Relatório que estivemos falando a pouco...para trazer os dados\nselecionando o Plano de Produção, precisa também ter informação na coluna \"OF\"\n[17:24, 05/11/2021] Marcio Schneider: Em cada entrega do Pedido de Compra.  \n[17:24, 05/11/2021] Marcio Schneider: Voce até pode ser repetido o mesmo numero da OF para o mes"], "698-1": ["ADMI265 — contato principal, contas a receber, e-mail cadastrado", "Rotina de Envio de Email, para Pedido de Compras (nova rotina).pdf", "Pedido Serviço: 24460 Solicitação:\n\nROTINA:\n\nAdministração Configurações Rotina Envia E-mail ALTERAÇÃO:\n\nContinuação pedido 23392:\n\n1- Criar programa novo para cadastro de conta de e-mail por programa do ERP. Nele permitir que seja configurado:\na. Empresa / Unidade de Negócio;\nb. Descrição para a configuração. Exemplo: Envio Financeiro; Envio Compras....;\nc. Cadastro dos programas que irão usar essa configuração;\nd. Dados de servidor e login do e-mail enviador;\ne. Opção de Cópia para remetente;\nf. Assunto;\ng. Corpo do e-mail;\nh. Rodapé: texto padrão e concatenar no final e-mail do remetente com hiperlink para eventual possível\nretorno por este e-mail por parte de quem recebe-lo.\n\n2- Criar re"], "698-25": ["Usuários (ADMI1) — Rutina de la aprobación y envió de las Ordenes de compras Buenas tardes", "Rotina de Envio de Email, para Pedido de Compras (nova rotina).pdf", "De: Roberto Schumacher [mailto:roberto@kunden.com.br]\nEnviada em: terça-feira, 21 de julho de 2020 17:46\nPara: Davenir Lisandro Hennemann; Jordan Castro; Lina Rodriguez\nCc: Marcio Reni Schneider (Kunden Systems)\nAssunto: Rutina de la aprobación y envió de las Ordenes de compras Buenas tardes.\nAdjunto un paso a paso de la rutina de liberación y envió por correo de las ordenes de compra.\n-Miren que, la rutina ya tiene la funcionalidad de mostrar al final de la orden de compra (pantalla abajo), junto al\nespacio de firmas, queda registrado el usuario/responsable de la liberación, que en este caso pasa a traer, donde\ndice “Kunden”, la Coordinadora de Compras o el Sr. Leonardo Mora, que serán los "], "698-29": ["ADMI264 — Estou na AB, e estou tentando fazer funcionar o envio de email a partir do sistema, dos…", "Rotina de Envio de Email, para Pedido de Compras (nova rotina).pdf", "De: Marcio Schneider [mailto:marcio@kunden.com.br]\nEnviada em: quinta-feira, 9 de setembro de 2021 09:58\nPara: 'Thiago Schoene | Kunden Systems'\nAssunto: Estou na AB, e estou tentando fazer funcionar o envio de email a partir do sistema, dos Pedidos de Compra.\n\nEstou na AB, e estou tentando fazer funcionar o envio de email a partir do sistema, dos Pedidos de Compra (usuários\nda AB utilizam Gmail como ferramenta de email)...\n\nOlhei meu passo a passo e fiz as configurações que entendo serem necessárias, na BD da AB...   \nAí, solicitei que tal Usuario (cadastrado acima) fizesse um pedido de compras de teste, diretamente na sua maquina\n(que tem o endereço de email que está nos cadastros acima).."], "699-0": ["Plano de Produção (MPSP14) — forecast só funciona, utilizar em duramas, criado para aniger", "Rotina de Forecast.pdf", "Rotina de Forecast..\n\nAvaliado em 012024, para a visita na Duramas em jan/24:\n-falar do forecast. Posição posterior: não será possível utilizar em Duramas, porque o Forecast só funciona no\nMPSP14 (e não no MPSP5), e no MPSP14 só funciona produtos com controle de Fluxo (criado para Aniger)."], "701-1": ["Remessa Industrialização (ESTO25) — na GS eu queria poder usar a rotina de Terceirização com a opção que tem na Categoria,…", "Categoria.pdf", "De: Roberto Schumacher [mailto:roberto@kunden.com.br]\nEnviada em: terça-feira, 30 de julho de 2019 08:17 Para: Marcio Schneider\nAssunto: Re: na GS eu queria poder usar a rotina de Terceirização com a opção que tem na Categoria, que \"Permite\nRemessas de OFs Produzidas\" Bom dia.\nSegue anexo o teste que fizemos juntos, onde funciona apenas no TERC10 mas não no ESTO25:    "], "702-0": ["Transferência entre Localização (ESTO23) — rui na multi-seleção, mat remessa industrialização, gravado o atelier", "Controle de Remessa dos materiais que são enviados de maneira excedente.pdf", "Avaliação/implantação feita na Oksebra em 280920, em retreinamento para os usuários..\n\nControle de Remessa dos materiais que são enviados de maneira excedente:\nFazer transferência de Localização 1 para 5 = das qtdes que realmente serão enviados ao atelier.\n\nEstoque fica na Localização na Localização 5:  \nFazer o consumo real na Localização 5\n\nUsar esta opção de “Agrupamento” para mostrar saldos em tela da Localização desejada: \n\nEstoque reduziu da Localização 5:\n\nZzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz  \nPara a questão de NF:\n1º fazer “Remessa” no programa “Plano Abast Mat - Remessa Industrialização - NÃO GERA NF - Baixa na Remessa”\nPara os materiais que terão efetuado o consumo d"], "703-4": ["Cotação (COMP14) — Visto em 180923 na implantação da Aniger", "Cotações Terceirizados  - COMP14.pdf", "Visto em 180923 na implantação da Aniger:  \nNa Categoria de Pedido de Compra, para a Categoria TERCEIRIZAÇÃO utilizado na rotina de Terceirização, o campo\n“Exigir Cotação de Preços” precisa ficar desmarcado cfe acima...\n\nMotivo:\n\n-se configurar para “Exigir Cotação de Preços”, quando for necessário alterar algo no Pedido de Tercerização, sempre\nvai gerar a mensagem abaixo...mensagem “KND-000359...”\n\n...mesmo que tenha aqui a respectiva Cotação do modulo de Terceirização... "], "704-0": ["Emissão de Extrato (TERC8) — TERC9 - CRIAR NOVO AGRUPAMENTO E TOTALIZAÇÃO POR PRODUTO Rotina", "Emissão de Extrato – TERC8.pdf", "Emissão de Extrato – TERC8..\n\nPedido Serviço: 32686 Cliente: Lutheuz Solicitação:\nTERC9 - CRIAR NOVO AGRUPAMENTO E TOTALIZAÇÃO POR PRODUTO Rotina:\n\nManufatura Terceirizados Relatórios Emissão de Extrato Alteração:\n\n1. Criar novo agrupamento e totalização por produto.\n\nDocumentação:\nManufatura Terceirizados Relatórios Emissão de Extrato Detalhamento:\nCriado novo agrupamento e totalização por produto."], "705-0": ["Exclusão Retorno (TERC5) — retorno de terceirização, avaliação das rotinas, ocorreu o apontamento", "Exclusão Retorno – TERC5.pdf", "Exclusão Retorno – TERC5..\n\nTestado em 012025 por Alexis, numa avaliação das rotinas para evoluções para VPS e identificado que o\nTERC5, em relação ao “Excluir Retorno” ...\n\n-Pelos testes de Alexis, a rotina também exclui, além do retorno de Terceirização, exclui também o respectivo\nApontamento de Produção, na seguinte condição:\n-Quando o apontamento de Produção ocorreu pela rotina dos programas RECE7 e TERC2 tendo o parâmetro\nde inicialização APONTAR_PRODUCAO = S...\n-E, quando o apontamento ocorreu manualmente (e não no momento do Retorno de Terceirização)\nnestes casos no TERC5 NÃO exclui o respectivo Apontamento de Produção = do processo vinculado ao Serviço* .\n\n*pessoal eu não comprovei e"], "716-12": ["ADMI125 — conserto, setor de custos, porque o preço", "Rotina de Terceirização.pdf", "Sobre Amostras e Consertos,\n\nVisto com João em 13/07/2011, das tratativas que utilizam no HK:\nNa BD HK: informam sempre OF? Posição: sim\nPorque nos consertos permite informar valor e qtde? Posição: qtde porque a qtde de consertos pode ser menor que\na OF. Valor porque o setor de Custos calcula um valor para o conserto, e estes passam para o usuário da Remessa,\nque informa manualmente o valor na Remessa (não abrem uma tarifa específica para este conserto, pois os valores variam muito).\nE nas Amostras permite informar qtde? Posição: sim, porque às vezes há diferenças nas qtdes da OF em relação ao\nque é enviado efetivamente.\nSolução: criar um produto Amostra, um PP/OF fictício apenas para fazer "], "716-20": ["Remessa (TERC1) — RETORNO DE TERCEIRIZAÇÃO: RETORNOS DE SERVIÇOS PODEM SER POR TALÃO", "Rotina de Terceirização.pdf", "Pedido Serviço: 10178 Solicitação:\nRETORNO DE TERCEIRIZAÇÃO: RETORNOS DE SERVIÇOS PODEM SER POR TALÃO.\n\nTratar as rotinas para que as rotinas de retorno possam ser efetuadas por talão.\nPrograma de Retorno de Terceirização e programa Retorno de Remessa de Industrialização.\n\nDocumentação:\nPOSIÇÃO REMESSA/RETORNO (TERC3) EXCLUSÃO REMESSA (TERC4) EXCLUSÃO RETORNO (TERC5) REMESSA (TERC1) RETORNO (TERC2)\n\nTodos os programas receberam o filtro de lote e, sempre que possível, será visualizada a informação do lote."], "716-34": ["Consulta Ordem de Fabricação (CFAB2) — programa de Remessa de Terceirização, já trazer automaticamente os dados", "Rotina de Terceirização.pdf", "De: Isabel (Oksebra) [mailto:isabel@oksebra.com.br]\nEnviada em: segunda-feira, 26 de outubro de 2020 13:34\nPara: Marcio Schneider; Recepcao (Oksebra)\nAssunto: programa de Remessa de Terceirização, já trazer automaticamente os dados\n\nEstamos com a seguinte dúvida:\n\nA entrada do retorno das nf do atelier já devem ser apontadas pelo lançamento da nf o processo da costura externa (processo 2).\nCadastramos hoje pela manhã para que a emissão das notas fiscais já aponte o setor da costura interna (processo 7).\nPorém, a Cintia não estava conseguindo\nSalvar o lançamento desta nf 7921, acusava que o setor 7 já estava baixado. Excluímos o apontamento do proc 7 e\nsalvamos a nf, mas o setor processo 2\nNã"], "716-35": ["Notas Fiscais de Entrada (FATU3) — programa de Remessa de Terceirização, já trazer automaticamente os dados Bom dia", "Rotina de Terceirização.pdf", "De: Marcio Schneider [mailto:marcio@kunden.com.br]\nEnviada em: terça-feira, 27 de outubro de 2020 06:52\nPara: 'Isabel (Oksebra)'; 'Recepcao (Oksebra)'\nAssunto: RES: programa de Remessa de Terceirização, já trazer automaticamente os dados Bom dia\n\n-já identifiquei o motivo da rotina estar tentando apontar o processo 7 e não ter apontado o processo 2 (isso quando\nestão fazendo o Retorno da Terceirização no programa RECE7-Retorno de Remessa Terceirização)\nÉ porque estas 2 OFs, que saíram com a NF 26512, tiveram o Processo 7 vinculado na Remessa (deveria ter ocorrido\no vinculo do processo 2). Dá para ver pela tela abaixo (mas o certo teria sido o processo 2, porque o serviço 6002\ntem sim vincula"], "716-45": ["Notas Fiscais de Entrada (FATU3) — glaucia, verificar o procedimento, tentando realizar dois", "Rotina de Terceirização.pdf", "Depois de confirmar esta NF de entrada, terão que fazer o consumo/baixa manualmente destes materiais da\noperação 902.5, isso ocorre pois deixarão de usar a operação 902.2 e a rotina não vai fazer o consumo.  Zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz\n\nSituação semelhante ocorrida em 062026, e apoiado no RA 260619012 da Planet...\n\nhttps://kundencloud.com.br:3825/atendimento?id=260619012&callType=customer Glaucia.Planet 19/06/2026 - 17:01:32 Boa tarde\nEstou tentando realizar dois lançamentos, porém somente hoje consegui receber a nf.\nFaço o processo conforme o de costume ai aparece essa mensagem KND-004363  consegue me ajudar?\n\nRenan.Sup 19/06/2026 - 17:22:00\nBoa tarde, Glaucia. Tudo bem?\nO erro"], "716-46": ["Notas Fiscais de Entrada (FATU3) — obra manualmente, exemplo precisa, saldo de mão", "Rotina de Terceirização.pdf", "Roberto.Cons 12/09/2025 - 16:58:22 Boa tarde.\nVou mostrar o passo a passo para uma das NFs, tentem fazer para as demais.\nFiltrado a NF que será retornada:  \nMarcado os itens de retorno\n\nMarco aqui apenas as OFs que foram produzidas no mês de recebimento da NF (no exemplo setembro) \nNa próxima linha, precisamos fazer um pouco diferente do que eu comentei anteriormente. Precisa informar a\noperação de mão de obra que não apropria custo, para isso, criei uma cópia da atual e apenas desmarquei a opção de apropriação.\n\nNeste caso agora, desmarca todas as OFs.  \nComo desmarcou as OFs, será necessário informar o saldo de mão de obra manualmente.\n\nE agora clicado em confirmar, e é gerada a NF\nNeste e"], "717-0": ["CFAB11 — produção dos planos, operação de mão, sistema gerará", "Rotina de Terceirização_Instrução Estofados.pdf", "Rotina de Terceirização..\n1= efetuar cotação de preços do serviço\n\n2= No envio dos materiais ao terceirizado: Utilizar pelo programa “Plano Abastecimento Materiais Remessa Industrialização”\nInformar Plano de Produção e Recurso Base, onde na seleção identificarão os diversos terceirizados (Santiago, Nabil, etc).\nDetalhe: a partir da rotina de Planejamento é que será estabelecido qual terceirizado fará a produção dos Planos e OFs.\n\nSeguindo no programa “Plano Abastecimento Materiais Remessa Industrialização”:\nVai mostrar os materiais necessários para a produção dos Planos/OFs selecionados.\nInformar as quantidades que serão enviadas, e no botão “Remessa Industrialização” vai abrir a tela para i"], "719-1": ["Consulta Ordem de Fabricação (CFAB2) — retorno de maquila, posible configurar, reporte", "Rotina de Terceirização_Instrução Piagui 040619.pdf", "Desde la generación de la remesa, ya es posible acompañar datos de saldos y cantidades de maquilas en esta consulta y reporte…  \nAsí como en este reporte:\n\nY es posible configurar para que el avance para este proceso sea realizado automáticamente por el Retorno de Maquila: "], "720-2": ["Consulta Ordem de Fabricação (CFAB2) — Retorno: quando o atelier devolve o serviço feito", "Rotina de Terceirização_Treinamento interno 280119.pdf", "\n\nRetorno: quando o atelier devolve o serviço feito:\n\nXxxxxxxxxxxxxxxxxxxxxxx  \nProgramas mostram que está concluído a terceirização:  "], "720-3": ["Remessa Industrialização (ESTO25) — Maneiras alternativas de fazer o procedimento de Terceirização", "Rotina de Terceirização_Treinamento interno 280119.pdf", "Maneiras alternativas de fazer o procedimento de Terceirização:\n\nNa Remessa: fazer pelo programa ESTO25 – Plano Abastecimento\n\nfazer o procedimento de Terceirização:\n\nNa Remessa: fazer pelo programa ESTO25 – Plano Abastecimento Materiais Remessa Industrialização:\n\nInformando as OFs... \n\nSeparando o material que tem que ser enviado ao atelier...e ao clicar no botão “Remessa Industrialização” o sistema\ngera automaticamente: a remessa, o pedido de serviço, a NFS.\n\nE no retorno:   \nSistema vai gerar a NF de Entrada, vai automaticamente efetuar o registro do retorno de terceirização, o registro no\nPedido de compra, e apontamento se estiver configurado para fazer apontamento (parâmetro de iniciali"], "722-2": ["Agendador de Tarefas (ADMI63) — Preciso atualizar os custos standards da Estofados Bom dia Marcio", "Agendador de Tarefas.pdf", "De: Juares Barbieri (Kunden Systems)\nEnviada em: sexta-feira, 4 de janeiro de 2013 08:53\nPara: Marcio Reni Schneider (Kunden Systems)\nAssunto: RES: Preciso atualizar os custos standards da Estofados Bom dia Marcio\n\né uma rotina que desde 15/01/2009, portanto não sei dizer se funciona ou não, rodei na nossa base a princípio\nexecutou o cálculo. Segue um script que chama a rotina.\nApós o script executar o COMMIT;\n\nSQL> BEGIN ATUALIZA_CUSTO_STANDARD_P;\nEND;\n\nZzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz\n\nDetalhe: ao executar o script, gerou o erro:\n\nSQL> BEGIN ATUALIZA_CUSTO_STANDARD_P;\nEND;\nBEGIN\nERROR at line 1:\nORA-20000: Erro ATUALIZA_CUSTO_STANDARD_P: ORA-20000: Erro GERA_CUSTO_TRANSACI"], "722-14": ["and not exists, venda entrega, pve", "Agendador de Tarefas.pdf", "SELECT DISTINCT P.PEDIDO FROM TRANS_ESTOQUE_ATM T, PEDIDO_VENDA_ATM P, PEDIDO_VENDA_ITEM_ATM I, PEDIDO_VENDA_ENTREGA_ATM E, ROTULO_ATM R\nWHERE R.PEDIDO_VENDA_ENTREGA_ID IN (SELECT DISTINCT PVE.ID FROM CATEGORIA_PEDIDO_ENTREGA_ATM CPE, PEDIDO_VENDA_ENTREGA_ATM PVE, PRODUTO_MATERIAL_ATM PM, PRODUTO_ATM PR, PEDIDO_VENDA_ITEM_ATM PVI, PEDIDO_VENDA_ATM PV\nWHERE PV.SITUACAO = 'C' \nAND PV.ORGANIZACAO_CODIGO = 1\nAND PV.EMPRESA_CODIGO = 2\nAND PV.UNI_NEGOCIO_CODIGO = 1\nAND PVI.PEDIDO_VENDA_ID = PV.ID\nAND PVI.PRODUTO_ID IS NOT NULL\nAND PM.PRODUTO_ID(+) = PVI.PRODUTO_ID\nAND PR.ID(+) = PM.MATERIAL_ID\nAND PVE.PEDIDO_VENDA_ITEM_ID = PVI.ID\nAND PVE.SITUACAO = ('ATIVA')\nAND PVE.DATA_ENTREGA BETWEEN TO_DATE('"], "722-47": ["Agendador de Tarefas (ADMI63) — ESTRUTURAÇÃO DE PRODUTO - EPRO15 / Agendador de Tarefas: GERAÇÃO MRP COMPRA PEDIDOS EM…", "Agendador de Tarefas.pdf", "Pedido Serviço: 44183 Cliente: TEA Solicitação:\nESTRUTURAÇÃO DE PRODUTO - EPRO15 / Agendador de Tarefas: GERAÇÃO MRP COMPRA PEDIDOS EM CARTEIRA Rotina:\n\nManufatura\nEngenharia e Desenvolvimento de Produto Engenharia\nEstruturação de Produto - EPRO15\n\nAgendador de Tarefas: GERAÇÃO MRP COMPRA PEDIDOS EM CARTEIRA Alteração:\n\nVerificar o motivo do log que aparece no agendador de tarefas.\nROTINA do Agendador de Tarefas: GERAÇÃO MRP COMPRA PEDIDOS EM CARTEIRA\n\nMensagem: “KND-000201...Não existe coeficiente na Variação de Consumo...” Documentação:\nManufatura\nEngenharia e Desenvolvimento de Produto Engenharia\nEstruturação de Produto - EPRO15 Detalhamento:\nNada foi feito.\n\nObservação:\nFoi necessário re"], "730-18": ["ADMI35 — NECESSÁRIO A CRIAÇÃO DE NOVO PROGRAMA PARA CADASTRO DE SERVIÇO DE INSPEÇÃO, ASSIM COMO…", "Clientes - ADMI35.pdf", "Pedido Serviço: 59839 Cliente: Frigolaste Solicitação:\nNECESSÁRIO A CRIAÇÃO DE NOVO PROGRAMA PARA CADASTRO DE SERVIÇO DE INSPEÇÃO, ASSIM COMO FILTRO\nPARA O MESMO NO ADMI80 E ADMI35.\n\nRotina:\n\nAdministração Cadastros Clientes Alteração:\n\nNecessário a criação de novo programa para cadastro de serviço de inspeção, assim como filtro para o mesmo no ADMI80 e ADMI35.\n\nDocumentação:\nAdministração Cadastros Serviço Inspeção Detalhamento:\nCriado o programa \"Serviço Inspeção\" para a criação de Servicos de Inspeção para clientes.\n\nAdministração Relatórios\nResumo Cadastro de Pessoas Detalhamento:\nNo programa de \"Resumo Cadastro de Clientes\", adicionado o campo de \"Serviço Inspeção\" para filtrar por clie"], "730-22": ["ADMI35 — ESTRUTURAÇÃO DE PRODUTO (EPRO15) - TER POSSIBILIDADE DE INFORMAR MAIS DE UM CÓD. DE…", "Clientes - ADMI35.pdf", "Pedido Serviço: 59706 Cliente: Aniger Solicitação:\nESTRUTURAÇÃO DE PRODUTO (EPRO15) - TER POSSIBILIDADE DE INFORMAR MAIS DE UM CÓD. DE BARRAS NA\nGRADE DO MESMO PRODUTO.\n\nRotina:\n\nManufatura\nEngenharia e Desenvolvimento de Produto Engenharia Estruturação de Produto Alteração:\n\nTer possibilidade de informar mais de um cód. de barras na grade do mesmo produto.\nDefinir qual cód. usar no cliente.\nDemanda criação de cadastro: \"Grupo cód. barras\".\n\nDocumentação:\n\nParâmetro Geral:\n50251 | HABILITA O CONTROLE DE GRUPO DE CÓDIGO DE BARRAS | DEFINE SE O SISTEMA HABILITARÁ O\nCONTROLE DE GRUPOS DE CÓDIGOS DE BARRAS NO CADASTRO DO CLIENTE E NA ENGENHARIA DO PRODUTO.\nATRIBUTOS POSSÍVEIS SÃO S (IRÁ HABILITA"], "730-23": ["ADMI35 — LIBERAÇÃO PEDIDOS VENDA FATURAMENTO - IDENTIFICAR MOTIVO DE ESTAR SENDO LEVADO DESCONTO", "Clientes - ADMI35.pdf", "Pedido Serviço: 69283 Cliente: Atta Solicitação:\nLIBERAÇÃO PEDIDOS VENDA FATURAMENTO - IDENTIFICAR MOTIVO DE ESTAR SENDO LEVADO DESCONTO\nNEGATIVO PARA A NF Rotina:\n\nVendas e Distribuição Faturamento Notas Fiscais\nLiberação Pedidos Venda Faturamento Alteração:\n\n- Identificar motivo/configuração de estar levando desconto negativo para a NF.\n\n1=Pedido de venda vem do B2B e possui ajuste de preço: \n2.1. Gerada a NF está levando o valor unitário de 39,1116, quando o correto seria 40,10. E também leva o desconto\nnegativo, quando não deve haver desconto nos itens:  \nConfigurações que foram revisadas:\n3.1. Parâmetro geral 269 (DESCONTO UTILIZADO - DEFINE O TIPO DE DESCONTO UTILIZADO PELO CLIENTE:\nG="], "753-9": ["Ocorrências (CPAG3) — Na geração do PDF que deverá ser anexado no email", "Ocorrências – CPAG3.pdf", "-Na geração do PDF que deverá ser anexado no email:\n-utilizar a mesma versão da impressão do Pedido de Venda, no caso, o programa PEDI5, e incluir mais esta\nfuncionalidade de imprimir as Ocorrências “Ativas” vinculadas aos Itens do Pedido de Venda (podem haver mais de 1\nocorrência “Ativa” ao mesmo Item de Pedido de Venda, e neste caso, caso imprimir todas, na mesma sequencia que\nsão listadas na tela de Ocorrências do Item de Pedido de Venda).\n-Imprimir após a impressão dos dados do Item (Produto, qtde e valores), dos Detalhes Técnicos e das Informações Complementares do Item.\n\nzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz\n\n3º: No programa “Posição de Pedidos Detalhado (PEDI118)"], "757-38": ["Pessoas Físicas/Jurídicas (ADMI34) — usuario ivendre atm, and pes, pessoa grupo", "Pessoas Fisicas_Juridicas - ADMI34.pdf", "Avaliação entre 122024 e 012025 na implantação Grafdil, questão do cadastro da Pessoa, no caso a Pessoa “Principal”\nde um “Grupo” (o “dono” de uma Franquia, por exemplo, ou a Pessoa “Matriz” de uma rede de Lojas)...\n\nNo cadastro desta Pessoa “Principal”, orientei para fazer assim: sem vincular a ela o seu mesmo código de Pessoa no campo “Grupo”...\n\nA orientação é com base nos testes de validação do pedido serviço 66323 (66323_Val_201124)...está assim esta\nparte nesta validação citada: \n\n“Novo teste neste dia: aqui a configuração no cadastro da Pessoa, que é o Cliente definido como “Grupo”, e que\ntambém é o cliente a ser utilizado no B2B como pode ser visto na tela ao fundo...\n\n...aqui acessa"], "757-39": ["Pessoas Físicas/Jurídicas (ADMI34) — vinculado ao usuário, pessoa grupo, cadastro do usuario", "Pessoas Fisicas_Juridicas - ADMI34.pdf", "Identificado que ocorre o mesmo que no teste acima (mas estranho que na Pegada não está gerando o erro relatado\nno anexo encaminhado no Pedido de Serviço, do erro inicial na Grafdil):\n\nVeja aqui um “CLIENTE” = sendo um GRUPO, tendo vinculado também o mesmo conteúdo no campo GRUPO...\n\n...ao fazer um Pedido nop B2B da BD Teste Pegada... \n\nVeja que aqui de igual maneira, como no teste da validação Grafdil acima, também abre os CLIENTES vinculados a este GRUPO...\n\n...DANDO O ok acima, passa a mostrar o CLIENTE = a Pessoa = Grupo, conforme o cadastro do Usuario...até aqui\nparece que está OK assim...\n\nEntão, a partir do teste acima na Pegada, que parece estar OK, vou continuar o teste na Grafdil, "], "757-42": ["Pessoas Físicas/Jurídicas (ADMI34) — GRUPO: AJUSTE NO CONCEITO DE GRUPO NO SISTEMA", "Pessoas Fisicas_Juridicas - ADMI34.pdf", "Pedido Serviço: 13407 Cliente: Pegada Solicitação:\nGRUPO: AJUSTE NO CONCEITO DE GRUPO NO SISTEMA\n\nAlterar a logica das listas de Grupo Cliente para que grupo seja qualquer pessoa fisica/juridica que tenha outra\npessoa vinculada. (forma orignal que o sistema tratava)\nHoje é grupo quem está vinculado a si mesmo (alterado para atender a necessidade do cliente na epoca, mas agora\nisso mundou em função de mais um nivel: Grupo do Grupo para as Redes de Loja. \nAlguns programas a serem revisados:\n- VEND93 - VEND94 - VEND96 - VEND97 - VEND98\n\nPrograma com a lista Grupo Cliente correta:\n- VEND35 Documentação:\nAlterada listas de grupos para apresentar qualquer pessoa que tenha alguma pessoa subordinada"], "766-0": ["Aplicação_Restrição (PREC22) — EFICIENCIA: NÃO CONSIDERAR AS \"RESTRIÇÕES\" NO CALCULO DA EFICIENCIA E PRODUTIVIDADE", "Aplicação_Restrição – PREC22.pdf", "Aplicação_Restrição – PREC22..\n\nPedido Serviço: 10427 Solicitação:\nEFICIENCIA: NÃO CONSIDERAR AS \"RESTRIÇÕES\" NO CALCULO DA EFICIENCIA E PRODUTIVIDADE\n\nEXEMPLO ANEXO NO SUPORTE.\n\nDocumentação:\nCadastro Aplicação / Restrição\n- Novo campo para indicar se o evento vai ser considerado no cálculo da eficiência Eficiência\n- Regra para utilizar as aplicações / restrições no cálculo da eficiência somente quando estiver definido com valor\n\"Sim\" no campo de Eficiência do cadastro.\n\n- Novo parâmetro de inicilização DIAS_EXIBIR_EFICIENCIA que vai permitir definir o tempo retroativo em dias que\ndeve exibir a eficiência. Antes da alteração sempre considerar 20 dias oque voi mantido como padrão mas com opç"], "770-3": ["Configuração Recurso Base Planejamento (PREC8) — dois recursos, roberto schumacher, visualizados em alguns", "Configuração Recurso Base Planejamento - PREC8.pdf", "x\n\nSituação vista na Aniger em 210223:\n\nUtilizei este select para identificar os Recursos Base Planejamento do cadastro do PERC8, que tem vinculado mais de\n1 vez o mesmo Processo...\n\nSELECT RECURSO_BASE_ID, PROCESSO_ID, COUNT (PROCESSO_ID) FROM CONFIG_RECURSO_BASE_ATM\nWHERE PROCESSO_ID > 0\nHAVING COUNT (PROCESSO_ID) > 1 GROUP BY RECURSO_BASE_ID,PROCESSO_ID;\n\nSELECT * FROM RECURSO_ATM WHERE ID IN (609, 611);\n\nTendo mais de 1 vez o mesmo código de Processo, gera duplicação de dados visualizados em alguns\nprogramas/consultas, como o abaixo...(revisado por Roberto, abaixo):\n\n[17/02 10:31] Roberto Schumacher | Kunden Systems\nTem relação com o planejamento... vi que está carregando dois recursos d"], "771-6": ["Meta/Eficiência Prevista por Recurso (PREC33) — meta eficiência prevista, data de vigência, planejamento capacidade", "Configurador de Meta_Eficiência Prevista por Recurso – PREC33.pdf", "Pedido Serviço: 61511 Cliente: Pegada Solicitação:\n\nRotina:\n\nManufatura\nPlanejamento Capacidade de Recursos (CRP) Cadastros\nConfigurador de Meta/Eficiência Prevista por Recurso Alteração:\nAo consultar um recurso no programa PREC33, o mesmo apresenta erro “KND-004340” de ¿Data de vigência inicial é\nmaior que a data de vigência final para o recurso 294¿.\n\nDocumentação:\n\nManufatura \nPlanejamento Capacidade de Recursos (CRP) Cadastros\nConfigurador de Meta/Eficiência Prevista por Recurso Detalhamento:\nAjustado.\n\nObservações:\nÉ possível ver as datas de vigência do recurso com erro lores, visto acima, ADMI102.\n\nCTe: XML da NF de cobrança da transportadora...\nO CTe (Conhecimento de Transporte Eletrônico) é o documento fiscal oficial exigido pela SEFAZ. O\nCONEMB"], "799-7": ["ADMI102 — transportadora ou via, tabela de frete, sempre na pessoa", "Fretes_Demo_Instruções Gerais.pdf", "-É feito o “Importar” o CONEMB...\n-Detalhe da Validação abaixo que foi solicitado pela Pegada, para não permitir importar\nCONEMB sem ter feito antes o CTe acima...\n-Se ocorrer o importar do CONEMB sem CTe antes, em algum lugar das tabelas faltará informação...\n-Sendo assim, o “Importar” o CONEMB gera dados já com informações do CTe...  \n-o Importar acima, complementa dados na tabela FRETE_CONHECIMENTO_ATM.\n-E faz gerar os dados no programa “Conhecimento de Frete-ADMI102”, sendo que neste\nprograma podem fazer as comparações de Valores de Frete com base na Tabela de Frete cadastrada.\n-A rotina se incumbe da coluna de “Situação”: Liberado se está dentro das Tolerâncias\nde Valores, e Bloqueado s"], "799-8": ["ADMI101 — ctas a pagar, documento de cobrança, doccob gera", "Fretes_Demo_Instruções Gerais.pdf", "É feito o “Importar” o DOCCOB...\n-Importante configurar os parâmetros de inicialização... \n- O importar do DOCCOB gera o FATU3 (sem Fatura Duplicatas) e um Documento de Cobrança\n(esse direto no Ctas a Pagar, sem vínculo com o FATU3).\n-Sendo assim, o registro no FATU3 é mais para Livros Fiscais*.\n- O importar do DOCCOB gera no módulo de Frete:\n-O vínculo do número da Fatura (Documento de Cobrança do Ctas a Pagar) e que\ntambém é o mesmo número do FATU3 (detalhe: quando são vários conhecimentos, então a rotina\ngera esta numeração de Documento de Cobrança do Ctas a Pagar e do FATU3, com o 1º numero de Conhecimento).  \n-O importar dom DOCCOB passará a gerar o número da FATURA no ADMI102:\nAqui pes"], "800-0": ["PROCEDIMENTO OPERACIONAL EDI DE FRETES", "Procedimento_Operacional_EDI_Fretes_Kunden_ERP_COMPLETO_por Guilherme.pdf", "PROCEDIMENTO OPERACIONAL E e desta tabela: vai gravando o ROTULO_ID, depois de lido a e"], "810-2": ["Consulta Estoque Produto (ESTO7) — Quando a corrugada está cheia...(pedido ainda não encerrado)", "Coletor_Operação Fechamento Corrugada_passo a passo.pdf", "Quando a corrugada está cheia...(pedido ainda não encerrado):\n-clicar no botão “Oper”...escolher Oper 13 de “Finalizar Rotulo”...\n*quando finalizar o rotulo, gera um arquivo e imprime automaticamente na impressora (mesmo situação acima da\nnecessidade dos bat para impressão)\n*se precisar reimprimir rotulo, utilizar operação 16, e segue mesmo processo: gera um arquivo e imprime\nautomaticamente na impressora (mesmo esquema acima dos bat para impressão) \n...e ler o rotulo (após escolher Oper 13 de “Finalizar Rotulo” acima):\n\nCfe citado acima, a rotina já imprime automaticamente mais um novo rotulo final, que mostra descrição e qtdes de\nProdutos (com isso temos 2 rotulos para 1 caixa)...\n\nZzzzzzz"], "810-5": ["ADMI122 — geram relatório pedidos, partindo desta configuração, cadastro de usuarios", "Coletor_Operação Fechamento Corrugada_passo a passo.pdf", "Novo Teste da rotina acima em 102020, na BD Desenv: Este passo a passo está bem completo:\n\nCriado Pedido de Venda e Plano de Produção Gerado as etiquetas:  \nVisualizo aqui as etiquetas:\n\nGeram relatório pedidos para encaixotamento\n\nVisualizo aqui as etiquetas:\n\nGeram relatório pedidos para encaixotamento \nPARTINDO DESTA CONFIGURAÇÃO DE USUARIO...(lembrar que é necessário este usuario estar liberado na opção\nWEB de cadastro de Usuarios)...\n\nACESSO A APLICAÇÃO...  \nSelecionar a operação 9, no botão Oper\n\nCódigo de barras do Relatório Pedidos para Encaixotamento...\n\nCom isso acima, já gerou o rotulo, e vai imprimir automaticamente\n\nLer o ROTULO que mostra acima e foi impresso\n\nLer as etiquetas\n"], "811-0": ["Usuários (ADMI1) — utiliza este cadastro, cod de barras, unidade produto atm", "Coletor_Operação Fechamento Corrugada_Teste Completo.pdf", "Controle do par_
