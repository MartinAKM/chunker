rado no ADMI84: trazer todas as localizações;\n3.2 - Se tiver uma ou várias localizações cadastradas no ADMI84: trazer somente estas localizações com a localização sugerida.\n4 - Não permitir o apontamento de processos de produtos que tenham controle de rótulo no apontamento de OF\ncas"], "817-0": ["Indcadores (CPRO1) — devolución, calidad, venta es posible", "Capacitación_CEP_Adoc.pdf", "Capacitación Modulo CEP (Control Estadístico de Procesos), en 15/06/2016..\nIntegrantes: Equipo de Adoc, Marcio/Kunden.\n\nVista general de los programas del módulo:\n\nPrograma Indicadores:\nCrear los “Indicadores” calidad. Son los grandes grupos, utilizados para filtros en reportes, y son vinculados a los\nEventos. El tipo son “Producción” (para eventos de calidad que ocurren en la planta de producción) y “Devolución”\n(para eventos de calidad que ocurren a través de devoluciones de clientes – facturas de entradas de devoluciones).\nEn campo “Porcentual” es para definir un porcentual de Meta para el Indicador, y es mostrado y comparado con el\nreal en el reporte.\n\nPrograma Eventos:\nCrear los padrone"], "820-1": ["Classificação do Produto (CPRO2) — indicadores no cep, útil em situações, utilizem esta rotina", "Classificação do Produto – CPRO2.pdf", "\nVerificado em testes na implantação da Smart em 052021, referente a coluna “Controle Indicadores no CEP”, que\nestando marcado para a respectiva Classificação, impacta na seguinte situação:\n\nA rotina faz o Apontamento de Produção (gerando o SKU), faz a entrada ao Estoque desta qtde, e na sequencia já faz\numa saída de estoque automaticamente.\nPode ser útil em situações na qual se quer registrar a produção efetuada (mesmo que de um produto com\nproblemas, como Retalhos na Smart), mas não se quer controlar no estoque estas qtdes (é o caso na Smart).\n(imagino que na Brisa também utilizem esta rotina) Exemplo:\n\nAqui configurado o cadastro do programa de Apontamento, com a Classificação 3...\n\nClass"], "822-2": ["Indcadores (CPRO1) — NOTA FISCAL DE SAÍDA - CRIAR UMA TRAVA DE CANCELAMENTO E ESTORNO DE NF QUE EXIJA UMA…", "Devolução de Vendas.pdf", "Exemplo criado em 15062016, por Gabriel, para apresentação para Adoc, BD Desenvolvimento:\n\nFaturamento:  Devolução com evento:\n\nDevolução:\n\nCep:    Relatório cep:\n\nZzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz Pedido Serviço: 60110 Cliente: Frigolaste Solicitação:\nNOTA FISCAL DE SAÍDA - CRIAR UMA TRAVA DE CANCELAMENTO E ESTORNO DE NF QUE EXIJA UMA AUTORIZAÇÃO Rotina:\n\nVendas e Distribuição Faturamento Notas Fiscais\nNota Fiscal de Saída Alteração:\n\nCriar uma trava de cancelamento e estorno de NF que exija uma autorização.\n\nDocumentação:\n\n4503 | Cancelamento necessita de autorização.\n4504 | Estorno necessita de autorização.\n\nVendas e Distribuição Faturamento Notas Fiscais Notas\nNotas Fiscais de Saída Parâm"], "823-0": ["Eventos (CPRO3) — NOTA FISCAL DE SAÍDA - CRIAR UMA TRAVA DE CANCELAMENTO E ESTORNO DE NF QUE EXIJA UMA…", "Eventos – CPRO3.pdf", "Eventos – CPRO3..\n\nPedido Serviço: 60110 Cliente: Frigolaste Solicitação:\nNOTA FISCAL DE SAÍDA - CRIAR UMA TRAVA DE CANCELAMENTO E ESTORNO DE NF QUE EXIJA UMA AUTORIZAÇÃO Rotina:\n\nVendas e Distribuição Faturamento Notas Fiscais\nNota Fiscal de Saída Alteração:\n\nCriar uma trava de cancelamento e estorno de NF que exija uma autorização.\n\nDocumentação:\n\n4503 | Cancelamento necessita de autorização.\n4504 | Estorno necessita de autorização.\n\nVendas e Distribuição Faturamento Notas Fiscais Notas\nNotas Fiscais de Saída Parâmetro Inicialização:\nAUTORIZADO_CANCELAR_ESTORNAR | DEFINE SE É PERMITIDO CANCELAR/ESTORNAR NOTA FISCAL DE SAÍDA.\nEXIGE_EVENTO_CANCELAMENTO_ESTORNO | DEFINE SE EXIGE A INFORMAÇÃO "], "830-2": ["CPRO17 — CLIENTE SOLICITA A GERAÇÃO EM EXCEL DO RELATÓRIO DE DEVOLUÇÕES DE VENDA - CPRO17 +…", "Relatório de Devoluções de Venda - CPRO17.pdf", "Pedido Serviço: 58593 Cliente: Frigolaste Solicitação:\nCLIENTE SOLICITA A GERAÇÃO EM EXCEL DO RELATÓRIO DE DEVOLUÇÕES DE VENDA - CPRO17 + INCLUSÃO DE FILTRO.\n\nRotina:\n\nManufatura\nControle Estatístico de Processos Relatórios\nRelatório de Devoluções de Venda Alteração:\n\n- Cliente solicita a geração em excel do relatório de Devoluções de venda(CPRO17), incluir filtro de nota fiscal e\ntambém ao gerar em PDF e/ou Excel trazer as informações da nota fiscal(número), nome do cliente e totalizador.\n\nDocumentação:\nManufatura\nControle Estatístico de Processos Relatórios\nRelatório de Devoluções de Venda Detalhamento:\nFoi criado o relatório em Excel.\nFoi adicionado a opção de gerar o relatório por Excel "], "833-1": ["Gera NF Ordem Transferência (MIND16) — INTEGRAÇÃO NOTAS FISCAIS COM MANUTENÇÃO INDUSTRIAL", "Gera Nota Fiscal Ordem de Transferência – MIND16.pdf", "Pedido Serviço: 1162 Cliente: HK Solicitação:\nINTEGRAÇÃO NOTAS FISCAIS COM MANUTENÇÃO INDUSTRIAL\nIntegrar emissão e devoluções de equipamentos com manutenção industrial.\nLocalização do equipamento.\n\nAtualmente o processo é todo manual.\n\nDocumentação:\nMáquinas/Acessório\n- foram retirados alguns campos desnecessários.\n\nVínculo Situação/Operação Faturamento Recebimento MIND14\n- programa novo utilizado para criar o vinculo entre a situação da manutenção industrial com operações de\nfaturamento/recebimento, quando for feito os lctos de notas será necessário este vinculo para gerar a localização da máquina.\n\nTransferência Interna MIND11\n- programa utilizado para gerar as transferência interna entre"], "835-1": ["MIND1 — data for, passar a gerar, responsável da empresa", "Manutenção Industrial_tutorial para Brazservice.pdf", "Este processo é automático, e é realizado no sistema no programa abaixo, chamado “Agendador de Tarefas”.\nO usuário não necessita acessar este programa.\nJá está configurado no seu sistema.\nApenas será acessado pelo responsável da empresa, se quiserem fazer alguma manutenção, alguma modificação nos\ncritérios de geração das Ordens de Serviço. Exemplo: passar a gerar num intervalo maior de tempo, ou passar a gerar\npara outra empresa do grupo.\n\nDetalhe:\nNo exemplo abaixo, CATEGORIA_PRODUTO é a categoria de produto vinculado à Manutenção e ao Componente Manutenção.\nCATEGORIA_SERVIÇO é a categoria cadastrada na “Categoria de Pedido Venda”.\n\n(Importante...visto depois em 02052016):\nPara gerar estas "], "836-0": ["Agendador de Tarefas (ADMI63) — gerar a data, manutenção preventiva, agendador de tarefas", "Manutenção Preventiva, teste do cadastro inicial da Manut Preventiva.pdf", "Manutenção Preventiva, teste do cadastro inicial da Manut Preventiva numa maquina..\n-Testes para a implantação na Aniger.\n-Teste abaixo iniciado a ser feito em 020123, e configurado Agendador de Tarefas para gerar em 030123 (no dia\nposterior, e analisar como se comporta a geração de OSs de Manutenção Preventiva (revisado em 030123).\n-Importante para o abaixo, e para o funcionamento da rotina de Manutenção Preventiva:\nAgendador de Tarefas foi configurado para rodar 1 X ao dia (acho que não precisa mais), configurar\npreferencialmente de madrugada, nas 1ªs horas do dia:\n\nPartindo desta maquina e com esta Configuração...\nNeste caso, coloquei como data “Ultima” = 101222, ou seja, uma data no “pas"], "836-1": ["Agendador de Tarefas (ADMI63) — data da proxima, manutenção preventiva, qualquer maneira vou", "Manutenção Preventiva, teste do cadastro inicial da Manut Preventiva.pdf", "Mais abaixo tem outro exemplo de encerramento de OS e detalhes de como passa a gerar as datas (semelhante ao teste desta maquina).\n\nZzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz \nNovo teste: num novo cadastro de maquina, coloquei a data da “Próxima” no dia de amanhã (sem informar data “Ultima”)...  \nAtivei o Agendador: rodou no dia de hoje 020123...\n\nE no momento não gerou nada...(parece ser OK, porque a data da PROXIMA é amanhã 030123)...  \nVer no dia de amanhã 030123, se o Agendador vai gerar a OS de Manutenção Preventiva\n\nPosição em 030123 desta maquina 94949.1: cfe previsto acima, o Agendador sim gerou a OS de Manutenção\nPreventiva...veja abaixo OS 298382...\n...e com isso no relatório MIND7"], "838-2": ["Maquinas/Acessórios (MIND2) — conseguiu, cali, encontrei", "Manutenção Preventiva.pdf", "TESTES efetuados por Cali, em 02/2018, para um RA 171117003 da Krumenauer de 12/2017:\n\nConseguiu gerar OS aqui...  \n...e encontrei posteriormente esta documentação:"], "838-7": ["Maquinas/Acessórios (MIND2) — sobre a questão do Manutenção Preventiva, para usar no Krumenauer (tela abaixo)", "Manutenção Preventiva.pdf", "De: Marcio - Kunden [mailto:marcio@kunden.com.br]\nEnviada em: sexta-feira, 15 de dezembro de 2017 13:01\nPara: Jean Marcel Becker (Kunden Systems) (jean@kunden.com.br)\nAssunto: sobre a questão do Manutenção Preventiva, para usar no Krumenauer (tela abaixo).\n\nOlá, Jean,\nDias atrás, Cali tava as voltas com o protocolo abaixo nos consultando (ao Roberto) sobre a questão do Manutenção\nPreventiva, para usar no Krumenauer (tela abaixo).\n\nO que eu sei:\nOS de manutenção preventiva deixou de funcionar a partir de um momento que se fez uma alteração na\nManutenção, para atender a uma outra questão, a um outro cliente...não me lembro bem para que, ou para qual\ndesenvolvimento...mas era um assunto que na "], "838-8": ["Agendador de Tarefas (ADMI63) — cadastro da maquina, agendador de tarefas, manutenção preventiva", "Manutenção Preventiva.pdf", "Testes da Manutenção Preventiva, feitas em 28/07/21, para possível treinamento de usuários da Frigolaste*:\nfuncionou a geração de OS de Manutenção Preventiva (há apenas uma questão num relatório de Custos de\nManutenção citado mais abaixo)...fluxo efetuado:\n\n-criei novos registros de “Componentes” vinculados à maquina (até porque segundo usuários da Frigolaste, vão\nquerer vincular mais de 1 Plano de Manutenção por maquina, com diferentes intervalos/frequência de\nmanutenção...então segundo eu entendo e como era na V3, usava-se a opção de criar “componentes” abaixo do cadastro da maquina).\nNo teste abaixo, a data do campo “Próxima”, é a data atual deste teste, é a mesma data que vai rodar, hoje"], "838-9": ["MIND1 — próxima manutenção, rotina que fiz, reabrir o sistema", "Manutenção Preventiva.pdf", "...registrar aqui os materiais utilizados...\n(cfe mais abaixo: esta rotina que fiz, gerou a Req Informada, mas sem vinculo com a OS 5665...e fez o consumo do\nestoque). A rotina faz isso quando é feito o “encerramento” da OS...\n...e ao Reabrir da OS: pelos testes feitos em 120821: quando Reabrir, o sistema faz uma “Devolução” da Requisição\nde material...sendo que se encerrar de novo, faz nova Requisição. \n...e por final fazer o Encerramento desta OS aqui...\n(depois de Encerrado a OS, fica possível Reabrir, cfe tela abaixo)...\n\n...também: veja que a partir do programa acima MIND22, gera um relatório por OS...\nDetalhe: acho que está gerando desconfigurado, misturando dados e campos, e não traz "], "838-15": ["Ordens de Serviço (MIND22) — utilizam uma empresa, tecnico em alguma, roberto para frigolaste", "Manutenção Preventiva.pdf", "Situação vista em 020822, numa avaliação junto com Roberto para Frigolaste, que envolve Manutenção Preventiva,\nna qual utilizam uma empresa Terceirizada para fazer esta manutenção preventiva (não equipe interna).\n\nA dúvida da Frigolaste: como fazer chegar nos registros desta maquina, que houve este custo deste terceirizado (e\nque vai cobrar via NF).\n\nO que pensamos e apresentamos:\n\nCriar aqui o “Tecnico” (porque no MIND22 exige um técnico...e não tem como “editar” o valor no MIND22...o\nsistema não deixa gravado o valor informado diretamente no MIND22...\n...depois, vir aqui na OS e informar o Tecnico, em alguma Operação...  \n...depois disso, veja no relatório ficou OK:"], "838-18": ["MIND1 — **Detalhes da Janela Interna (Operacional):**", "Manutenção Preventiva.pdf", "**Detalhes da Janela Interna (Operacional):**\n* **Título da Janela:** \"Manutenção Industrial - Ordens de Serviço - MIND22 [238.3]\".\n* **Estrutura de Navegação nas/Acessórios (MIND2) — serviços de manutenção, executado a tarefa, manutenções corretivas", "Manutenção_Frigorifico.pdf", "Programa “Solicitação de Serviços de Manutenção”: para área de Produção (ou qualquer área) solicitar serviços para\nárea de manutenção, manutenções corretivas, preenchendo a aba “Solicitação”...\n\n...pós preenchido a aba “Solicitação”, permite ao requisitante imprimir a solicitação, ou enviar email à área de\nManutenção (partindo da visualização) com a solicitação anexa ao email.\n\nZzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz   6\n\nPós estar executado a tarefa da Manutenção (corretiva), deverá ser preenchido e encerrado a aba “Ordem Serviço”\ndo programa “Solicitação de Serviços de Manutenção”:"], "843-6": ["Maquinas/Acessórios (MIND2) — Visto em 120924 na implantação Grafdil", "Maquinas e Acessórios – MIND2.pdf", "Visto em 120924 na implantação Grafdil:\nCampo “Ult.Pedido/Freq.Arbitr.”: este numero que é mostrado, é a ultima OS encerrada, encerramento feito a partir\ndo programa MIND22...e entendo que é para demonstrar em base a qual OS foi atualizada a data da Ultima e da Próxima...\n\n...o procedimento para mostrar o Pedido 3458 foi este:\n\nAqui finalizando esta OS...vou clicar no ENCERRAR... \n...aqui mudou de situação...OK: e reconsultando aparece entre os SERVIÇOS ENCERRADOS da arvore...\n\nAqui o relatório: Ok: Encerrado \nCom isso atualizando este Campo “Ult.Pedido/Freq.Arbitr.”: "], "845-5": ["Ordens de Serviço (MIND22) — Ordens de Serviço - MIND22", "Ordens de Serviço – MIND22.pdf", "Ordens de Serviço - MIND22\n\nSituação vista na Frigolaste com usuário Anderson em 091221:\n\nNo programa “Ordens de Serviço – MIND22” estavam aparecendo registros de Ordens de Serviço “estranhas” com\nnumeração de OS bem “maiores” que as OSs de Preventiva (exemplo abaixo OS 15869) e não são exatamente de\nOrdens de Serviço de Manutenções Preventivas...inclusive clicando nelas, não trazia nada de campos à direita na tela\ndo programa em si...apenas que, ao clicar a opção do Relatório, mostrava os dados que são de uma manutenção\nCorretiva, inclusive no Relatório consta, veja abaixo, “Tipo da OS: CORRETIVA”...\n-também citado pelo usuario que não estava conseguindo fazer o encerramento desta OS “Corre"], "845-6": ["Ordens de Serviço (MIND22) — tenham origem, vista na validação, rotina gera automático", "Ordens de Serviço – MIND22.pdf", "Situação vista na validação do pedido de serviço 53003, do Relatório Custo Total Equipamento – MIND30...\n\n...caso necessário revisar isso no futuro: \n\nSobre os “serviço/operação” que mostra nas OSs 32 e 36 abaixo...provável que elas tenham origem...\n\n...tenham origem aqui, do MIND22: que ao que parece, a rotina gera automático um registro no MIND22 a partir do\nMIND27, o que não seria necessário...mas isso é uma questão para um outro pedido de serviço (se for o caso, se algum cliente questionar)."], "845-7": ["Ordens de Serviço (MIND22) — porque no exige, pensamos e apresentamos, utilizam uma empresa", "Ordens de Serviço – MIND22.pdf", " \nSituação vista em 020822, numa avaliação junto com Roberto para Frigolaste, que envolve Manutenção Preventiva,\nna qual utilizam uma empresa Terceirizada para fazer esta manutenção preventiva (não equipe interna).\n\nA dúvida da Frigolaste: como fazer chegar nos registros desta maquina, que houve este custo deste terceirizado (e\nque vai cobrar via NF).\n\nO que pensamos e apresentamos:\n\nCriar aqui o “Tecnico” (porque no MIND22 exige um técnico...e\n\nNF).\n\nO que pensamos e apresentamos:\n\nCriar aqui o “Tecnico” (porque no MIND22 exige um técnico...e não tem como “editar” o valor no MIND22...o\nsistema não deixa gravado o valor informado diretamente no MIND22...\n\n...depois, vir aqui na OS e informar"], "845-9": ["Ordens de Serviço (MIND22) — mostrar este item, aguard, conf", "Ordens de Serviço – MIND22.pdf", "Teste em 291122, na BD Aniger...em relação aos itens da arvore do MIND22...\n...veja tela abaixo, mostrando o item “Aguardando Confirmação”...suspeita que é mostrado devido parâmetro de\ninicialização abaixo, AGUARD_CONF = S... \n...coloquei AGUARD_CONF com N, e a partir deste momento deixou de mostrar este item desnecessário na arvore:"], "846-0": ["Relatório Custo Total Equipamento (MIND30) — visto no protocolo, somente um exemplo, relatório gera corretamente", "Relatório Custo Total por Equipamento – MIND30.pdf", "Relatório Custo Total por Equipamento – MIND30..\n\nSegue um caso visto no protocolo nro 171117003, que envolve a geração do Custo da Manutenção pós ter encerrado\na OS...o custo não estava de acordo com os valores que realmente seriam os corretos...\n...caso atendido por Cali...são suas as telas abaixo:\n\nExemplo de uma solicitação de manutenção...\n\nCaso o técnico levar mais de um dia, deve ser feita uma linha por dia, começando pela hora que o técnico iniciou.\nNo caso abaixo (somente um exemplo), começou no dia 4/01 e foi até dia 6/01.  \nO Relatório gera corretamente....\n\nFazendo do jeito que o krumenauer faz hoje... \nConforme imagem abaixo, ocorre registros negativos, assim mostrando errado as"], "846-1": ["Relatório Custo Total Equipamento (MIND30) — RELATÓRIO CUSTO TOTAL POR EQUIPAMENTO: NÃO ESTÁ GERANDO DADOS, APESAR DE EXISTIR ORDEM DE…", "Relatório Custo Total por Equipamento – MIND30.pdf", "Pedido Serviço: 51737 Cliente: Frigolaste Solicitação:\nRELATÓRIO CUSTO TOTAL POR EQUIPAMENTO: NÃO ESTÁ GERANDO DADOS, APESAR DE EXISTIR ORDEM DE SERVIÇO DE MANUTENÇÃO   Rotina:\n\nManufatura Manutenção Relatórios\nRelatório Custo Total por Equipamento Alteração:\n\nRelatório não está gerando dados, apesar de existir Ordem de Serviço de Manutenção, inclusive encerrada\n(finalizado o processo) com registro de gasto com \"Serviço / Operação\" e também com \"Peças\", que são registrados\nrespectivamente nas abas Atividade e Materiais da Ordem de Serviço Preventiva - MIND22.\n\nDocumentação:\nManufatura Manutenção Relatórios\nRelatório Custo Total por Equipamento Detalhamento:\nNada ramento de Exportação Completo – CEXT85.pdf", "Pedido Serviço: 67484 Cliente: Pegada Solicitação:\nProcesso exportação não exibe todos os itens no faturamento Rotina:\n\nComércio Exterior Exportação Processo\nFaturamento de Exportação Completo Alteração:\nVerificar e corrigir motivo de não exibir todos os produtos no faturamento do processe de exportação.  Documentação:\nComércio Exterior Exportação Processo\nFaturamento de Exportação Completo Detalhamento:\nNada foi feito.\n\nObservação:\nOs produtos que não estão aparecendo, como são controlados por rótulo, é necessário que haja rótulos gerados para\na entrega dos mesmos. Pedido 106996."], "861-18": ["ADMI125 — cext amc, invoice e packing, disponíveis para serem", "Processo Exportação.pdf", "Teste de processo de exportação feito em 160817, com Roberto, para situação da Amcm, Curtume:\n\n1= digitamos 2 pedidos, igual a este:\n\nCadastro do programa estava assim:  \nDetalhe abaixo...informamos o Fator Conversao manualmente abaixo...talvez seja necessário maiores configurações\nno cadastro de programas acima (para trazer automático Fator Conversão, UM = P2...).\nNeste exemplo abaixo, é como se vendêssemos 1000 P2, e a rotina transforma em M2 para produzir. \n\n2= Processo de Exportação: está com estas configurações;\nRelatório Invoice e Packing, normalmente cada cliente tem sua versão.\n\nNeste caso aqui, é respectivamente CEXT81_AMC e CEXT82_AMC_2\n\nCadastramos manualmente todos os Dados Gerai"], "869-1": ["EPRO20 — Fluxo completo envolvendo Rotina Satra/Kunden ERP", "23320_Ped_serv_Satra_ORIGINAL_ + detalhes_Revisão040618.pdf", "Fluxo completo envolvendo Rotina Satra/Kunden ERP:\n\n1= Geração e disponibilização em diretório/caminho pré determinado de arquivo TXT “.in”, disponibilizado para o sistema Satra;\nDados representando as qtdes a serem cortadas.\nSão os dados de Talões a serem cortados (de acordo com definição de determinados componentes), baseados nas\nsuas datas de Planejamento.\nExemplo de arquivo anexo com seu respectivo layout.\nAbaixo, exemplo de 1 linha de dados deste arquivo, que representam uma sequencia de Talões no Kunden ERP:\n45 47865501 Med N 06/11/2017 0000698249-0000698259 7.5 0036 8 0036 8.5 0006 9 0006\n9.5 0006 10 0006 Detalhes:\n-Cada linha de registro deste arquivo, chamam de “Ticket”.\n- necessári"], "872-0": ["Plano Abastecimento Materiais Satra (ESTO137) — abastecimento materiais satra, nro de ticket, lançamento a partir", "Plano Abastecimento Materiais Satra – ESTO137.pdf", "Plano Abastecimento Materiais Satra – ESTO137..\n\nAbaixo exemplos do funcionamento do programa, exemplo de como fazer o registro (exemplo para atender ao protocolo nro 250128026...\n\nDuramas, envolvendo abastecimento pelo programa “Plano Abastecimento Materiais Satra – ESTO137” e\nValidação de Tolerância que é estabelecido no Produto\n\nScripts utilizados para avaliar últimos lançamento efetuados pelo programa “Plano Abastecimento Materiais Satra – ESTO137”\n\nPartindo deste select...e identificado o SATRA_ID...\nSELECT * FROM SATRA_ABASTECIMENTO_ATM;\n\n...com o SATRA_ID visto acima, efetuar o select abaixo para encontrar o nro do Ticket:\nSELECT * FROM SATRA_ATM WHERE ID = 101292;\n\nCom este nro de Ti"], "872-1": ["Plano Abastecimento Materiais Satra (ESTO137) — controle de tolerância, rotina vai gerando, parou nesta mensagem", "Plano Abastecimento Materiais Satra – ESTO137.pdf", "Na sequencia dos testes para usar o Controle de Tolerância, parou nesta mensagem KND-004257, ao clicar no Consumir/Apontar...\n\nZzzzzzzzzzzzzzzzzzz   Nova tentativa...\n\nEstava assim...\n\nAqui uma situação que poderá começar a aparecer na Duramas, mas devido a rotina como está, junto com a\nintegração com a Satra, vai fazer gerar estas situações...  \n...isso porque veja, neste caso para este ticket satra, tem 2 requisições vinculadas...  \n...e aí acho que a rotina está gerando a mensagem KND-004257 pela qtde na requisição acima, que só tem\nqtde 1 consumida (esta qtde de 1, é decorrente de um abastecimento adicional de 1 que fiz anteriormente neste ticket) zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz\n\nA"], "873-21": ["Classificação do Produto (CPRO2) — campos: Perc de Perda/Quebra Padrão, Perc de Perda/Quebra Padrão, Classificação/Qualidade", "Satra_simulação_Instruções gerais.pdf", "- No programa novo de Abastecimento Satra:\n-Ao identificar o produto que está sendo processado: terá que primeiramente ver se o campo “Perc de\nPerda/Quebra Padrão” da estruturação de Produto está preenchido para o respectivo produto.\nNão estando preenchido, o programa Abastecimento Satra deve continuar a efetuar da maneira original/padrão.\nEstando preenchido:\n- no procedimento de efetuar os cálculos de Aproveitamento/coeficiente, utilizar o valor cadastrado no produto,\ncampo “Perc de Perda/Quebra Padrão”, como Coeficiente, e seguir com os demais cálculos a partir deste coeficiente\n(Dotación, Sams) da mesma maneira.\n\nzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz Na BD Desenv:\nTeste, a"], "873-53": ["IN Satra (ADMI151) — Referente cuestión Satra, situación donde está separando la ultima talla en un nuevo…", "Satra_simulação_Instruções gerais.pdf", "De: Marcio Reni Schneider\nEnviada em: terça-feira, 31 de março de 2026 07:35\nPara: Wilfredo Godoy <wilfredo.godoy@duramas.com.sv>\nAssunto: Referente cuestión Satra, situación donde está separando la ultima talla en un nuevo “ticket”…ejemplo pantalla abajo… Buenos días Wilfredo,\nReferente cuestión Satra, situación donde está separando la ultima talla en un nuevo “ticket”…ejemplo pantalla abajo… \n\n…el motivo es de acuerdo usted había dicho:\n[16:58, 27/03/2026] Wilfredo Adoc ADOC: mira en el pedido la talla 13, esta en otra linea\n[16:58, 27/03/2026] Wilfredo Adoc ADOC: podría ser el caso del ticket que se genera aparte\n\nRevisé acá la documentación/solicitudes del desarrollo inicial de la interf"], "875-1": ["Nota Fiscal de Entrada (CEXC1024) — controle de lote, usando usuaario elsalvador, usado na adoc", tos de facturación en el programa CEXC1025 (Nota Fiscal de Saída\nespecífica de El Salvador).   Zzzzzzzzzzzzzzzzzzzzzzzz\n\nMarcio 160326, situação do RA 250922024...\nExtensão do acima referente ao fluxo da Produção até o embarque, aqui envolvendo um"], "878-3": ["Erro pós patch (CEXC1025) — utiliza o apontamento, realizado nas ofs, quantidade liberada insuficiente", "23316_Control de Lote_Flujo de Producción hasta picking para embarque.pdf", "3. Detalhamento das Solicitações\n\nAo utilizar o mesmo pedido da base de produção na base de testes (pedido 15938):\nCriamos um processo para apenas um dos itens. Acessamos o CEXT18:\n\nSelecionamos um item e geramos o embarque:  \nNo CEXT19, o Plano de Embarque foi localizado e, a partir disso, geramos e confirmamos um novo processo de exportação: \nGerando o processo no CEXT21...  \nConfirmando a geração de um novo processo: \nProcesso gerado e confirmado no CEXT23...\n\nEm seguida, realizamos a produção do item. Para localizar as OFs correspondentes, utilizamos um select:  \nAntes do apontamento ser feito, é necessário que a OF esteja congelada no planejamento, para não\nimpedir o apontamento neste e"], "879-3": ["Nota Fiscal de Entrada (CEXC1024) — Consumos: programa nuevo", "Control de Lote, parte1.pdf", "  Consumos: programa nuevo:\n\nPermite consumo directo en este programa…(muestra los lotes involucrados)… \n…generando la requisición vinculando al Lote:\n\nZzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz  \nO, otro formato, es a través de la rutina de generación y emisión de los documentos de requisición, separar el\nmaterial y al final la baja, en esta secuencia de procedimientos: utilizar opción “más tarde” (es un parámetro del\nprograma ya venir la opción “más tarde” por padrón)…\n\n…al confirmar, Kunden ERP genera las requisiciones, y permite que el usuario haga la emisión en este momento, con la pregunta…  \n…Con la Opción “SI”: va abrir el programa ya con la selección de las requisiciones que fueron gene"], "880-3": ["Relatório Posição Estoque (ESTO13) — impresora y emitir, botón de emisión, acá", "Control de Lote, parte2.pdf", "\nPrograma para emisión de la etiqueta pequeña: pieles que vienen de la tenería Adoc, donde no hay un\nprocedimiento de medición, solamente pegar la etiqueta con informaciones del Lote:\n\nAcá, seleccionar las facturas…\n\n…acá, indicar cantidad de etiquetas y emitir.  \n…clic en el botón de emisión, elegir la impresora, y emitir.\n\nxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx\n\nPrograma de Interface con la Medidora:"], "881-5": ["Estruturação de Produto (EPRO15) — relatório posição estoque, estrutura de produtos, transferência entre localização", "Controle de Lote_documentação dos Pedidos de Serviço_e situações.pdf", "Documentação:\nPrograma / Rotina Nova Detalhamento:\n\nPossibilitado cadastro de produtos com controle de lote com ou sem grade no(s) seguinte(s) programa(s):\n\nEPRO15 - Estrutura de Produtos;\nEPRO58 - Estrutura de Produtos - Inventário;\n\nPossibilitado controle de Lote para produtos com grade no(s) seguinte(s) programa(s):\n\nESTO2 - Implantação de Saldo;\nESTO3 - Devoluções;\nESTO4 - Requisição Informada;\nESTO23 - Transferência entre Localização;\n\nAdicionados novos campos para o controle de lote no(s) seguinte(s) programa(s):\n\nESTO2 - Implantação de Saldo;\nESTO7 - Consulta Estoque Produto;\n\nPrevista exibição de lotes com ou sem grade no(s) seguinte(s) relatório(s):\n\nESTO130 - Relatório Lançamentos "], "881-9": ["Encerramento de Ordem de Fabricação (CFAB1) — apontamento de talão, rótulo com base, rótulos novos", "Controle de Lote_documentação dos Pedidos de Serviço_e situações.pdf", "Pedido Serviço: 23316 Solicitação:\n\nROTINA:\n\nPrograma / Rotina Nova ALTERAÇÃO:\n\n- Tratar rotina de Controle de Lote, para produção e faturamento de produtos acabados com grade.\n\nDocumentação:\nManufatura Chão de Fábrica Lançamentos\nApontamento de Talão (CFAB1) Parâmetro(s) Geral(s):\n\nParâmetro(s) Inicialização(s):\nMENU_CLASSE - Indica Se O Apontamento Será De Lote, Ordem De Fabricação Ou Talão.\n\"TALAO\"\nGERA_ROTULO_TALAO - Define Se Gera Rótulo Com Base No Talão.\n\"S\" - Gera Rótulo Com Base No Talão.\n\nMensagem(s):\n\nDetalhamento:\nApontamento do processo que gera produto pronto:\nModificado o programa \"Apontamento de Talão (CFAB1)\" para efetuar o apontamento com controle de Lote de maneira automát"], "881-18": ["Consulta Ordem de Fabricação (CFAB2) — congelada na requisição, produto sem grade, sobras e faltas", "Controle de Lote_documentação dos Pedidos de Serviço_e situações.pdf", "Novo produto...testando agora só “devolução” em todos os números:   Aí faz certo:   zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz\n\nProduto Novo, com Grade, tendo sobras e faltas no mesmo:\n\nSituação original:  \n OK aqui:   OK aqui:\n\nVinculou OF Congelada na requisição: OK\n\nDevolução: OK\n\nTeste com produto sem grade:\n\nSituação original:    Tá OK:  \nVinculou OF Congelada na requisição: OK\n\nzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz\n\nTeste com produto sem grade, só devolução:  \n\nOK, gerou num Lote no a devolução: \n OK aqui:\n\nzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"], "881-30": ["Cópia de Ordem de Fabricação (CFAB59) — encerramento de OFs da Adoc Oi", "Controle de Lote_documentação dos Pedidos de Serviço_e situações.pdf", "De: Marcio - Kunden [mailto:marcio@kunden.com.br]\nEnviada em: quarta-feira, 5 de setembro de 2018 16:21\nPara: Wagner Moellmann (wagner.moellmann@kunden.com.br); Cesar André Wagner (Kunden Systems) (cesar@kunden.com.br)\nAssunto: RES: encerramento de OFs da Adoc Oi\n\nSobre o assunto “Adoc querem fazer o encerramento de OFs” que tínhamos conversado juntos dias atrás, e eu fiquei\nde aprofundar nos testes, vinculando consumos de materiais e tal...\n\nE aí depois o Wagner tentaria ver como poderíamos conduzir isso nas rotinas de Controle de Lote, para que o semi-\nacabado gerado possa ser usado como material numa nova OF, e que num posterior faturamento do produto\nacabado desta OF se possa ter a Compr"], "881-31": ["Encerramento de Ordem de Fabricação (CFAB1) — CRI para Producto Terminado Buenas tardes, [Imagem: CFAB59] [Imagem: EPRO15]", "Controle de Lote_documentação dos Pedidos de Serviço_e situações.pdf", "Los apuntamientos quedaron registrados acá, normalmente como otros apuntamientos, pero para Localización 57: \nEn Duramas, el programa está en este camino:\n\nDemás programas abajo: son los mismos utilizados actualmente en Duramas:\n\nOF quedó “Producida”: \nEn inventario quedó registrado estos apuntamientos: para el mismo producto de la OF, pero en Localizacion diferente:\n\nCostos: de acuerdo materiales abastecidos y mano de obra de los apuntamientos:”   \n...a recomendação acima foi dada como OK, mas não atendia a parte das situações, relatado no email abaixo...\n\n...a partir disso, apresentei esta documentação para esta situação...\n\n...sendo que o conteúdo completo desta recomendação é a seguinte:"], "882-0": ["Medidora (FATU149) — registrou a entrada, demo para apresentar, atender ao controle", "Controle de Medições com Integração com a Medidora – FATU149.pdf", "Controle de Medições com Integração com a Medidora – FATU149..\n\nEste programa foi desenvolvido em 2018, para atender ao controle de Lote para a Duramas.\n\nEm 110924, revisado alguns aspectos deste programa, devido a necessidade de montar uma BD Demo para apresentar para Adoc.\n\nAbaixo dados encontrados quanto a este programa FATU149.\n\nAqui no meu outlook há vários registros referente ao programa:\n\n-Aqui nesta parte da minha documentação, pesquisar por FATU149 para encontrar os arquivos que falam deste programa;\n\n-aqui no Pedido de Serviço 23309, veja que há 3 arquivos falando de “23309_Medicion_... ”:\n\nXxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx \nExemplo do cadastro na Duramas:   Zzzzzzzzzzzzzzzzzzzzzzz"], "883-2": ["CEXT103 — usar as rotinas, trouxe os lotes, picking vai permitir", "Duramas_210818_Treinamento dos Fluxos Duramas.pdf", "Faturamento: usar as rotinas atuais que a Adoc já vem utilizando...\n\nProgramas cfe tela abaixo, 1 a 5:\n\nFaturamento é feito aqui, informando o processo...\n\nPara que permita o faturamento, é necessário a Liberação Pedidos Faturamento...   Zzzzzzzzzzzzzzzzzzzzzzzzzzzzz\n\n...e é necessário o Picking:\n\nA partir deste programa... \n\n...abre a aplicação WEB: informar Funcionário (do cadastro de “Funcionário Simplificado” do RH Kunden)...\n\nEscolher a operação 28 (clicando em cima dele)...\n\n...vai abrir esta tela para informar o Processo de Exportação...\n\n...e na sequencia vai abrir a tela para ir informando os rótulos que se quer vincular neste processo: após ler o ultimo\nrotulo e as qtdes atenderem "], "887-0": ["Pessoas Físicas/Jurídicas (ADMI34) — apontamento de rótulos, xml e arquivo, sei se precisa", "AB_Configurações produção Arezzo.pdf", "AB_Configurações produção Arezzo..\nPesquisado em 101121 para histórico.  \nAB só utiliza a Importação de Pedidos Arezzo, tela abaixo (não importa Rótulos nem Romaneio)...\n\n...com esta configuração:  \nPedido de Venda Importado:\n\nComo citado acima, AB não importa os Rotulos da Arezzo (porque não foi disponibilizado pela Sunset e/ou Arezzo\nesta opção de importar)...desta maneira, o Kunden ERP gera os rótulos pela sua própria rotina (em realidade, não é\nutilizado para nada no Kunden ERP, visto que não é possível fazer o apontamento de rótulo com tais numerações de\nrótulos: não imprimem o rótulo do Kunden ERP: imprimem em gráfica o rotulo disponibilizado pela Arezzo).  \n...geram os Planos e OFs co"], "889-5": ["Programas (ADMI6) — programa “Emissão Etiqueta com Documento Fiscal” está agora gerando as etiquetas na ordem…", "Arezzo_Informações gerais sobre rotinas Arezzo.pdf", "De: Marcio Schneider [mailto:marcio@kunden.com.br]\nEnviada em: quarta-feira, 10 de novembro de 2021 08:02\nPara: 'ab.marcus2021@gmail.com'; 'jonas santos'\nAssunto: programa “Emissão Etiqueta com Documento Fiscal” está agora gerando as etiquetas na ordem dos números de caixas\n\nSó para avisar (talvez já tenham percebido), que o programa “Emissão Etiqueta com Documento Fiscal” está agora\ngerando as etiquetas na ordem dos números de caixas, conforme exemplo tela 1 abaixo.\n\n-Também, assim como já estava previsto na impressão da etiqueta, está sendo impressão o Numero do “Item\nArezzo”, que é o mesmo que está gravado no Pedido de Venda (tela 2 abaixo).  Tela 1:\n\nTela 2:\n\nCadastro necessário para o “"], "889-25": ["Pedido de Venda (PEDI1) — Visto em 07/2019", "Arezzo_Informações gerais sobre rotinas Arezzo.pdf", "Visto em 07/2019:\nRotina de Exclusão de Apontamento de rotulo tem problema quando: \nQuando realizado a tentativa de excluir um apontamento de rotulo, não permitiu mais, porque dava mensagem que\ntinha faturamento feito para esta entrega (há faturamento, porque este rotulo apontado, tem outro rotulo “irmão”\njá apontado e faturado parcialmente da mesma entrega de Pedido de Venda);\n“Mensagem: KND-000689 - Exclusão de apontamento não efetuada, pedido já faturado”.\n\nDeixamos assim de momento, sem encaminhar para o Desenvolvimento avaliar e tratar, por não ter tempo de tratar a situação.\nCaso ocorra no cliente, o que é algo difícil, necessita tratar de uma maneira alternativa/ou via tabelas.\n\nZzzzz"], "889-30": ["Pedido de Venda (PEDI1) — Para esta mensagem...em 220321", "Arezzo_Informações gerais sobre rotinas Arezzo.pdf", "Para esta mensagem...em 220321:\n\n[16:58, 22/03/2021] Sandra Gs Atualizado: Márcio consegue me ajudar?\n[16:58, 22/03/2021] Marcio Schneider: oi\n[16:58, 22/03/2021] Sandra Gs Atualizado: Tá dando esse erro nesse pedido..\n[16:59, 22/03/2021] Sandra Gs Atualizado: A Sheila cadastrou a grade M07\n[16:59, 22/03/2021] Marcio Schneider: é uma grade nova?\n[16:59, 22/03/2021] Sandra Gs Atualizado: Sim\n[17:01, 22/03/2021] Marcio Schneider: muito provavel falta fazer este vinculo, aqui...\n[17:03, 2       <td><div class="bar" title="${Math.round(c.score*100)}%"><i style="width:${Math.round(c.score*100)}%"></i></div>${Math.round(c.score*100)}%</td>
      <td>${c.via.map(z => `<span class="code">${esc(z.x)}</span> <span class="muted">(${Math.round(z.conf*100)}%)</span>`).join('<br>')}
        <details><summary>show evidence</summary>${c.via.map(z => z.ev.map(id => evidence(id, [z.x, c.y])).join('')).join('')}</details></td>
      <td class="num">${v.tog}</td><td class="num">${v.docs}</td><td class="num">${v.conf.toFixed(2)}</td><td class="num">${v.lift.toFixed(1)}</td></tr>`;
  }
  $('#result').innerHTML = html + '</tbody></table></div>';
}

function evidence(id, codes) {
  const c = D.chunks[id]; if (!c) return '';
  let text = esc(c[2]);
  for (const k of codes) text = text.replaceAll(k, `<mark>${k}</mark>`);
  return `<div class="ev"><b>${esc(id)}</b> · ${esc(c[0])}<br><span class="muted">${esc(c[1])}</span><pre>${text}</pre></div>`;
}

function overview() {
  const minDocs = +$('#mindocs').value || 1, minLift = +$('#minlift').value || 1, cross = $('#scope').value === 'cross';
  const top = D.rules.filter(r => r[3] >= minDocs && r[5] >= minLift && (!cross || r[6])).slice(0, 60);
  $('#result').innerHTML = `<h2>Strongest rules</h2><p class="muted">Type a program above to see what to check when it changes. Click a code to use it.</p>
    <div class="wrap"><table><thead><tr><th>If this appears</th><th>then also</th><th class="num">Together</th><th class="num">Docs</th><th class="num">Conf.</th><th class="num">Lift</th></tr></thead><tbody>
    ${top.map(r => `<tr><td><button class="chip" data-add="${r[0]}">${r[0]}</button> <span class="muted">${name(r[0])}</span></td>
      <td><button class="chip${r[6] ? ' cross' : ''}" data-add="${r[1]}">${r[1]}</button> <span class="muted">${name(r[1])}</span></td>
      <td class="num">${r[2]}</td><td class="num">${r[3]}</td><td class="num">${r[4].toFixed(2)}</td><td class="num">${r[5].toFixed(1)}</td></tr>`).join('')}
    </tbody></table></div>`;
}
document.addEventListener('click', e => {
  const a = e.target.dataset && e.target.dataset.add;
  if (a) { $('#items').value = a; recommend(); window.scrollTo(0, 0); }
});
$('#go').onclick = recommend;
$('#items').addEventListener('keydown', e => { if (e.key === 'Enter') recommend(); });
for (const id of ['#mindocs', '#minlift', '#scope']) $(id).addEventListener('change', recommend);
overview();
</script>
</body>
</html>
