nMonitor Notas Fiscais Eletrônica Detalhamento:\nCódigo do Produto "], "467-1": ["Estruturação de Produtos - Inventário (EPRO58) — Controle de Armazenagem por Lote Boa tarde", "Controle de Lote em Materiais_passo a passo para a Brisa.pdf", "E-mail — Assunto: Controle de Armazenagem por Lote Boa tarde\n\nAproveitando, anexo passo a passo do controle de Lote.\n\nAtenciosamente, Marcio Reni Schneider\nPara começar a controlar “por Lote”, tem que configurar no cadastro abaixo, campo Controle de Lote = SIM.\n\nObs.: para materiais que já estão em uso, com movimentação, é necessário que se faça o seguinte procedimento\n(este procedimento precisa ser feito com a movimentação “parada” do material...não podem estar movimentando\nenquanto estiverem fazendo o procedimento abaixo):\n\n1= Emitir um Relatório Livro Inventario, de tal material, para que tenham a mão o valor unitário / custo médio, para\no momento que fizerem a implantação, possam informa"], "469-0": ["Local Armazenagem (EPRO26) — locais de armazenagem, numero do lote, vinculação inclusão inserção", "ROTINA DE CONTROLE DE ARMAZENAGEM POR LOTE _passo a passo para a Brisa.pdf", "ROTINA DE CONTROLE DE ARMAZENAGEM POR LOTE _passo a passo para a Brisa..\n\nCriar o cadastro de Locais de Armazenagem, que representam os lugares físicos do seu depósito.\nExemplo tela abaixo...\nPodem representar uma estrutura de controle de, por exemplo CORREDOR, MÓDULO/PRATELEIRA, NÍVEL, VÃO, que\nrepresentam estruturas padrões de armazenagem em depósitos.\nMas podem ser representados aqui quaisquer outros tipos de Locais de Armazenamento sem ter que ser a estrutura\ncitada acima, tais como Paletes, Setor A, B, C,...,Depósito 1, Depósito 2,...etc...\n\nPara a vinculação/inclusão/inserção dos Lotes em seus devidos Locais de Armazenagem:\n\nÉ pela aplicação web que pode ser utilizado por exemplo num T"], "471-9": ["Programas (ADMI6) — papel release coagulado, mostra as informações, desde o inicio", "Rotinas Brisa.pdf", "Marcio, 010421:\n\nEmissões de OF utilizados pela Brisa (usam a impressão de 2 documentos para a mesma OF...até tem um protocolo\nna qual a Brisa solicitou um estudo para unir no mesmo documento):\n\nEsta versão é mais para ter as especificações técnicas: \nEsta versão é o modelo adotado desde o inicio e vão as informações principais, os semi-acabados,...:  \nObs.: no campo “Papel Release/Coagulado”, mostra as informações de acordo como configurado este campo\n“Imprimir Material Cartão” com “SIM”: "], "471-10": ["Plano Mestre de Produção O.F. Modelo 2 (CEXC50) — Versão de Relatório Consolidada que utilizam: CEXC50, CEXC51, CEXC52", "Rotinas Brisa.pdf", "Versão de Relatório Consolidada que utilizam: CEXC50, CEXC51, CEXC52  \n“Material” que imprime no relatório: idem impressão da OF, detalhes mais acima:\nno campo “Papel Release/Coagulado”, mostra as informações de acordo como configurado este campo “Imprimir\nMaterial Cartão” com “SIM”.\n\nOutro detalhe deste relatório: tem a possibilidade de quebrar o cabeçalho dos Processos, que são diferentes de\nproduto a produto, usando esta opção:  "], "471-13": ["Classificação do Produto (CPRO2) — Avaliação específico do OFF Spec", "Rotinas Brisa.pdf", "Avaliação específico do OFF Spec:\nRastreado uma situação em 270623 com Guilherme Noschang para avaliar virada de utilização de Lotes:\n\nFoi desenvolvido pelo pedido de serviço 8406 = tem detalhes importantes nesta documentação (pode ter mais pedidos de evoluções)\n\nNo Apontamento, olha a Classificação que é informada no Apontamento (programa Revisão)...  \nQuando é diferente de 1ª qualidade:\n\nAí aponta no código da OF, e depois faz uma reclassificação...gerando a saída no produtos da OF...\n\n...E a entrada no produto Off Spec (Produto Off Spec é criado automático pela rotina, e tem o campo\nOFFSPEC_PRODUTO_ID na tabela PRODUTO_ATM que grava e onde é controlado que é OFF SPEC)  \nOs Off Spec se cla"], "472-1": ["Laudos Padrões (CPRO23) — carcaça inteira, partes e cabeça, condenação", "Conceitos de “Parcial” e “Total” para os cadastros de Eventos e Laudos_Diferenças entre os conceitos.pdf", "3-CONDENAÇÃO PARCIAL: na relação com os Indicadores de Eventos citado acima, pode ser tanto para PARTES E\nCABEÇA como para CARCAÇA INTEIRA.\nTambém: pode ser o “Tipo Condena” tanto AC-Aproveitamento Condicional (desde que seja para CARCAÇA INTEIRA)\nou Condena/Graxaria (desde que seja para PARTES E CABEÇA (porque se fosse uma Graxaria de CARCAÇA INTEIRA, aí\njá sería CONDENAÇÃO TOTAL), porque:\nEm resumo:\nÉ 3-CONDENAÇÃO PARCIAL no caso em que o CEP é referente uma CARCAÇA INTEIRA, mas na qual poderá haver o\nAC-Aproveitamento Condicional. Neste caso, o “PARCIAL” refere-se a que a condenação será parcial, porque a\nCarcaça não vai para a Graxaria, e sim terá um aproveitamento não total, mas sim “co"], "473-9": ["Controle de Flexibilidade de Vendas (VEND113) — \"O módulo de \"Saldo Flex\" não está habilitado no Demander.\"", "Controle de Flexibilidade de Vendas - VEND113.pdf", "\"O módulo de \"Saldo Flex\" não está habilitado no Demander.\"\nConfiguração para Zerar saldos pendentes na virada do mês\nAlgumas empresas querem que o saldo flex tenha validade somente dentro do mês em questão, ou seja por\nexemplo, hoje estamos em Abril, então no extrato do saldo flex, não pode aparecer nenhum lançamento\nreferente a pedidos emitidos antes de abril. Para atender a essa situação será criada uma configuração no Demanderweb \"Controle de Saldo Flex mensal\"; • Essa configuração deve vir desmarcada, ao criar nova empresa; • As empresas já cadastradas também devem ficar com essa configuração desmarcada; OBS: O Demander não vai zerar o saldo do vendedor, o que ele vai fazer é desconside"], "474-2": ["Processamento de Leituras (ADMI144) — dois lotes, escolher a operação, clicado em gerar", "Controle Rotativo de Inventario com Lote sem Qtd - Operações Coletor WEB.pdf", "Detalhamento:\nFoi criada uma nova operação para o coletor Web: 31 - \"CONTROLE ROTATIVO DE INVENTARIO C/ LOTE S/ QTD\".\nAs informações dessa nova operação estão disponíveis no programa ADMI145 (\"Operações Coletor WEB\").\n\nCriada validação para não permitir ler o mesmo lote mais de uma vez para operação 31, caso aconteça irá exibir a mensagem KND-004080.\n\nTestado na Letavo em 130721:\nEste cadastro ADMI145 já vem configurado da Kunden, da instalação... \nNecessário efetuar este cadastro de Funcionários no programa RHUM19:\n\nKunden disponibiliza este link de acesso Web/Coletor (existe um serviço desta aplicação que precisa estar rodando)...\n\n...e depois acessar aqui na BD do cliente (no caso abaixo,"], "476-0": ["Emissão de Laudos (CPRO24) — emissão de laudos, detalhes no anexo, criar os seguintes", "Emissão de Laudos - CPRO24.pdf", "Emissão de Laudos - CPRO24..\n\nPedido Serviço: 23523 Solicitação:\nROTINA:\n\nManufatura\nControle Estatístico de Processos (CEP)\nRotina nova para Emissão de Laudos a partir de registros de CEP ALTERAÇÃO:\n\n1= Criar um programa para configurar a estrutura dos laudos (cabeçalho e rodapé) e seus descritivos (podendo ter\ndiferentes padrões de descritivos de laudos);\n- Criar programa semelhante ao programa \"Contratos - ADMI27\" já existente.\n- mostrar em tela o número do ID do registro (o programa Contratos - ADMI27 não mostra este campo).\n- Criar o programa em:\nManufatura\nControle Estatístico de Processos (CEP) Cadastros Laudos Padrões\n\nVer detalhes nos anexos.\n\nxxx\n\n2= Criar programa de Emissão de La"], "477-1": ["Emissão Minuta Pegada (FATU26) — rótulos emissão minuta, placa veículo, informado a data", "Emissão Minuta_Frigoríficos – FATU26.pdf", "Pedido Serviço: 30830 Cliente: Frigolaste Solicitação:\n\nROTINA:\n\nVendas e Distribuição Faturamento Rótulos Emissão Minuta ALTERAÇÃO:\n\n- Criar novo programa para geração de minutas Frigoríficos com base no FATU26:\n- Acrescentar filtros de Rota, Placa Veículo, Destino, e Hora Emissão.\n1º campo de Hora, refere-se a hora inicial da Data Emissão ¿De¿\n2º campo de Hora, refere-se a hora final da Data Emissão ¿Até¿ (quando não informado a Data ¿Até¿,\nfica valendo a mesma Data ¿De¿)\n- Criar opção de Agrupamento por Rota, Cidade e Placa Veículo.\n- Para o report, usar como base o FATU92\n- Retirar os campos de assinatura da empresa e da transportadora, assim como, os campos de preenchimento\nde data, hor"], "485-2": ["Gera Contra Nota Fiscal de Entrada - Frigorífico (RECE50) — suíno carcaça, produtor rural, contra nota", "Gera Contra Nota Fiscal de Entrada - Frigorífico - RECE50.pdf", "ROTINA:\n\nSuprimentos Recebimentos Notas Fiscais\nGera Contra Nota Fiscal de Entrada ALTERAÇÃO:\n\nCriar programa para gerar as \"Contra Notas Frigoríficos\" (partindo como base o programa RECE28: até poderá ser o\nmesmo programa, porém com configurações que atendam ao abaixo):\n\nA geração da Contra Nota deve ser, considerando:\n- partindo do lançamento da NF de Produtor: considerando o produto e o peso registrado nesta NF, do \"produto\" =\n\"animais\". Exemplo: Produto \"Suíno carcaça p/ Abate\", \"X\" Kgs.\n\n- Porém necessário serem considerados e desmembrados do produto original e sua qtde da NF de Produtor, os\nlançamentos de CEP que representam a qtde de animais que tiveram problemas sanitários, e que dev"], "485-3": ["Gera Contra Nota Fiscal de Entrada - Frigorífico (RECE50) — configuração de eventos, documentos fiscais eletrônicos, contra nota", "Gera Contra Nota Fiscal de Entrada - Frigorífico - RECE50.pdf", "Detalhamento:\nNo programa FATU3 (\"Nota Fiscal de Entrada\"), foi desenvolvida a nova aba \"GTA\" para os itens da nota fiscal, que\nestará disponível quando o novo parâmetro de inicialização estiver configurado para isso. Além disso, foram ajustadas\nas rotinas necessárias para gerar a observação na nota fiscal, referente aos dados informados na aba GTA mencionada.\n\nVendas e Distribuição Faturamento Cadastros\nConfiguração de Serviços de Documentos Fiscais Eletrônicos (DF-e) Detalhamento:\nAdicionadas as opções abaixo a lista de dados adicionais da aba NF-e -> Opções Impressão:\n- Vlr. Contribuição Rural (Detalhado)\n- Informação Bancária Fornecedor\n- NF Produtor Rural Referência - GTA\n- Lançamento C"], "485-17": ["Gera Contra Nota Fiscal de Entrada - Frigorífico (RECE50) — Cálculo de quebra de abate não está correto em todas as NFs", "Gera Contra Nota Fiscal de Entrada - Frigorífico - RECE50.pdf", "Pedido Serviço: 60928 Cliente: Frigolaste Solicitação:\nCálculo de quebra de abate não está correto em todas as NFs.\n\nRotina:\n\nSuprimentos Recebimentos Notas Fiscais\nGera Contra Nota Fiscal de Entrada - Frigorífico - RECE50 Alteração: \nNF 202120 na base do cliente não está calculando as quebras reais de produção, porém, NF 192177 está calculando\ncorretamente. Necessário verificar o que tem de diferente que uma NF calcula e outra não.\n\nDocumentação:\nSuprimentos Recebimentos Notas Fiscais\nGera Contra Nota Fiscal de Entrada - Frigorífico - RECE50 Detalhamento:\nAjustado.\n\nDocumentado na Atividade Tecnica:\n“ajustada a program unit QUEBRA_ABATE.\n\nadicionado o NVL abaixo:\nV_PERC_QUEBRA := (V_QTD / ("], "487-72": ["Lista de Preço (Estrutural) (VEND2) — preço com categoria, alfa, exclusiva", "Ivendre_Android_Frigorificos.pdf", "E-mail — Assunto: atualização do sistema feita na semana passada 09/09\n\nComplementado o abaixo, também com a atualização do sistema feita na semana passada 09/09, foram\nentregues/disponibilizados os desenvolvimentos que foram solicitados pela Letavo por ocasião da nossa visita feita\nem Julho, que envolve o seguinte (desenvolvido no Pedido de Serviço 51275):\nNo Ivendre Android (vendas pelo celular):\nRotina de permissão de acesso de Listas de Preço:\n-Sendo uma Lista de Preço vinculada com Categoria de Lista de Preços Tipo “Exclusiva”: só vai mostrar para\nselecionar tal Lista de Preço para os Clientes e/ou Grupos de Clientes com vinculo nesta Categoria de Lista de Preços.\nE,\n-quando o cliente q"], "487-90": ["descrito na documentação, rotina não poderia, quantidade de tolerância", "Ivendre_Android_Frigorificos.pdf", "Pedido Serviço: 63899 Cliente: Frigolaste Solicitação:\n\nRotina:\n\nIVendre - B2B Alteração:\nVerificar erro que ocorre ao enviar pedido pelo iVendre.\n\nMensagem: “Log: ORA-20000: ORA-20000: ORA-01407: cannot update (“KUNDEN”.“PEDIDO_VENDA_ENTREGA_ATM”.“QTD”) to NULL\nORA-06512: at “KUNDEN.GERA_PEDIDO_VENDA_B2B_P, line 3320...”  Documentação:\nOutros Detalhamento:\nNada foi feito.\n\nObservações:\n\nEstá ocorrendo esse erro na aplicação porque o produto 68.6803 está com a quantidade de tolerância com o valor 2,\nporém no pedido está sendo enviado com a quantidade 1.\n\nMarcio 150124, minha avaliação do acima:\n-acho que a rotina não poderia simplesmente dar esta mensagem como a acima...precisaria ser tratad"], "489-6": ["Liberação Pedidos Faturamento por Rota Estab 3 (FATU153) — faturamento por rota, resumida do relatório, listar o numero", "Liberação Pedidos Faturamento por Rota – FATU153.pdf", "Pedido Serviço: 30477 Solicitação:\nROTINA:\n\nVendas e Distribuição Faturamento Notas Fiscais\nLiberação Pedidos Faturamento por Rota - FATU153 ALTERAÇÃO:\n\nNa versão Resumida do Relatório (FATU156):\n\n1=Quando o pedido tem o tipo de Entrega \"A Produzir\", e ainda não há nada produzido para este pedido:\nNão está listando a qtde no relatório.\nNesta situação tem que listar a qtde do pedido.\nE, a partir de existir alguma qtde reservada para este item de pedido, aí traz o que está reservado (já está fazendo assim).\n\n2=passar a listar o Numero do pedido e o código de cliente + nome fantasia do cliente (não existindo nome fantasia,\ntrazer o próprio \"Nome\"), na seguinte situação:\n-quando na seleção tiver"], "489-40": ["Liberação Pedidos Faturamento por Rota Estab 3 (FATU153) — VERIFICAR E CRIAR A POSSIBILIDADE DE O SISTEMA ENVIAR O MESMO PEDIDO EM UMA NOVA ROTA…", "Liberação Pedidos Faturamento por Rota – FATU153.pdf", "Pedido Serviço: 61454 Cliente: Frigolaste Solicitação:\nVERIFICAR E CRIAR A POSSIBILIDADE DE O SISTEMA ENVIAR O MESMO PEDIDO EM UMA NOVA ROTA PARA O LINCROS Rotina:\n\nVendas e Distribuição Faturamento Notas Fiscais\nLiberação Pedidos Faturamento por Rota - FATU153 Alteração:\nVerificar e criar a possibilidade e fazer com que o sistema permita enviar o mesmo pedido em uma nova rota para o Lincros.\n\nDocumentação:\n\nMensagem:\nKND-004305 | Não foi possível enviar, pois a rota (:A) está sendo processada.  Vendas e Distribuição Faturamento Notas Fiscais\nLiberação Pedidos Faturamento por Rota - FATU153 Detalhamento:\nModificada a mensagem KND-004305 para não mencionar pedidos mas sim rotas.\nFeito que ass"], "490-1": ["001 -Rota de Transporte (ADMI90) — controle de rotas, gerada a nota, faturamento por rota", "Liberação Pedidos Faturamento por Rota – FATU153_estava em Notas.pdf", "Pedido Serviço: 23529 Solicitação:\n\nROTINA:\n\nPrograma / Rotina Nova, Controle de Rotas ALTERAÇÃO:\n\nCriar programa Controle de Rotas, com a finalidade de organizar e definir como será a logística de entrega das vendas/faturamento do dia.\n\nDocumentação:\n\nRotina:\nVendas e Distribuição Faturamento Notas Fiscais\nLiberação Pedidos Faturamento por Rota Parâmetros de inicialização:\nFATU153: LOCALIZACAO_PADRAO | CÓDIGO DA LOCALIZAÇÃO PADRÃO QUE SERÁ SUGERIDO PARA A NOTA FISCAL.\nFATU153: CHAMA_PROGRAMA_ID | IDENTIFICA O ID DO PROGRAMA A SER CHAMADO.\nFATU153: NATUREZA_EMIS_LCTO | TIPO E SITUAÇÃO DA NOTA FISCAL A SER GERADA.\nFATU153: OPERACAO_PADRAO | CÓDIGO DA OPERAÇÃO PADRÃO QUE SERÁ SUGERIDA PARA A N"], "496-27": ["Consulta Estoque Produto (ESTO7) — Necessário excluir apontamento no Painel da Frigolaste", "Painel de Abate.pdf", "Pedido Serviço: 60915 Cliente: Frigolaste Solicitação:\nNecessário excluir apontamento no Painel da Frigolaste.\n\nMensagem “...KND-000226: Quantidade disponível insuficiente para efetuar a operação...” \nUsuária realizou o apontamento no Painel correto (Trevisan), mas, o apontamento no Painel da Frigolaste\npermaneceu, sendo necessária a exclusão pois, segundo ela, acabou excluindo duas pranchas da quantidade total\ndos suínos que precisam ser apontados. Era 0/12 e agora consta como 0/10, e precisam apontar estas quantidades corretamente:  Documentação:\n\nManufatura Detalhamento:\nApontamento excluído manualmente.\nProblema estava ocorrendo pois o lote não estava mais no estoque, não permitindo desf"], "497-7": ["Segmentação de Código (ADMI30) + Local Armazenagem (EPRO26) — campos: Local de Armazenagem, Local de Armazenagem Selecionado, Loc Armaz Selec, X, Loc…", "Painel de Armazenagem.pdf", "No relatório ESTO98 que é impresso a partir do programa ESTO97:\n-Incluir a opção de “Listar Intervalos”;\n-Incluir as colunas Peso Bruto e Peso Liquido (diminuir na coluna do cliente);\n-fazer uma totalização geral ao final do relatório:\nColuna Rotulo/Lote: contar os registros;\nColunas Qtd, Peso Bruto e Peso Liquido: somar todos os valores (quantidades) de cada coluna.   zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz\n\nIncluir a opção de acessar e gerar os dados do novo “Painel de Local de Armazenagem” dentro do “Painel de\nEmbalagem”, incluindo o Botão “Novo Local de Armazenagem”, o campo “Local de Armazenagem”, o campo “Local\nde Armazenagem Selecionado” e um botã"], "499-35": ["Estruturação do Produto (EPRO15) — nome da marca, web manufatura public, painel de embalagem", "Painel de Embalagem_documentação de Pedidos.pdf", "Pedido Serviço: 37031 Cliente: Primevo Solicitação:\n\nRotina:\n\nWEB\nPAINEL DE EMBALAGEM - WEB Alteração:\n\nAlterar a rotina que busca a logo da etiqueta que é gerada com o apontamento do painel de embalagem para um cadastro no ERP.\n\nImagem da logo deverá vir do cadastro de marca (VEND109) do campo Imagem.\n\nDocumentação:\nWEB\nPAINEL DE EMBALAGEM - WEB Detalhamento:\nA busca por imagens nas etiquetas agora é feito da seguinte forma \"nome da marca\".jpg\n\nOrientação enviada para Ademir (mudou em relação à Solicitação inicial):\nesta alteração é a seguinte:\n- ndas e Distribuição\nFormação de Preço de Venda Cadastros Categorias FPV Detalhamento:\nAdicionado, na aba 'Dados Gerais', os campos de 'Crédito ICMS' e 'Crédito PIS/COFINS' que definem se o cálculo de\npreço de venda vai aplicar os impostos de PIS/COFINS e ICMS sobre o custo final do produto"], "532-0": ["Configurações (FVEN1) — FORMAÇÃO PREÇO DE VENDA - CONFIGURAÇÕES - FVEN1 - NOVO CENTRO DE CUSTO CADASTRADO NÃO…", "Configurações – FVEN1.pdf", "Configurações – FVEN1..\n\nPedido Serviço: 42634 Cliente: Pegada Solicitação:\nFORMAÇÃO PREÇO DE VENDA - CONFIGURAÇÕES - FVEN1 - NOVO CENTRO DE CUSTO CADASTRADO NÃO BUSCA\nNAS LISTAS DO PROGRAMA Vendas e Distribuição\nFormação Preço de Venda Cadastros Configurações Alterações:\n\nVerificar motivo de novo centro de custo cadastrado, não buscar nas listar de centro de custo do programa FVEN1.\n\nDocumentação:\nVendas e Distribuição\nFormação Preço de Venda Cadastros Configurações Detalhamento:\nNada foi feito.\n\nObservação:\nCentro de Custo não é demonstrado na lista de valores, pois o mesmo não possui nenhuma Tarifa de Mão de Obra\ncadastrada no programa FVEN10."], "534-62": ["Grades (EPRO10) — tamanho base, entrou no cálculo, calculo do fpv", "FPV.pdf", "Sobre o Tamanho Base que é mostrado no calculo do FPV... \n...ele já é sugerido automaticamente quando faz o Calculo do FPV (pelo programa de “Aprovação...” da engenharia,\nou pelo botão FPV do EPRO15), quando na grade do produto está marcado esta opção:\n\n- inclusive, quando não está marcado o “Tamanho Base” da grade, ao gerar o calculo de Custo não ver definido o\n“Tamanho Base” no FPV...  \n...e com isso tem material que não gera o custo porque não encontra de qual tamanho. Gera mensagem KND-002447 cfe tela abaixo...\nKND-002447: Material 39129.1 - ATACADOR (COM GRADE) BRANCO não entrou no cálculo. Motivo: Tamanho base da\ngrade do produto não existe na grade do material\n\n...além do que a Variaç"], "534-75": ["Configurações (FVEN1) — Temas vistos em 041217, com Cesar e Roberto, para implantação no Soubach", "FPV.pdf", " \nTemas vistos em 041217, com Cesar e Roberto, para implantação no Soubach:\n\n1= sobre como usar a opção “Despesas Administrativas/Comerciais”\n2= sobre como usar a opção “Ciclo Financeiro”\n3= sobre possibilidade de, a partir de definido o custo no FPV, como integrar com a Lista de Preços.\n\nSobre 1= sobre como usar a opção “Despesas Administrativas/Comerciais”:\nCfe posição Cesar, não é mais usado esta pasta cfe tela acima...\nos clientes passaram a vincular um item com um % na aba “Despesas Diretas de Venda”....chamando de “Despesas Administrativas/Comerciais”.\n\nSobre 2= sobre como usar a opção “Ciclo Financeiro”:\nCfe posição Cesar, metade dos clientes usa, metade não.\nOs dados de “Descrição” j"], "534-80": ["Cotações Código Produto (COMP14) — ROTINA Vendas", "FPV.pdf", "Pedido Serviço: 22140 Solicitação:\nROTINA Vendas\nFormação Preço de Venda  \nCálculo Preço de Venda - Fven5 ALTERAÇÃO\n\n- Não está carregando despesas Administrativas e Comerciais válidas no período.\n- Ao carregar MOD para processo com serviço vinculado o sistema carrega mal a cotação.\nConsidera o tempo como base, porém a tarifa de MOD externa deve considerar tarifa unitária.\ndesta forma deveria ser quantidade 1 x tarifa.\n\nDocumentação:\nVendas\nFormação Preço de Venda\nCálculo Preço de Venda - Fven5\n\nPara se utilizar as tarifas do CUST1, é necessário que o parâmetro geral UTILIZA TARIFA ESPECÍFICA FPV (50183)\nesteja como 'N', pois do contrário, as tarifas levadas em consideração serão as do progr"], "534-149": ["Configuração de Programas com Estrutura Hierárquica (ADMI49) — CRIAR UM PARÂMETRO GERAL AONDE TODAS AS NOTAS FISCAIS DE ENTRADA COM PIS/COFINS ENTRARÃO…", "FPV.pdf", "Pedido Serviço: 61839 Cliente: Brisa Solicitação:\nCRIAR UM PARÂMETRO GERAL AONDE TODAS AS NOTAS FISCAIS DE ENTRADA COM PIS/COFINS ENTRARÃO COM\nREDUÇÃO NA BASE DE CÁLCULO, AONDE SERÁ DEDUZIDO O VALOR DO ICMS NA BASE DE CALCULO DO PIS/COFINS.\n\nRotina:\n\nSuprimentos Recebimento Notas Fiscais\nNota Fiscal de Entrada Alteração:\n- Criar um parâmetro geral aonde todas as notas fiscais de entrada com PIS/COFINS entrarão com redução na base\nde cálculo, aonde será deduzido o valor do ICMS na base de calculo do PIS/COFINS.\n\nDocumentação:\n\nParâmetro Geral:\n50276 | DESCONTA ICMS DA BASE DE CÁLCULO DO PIS E COFINS NFE/COTAÇÃO/FPV | DESCONTA ICMS DA BASE\nDE CÁLCULO DO PIS E COFINS DAS NOTAS DE ENTRADA COM CR"], "534-154": ["Centros de Custo/Trabalho (ADMI36) — GGF e mão de obra não estão sendo gerados mesmo com tarifas cadastradas Rotina", "FPV.pdf", "Situação ocorrida em 170325, numa reunião com Duramas...RA: 250313033\n\nDuramas FPV revisar com Cesar...foi criado assim os Centros de Custo em 2024 na nossa visita...Centros de Custo\nparece que direcionando especificamente a Mão de Obra, GGF e Despesas Administrativas... \n...mas o fato é, que para funcionar, tive que vincular só o Centro de Custo da “Mão de Obra”... \n...e aí gerou OK o GGF e Despesas Administrativas (antes, quando equipe Duramas tinha vinculado os respectivos\nCentros de Custos criados acima, não gerava o valor no FPV)...  \nPenso que o fato do corrido acima de não ter calculado, foi porque veja abaixo, está vinculado só a este CCusto:\n\nEste é o exemplo apresentado por Duramas"], "535-0": ["Tarifas (CUST1) — cadastro de tempos, venda e custeio, buscar os dados", "FPV_Curtume.pdf", "FPV_Curtume..\n\nPedido Serviço 20283_Val_0401171\nCÁLCULO PREÇO DE VENDA E APROPRIAÇÃO DO CUSTEIO: PASSAR A UTILIZAR OS TEMPOS PADRÕES REGISTRADOS\nNO PROGRAMA \"CADASTRO DE TEMPOS - PREC36\" ROTINA:\n\nVendas e Distribuição\nFormação Preço de Venda\nCálculo Preço de Venda Controladoria Custos Apropriação do Custeio ALTERAÇÃO:\n\nPassar a utilizar os tempos padrões registrados no programa \"Cadastro de Tempos - PREC36\" para as rotinas dos\ncálculos de FPV e Custeio, para as empresas que utilizam o cadastro de tempos padrões por este programa ao invés\ndo programa \"Ficha de Operações\" (que está em Manufatura/Processos/Processos).\n\nDocumentação:\nNo programa Máquinas x Operações x Demãos(PREC32) foi adiciona"], "537-18": ["Parâmetros (ADMI8) — Demonstração efetuada por Cesar em 140518", "FPV_Desenvolvimentos a partir do patch 191 – Funcionalidades novas Pegada.pdf", "Demonstração efetuada por Cesar em 140518:\n\nParâmetro Geral 50183:\nN, para o formato antigo\nS*, para o novo formato, Pegada.\nFVEN4 Categoria FPV:\n\nDetalhes:\nPreço por tamanho: não funciona. É como se fosse não.\nCalcular a Valor Presente: pouco usado.\nCarregar materiais Semi-Acabados: criado para os curtumes...(Obs.: a categoria tem que ser “semi-acabado”)\nCarregar Despesas Administrativas: sugestão: é melhor configurar “sim”.\nEstabelecimento: herança da V3, utilizado em algumas funcionalidades para, por exemplo, trazer a tarifa (reduziu a\nnecessidade com últimos desenvolvimentos).   *Marcio 220324:\nCfe verifiquei com Cesar, quando Parâmetro Geral 50183 = S, então necessariamente o cadastro d"], "537-21": ["Centros de Custo/Trabalho (ADMI36) — tarifa será usado, venda daqui coluna, subdivisões de cod", "FPV_Desenvolvimentos a partir do patch 191 – Funcionalidades novas Pegada.pdf", "FVEN10:\nPara quem vai usar a nova rotina, utiliza as Taifas de Venda daqui, coluna Venda.\n\nVeja que já na aba “Mão de Obra” tem subdivisões de Cod Estrutural.\n\nExemplo do conceito de Grupo de Tarifas:\nTarifa 1 será usado pelo Sul;\nTarifa 2 será usado pelo Nordeste;\n\nAbas GGF e Despesas Adm/Comerciais: tem o mesmo conceito da aba Mão de Obra. \nPrograma acima só vai abrir CCustos definidos com “Centro FPV (Formação Preço de Venda)”  \nDetalhe para a funcionalidade da Cópia: é feito a cópia e depois se informa os valores dos novos registros copiados:\n\nXxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx CUST3:\n\nUtilizado para o calculo dos valores finais do mark-up, para o valor presente..."], "537-38": ["Categoria FPV (FVEN4) — venda categoria, markup, podendo o usuário", "FPV_Desenvolvimentos a partir do patch 191 – Funcionalidades novas Pegada.pdf", "Pedido Serviço: 26865 Cliente: Pegada Solicitação:\n\nROTINA:\n\nVendas e Distribuição\nFormação Preço de Venda Categoria FPV ALTERAÇÃO:\n1- Criar os campos abaixo no programa FVEN4:\n- Mercado - Moeda - Lista Preço\n- Markup Loja (%) - Prazo\n\n2- A informação dos campos criados no item 1 serão levadas para o programa FVEN5 (FPV - CÁLCULO) como\nsugestão, podendo o usuário editar os campos conforme necessidade.\n\nNo FVEN5 (Detalhamento do Markup)\na. O mesmo Produto poderá ter vários markups padrões desde que tenha listas de preço diferentes\n\nb. O Campo Markup loja será calculado junto com a lucratividade (Serão campos fixos que serão alterados pelo\nsistema conforme as alterações realizadas nos campos \""], "541-0": ["Cotações Código Produto (COMP14) — gerar os custos, modulo de fpv, usar esta configuração", "GS_Treinamento interno, 310519, para GS.pdf", "GS_Treinamento interno, 310519, para GS..\n\nFluxo:\nA partir do botão FPV do EPRO15:\nNo programa EPRO28, informar:\nCalculo custos = sim\nEstimativa... = informar qtde de pares previstos para fazer rateio de custos (para custos de formas, navalhas...)\nData aprovação = informar a data atual\nSituação = Aprovado p/ calculo custos...\n...e salvar:\n\nDepois, acessar o calculo no modulo de FPV:   Zzzzzzzzzzzzzzzzzzzzzzzz Anteriormente configurado:  \nPara gerar os custos de “Mão Obra Direta”, que a GS considera atualmente (com valor fixo de 12,76): \nPara gerar os custos de terceirização: necessário estes 2 cadastros:  \nPara o valor dos “indiretos” que a GS considera atualmente (como valor fixo de 5,99):\n"], "546-0": ["Cancelamento de Entrega Pedido Novo (PEDI89) — controle de grade, vale a pena, visto com martin", "Cancelamento de Entrega Pedido (p Produtos com Controle Rótulo)-PEDI89.pdf", "Cancelamento de Entrega Pedido (p/ Produtos com Controle Rótulo)-PEDI89..\n\nMarcio 070526:\n-Cfe visto com Martin, este programa foi criado em 2025 para melhor atender à Produtos com\nControle de Rótulos...(atender à Pegada e demais clientes que utilizam controle de Rotulo no\nEstoque e movimentação...pois o PEDI3 não mais atendia perfeitamente a rótulos)\n-Até esta data, não trata 070526 a movimentação de Lote...e por isso mantive ativo na BD\nImplantação a versão PEDI3.\n\nMarcio:\nMartin...esse PEDI89...sabe se ele atende a...\n-Produto configurado só com Controle de Grade:\n-Produto configurado sem controle de Grade, sem controle de Lote?\n\nMartin:\noie\n\nna epoca que eu fiz, eu tinha testado e feito "], "547-24": ["Cancelamento de Entrega Pedido (PEDI3) — Sobre Cancelamento parcial, segue uma avaliação interna em 250321", "Cancelamento de Pedidos e Entregas - PEDI3.pdf", "Sobre Cancelamento parcial, segue uma avaliação interna em 250321:\n\nMarcio Reni Schneider — Hoje às 09:14\noi, tu não se lembra também de ter possibilidade de cancelar uma parte de uma Entrega de Pedido de Venda, né?\n[09:14]\n(isso quando não envolva controle de Rotulo) [09:15]\nquando tem controle de rotulo, acho que isso é possivel...\n[09:15]\nmas quando o produto não tem controle de rotulo, aí acho que não é possivel de alguma maneira, cancelar\napenas parte da entrega de Pedido, né?\n\nRoberto Schumacher — Hoje às 09:21\nBom dia. Realmente não me recordo, inclusive a rotina do rótulo, sei que o Martin criou para a Pegada, mas\nnão cheguei a testar 100% ainda\n\nMarcio Reni Schneider — Hoje às 09:24"], "547-31": ["Cancelamento de Entrega Pedido (PEDI3) — ofs de semi-acabados, semi acabados, ver como ficam", "Cancelamento de Pedidos e Entregas - PEDI3.pdf", "Situação constatada na implantação Aniger, com relação à atualização das OFs, de OFs de Semi -Acabados que tem\ncomo origem outras OFs de Semi-Acabados (e estas ultimas sim tem como origem OFs de Acabado)...ou seja, numa\nsituação em que há mais níveis na cadeia da Estruturação de Produtos, ou seja, Semi -Acabados dentro de Semi- Acabados...\n...em resumo otina:\n\nWEB\nEncaixotamento e Liberação para Faturamento - Web Alteração:\n\n1. Aplicação \"Encaixotamento e Liberação para Faturamento WEB\": evoluir com a rotina, possibilitando\n\"encaixotar\" Pedidos de Venda que tenham a ação \"Reservar Estoque Futuro\" através das leituras de\netiquetas/talões que sejam dos respectivos LE's (Lotes Estoques).\n\n1.1. Esta alteração precisa ser parametrizada, para não afetar ao cliente que utiliza a rotina como está atualmente.\n\nDetalhamento nos anex"], "621-7": ["Parâmetros (ADMI8) — gerada e emitida, ficou correto, peças que entrarão", "Encaixotamento e Liberação para Faturamento WEB – VPS.pdf", "Encaixotando.\nVamos fazer uma caixa de 5 talões.\nFeita a leitura destes 5 talões:   Rótulo criado. \n Liberando.\n\nPEDI4.\n\nNF de saída gerada e emitida.  ESTO7.\nFicou correto aqui. Saiu a quantidade do reservado.\n\nE ficaram o três reservados para o mesmo pedido. \nNos lançamentos está correto. \n\nVamos produzir o resto do pedido.\n12 peças que entrarão no disponível.\n\nEntraram as 12 peças no disponível.  Na aplicação web\nVamos criar caixas misturando o que está no disponível com o que está no reservado. \n\nLiberamos as três caixas.\n\nPEDI4.\n\nNF de saída gerada e emitida.  ESTO7\nAqui ficou correto, tirou do reservado.\n\nAqui correto, ficou os 3 deste pedido mais 1 dos testes anteriores.  \nE aqui o la"], "625-2": ["Cadastro Usuários Recurso (ADMI52) — traz nenhum material, mostra estas ofs, testando a rotina", "Painel Web para Atelieres.pdf", "Testando a rotina em 220526, para tentar implantar na Henrich, para este RA https://kundencloud.com.br:3825/atendimento?id=260520026&callType=operator\n\nLink na BD Desenv:\nhttps://desenv.kunden.com.br/desenvknd/f?p=108:1:15218545105192::NO:::\n\nUsar este usuário MARCIO e senha 12345 para login na aplicação:\n-Abaixo também mostra uma das OFs, 670676, que é mostrado na aplicação...\n\nNum teste rápido, fiz o passo a passo da 1ª tela da aplicação aba “Seleção”, e cheguei neste Espelho da Nota para\nimprimir (os dados estão estranhos, como “Para AHB”, entre outros)...não trouxe materiais... \nNovo teste:\n\nNo ESTO25 selecionado assim...\n\nFeito a remessa... \nGerado a NFS pelo ESTO71...   Ok aqui...\n\nRes"], "626-17": ["Consulta Estoque Produto (ESTO7) — saiu do estoque, rótulos criados, posição de pedidos", "Picking Web_Encaixotamento WEB_de Produtos Avulsos - Pegada.pdf", "Visto em 010422, para avaliação da POC Aniger...\nA rotina de Picking sim permite mais de 1 produto no mesmo rótulo/caixa.\n(visto com Wagner e Guilherme).\n\nXxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx\n\nAbaixo teste feito em 310322 feita por Deise envolvendo também o Picking (e como ele procede quando tem vários\nitens do mesmo produto no Pedido de Venda = Pedido gerado pelo B2B escolhendo avulsos), teste com base em uma\nsituação real na Pegada, na BD Teste Pegada):\nTeste Pegada - ticket 66572\nProduto utilizado no teste e seu estoque inicial:\n\nCriado carrinho PE avulso, com 5 itens, no B2B: \n Carrinho finalizado:\n\nPedido criado corretamente:  Estoque reservou: OK\n\nFeito o picking para criação dos ró"], "634-11": ["Relatório Documentos (CREC5) — ALTERAR FORMA DE ENVIAR OS E-MAIS DOS RELATÓRIOS CITADOS NESTE PEDIDO", "Analise de Crédito.pdf", "Pedido Serviço: 23392 Solicitação:\nALTERAR FORMA DE ENVIAR OS E-MAIS DOS RELATÓRIOS CITADOS NESTE PEDIDO.\nROTINAS:\n\nFinanças Contas a Receber Relatórios Rel. Documentos (CREC5) Rel. Lançamentos (CREC7) ALTERAÇÃO:\n\n- Alterar a forma de enviar os e-mails, passar a utilizar a rotina de envio através de protocolos/serviços.\n\nFinanças Contas a Receber Nota de Débito\nRel. Nota de Débito (CREC62) ALTERAÇÃO:\n- Alterar a forma de enviar os e-mails, passar a utilizar a rotina de envio através de protocolos/serviços.\n\nVendas e distribuição Vendas Comissões\nRelatório Demonstrativo de Comissões (VEND15)\nRelatório Conta Corrente de Comissões (VEND7) ALTERAÇÃO:\n\n- Alterar a forma de enviar os e-mails, pass"], "634-13": ["Configuração de Email (ADMI265) — contato principal, contas a receber, e-mail cadastrado", "Analise de Crédito.pdf", "ROTINA:\n\nAdministração Configurações Rotina Envia E-mail ALTERAÇÃO:\n\nContinuação pedido 23392:\n\n1- Criar programa novo para cadastro de conta de e-mail por programa do ERP. Nele permitir que seja configurado:\na. Empresa / Unidade de Negócio;\nb. Descrição para a configuração. Exemplo: Envio Financeiro; Envio Compras....;\nc. Cadastro dos programas que irão usar essa configuração;\nd. Dados de servidor e login do e-mail enviador;\ne. Opção de Cópia para remetente;\nf. Assunto;\ng. Corpo do e-mail;\nh. Rodapé: texto padrão e concatenar no final e-mail do remetente com hiperlink para eventual possível\nretorno por este e-mail por parte de quem recebe-lo.\n\n2- Criar regras de busca dos e-mails Destinatár"], "634-16": ["Clientes (ADMI35) — Pedidos faturados com a configuração de análise de crédito do cliente definida como…", "Analise de Crédito.pdf", "Pedido Serviço: 63278 Cliente: Pegada Solicitação:\nPedidos faturados com a configuração de análise de crédito do cliente definida como 'Cliente' descontam o valor do\nlimite de crédito do grupo.\n\nRotina:\n\nVendas e Distribuição Faturamento Notas Fiscais\nLiberação Pedidos Venda Faturamento Alteração:\nVerificar o motivo pelo qual os pedidos faturados, com a configuração de análise de crédito do cliente como\n'Cliente', descontam o valor do limite de crédito tanto do cliente quanto do grupo, quando deveriam descontar apenas do cliente.\n\nDocumentação:\n\nVendas e Distribuição  Faturamento Notas Fiscais\nLiberação Pedidos Venda Faturamento Detalhamento:\nModificada rotina conforme solicitação.\n\nValidaçã"], "635-0": ["Cadastro de Usuários (ADMI260) — pessoa este email, loja de cnpj, mesma franquia", "Cadastro de Usuários – ADMI260.pdf", "Cadastro de Usuários – ADMI260..\n\nSituação na Grafdil, em 012025...Grafdil tem a seguinte necessidade:\n\nNo ADMI260 o mesmo cadastro de email poder acessar + de 1 cliente...isso porque:\nGrafdil vai disponibilizar o B2B para Franquias...\nE aí tem algumas franquias que comprarão da Grafdil pela mesma pessoa/pelo mesmo email de usuario do\nB2B (provável esta pessoa/este email é dono de mais de 1 Loja/de 1 CNPJ/de 1 cadastro de Pessoa da mesma franquia).\n\nSolução pensada (foi possível na Grafdil, porque na Grafdil o “Representante” não é utilizado de fato nos seus\ncontroles...por isso utilizamos tal Pessoa acima, como um Representante (mas de fato não é um Representante).\n\nOlhando na BD Grafdil An"], "635-1": ["Cadastro de Usuários (ADMI260) — Cliente: Bocattino", "Cadastro de Usuários – ADMI260.pdf", "Cliente: Bocattino\nGrupo: GP Gestao de Ativos - Eireli (8258)\nLista de Preço: BOCATTINO_001\n\nA franqueadora pode comprar para as franquias, assim como cada franquia pode comprar para si.\nEntão precisamos que a franqueadora tenha um usuário em que possa comprar para todas, além\nde cada uma ter o seu próprio usuário.\nConsultando os cadastros/clientes que pertencem ao grupo 8258: vinculados 23 cadastros. \nDefinir o grupo (franquia) como Representante. Cadastrar como representante em cada cliente\n(franqueado). Para esta guia vinculamos em três clientes.\n\nNo representante (franquia) definir uma classe de representante. Criar se necessário. Neste\nexemplo aqui foi criado.  \nDefinir uma categoria de"], "636-2": ["Classe de Risco (VEND1) — Verificar porque o JOB CLASSE DE RISCO coloca informação nula em alguns clientes Rotina", "Classe de Risco - VEND1.pdf", "Pedido Serviço: 66227 Cliente: Pagada Solicitação:\nVerificar porque o JOB CLASSE DE RISCO coloca informação nula em alguns clientes Rotina:\n\nVendas e Distribuição Faturamento Notas Fiscais\nLiberação Pedidos Venda Faturamento Alteração:\nVerificar porque o JOB CLASSE DE RISCO coloca informação nula em alguns clientes   Documentação:\nVendas e Distribuição Faturamento Notas Fiscais\nLiberação Pedidos Venda Faturamento Detalhamento:\nO motivo do Cliente s Detalhamento:\nModificada a lógica conforme solicit"], "650-1": ["Cadastro de Comissões (ADMI235) — Programa ADMI235", "Openfield_ Regra_Comercial.pdf", "Programa ADMI235\nTrabalha em conjunto com o programa acima VEND98:\nNo sentido de, o valor de desconto é defino acima, e no programa abaixo calcula quanto este desconto representa\nem % no item do pedido de venda, e enquadra a redução da comissão de acordo com a faixa encontrada/de acordo.\n\nMas também este programa pode trabalhar em separado.  \nEste cadastro VEND94 é um complemento/vinculo para o programa acima ADMI235.\n\nExemplo: a coluna “Comissão”. Exemplo o “5” ao qual estou posicionado abaixo, refere-se ao código “5” do cadastro acima.\nOu seja, a coluna “Comissão” quer dizer “Código do Cadastro de Comissões VEND235”."], "652-20": ["Pedidos de Venda (PEDI1) — tratar esta alteração, alterado para carregar, poderão ser alterados", "Pegada_Rotina_Descontos.pdf", "Pedido Serviço: 18882 Solicitação:\n\nROTINA:\n\nVendas e Distribuição Vendas Regra Comercial Descontos ALTERAÇÃO:\n\n1- Remover obrigatoriedade dos campos Cliente e Grupo Cliente, para que possa ser inserido um desconto geral\npara todos os produtos, assim fazendo com que sempre entre na regra de concessão de comissão;\n2- Com essa alteração, será possível criar descontos com percentual zero que, se necessário poderão ser alterados\nno pedido de venda;\n3- No programa de Pedidos de Venda, janela de descontos, tratar esta alteração para que este segundo desconto\nseja aplicado corretamente sob a nova condição de cadastro.\n\nDocumentação:\nO programa Descontos(VEND93) foi alterado para permitir cadastrar "], "653-0": ["Planejamento de Vendas (VEND14) — planejamento de vendas, configuração para funcionar, controle cotas planej", "Planejamento de Vendas - VEND14.pdf", "Planejamento de Vendas – VEND14..\n\nConfiguração para funcionar o Planejamento de Vendas:\nNa Categoria de Pedidos, e na Estrutura de Produto.\n\nQuando não há Cotas no programa Planejamento de Vendas, gera a validação abaixo ao confirmar.\nDetalhe no teste abaixo: um dos produtos estava com o campo “Controle Cotas Planej. Vendas” = SIM, o outro\nnão...por isso a mensagem KND-000463 foi só num dos produtos. \nAbaixo, o sistema retorna a qtde efetiva no próprio cadastro.\nO cadastramento pode ser mensal ou semanal."], "653-10": ["Planejamento de Vendas (VEND14) — PLANEJAMENTO DE VENDAS: ACRESCER CAMPO DE OBSERVAÇÃO E NÃO CONSIDERAR ENTREGAS DE PEDIDOS…", "Planejamento de Vendas - VEND14.pdf", "Pedido Serviço: 7898\n\nSolicitação:\nPLANEJAMENTO DE VENDAS: ACRESCER CAMPO DE OBSERVAÇÃO E NÃO CONSIDERAR ENTREGAS DE PEDIDOS DE\nVENDA COM PRODUÇÃO CANCELADA\n\nIncluir o campo de Observação junto ao bloco de estabelecimento das quantidades de planejamento, após o campo \"Qtd Efetiva\".\nCriar barra de rolagem para consulta a este campo.\nTamanho do campo: o maior possivel. Campo tipo \"Long\"?\n\nTambém:\nQuando a entrega de um pedido de venda tiver alterada a situação para Produção Cancelada, eliminar esta qtde da \"Qtd Efetiva\".\n\nTambém: acrescer um botão de consulta trazendo os pedidos de venda e as respectivas qtdes que estão vinculadas a cada \"Qtd Efetiva\";\n\nDocumentação:\nPrograma Planejamento de V"], "653-12": ["Planejamento de Vendas (VEND14) — Planejamento de Vendas", "Planejamento de Vendas - VEND14.pdf", "Planejamento de Vendas\n\nExemplo criado em 031018, para Ademir/Primevo.\n\n1= necessário configurar as Categorias de Pedido que devem atualizar a informação no Planejamento de Vendas.\nExemplo tela abaixo.\n\n2= no cadastro do Produto, tem que estar marcado o campo “Controle Cotas Planej Vendas”.\nÉ possível estabelecer nas estruturas “pai”.  \nA partir de configurado acima, com os próximos pedidos de venda passa a ser gerado e mostrados os dados\ncomparativos de Previsto X Efetivo no programa Planejamento de Vendas...\n\n...e no seu relatório:"], "654-2": ["Posição Financeira de Clientes (VEND31) — ADMI35 - CLIENTE NÃO TEM DOCUMENTOS VENCIDOS E ESTA SE ENCAIXANDO EM CLASSE DE RISCO…", "Posição Financeira – VEND31.pdf", "Pedido Serviço: 48628 Cliente: Pegada Solicitação:\nADMI35 - CLIENTE NÃO TEM DOCUMENTOS VENCIDOS E ESTA SE ENCAIXANDO EM CLASSE DE RISCO DIFERENTE DA QUE DEVERIA.  Rotina:\n\nAdministração Cadastros Clientes Alteração:\n\nCliente esta se encaixando em classe de risco que não deveria pois foi ajustada pelo job SETA_CLASSE_RISCO_CLIENTE_P.\n\nDocumentação:\nAdministração Cadastros Clientes Detalhamento:\nNada foi feito.\n\nObservações:\nFoi indentificado documentos vencidos para as pessoas que estão víncualdas ao grupo 545. Os documentos foram\npassados ao consultor responsável pelo pedido*.\n\nComo o cliente 545 é um grupo foi identificado que ao menos um cliente que está vinculado à ele contém um\ndocumento"], "662-1": ["Transportadora Preferencial (ADMI228) — TRANSPORTADORA PREFERENCIAL - ADMI228 - ALTERAÇÕES E CRIAÇÃO DE NOVA ROTINA Rotina", "Transportadora Preferencial – ADMI228.pdf", "Pedido Serviço: 32578 Cliente: Pegada Solicitação:\nTRANSPORTADORA PREFERENCIAL - ADMI228 - ALTERAÇÕES E CRIAÇÃO DE NOVA ROTINA Rotina:\n\nAdministração Cadastros Transportadora Preferencial Alteração:\n\n- Objetivo, passar a determinar a transportadora no faturamento com base na regra de Estabelecimento origem para\ncidade ou UF destino.\n- Atualmente o sistema busca a transportadora do pedido de venda por meio de uma regra bastante complexa.\n- Sistema pode continuar a buscar do pedido de venda, porém quando o mesmo estiver em branco deve trazer\nsempre do programa ADMI228.\n- Criar nova rotina onde o PEDI44 vai buscar a transportadora do pedido de venda e caso não encontre nada, buscar do ADMI228.\n"], "662-2": ["Transportadora Preferencial (ADMI228) — pedidos faturamento controle, grava na liberação, cadastro transportadora preferencial", "Transportadora Preferencial – ADMI228.pdf", "Sobre a Transportadora que é sugerida nos programas de Liberação para Faturamento (PEDI4, PEDI44, PEDI73,...):\n-O sistema “grava” a Transportadora para o faturamento no momento que é feito a aba “Liberação” nos programas\ncitados acima (PEDI4, PEDI44, PEDI73,...)...\n\n-primeiramente olha se tem a Transportadora gravado no Pedido de Venda.\n-Caso não esteja gravado no Pedido de Venda, busca do cadastro Transportadora Preferencial ADMI228.\nE aí grava na Liberação do Pedido de Venda e passa a trazer na aba “Faturamento”, ou aqui no botão Liberação\nPedidos Faturamento – Controle Carga PEDI73:  "], "663-0": ["Consulta Pedidos de Compra (COMP12) — orden de compra, aprobación por asignación, misma forma", "Alçada.pdf", "Alçada..\n\nPedido Serviço: 45752 Cliente: Baenamora Solicitação:\nRutina:\n\nAprobación por Asignación Desarrollo:\n\nCrear nueva opción en la rutina de Aprobación por Asignación: \"Cancelar Aprobación\".\nAl hacer \"clic\" en esta opción (en este botón), debe abrir una pantalla para poder registrar el motivo de la\ncancelación (no obligatorio llenar el motivo).\nEl motivo registrado de la cancelación quedará registrada en las ocurrencias de la Orden de Compra como histórico.\n\nCuando utilizado esta nueva opción, en la Orden de Compras deberá:\n- La \"Situación\" de la orden de compra también debe cambiarse y es necesario crear una nueva \"Situación\" de la\norden de compra: \"Aprobación cancelada\".\n- con esta s"], "663-10": ["Usuários (ADMI1) — Link na BD Produção Duramas (em 240726)", "Alçada.pdf", "Link na BD Produção Duramas (em 240726):\n\nhttp://192.168.16.193:8585/drmpro/f?p=109 Usuario: KUNDEN\nSenha: cfe registrado no cadastro do usuário Kunden.\n\nXxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx \nLink na BD Produção Brisa (em 270726):\n\nhttp://192.168.1.24:8585/bripro/f?p=109 Usuario: KND.GUILHERMEN Senha:123\n\nTeste efetuado por Guilherme, para implantação desta rotina na Brisa, vinculado a este RA:\nhttps://kundencloud.com.br:3825/atendimento?id=260304007&callType=customer\n(com apoio de Leo para funcionar a geração do email, pois antes gerava mensagem de erro de procedure ao clicar no\n“Confirmar” do Pedido Compras...\nConfiguração da Categoria:\n\nAqui após Confirmar o Pedido: \n"], "663-12": ["Plano de Necessidades de Compras (COMP13) — rotina de alçada, aguardando aprobación, gerando mensagem knd", "Alçada.pdf", "A rotina gravou OK no Pedido Compras...e mostra o usuário da próxima “Aprovação / liberação”...\n\nAqui acessando com o usuário da próxima aprovação...\n\n...aqui o usuário efetuando a ultima aprovação, gerando mensagem KND-004735 \n...e o Pedido Compras fica autorizado e confirmado por completo:\n\nExtensão dos testes na Duramas, aqui abaixo efetuado treinamento com Duramas no RA...\nhttps://kundencloud.com.br:3825/atendimento?id=260723013&callType=customer\nSendo que abaixo está descrito o comportamento da rotina de Alçada (enquanto está “Aguardando Aprovação” e\n“Cancelado Aprovação”), em relação ao MRP de Compras, nos programas como COMP13 e COMP75.\n\nMarcio.Cons 31/07/2026 - 16:38:49 Buenas tardes"], "665-0": ["Compradores (COMP1) — vinculo de grupo, tal usuário, permitir multi seleção", "Compradores – COMP1.pdf", "Compradores – COMP1..\n\nAvaliação em 260922, na implantação Aniger:\nAvaliar possibilidade de permitir multi seleção de Grupo Comprador no cadastro de Comprador.\n\nSITUAÇÃO ATUAL...\n\nNão identificado o porquê do vinculo de Grupo Comprador no cadastro do Comprador...\nAtualmente não efetua nenhum tipo de validação, nem nenhum tipo de “vantagem”.\n\nTentar ver o porquê serve o vinculo de Grupo Comprador no cadastro do Comprador...(poderia ser visto via pesquisa nas rotinas/programas??)\n\nExemplo Comprador Suporte vinculado ao Grupo Cotação “Quimico”...e um material com outro Grupo Cotação... \n...Permite Plano de Necessidades de Compras: utilizar tal produto sem o vinculo com o Grupo Comprador acima.."], "667-2": ["Consulta Plano de Necessidades de Compras (COMP39) — COMP37 - VERIFICAR LOGICA DO RELATORIO Rotina", "Consulta Plano de Necessidades de Compras – COMP39.pdf", "Pedido Serviço: 43289 Cliente: Oksebra Solicitação:\nCOMP37 - VERIFICAR LOGICA DO RELATORIO Rotina:\n\nSuprimentos Compras Relatórios\nRelatório Resumo Plano Necessidade de Compras COMP37+ Plano Necessidades de Compras MRP COMP13 +\nConsulta Plano de Necessidades de Compras – COMP39 Alteração:\n\n- Dúvida sobre qual critério o relatório leva em consideração para contemplar a quantidade do pedido de compra.\n\nDocumentação:\n\nSuprimentos Compras Relatórios\nResumo Plano Necessidade de Compras Detalhamento:\nIndependente da situação do pedido de compra, enquanto não houver recebimento, a quantidade do pedido será\ncontemplada no relatório. A lógica não leva em consideração a situação do pedido de compra.\n\n"], "667-6": ["Consulta Plano de Necessidades de Compras (COMP39) — seguintes funcionalidades, anos atrás, rotina está mostrando", "Consulta Plano de Necessidades de Compras – COMP39.pdf", "Avaliação feitas no programa COMP39 em 060324, em testes feitos na BD Duramas...\n\nIdentificado que o COMP39 tem as seguintes “deficiências/incoerências/problemas” na sua utilização, porque não\ntrata/não considera as seguintes funcionalidades que já são utilizadas no COMP13 e COMP75:\n\nVeja à direita, bloco de Estoque...\nVeja que a rotina está mostrando qtdes disponíveis de Estoque para o MRP, da Localização 61 -Rechazados (entendo\nque se é Rechazado não é algo utilizável pelo MRP)... \n...e aqui comprova que a rotina do COMP39 tem deficiência, porque não está olhando esta configuração da\nLocalização, que não indica utilizar a Loc 61 para o MRP (nenhuma Localização indicada aqui):\n\nTambém ident"], "668-1": ["Cotações Código Produto (COMP14) — COTAÇÕES DE COMPRAS - HABILITAR FUNCIONALIDADE DE COTAÇÃO POR TAMANHOS DE GRADE", "Cotações - COMP14.pdf", "Pedido Serviço: 11356 Cliente: Pegada Solicitação:\nCOTAÇÕES DE COMPRAS - HABILITAR FUNCIONALIDADE DE COTAÇÃO POR TAMANHOS DE GRADE\nCliente utiliza para deternimados produtos preços diferentes para tamanhos diferentes (situação nova identificada em 04/02/2014 ).\nProdutos com atacadores e alguns zippers serão cadastrados com grade.\nAlterações:\n- Cotações de Pedidos de Compra: habilitar preço por tamanho;\n- Quando for compra por MRP: gerar um item no pedido de compra e trazer em uma aba abaixo uma tabela com as\nseguintes informações: tamanho, quantidade e valor;\n- Quando for compra manual de itens com cotação e houver preços pro tamanho, seguir o padrão da compra com MRP.\n\nDocumentação:\nNovas M"], "668-27": ["Cotações Código Produto (COMP14) — lote mínimo compra, qtde é baseada, compras com base", "Cotações - COMP14.pdf", "...aqui na Cotação configurado qtde de 30... \n...e no Produto: 50:  \nAgora aqui o COMP13 ao gerar o pedido de Compras, na qual a necessidade original é menor que os Estoques Mínimos definidos acima...\n\n...detalhe abaixo utilizei a opção “Agrupar” para gerar só 1 item agrupado no Pedido de Compras (cfe teste mais\nacima, numa outra avaliação do Lote Mínimo Compra, quando a rotina reparte em mais de 1 Entrega, fica estranho o Lote Mínimo gerado... \n...aqui gerou a mensagem KND-000361 = OK...veja que a qtde é baseada no Campo “Lote Mínimo Compra” da Cotação...\n\n...veja que gerou o Pedido de Compras, com base no Campo “Lote Mínimo Compra” da Cotação: qtde de 30:\n\nAgora, para comprovar que a rotin"], "674-1": ["Envio de E-mail de Pedidos de Compras (COMP74) — 1. Criar programa novo: \"Envio de Email de Pedidos de Compras\";", "Envio de E-mail de Pedidos de Compras – COMP74.pdf", "Pedido Serviço: 58960 Cliente: Aniger Solicitação:\n1. Criar programa novo: \"Envio de Email de Pedidos de Compras\";\n1.1. Tela do programa: utilizar como base o programa \"Gera Pedido de Compra - EDI - COMP23\" . Exemplo\ndeste programa conforme tela abaixo (porém com algumas alterações citadas mais abaixo nos próximos itens).\n\n1.2. Altura de tela: utilizar altura máxima, para que possibilite mostrar a qtde máxima de registros de\nPedidos de Compras; Exemplo de tela mais abaixo.\n1.3. Criar aba \"Classificação\" para permitir classificar/ordenar os registros na aba \"Pedidos\" . Criar exemplo\nprograma COMP5 (exemplo tela abaixo). Permitir Classificação por todas as colunas mostradas na aba\n\"Pedidos\" . "], "678-15": ["Pedidos de Compra (COMP3) — lote econômico, mínimo de compra, cálculo que considera", "Pedido de Compras - COMP3.pdf", "Documentação:\n- A partir de agora o programa conta com validação de lote mínimo de compra.\n\n- Da mesma maneira que o programa, validada o lote mínimo de compra, passa a validar também o lote econômico.\n- O programa busca o lote econômico primeiramente na cotação de compra, ou caso não encontre, verifica também\nno cadastro do produto.\n\n- Para pedidos gerados pelo \"Plano de Necessidades\":\nA validação é feita no momento em que o pedido é gerado, exibindo uma mensagem caso a quantidade não\ncoincida com o cálculo que considera o lote econômico. Caso o usuário não confirme o ajuste da quantidade, o pedido não é gerado.\n\n- Para pedido de compra lançado manualmente:\nO sistema bloqueia a confirmação "], "678-29": ["Pedidos de Compra (COMP3) — PEDIDO DE COMPRAS Y COTIZACIONES, CAMPO CONDICION DE PAGO: SUGERIR DEL CATALOGO DE…", "Pedido de Compras - COMP3.pdf", "Pedido Serviço: 12327 Solicitação:\nPEDIDO DE COMPRAS Y COTIZACIONES, CAMPO CONDICION DE PAGO: SUGERIR DEL CATALOGO DE PROVEEDORES Y\nPARAMETRO GENERAL POR COMPAÑIA.\n\nCrear el campo de Condición de Pago en el catálogo de Proveedores;\nCrear el parámetro general de Condición de Pago por compañía.\n\nPasar a sugerir la condición de pago en los programas:\nCotización de Compras;\nPedido de Compras;\nCatálogo de Proveedores;\n\nLa sugerencia en los programas:\nPrograma Catálogo de Proveedores:\nDe acuerdo el parámetro general de Condición de Pago por compañía.\n\nPrograma Cotización de Compras:\n1º de acuerdo el catálogo de Proveedores;\n2º cuando no hay en el proveedor, a través el parámetro general de Condici"], "678-53": ["Pedidos de Compra (COMP3) — sobre trazer a descrição do Modelo ao lado do Numero do Plano de Produção nos Pedidos de…", "Pedido de Compras - COMP3.pdf", "E-mail — Assunto: sobre trazer a descrição do Modelo ao lado do Numero do Plano de Produção nos Pedidos de Compras\nReferente ao que voce me solicitou hoje de tarde, de trazer a descrição do Modelo ao lado do Numero do Plano de\nProdução nos Pedidos de Compras:\n\n-temos algo que poderá ser utilizado, que é semelhante ao que voce solicita...que teria que fazer os seguintes procedimentos:\n\n-No programa Plano de Produção, preencher em cada Plano de Produção o campo “Sit. Consumo”.\n\n(este campo “Sit Consumo” tem um cadastro próprio, que vocês podem “chamar” este cadastro a partir do Plano de\nProdução mesmo, e cadastrar o “Modelo” ou a descrição que queiram que apareça do lado do numero do Plano de\n"], "678-62": ["Pedidos de Compra (COMP3) — vista em duramas, orientação dada, cotação", "Pedido de Compras - COMP3.pdf", "Situação vista em Duramas, em 112021...\nReferente mensagem “KND-000359: Produto...X......sem cotação...”...orientação dada:"], "678-68": ["Pedidos de Compra (COMP3) — descrição de compra, selecionando um fornecedor, acordo o idioma", "Pedido de Compras - COMP3.pdf", "Avaliação feita por Roberto em 230922, referente campo “Descrição Produto Compras” no EPRO60:\n\nInformado descrição de compra no material\n\nQuando informado o material na cotação, está carregando a descrição de venda do idioma português, mesmo\nselecionando um fornecedor de idioma inglês.\n\nSe não informar descrição na cotação, a impressão da OC busca de acordo o idioma do fornecedor\n\n“Roberto Schumacher — Ontem às 09:44\nVou colocar em um DOC, mas só para te avisar, o campo quando preenchido com idioma\nportuguês e inglês, está levando para a cotação automaticamente o que está no idioma\nportuguês, porém, mesmo selecionando um fornecedor externo, não está alterando a descrição \n\nna cotação, já na "], "678-70": ["Pedidos de Compra (COMP3) — PEDIDO DE COMPRAS - PREVER EMISSÃO DO CARTÃO COMPONENTE A PARTIR DO PEDIDO DE COMPRAS", "Pedido de Compras - COMP3.pdf", "Cartão Componente por Pedido Compra – CFAB52 Pedido Serviço: 3232 Cliente: HK Solicitação:\nPEDIDO DE COMPRAS - PREVER EMISSÃO DO CARTÃO COMPONENTE A PARTIR DO PEDIDO DE COMPRAS\nDesenvolver uma opção para emissão de cartão componente a partir do pedido de compras, utilizando como\npadrão de agrupamento sempre a OF.\n\nObs.: Na V3 havia sido criado, na opção visualizar, um check box para imprimir o cartão componente não.\n\nDocumentação:\nPrograma CFAB52 - Emissão Cartão Componente por Pedido Compra\nRelatório CFAB53 - Sequencia 1\n\nEsta emissão de cartão componente obtém as informações a partir do pedido de compra.\nSomente serão processadas as entregas de pedido de compra que possuirem ordens de fabr"], "678-87": ["Pedidos de Compra (COMP3) — Listar as notas fiscais de remessa para beneficiamento no COMP3 Rotina", "Pedido de Compras - COMP3.pdf", "Pedido Serviço: 65277 Cliente: Pegada Solicitação:\nListar as notas fiscais de remessa para beneficiamento no COMP3 Rotina:\n\nSuprimentos Compras Pedido Pedido de Compra Alteração:\nAdicionar campo Data Emissão e Nota Remessa na aba Beneficiamento do programa COMP3.\n\n(isso quando o Pedido de Compra é com Categoria do Pedido Compra que tem a Flag “Exigir Beneficiamento” marcada).  Documentação:\nSuprimentos Compras Pedido Pedido de Compra Detalhamento:\nAdicionados os campos \"Data Emissão\" e \"Nro N.F.\" na aba \"Beneficiamento\" para mostrar a data de emissão e o\nnúmero da nota fiscal de beneficiamento, caso a mesma já esteja emitida.\n\nNo COMP42 é gerado a NF de Saída com base neste Pedido de Compras"], "678-94": ["Pedidos de Compra (COMP3) — sequencia do item, edi de compra, incluir sequência", "Pedido de Compras - COMP3.pdf", "Pedido Serviço: 62561 Cliente: Aniger Solicitação:\n\nRotina:\n\nSuprimentos Compras Pedido\nRelatório Pedido de Compra Alteração:\n\nIncluir Sequência do Item no Relatório do Pedido de Compra (COMP9) e na Geração do EDI de compra (COMP23).\n\nDocumentação:\n\nSuprimentos Compras Pedido\nRelatório Pedido de Compra Detalhamento:\nAdicionada informação de Sequencia do Item ao relatório COMP9 e ao arquivo EDI."], "679-3": ["Plano de Necessidades de Compras (COMP75) — dados de mrp, utilizamos a mesma, separada das empresas", "Plano de Necessidades de Compras Agrupado – COMP75.pdf", "Na Implantação Aniger em 290823, houve a necessidade de separar os dados de MRP das empresas 1 -Aniger e 2-\nMelbros (compras em separados, cada uma tendo produção própria)...\n\n...utilizamos a mesma configuração citada acima do Henrich*...: Configuração de Tabela PEDIDO_COMPRA_ATM para EMPRESA.\n*ver no .doc do COMP13.\n\nCom isso, já resolveu a necessidade apresentada de fazer a gestão de MRP totalmente separada das 2 empresas:  \nOu seja, separa todos os dados de MRP...\n(não tem estoques acima, nem Recebimentos previstos, mas visto na BD Homologação que sim fica separado de\nacordo com a empresa selecionada na aba Seleção)"], "679-5": ["Plano de Necessidades de Compras (COMP75) — Visto em 100124, na instalação do programa na BD Duramas", "Plano de Necessidades de Compras Agrupado – COMP75.pdf", "Visto em 100124, na instalação do programa na BD Duramas:\n-Rotina está gerando no Pedido de Compras qtde maior que a qtde mostrada no MRP do COMP75\nConsta na validação: 64163_Val_1001242\n\nAqui situação original deste material...  \nAgora gerando um Pedido de Compras: \n\nGerou com qtde não de acordo com o acima...gerou 295...  \nFazendo uma seleção não por Plano e sim por este material, idem gera o Pedido de Compras com problema, com 295...  Posição Posterior:\nIdentificado que o motivo é este:\nLote Mínimo de Compra...\nConsegui identificar o motivo através do teste mais abaixo no COMP13: este sim alerta deste “Lote Mínimo Compra” na Cotação:\n\nQuando fui testar pelo COMP13   Dando SIM...gerou 295 "], "679-6": ["Plano de Necessidades de Compras (COMP75) — ponto de reposição, essas necessidades, material está esperando", "Plano de Necessidades de Compras Agrupado – COMP75.pdf", "Situação apresentada por Krumenauer no RA 230727050 em que, a partir de feito o Pedido de Compras a partir de\numa Solicitação gerada pelo Ponto de Reposição, tal Solicitação deixa de ser mostrada na aba “Necessidades” do COMP13 e COMP75...\n...o que não acontece quando a Solicitação for feito manualmente pelo usuário (sem ser pela rotina de Ponto de Reposição)...\n\nDetalhes e o nosso retorno foi cfe abaixo:  17/01/2024 - 11:34:32 Augusto, referente ao COMP75.\n\nAlmoxarifado gerou uma solicitação de pedido numero 150 no COMP6.\nO pedido apareceu na tela do novo COMP75, e comprador gerou o\npedido 12384 cfme telas abaixo.\nPorém, mesmo tendo sido gerado o pedido o programa não limpou os\nítens da lis"], "679-11": ["Plano de Necessidades de Compras (COMP75) — pilhas, solicitado por lucas, sistema vai continuar", "Plano de Necessidades de Compras Agrupado – COMP75.pdf", "Pedido Serviço: 65193 Cliente: Krumenauer Solicitação:\n\nRotina:\n\nSuprimentos Compras Pedido\nPlano de Necessidades de Compra Agrupado-COMP75 Alteração:\nCriar parâmetro geral para inibir solicitação manual da tela do MRP de compras.\n\nMotivo: para atender à solicitação de Lucas/Krumenauer, de acordo com o conceito aplicado no Cortume\nKrumenauer (e que entendo ser também um conceito “válido”, é apenas uma maneira diferente de avaliar\nnecessidades de Compras de Ponto de Reposição)...ou seja, não consideram que Solicitações-COMP6 feitas\nmanualmente pelo usuário devam ser consideradas na aba MRP como “Necessidade” = não deveria nem aparecer na\naba Necessidades, e não aparecendo na aba MRP*, não ser"], "681-1": ["Plano de Necessidades de Compras (COMP13) — Cria versão Plano Necessidade de Compras por Plano de Produção, utilizar como base o…", "Plano de Necessidades de Compras Resumida.pdf", "Pedido Serviço: 9622 Solicitação:\nCria versão Plano Necessidade de Compras por Plano de Produção, utilizar como base o programa COMP13 - Plano\nNecessidade de Compras MRP.\n\nFiltros: Os mesmos, porém a orogem sempre será plano de produção, portanto não precisa os check box.\n\nOpções: Agrupamento - Por plano, Estabelecimento, componente\nSe marcado agrupamento por plano, irá mostrar os produtos/quantidades agrupadas por plano,estabelecimento,componente,....\nValerá a mesma regra para estabelecimento ou componente, se marcaado irá agrupar.\nquando não assinalado, mostras na colunas correspondentes em branco.\n\nClassificações: Manter, porém somente as opções, plano, estabelecimento, componente e produ"], "682-3": ["Plano de Necessidades de Compras Por Estabelecimento (COMP50) — COMP50 - AO TENTAR GERAR O PEDIDO DE COMPRA, ESTÁ BUSCANDO A COTAÇÃO VENCIDA Rotina", "Plano Necessidades de Compras por Estabelecimento - COMP50.pdf", "Pedido Serviço: 43287 Cliente: Pegada Solicitação:\nCOMP50 - AO TENTAR GERAR O PEDIDO DE COMPRA, ESTÁ BUSCANDO A COTAÇÃO VENCIDA Rotina:\n\nSuprimento Compras Pedido\nPlano de Necessidade de Compras por Estabelecimento Alteração:\n\nQuando possuímos uma cotação para um material já vencida e uma cotação para um nível estrutural maior que do\nmaterial final, quando clicamos para gerar o pedido de compra, o sistema está buscando a cotação sem validade, o\nque está incorreto e bloqueando o usuário de gerar o pedido de compra.\n\nDocumentação:\nParâmetro Geral:\n50216 | UTILIZA DATA ATUAL COMO BASE PARA BUSCA DE COTAÇÃO DE PRODUTO QUANDO NÃO INFORMADA |\nUTILIZA A DATA ATUAL COMO BASE PARA A BUSCA DE COTAÇÃO "], "683-6": ["Plano de Necessidades de Compras (COMP13) — MRP DE COMPRAS: NA ROTINA DE NECESSIDADES GERADAS PELAS SOLICITAÇÕES DE COMPRAS, NÃO…", "Plano Necessidades de Compras_MRP - COMP13.pdf", "x Pedido Serviço: 6411 Solicitação:\nMRP DE COMPRAS: NA ROTINA DE NECESSIDADES GERADAS PELAS SOLICITAÇÕES DE COMPRAS, NÃO OCULTAR ESTAS NECESSIDADES PELO LANÇAMENTO DA NF ENTRADA\n\nEfetuar esta funcionalidade criando um parametro geral.\n\nA \"ocultação\" desta necessidade será efetuada pelo usuario, utilizando o programa \"Cancelamento Saldo Solicitações de Pedidos\" Documentação:\nPLANO DE NECESSIDADES DE COMPRAS (COMP13)\nRELATÓRIO PLANO DE NECESSIDADES DE COMPRAS (COMP16)\nRELATÓRIO PLANO DE NECESSIDADES DE COMPRAS POR PLANO DE PRODUÇÃO (COMP28)\nRELATÓRIO POSIÇÃO DE NECESSIDADES DE MATERIAIS (COMP32)\nRESUMO PLANO DE NECESSIDADES DE COMPRAS (COMP37)\nCONSULTA PLANO DE NECESSIDADES DE COMPRAS (COMP39)"], "683-11": ["Plano de Necessidades de Compras (COMP13) — Criar um programa que permita o encerramento dos itens de uma solicitação", "Plano Necessidades de Compras_MRP - COMP13.pdf", "Pedido de Serviço 5553 (isso também está documentado no programa Solicitações, de Compras):\n\nSolicitação:\nCriar um programa que permita o encerramento dos itens de uma solicitação.\nAs mesmas informações que forem marcadas neste novo programa terão que aparecer nos itens do programa de \"Solicitação de compras\", através de um Check Box por\nitem, se ele estiver marcado significara que o item em questão esta encerrado.\nConferir para que quando um item for encerrado o mesmo não pode mais aparecer para os demais programas, no caso não aparecera mais para o MRP, para o consulta de\nMRP, para gerar um novo pedido de compra e todos os demais programas que envolvem a solicitação.\nO programa de \"Encerra"], "683-16": ["Plano de Necessidades de Compras (COMP13) — suprimentos compras consultas, saldo dos pedidos, motivo das quantidades", "Plano Necessidades de Compras_MRP - COMP13.pdf", "Pedido Serviço: 62118 Cliente: Oksebra Solicitação:\n\nRotina:\n\nSuprimentos Compras Consultas\nConsulta Plano de Necessidades de Compras - COMP39\n\nAlteração: Verificar motivo das quantidades apresentadas no COMP39, mesmo que os pedidos estejam faturados.\n(Neste caso envolve a rotina de MRP PRODUTO PRONTO)   Documentação:\n\nSuprimentos Compras Consultas\nConsulta Plano de Necessidades de Compras - COMP39 Detalhamento:\nNada foi feito.  Observação:\n- O motivo do programa retornar o item dos pedidos 8483 e 8482 é por eles não estarem totalmente faturados, isso junto do parâm etro geral de identificação 50058\nconfigurado para S, faz com que esse registro seja retornado para o programa.\n- Caso não quei"], "683-30": ["Plano de Necessidades de Compras (COMP13) — MRP de Materiais: necessario agregar tratativa para os estabelecimentos \"Depositos\", que…", "Plano Necessidades de Compras_MRP - COMP13.pdf", "Pedido Serviço: 10170 Cliente: Pegada Solicitação:\nMRP de Materiais: necessario agregar tratativa para os estabelecimentos \"Depositos\", que atenderão estabelecimentos \"Produtivos\".\n\nProposta: Ideia: linkar via cadastro de Localização: identificar a Localizaçao/Estabelecimento ao qual gerará o estoque para a produção.\n\nDocumentação:\nCADASTRO DE LOCALIZAÇÃO (ADMI44)\nNa aba \"Compras\", foi criada a coluna \"Localização Depósito\".\n\nPLANO NECESSIDADE DE COMPRAS\n\nQuando a lógida de MRP de Compras estiver buscando o estoque dos produtos, buscará, também, o estoque da localização depósito das localizações encontradas na primeira\nbusca. Nesta busca dos depósito, não serão validados os grupos compradore"], "683-31": ["Plano de Necessidades de Compras (COMP13) — PLANO DE NECESSIDADES DE COMPRAS, TELA \"PEDIDO\": PERMITIR ALTERAR O CAMPO \"NECESSIDADE\" E…", "Plano Necessidades de Compras_MRP - COMP13.pdf", "Pedido Serviço: 11758 Solicitação:\nPLANO DE NECESSIDADES DE COMPRAS, TELA \"PEDIDO\": PERMITIR ALTERAR O CAMPO \"NECESSIDADE\" E GERAR A QTDE NO PEDIDO DE COMPRAS DE ACORDO COM ESTA ALTERAÇÃO\n\nApenas disponivel para materiais sem grade.\n\nDocumentação:\nPLANO DE NECESSIDADES DE COMPRAS (COMP13)\nPLANO DE NECESSIDADES DE COMPRAS RESUMIDA (COMP49)\nPLANO DE NECESSIDADES DE COMPRAS POR ESTABELECIMENTO (COMP50)\n\nNa tela de geração do pedido de compra, será permitida a alteração da coluna \"Necessidade\" para produtos SEM grade."], "683-42": ["Plano de Necessidades de Compras (COMP13) — apostrofe, sql command not, produção o motivo", "Plano Necessidades de Compras_MRP - COMP13.pdf", "Para esta mensagem “ORA-20000: Erro GERA_MRP_COMPRA_GTB_P: ORA-00933: SQL command not properly ended”, que apareceu em todos os programas de MRP de\nCompras, filtrando um determinado Plano de Produção, o motivo é...\n...é que foi colocado uma apostrofe na Estruturação de Produto, campo “Obs Compras”.\nCfe definição de Jean, não há como prever isso nos programas, nem evitar que ocorra, nem colocar mensagem. Não se pode colocar apostrofe em nenhum lugar cadastro\ndo sistema, porque de acordo como são feitos os selects nos programas podem gerar estes inconvenientes.\n\nVeja abaixo a apostrofe, ao final da Obs. "], "683-73": ["Plano de Necessidades de Compras (COMP13) — ESTRUTURAÇÃO DE PRODUTO - EPRO15 / Agendador de Tarefas: GERAÇÃO MRP COMPRA PEDIDOS EM…", "Plano Necessidades de Compras_MRP - COMP13.pdf", "Pedido Serviço: 44183 Cliente: TEA Solicitação:\nESTRUTURAÇÃO DE PRODUTO - EPRO15 / Agendador de Tarefas: GERAÇÃO MRP COMPRA PEDIDOS EM CARTEIRA Rotina:\n\nManufatura\nEngenharia e Desenvolvimento de Produto Engenharia\nEstruturação de Produto - EPRO15\n\nAgendador de Tarefas: GERAÇÃO MRP COMPRA PEDIDOS EM CARTEIRA Alteração:\n\nVerificar o motivo do log que aparece no agendador de tarefas.\nROTINA do Agendador de Tarefas: GERAÇÃO MRP COMPRA PEDIDOS EM CARTEIRA\n\nMensagem: “KND-000201...Não existe coeficiente na Variação de Consumo...”  Documentação:\nManufatura\nEngenharia e Desenvolvimento de Produto Engenharia\nEstruturação de Produto - EPRO15 Detalhamento:\nNada foi feito.\n\nObservação:\nFoi necessário r"], "683-82": ["Plano de Necessidades de Compras (COMP13) — campos: Data Necessidade e Data Compra Revisar, Tempo Segurança Entrega (Dias), Tempo…", "Plano Necessidades de Compras_MRP - COMP13.pdf", "Avaliação feita em 131021, na visita a Duramas...\n\nArquivar em COMP13, definições campo Data Necessidade e Data Compra\n\nRevisar …Tiempo Reprovisión días (40)…utilies o corridos? Y, porque de 08/10/21 a 13/08?\nY porque 08/10/21, teniendo la solicitud fecha de 15/10/21?\nPosición:\nSolicitud: 15/10/21\nFecha Necesidad: 15/10/21 – (menos) 5 días útiles Tiempo seguridad = 08/10/21\nFecha Compra: parte de la fecha 08/10/21 – (menos) 40 días útiles Tiempo Reprovisión/Lead time de proveedor = 13/08/21 Traduzindo… No COMP13, colunas…:\nData Necessidade: considera dias úteis/uteis, partindo do cadastro feito no EPRO15, campo “Tempo Segurança Entrega (Dias)”\nData Compra: considera dias uteis, partindo do c"], "683-88": ["Plano de Necessidades de Compras (COMP13) — PROGRAMA PLANO DE NECESSIDADES DE COMPRAS ¿ COMP13: PASSAR A MOSTRAR AS QTDES…", "Plano Necessidades de Compras_MRP - COMP13.pdf", "Pedido Serviço: 55353 Cliente: Kunden Solicitação:\nPROGRAMA PLANO DE NECESSIDADES DE COMPRAS ¿ COMP13: PASSAR A MOSTRAR AS QTDES ¿PRÉ-RECEBIDAS¿ DAS NF¿S DE ENTRADA\n1. Programa Plano de Necessidades de Compras ¿ COMP13, quando houver registros de Pré-Recebimento de Pedidos de Compras:\n1.4. Colunas Necessidade Liquida e Estoque Projetado: deverão passar a considerar esta nova coluna, com a mesma lógica da coluna ¿Recebimento Previsto¿.\n\nDocumentação:\nPrograma Plano de Necessidades de Compras - COMP13  Detalhamento:\nAdicionada coluna \"Pré-Recebido\" na janela \"Necessidades\" acessada a partir do botão \"MRP\" na aba \"Necessidades\". Esta coluna terá o quantidade pré-recebida e\ndescontará a quantida"], "683-97": ["Plano de Necessidades de Compras (COMP13) — ponto de reposição, essas necessidades, vinda do material", "Plano Necessidades de Compras_MRP - COMP13.pdf", "\nSituação apresentada por Krumenauer no RA 230727050 em que, a partir de feito o Pedido de Compras a partir de uma Solicitação gerada pelo Ponto de Reposição, tal\nSolicitação deixa de ser mostrada na aba “Necessidades” do COMP13 e COMP75...\n...o que não acontece quando a Solicitação for feito manualmente pelo usuário (sem ser pela rotina de Ponto de Reposição)...\n\nDetalhes e o nosso retorno foi cfe abaixo:\n\n17/01/2024 - 11:34:32 Augusto, referente ao COMP75.\n\nAlmoxarifado gerou uma solicitação de pedido numero 150 no COMP6.\nO pedido apareceu na tela do novo COMP75, e comprador gerou o pedido 12384 cfme telas abaixo.\nPorém, mesmo tendo sido gerado o pedido o programa não limpou os ítens da li"], "684-17": ["Agendador de Tarefas (ADMI63) — Smart_Ponto Reposição", "Ponto de Reposição.pdf", "Smart_Ponto Reposição\nTeste efetuado em 290721, para comprovar a funcionalidade da rotina, considerando tanto necessidades geradas\npelos Planos de Produção + Pedidos em Carteira (e que são mostrados na tela do MRP), em conjunto com a rotina de\nPonto de Reposição/Estoque Mínimo, para alertar quando a qtde chegar a um limite mínimo “X”.\n\nTeste efetuado:\nAgendador de Tarefas de geração de necessidades Pedidos em Carteira: vai rodar às 22:00 horas.\nAgendador de Tarefas de Ponto de Reposição/Estoque Mínimo: vai rodar às 23:00 horas.\nPosição de 2 materiais de teste em 290721 2022hrs...: \n\nOlhando em 300721, 0800 hrs, a rotina do agendador rodou OK...\n\nProduto 117: gerou solicitação de 4, porque:\nE"], "684-25": ["Recebimento de Pedidos de Compra (COMP5) — gerar a reposição, porque o usuário, planos de produção", "Ponto de Reposição.pdf", "Extensão da implantação da rotina acima, ocorrida em 120624 e registrada no RA 230727050:  Posição Kunden:\n\nO usuário MATHEUS fez uma mudança no cadastro de alguns materiais ontem, o campo que mudaram foi tipo de\nfornecimento para Externo, dessa maneira o MRP de compras está olhando para os planos de produção, o que faz\ncom que gere uma solicitação com uma grande quantidade, precisam manter esse campo como \"Interno\", dessa\nmaneira o JOB vai olhar o estoque e rodar/gerar a reposição como estava gerando antes.\n\nAparentemente essa mudança foi por causa do que foi comentado no RA 240611004, consegues dar uma olhada\nporque o usuário quer que os planos de produção gere mento a NF de Entrada com um\noutro Item de NF de saída, para ver c"], "691-2": ["Plano de Necessidades de Compras (COMP16) — utilização do sistema na AB", "Relatório Plano de Necessidades de Compras - COMP16.pdf", "E-mail — Assunto: utilização do sistema na AB\n\nPrecisamos de um relatório que está em anexo o modelo, precisamos tirar por modelo, o relatório das\nordens de compras atendidas e o que falta atender de todo o modelo. (uma vez nós falamos sobre mas\nnão lembro como ficou)\nPosição: o que falta vocês encaminhar Pedido de Compras com os fornecedores (ou pendente de analisar o estoque\ne ver que tem o estoque o suficiente), vocês poderão utilizar o Relatório Plano de Necessidades de Compras –\nCOMP16, marcando a opção “Necessidades a Confirmar” (e deixar desmarcado a opção “Necessidades Confirmadas”)...\nNa aba “Seleção”, poderão fazer o filtro adicional por exemplo dos Planos de Produção, e com isso e"], "695-7": ["Posição de Entregas (COMP7) — pedidos de compra, selecionando o plano, gera no relatório", "Relatório Posição de Entregas - COMP7.pdf", "Visto em 051121, contato da AB...precisava gerar no relatório todos os Pedidos de Compra, referente a\ndeterminados Planos de Produção...só que não aparece todos os Pedidos de Compra no Relatório, mesmo que no\nPedido de Compra tenha o tal Plano vinculado...exemplo:\nPedido de Compra tendo o Plano 14...\n\n...não gera no relatório:\n\nMotivo:\n\n[17:23, 05/11/2021] Marcio Schneider: Sobre o Relatório que estivemos falando a pouco...para trazer os dados\nselecionando o Plano de Produção, precisa também ter informação na coluna \"OF\"\n[17:24, 05/11/2021] Marcio Schneider: Em cada entrega do Pedido de Compra.  \n[17:24, 05/11/2021] Marcio Schneider: Voce até pode ser repetido o mesmo numero da OF para o mes"], "698-1": ["Configuração de Email (ADMI265) — contato principal, contas a receber, e-mail cadastrado", "Rotina de Envio de Email, para Pedido de Compras (nova rotina).pdf", "Pedido Serviço: 24460 Solicitação utina ya tiene la funcionalidad de mostrar al final de la orden de compra (pantalla abajo), junto al\nespacio de firmas, queda registrado el usuario/responsable de la liberación, que en este caso pasa a traer, donde\ndice “Kunden”, la Coordinadora de Compras o el Sr. Leonardo Mora, que serán los responsables por las liberaciones,\ny de esta manera al final están certificando esta Orden de Compra. O sea, Kunden no utiliza firmas electrónica, pero\nal final está alineado de acuerdo con padrones que "], "699-0": ["Plano de Produção - Aniger (MPSP14) — forecast só funciona, utilizar em duramas, criado para aniger", "Rotina de Forecast.pdf", "Rotina de Forecast..\n\nAvaliado em 012024, para a visita na Duramas em jan/24:\n-falar do forecast. Posição posterior: não será possível utilizar em Duramas, porque o Forecast só funciona no\nMPSP14 (e não no MPSP5), e no MPSP14 só funciona produtos com controle de Fluxo (criado para Aniger)."], "701-1": ["Plano Abastecimento Materiais (ESTO25) — na GS eu queria poder usar a rotina de Terceirização com a opção que tem na Categoria,…", "Categoria.pdf", "E-mail — Assunto: na GS eu queria poder usar a rotina de Terceirização com a opção que tem na Categoria, que \"Permite\nRemessas de OFs Produzidas\" Bom dia.\nSegue anexo o teste que fizemos juntos, onde funciona apenas no TERC10 mas não no ESTO25:    "], "702-0": ["Transferência entre Localização - Estab (ESTO23) — mat remessa industrialização, tiveram o consumo, rui na multi-seleção", "Controle de Remessa dos materiais que são enviados de maneira excedente.pdf", "Avaliação/implantação feita na Oksebra em 280920, em retreinamento para os usuários..\n\nControle de Remessa dos materiais que são enviados de maneira excedente:\nFazer transferência de Localização 1 para 5 = das qtdes que realmente serão enviados ao atelier.\n\nEstoque fica na Localização na Localização 5:  \nFazer o consumo real na Localização 5\n\nUsar esta opção de “Agrupamento” para mostrar saldos em tela da Localizaç
