râmetro 101 (LIBERAÇÃO AUTOMÁTICA APÓS APONTAMENTO DOS RÓTULOS):\n\nLiberação automática ocorre apenas para quando for apontamento de rótulos (não Apontamento de OF)\nOpção E ou P (LIBERA AUTOMATICAMENTE APÓS PRODUÇÃO DA ENTREGA OU DO PEDIDO) \nNa Brisa, para que não ocorra automaticamente, foi configurado o seguinte:\nPrograma Classificação do Produto (no CEP), que é verificado quando utilizado o programa Revisão, foi desmarcado a opção “Libera Faturamento”."], "89-11": ["APONTAMENTO DE OF: DESENVOLVER ROTINA PARA EFETUAR ENTRADA DE MAIS DE UM PRODUTO PRONTO…", "Apontamento de Produção_e_ Apontamento Rotulos.pdf", "Pedido Serviço 5993:\n\nSolicitação:\nAPONTAMENTO DE OF: DESENVOLVER ROTINA PARA EFETUAR ENTRADA DE MAIS DE UM PRODUTO PRONTO Situação que ocorre:\n- a OF é gerada com determinado produto acabado, porém na conclusão da produção a entrada ao estoque é de\ndiferentes códigos de produtos, de acordocom a classificação do produto.\nExemplo:\nOrdem de Fabricação de couro, onde o produto da OF é Wet Blue \"X\";\nporém na entrada ao estoque vão ocorrer entradas:\nWet Blue III Wet Blue IV Wet Blue V\n...de acordo com as diversas classificações que podem ocorrer.\n\n- Para atender a rotina de custeio:\n- No apontamento: apontar para o produto da OF, fazer saída de transferecia e entrada de transferencia no novo prod"], "89-18": ["Erro que está acontecendo na Estofados, ao tentar apontamento de Talão", "Apontamento de Produção_e_ Apontamento Rotulos.pdf", "Erro que está acontecendo na Estofados, ao tentar apontamento de Talão:\n\n“ORA-20000: Erro OF_PROCESSO_APONT_T.ATUALIZA_OF_PROC_APONT_RESUM:\nORA-01400: cannot insert NULL into (“KUNDEN”.”OF_PROCESSO_APONT_RESUM_ATM”.”RECURSO_ID”)\n\nMotivo: tem haver com o processo configurado como back flush, onde que a mensagem provável é porque tenta\napontar um processo anterior, mas nesta tentativa de apontar o processo anterior há um problema, alguma\nconfiguração faltante ou semelhante."], "89-39": ["row updated, principal e secundaria, lançamentos do cep", "Apontamento de Produção_e_ Apontamento Rotulos.pdf", "Situação no Curtume, que devido Descarte completo das qtdes da OF, não permite mais desapontar o\nprocesso que gerou este descarte:\n\nGera a mensagem abaixo: ORA-20000: Erro REFAZ_OF_P: ORA-01476: divisor is equal to zero\n\nIsso porque está tudo zerado, qtde principal e secundaria...\n\nPorque foi descartado tudo:\nSolução:\n- exclui os lançamentos do CEP manualmente (os lançamentos da tela acima...)\n\nE fiz um update para voltar a ter qtde da OF e permitir excluir:\n\nSQL> [Código: OF_ATM]\n\n1 row updated.\n\nSQL> [Código: OF_ATM]\n\n1 row updated.\n\nCom o estorno do apontamento que consegui fazer a partir do update acima, duplicou a qtde… SQL> [Código: OF_ATM]\n\nE com isso Tive que fazer novo update:\n\nSQL>"], "89-76": ["Apontamento de Ordem de Fabricação (CFAB1) — indicadores no cep, útil em situações, utilizem esta rotina", "Apontamento de Produção_e_ Apontamento Rotulos.pdf", "Verificado em testes na implantação da Smart em 052021, referente a coluna “Controle Indicadores no CEP”, que\nestando marcado para a respectiva Classificação, impacta na seguinte situação:\n\nA rotina faz o Apontamento de Produção (gerando o SKU), faz a entrada ao Estoque desta qtde, e na sequencia já faz\numa saída de estoque automaticamente.\nPode ser útil em situações na qual se quer registrar a produção efetuada (mesmo que de um produto com\nproblemas, como Retalhos na Smart), mas não se quer controlar no estoque estas qtdes (é o caso na Smart).\n\n(imagino que na Brisa também utilizem esta rotina) Exemplo:\n\nAqui configurado o cadastro do programa de Apontamento, com a Classificação 3...\nClassi"], "89-77": ["Apontamento de Ordem de Fabricação (CFAB1) — semana do ocorrido, excedentes de produção, assunto que falamos", "Apontamento de Produção_e_ Apontamento Rotulos.pdf", "-Detalhe avaliado do processo da Revisão feito na Brisa, em 110621 junto com Deisy, para uma avaliação de uma\nsituação da Smart...então visto que a Brisa efetua da seguinte maneira, para excedentes de produção de Caixas/Rolos/SKUs:\n\nO programa Revisão em Delphi permite qtdes excedentes pelo apontamento de caixas da Revisão até atender ao\nlimite do pedido...ou seja, pode ter um excedente, mas só se for o excedente da ultima caixa revisada...(não\npodendo revisar mais caixas vinculadas a tal entrega de Pedido, se a qtde total já foi atingida)...ver no .doc  \n“Brisa_Programa Revisão” as mensagens questionando ao usuario se quer revisar o excedente para o\nEstoque/Disponível. Ver abaixo posição qu"], "89-89": ["Exercício Fiscal / Período de Lançamentos (ADMI53) — Verificar o motivo do erro ao apontar OF, sendo que o pedido possui valor unitário", "Apontamento de Produção_e_ Apontamento Rotulos.pdf", "Pedido Serviço: 61764 Cliente: Wellour Solicitação:\nVerificar o motivo do erro ao apontar OF, sendo que o pedido possui valor unitário.\n\nMensagem : KND-003374  Documentação:\n\nAdministração Configuração Exercício Fiscal Detalhamento:\nAjustado o programa de Exercício Fiscal (ADMI53) para somente permitir a criação de um exercício fiscal com duração\nde um ano, iniciando em Janeiro e terminando em Dezembro.\n\nObservação:\nIdentificamos que o cliente tinha 2 exercícios fiscais para o ano de 2023. Um deles era somente do mês de janeiro e o\noutro do mês de fevereiro a dezembro. Via banco, arrumamos para que exista somente um periodo de exercício fiscal\npara o ano de 2023.\n\nEm testes feitos por Robert"], "89-94": ["Apontamento de Ordem de Fabricação (CFAB1) — APONTAMENTO DE ORDEM DE FABRICAÇÃO/TALÃO/LOTE - AJUSTAR APONTAMENTO DE OF DE PRODUTO QUE…", "Apontamento de Produção_e_ Apontamento Rotulos.pdf", "Pedido Serviço: 60321 Cliente: Aniger Solicitação:\nAPONTAMENTO DE ORDEM DE FABRICAÇÃO/TALÃO/LOTE - AJUSTAR APONTAMENTO DE OF DE PRODUTO QUE CONTROLA LOTE Rotina:\n\nManufatura Chão de Fábrica Lançamentos\nApontamento de Ordem de Fabricação/Talão/Lote Alteração:\n\n1.Ajustar Apontamento de OF de produto que controla lote - reservar somente a quantidade necessária para o\nplano, restante deve ir para o disponível.\n\nApontamento de OF de produto que controla lote, precisa ajustar para reservar somente a quantidade necessária\npara o plano, restante deve ir para o disponível.\nExemplo base demo: Plano criado com dois compostas diferentes de 70 kg cada, um com controle de lote e outro\nnão. Ambos também nã"], "89-103": ["Apontamento de Ordem de Fabricação (CFAB1) — apontamento de ordem, preparada para receber, apenas um recurso", "Apontamento de Produção_e_ Apontamento Rotulos.pdf", "Pedido Serviço: 66086 Cliente: Planet Solicitação:\n\nROTINA:\nManufatura Chão de Fábrica Lançamentos\nApontamento de Ordem de Fabricação (CFAB1) ALTERAÇÃO:\nCorrigir mensagem de erro KND-000793 no apontamento de Ordem de Fabricação para o recurso 2 (INJEÇÃO HORIZONTAL) \nMensagem abaixo: “APONTAMENTO_PRODUCAO.RETORNA_RECURSO: ORA-06502: PL/SQL: numeric or value error:\nCharacter to number conversion error”   Documentação:\nManufatura Chão de Fábrica Lançamentos\nApontamento de Ordem de Fabricação (CFAB1) Detalhamento:\nNada feito.\n\nObservação:\nA lógica não está preparada para receber mais de um recurso para o mesmo agrupamento de informações.\nDeve ser cadastrado apenas um recurso no parâmetro 81.\n\nCa"], "89-105": ["Estorno Apontamento de Ordem de Fabricação (CFAB10) — Importante vc fazer constar no seu pedido de serviço nro 66591 (EVOLUÇÕES NO PROGRAMA…", "Apontamento de Produção_e_ Apontamento Rotulos.pdf", "E-mail — Assunto: Importante vc fazer constar no seu pedido de serviço nro 66591 (EVOLUÇÕES NO PROGRAMA ESTORNO\nDE ORDEM DE FABRICAÇÃO ¿ CFAB10.):\n\nImportante vc fazer constar no seu pedido de serviço nro 66591 (EVOLUÇÕES NO PROGRAMA ESTORNO DE ORDEM\nDE FABRICAÇÃO ¿ CFAB10.):\n\nA rotina a ser desenvolvida, permitindo fazer o Estorno de Apontamento informando o Plano, não deverá gerar\nmensagem de erro/de validação da mensagem “KND-000290”, quando alguma(s) da(s) OFs de tal Plano não tenham apontamento para desapontar...\nOu seja, não poderá gerar esta mensagem KND-000290 como que é gerada por exemplo na tela abaixo...\n\nNestes casos, para este desenvolvimento novo, quando informado um Plano de P"], "89-106": ["Apontamento de Ordem de Fabricação (CFAB1) — ROTINA DE APONTAMENTO DE PRODUÇÃO, DE PRODUTO COM CONTROLE DE LOTE + CONFIGURAÇÃO DE", "Apontamento de Produção_e_ Apontamento Rotulos.pdf", "Pedido Serviço: 65845 Cliente: Kunden Solicitação:\nROTINA DE APONTAMENTO DE PRODUÇÃO, DE PRODUTO COM CONTROLE DE LOTE + CONFIGURAÇÃO DE\nCONTROLE DE UNIDADE SECUNDARIA NO ESTOQUE + CONFIGURAÇÃO PARA RESERVAR NO APONTAMENTO DE\nPRODUÇÃO: AJUSTAR A ROTINA Rotina:\n\nManufatura Chão de Fábrica Lançamentos\nApontamento de Ordem de Fabricação/Talão/Lote Alteração:\n\n1. Rotina de Apontamento de Produção, de Produto com Controle de Lote + configuração de controle de\nUnidade Secundaria no Estoque + configuração para Reservar no Apontamento de Produção: ajustar a rotina.\n\n1.1. O que ocorre:\n-Nestas condições citadas acima, a rotina não está gerando o Lote;\n-Também gera mensagem indevida KND-004784 na tenta"], "89-107": ["Apontamento de Ordem de Fabricação (CFAB1) — APONTAMENTO DE ORDEM DE FABRICAÇÃO - AJUSTAR ERRO AO APONTAR OF QUANDO POSSUI PEDIDO…", "Apontamento de Produção_e_ Apontamento Rotulos.pdf", "Pedido Serviço: 67100 Cliente: HK Solicitação:\nAPONTAMENTO DE ORDEM DE FABRICAÇÃO - AJUSTAR ERRO AO APONTAR OF QUANDO POSSUI PEDIDO RESERVANDO ESTOQUE FUTURO ROTINA:\n\nManufatura Chão de Fábrica Lançamentos\nApontamento de Ordem de Fabricação/Talão/Lote ALTERAÇÃO:\n\nAjustar erro ao apontar OF quando possui pedido reservando estoque futuro, na base de testes do cliente.   Gerou mensagem  “ORA-20000: Erro ATUALIZA_RESERVA_PP_P.INCLUSAO.ESTOQUE_FUTURO.INSERE_ATUALIZA_NOVA_ENTREGA:\nORA-01400: cannot insert NULL into (“ATM”.”PEDIDO_VENDA_ENTREGA_ATM”.“CATEGORIA_PEDIDO_ENTREGA_ID”)” Documentação:\nManufatura Chão de Fábrica Lançamentos\nApontamento de Ordem de Fabricação/Talão/Lote Detalhamento:\nAdicio"], "89-108": ["Apontamento de Rótulos (Processo (CFAB22) — Gravar as OFs no rótulo mesmo não sendo tipo cálculo base rótulo Rotina", "Apontamento de Produção_e_ Apontamento Rotulos.pdf", "Pedido Serviço: 66273 Cliente: Atta Solicitação:\nGravar as OFs no rótulo mesmo não sendo tipo cálculo base rótulo Rotina:\n\nVendas e Distribuição Faturamento Rótulos\nGera Rótulos Unidades Armazenamento Alteração:\n1. Criar botão ¿Gerar/Atualizar¿ no programa FATU16 na aba Pedidos/Entregas.\n1.1. Botão servirá para gerar rótulos, porém, só para itens que ainda não foram gerados e gravar em tabela filha\nde rótulo as OFs e quantidades de cada OF vinculadas a ele.\n1.2. Quando rótulo já gerado, somente verifica se já tem vínculo das OFs na tabela filha (item 1.1), caso tenha,\nnada faz, caso não tenha, deve atualizar estes dados. Este botão não poderá gerar novos rótulos no item (para gerar\nnovos, de"], "89-112": ["CFAB169 — ficou registrado, depois da meia-noite, hora de apontamento", "Apontamento de Produção_e_ Apontamento Rotulos.pdf", "Avaliação em 180226, para o desenvolvimento do Pedido Serviço Pegada para “Criar Painel de Produção e Painel de\nLançamentos de CEP Web, detalhado por Faixas Horárias e Resumos dos Eventos de CEP” (tema do RA 251010030:\nhttps://kundencloud.com.br:3825/atendimento?id=251010030&callType=customer\n\nAvaliado e a rotina considera para o “dia” anterior, algo que é apontado depois das 00:00 (depois da meia-noite) cujo\nturno começou no dia anterior.\n\nExemplo:\nAbaixo mostra a data/hora de Apontamento como sendo 130226, 00:16:31, e na parte de cima do relatório mostra data = 120226...\n\n-Veja que a Data do Apontamento ficou registrado no dia anterior à data que foi apontada em horário\ndepois das 00:00 hr"], "90-0": ["Apontamento de Rótulos (Processo (CFAB22) — CFAB22 - Verificar apontamento de rótulos, onde o rótulo não vinculou a nenhuma OF mesmo o", "Apontamento de Rótulos – CFAB22.pdf", "Apontamento de Rótulos – CFAB22..\n\nPedido Serviço: 68135 Cliente: Atta Solicitação:\nCFAB22 - Verificar apontamento de rótulos, onde o rótulo não vinculou a nenhuma OF mesmo o\npedido estando no plano.\n\nRotina:\n\nManufatura Chão de Fábrica Lançamentos Apontamento Rótulos Alteração:\nApontamento não encontra processo, pois o rótulo não possui vinculo a nenhuma OF , mesmo o\npedido estando vinculado ao plano.\nGera Mensagem KND-000249 - Processo (:A) inexistente para a ordem de fabricação (:B).\n\nNo anexo:  Documentação:\n\nManufatura Chão de Fábrica Lançamentos Apontamento Rótulos Detalhamento:\nApós análise, foi verificado que não possuía registro na tabela ROTULO_OF_ATM para os rótulos, com isso, foi"], "90-1": ["Apontamento de Rótulos (Processo (CFAB22) — Erro apontamento expedição referente a saldo do processo anterior, onde existe saldo e…", "Apontamento de Rótulos – CFAB22.pdf", "Pedido Serviço: 68929 Cliente: Atta Solicitação:\nErro apontamento expedição referente a saldo do processo anterior, onde existe saldo e deveria apontar.\n\nRotina:\n\nManufatura Chão de Fábrica Lançamentos Apontamento Rótulos Alteração:\nAjustar rotina de apontamento de rótulo que está gerando erro de saldo do processo anterior, sendo\nque ele tem saldo baixado e deveria permitir apontar.\n\nExemplo:\nO processo montagem já foi apontado total, ou seja, para apontar a expedição tem saldo de sequenciamento corretamente.\n\nMas ao apontar, gera o erro KND-000304 como se não tivesse o saldo.  Documentação:\n\nManufatura Chão de Fábrica Lançamentos Apontamento Rótulos Detalhamento:\nNada foi desenvolvido.\n\nObs"], "91-1": ["Apontamento de Rótulos (CFAB65) — APONTAMENTO DE ROTULOS: NOVAS COLUNAS E AVISOS", "Apontamento de Rótulos com Consulta - CFAB65.pdf", "Pedido Serviço: 12027 Solicitação:\nAPONTAMENTO DE ROTULOS: NOVAS COLUNAS E AVISOS\nAdicionar as seguintes colunas no programa:\n- Cliente do pedido de venda;\n- Nº do pedido de venda* - Status**\n- Rotulo 1/4,2/4... 4/4\n- Semana: código/numero dela\n- Data inicial da semana\n- Data final da semana\n\n* Abrir consulta do mesmo (não permitir alteração só consulta)\n** Em relação ao status: enquanto não fechado todos os rótulos do pedido, o pedido fica \"em aberto\", quando\napontado todos os rótulos do pedido, status fica OK e gerar mensagem tela confirmando que todos os rótulos do pedido foram apontados.\n\nDocumentação:\nNovas Mensagens:\n- KND-002835: Pedido com Rótulos em aberto;\n- KND-002836: Pedido sem "], "93-0": ["Emissão de Etiqueta por Unidade de Produto por Plano de Produção (PEDI7) — APONTAMENTO DO PAR: DESENVOLVER A ROTINA DE APONTAMENTO DO PAR A PAR", "Apontamento do Par.pdf", "Apontamento do Par..\n\nPedido Serviço 3582 Solicitação:\nAPONTAMENTO DO PAR: DESENVOLVER A ROTINA DE APONTAMENTO DO PAR A PAR.\n\nNecessário também:\n- impressão de etiqueta do par;\n- programa de apontamento, via coletor;\n- relatório que mostre os dados da tabela de par e situação de apontamento.\n\nNecessário avaliar rotina existente na V3, e desenvolver as mesmas funcionalidades.\n\nSobre a impressão da etiqueta do apontamento do par:\nA empresa utiliza a versão V3, o programa Emissão Etiquetas p/ Apontamento, com classificação DATAMAX\nObservar a alteração efetuada no Pedido serviço 3209:Alterar ordem de impressão das etiquetas:\npassar a impressão para a seguinte ordem:\nOrdem de Fabricação, largura,"], "93-7": ["Pedidos de Venda (PEDI1) — Henrich - Etq unidade de produto Bom dia", "Apontamento do Par.pdf", "E-mail — Assunto: Henrich - Etq unidade de produto Bom dia\n\n1º: Verifiquei que nesta tabela ETIQUETA_UNIDADE_PRODUTO_ATM é necessário ter vinculo com Plano e OF.\n\n2º: acho que temos que fazer assim então, conforme abaixo:\nfiz um teste na sua BD (e já exclui o teste)...telas abaixo:\n\n-pesquisei um produto de Exportação que não tinha informações na tabela ETIQUETA_UNIDADE_PRODUTO_ATM;\n\n- Fiz um Pedido de Venda, e um Plano de Produção;\n\n-gerei a etiqueta no programa de Emissão de Etiqueta (visualizei em tela);\n\n-a partir de então gerou os dados na tabela ETIQUETA_UNIDADE_PRODUTO_ATM;\n\n- sugiro então depois disso ir no programa Cancelamento de Entrega Pedido - com Atualizar MRP (tela 4 abaixo),\n"], "95-5": ["Apontamento de Ordem de Fabricação (CFAB1) — campos: Classificação, Produto Destino, Características", "Classificação_Curtumes.pdf", "Pedido serviço 19839:\n\nDIVERSOS: CRIAR O CADASTRO \"CLASSIFICAÇÃO\" PARA SER VINCULADO NA ESTRUTURA DO PRODUTO. TRATAR RELATÓRIOS Manufatura\nEngenharia e Desenvolvimento de Produto Cadastros Classificação (cadastro novo) Engenharia Estruturação de Produto Chão de Fábrica Relatórios de Produção\nRelatório de Produção da Classificação - Análise da Classificação - CFAB79\nRelatório Analise de Compras Matéria-Prima Couro / Fornecedor - CFAB101\nRelatório da Ficha Técnica, programas EPRO34 E EPRO35_CURTUME ALTERAÇÃO: \n1=Criar cadastro novo \"Classificação\":\nNeste cadastro serão cadastradas as classificações utilizadas pelos curtumes.\nExemplo:\nTR1 TR2 TR3 IV V VI VII\n\n2= Na Estruturação de Produto, Fich"], "96-0": ["Descritivos Técnicos (EPRO54) — descritivos técnicos, relatório epro curtume, emissões de ofs", "Descritivos Técnicos – EPRO54.pdf", "Descritivos Técnicos – EPRO54..\n\nExemplo de utilização do programa Descritivos Técnicos – EPRO54:\n\nVinculado no EPRO15...\n\n...e passa a gerar no Relatório EPRO34/ EPRO35_CURTUME  \n...e em emissões de OFs: "], "97-1": ["CFAB19_CURTUME - Emissão de OF (CFAB19) — EMISSÃO DE OF: ADEQUAR A IMPRESSÃO DA OF (CAMPOS, LAYOUT)", "Emissão de OF Curtume.pdf", "E-mail — Assunto: Alexis, precisava que você orçasse um Pedido de Serviço Especificação para AKS...\n\n...tendo como base a mesma funcionalidade já existente neste pedido de serviço 8328 abaixo...(Só a funcionalidade\nque está em vermelho) Pedido Serviço: 8328 Solicitação:\nEMISSÃO DE OF: ADEQUAR A IMPRESSÃO DA OF (CAMPOS, LAYOUT)\nAdequar a impressão da OF (campos, layout). Possivelmente versões diferentes de acordo com produto (Estofamento, tapetes,...) Documentação:\nEMISSÃO ORDEM DE FABRICAÇÃO (CFAB7)\nRelatório Emissão de Ordem de Fabricação Tapetes (CFAB19_MINUANO_TAPETES):\nEste relatório possuirá três páginas de informações distintas.\nA página 1 possuirá é baseada nos processos da ordem de f"], "97-8": ["CFAB19_CURTUME - Emissão de OF (CFAB19) — materiais baixados, parâmetro inicialização componente, marcar este check", "Emissão de OF Curtume.pdf", "os no Estoque”, é necessário que...\n\n...é necessário que:\n- parâmetro inicialização COMPONENTE_CODIGO esteja de acordo... \nSe marcar este check box (NÃO PODE), também é impresso desconfigurado, porque traz o campo “Detalhe Técnico\nPedido varias vezes, e não imprime o bloco “Materiais baixados no Estoque”:\n\nE para imprimir estar versão do relatório a partir do programa de Abastecimento ESTO112, que imprima de maneira\ncorreta e como acima, com o bloco “Materiais baixados no Estoque”, é necessário o parâmetro OF_MEDIÇÃO estar N."], "97-9": ["Parâmetros de Inicialização (ADMI125) — [Imagem: ADMI6 | CFAB7] [Imagem: CFAB19 | ESTO112] [Imagem: ADMI125 | ADMI6 | ESTO112]…", "Emissão de OF Curtume.pdf", "Pedido Serviço: 21030 Solicitação:    Manufatura Chão de Fabrica Relatórios de Produção\nEmissão de Ordem de Fabricação - CFAB19_AMC ALTERAÇÃO\nCampo \"Fator\" foi assim definido no pedido 20315 (pedido na qual foi criada esta nova versão de impressão):\n\"O Campo Fator deverá vir do campo Insumo Bruto do tipo de formula que estiver cadastrada no parâmetro de inicialização sua categoria\".\nNeste rotina faltou considerar que este parâmetro de inicialização CATEGORIA_PRODUTO_FORMULA% pode (e\nprecisa) ser cadastrado diversas vezes para as diversas\nCategorias de Formulas de um produto acabado: isso é necessário para que as diversas formulas sejam impressas\naos seus respectivos processos.\nMas o campo \"F"], "97-15": ["Programas (ADMI6) — Exemplo de utilização do programa Descritivos Técnicos – EPRO54", "Emissão de OF Curtume.pdf", "Exemplo de utilização do programa Descritivos Técnicos – EPRO54:\n\nVinculado no EPRO15... \n...e passa a gerar no Relatório EPRO34/ EPRO35_CURTUME  \n...e em emissões de OFs:"], "100-0": ["Implantação de Saldo (ESTO2) — ocorrer o procedimento, devolução de empréstimo, primária e secundária", "Empréstimo no produto couro com controle de Lote.pdf", "Empréstimo no produto couro com controle de Lote..\n\nSituação original:\nConsumi tudo...zerou qtdes em estoque:\n\nFui ao mercado e compramos qtde desta material...\n\nUsando o programa gerador de devolução:\n\nGerou esta NFS:    \nConclusão: há problema...esta alternativa não funciona, não tem tratativa.\n\nNovo teste, informando manualmente o Lote que se tem estoque, e não o que tem vinculo com doc referencia:\n\nConclusão: também há problema...esta alternativa não funciona, não tem tratativa.   Zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz\n\nAlternativa pensada: pelo programa de Reclassificação não dá...não permite entrada ao Lote original...\n\n2ª alternativa:\n\nFazer requisição informada e impla"], "101-4": ["Estruturação do Produto (EPRO15) — pistolar cobertura, possível incluir, revisar a partir", "Estruturação de Produto_Curtume.pdf", "\nAvaliação feita em 271023 na Krumenauer, em função da implantação na Curpisco...referente se é possível incluir +\nde 1 vez o mesmo Processo na aba Manufatura...\nsegue avaliação abaixo...\n\nAqui exemplo Krumenauer em que utilizam o mesmo Processo + de 1 vez no mesmo produto...ver abaixo o Processo 49:\n\nEste select mostra a qtde de Produtos que tem o mesmo Processo mais de 1 X no mesmo Produto (detalhe: talvez\nparte dos registros encontrados, um destes Processos que estaria “duplo” na real está Inativado): [Código: PRODUTO_PROCESSO_ATM]\n\nEstes abaixo para revisar a partir do dado encontrado acima: [Código: PRODUTO_ATM PROCESSO_ATM]\n\n(ao que parece é possível é possível incluir + de 1 vez o mes"], "101-8": ["EPRO09 — sequencia de apontamento, obriga vezes, habilitar", "Estruturação de Produto_Curtume.pdf", " \nPara habilitar este campo “Sequencia de apontamento.” dentro do campo “Processo” na Lista de Material...\n\n...é necessário o parâmetro de inicialização “OBRIGA_VEZES_PROCESSO” do EPRO15 estar S\n\n...aqui uma BD nova: "], "102-1": ["Apontamento de Ordem de Fabricação (CFAB1) — Novo fluxo testado na BD Desenvolvimento, e avaliado com Claudemir", "Flujo_fresco a WB.pdf", " \nNovo fluxo testado na BD Desenvolvimento, e avaliado com Claudemir:\n- exemplo OF 409343\n- recebem o couro verde/salgado;\n- marcam o couro com “Marca”...utilizando marca com 4 algarismos...sendo o 1º a letra do fornecedor, e os 3\núltimos um numero sequencial de controle manual...para cada dia um novo numero de 3 digitos, sendo o mesmo\nnumero para os diversos fornecedores que vão entregar neste dia.\nExemplo:\nA082 B082 O082\n- fazer o lançamento da NF Entrada, sendo que o item couro terá que ter registrado:\nA marca, junto a aba do Lote, informando manualmente;\nO numero do Lote será gerado automático.\n- cadastrar o LE.\nQtde: indiferente, porque vai se ajustar de acordo com a qtde de abastecimen"], "103-0": ["Estruturação do Produto (EPRO15) — formulas de acabamento, gerar as ofs, mesma formula", "Formulas de Acabamento.pdf", "Formulas de Acabamento:..\n\n(IMPORTANTE SOBRE O ABAIXO...VER NOVA DEFINIÇÃO NA PAG 18, “Novo Teste agora, em 05102016”) Teste em 250816\nMotivo do teste: comprovar que é possível usar um processo padrão “Mistura” vinculado à formula de\nacabamento...desta maneira facilitando o cadastramento das formulas de acabamento.\nPor exemplo neste caso é possível configurar padrão no processo “Gerar Produto Pronto = SIM”...e não se precisa\npreocupar em utilizar o mesmo processo que é utilizado no produto acabado.\nTambém com isso não necessário se preocupar com o processo que depois será utilizado para consumir tinta, no\nproduto acabado....(não se precisa utilizar o mesmo processo que se consome a tinta...o"], "103-1": ["Emissão Ordem de Fabricação (CFAB11) — Este abastecimento corrigiu qtde da OF", "Formulas de Acabamento.pdf", "Este abastecimento corrigiu qtde da OF:  \nGerou estas qtdes de tintas: BAIXADO?? (posteriormente arrumado isso...era outro problema).\n(qtdes calculadas está OK) Aqui gerou OK:  \nGerou OK a OF:\nDetalhe: veja que na OF 410143 tem (MA), e por isso a qtde de ingredientes somando é maior que a qtde da\nformula...é que na real este (MA) não será utilizado...ou deixará de ser utilizado o titular que é o 34925.1\n\nEm seguida, apontar/baixar as OFs:      Mensagem KND-002718\n\nCom isso ocorreu a geração da OF e o consumo da tinta:  \nVãos para a parte de consumo de Materiais (pós o OK na mensagem na 3ª tela acima)   \nOcorreu o consumo dos materiais:\n\nAqui, mostrando o consumo gerado às OFs: está OK...apen"], "103-4": ["Consulta Ordem de Fabricação (CFAB2) — ofs de tinta, mesma formula, sempre era diferente", "Formulas de Acabamento.pdf", "Situação vista em 03/2017, na tentativa de fazer um passo a passo para PDS.\nConstatado que, na geração da Ofs de tinta, a rotina ao que parece nunca gerou agrupado a tinta, quando as OFs de\nacabado são de Planos diferentes...\n\nResolvi deixar assim de momento, até que alguém de fato utilize.\n\nMas há uma avaliação prévia da situação, cfe abaixo:\n\nMPSP46 tem uma situação que acho que sempre era diferente...e que agora está fazendo de um jeito que não deveria...  \nVocê poderia dar uma olhada nesta parte do programa?\n\nSeguinte:\nFormulas de Acabamento, quando se usa o botão “Gerar OF”.\nQuando se tem 2 ou mais OFs de acabado que necessitam da mesma formula, e se gera numa tacada só...exemplo tela a"], "103-12": ["Emissão Ordem de Fabricação (CFAB11) — sequencia no assunto formulas de acabamento Marcelo,", "Formulas de Acabamento.pdf", "E-mail — Assunto: sequencia no assunto formulas de acabamento Marcelo,\n\nEm anexo, passo a passo para utilizar a rotina de Formulas de Acabamento, segundo a necessidade que foi nos\ncolocado em reunião, aí na Amcm, em 13/09/17.\n\nAmcm_rotina_Formulas_Acabamento\n\nCadastro da “formula base” com suas resinas... \nCadastro da “formula final” com seus pigmentos/corantes...\n\nVincular primeiramente no produto acabado a formula “Base”...isso porque não se tem a informação da fórmula\nfinal quando se cadastra o produto acabado. O insumo é o “correto”, dentro da “Media” que área de acabamento estabeleceu. \nNo exemplo abaixo, é 350 gramas por M2 e couro.\nOu 0,350 kg/m2\n\nÉ efetuado o pedido de venda:\n\nAgora "], "103-16": ["Estruturação do Produto (EPRO15) — Para que funcione bien grabar el código y secuencia de Proceso en las Formulas (asunto…", "Formulas de Acabamento.pdf", "E-mail — Assunto: Para que funcione bien grabar el código y secuencia de Proceso en las Formulas (asunto que miramos juntos ayer),\ntiene que hacer el catastro así, por favor:\n\nEn el 1º material incluido en la formula (en la 1ª línea), llenar el Componente, después seguir (seguir con la tecla TAB\nde la computadora) para la derecha de los próximos campos…\n\n...y al llegar en el campo “Proceso”, tiene que abrir la Lista de Procesos (haga clic en el botón de la fleja azul),\nseleccionar con 2 clics este proceso que muestra en esta pantalla “Lista de Procesos”… \n...después, luego en seguida guardar con la tecla F10 o clic en el botón de la imagen abajo, y con eso está listo.\n\nLas próximas líneas el"], "104-2": ["Componente (EPRO14) — Preciso para esta semana que vc teste na BD Desenvolvimento a seguinte rotina Bom dia,…", "Formulas de Recurtimento.pdf", "E-mail — Assunto: Preciso para esta semana que vc teste na BD Desenvolvimento a seguinte rotina Bom dia, Cali,\nPreciso para esta semana que vc teste na BD Desenvolvimento a seguinte rotina, e abra pedido de serviço de erro\npara ajustar a situação tela abaixo.\n(problema que eu vi ocorrer na BD Oficial Amcm)\n\nProblema: a rotina da Lista de Materiais não está sugerindo/gravando o Processo/Sequencia no Material, apesar das\nconfigurações da rotina estarem de acordo.\n(ocorre quando se inicia uma Lista de Materiais do zero, sem ser por cópia de outro “produto”)\n\nAqui nesta tela, mostra a inclusão de um novo material na Lista de Materiais...(detalhe: nos materiais acima deste,\ntambém já não foram su"], "104-6": ["Programas (ADMI6) — fator conversão, vinculadas no produto, qtde de químicos", "Formulas de Recurtimento.pdf", "Visto em 200123 além das recomendações já vistas acima, extensão da avaliação logo abaixo, visto que Krumenauer\ntem configurado assim o campo “Fator Conversão” da tela Abastecimento...  \n...que é para que seja sugerido assim aqui nas formulas: todos os materiais das formulas (e agua e demais\n“processos”) tem o campo Fator Conversão = 100, que é para gerar corretamente as qtde de químicos...\n\n...olhando esta situação no Nimo: é o mesmo, veja...\nA esquerda, não está definido o Fator Conversão 100 no nível superior, mas todos os materiais tem a definição do\nFator Conversão 100 como no exemplo...\n...e na Formula, mostra este Fator Conversão 100 que é sugerido da aba de Abastecimento:\n\nVisto em 2"], "104-7": ["Emissão Relatório (ESTO81) — campos: Materiais, QTD, Alterar Produto, Quantidade", "Formulas de Recurtimento.pdf", "...aí no relatório, acessado a partir do acima, inclusive mostra aqui a “pesagem” como estes 546,875 KG:\nSelecionando acima e clicando no botão “Materiais” do acima, abre esta tela... \nVER com Krumenauer SE UTILIZAM A OPÇÃO DO “GERAR PLANO ABAST”....:\nPosição de Joziel é de que não utilizam.\n\n...Ver abaixo que o campo “QTD. PESAGEM” mostra os 546,875 KG:\n\nVER SE ESTE É O CONCEITO DA PESAGEM...:  \nPosição de Joziel: sim, assim mesmo.\nVER SE USAM ASSIM PARA CALEIRO E CURTIMENTO...:\nPosição de Joziel: Não efetuam mais Caleiro, mas Curtimento sim, e é assim mesmo.\n\nCfe verificado: utilizam a opção abaixo para:\n-Trocar formula, selecionando no check box da direita e clicando no botão “Alt zzzzzzzzzz Fiz os consumos:   OF ficou assim:\n\nAponamento final: OK:  Ficou OK, produzido: "], "112-3": ["Alteração Lista Material de Produtos (EPRO39) — Para FPV: tem que informar o % de rendimento previsto", "MP_Materia Prima_na Engenharia e geração necessidades.pdf", "Para FPV: tem que informar o % de rendimento previsto:\n\nCfe desenvolvimentos efetuado no FPV, teria que tratar a situação (pedidos serviço de Douglas,...).  "], "113-3": ["Acompanhamento de Pedidos - Curtume (PEDI128) — pós abastecimento, apontamento final, faturamento cfe", "Relatório Acompanhamento de Pedidos – Curtume – PEDI128.pdf", "Sessão de Testes para ver como o relatório se comporta, pós abastecimento e ajuste na qtde da OF, pós\napontamento final e pós faturamento:\n\nQtde da OF: qtde original era 100 (qtde do Pedido de Venda)...\n\nOK aqui pós abastecimento: \nOK aqui após apontamento final acima:   OCORREU A EMISSÃO:\n\nVEJA QUE OK os dados: qtde de faturamento cfe foi produzido e em seguida faturado: "], "114-1": ["Analise de Abate Frigorifico - 33443 (CFAB101) — ROTINA Manufatura Chão de Fábrica Relatórios de Produção", "Relatório Analise de Compras Matéria-Prima Couro - Fornecedor – CFAB101.pdf", "Pedido Serviço: 16793 Solicitação:\nROTINA Manufatura Chão de Fábrica Relatórios de Produção\nRelatório - Analise de Compras Matéria-Prima Couro / Fornecedor ALTERAÇÃO\n\nCriar relatório para se poder analisar o resultado da compra de Matéria-Prima Couro mesclando dados imputados no\nprograma de Inspeção Recebimento e Apontamento de OFs no que diz respeito ao encerramento da OF utilizando a\nentrada de Múltiplos Produtos em estoque já utilizados no relatório de produção por classificação (programa CFAB79).\n\nPara gerar o relatório a NF de compra deverá dar entrada em estoque e deverá ser emitida uma (s) OF (s) para\nretirar o couro do estoque e encerrar a mesma dando entrada novamente no estoque com"], "114-3": ["Analise de Abate Frigorifico - 33443 (CFAB101) — fiscal de entrada, exibir s, e o turno registrado no calendário de Recursos\ntermina às 17:18, porém o Recurso trabalhou, terminou a OF e apontou o final desta OF só as 19:18, o relatório\nconsidera tudo como “Hora Normal”, sendo que neste caso, seriam 2 horas extras.\n\n-outra questão que levantamos e ficamos na duvida:\nQuando a OF inicia num dia e termina no outro dia:\nQuando não há um registro intermediár"], "118-1": ["Extrato Máquina (CFAB96) — evento de parada, relatórios gerenciais extrato, incluir a coluna", "Relatório de Extrato por Maquina – CFAB96.pdf", "E-mail — Assunto: RELATORIO\n\nQuanto ao relatório Extrato Máquina, tem a opção de poder fazer um lançamento de evento de parada no final do\nexpediente e inicio no outro dia, para poder gerar com as horas corretas de tempo que foi produzida a OF. Segue\nanexo documento explicando essa rotina.\n\nDeve ser criado um evento de parada\n\nApós efetuar o apontamento inicial da OF, digitando o recurso, é possível ver o que tem naquele recurso \nSuponhamos que seja final de turno, e a OF ainda não ficou concluída, então, deverá ser lançado o evento de parada, conforme abaixo.\n\nSe for reconsultar o recurso, já mostrará o evento. \nNo dia seguinte ao iniciar o expediente, deverá consultar o recurso e digitar “"], "118-5": ["Extrato Máquina (CFAB96) — PROGRAMA RELATÓRIO EXTRATO MÁQUINA ¿ CFAB96: REVISAR MENSAGEM DE ERRO Rotina", "Relatório de Extrato por Maquina – CFAB96.pdf", "Pedido Serviço: 60733 Cliente: Aniger Solicitação:\nPROGRAMA RELATÓRIO EXTRATO MÁQUINA ¿ CFAB96: REVISAR MENSAGEM DE ERRO Rotina:\nManufatura Chão de Fábrica Relatórios Gerenciais Extrato Maquina  Alteração:\nPrograma Relatório Extrato Máquina ¿ CFAB96: revisar mensagem de erro ao tentar gerar os dados no relatório, na BD Aniger HML.\nMensagem “ORA-20000: Erro GERA_MANUFATURA_181TMP_P: ORA-01847: day of month must be...” Documentação:\nManufatura Chão de Fábrica Relatórios Gerenciais Extrato Máquina Detalhamento:\nAjustado.\nObservações:\nA rotina não considerava mento (CFAB78) — ROTINA Manufatura Chão de Fabrica Relatórios de Produção", "Relatório de Rendimento - CFAB78.pdf", "Pedido Serviço: 16464 Solicitação:\nROTINA Manufatura Chão de Fabrica Relatórios de Produção\nRelatório de Rendimento (CFAB78)\nRelatório de Rendimento com Custos Gerenciais (CFAB85) ALTERAÇÃO\n\nO relatório, quando a OF tenha uma operação (processo) que esteja gravando o campo medição, que irá atualizar a\nquantidade da OF, através do Pedido Serviço 16723, as quantidades base para cálculo de rendimento que deverão\nser listadas na coluna ENTRADA deverão ser as quantidades da OF e não as quantidades da matéria-prima Couro\nbaixados do estoque. Caso não tenha uma operação (processo) que exija uma quantidade no campo medição os\ndados a serem listados no campo ENTRADA deverão ser o padrão do relatório."], "120-7": ["Relatório de Rendimento (CFAB78) — unidade primaria metragem, problema de duplicação, custos e rendimento", "Relatório de Rendimento - CFAB78.pdf", "Problema de duplicação e/ou qtde de unidade primaria/metragem maior (de Medição) que a realmente abastecida:\n\nAnexo (do cliente) deste protocolo:\n\n“OF 16395 METRAGEM ABASTECIDA ESTÁ CORRETA MAS NO RELATORIO DE CUSTOS E RENDIMENTO APARECE\nOUTRA METRAGEM QUE NÃO FOI ABASTECIDA! ”   Zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz Motivo:\nInicialmente foi aberto pedido serviço 24243 por Cali, para que:"], "120-8": ["Relatório de Rendimento (CFAB78) — apontamento medição, rotina está somando, vinculo link direto", "Relatório de Rendimento - CFAB78.pdf", "ROTINA:\n\nSuprimentos\nPlanejamento Necessidade de Materiais Abastecimento (MRP)\nPlano Abastecimento Materiais - Requisição ALTERAÇÃO:\n\nAo fazer um estorno de abastecimento a quantidade referente a medição deve ser zerada, por que hoje a rotina não\nestá zerando, e ao fazer um novo abastecimento com uma nova medição, a rotina está somando a medição anterior\ncom a nova logo, deixando errada a informação em tela e nos demais relatório que usam essa informação.\n\nAnexo do pedido serviço:\n\nMedição 80.  \nDeleta o abastecimento e faz um novo, conforme prints abaixo.\n\nO correto é 180,2 e não 260,2. A rotina está somando as medições já existentes, não está certo.    Zzzzzzzzzzzzzzzzzzzzzzzzzz\n\nPorém Can"], "121-0": ["Relatório de Rendimento com Custo (CFAB85) — RELATÓRIO DE CUSTOS - COMPLEMENTO DO PEDIDO SERVIÇO 13585", "Relatório de Rendimento com Custo - CFAB85.pdf", "Relatório de Rendimento com Custo..\n\nPedido Serviço: 14497 Solicitação:\nRELATÓRIO DE CUSTOS - COMPLEMENTO DO PEDIDO SERVIÇO 13585\nDESENVOLVER COMPLEMENTO DO RELATORIO CONFORME DOCUMENTO ANEXO\n\nA ideia deste relatório é ter uma analise do que foi produzido para um ou “N” cliente(s), ou seja, com base no que já\nlançado no Kunden como movimentação de uma OF listar os dados conforme colunas do relatório que estão abaixo descriminadas.\n\nA base de pesquisa é o que foi lançado no programa CFAB1-Encerramento de Ordem de Fabricação - Multiplos\nProdutos (Curtume) onde deve ser buscar tudo o que existe de lançamentos efetuados para as OFs que tem\nlançamentos neste programa de acordo com a necessidade d"], "121-4": ["Relatório de Rendimento com Custo (CFAB85) — matéria prima couro, relatório não funcionar, moeda com casas", "Relatório de Rendimento com Custo - CFAB85.pdf", "MATÉRIA-PRIMA: Listar o somatório dos valores (custo médio ou se existir a possibilidade escolher outro tipo\nde valorização) baixados do estoque referente à matéria prima COURO – componente 17-MATÉRIA PRIMA\nRIBEIRA ou 14 -MATÉRIA PRIMA WB ( como vejo que o componente poderá mudar de cliente para cliente da\nKunden sugiro criarmos um tipo de CATEGORIA (MATÉRIA PRIMA COURO ao invés de utilizar MATERIAIS\ncomo esta no cadastro da Estrutura de Produto ) no programa EPRO2 para não termos problemas deste\nrelatório não funcionar em outro curtume ), no programa EST25-Plano de Abastecimento Materiais -\nRequisição (Curtume) listadas para a OF na coluna ENTRADAS. Formato do campo: Moeda com 02 casas\ndeci"], "121-12": ["Relatório de Rendimento com Custo (CFAB85) — entrada e final, unidade de parâmetro, cálculo do rendimento", "Relatório de Rendimento com Custo - CFAB85.pdf", "DESCARTE: Listar as quantidades que foram descartadas (deram saída) da Ordem de Fabricação, ou seja, a\nU.M. e nas quantidades que deram saída na OF com base na entrada em estoque originada da OF registradas\nno programa CPR04- Lançamentos, no caso do Nimo, independente da data que foi baixada da OF e dada\nentrada em estoque, pois, a base de pesquisa par a geração do relatório sempre será a data de\nencerramento da OF efetuada pelo programa CFAB1-Encerramento de Ordem de Fabricação - Multiplos\nProdutos (Curtume). Formato do campo: mesmo formato da U.M. padrão dos lançamentos. O ideal seria\nque U.M. de medida = PC (Peças), ME (Meios), CR (Couros), etc. não tivessem casas decimais.Deverá ter um\nt"], "121-17": ["Relatório de Rendimento com Custo (CFAB85) — custo fixo, mostrados no relatório, conferencia do funcionamento", "Relatório de Rendimento com Custo - CFAB85.pdf", "\nColuna Custo Fixo; conferencia do funcionamento.\nNeste exemplo, selecionado OF 1152 da BD Curtume (BD Interna da Kunden):\n\nO custo fixo deste exemplo, de 410,00 foi gerado através dos apontamentos dos processos Recurtir e Medir (eram\nestes cujos Recursos tinham no momento um Centro Trabalho vinculado)... \n\n...verificou o tempo de cada um destes 2 processos...\n\nTotal de tempo: (200 X 1,0000 minuto) + (210 X 1,0000 Minuto) = 410,0000 minutos...\n\n...E multiplicou pela tarifa prevista de 1,0000 = R$ 410,00 mostrados no relatório acima."], "121-25": ["Relatório de Rendimento com Custo (CFAB85) — ROTINA Manufatura Chão de Fabrica Relatórios de Produção", "Relatório de Rendimento com Custo - CFAB85.pdf", "Pedido Serviço: 16464 Solicitação:\nROTINA Manufatura Chão de Fabrica Relatórios de Produção\nRelatório de Rendimento (CFAB78)\nRelatório de Rendimento com Custos Gerenciais (CFAB85) ALTER  Chão de Fábrica Relatórios Gerenciais", "Relatório de Rendimento Detalhado – CFAB111.pdf", "Pedido Serviço: 21481 Solicitação:\nManufatura Chão de Fábrica Relatórios Gerenciais\nRelatório de Rendimentos (CFAB78) ALTERAÇÃO:\n1= efetuar a reformulação do relatório, acrescentando os campos conforme modelo anexo.  \nLargura de campos, fontes, formato de gradeamento, labels de campos e totalizações conforme modelo anexo.\nFazer a impressão da \"Legenda\" conforme modelo anexo.\nDetalhes de alguns campos:\nOF/Tipo/Situação: OF sempre na parte superior, Tipo (sigla do Tipo) e Situação sempre na parte inferior.\nProduto Acabado (da OF) e Matéria Prima: prever a possibilidade de utilizar até 2 linhas (truncar o descritivo que exceder).\nMatéria Prima: utilizar o parâmetro inicialização já existente CA"], "124-3": ["situação na qual gera a mensagem “ORA-20000: Erro BUSCA_MATER”", "Relatório Ficha de Processos.pdf", "situação na qual gera a mensagem “ORA-20000: Erro BUSCA_MATER”\nNa Minuano, em 01082014.\n\nMotivo:\n- veja tela abaixo...no produto que você quer gerar o relatório, tem um Tapete Natural (15616571), e olhando a\nengenharia deste Tapete Natural existe um loop, ou seja, no pai deste Tapete Natural está vinculado ele próprio, e aí\ngera um “circulo”...ou seja ele próprio está na Lista de Materiais do pai.  Xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx\n\nMensagem de erro que pode ocorrer no relatório: “ORA-20000: Erro GERA_MANUFATURA_140TMP_P: ORA-00936:\nmissing expression” Motivo:"], "125-3": ["Relatório Ficha Técnica (EPRO34) — Exemplo de utilização do programa Descritivos Técnicos – EPRO54", "Relatório Ficha Técnica Curtume – EPRO34-EPRO35_CURTUME...pdf", "Exemplo de utilização do programa Descritivos Técnicos – EPRO54:\n\nVinculado no EPRO15...\n...e passa a gerar no Relatório EPRO34/ EPRO35_CURTUME  \n...e em emissões de OFs:"], "125-4": ["Relatório Ficha Técnica (EPRO34) — Exemplo de “Relatório Ficha Técnica Curtume – EPRO34-EPRO35_CURTUME”", "Relatório Ficha Técnica Curtume – EPRO34-EPRO35_CURTUME...pdf", "Exemplo de “Relatório Ficha Técnica Curtume – EPRO34-EPRO35_CURTUME”:\nAcessado o Krumenauer em 190525...exemplo tela abaixo...\n...e o PDF completo está salvo na mesma pasta deste .docx, com o nome:\n-“Relatório Ficha Técnica Curtume – EPRO34-EPRO35_CURTUME.PDF”   xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx  "], "126-0": ["Plano Abastecimento Materiais (ESTO25) + Emissão Relatório (ESTO81) — relatório de formulações, agregado, posteriormente", "Relatório Formulações (ESTO81, gerado a partir do programa ESTO25).pdf", "Relatório de Formulações (ESTO81), posteriormente este relatório também foi agregado ao programa MPSP46.."], "129-1": ["Apontamento de Ordem de Fabricação (CFAB1) — Teste Wellour, questão dos semi-acabados", "Rotina Beneficiamento com a produção intermediaria interna de semi-acab de terceiros.pdf", "E-mail — Assunto: Teste Wellour, questão dos semi-acabados...\nPartindo desta NFE Excluir:  Abastecimento para semi-acabado... \n\nAqui, como ficou pos abastecimento:\n\nGerou OK aqui...  \nApontado e gerou o semi-acabado...\n\nGerou OK para cá...   Pedido beneficiamento final...\n\nAbastecimento...unica questão: traz tudo o que é disponível...\nAí neste caso, talvez teria que se criar um grupo para semi-acabados por cliente, e vincular no produto acabado...   Abastecido:\n\nEstoque ficou OK:   OF OK:\n\nApontamento final:   Trouxe para cá...OK:\nOK os 41,55 m2 / 50 pcs, porque...\nVeja primeiro abastecimento acima, para OF3315: 83,10 M2/100 Pcs = media 0,832 m2/peça X 50 pelas =\n41,55 m2 a retornar...  \nGer"], "131-1": ["Apontamento de Ordem de Fabricação (CFAB1) — PROGRAMA/ROTINA NOVA: CALCULO DA NECESSIDADE DE FORMULA PARA CURTUME, COM BASE NA PESAGEM…", "Rotina Calculo da Necessidade de Formula para Curtume.pdf", "Pedido Serviço 5013:\n\nSolicitação:\nPROGRAMA/ROTINA NOVA: CALCULO DA NECESSIDADE DE FORMULA PARA CURTUME, COM BASE NA PESAGEM DA OF\n\nPara processo de Recurtimento:\né necessário haver um processo de registrar a pesagem da OF.\nÉ uma terceira unidade de medida do produto (já controlado em M2 e couros (rotina de Unidade de Controle,\nconfigurado na Estrutura de Produto).\nA partir desta pesagem da OF, a geração de necessidade de fórmula de recurtimento tem que ser baseado nesta pesagem.\n\nDocumentação:\nPROCESSOS (PREC7)\nO programa passa a apresentar dentro de um quadro denominado Apontamento a coluna Excedente.\nTambém, neste quadro, está a nova coluna denominada Informar Pesagem no apontamento.\nO va"], "132-6": ["Pedidos do Lote (CFAB39) — Testes feitos para Soubach, em 082017", "Rotina Custos_Custeio para Curtume.pdf", "Testes feitos para Soubach, em 082017:\n\nSoubach_CEPs, refila (subproduto), e descartes de couro semi-acabado.\nFeito em 210817:\n\nConfiguração tudo como Integrado:\n\nOF original: \nApontamento de CEP de Subproduto:\n\nCEP utilizado:  \nCusto: fez 5,50 (custo Standard) x 0,70 = 3,85\nDetalhe: criei operação especifica, vinculada ao cadastro no CEP  \nAqui, desclassificação ocorrida junto com o apontamento (abrindo a tela do CEP junto com o apontamento):\n\nDe novo, fez pelo custo Standard:\nCusto Standard 30,00 X 0,70 = 21,00  \nAqui, apontamento final: desclassifiquei mais alguns couros no final (semelhante acima):\n\nE o apontamento final: \nEntrada ao estoque ocorre de novo de acordo com o custo standard "], "132-7": ["Parâmetros (ADMI8) — cadastro de tempos, venda e custeio, separar matéria prima", "Rotina Custos_Custeio para Curtume.pdf", "Pedido Serviço 20283_Val_0401171\nCÁLCULO PREÇO DE VENDA E APROPRIAÇÃO DO CUSTEIO: PASSAR A UTILIZAR OS TEMPOS PADRÕES REGISTRADOS\nNO PROGRAMA \"CADASTRO DE TEMPOS - PREC36\" ROTINA:\n\nVendas e Distribuição\nFormação Preço de Venda\nCálculo Preço de Venda Controladoria Custos Apropriação do Custeio ALTERAÇÃO:\n\nPassar a utilizar os tempos padrões registrados no programa \"Cadastro de Tempos - PREC36\" para as rotinas dos\ncálculos de FPV e Custeio, para as empresas que utilizam o cadastro de tempos padrões por este programa ao invés\ndo programa \"Ficha de Operações\" (que está em Manufatura/Processos/Processos).\n\nDocumentação:\nNo programa Máquinas x Operações x Demãos(PREC32) foi adicionado um \"Check-bo"], "132-9": ["Tarifas (CUST1) — Exemplo Processo que tenha mais Recursos com diversos tempos", "Rotina Custos_Custeio para Curtume.pdf", "Exemplo Processo que tenha mais Recursos com diversos tempos:\nNeste caso utilizado opção de efetuar media dos tempos, não marcando o “Recurso Padrão”:  \nVeja o tempo cadastrado: media dos 3 registros de recursos diferentes: 0,7653 minutos\n\nEntão: 0, 7653 min X Tarifa FPV $0,60 = custo total deste processo = $ 0,4592 (de acordo com FPV acima).\n\nExemplo Processo 173 que tenha mais Recursos com diversos tempos:\nNeste caso utilizado opção de definir qual o “Recurso Padrão”:\n\nEntão: 0,1500 min (tempo Recurso 808) X Tarifa FPV $0,60 = custo total deste processo = $ 0,0900 (de acordo com FPV acima).   zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz\n\ncom relação à definição de Nro Vezes:\n\na rotina passa a mul"], "132-15": ["Estorno Apontamento de Ordem de Fabricação (CFAB10) — Soubach_Avaliação da OF que ficou com qtde zerada, pós exclusão de abastecimento", "Rotina Custos_Custeio para Curtume.pdf", "\n\nSoubach_Avaliação da OF que ficou com qtde zerada, pós exclusão de abastecimento\n\nSituação de problema de custeio ocorrida no Soubach, no fechamento do Custeio...de março/20.\nOcorre quando fica zerado após uma exclusão de abastecimento de Wet Blue...\n(mas tinha consumo de formulas)\nNesta situação, distorceu custeio, porque como zerou a qtde da OF, considerou como Produzida...\nMas não tinha apontamento, com isso não tinha entrada ao estoque de Produto Pronto para levar o custo do consumo de formulas...\nColocar uma trava?\nVoltar à qtde original da OF?\n\nTeste efetuado na BD Desenv:\nAqui, a situação da OF original...\n\nEfetuado o abastecimento...  \nAtualizou qtde da OF...   ...mostra abastecime"], "133-1": ["Apontamento de Ordem de Fabricação (CFAB1) — atualizou estoque, vinculada a categoria, retorno e faturamento", "Rotina de Correção.pdf", "Testes feitos em 30052016.\n\n-Deixei vinculada a categoria de Pedido de Venda “normal”, que permite faturamentos (a mesma categoria utilizada\npara fazer o beneficiamento normal).\n- também o parâmetro de inicialização ALTERACAO_LIBERADA = S.\n\nAlterar a “Categoria” deste Lote Produção para “Beneficiamento”. Também necessário informar o valor de cobrança,\nna aba Itens, para ser sugerido ao gerar NF de Saída Faturamento. \n...e no programa “Copia de Ordem de Fabricação”:\nÉ necessário substituir o processo final 38- MEDIR EXPED CORREÇÃO, pelo processo 26-MEDIR EXPEDICAO (é para\ndesfazer o que foi feito inicialmente, documentado acima nos primeiros procedimentos).\n\nE com isso fazer o apontamento pel"], "134-1": ["Cópia de Ordem de Fabricação - Impressão OF (CFAB59) — Em 191120: Xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx Testes em 231120", "Soubach_TESTE, QUESTÃO DE USAR U.M. DIFERENTE DO PADRÃO M2.pdf", "Em 191120:   Xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx Testes em 231120:\n\nEstava assim antes da originalmente:  \nInclui a Configuração “E” no PREC35...\n\nEfetuado o apontamento pelo CFAB90:  \n...porém de igual maneira não trouxe o tempo no Custeio, aqui:\n\nNovo teste: agora, incluindo um novo registro no PREC36 (apenas com o acréscimo da Unidade de Medida).  \nEfetuado o apontamento pelo CFAB90:\n\n...porém de igual maneira não trouxe o tempo no Custeio, aqui:\n\nXxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx  \nNovo teste: agora, incluindo:\n-no PREC35: incluindo configuração “C” do Produto\n-no PREC36: um novo registro no PREC36 (com o acréscimo de Produto e da Unidade de Medida).\n\nEfetuado o apontamento pelo"], "135-0": ["Cadastro de Tipo de Ordem de Fabricação (CFAB103) — tipo de ordem, cfab curtume, produção da classificação", "Tipo de Ordem de Fabricação – CFAB103.pdf", "Tipo de Ordem de Fabricação – CFAB103..\n\n19918_Val_300816 Pedido Serviço: 19918 Solicitação:\nROTINA:\n\nManufatura Ordem de Fabricação ALTERAÇÃO:\n\n1= Criar cadastro novo \"Tipo OF\".\nExemplos de Tipos de OF que serão utilizados no segmento Curtume: Amostras, Retrabalho, Venda, Beneficiamento,...\n\n2= No programa Categorias de Pedido - PEDI2, permitir vincular qual o \"Tipo de OF\" padrão a ser vinculado na OF, na\ngeração das OFs a partir do Plano de Produção e a partir do Pedido de Venda com parâmetro de inicialização PEDIDO_SIMPLIFICADO = S.\nNão é obrigatório o vinculo do Tipo OF neste cadastro.\n\n3= No programa \"Cópia de OF\" ao criar uma nova OF possibilitar escolher o tipo de OF (trazer o padrão "], "135-4": ["Cadastro de Tipo de Ordem de Fabricação (CFAB103) — Criar check box que identifica se o Tipo de OF ira gerar custeio ou não", "Tipo de Ordem de Fabricação – CFAB103.pdf", "Pedido Serviço: 20873 Solicitação:\nCriar check box que identifica se o Tipo de OF ira gerar custeio ou não.\n\nDocumentação:\nPrograma Cadastro de Tipo de Ordem de Fabricação(CFAB103):\n- Criado um check-box para definir se deve, ou não, gerar custeio de materiais.\n- Valor padrão: Sim "], "136-5": ["Remessa (TERC1) — DESMEMBRAMENTO DO PEDIDO DE SERVIÇO 8333: TRATAR A ROTINA DE TERCEIRIZAÇÃO", "Unidade Secundaria, rotina de controle de produção pela Unidade Secundaria.pdf", "Pedido Serviço: 9689 Solicitação:\nDESMEMBRAMENTO DO PEDIDO DE SERVIÇO 8333: TRATAR A ROTINA DE TERCEIRIZAÇÃO.\n\nDocumentação:\nMÓDULO TERCEIRIZADOS\nOs programas deste módulo passam a tratar a quantidade secundária da ordem de fabricação.\nA quantidade secundária é gerada quando a unidade de controle estiver configurada no produto da ordem de fabricação.\n\nREMESSA (TERC1) RETORNO (TERC2) POSIÇÃO REMESSA/RETORNO (TERC3)\nEstes programas passam a exibir a quantidade secundária e a sua unidade de medida ao acionar o botão grade.\n\nEMISSÃO EXTRATO (TERC8)\nFoi criada uma nova versão de relatório (TERC9_UNIDADE_CONTROLE), a qual exibe a quantidade secundária e a sua unidade de medida.\nCriou-se uma nova v"], "138-13": ["Apontamento MultiTarefa - Curtume (CFAB90) — APONTAMENTO MULTITAREFA - CURTUME - CFAB90 - AO GERAR UM DESVIO DE PROCESSO MARCAR/GRAVAR…", "Apontamento MultiTarefa – CFAB90.pdf", "Pedido Serviço: 18107 Solicitação:\nAPONTAMENTO MULTITAREFA - CURTUME - CFAB90 - AO GERAR UM DESVIO DE PROCESSO MARCAR/GRAVAR O\nCHECK BOX DE RETRABALHO NO PROGRAMA CFAB59 - COPIA DE OF E GRAVAR EFICIENCIA PELO PARAMETRO 50104.\nROTINA Manufatura\nPlano Mestre de Produção (MPS)\nPlano Mestre de Produção\nCópia Ordem de Fabricação ALTERAÇÃO\n\nAo gerar um Desvio de Processo marcar automaticamente o Check Box de retrabalho no programa CFAB59 - Cópia\nde OF onde o registro do Apontamento para fins de Eficiência (PREC12) deve ser gravado como é gravado ao digitar\no apontamento pelo CFAB1 quando é um processo marcado como retrabalho que utiliza o Parâmetro 50104 para\ngravar o registro no PREC12.\n\nVer exem"], "138-17": ["Apontamento MultiTarefa - Curtume (CFAB90) — APONTAMENTO MULTITAREFA: TRATAR MOTIVO PELA QUAL ESTÁ GERANDO MENSAGEM INDEVIDA ROTINA", "Apontamento MultiTarefa – CFAB90.pdf", "Pedido Serviço: 18925 Solicitação:\nAPONTAMENTO MULTITAREFA: TRATAR MOTIVO PELA QUAL ESTÁ GERANDO MENSAGEM INDEVIDA ROTINA:\n\nManufatura Chão de Fabrica Lançamentos Apontamento MultiTarefa ALTERAÇÃO:\nAvaliar/tratar motivo pela qual está gerando mensagem indevida de \"ORA-06502: PL/SQL: numeric or value error\nORA-01403: o data found\" ao informar o recurso número 499 no apontamento.\n\nE após clicado no OK na mensagem, já traz o campo Turno informado (indevidamente)...onde o correto é trazer o\nturno da entrada de dado que o usuário informa, após ter informado o Recurso. Ou seja, o turno nunca é sugerido.\n\nSituações na BD Desenvolvimento.\n\nDocumentação:\nO programa Apontamento MultiTarefa (CFAB90) fo"], "138-33": ["Apontamento MultiTarefa - Curtume (CFAB90) — Para registrar evento de parada: testado em 160318, para instrução para Nimo", "Apontamento MultiTarefa – CFAB90.pdf", "Para registrar evento de parada: testado em 160318, para instrução para Nimo:\n\nTem que ter aqui o cadastro do evento a utilizar:\n\n1º informar o Recurso: \n2º informar o evento (do cadastro de Eventos de CRP):\n\n3º: das SIM, e vai limpar a tela... \nEnquanto estiver em limpeza, consultando vai mostrar:\n\nDepois que concluir a limpeza:\n\n1º Colocar o recurso: \n2º e SIM: aí vai limpar e concluir na tabela a limpeza...\n\nVeja que com isso gerou os dados do Evento no Extrato (no abaixo, fiz 3 testes de Limpeza): "], "138-34": ["Apontamento MultiTarefa - Curtume (CFAB90) — Erro que ocorreu na BD Amcm", "Apontamento MultiTarefa – CFAB90.pdf", "Erro que ocorreu na BD Amcm:\n“ORA-20000: Erro CALCULA_CUSTO_APONTAMENTO_P: ORA-01476: divisor is equal to zero”.\n\nMotivo:\nÉ quando houve apontamento nos primeiros processos...na qtde da OF de acordo com a qtde que foi aberta original...\nE em processos seguintes efetua-se o “abastecimento”, na qual será informado a mesma qtde da unid primaria da OF\nporem unidade secundaria maior...\nO que ocorre:\nAo tentar apontar processos seguintes (usando a função do back flush), existe um saldo de unidade secundaria nos\nprocessos anterior (nos primeiros processos), mas não de unidade primaria, e por isso encontra um valor “zero” que é\na unidade primaria para apontar. É que o apontamento pós abastecimento e"], "138-42": ["Apontamento MultiTarefa - Curtume (CFAB90) — quer excluir apontamento, indicar a sequencia, desapontar um determinado", "Apontamento MultiTarefa – CFAB90.pdf", "Importante:\nSobre Excluir/estornar/desapontar um determinado processo:\n\nPode ser feito pelo programa “Manutenção de Apontamentos MultiTarefa – CFAB93”.\nO programa normal de “Estorno de Apontamento de Ordem de Fabricação - CFAB10” também funciona, mas tem o\ninconveniente de não poder indicar a sequencia de apontamento.\nIsso é necessário quando o mesmo processo tem 2 vezes na mesma OF, e se quer excluir apontamento de uma\ndeterminada sequencia (um dos 2 apontamentos do mesmo processo)."], "139-0": ["Analise de Compras Matéria-Prima Couro / Fornecedor (CFAB102) — mostra o fluxo, emissão de formulação, partir dos apontamentos", "Demo_Curtume_Espanhol.pdf", "Demo_Curtume_Espanhol..\nAbaixo um passo a passo, que mostra o fluxo dos programas utilizados para a gestão de um curtume, do segmento de curtumes.\nFeito para demonstração a curtume do equador, em 140617.\nBD Curtumes, na Kunden. Usu: Espanhol, senha cur5464tumes\n\nProdução Verde a WB:\n\nMP:\n\nNF da compra de fresco: \nEstoque gerado pela compra do verde:  Produto da OF:\n \nLote Produção estoque para encaminhar produção dos verdes comprados acima:\nInformei qtde de 1, porque a qtde real será definida no abastecimento.\n\nGerada esta OF:   Abastecimento realiado:  \nPós abastecimento: OFs ficaram com esta qtde:\n\nOpção de emissão da OF a partir do programa de Copia: \nFormulação de Caleiro e Curtimento\n\nM"], "139-1": ["Analise de Abate Frigorifico - 33443 (CFAB101) — Producción WB a Acabado", "Demo_Curtume_Espanhol.pdf", "Producción WB a Acabado:\n\nFT, Produto:\n  Pedido Venta:\n\nOFs, geradas:\n\nAbastecimento: \nActulización de la OF:  Formulação de Recurtimento:  Emissão da Formulação:\n\nFormulação de Acabamento: \n\nGerou esta OF de tinta:\n\nA partir do botão “Materiais”, deveria mostrar os materiais gastos: não trouxe...também não gerou automático a produção da OF \nApontamentos realizados...aqui o apontamento final:   Relatórios finais:     "], "140-0": ["Usuários (ADMI1) — Guia Operacional", "Guia_Operacional_Tela_a_Tela_Controle_de_Alcadas_RA_260304007.docx", "Guia Operacional\nControle de Alçadas - RA 260304007\nRoteiro tela a tela baseado na gravação de treinamento de 29/07/2026. Sistema\nKunden ERP e Painel Web Kunden ERP Módulo\nSuprimentos / Compras / Controle de Alçadas Usuários\nAdministrador, comprador e aprovadores Uso\nExecutar configuração e aprovação de pedidos de compra por alçada\nTela 1 - Cadastro de usuários - aba Web  Objetivo da tela\nHabilitar o usuário para acessar o Painel Web e usar o Controle de Alçadas. Passo a passo\nAcesse o cadastro de usuários no ERP. Localize o usuário que fará aprovação ou manutenção de alçadas. Abra a aba Web. Marque a opção de uso do Controle de Alçadas. Marque administrador somente para quem deve acessar ca"], "141-6": ["Apontamento MultiTarefa - Curtume (CFAB90) — Detalhe: PARA ESTE ERRO, mensagemKND-003281", "Instruções programa CFAB90.pdf", "Detalhe: PARA ESTE ERRO, mensagemKND-003281: \nÉ necessário este vinculo do Processo no Recurso...\n\nXxxxxxxxxxxxxxxxxxxxxxxxxx\n\nPara desenvolver o tabelão dos apontamentos:\n\nPara imprimir ou não a codificação abaixo dos códigos de barras: isso é de acordo com a fonte a ser utilizada:\nCIA Code 39 Medium Text: com esta vai imprimir a codificação abaixo dos códigos de barras. Exemplo tela abaixo.\nCIA Code 39 Medium: com esta NÃO vai imprimir a codificação abaixo dos códigos de barras.   Xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx\n\nPara um “Desvio de Processo”:\n“Desvio de Processo” significa acrescer mais um processo no fluxo...pode ser ou não ser um processo que já está no\nfluxo normal."], "141-8": ["Apontamento MultiTarefa - Curtume (CFAB90) — *Extensão do acima, sobre “Eficiência”", "Instruções programa CFAB90.pdf", "*Extensão do acima, sobre “Eficiência”:\n-os apontamentos feitos por esta rotina do programa CFAB90, integram para a eficiência, porém integram com o\ntempo da Ficha Descritiva vinculada nos Produtos (assim como os demais apontamentos, exemplo pelo CFAB1 usado\npelos Calçados)...para o calculo de não é considerado o intervalo de tempo entre o Apontamento de Início e\nApontamento de Término do CFAB90.  \nEu e Roberto entendemos que esteja correto assim...porque se fosse diferente, considerando o tempo entre início e\ntérmino do CFAB90 como os “Minutos Produtivos”, então a eficiência/produtividade sempre seria 100%, o que não seria o real...\n\nO controle pelo Apontamento de Início e Apontamento de Té"], "141-9": ["Apontamento MultiTarefa - Curtume (CFAB90) — CFAB90 Oi Marcio,", "Instruções programa CFAB90.pdf", "E-mail — Assunto: CFAB90 Oi Marcio,\n\nSegue a tabela que grava o início do apontamento no CFAB90; [Código: CONTROLE_PRODUCAO_OF_ATM] "], "141-11": ["Apontamento MultiTarefa - Curtume (CFAB90) — Para registrar evento de parada: testado em 160318, para instrução para Nimo", "Instruções programa CFAB90.pdf", "Para registrar evento de parada: testado em 160318, para instrução para Nimo:\n\nTem que ter aqui o cadastro do evento a utilizar:\n\n1º informar o Recurso:\n\n2º informar o evento (do cadastro de Eventos de CRP):  \n3º: dar SIM, e vai limpar a tela...\n\nEnquanto estiver em limpeza, consultando vai mostrar: \nDepois que concluir a limpeza:\n\n1º Colocar o recurso:\n\n2º e SIM: aí vai limpar e concluir na tabela a limpeza... \nVeja que com isso gerou os dados do Evento no Extrato (no abaixo, fiz 3 testes de Limpeza):\n\nExtensão da questão de registrar os Eventos pelo CFAB90, testado em 031122 na implantação Aniger, segue\navaliação se refletem no cálculo da Eficiência do Recurso:\n\n-Ao que parece, reflete, ma"], "141-12": ["Apontamento MultiTarefa - Curtume (CFAB90) — Como utilizar a função de AGRUPAMENTO – comando AG", "Instruções programa CFAB90.pdf", "Como utilizar a função de AGRUPAMENTO – comando AG:\n\nNo caso, efetuar a produção agrupando varias OFs sendo feito no mesmo apontamento, sendo produzidas no mesmo\nmomento e pelo mesmo Recurso:\n\nUtilizando esta configuração:\n\n(Tiago: esta configuração está feita no Nimo...basta você utilizar o novo programa que deixei configurado no Menu,\nconforme mostra na 2ª tela abaixo...) \n...na Nimo, utilizar este programa, que tem as configurações acima:\n\nIniciando o apontamento:\n1º, informar o Recurso \n2º, informar o comando AG, de Agrupamento\n\nAqui (apenas para conferir), veja que a rotina trouxe automático a palavra AGRUPAMENTO: \n3º fazer a leitura do código de barras das OF (código que representa a s"], "142-0": ["Consulta Ordem de Fabricação (CFAB2) — mês de março, couros hidro, produtos em fabricação", "Couros_Hidro_Descarte de OFs para não gerar “Em Fabricação”.pdf", "Couros_Hidro_Descarte de OFs para não gerar “Em Fabricação”..\n-Situação inicial apresentada:\n-Os marcados com “X” é, cfe solicitado, para “tirar do Estoque” (ou seja, neste caso, deixar de gerar\ncomo “Em Fabricação” pelo programa ESTO41)\n\nComo tratar tal situação:\nExemplo este produto código 5126, tem 2 OFs que foram geradas como “Em Fabricação”: podes ver\nna tela abaixo, no campo “OF” Apenas para entendimento:\nEstas 2 OFs tiverem o “Abastecimento WB” realizado, por isso é que estão considerados como “Em Fabricação”  \nPara fazer um “Descarte” destas OFs e zerar a quantidade da OF:\n\nIr neste programa CPRO4 e fazer um lançamento de “Couro Desclassificado” para cada OF ...\n-Os campos a serem pr"], "143-2": ["Estruturação do Produto - Manufatura - Novo (EPRO105) — Vai abrir esta tela", "Hidro_Passo a Passo para criar um novo Produto, com Formulas e Processos.pdf", "Vai abrir esta tela:\n-Clicar na aba “Processo”\n-Vai abrir a listagem dos Processos do Artigo utilizado como base para a cópia;\n-Vai permitir incluir novos processos, ou excluir Processos, ou substituir diretamente o código dos\nprocessos, exemplo tela abaixo.\n-Se precisar incluir ou substituir o código dos processos, podes clicar no botão da flecha azul\npara abrir a lista de processos, e escolher o novo processo  \nNesta mesma aba, tem o campo dos “Descritivos Técnicos” , exemplo tela abaixo...\n-Esta coluna está mais à direita da coluna dos Processos, então é necessário usar a barra de rolagem indicada abaixo...\n-Pode incluir, apagar ou substituir os “Descritivos Técnicos” .\n-Se precisar inclu"], "144-1": ["Gerar Remessa para Embarque (CEXT18) — venda exportação, frete internacional, volumes peso liquido", "PROCESSO DE EXPORTAÇÃO.pdf", "E-mail — Assunto: Processo de exportação Bom dia Marcio,\nConforme nosso contato telefônico, segue passo a passo dos processos que são feitos na área da exportação.\nEle foi feito há muito tempo mas pode ser considerado, pois utilizamos o mesmo processo atualmente.\nCaso precise acompanhar um processo, podemos marcar.\nObrigada, Claudia Rocha Export/Import Cortume Krumenauer\n\n1- Pedido de Venda Exportação\n\nCriar PEDIDO DE EXPORTAÇÃO: Pedido de Venda Exportação >\n\nPreencher na aba ITEM os seguintes campos:\n\n- PRODUTO: Cód do Produto indicado na ficha;\n\n- VLR UNITÁRIO: Preço do couro em M2 (preço USD em P2x10.764)\n- QUANTIDADE: Preencher a quantidades em P2 CONFIRMAR PEDIDO \n2. PROCESSO DE EXPORTA"], "144-3": ["Processo Exportação (CEXT84) — campos: Valores Inclusos, Embarques, TOTAIS/IMPOSTOS", "PROCESSO DE EXPORTAÇÃO.pdf", "EMAIL P/ EURO: INVOICE + PACKING + COMISS + NF PDF +XML Aéreo: mauricio@euroamerica.com.br groll@euroamerica.com.br Marítimo ÁSIA: jardel@euroamerica.com.br Marítimo EUA: jessica@euroamerica.com.br\nMarítimo Europa: Camila camilat@euroamerica.com.br\nColocar junto aos e-mails SEMPRE: neider@euroamerica e certificados01@bioseta.com.br (em caso de embarque de pallets). \nNOTA FISCAL DE EXPORTAÇÃO:\n1º PASSO\n• Calcular o valor da NOTA FISCAL (R$) que é: valor total da fatura em USD X ptax do dia\n• Frete internacional em reais R$ e USD\n• Frete Nacional em reais R$ e USD\n• Se for caixas pequenas pedir coleta SEM CUSTO com a Euro-América (confirmar com Rafael ou Maurício).\nP/ calcular o Frete Nacional"], "144-4": ["Processo Exportação (CEXT84) — colocar o nro, frete internacional, utilizado a configuração", "PROCESSO DE EXPORTAÇÃO.pdf", "ABA TOTAIS/IMPOSTOS: Colocar a soma do frete internacional + Onicron em Reais:  PRÓXIMA ABA:\nABA FATURA DUPLICATA: Pular para Parcelas colocar o nro da invoice no quadradinho abaixo de “DOCUMENTOS”\n\nABA VOLUMES: Preencher todas os campos, MENOS CUBAGEM. \nABA OBSERVAÇÕES: Preencher com as seguintes informações:\n(nro de meios) COUROS BOVINOS CURTIDOS AO VEGETAL, FLOR INTEGRAL, EM MEIOS CONFORME\nDESCRICAO DE ITEM ACIMA.\nINCOTERM:\nFRETE INTERNO: R$ (valor do frete onicron)\nFRETE EXTERNO: R$ (valor do frete internacional)\n\nEMITIR, GERAR XML E ESTÁ PRONTA A NOTA! \nImprimir 03 vias: 01 p/ Alemão, 01 p/ colocar no processo/arquivo exportação e 01 p/ Remi.\nOBSERVAÇÕES GERAIS: QUANDO DER ESTE ERRO “KN"], "146-0": ["Analise de Abate Frigorifico - 33443 (CFAB101) — parte do apontamento, couro verde, entrada ao estoque", "PDS_avaliação das rotinas utilizadas_avaliação pós atualização patch 171.pdf", "PDS_avaliação das rotinas utilizadas_avaliação pós atualização patch 171..\n\nBD Pieles Interna.\n\nEste exemplo para usar de base:\n\nNFE de compra do Fresco:\n\nObs.: frete acima é de 150,00\n\nEstoque OK, custo e qtde:\n\nCalculo do Custo:\nCusto total dos 2 Produtos 7670,70 .....Frete Para estes 2 Produtos: 150,00\nCusto do 1º item 7585,20 => necessita agregar o valor “X” para o frete.\n\n((7585,20 * 150) / 7670,70) = 148,32 é o valor do frete correspondente ao 1º item.\nO resto dos 150,00 de frete, é para o 2º item. \n\nEntão, custo para o estoque do 1º item:\n7585,20 + 148,32 de frete = 7733,54, sendo que, unitário será 7733,54 / 1204 = 6,4232 Criado o LE:  Efetuado abastecimento:\n\nDetalhe: na qtde de med"], "146-1": ["Analise de Abate Frigorifico - 33443 (CFAB101) — marca e produto, entradas ao estoque, compra do couro", "PDS_avaliação das rotinas utilizadas_avaliação pós atualização patch 171.pdf", "Confirmado o acima, fez certo aqui a qtde...5, devido ser tiras (meios):   Estoque ok:  \nAbaixo, a sequencia dos apontamentos...\nImportante: não pode fazer como no exemplo abaixo, colocando os vários apontamentos dos vários produtos com\n“Marca” diferentes num único “Apontamento”.\nFiz esta tentativa abaixo mas tive que excluir todos os apontamentos, porque a rotina não gerou novos Lotes...ele\nacumulou tudo num mesmo Lote, e manteve a ultima Marca informada...e isso não pode para separar os dados no\nrelatório CFAB101 (já citado acima).\n\nÉ necessário fazer produto a produto, marca a marca diferente, e sempre clicando na opção “Lote Novo”, para gerar\num novo Lote no Estoque a cada marca e produt"], "147-6": ["Livro Inventário (ESTO15) — Guia de Remissión e Factura Olá Magoo,", "PDS_fluxo de Recebimentos e Faturamentos.pdf", "E-mail — Assunto: Guia de Remissión e Factura Olá Magoo,\n\nOk entendo, porém é desenvolvimento completamente novo.\nAté porque desta maneira vc não tem preço gravado.. o produto entra no estoque sem preço algum...\n\nA fatura só gera financeiro então o estoque e custo entram pela guia, pra isto ele precisa do pedido de compra... ele\nse baseia no preço do pedido para entrada no estoque, mesmo não exibindo.\nDepois a fatura busca isto pra gerar a nota, baseado neste valor... assim ambos fecham.\n\nNão vejo isto funcionar sem pedido de compra.\nPelo que vejo na logica atual é ponto básico pra fazer funcionar.\n\nTeste posterior em 210217, na BD Pieles interna, onde, não existindo Guia e tendo que fazer a"], "148-0": ["Estorno Apontamento de Ordem de Fabricação (CFAB10) — nfe de compra, funcionou o apontamento, configuração do produto", "Pieles, rotina Verde a WB.pdf", "Pieles, rotina Verde a WB..\n\nLANÇAMENTO nfe DE COMPRA DE Verde/fresco  \nConfiguração do Produto da OF:   Consumo: \n\nCONFIGURAÇÃO NECESSÁRIA, para sistema sugerir a medição automaticamente...\nRotinas desenvolvidas pelos pedidos serviço 20233 e ....  \nParou indevidamente nesta mensagem “KND-000288”:\nNão descobri o que foi...criamos produtos novos.\n\nXxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx\n\nAqui, novo teste, novos produtos: neste, funcionou o apontamento acima.   Produto da OF:\n\nApontamentos realizados:\n(a tela abaixo foi anexada aqui posteriormente...aí para mostrar como foi apontado, acessei a tela do Estorno de\nApontamento, que mostra o histórico de como ocorreu o apontamento)...\n\nGerou "], "149-1"
