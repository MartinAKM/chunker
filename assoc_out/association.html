rar, sugerir a operação, rotina do sugere", "Gera Nota Fiscal Remessa Beneficiamento - ESTO71.pdf", "Avaliado em 070624, na implantação VPS...a rotina do RECE94 sugere OK a operação no programa ESTO71:\n\nConfigurei o programa FATU94, para sugerir a Operação para a Emissão da NF de Saída gerada pelo programa\nESTO71, de acordo com os critérios de:\nMatéria Prima: Operação configurada para controlar e integrar o movimento com o Estoque.\nProduto em Fabricação “201-PEÇAS CORTADAS P/ COSTURA”: Operação configurada para NÃO controlar e integrar\no movimento com o Estoque (conforme já esclarecido em treinamentos anteriores, os Produtos em Fabricação só\nsão gerados para o Estoque por ocasião do final do mês, não sendo controlado a sua movimentação durante o mês).\n(e mantive a configuração no ESTO71, pa"], "288-4": ["Gera NF pelo (FATU74) — knd rótulo, transferências de rótulos, estoque na localização", "Gera Nota Fiscal Rótulo - FATU74.pdf", "Pedido Serviço: 23661 Solicitação:\n\nROTINA:\n\nVendas e Distribuição Faturamento Notas Fiscais\nGera Notas Fiscais Rótulo ALTERAÇÃO:\n\n- Alterar programa de transferência para que permita realizar transferências de rótulos que possuam mais de um produto vinculado.\n\nDocumentação:\n\nRotina:\nManufatura\nEngenharia e Desenvolvimento de Produto Cadastros Mensagens:\nKND-004064 - Rótulo \"(:A)\" inexistente.\nKND-004065 - Rótulo \"(:A)\" não se encontra em estoque na localização indicada.\nKND-004066 - O rótulo \"(:A)\" é parte integrante de um conjunto de rótulos, portanto, todo o conjunto será deletado.\nDeseja continuar?\n\nDetalhamento:\nPrograma alterado para aceitar rótulos que são agrupamentos."], "288-9": ["Gera NF pelo (FATU74) — CARGUE DE PT EN KUNDEN Bom dia Davenir, [Imagem: FATU2]", "Gera Nota Fiscal Rótulo - FATU74.pdf", "E-mail — Assunto: CARGUE DE PT EN KUNDEN Bom dia Davenir, \n\nDeu para evoluirmos aqui internamente em mais alguns testes, mudando algumas configurações, e entendo que\nficou melhor agora para a par ”.\n\nMuito provável é porque de fato já tem movimentos para estes produtos no dia 16/05.\n\nEntão minha pergunta:\n-como não posso nem excluir este lançamento de “Reversion Factura Salida” porque o sistema não deixa e se\ndeixasse iria perder os links com demais rotinas, posso tentar fazer um UPDATE nesta Data de Entrada para ver se aí passa a confirmação?\n\n(pergunto isso, porque não sei até onde pode bagunçar as tabelas se fizer este UPDATE).\n\nPosição Final:\n\nFizemos sim UPDATE na Data"], "308-0": ["Usuários (ADMI1) — PDV: Treinamento – Meat House 1", "PDV_Treinamento – Meat House.pdf", "PDV: Treinamento – Meat House 1\n(Treinamento feito por Deise, em 011021)..\nInformações Básicas:\nLink BD desenv.: http://192.168.20.239:8080/desenvv4/f?p=1667:LOGIN_DESKTOP:29888276493960:::::\nUsuário configurado Kunden/Senha: KUNDEN PDV/123 Configurações Gerais:\nADMI1 - Usuários\nPara que o usuário possa utilizar o PDV é necessário que o check-box \"Kunden PDV\" esteja marcado na aba WEB do programa,\na senha utilizada também é cadastrada nesta aba.\n\nVEND2 - Lista de Preço\nPara que os produtos sejam disponibilizados à venda no PDV, é necessário criar uma lista de preço e habilitar a \"Venda PDV\"\npara “Sim” (na nova aba \"Kunden PDV”).\nIMPORTANTE: atualmente, somente 1 lista de preço sobe para a ap"], "308-2": ["Condições de Pagamento (ADMI19) — treinamento meat house, forma de pagamento, vendas em dinheiro", "PDV_Treinamento – Meat House.pdf", "Botão Fluxo de Caixa: exibe os movimentos das operações de caixa.\nEsta tela sofrerá grandes modificações. Terão 3 visões novas: resumo das vendas, controle de caixa (vendas em dinheiro) e\ncontrole cartão. Para possibilitar o correto fechamento de caixa. Atualmente, está tudo junto: incorreto.\n\nPDV: Treinamento – Meat House 8\nPara a inserção de itens existem três componentes envolvidos:\n\n- Campo QTD: indica quantos itens de uma determinada etiqueta devem ser registrados;\n- Campo Código de Barras: Que está preparado para leitura de códigos EAN13 (campo Cód. de Barras do EPRO15 = 13\ndígitos) e dos códigos de barras dos lotes (14 dígitos), cuja etiqueta foi desenvolvida no pedido 51608 (do Rober"], "310-2": ["Plano de Necessidades de Compras (COMP13) — bahia lindolfo collor, ordem de industrialização, controla depósito", "Quarteirização_rotina.pdf", " Treinamento em 011116.\nMarcio, Wagner, Thomas, Caio, Gabriel Avaliado abaixo:\n- quando tem mais de um processo envolvido; exemplo corte/costura + pre-fabricado.\n- querem validação para não permitir fazer remessa de mat, quando já houve o retorno do terceirizado para o\nrespectivo serviço e OF.\n- ver motivo do campo “Pedido”, no programa ESTO25, Plano de Abastecimento Materiais remessa Industrialização.\n\nValidação do pedido: 19585 (por Wagner) ROTINA:\nLOGICA DE QUARTERIZAÇÃO (BAHIA - LINDOLFO COLLOR) OBJETOS:\nMensagens:\nVALIDAÇÃO:  \nObs.: a compra não precisa ter o vinculo das mesmas OFs terceirizadas...pode ser uma compra “livre” sem vinculo com OFs.\n0 – tem um programa facilitador que gera "], "310-7": ["Recebimento de Pedidos de Compra (COMP5) — lindolfo collor, padrão de retorno, controla depósito", "Quarteirização_rotina.pdf", "Pedido Serviço: 19444 Solicitação:\nROTINA:\n\nManufatura Chão de Fabrica\nEngenharia e Desenvolvimento de Produto\nPlanejamento e Capacidade de Recursos Terceirizados Suprimentos Compras Estoque\nPlanejamento Necessidade de Materiais Abastecimento Recebimentos Vendas e Distribuição Faturamento Pedidos ALTERAÇÃO:\n\nDesenvolvimento e alterações necessárias em rotinas e programas para tratar o processo de quarteirização.\nDetalhamento conforme documentação anexa, arquivo 19444_PROJETO_ QUARTEIRIZAÇÃO_MALU_sem_Desenv_9_10.docx Documentação:\n\nCadastro de Operações do Estoque (ESTO1):\n\n- Criada a coluna \"Controla Depósito\". Essa coluna de controle de depósito aparecerá sempre, indiferente da Classe de Op"], "311-1": ["Recebimento de Notas de Empresa do Mesmo Grupo (RECE35) — entrada na empresa, retorno dos materiais, produção das ofs", "Recebimento de Notas de Empresa do mesmo Grupo – RECE35.pdf", "Pedido Serviço: 10763 Cliente: BF\n\nROTINA NOVA PARA EFETUAR A GESTÃO DE TERCEIRIZAÇÃO/MOVIMENTAÇÃO DE MATERIAIS ENTRE EMPRESAS DO\nPROPRIO GRUPO, QUE EFETUARÃO A PRODUÇÃO SOB TERCEIRIZAÇÃO\n\nvisão macro das empresas:\n- Empresa principal: BFX. neste empresa será efetuada:\n- engenharia;\n- pedido de venda;\n- geração do Plano de Produção, OF e necessidades de materiais;\n- fará a gestão de materiais (compras, abastecimento e consumos);\n- faturamento;\n\n- Empresas que efetuarão a toda terceirização para a BFX: Wots e Logistica.\ncada uma destas 2 empresas fará parte dos processos necessários à produção dos calçados.\n\nvisão macro do fluxo a ser desenvolvido:\n- A partir da empresa BFX, efetuar a Remessa"], "327-3": ["Retorno de Industrialização Depósito Disponível (FATU110) — OPERAÇÕES (ESTOQUE) - ESTO1 - CRIAR ABA PARA CADASTRAR OS PARAMETROS DE RETORNO DE…", "Retorno de Industrialização Depósito Disponível – FATU110.pdf", "Pedido Serviço: 14092 Solicitação:\nOPERAÇÕES (ESTOQUE) - ESTO1 - CRIAR ABA PARA CADASTRAR OS PARAMETROS DE RETORNO DE INDUSTRIALIZAÇÃO\nCriar aba para cadastrar os parametros de Retorno de Industrialização, ou seja a CFOP que deverá ser sugerida no\nprograma FATU110 para geração da NF de retorno. Utilizar a mesma lógica da aba ESTORNO.\n\nDocumentação:\nRECEBIMENTO - CADASTRO DE OPERAÇÕES (RECE2)\n\n- Na aba Operações Vinculadas, foi criada a opção para vincular uma operação de retorno.\n\nRETORNO DE INDUSTRIALIZAÇÃO DEPÓSITO DISPONÍVEL (FATU110)\n\n- Este programa irá sugerir a operação vinculada na operação da nota fiscal de remessa."], "327-14": ["Retorno de Industrialização Depósito Disponível (FATU110) — parciais do bloco, retorno nos blocos, qtde de unidade", "Retorno de Industrialização Depósito Disponível – FATU110.pdf", "Pedido Serviço: 19195 e 19263 Solicitação:\n19195:\n\nROTINA:\n\nVendas e Distribuição Faturamento Notas Fiscais\nRetorno de Industrialização Depósito Disponível ALTERAÇÃO:\nSugerir as qtdes parciais de retorno nos blocos \"Matéria Prima\" e \"Nota Fiscal de Entrada\", de acordo com as qtdes\nparciais do bloco \"Ordem Fabricação\".\n\nAs quantidades parciais do Bloco \"Ordem de fabricação\" podem ser de acordo:\n- de acordo com as qtdes parciais produzidas até o momento;\n- de acordo com a qtde que o usuário poderá informar manualmente neste bloco.\n\nPorém estas qtdes parciais sugeridas para estes blocos \"Matéria Prima\" e \"Nota Fiscal de Entrada\" deverão ainda\npermitir alteração manual como é até o momento.\n\nImp"], "327-16": ["Retorno de Industrialização Depósito Disponível (FATU110) — (2º item de retorno = também 75 peças)", "Retorno de Industrialização Depósito Disponível – FATU110.pdf", "(2º item de retorno = também 75 peças):\n\nAlterei para estas qtdes:   3ª apontamento:   \nAqui OK...2º item de retorno = 19 peças 4º apontamento:  \n2º item de retorno = 10 peças (no bloco OF, são 20 peças)\n\nAqui, o teste de alteração da qtde manualmente como se comporta: está OK (apenas que, neste caso, não\nfunciona a questão de poder alterar a qtde de retorno...porque o procedimento de alterar a qtde no bloco “OF” e\ndepois clicar no check box de seleção, sempre recalcula a qtde dos blocos MP e NFE de acordo com a qtde do bloco OF).\n\nPara alterar manualmente a qtde do bloco OF (é a qtde a faturar):\nModificar a qtde primaria e secundaria...  \n...e depois clicar no check box do bloco OF...\nCom i"], "331-2": ["Retornos de Remessa (RECE7) — ROTINA Suprimentos Recebimento Notas Fiscais Retorno Remessa Industrialização ALTERAÇÃO", "Retornos de Remessa Industrialização – RECE7.pdf", "Pedido Serviço: 27556 Solicitação:\nROTINA Suprimentos Recebimento Notas Fiscais Retorno Remessa Industrialização ALTERAÇÃO\n\n- Na rotina de triangulação de industrialização, no segundo retorno, item está vindo duplicado.\nPedido de compra gerado a partir do plano de necessidades: \nPara gerar a NF de saída   Primeiro retorno, ok:\n\nGerada a remessa triangular:  Ao gerar o\nsegundo retorno, o item é exibido 2 vezes:   Documentação:\nSuprimentos Recebimento Notas Fiscais Retorno Remessa Industrialização Detalhamento:\nNenhuma alteração foi realizada.\nConsiderando o contexto desse processo, deve-se configurar a opção \"Apropriação\" -> \"Estoque Industrialização\"\ncom o valor \"Sim\", na operação do item de"], "331-5": ["Retornos de Remessa (RECE7) — programa de Remessa de Terceirização, já trazer automaticamente os dados", "Retornos de Remessa Industrialização – RECE7.pdf", "E-mail — Assunto: programa de Remessa de Terceirização, já trazer automaticamente os dados\n\nEstamos com a seguinte dúvida:\n\nA entrada do retorno das nf do atelier já devem ser apontadas pelo lançamento da nf o processo da costura externa (processo 2).\nCadastramos hoje pela manhã para que a emissão das notas fiscais já aponte o setor da costura interna (processo 7).\nPorém, a Cintia não estava conseguindo\nSalvar o lançamento desta nf 7921, acusava que o setor 7 já estava baixado. Excluímos o apontamento do proc 7 e\nsalvamos a nf, mas o setor processo 2\nNão foi apontado pelo lançamento da Nota fiscal. Poderia nos informar qual cadastro está faltando?    zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz"], "331-6": ["Retornos de Remessa (RECE7) — programa de Remessa de Terceirização, já trazer automaticamente os dados Bom dia [Imagem:…", "Retornos de Remessa Industrialização – RECE7.pdf", "E-mail — Assunto: programa de Remessa de Terceirização, já trazer automaticamente os dados Bom dia  \n-já identifiquei o motivo da rotina estar tentando apontar o processo 7 e não ter apontado o processo 2 (isso quando\nestão fazendo o Retorno da Terceirização no programa RECE7-Retorno de Remessa Terceirização)\nÉ porque estas 2 OFs, que saíram com a NF 26512, tiveram o Processo 7 vinculado na Remessa (deveria ter ocorrido\no vinculo do processo 2). Dá para ver pela tela abaixo (mas o certo teria sido o processo 2, porque o serviço 6002\ntem sim vinculado o processo 2).\n\nTem mais OFs nesta situação...podes ver pela tela abaixo da Consulta\n\nOlhando pela tela abaixo, veja que as vezes está gerando "], "335-3": ["Emissão Ordem de Fabricação (CFAB11) — TIRAS FEITAS EM TERCEIRIZADOS Bom Dia Márcio,", "Rotina de Beneficiamento de Tiras.pdf", "E-mail — Assunto: TIRAS FEITAS EM TERCEIRIZADOS Bom Dia Márcio,\n\nSobre as tiras feitas em terceiros, a Ivete já está cadastrando alguma coisa para a Schutz e Arezzo e está\nfuncionando, mas gostaria que você olhasse também pelo menos duas destas estruturas para comparar com a\nproposta que eu montei no banco de testes para ver o que é melhor e mais correto.\n\nNa proposta que ela montou, ela não está criando um semi-acabado (conjunto), ela está colocando um componente\ndo couro (em m²) e outro componente da tira pronta (em metros).\n\nOs modelos que estão abertos no banco de produção são os modelos 004520 e 004526\n(produtos 3523629, 3523828, 3523549)\n\nA única dificuldade que eu encontrei na propost"], "335-5": ["Posição Remessa/Retorno (TERC3) — Visita do dia 30/09/2020", "Rotina de Beneficiamento de Tiras.pdf", "E-mail — Assunto: Visita do dia 30/09/2020\n\nVisita do dia 30/09/2020\nParticipantes: Jose Leandro Jose das Compras, Gelson\nAssuntos: revisão/avaliação de opções para controlar o serviço de virado de tiras e demais controles pertinentes ao tema.  \nIdeia final que será adotada:\n\n-Jose Leandro vai incluir o cadastro da “Tira Virada” na Lista de Material da Estruturação de Produto, como qualquer\noutra peça de couro/componente (será cadastrado itens Tiras semelhante a um material).\n\n-Também vai incluir o material necessário para a “Tira Virada”, no caso normalmente são couros em M2.\n\n-será utilizada a rotina de “Beneficiamento”, tanto para quando for a saída/envio de peles inteiras, como quando fo"], "338-5": ["Controle Industrialização (COMP25) — exigir remessa industrialização, blue em terceiros, controle de wet", "Rotina de Controle de wet blue em terceiros.pdf", "Agora aqui um teste na Pegada, criando uma Categoria com esta rotina “Exigir Remessa Industrialização”...\n\n...e de fato no Pedido de Beneficiamento, na lista de valores só traz NFs lançadas internamente e não NF de Recebimento Triangular...  \n...por exemplo não mostra na Lista acima esta NF Triangular que tem saldo*:\n\n*O que comprova a avaliação de 25062014 no .docx “Rotina de Controle de wet blue em terceiros.docx”  \n...e na listagem de NFs no Pedido de Compra, mostra este tipo de NF, feito a emissão diretamente no sistema, não sendo triangular:\n\nAgora novo teste...partindo desta outra NF de Saída e outro Produto, feito a emissão diretamente no sistema, não sendo triangular... \n...no moment"], "342-1": ["Transferências (FATU12) — TRANSFERÊNCIAS RECEBIMENTO - TRATAR RESERVAS (AO LANÇAR O RECEBIMENTO DE…", "Transferencia (Recebimento) - FATU12.pdf", "Pedido Serviço: 10873 Solicitação:\nTRANSFERÊNCIAS RECEBIMENTO - TRATAR RESERVAS (AO LANÇAR O RECEBIMENTO DE TRANSF.COMRESERVA,\nDEVERÁ ENTRAR NO ESTOQUE DESTINO COMO RESERVADO Transferências Recebimento.\n\nQUando remessar teve origem em reservas, na entrada o estoque também deverá ficr reservado.\natualmente está ficando como disponível.\n\nDocumentação:\nPLANO ABASTECIMENTO MATERIAIS - TRANFERÊNCIA PARA PRODUÇÃO (ESTO25)\n\nAo validar o parâmetro de inicialização OPERACAO_NF_TRANS, irá permitir operações de classe \"ESTO\" e \"FATU\".\nAnteriormente, permitia somente classe \"ESTO\".\n\nFoi realizada um alteração na lógica do programa para verificar, nas transferências, tanto estoque disponível, quanto esto"], "342-15": ["Transferências (FATU12) — Verificar e ajustar diferenças entre estoque físico X inventário - EM TRÂNSITO", "Transferencia (Recebimento) - FATU12.pdf", "Pedido Serviço: 70101 Cliente: Pegada Solicitação:\nVerificar e ajustar diferenças entre estoque físico X inventário - EM TRÂNSITO\n\nNota de saída de transferência 238795: Esta nota ela foi emitida dia 19/11/25   Documentação:\n\nSuprimentos Estoque Consultas Consulta Estoque Produto Detalhamento do desenvolvimento:\nNada foi feito.\n\nObservação:\nA operação 152.2 da nota de entrada não controla estoque, por isso não movimentou o estoque.  "], "343-37": ["Planejamento (MPSP2) — percentual de eficiência, meta informada, parâmetros recurso", "Planejamento_rotina e dados gerais - MPSP2.pdf", "Documentação:\nCONFIGURAÇÃO RECURSO BASE PLANEJAMENTO (PREC8)\nPassa a ser disponibilizada a coluna Meta, representando a meta padrão do processo/recurso no recurso base planejamento.\n\nPLANEJAMENTO (MPSP2)\nAo inserir um plano de produção na programação, o programa passa a avaliar a coluna Meta do processo/recurso do recurso\nbase planejamento em questão definido no programa configuração recurso base planejamento.\nQuando a meta estiver definifa com valor maior que zero, o programa poderá efetuar uma das duas possibilidades abaixo,\nconforme parâmetro do gestão 30 (MPS EFICIÊNCIA PROCESSOS):\nSe o parâmetro tiver como valor 'S', será calculada a coluna percentual de eficiência; neste caso, serão at"], "343-92": ["Planejamento (MPSP2) — Planeación, a partir de los patchs actualizados, en la BD de Pruebas 205 (y después así…", "Planejamento_rotina e dados gerais - MPSP2.pdf", "E-mail — Assunto: Planeación, a partir de los patchs actualizados, en la BD de Pruebas 205 (y después así que se actualizar la BD Producción) Buenos dias,\n\nPlaneación, a partir de los patchs actualizados, en la BD de Pruebas 205 (y después así que se actualizar la BD Producción):\n\nEs necesario que revisen el catalogo “Calendario Recursos” (está en Manufactura / CRP / Catastros).\n\nEl turno debe ser vinculado en solamente uno de los niveles de la estructura.\n\nHoy, en sus catálogos, lo tienen informado en el nivel de Recurso, de Recurso Base Planificación y de Grupo (miren\nabajo las 3 pantallas).\nTiene que estar solamente en uno de los 3 niveles.\nSe informado en el nivel de Grupo, el turno es v"], "343-98": ["Planejamento (MPSP2) — atualiza meta planejamento, ficha de operaciones, recursos processos processos", "Planejamento_rotina e dados gerais - MPSP2.pdf", "  Pedido Serviço: 19980 Solicitação:\n\nROTINA:\n\nManufatura\nPlanejamento Capacidade de Recursos Processos Processos ALTERAÇÃO:\n\n- Criar um parâmetro no programa PREC7 que possibilite atualizar a meta no planejamento quando ela seja alterada\nna ficha de operações.\nNome do parâmetro: ATUALIZA_META_PLANEJAMENTO\nNão = Valor Padrão.\nSim = Se tem meta informada na carga do recurso do planejamento mantem a informada, caso contrario atualiza o\nplanejamento com a nova meta informada na ficha de operações.\n\nObservação: Após alterar a meta, os planos devem ser atualizados no planejamento para que calculem com a meta nova.\n\nRUTINA:\n\nManufactura\nPlanificación Capacidade de Recursos Processos Processos ALTE"], "343-166": ["Planejamento (MPSP2) — Planejamento- MPSP2: Passar a considerar as configurações/cadastro do programa…", "Planejamento_rotina e dados gerais - MPSP2.pdf", "Pedido Serviço: 53786 Cliente: Duramas Solicitação:\nPlanejamento- MPSP2: Passar a considerar as configurações/cadastro do programa ¿Configurador de\nMeta/Eficiência Prevista por Recurso-PREC33¿ Documentação:\nManufatura\nPlano Mestre de Produção (MPS)\nPlano Mestre de Produção Planejamento Parâmetro Inicialização:\nBUSCAR_DADOS_PREC33 | DEFINE SE AO EFETUAR O PROCEDIMENTO \"ATUALIZAR CONSOLIDADA\", OS DADOS DE\n\"PESSOAS\" E \"EFICIÊNCIA\" SERÃO BUSCADOS DO PROGRAMA PREC33.\n\nDetalhamento:\nCriado o parâmetro de inicialização BUSCAR_DADOS_PREC33 que define se a opção \"Atualizar Consolidada\" do\nMPSP2 (Planejamento) irá considerar os dados de eficiência e pessoas balanceadas caso estejam cadastrados no\nprog"], "344-1": ["Plano Abastecimento Materiais (ESTO25) — RELATÓRIO ESPECIFICO QUE RELACIONE DADOS DE FORMULAÇÃO DE CURTUME, COM DADOS DA OF,…", "Ordem de Fabricação_Geração e Abastecimento - MPSP46_ate pagina 100.pdf", "Pedido Serviço: 8343 Cliente: Minuano Solicitação:\n\nRELATÓRIO ESPECIFICO QUE RELACIONE DADOS DE FORMULAÇÃO DE CURTUME, COM DADOS DA OF, PESAGEM\nDESTAS OFS E DOS CAMPOS A SEREM CRIADOS NA ENGENHARIA.\n\nCriar um relatório especifico que relacione dados de formulação de curtume, com dados da OF, pesagem destas Ofs\ne dos campos a serem criados na engenharia.\n\nLay out e campos com semelhanças ao relatório desenvolvido sob pedido serviço 8301.\n\nIdeia: fazer a impressão a partir do programa Plano Abastecimento Materiais - Requisição (ESTO25). Será utilizado\nnormalmente o filtro de OF e multiplo de OFs.\n\nCampos:\nNo cabeçalho:\nFormula: idem pedido serviço 8301.\nOFs: será impresso ao invés de campo Núm"], "344-3": ["Plano Abastecimento Materiais (ESTO25) — TRATATIVA PARA: GERAÇÃO DE SEMI-ACABADO TINTAS DEVERÁ SER ENTRE O PROCESSO DE PRODUÇÃO…", "Ordem de Fabricação_Geração e Abastecimento - MPSP46_ate pagina 100.pdf", "Documentação:\n\nRelatório de Formulações (ESTO81)\nEste relatório é impresso através do Plano Abastecimento Materiais (ESTO25).\n\nSua finalidade é imprimir todas as formaluações com seus respectivos materiais.\n\nNovo parâmetro de inicialização CATEGORIA_PRODUTO_FORMULA% - Indica o código da categoria de produto para\no produto que será exibido no campo fórmula do relatório. o parâmetro pode ser cadastrado diversas vezes, onde %\nserá substituído por 1,2,3...\nNão obrigatório.\n\nColunas do relatório:\n\n- Coluna Flexível 4: quarto campo da especificação técnica do material da lista de materiais.\n- Ini.: preenchimento manual;\n- Fim: preenchimento manual.\n\nxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"], "344-13": ["Emissão Ordem de Fabricação (CFAB11) — Fluxo da rotina de formulas de acabamento", "Ordem de Fabricação_Geração e Abastecimento - MPSP46_ate pagina 100.pdf", "Fluxo da rotina de formulas de acabamento:\n- permite alterar a qtde a ser gerada...\n- permite informar uma qtde de “Aproveitamento...”\nBaixar os materiais necessários para a formula a partir do botão “Materiais”...\n\nEsta baixa poderá ser visualizada no programa ESTO25, e a partir do ESTO25 poderá ser excluída esta baixa.\n\nA partir do botão de impressão permite imprimir a formula...\nSó não permite a partir da Visualização, porque tem um controle de “Reimpressão”, que o sistema imprime\nautomática “Reimpressão” quando é impresso a OF a partir do programa normal de Emissão de OFs. \nFazer o procedimento de apontamento da OF (que vai gerar a tinta para o estoque) \n\nDepois de dar o OK na mensagem K"], "344-19": ["Estruturação do Produto (EPRO15) — fiz o apontamento, pesagem, mostrado de maneira", "Ordem de Fabricação_Geração e Abastecimento - MPSP46_ate pagina 100.pdf", "FUNCIONAMENTO DA ROTINA DO PROGRAMA, NAS ALTERAÇÕES, INCLUSÕES E EXCLUSÕES DA LISTA DE\nMATERIAIS DA ESTRTUTURAÇÃO DE PRODUTO, E COMO A ROTINA PROCEDE:\n\nEM RESUMO:\nASSIM QUE ALTERADO NA LISTA DE MATERIAIS, NA UTILIZAÇÃO DO PROGRAMA JÁ TRAZ ALTERADO ONLINE, NÃO\nPRECISANDO “ATUALIZAR MRP” NEM FAZER O APONTAMENTO DO PROCESSO QUE TEM A “PESAGEM” PARA QUE OS\nMATERIAIS E SUAS QTDES ESTEJAM ATUALIZADOS CONFORME A ALTERAÇÃO NA LISTA DE MATERIAIS.\nOU SEJA,\nO PROGRAMA BUSCA A INFORMAÇÃO DIRETAMENTE DA LISTA DE MATERIAIS, NÃO DE UMA TABELA QUE TENHA\nGRAVADO AS NECESSIDADES A PARTIR DE UMA GERAÇÃO COMO O PLANO DE PRODUÇÃO OU A PESAGEM.\n\nTestes na rotina de geração de formulas/pesagem (item 1 acima)\nTeste"], "344-41": ["Emissão Relatório (ESTO81) — ORDEM DE FABRICAÇÃO - GERAÇÃO E ABASTECIMENTO: CRIAR NOVA VERSÃO DE IMPRESSÃO DE…", "Ordem de Fabricação_Geração e Abastecimento - MPSP46_ate pagina 100.pdf", "Pedido Serviço: 16603 Cliente: Wellour Solicitação:\nORDEM DE FABRICAÇÃO - GERAÇÃO E ABASTECIMENTO: CRIAR NOVA VERSÃO DE IMPRESSÃO DE RELATÓRIO,\nAGREGAR FUNCIONALIDADE NO CADASTRO DE ESPECIFICAÇÕES TÉCNICAS ROTINA:\n Manufatura\nPlano Mestre de Produção (MPS)\nPlano Mestre de Produção\nOrdem de Fabricação - Geração e Abastecimento ALTERAÇÃO:\nCriar nova versão de impressão do relatório de Formulações.\nBase: versão ESTO81\nNo Cabeçalho imprimir os campos:\nData de Emissão e numero da pagina\nEmpresa e Unidade Negocio\nFormula: conteúdo idem versão ESTO81\nProcesso: Processo ao qual está vinculado o produto da \"Formula\"\nProduto: conteúdo idem versão ESTO81\nÀ direita, em campo destacado: descritivo do Rec"], "344-53": ["Plano Abastecimento Materiais (ESTO25) — plano de abastecimento, indevidamente as qtdes, mensagem ao usuário", "Ordem de Fabricação_Geração e Abastecimento - MPSP46_ate pagina 100.pdf", "Pedido Serviço: 18684 Cliente: Nimo ROTINA:\n\nManufatura\nPlano Mestre de Produção (MPS)\nPlano Mestre de Produção  \nOrdem de Fabricação - Geração e Abastecimento ALTERAÇÃO:\nCriar validação que não permita duplicar, indevidamente, as qtdes de formulação (campo Quantidade).\nQuando tentar ocorre esta situação, abortar e dar mensagem ao usuário, algo como: Mensagem KND-003620:\n\"Geração de Plano de Abastecimento não permitida, devido tentativa de duplicação das qtdes dos materiais (Pedido Serviço 18684).\" Documentação:\n\nFoi criado no programa Ordem de Fabricação - Geração e Abastecimento (MPSP46) uma tranca (mensagem\nKND-003620) para não inserir materiais duplicados ao gerar o plano de abasteciment"], "344-56": ["Emissão Ordem de Fabricação (CFAB11) — campos: OF, Recurso, Misturas, Apontar/Baixar Produtos, Materiais (a", "Ordem de Fabricação_Geração e Abastecimento - MPSP46_ate pagina 100.pdf", "Nova opção para o procedimento de \"Apontar/Baixar Produtos\" (atualmente feito na tela \"Monitoramento\"):\nDetalhamento no anexo.\n\nDocumentação:\nO programa Estruturação do Produto (EPRO15) foi alterado para permitir informar a quantidade de perda por recurso.\nO programa Ordem de Fabricação - Geração e Abastecimento (MPSP46) recebeu as seguintes alterações:\n- Na tela de filtros, foi adicionado o filtro de Recurso, que será aplicado apenas sobre o planejamento, portanto, ao\nutilizar este filtro, todas as ordens de fabricação que não estiverem planejadas serão descartadas.\n- Na aba \"OF\" foi adicionado o campo \"Recurso\", permitindo vincular e calcular a quantidade de perda de acordo com seu recurso"], "344-63": ["Log - Configuração (ADMI229) — operacao estoque atm, cristiano andres, neces prod", "Ordem de Fabricação_Geração e Abastecimento - MPSP46_ate pagina 100.pdf", "osterior quais as alterações efetuadas no programa MPSP46... \nAqui um select de Cristiano que mostra dados da tabela envolvida acima:\n[11:20:35] Cristiano Andres: [Código: NECES_PROD_ALTERACAO_ATM NECES_PROD_ATM OF_ATM]\n\nAqui orientação de Cristiano em quais tabelas colocar LOG\n[11:24:24] Cristiano Andres: NECES_PROD_ALTERACAO_ATM MEDICAO_GTB_ATM MEDICAO_NECES_AGRUP_GTB_ATM\n\n(Além do mais, penso ser importante colocar também nas 2 tabelas:\n-NECES_PROD_ATM\n-PRODUTO_MATERIAL_ATM (já está listada abaixo na tela)\nIsso porque, conforme mais abaixo, a tabela que faz trazer as formulas na aba “OF” é a NECES_PROD_ATM. Marcio, 190218). \nMarcio 160925: também possivelmente é importante a tabela PLANO_"], "345-12": ["Relatório (CFAB182) — /Krumenauer...referente a consumos", "Ordem de Fabricação_Geração e Abastecimento - MPSP46_ate pagina final.pdf", "/Krumenauer...referente a consumos\nadicionais/acréscimos e posteriores ao consumo inicial da fórmula:\n\n“Quanto à segunda forma que exemplificou (pela Solicitação + ESTO25), achei o processo um tanto burocrático, visto\nque o consumo é feito diretamente pelos pesadores de PQ, são usuários mais limitados para o uso do sistema.\nEntão este procedimento de gerar a necessidade, informar OF , incluir materiais, ...... para só depois consumir, se\ntornaria muito pouco prático para a rotina do setor.\n\nE utilizando o MPSP46, como é a forma de fazer?\nNão sou familiarizado com este programa, e não consegui adicionar linhas ou produtos...\nSeria o ideal utilizar esta mesma tela que pesadores já estão abitua"], "345-15": ["Programas (ADMI6) — campos: OF, Quantidade, Considerar Medição Atualização MRP, Medição, FATOR", "Ordem de Fabricação_Geração e Abastecimento - MPSP46_ate pagina final.pdf", "Marcio, 070525: em testes na Implantação da Couros Hidro...\n...para identificar, no programa MPSP46, aba “OF” campo “Quantidade”, qual a rotina que atualiza esta “Quantidade”:  \n...isso ocorre com esta configuração, no programa “Estruturação de Produtos – Abastecimento-EPRO59”, campo\n“Considerar Medição Atualização MRP”...\n\n(também não sei se, a configuração abaixo seja necessário...no caso, para este teste aqui, deixei configurado assim):  \nEntão, fiz o apontamento no programa ESTO112, com estes parâmetros: \n...e aqui tendo efetuado o consumo: fiz assim:\n\n...o que fez atualizar desta maneira a OF e o campo “Medição”:  \n...e com isso, conforme citado acima, aqui no MPSP46, atualizou o campo "], "345-18": ["Cópia de Ordem de Fabricação - Impressão OF (CFAB59) — exclusão do abastecimento, usados deste lote, tive que desfazer", "Ordem de Fabricação_Geração e Abastecimento - MPSP46_ate pagina final.pdf", " \nHidro_situação em 040925 em que foi necessário excluir o abastecimento WB que havia sido feito no ESTO112:\n-A necessidade porque utilizar de um Lote “errado” = porque na pratica este Lote teve que ser devolvido ao\nFornecedor através de uma NF de Saída...e na NF de Saída houve a validação do sistema que não permite a\nDevolução de outros Lotes que não sejam dos Lotes da Compra...\n...então, tive que desfazer o consumo destes Lotes abaixo (porque fisicamente não foram usados deste Lote para\nfazer o consumo, tanto é, que foi devolvido fisicamente este Lote/esta NF de Entrada)\n\nEstava assim antes da Exclusão do abastecimento...este era o movimento...estas tela abaixo é antes da Exclusão deste ab"], "345-19": ["Cópia de Ordem de Fabricação - Impressão OF (CFAB59) — processos e auxiliares, próximo passo, corantes", "Ordem de Fabricação_Geração e Abastecimento - MPSP46_ate pagina final.pdf", "Hidro_situação em 092025, em que determinado item da Lista de Material da Fórmula, no caso o “Material” 4-\nCORANTES (que não é exatamente um “Material”, mas sim um dos “Materiais” PROCESSOS E AUXILIARES (como\nAgua, Esgotar,...)...no caso, PROCESSOS E AUXILIARES = é uma Categoria específica para estes cadastros...  \n...na qual num “Plano Abastecimento” a rotina não respeitava a “exclusão” ou “substituição” deste “Material” 4-\nCORANTES por um outro Código de Material...\n...O que acontecia:\n-Em reconsultas do Plano Abastecimento que teve alterações neste “Material” 4- CORANTES, as “exclusão” ou\n“substituição” não ficavam efetivadas no Plano Abastecimento: sempre “voltava” o mesmo “Material” 4- "], "345-20": ["Posição do Plano de Produção (CFAB24) — Hoje a fórmula tem os corantes assim", "Ordem de Fabricação_Geração e Abastecimento - MPSP46_ate pagina final.pdf", "Hoje a fórmula tem os corantes assim: \nExcluímos parte dos corantes (cfe acordado com equipe Hidro) e ajustamos os insumos dos corantes que ficaram.\n\nReconsultando na fórmula.   Pedido para teste.   Antes das alterações. \nO primeiro corante alteramos para outro código e insumo e o segundo excluímos.\n\nSalvar e gerar o plano.  Gerar relatório. \n\nVoltamos e reconsultamos aqui.\n\nAlterações ficaram salvas. \n\nReconsulta voltando da aba seleção. Alterações são ficaram salvas.\n\nApaguei o teste acima no Cliente zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz\n\nVerificando formulas com o 4 – CORANTE. [Código: PRODUTO_ATM PRODUTO_MATERIAL_ATM]\n\nA listagem de Fórmulas mostradas acima tem o “Material” 4-CORANTES...\n\n"], "345-25": ["Estruturação do Produto (EPRO15) — acessando de novo, veja que ficou, materiais no check", "Ordem de Fabricação_Geração e Abastecimento - MPSP46_ate pagina final.pdf", "No voltar da tela acima, veja que o sistema atualizou OK o campo “Status” com BAIXADO:  ZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZ\nAqui mais um teste feito, com mesmo procedimento acima, porém com mais OFs = 2 OFs: aqui selecionando 2 novas OFs...\n\n...Na próxima tela preenchido o Recurso e gerado o “Plano Abastecimento” e Voltado... \nDepois, acessando de novo este Plano de Abastecimento, selecionado e clicado no botão “Materiais”...\n\n....dentro do botão e na aba “Materiais”, selecionado os Materiais no check box da direita, clicando no botão\n“Baixar” e “Confirmar” da tela abaixo: o programa retornou que as Baixas foram efetuadas...  \n...no “Voltar” para a aba OF: veja que ficou com o campo “Status” "], "346-3": ["Apontamento de Rótulos Completo - Processo 191 (CFAB134) — gerado a mensagem, validações são feitas, sucesso serão descelecionados", "Apontamento de Rótulos Completo – CFAB134.pdf", "Quando efetuado o procedimento de Confirmar, e existem alguns registros que não atendem, e vão gerar erro de Validação:\nGerou esta mensagem KND-000249:\n\nDando OK e fechando o programa...\n\n...a rotina “pára” de efetuar o processamento no registro que gerou a mensagem KND-000249: neste caso, poderia\nser desmarcado esta leitura, para seguir com demais processamentos (ver a documentação do pedido serviço, que é\nassim: Após a leitura, é possível selecioná-los um a um para então confirmar o apontamento dos selecionados. As\nvalidações são feitas registro a registro, portanto, se ocorrer erro no processo, este registro ficará selecionado e a\nmensagem de erro KND-000249 será exibida, mas os rótulos s"], "346-4": ["Apontamento de Rótulos Completo - Processo 191 (CFAB134) — leitura de caixa, apontamento e faturamento, corretamente a qtde", "Apontamento de Rótulos Completo – CFAB134.pdf", "Conferindo, está OK o apontamento deste Pedido/Plano de Produção:   zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz Testando esta condição:\nTestar faturamento em pedidos separados...\n\nOu seja:\nCriar 3 pedidos , com 3 caixas cada...(pode colocar no mesmo Plano de Produção)\nApontar completo os 3 pedidos.\n\nIr no programa PEDI4 e ver como vai se comportar para faturamento, fazendo pedido a pedido...\nOlhar principalmente a parte de volumes\n\nTeste realizado...1º: efetuado a leitura de 1 caixa de cada pedido, ficou assim as qtdes lidas:  Aqui OK:  \nSelecionando só 1 pedido para faturar: gera esta mensagem KND-002838: OK até aqui...\n\nAí a rotina alterou qtde de volumes...isso OK  \nCliquei no “Fat"], "349-4": ["Aprovação p/Cálculo de Custos (EPRO28) — CÁLCULO PREÇO DE VENDA - FVEN5 - CRIAR CAMPO PARA DEFINIR DATA DE TARIFA A SER UTILIZADA…", "Aprovação de Produto para Cálculo de Custos - EPRO28.pdf", "Pedido Serviço: 42741 Cliente: Pegada Solicitação:\nCÁLCULO PREÇO DE VENDA - FVEN5 - CRIAR CAMPO PARA DEFINIR DATA DE TARIFA A SER UTILIZADA NO CÁLCULO Rotina:\n\nVendas e Distribuição\nFormação de Preço de Venda\nCálculo Preço de Venda Alteração:\n\nCliente solicita que seja criado um campo para definir a data tarifa que será utilizada no cálculo formação preço de venda.\n\nDocumentação:\nVendas e Distribuição\nFormação Preço de Venda\nAprovação de Produto para Cálculo de Custos Detalhamento;\n- Criado um novo campo, \"Data Tarifa\", para poder ser informada a data desejada para busca das tarifas.\n\nVendas e Distribuição\nFormação Preço de Venda\nCálculo Preço de Venda Detalhamento:\n- Criado um novo campo, \""], "349-6": ["Aprovação p/Cálculo de Custos (EPRO28) — nível do produto, níveis da estrutura, cálculo de custos", "Aprovação de Produto para Cálculo de Custos - EPRO28.pdf", "Erro em 250422, para testes FPV do Henrich...ocorreu depois de dar um F7, colocar o produto 89547.1 e em seguida\nF8, gerou mensagem de erro “Código de erro 99999- Error 7343 occurred. See the release notes file (relnotes) for\ninformation about this error..”...\n...neste caso foi porque o produto pesquisado, 89547.1, não fazia parte deste parâmetro de inicialização CATEGORIA...\nOu seja, tentou-se pesquisar algo, mas este registro não fazia parte do parâmetro do programa...\n\nExtensão do acima, situação semelhante em 180424, na implantação da VPS...\nSó que neste caso não trazia nada abaixo do nível do Produto Acabado, que deveria ser calculado...  \nDetalhe: neste caso acessei o EPRO28 pelo botão"], "350-3": ["Atualizar MRP (MPSP33) — QUANDO ALTERADA A DATA DE VALIDADE FINAL DE UM MATERIAL E SE CRIA UM NOVO, AO ATUALIZAR O…", "Atualizar MRP - MPSP33.pdf", "Pedido Serviço: 64210 Cliente: Pegada Solicitação:\nQUANDO ALTERADA A DATA DE VALIDADE FINAL DE UM MATERIAL E SE CRIA UM NOVO, AO ATUALIZAR O MRP DE\nUM PLANO COM UMA DATA DE CADASTRO ANTERIOR, OCORRE A EXCLUSÃO INDEVIDA DAS NECESSIDADES.\n\nRotina:\n\nManufatura\nPlano mestre de produção (MPS) \nPlano mestre de produção Atualizar MRP Alteração:\nAjustar o programa de atualização do MRP para considerar a data de cadastro do plano. Dessa forma, mesmo que o\nmaterial tenha sido inativado, não deverá excluir as necessidades, desde que a data de validade final seja posterior à\ndata de cadastro do plano de produção.\n\nDocumentação:\n\nParâmetro Geral:\n50280 | VALIDA MATERIAIS COM BASE NA DATA DE CADASTRO DO P"], "353-3": ["Estruturação do Produto (EPRO15) — Explicações adicionais para Piagui em 09052016", "Características de Produto.pdf", "Explicações adicionais para Piagui em 09052016:\n\nEn el catálogo programa “Configuración Características Producto”, es posible utilizar:\n\nEs posible definir un vínculo de “Referencia” de una Característica en base a otra característica ya en el catálogo.\nEjemplo pantallas abajo.\nEn la característica “Segmento”, configurar que es dependiente de la definición del “Grupo Segmento”…\n\nAcá, el catálogo de Grupo Segmento y Segmento…\nEn el Segmento ya hay el vínculo con el Grupo Segmento…\n\nY al hacer el catalogo en la Estructuración del Producto, después de vincular el Grupo Segmento, trae solamente\nopciones de Segmento de acuerdo el Grupo Segmento definido arriba.   Zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz"], "353-4": ["Estruturação do Produto (EPRO15) — permitir inserir características, somente a nível, replicá-las aos itens", "Características de Produto.pdf", "Visto na implantação/migração de Produtos e suas características, na Aniger, em nov/dez/22:\n\nTabela onde são gravados os dados das Características:\n\nPRODUTO_CARACT_ATM Zzzzzzzzzzzzzzzzzzzzzzzzzzzz\n\nResumo de todas as tabelas envolvidas na característica, do seu cadastro, até chegar na informação no programa Estruturação de Produto-EPRO15:\n\nExemplo: [Código: CONFIG_CARACT_PRODUTO_ATM CARACT_PRODUTO_ATM PRODUTO_CARACT_ATM]\n\nExemplo do acima, nos programas:  [Código: CONFIG_CARACT_PRODUTO_ATM CARACT_PRODUTO_ATM]\nObs.: o ID da direita, não tem relação direta com o select acima...  \nAbaixo estou posicionado nas Propriedades da característica ALTURA SOLA (CM):\n\nSelect da tela acima:\nVeja que o CAR"], "353-5": ["EPRO02 — ROTINA \"CARACTERÍSTICAS\": EVOLUIR COM NOVAS FUNCIONALIDADES", "Características de Produto.pdf", "Pedido Serviço: 66751 Cliente: Piagui Solicitação:\nROTINA \"CARACTERÍSTICAS\": EVOLUIR COM NOVAS FUNCIONALIDADES.\n\n1. Rotina “Características”: evoluir com novas funcionalidades.\n\n1.1. No programa “Categoria-EPRO2”:\n-Incluir um botão “Config. Caract.” (Configuração de Características), e ao seu lado esquerdo um\ncampo que identifica se há algum preenchimento de Configuração de Característica neste botão (a\nrotina deve preencher este campo com “Sim” quando há algum preenchimento no botão, e “Não”\nquando não há algum preenchimento no botão = funcionalidade semelhante ao campo “Cat. Mat.” já existente).\n\nNeste botão “Configuração de Características” (tela abaixo), abrir a seguinte tela e campos:\nC"], "353-7": ["EPRO02 — posicionado na característica, veja que acessei, referente às características", "Características de Produto.pdf", "1.2.3 Quando no Produto tenha uma Categoria cujo botão “Configuração de Características” não\ntenha selecionado a definição “Categoria sem Características” e também não tenha vinculado Características:\n-Neste caso manter a rotina como está atualmente, ou seja, na aba Características serão\nmostradas todas as Características cadastradas no programa “Configuração Características\nProduto-EPRO48” (apenas registros “Ativos”).\n\n1.3. Revisar a maneira como está sendo mostrado no botão da aba “Propriedades”, a informação do ID\nda Característica vinculada ao Produto.   Exemplo tela abaixo...\nVeja que acessei o botão de Propriedades, e estando posicionado na 1ª característica preenchida, é\nmostrado o ID"], "357-4": ["Componente (EPRO14) — coluna emitir cartão, materiais da estruturação, definida no produto", "Cartão Componente.pdf", "Documentação:\nCOMPONENTE (EPRO14)\nNa aba padrões passa a ser disponibilizada a coluna Emitir Cartão.\nEsta coluna tem como padrão o valor 'Sim' quando criado um novo componente.\nÉ IMPORTANTE/FUNDAMENTAL que a coluna Emitir Cartão seja configurada de forma apropriada neste cadastro,\npois o seu valor será replicado como padrão na lista de materiais da estruturação do produto.\n\nESTRUTURAÇÃO DO PRODUTO (EPRO15)\nNa aba Configuração/Manufatura/Dados Gerais foi excluída a coluna Emitir Cartão.\nAté o momento esta era uma definição efetuada no produto.\nA partir deste pedido serviço, esta definição passa a ser efetuada na lista de materiais.\nA coluna Agrupamento Cartão continua sendo definida no produt"], "361-1": ["Categoria (EPRO2) — Sabes como transformar uma imagem em extensão .ico?", "Categoria – EPRO2.pdf", "E-mail — Assunto: Sabes como transformar uma imagem em extensão .ico?\n\neu utilizei um site que faz o serviço de transformar a imagem em ícone.\n\nhttps://convertio.co/pt/jpg-ico/\n\nSobre diminuir o ícone, teria que utilizar um editor de imagem. "], "361-4": ["Categoria (EPRO2) — rotina da categoria, modelos produtos acabados, produto em específico", "Categoria – EPRO2.pdf", "Detalhamento:\nCriado novo programa para inserção / alteração / exclusão de materiais da lista de materiais de um produto em específico.\n\nLayout do programa é em estilo tabela.\n\nSerá aberto pela Estruturação do Produto (Programa EPRO15), ao clicar na aba \"Lista Materiais Especial\".\n\nManufatura\nEngenharia e Desenvolvimento de Produto Cadastros Categoria Detalhamento:\n\nAdicionada funcionalidade para vincular categorias de materiais à categoria do produto.\nFuncionalidade para permitir definir quais os materiais das categorias de produtos que serão permitidos\nvincular na Lista de Materiais (e mostrar na sua lista de valores).\nNo programa Categoria, há um novo campo “Cat. Mat.” indicando se a cate"], "362-0": ["Classificação (EPRO67) — DIVERSOS: CRIAR O CADASTRO \"CLASSIFICAÇÃO\" PARA SER VINCULADO NA ESTRUTURA DO PRODUTO.…", "Classificação – EPRO67.pdf", "Classificação – EPRO67..\n\nPedido Serviço: 19839 Solicitação:\nDIVERSOS: CRIAR O CADASTRO \"CLASSIFICAÇÃO\" PARA SER VINCULADO NA ESTRUTURA DO PRODUTO. TRATAR RELATÓRIOS Manufatura\nEngenharia e Desenvolvimento de Produto Cadastros Classificação (cadastro novo) Engenharia Estruturação de Produto Chão de Fábrica Relatórios de Produção\nRelatório de Produção da Classificação - Análise da Classificação - CFAB79\nRelatório Analise de Compras Matéria-Prima Couro / Fornecedor - CFAB101\nRelatório da Ficha Técnica, programas EPRO34 E EPRO35_CURTUME ALTERAÇÃO:\n\n1=Criar cadastro novo \"Classificação\":\nNeste cadastro serão cadastradas as classificações utilizadas pelos curtumes.\nExemplo:\nTR1 TR2 TR3 IV V VI VI"], "363-6": ["Mercado (ADMI16) — Etiqueta EAN Boa tarde,", "Códigos EAN de Produtos Acabados_e Emissão de suas Etiquetas.pdf", "E-mail — Assunto: Etiqueta EAN Boa tarde,\n-a intenção é a MCM comprar licenças de códigos EAN, e codificar seus produtos próprios com esta codificação?\nSe sim, apenas adiantando, no sistema o registro das licenças compradas de códigos EAN é feita neste programa:\n\nA partir de ter registrado a numeração disponível pela EAN, e querendo iniciar a utilização e vinculação nos seus\nprodutos, configura-se este parâmetro para “S” de sim:  \n...e neste programa, onde se emite as etiquetas unitárias para cada produto, o sistema vai gerenciando, buscando\ndos números de códigos EAN disponíveis conforme cadastro acima, e vinculando o numero EAN ao cadastro de\nprodutos que tenham a etiqueta emitida.\n\n...no "], "364-1": ["Composição Plano Produção (CFAB20) — CFAB20 - Analisar relatório não está exibindo todas as quantidades que realmente estão no…", "Composição Plano Produção – CFAB20.pdf", "\nREFERENTE AO ABAIXO, EU NÃO ENTENDI O QUE TEM HAVER O QUE FOI ESCRITO NA “DOCUMENTAÇÃO” COM A\nREAL SITUAÇÃO DESCRITA NO PEDIDO SERVIÇO (O QUE EU TAMBÉM TENHO DÚVIDAS...IDEAL SERIA REVISAR\nCOMO FOI DESENVOLVIDO ORIGINALMENTE ESTA OPÇÃO DO “Listar com Aproveitamento” DO RELATÓRIO) Pedido Serviço: 69204 Cliente: Labelli Solicitação:\nCFAB20 - Analisar relatório não está exibindo todas as quantidades que realmente estão no plano Rotina:\nManufatura Chão de Fabrica Relatório de Produção\nComposição Plano de Produção Alteração:\n1 - Verificar o relatório CFAB180, que atualmente não exibe a quantidade de aproveitamento nas seguintes situações:\nAo gerar o plano de produção com aproveitamento, temos um "], "369-1": ["Consulta Etiqueta Unidade Produto (CFAB56) — APONTAMENTO DO PAR: DESENVOLVER A ROTINA DE APONTAMENTO DO PAR A PAR", "Consulta Etiqueta Unidade Produto – CFAB56.pdf", "Pedido Serviço 3582 Solicitação:\nAPONTAMENTO DO PAR: DESENVOLVER A ROTINA DE APONTAMENTO DO PAR A PAR.\n\nNecessário também:\n- impressão de etiqueta do par;\n- programa de apontamento, via coletor;\n- relatório que mostre os dados da tabela de par e situação de apontamento.\n\nNecessário avaliar rotina existente na V3, e desenvolver as mesmas funcionalidades.\n\nSobre a impressão da etiqueta do apontamento do par:\nA empresa utiliza a versão V3, o programa Emissão Etiquetas p/ Apontamento, com classificação DATAMAX\nObservar a alteração efetuada no Pedido serviço 3209:Alterar ordem de impressão das etiquetas:\npassar a impressão para a seguinte ordem:\nOrdem de Fabricação, largura, tamanho.\n\nDocumentaçã"], "369-3": ["Consulta Etiqueta Unidade Produto (CFAB56) — KUNDEN ENCAIXOTAMENTO - NECESSÁRIO CONSULTA DOS TALÕES QUE AINDA NÃO FORAM LIDOS NA…", "Consulta Etiqueta Unidade Produto – CFAB56.pdf", "Pedido Serviço: 57551 Cliente: Lutheuz Solicitação:\nKUNDEN ENCAIXOTAMENTO - NECESSÁRIO CONSULTA DOS TALÕES QUE AINDA NÃO FORAM LIDOS NA APLICAÇÃO.\n\nRotina:\n\nManufatura Chão de Fábrica Consultas\nConsulta Ordem de Fabricação – CFAB2 Alteração:\n\nNecessário consulta dos talões que ainda não foram lidos na aplicação de \"Encaixotamento e Liberação Faturamento\".\n\nDocumentação:\nManufatura Chão de Fábrica Consultas\nConsulta Ordem de Fabricação – CFAB2 Detalhamento:\nAdicionada a Check Box \"Exibir Apenas Talões não Encaixotados\" para filtrar somente os talões “não encaixotados”*\nna aba de \"Talão\".\n\n*no caso, referente ao “não encaixotados”, este procedimento ocorre na leitura de talões no programa\n“Enc"], "370-5": ["Consulta Ordem de Fabricação (CFAB2) — necessidade de compra, três vezes, triplicado", "Consulta Ordem de Fabricação - CFAB2.pdf", "Pedido Serviço: 42116 Cliente: TEA Solicitação:\n\nRotina:\nSuprimentos\nPlanejamento Necessidade de Materiais Abastecimento (MRP)\nPlano Abastecimento Materiais - Requisição Alteração:\n- No programa ESTO25, a necessidade de sintetico está diferente da necessidade de compra pelo COMP13,\nVer e se necessário, ajustar a rotina para que no ESTO25 também mostre a mesma quantidade.\n\nNo ESTO25, filtrando o plano 689 e o produto 20834\nGerou necessidade de 113,4 metros = triplicado, porque a necessidade real é 37,80\nNo COMP13, também filtrado o mesmo plano e produto\nGerou necessidade de compra de 37,8 metros = aqui correto...\n\nAnalisando o plano... as OFs que necessitam deste material são as três abaixo.\n"], "370-6": ["Consulta Ordem de Fabricação (CFAB2) — Situação vista na Aniger em 210223", "Consulta Ordem de Fabricação - CFAB2.pdf", "Situação vista na Aniger em 210223:\n\nUtilizei este select para identificar os Recursos Base Planejamento do cadastro do PREC8, que tem vinculado mais de\n1 vez o mesmo Processo... [Código: CONFIG_RECURSO_BASE_ATM RECURSO_ATM] \nTendo mais de 1 vez o mesmo código de Processo, gera duplicação de dados visualizados em alguns\nprogramas/consultas, como o abaixo...(revisado por Roberto, abaixo):\n\n[17/02 10:31] Roberto Schumacher | Kunden Systems\nTem relação com o planejamento... vi que está carregando dois recursos diferentes...\n\n[17/02 10:32] Roberto Schumacher | Kunden Systems\nvou testar essa parte do planejamento agora\n\n[17/02 10:32] Roberto Schumacher | Kunden Systems\nver se vai permitir incluir"], "372-20": ["Cópia de Ordem de Fabricação - Impressão OF (CFAB59) — linha do material, veja que zerou, trazido no abastecimento", "Copia Ordens de Fabricação - CFAB59.pdf", "Em 121124, avaliação realizada para atender a um questionamento ao protocolo 241107009/Wellour, referente a...\n\n“Monica.Wellour 07/11/2024 - 10:09:45\n\nconseguem ver a movimentação que foi feita nessa OF? ela foi estornada, a princípio corretamente, porém as peças\ncontinuam aparecendo (olhando a tela abaixo a qtde de 532 PC (TAMBÉM MOSTRA NO CFAB59) Monica.Wellour 11/11/2024 - 14:27:55\nOlá, só existem dois programas que são obrigatórios para estornar uma OF\nprimeiro esse, onde é informada a of nessa tela e após, na aba requisições é alterado e excluído a matéria prima que foi abastecida\n\napós esse processo, vem nesse programa aqui, informa o numero da OF e o número 2, aí abre uma caixinha par"], "372-22": ["Cópia de Ordem de Fabricação - Impressão OF (CFAB59) — exclusão do abastecimento, usados deste lote, tive que desfazer", "Copia Ordens de Fabricação - CFAB59.pdf", "Hidro_situação em 040925 em que foi necessário excluir o abastecimento WB que havia sido feito no ESTO112:\n-A necessidade porque utilizar de um Lote “errado” = porque na pratica este Lote teve que ser devolvido ao\nFornecedor através de uma NF de Saída...e na NF de Saída houve a validação do sistema que não permite a\nDevolução de outros Lotes que não sejam dos Lotes da Compra...\n...então, tive que desfazer o consumo destes Lotes abaixo (porque fisicamente não foram usados deste Lote para\nfazer o consumo, tanto é, que foi devolvido fisicamente este Lote/esta NF de Entrada)  \nEstava assim antes da Exclusão do abastecimento...este era o movimento...estas tela abaixo é antes da Exclusão deste aba"], "374-18": ["Emissão Ordem de Fabricação 1 Processo (CEXC55) — EMISSÃO DE ORDEM DE FABRICAÇÃO - CEXC55 - REPORT CEXC56 - TRAZER A ORDEM DOS MATERIAIS…", "Emissão de OF.pdf", "Pedido Serviço: 52591 Cliente: Smart Solicitação:\nEMISSÃO DE ORDEM DE FABRICAÇÃO - CEXC55 - REPORT CEXC56 - TRAZER A ORDEM DOS MATERIAIS CONFORME E\nLISTA DE MATERIAIS DO PRODUTO Rotina:\n\nEmissão de Ordem de Fabricação - CEXC55 - Report CEXC56 \n Alteração:\n\nTrazer os materiais conforme a está na lista de materiais do produto.\n\nDocumentação:\nEmissão de Ordem de Fabricação - CEXC55 - Report CEXC56 Detalhamento:\nAlterada a ordenação dos materiais demonstrados no relatório para a ordem que estão cadastrados na engenharia do produto."], "374-20": ["Consulta Ordem de Fabricação (CFAB2) — cordato na tentativa, colocamos o atributo, listar somente materiais", "Emissão de OF.pdf", "Em 240522, mensagem “ORA-20000: Erro GERA_MANUFATURA_1TMP_P: ORA-00936: missing expression”...\nOcorrido na implantação da Cordato, na tentativa de Emissão de OF – CFAB7...\n\nIdentificado que ocorre quando o parâmetro de Inicialização\nLISTAR_SOMENTE_MATERIAIS_COM_NECESSIDADES_GERADAS está com Atributo = N, então gera esta mensagem... \nPara resolver: colocamos o atributo com S, e aí gerou o relatório:"], "374-24": ["CFAB155 (CFAB155) — passando a imprimir, versão de impressão, emissão ordem", "Emissão de OF.pdf", " Pedido Serviço: 65427 Cliente: VPS Solicitação:\n\nRotina:\n\nManufatura Chão de Fábrica Relatórios de Produção\nEmissão Ordem de Fabricação Alteração:\n\nPrograma \"Emissão de Ordem de Fabricação-CFAB7\": criar nova versão de impressão, a partir da versão CFAB155,\nalterando os seguintes 3 itens abaixo:\n\n-O código de barras, passando a imprimir o código de barras com a informação apenas do nro da OF (sem a\ninformação do Processo) para possibilitar que o código de barras seja lido em programas de Apontamento de\nProdução \"APONTAMENTO PRODUCAO OF UNICO\".\n-A descrição do código de barras (que é impresso logo abaixo do Código de Barras) passando a imprimir cfe a\nalteração do item acima.\n-Deixar de imprim"], "374-28": ["Emissão Ordem de Fabricação (CFAB11) — EMISSÃO DE OF: ADEQUAR A IMPRESSÃO DA OF (CAMPOS, LAYOUT)", "Emissão de OF.pdf", "E-mail — Assunto: Alexis, precisava que você orçasse um Pedido de Serviço Especificação para AKS...\n\n...tendo como base a mesma funcionalidade já existente neste pedido de serviço 8328 abaixo...(Só a funcionalidade\nque está em vermelho) Pedido Serviço: 8328 Solicitação:\nEMISSÃO DE OF: ADEQUAR A IMPRESSÃO DA OF (CAMPOS, LAYOUT)\nAdequar a impressão da OF (campos, layout). Possivelmente versões diferentes de acordo com produto (Estofamento, tapetes,...) Documentação:\nEMISSÃO ORDEM DE FABRICAÇÃO (CFAB7)\nRelatório Emissão de Ordem de Fabricação Tapetes (CFAB19_MINUANO_TAPETES):\nEste relatório possuirá três páginas de informações distintas.\nA página 1 possuirá é baseada nos processos da ordem de f"], "375-2": ["Emissão Ordem de Fabricação (CFAB158) — CFAB7 - CRIAR NOVA VERSÃO DO RELATÓRIO Rotina", "Emissão de OF_Tipos de emissão de OF e variações de Report.pdf", "Pedido Serviço: 39805 Cliente: Pegada Solicitação:\nCFAB7 - CRIAR NOVA VERSÃO DO RELATÓRIO Rotina:\n\nManufatura Chão de Fábrica Relatórios de Produção\nEmissão Ordem de Fabricação Alteração:\n\nCriar nova versão do relatório com base do relatório CFAB11_HKUNTZLER_2_OFS_PAGINA.\n\nEsta nova versão do relatório, irá ter a observação do componente atrás do nome do produto, excluindo uma linha\nque não estava sendo usada.\n\nCom esta alteração, será criado um novo campo chamado INSUMO UNIT., que irá trazer o insumo bruto unitário por material.\n\nDocumentação:\nManufatura Chão de Fábrica Relatórios de Produção\nEmissão Ordem de Fabricação Detalhamento:\nCriado novo relatório CFAB158 com as alterações solicitad"], "375-3": ["Emissão Ordem de Fabricação 1 Processo (CEXC55) — EMISSÃO ORDEM DE FABRICAÇÃO: CRIAR NOVA VERSÃO DE EMISSÃO DE ORDEM DE FABRICAÇÃO Rotina", "Emissão de OF_Tipos de emissão de OF e variações de Report.pdf", "Pedido Serviço: 48041 Cliente: Smart Solicitação:\nEMISSÃO ORDEM DE FABRICAÇÃO: CRIAR NOVA VERSÃO DE EMISSÃO DE ORDEM DE FABRICAÇÃO Rotina:\n\nManufatura Chão de Fábrica Relatórios de Produção\nEmissão Ordem de Fabricação Alteração:\n\nCriar nova versão de Emissão de Ordem de Fabricação, fazendo uma cópia da versão atual CEXC55/CEXC56, e\nefetuar as seguintes alterações:\n\n1= Incluir a coluna “Recurso” ao lado direito da coluna “Processo” (para obter espaço, colunas que ficam mais a\ndireita de preenchimento manual de 1 a 9 reduzir para 1 a 4 (mais abaixo, item 2, será necessário mais espaço para\naumentar a largura do campo “Materiais”).\n(cfe tela 1 abaixo)\n\nBuscar a informação para este campo com a "], "375-5": ["CFAB155 (CFAB155) — Versão CFAB155, emissão OF em etiqueta adesiva Térmica, para TEA/Terra e Agua", "Emissão de OF_Tipos de emissão de OF e variações de Report.pdf", "Versão CFAB155, emissão OF em etiqueta adesiva Térmica, para TEA/Terra e Agua:\n\nxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx\n\nCFAB176 | Sequência 1 (Report) emissão OF em etiqueta adesiva Térmica, VPS:    "], "383-13": ["Estruturação do Produto (EPRO15) — tipo produto, marca no item, implantação na pacific", "Estruturação de Produto - EPRO15 com rotina nova de criação de Produto Acabado pelas Marcas_Variação, para Henrich.pdf", "Informações gerais desta nova rotina, com base nos meus testes e pesquisas efetuados:\n\n- a rotina não utiliza mais o a versão antiga do programa “Configurador de Produto” EPRO28 (coordenado por mim na\nvirada da K11 no Henrich).\n\nTelas, testes e conceitos da rotina nova:\nDesenvolvido a partir do pedido de serviço 31967\n...aqui determinação dos componentes Dependentes*(ver postagem de 030920 sobre Dependentes), Cartelas\n...todas as regras quanto às Especificações são definidas aqui nesta tela, no bloco “Especificação” (este programa\nEPRO77 acessado pela aba “Mat Esp.” do EPRO15) criado especialmente para atender à rotina nova.\nTelas abaixo do Henrich...\n\n...aqui o cadastro de Marca, e o vincul"], "383-49": ["Estruturação do Produto (EPRO15) — SKUs duplicadas", "Estruturação de Produto - EPRO15 com rotina nova de criação de Produto Acabado pelas Marcas_Variação, para Henrich.pdf", "E-mail — Assunto: SKUs duplicadas\n\nChegaram a avaliar sobre o abaixo?\n\nEu dei mais uma olhada, e ao que me parece, é devido a uma maneira como foram criadas as opções nas\n“Variações”. Exemplo tela abaixo:\nTem 2 opções de conjuntos para a cor “240-BRANCO” e a cor “8584-RAISIN” (outras cores desta variação não tem\nestas duplicidades de conjuntos, e aí não vai gerar produtos acabados duplos).\nPara mim, é errado ter este cadastro desta maneira, 2 conjuntos diferentes para a mesma cor.\nEntão, da maneira que está, logicamente vão estar aparecendo produtos hora com um conjunto, hora com outro,\ncriando assim produtos “duplicados” (a menos que consigam me indicar uma outra avaliação para esta situaçã"], "383-71": ["Estruturação do Produto (EPRO15) — PEDIDO DE VENDA: MOSTRAR OS COMPONENTES COM OS RESPETIVOS MATERIAIS QUE FORAM…", "Estruturação de Produto - EPRO15 com rotina nova de criação de Produto Acabado pelas Marcas_Variação, para Henrich.pdf", "  Pedido Serviço: 39547 Cliente: Henrich Solicitação:\nPEDIDO DE VENDA: MOSTRAR OS COMPONENTES COM OS RESPETIVOS MATERIAIS QUE FORAM ESPECIFICADOS, NO\nBOTÃO \"P+\" E NA IMPRESSÃO Rotina:\n\nVendas e Distribuição Pedidos Pedido Pedido de Venda Alteração:\n\n1= Criar parâmetro de inicialização no programa de Pedido de Venda PEDI1, para criar opção de obrigar informar o\ncampo \"Marca\" na aba Dados Gerais.\n\n2= Mostrar no Pedido de Venda PEDI1, ao clicar no botão \"P+\":\n- os componentes com os respetivos materiais que foram especificados no item de Pedido de Venda posicionado\n(seja especificado diretamente ou através da configuração de \"Dependente\").\n- além de também mostrar a cadeia de \"Conjuntos\" que fi"], "386-3": ["Estruturação de Produtos - Compras (EPRO60) — Avaliado os campos abaixo, na implantação Aniger", "Estruturação de Produtos – Compras – EPRO60.pdf", "Avaliado os campos abaixo, na implantação Aniger:\n\n“Lote Econômico Compras”: tem a função de ser o Lote Multiplo. Exemplo em sintéticos que o fornecedor só venda de\n50 em 50. Neste caso, ao gerar o Pedido de Compras pelo MRP, vai gerar de 50 em 50.\n\n“Pedido”: informei que não se aplica.\n\n“Agrupamento Plano Necessidades”: é a configuração de como mostrar no COMP13, aba “Necessidades” (e, neste\nprograma, na aba Opções/Agrupamento, ainda tem a possibilidade de optar pela configuração abaixo, ou uma outra).\n\n“Tipo Agrupamento Entrega”, com as opções Diária e Única...\n...exemplo tela abaixo, sendo “Única”, então vai agrupar na mesma Datas de Entrega toda a qtde do Plano de\nProdução (exemplo telas"], "387-1": ["Estruturação de Produtos - Inventário (EPRO58) — calculo de qtde, wms, utilizados apenas", "Estruturação de Produtos – Inventário – EPRO58.pdf", " \nEm 201222, para a implantação Aniger, analisado a utilização do campo Fator Conversão para indicar a Largura dos\nSintéticos, para que seja exportado a informação da largura ao WMS , e o WMS fazer o calculo de qtde de ML a\nseparar (sendo o controle de Estoque tanto no Kunden como no WMS em M2)...\n\nEfetuado vários testes para ver o impacto no programa de Cotações de Compras-COMP14 e no Pedido de Compras-\nCOMP3 e no Recebimento-COMP5, e em nenhum dos 3 programas refletiu/impactou ter a definição de Fator de\nConversão do EPRO58 tela acima (não sugeriu em diversos testes, de diversas maneiras realizado):  \nDesta maneira a avaliação que se tem é que tal campo/bloco são utilizados apenas na rotin"], "389-6": ["Emissão de Etiqueta por Unidade de Produto por Plano de Produção (PEDI7) — K11 - Etiquetas Buenos dias Erandi,", "Etiquetas Térmicas, funcionamento.pdf", "E-mail — Assunto: K11 - Etiquetas Buenos dias Erandi,\n\nAnexo ejemplos de los distintos modelos de etiquetas existentes.\n\nLa imagen abajo corresponde al programa/reporte para emisión de etiquetas en impresora láser. (Forms: PEDI7) "], "395-6": ["Grades (EPRO10) — Visto no treinamento interno com Roberto em 210521", "Grades - EPRO10.pdf", "Visto no treinamento interno com Roberto em 210521:\n\nBotão “Grade Exportação”:\n\nExiste para atender empresas como TEA, na emissão de Etiquetas dos calçados.\nO que informar aqui, vai imprimir na mesma etiqueta as diversas opções de tamanhos, no mesmo calçado.\nExemplo pratico: em calçados que tenham impresso o tamanho por exemplo em vários padrões, como Brasil, Mercosul, USA,...\nA “Descrição” que colocar aqui, vai ser impressa na etiqueta. \nÉ uma funcionalidade bem restrita à impressão de etiquetas: não tem haver diretamente com a rotina do\nGrade a Marcar do Kunden ERP.\n\nCheck box “Tamanho base”: é usado para sugerir no EPRO15, na Lista de Materiais, no campo “Variação de\nConsumo” para indicar"], "396-0": ["Grupo Código Barras (EPRO101) — ESTRUTURAÇÃO DE PRODUTO (EPRO15) - TER POSSIBILIDADE DE INFORMAR MAIS DE UM CÓD. DE", "Grupo Código Barras – EPRO101.pdf", "Grupo Código Barras – EPRO101..\n\nPedido Serviço: 59706 Cliente: Aniger Solicitação:\nESTRUTURAÇÃO DE PRODUTO (EPRO15) - TER POSSIBILIDADE DE INFORMAR MAIS DE UM CÓD. DE\nBARRAS NA GRADE DO MESMO PRODUTO.\n\nRotina:\n\nManufatura\nEngenharia e Desenvolvimento de Produto Engenharia Estruturação de Produto Alteração:\n\nTer possibilidade de informar mais de um cód. de barras na grade do mesmo produto.\nDefinir qual cód. usar no cliente.\nDemanda criação de cadastro: \"Grupo cód. barras\" .\n\nDocumentação:\n\nParâmetro Geral:\n50251 | HABILITA O CONTROLE DE GRUPO DE CÓDIGO DE BARRAS | DEFINE SE O SISTEMA HABILITARÁ O\nCONTROLE DE GRUPOS DE CÓDIGOS DE BARRAS NO CADASTRO DO CLIENTE E NA ENGENHARIA DO PRODUTO.\nATRIB"], "397-0": ["Importação de Talonamento (PEDI87) — Criar programa para importação de arquivo de talonamento Beira Rio Vendas e Distribuição", "Importação de Talonamento – PEDI87.pdf", "Importação de Talonamento – PEDI87..\n\nPedido Serviço: 66117 Cliente: Injepar Solicitação:\nCriar programa para importação de arquivo de talonamento Beira Rio Vendas e Distribuição\nNova Rotina - Importação Talonamento\n\n1. Criar programa para importação de talonamento(talão do cliente).\n1.1. Arquivo possui extensão ¿.BRO¿, mesmo do EDI de pedido de compra importado pelo PEDI14_LTZ.\n1.2. Seguir Layout de importação talonamento(Talão do Cliente).\n1.3. Desconsiderar espaços em branco antes ou depois dos dados de uma mesma coluna(sequência).\n1.3.1. Espaços entre caracteres de uma mesma coluna (sequência) deve ser considerado.\n1.4. Anexo a este pedido segue modelo de arquivo para importação de talon"], "401-2": ["Liberação Lote Produção Estoque p/ Venda Estoque Futuro (MPSP20) — rotina permite alterar, qtdes a serem, questão de poder", "Liberação Lote Produção Estoque para Venda Estoque Futuro - MPSP20.pdf", "Avaliação feita em 250220, para Brisa, em que está envolvido questão de poder alterar qtde do LE original, para\ndeixar de mostrar como saldo de Estoque Futuro para Venda (quando a produção real do LE será menor do que a\nqtde prevista do LE)...neste caso, rotina permite alterar a qtde de “saldo...” (configurando as Propriedades do campo para permitir alterar):\n36737_Val_250220_questão de poder diminuir a qtde de Pedido de EF\nTeste abaixo OK, permite alterar a qtde no Pedido de Venda, pós o item do Pedido estar num Plano de Produção.\nIsso para atender ao que foi solicitado por sr Jose Claudio, de ter uma Instrução de Revisão (ao menos uma\nalternativa ao que foi solicitado).\n\nTestes na rotina d"], "401-3": ["Liberação Lote Produção Estoque p/ Venda Estoque Futuro (MPSP20) — permitir faturar, algum saldo, tenha ficado", "Liberação Lote Produção Estoque para Venda Estoque Futuro - MPSP20.pdf", "...e não deixou digitar novo pedido com algum saldo que porventura tenha ficado em uma tabela: \nFazendo a Revisão dos 180 M:\n\nVeja que até aqui resolveu, na Revisão: trouxe as qtdes dos 180, e não mais 200...\n\nEfetuado todos os apóntamentos, cfe qtdes acima:\n\nE o LE de teste saiu daqui, desta listagem:\n\n***Faturamento é consequência, e já visto em teste anterior que vai permitir faturar a qtde reservada pelos apontamentos realizados acima."], "401-4": ["Liberação Lote Produção Estoque p/ Venda Estoque Futuro (MPSP20) — lote produção estoque, equipe brisa, volta para permitir", "Liberação Lote Produção Estoque para Venda Estoque Futuro - MPSP20.pdf", "Contato com Brisa em 070422, para atender à duvidas da rotina de Lote Produção Estoque...RA 220331026\n\nAssunto citado pela Brisa no RA:\n\nOi boa tarde, o Comercial e o PPCP vem enfrentando muita dificuldade com o LEs, gostaria de\nmarcamos um reunião para que eles explanem as dificuldades e também verificar se a rotina\nestá sendo utilizada para a finalidade correta. Peço o máximo de brevidade.\n\nRetorno/posição:\n\nBoa tarde. Para registro:\n\nefetuado reunião com equipe Brisa nesta manhã (Lizie, Luciana, Gabriel), das 10:00 hrs às 11:300 hrs, referente a\nrotina de Lote Produção Estoque.\n\nCitado pela equipe Brisa que, depois da atualização do ultimo patch em 29/01/2022, não estão mais conseguindo\ne"], "402-4": ["Pedidos de Venda (PEDI1) — PERMITIR INFORMAR UMA DATA DE ENTREGA PARA CADA ITEM", "Lote Produção Estoque - PEDI1.pdf", "Pedido Serviço: 11195 Solicitação:\nPERMITIR INFORMAR UMA DATA DE ENTREGA PARA CADA ITEM\nPermitir informar uma data de entrega para cada item do Lote de Produção Estoque.\n\nAtualmente o programa permite apenas informar 1 data para todos os itens.\n\nDocumentação:\nPEDIDO DE VENDA (PEDI1)\n\n- Novo parâmetro de inicialização: LOTE_PRODUCAO_PEDIDO, o qual indica se utilizará as regras de lote produção\nestoque ou pedido de venda.\n- Esta alteração abolirá o programa \"Lote Produção Estoque\" (MPSP19). Pois, o no próprio pedido de venda será\npossível criar um lote de produção."], "403-8": ["Manutenção de Transferência OF (CFAB106) — produção e faturamento, repor a qtde, quanto ao abastecimento", "Manutenção de Transferência OF - CFAB106.pdf", "Repassou tudo para a OF nova, transferida:\n\nApontei a expedição desta OF e consegui faturar normal: baixou do estoque normal.   zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz\n\nVenda para Beneficiamento, neste exemplo abastecimento total:\n\nOF original:   Materiais abastecidos:  \nAqui, transferência parcial para outro pedido, neste caso pedido de Beneficiamento 193288: informei pela metragem...\n\nNova OF gerada:  \nFracionou ok os consumos:\n\nAQUI, como mostra no programa de manutenção:  Efetuado a “volta”:\nNo 1º bloco:\nQuanto a OF, não selecionei o pedido...desta maneira quando não selecionado pedido, vai gerar uma nova OF para o\nmesmo pedido da OF de Origem...para repor a qtde q"], "409-5": ["Gerenciador de Serviços (CEXC109) — PLANEJAMENTO - NO PLANEJAMENTO (MPSP2), PASSAR A CALCULAR O TEMPO DE SETUP POR TAMANHO NA…", "Planejamento Matrizaria.pdf", "Pedido Serviço: 40989 Cliente: TEA Solicitação:\nPLANEJAMENTO - NO PLANEJAMENTO (MPSP2), PASSAR A CALCULAR O TEMPO DE SETUP POR TAMANHO NA OF Rotina:  Manufatura\nPlano Mestre de Produção\nPlano Mestre de Produção Planejamento CRP Processos Alteração:\n\n- Criar flag \"Calcular Setup por tamanho\" no programa de cadastro de fichas de operações (PREC7). Essa flag,\nhabilitar apenas caso o processo seja de carga \"máquina\".\n- No planejamento (MPSP2), passar a calcular o tempo de setup por tamanho na OF.\n\nDocumentação:\nManufatura\nPlano Mestre de Produção\nPlano Mestre de Produção Planejamento CRP Processos Detalhamento:\n\nCriado novo Checkbox 'Calcular Setup p/ tamanho' que será habilitado somente se o ti"], "409-9": ["Estruturação do Produto (EPRO15) — minutos minutos, setup, smart a rotina", "Planejamento Matrizaria.pdf", "Testes em 190123, para tentar implantar na Smart a rotina de Planejamento setup de Cores (config do programa PREC30).  \nTestes abaixo com esta config de “Tipo Agrupamento Planejamento”, está por “Plano”...ou seja, entendo que não\ntenha que ser necessariamente cfe uma tela acima por “Cor e Matrizaria” para funcionar os setups...\n\nCfe citado acima, referente a Recurso Base Planejamento, defini aqui um padrão...\n\nAqui definido este campo, “Tipo Cálculo Setup”:  \nAqui abaixo, teste com o Processo “Jumbo” = que é o processo “Gargalo”...RECURSO = JUMBO.\n...no PREC30 configurado um setup “padrão” de 20 minutos... RECURSO = JUMBO\n...veja que para a OF 13559 posicionada abaixo, o intervalo de produçã"], "414-1": ["Posição de Saldos por Plano e Cliente - AKS (MPSP83) — Desenvolver relatório novo Forms/Report(PDF): Posição de Saldos por Planos e Clientes", "Posição de Saldos por Plano e Cliente – MPSP83.pdf", "Pedido Serviço: 67836 Cliente: AKS Solicitação:\nDesenvolver relatório novo Forms/Report(PDF): Posição de Saldos por Planos e Clientes.\nO detalhamento do desenvolvimento deste Pedido de Serviço está no anexo 67836.PDF.\n\n1. Desenvolver relatório novo Forms/Report(PDF): Posição de Saldos por Planos e Clientes.\nO relatório está baseado nos Planos de Produção, Clientes vinculados nos planos (através dos\npedidos de venda e LEs vinculados aos planos) e os saldos dos processos de produção.\nÉ necessário considerar, tratar e retornar também os dados de LE's, pois os Planos de Produção\npodem ser compostos tanto por Pedidos de Venda quanto por LE's. Além disso, no LE também é\npossível vincular um Client"], "416-9": ["Consulta Etiqueta Unidade Produto (CFAB56) — principal desta operação, unidade de produto, vinculado ao rótulo", "Projeto HK para automação da expedição_rotulos_autorização embarque.pdf", "9.\nÉ o código de barras lido a partir do rótulo cabeçalho (primeira página do rótulo).\n3-ETIQ.:\nÉ o código de barras da etiqueta unidade de produto.\nVerifica se a etiqueta é do pedido vinculado ao rótulo lido na sequência 2.\nSe a etiqueta é do pedido vinculado ao rótulo, a etiqueta será apontada e vinculada ao rótulo. O apontamento de\nprodução irá ocorrer somente para etiquetas não reabertas.\nSe a etiqueta não é do pedido vinculado ao rótulo, a rotina passa para a sequência 4.\nPara cada leitura de etiqueta de unidade de produto será verificado se todas as etiquetas do pedido estão lidas. Caso\nseja verdadeiro, o rótulo será finalizado e passa(am) a ser impressa(s) a(s) página(s) do rótulo, ex"], "416-32": ["Gera NF pelo (FATU74) — Etiqueta (rótulo) Boa tarde Sobre o abaixo,", "Projeto HK para automação da expedição_rotulos_autorização embarque.pdf", "E-mail — Assunto: Etiqueta (rótulo) Boa tarde Sobre o abaixo,\nFizemos uma bateria de testes, com uma rotina que temos em funcionamento em outra empresa.\n\nEla é utilizada para imprimir etiquetas unitárias (par a par), fazer a leitura e gerar um rotulo (no anexo* coloquei um\npasso a passo com as principais informações).\n\nMas, tem que ver se tudo isso compensa para só trafegar o produto de uma Localização para outra, porque:\n-tem que imprimir etiqueta (teria que ver se a versão de impressão existentes seria aprovada pela Baenamora)\n-tem que imprimir 2 rotulos (teria que ver se as versões de impressão existentes seriam aprovadas pela Baenamora)\n-Fazer a leitura de todo este montante de etiquetas"], "420-1": ["Relatório de Produtos - T&A (EPRO81) — RELATÓRIO NOVO - DESENVOLVER RELATÓRIO QUE LISTE INFORMAÇÕES DO PRODUTO, NCM E CÓDIGO EAN…", "Relatório de Produtos, Class Fiscal e Codigos EAN – EPRO81.pdf", "Pedido Serviço: 44274 Cliente: TEA Solicitação:\nRELATÓRIO NOVO - DESENVOLVER RELATÓRIO QUE LISTE INFORMAÇÕES DO PRODUTO, NCM E CÓDIGO EAN ROTINA Manufatura\nEngenharia e Desenvolvimento de Produto Relatórios\nRelatório de Produto com NCM e EAN ALTERAÇÃO\n\n- Desenvolver relatório que liste informações do produto:\n* Código do produto;\n* Descrição do produto;\n* Estrutural do produto;\n* UM do produto;\n* NCM do produto, atribuída na aba Contábil/Fiscal do EPRO15;\n* Código EAN, de acordo com o que for gerado por tamanho. Listar todos.\n\nRelatório EPRO40 pode ser utilizado como base para o desenvolvimento, considerando os filtros existentes, porém\ndeve ser incluído o filtro de Pedido (Pedidos de Venda)"], "423-10": ["Relatório Ficha Técnica (EPRO34) — relatório estrutura, produto relatórios, engenharia e desenvolvimento", "Relatório Estrutura de Produto – EPRO34.pdf", "Pedido Serviço: 64313 Cliente: Cordato Solicitação:\n\nRotina:\nManufatura\nEngenharia e Desenvolvimento de Produto Relatórios\nRelatório Estrutura de Produto Alteração:\nAlterar relatórios EPRO34 e EPRO23 para gerar materiais repetidos cadastrados na estrutura do produto.\n\nDocumentação:\n\nManufatura\nEngenharia e Desenvolvimento de Produto Relatórios\nRelatório Estrutura de Produto Detalhamento:\nAjustado."], "427-0": ["Extrato Máquina (CFAB96) — ROTINA Manufatura Chão de Fabrica Relatórios de Produção", "Relatório Extrato Máquina – CFAB96.pdf", "Relatório Extrato Máquina – CFAB96 Pedido Serviço: 16567 Solicitação:\nROTINA Manufatura Chão de Fabrica Relatórios de Produção\nRelatório - Extrato Máquina (Novo Relatório) ALTERAÇÃO\n\nCriar relatório conforme modelo anexo onde as explicações dos campos estão como comentários em cada campo\n\nFiltros para o relatório:\n- Período (dos apontamentos efetuados, sempre tomando como base a data e hora inicio) - Deverá listar os dados\ndo período filtrado - Deverá ser obrigatório fazer o filtro do período\n- Máquina (s) / Recurso (s) - Deverá listar os dados das Máquinas (Recursos) filtradas - Default em branco onde deverá listar tudo\n- OF (s) - Deverá listar os dados das OFs filtradas s por pagina de papel A4. Exemplo acima.\nPara ele funcionar é necessário:\n- Incluir na Lista de Materiais da Estrutura do produ"], "454-6": ["Gera/Emissão Rótulo Unidade Armazenamento (FATU16) — emissão de rótulo, caminho logotipo, componentes e materiais", "Rotulos_Emissão_Caixas_Corrugadas - FATU16.pdf", "Pedido Serviço 3710:\n\nSolicitado:\nEMISSÃO DE ROTULO: DESENVOLVER LAYOUT UTILIZADO PELA EMPRESA NA VERSÃO V3\n\nA empresa utiliza na versão V3, o programa Emissão de Rotulos SNF199ML\n\nDetalhes a serem observados no desenvolvimento:\n- Código de produto impresso junto à descrição do produto;\n- Tamanho de fonte a utilizar:\nNome (do cliente), endereço, bairro, cidade, CEP, Estado (passar o descritivo para \"UF\"): utilizar tamanho de fonte\nidem impresso no campo Pedido Cliente e Pedido Interno.\nDemais campos utilizar a mesma fonte do programa SNF199ML Versão 3. Idem para o layout e campos impressos =\nconforme programa SNF199ML Versão 3.\n\n- Ao final do rótulo:\nImprimir até 4 Componentes e Materiais vi"], "454-13": ["Gera/Emissão Rótulo Unidade Armazenamento (FATU16) — fracionado para embarque, frações, apontamento de rótulos", "Rotulos_Emissão_Caixas_Corrugadas - FATU16.pdf", "Documentação:\nENGENHARIA DO PRODUTO (EPRO15)\nAlterações efetuadas na aba Configuração/Venda/Dados Gerais.\nForam criadas três novas colunas: Fracionado para Embarque, Número de Frações e Conciliar Embarque com Produto.\nFracionado para Embarque: indica se o rótulo do produto será composto por frações.\nNúmero de Frações: quando não informado assume o valor 1.\nConciliar Embarque com Produto: indica o produto com o qual este produto será embarcado. Será considerado no faturamento\ncomo um único volume.\nNão poderá ser utilizado ao mesmo tempo Fracionado para Embarque e Conciliar Embarque com Produto.\n\nGERA/EMISSÃO RÓTULO UNIDADE ARMAZENAMENTO (FATU16)\nPassa a ser levado em conta a coluna Fracionado"], "454-20": ["Gera/Emissão Rótulo Unidade Armazenamento (FATU16) — Geração de
