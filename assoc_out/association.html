 lançamento de “Transferência Localização”.\n\nExemplo abaixo. Gera com um nro de documento sequencial automático.\n\nQuando a Localização informada no campo “Localização Destino” não é do mesmo estabelecimento da “Localização Origem”:\nGera uma NFS de Transferencia de filial. \nInclusive: há um programa onde mostra todas as transferências efetuadas e que estão pendentes de gerar a NFS (usado/desenvolvido para Myrabel).\n\nXxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx\n\nEsta mensagem KND-000358 abaixo gerou na T&A, no in"], "209-1": ["Registro Controle Produção e Estoque (ESTO19) — ESTO15 - VALORES DO INVENTÁRIO NÃO ESTÃO BATENDO COM O ESTO108, E DIFERENÇA NO BLOCO K…", "Registro Controle Produção e Estoque – ESTO19.pdf", "Pedido Serviço: 41888 Cliente: Pegada Solicitação:\nESTO15 - VALORES DO INVENTÁRIO NÃO ESTÃO BATENDO COM O ESTO108, E DIFERENÇA NO BLOCO K Rotina:\n\nSuprimentos Estoque Relatórios Livro Inventário Alteração:\n\n1º Valores do inventário não estão batendo com os movimentos registrados no relatório ESTO108.\n\n2º Valores entre Bloco K e inventário do mês de abril e de maio não estão fechando.\n\nDocumentação:\nSuprimentos Estoque Relatórios\nRegistro Controle Produção e Estoque Detalhamento:\nLayout do relatório de Registro Controle Produção e Estoque alterado para que não considere no montante de\nentradas e saídas os lançamentos de consignação, uma vez que os mesmos continuam fazendo parte do estoque."], "209-2": ["Registro Controle Produção e Estoque (ESTO19) — ESTO19 - VERIFICAR LÓGICA DE CÁLCULO DO CUSTO UNITÁRIO", "Registro Controle Produção e Estoque – ESTO19.pdf", "Pedido Serviço: 46164 Cliente: Crislli Solicitação:\nESTO19 - VERIFICAR LÓGICA DE CÁLCULO DO CUSTO UNITÁRIO.\n\nRotina:\n\nSuprimentos Estoque Relatórios\nRegistro Controle Produção e Estoque Alteração:\n\n- Verificar lógica de cálculo do custo unitário.\n\nDocumentação:\nSuprimentos Estoque Relatórios\nRegistro Controle Produção e Estoque Detalhamento:\nA coluna de Custo unitário do relatório é populada da seguinte maneira:\n- Pega o valor do custo unitário do lançamento que é possível ver nos lançamentos de estoque, pelo ESTO7.\n- Caso este campo não possúa valor para o lançamento, o mesmo busca o valor da coluna CM_CONTABIL_UNI da\ntabela LCTO_GTB_ATM, que é populada utilizando o valor da coluna no regis"], "210-3": ["Registro Produtos (ESTO40) — vista de novo, gerar o estabelecimento, partir disso passou", "Registro Produtos em Fabricação – ESTO40.pdf", "questão de gerar o Estabelecimento nulo/em branco no ESTO40...situação vista de novo na Implantação VPS em 200524...\n\n...informei aqui o Estabelecimento, no Calendário de Recursos...\n\n...e a partir disso passou a gerar OK o registro, com o Estabelecimento aqui no ESTO40:  "], "210-4": ["Registro Produtos (ESTO40) — ESTO40 - Registros de Produtos em Fabricação não estão gravando a Conta Contábil Rotina", "Registro Produtos em Fabricação – ESTO40.pdf", "Pedido Serviço: 69230 Cliente: Pegada Solicitação:\nESTO40 - Registros de Produtos em Fabricação não estão gravando a Conta Contábil Rotina:\n\nSuprimentos Estoque Lançamentos Registro Produtos Prontos Alteração:\n1 - Ao gerar os Produtos em Fabricação, quando informamos uma regra de contabilização vinculada a uma\nconta contábil cadastrada no produto, essa conta não está sendo considerada nem gravada no programa\nESTO40 para aquele produto.\n2 - Atualizar no cliente.\n\nDocumentação:\n\nSuprimentos Estoque Lançamentos Registro Produtos Prontos Detalhamento:\nOs registros de produtos em fabricação não estão trazendo a conta contábil, pois, no programa ESTO77, a definição\nda conta contábil é feita de dua"], "211-31": ["Gera Nota Fiscal Abastecimento Materiais - Remessa Industrialização (ESTO71) — CRIAR PARAMETROS DE INICIALIZAÇÃO DE ESTABELECIMENTO E SERIE", "Rotina de Faturamento_Notas Fiscais Saída, situações.pdf", "Pedido Serviço: 12875 Solicitação:\nCRIAR PARAMETROS DE INICIALIZAÇÃO DE ESTABELECIMENTO E SERIE\nCriar os seguintes parametros de inicialização nos programas abaixo:\nFATU3 - Notas Fiscais de Entrada -ESTAB_PADRAO\n\nFATU6 - Devoluções de Venda - ESTAB_PADRAO\n\nRECE7 - Retorno Remessas - ESTAB_PADRAO\n\nMIND16 - Gera NF Ordem Transferência - ESTAB_PADRAO\n\nESTO71 - Gera Nota Fiscal Abastecimento Materiais - ESTAB_PADRAO\n\nPEDI44 - Liberação Pedidos Faturamento - ESTAB_PADRAO\n\nTERC10 - Gera Notas Fiscais Remessa Industrialização - ESTAB_PADRAO\n\nFATU9 - Gera Nota de Devoluções de Empréstimo / Gera Nota de Devoluções de Compra - ESTAB_PADRAO\n\nA ideia é ter configurado um FATU3, FATU6, RECE7 (os geradore"], "211-32": ["Faturamento de Exportação (CEXT85) — PARAMETRO DE INICIALIZAÇÃO NOVO NOS PROGRAMAS QUE MONTAM NF (SAIDA ENTRADA)", "Rotina de Faturamento_Notas Fiscais Saída, situações.pdf", "Pedido Serviço: 12953 Solicitação:\nPARAMETRO DE INICIALIZAÇÃO NOVO NOS PROGRAMAS QUE MONTAM NF (SAIDA ENTRADA)\nCriar um parametro de inicialização nos programas que geram/montam as NF de entrada e Saida\n(lançamento/emisão) para que chame determinado programa de Notas Fiscais.\nPorque: podem haver varios programas de NF (FATU2 e FATU3) cadastrados no Menu (um para cada\nestabelecimento), e dessa forma será fixado qual FATU2/3 o gerador da NF deverá chamar.\n\nAbaixo segue a relação dos programas que deverão ser alterados:\n- FATU6 - RECE7 - MIND16 - ESTO71 - ESTO25 - PEDI4 - PEDI44 - TERC10 - FATU9\nCaso seja mapeado mais algum programa fazer a alterção também, ou então comunicar a consultoria qual"], "211-40": ["Pessoas Físicas/Jurídicas (ADMI34) — Na BD Desenvolvimento, nos testes na Kunden, para cancelar uma NF de saída fiz", "Rotina de Faturamento_Notas Fiscais Saída, situações.pdf", "Na BD Desenvolvimento, nos testes na Kunden, para cancelar uma NF de saída fiz:\n\nSQL> [Código: NFS_ATM]\n1 row updated.\n\nSQL> COMMIT;  Commit complete.\n\nSQL> [Código: NFS_ATM]\n1 row updated.\n\n(isso qdo parâmetro 89 de NF Eletronica estando S) Zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz\n\nNova situação, visto em 241018...auxilio de Deisy...(foi em NF de Entrada...mas serve para NF Saida...só trocar abaixo as tabelas.\n\nNF que estava Emitida: controle 24200 [Código: NFE_ATM]\n\nParametro 89 NF_ELETRONICA, coloquei N\n\nCom isso a NF habilitou o botão de Cancelar...cancelamos e resolveu!\n\nVoltar Parametro 89 NF_ELETRONICA, coloquei S\n\nDetalhe visto num teste meu, em 090523: No"], "211-49": ["Notas Fiscais de Saída (FATU2) — Vendas e Distribuição Faturamento Notas Fiscais", "Rotina de Faturamento_Notas Fiscais Saída, situações.pdf", " Pedido Serviço: 22202 Solicitação:\nVendas e Distribuição Faturamento Notas Fiscais\nNota Fiscal de Saída ALTERAÇÃO:\n-Cliente tem a necessidade que seja gerado o e-mail do destinatário nas observações da nota fiscais de saída.\nSugestão: Criar a opção no programa Configurações de notas. (FATU4) Documentação:\nVendas e Distribuição Faturamento Notas Fiscais\nNota Fiscal de Saída\nFoi criada uma nova opção \"E-mail Destinatário\" na Configuração de Notas Fiscais, na lista de valores do campo\nDados Adicionais dentro da aba Dados Complementares.\nQuando esta opção for utilizada na configuração irá concatenar o e-mail do destinatário na tag <infCpl>."], "211-52": ["Pessoas Físicas/Jurídicas (ADMI34) — Vendas e Distribuição Faturamento Notas fiscais", "Rotina de Faturamento_Notas Fiscais Saída, situações.pdf", "Pedido Serviço: 22254 Solicitação:\nVendas e Distribuição Faturamento Notas fiscais\nNotas fiscais de saída.\nALTERAÇÃO:\nCriar opção para que o seja possível fazer um de-para de Código produto Kunden x Cód produto cliente.\nEssa opção deve ser a nível de cliente, pois o mesmo produto é vendido p/vários os clientes, porém para um\ndeterminado grupo de clientes é necessário que na DANFE\ngere a informação do CÓDIGO DO PRODUTO DELE\n\nObs: (Essa parte será utilizado o programa EPRO32)\nEssa informação deve ser impressa na DANFE.\n***Prevêr essa informação em todas as notas de emissão- Entrada e Saida.\nDetalhamento em anexo Documentação:\nPrograma Pessoas Físicas/Jurídicas(ADMI34):\n> Aba \"Nota Fsical\"\n> Cr"], "211-72": ["Clientes (ADMI35) — tava, issqn, mensagem knd", "Rotina de Faturamento_Notas Fiscais Saída, situações.pdf", "Mensagem KND-000358: Para esta mensagem em 220119, a solução foi informar o ISSQN na Cidade, tela 3. Tava nulo.  "], "211-76": ["Lançamentos (CREC4) — favor pesquisa sobre a rotina de Estornos de NF, e como isso se comporta no Ctas a…", "Rotina de Faturamento_Notas Fiscais Saída, situações.pdf", "E-mail — Assunto: favor pesquisa sobre a rotina de Estornos de NF, e como isso se comporta no Ctas a Receber Oi Cesar,\n\nO que temos pendente de esclarecer o fluxo de como funciona, é quando tem estorno de NF de Saida (e aí o sistema\ngerar uma emissão de NF de Entrada), como fica a parte financeira disso...\n\nPorque o Ademir está me questionando e colocando como uma pendencia...ele está nos questionando:\n“Sistema não esta baixando o Financeiro, continua com o Doc pendentes no Contas a Receber”\n\nEntão, teríamos que posicionar ao pessoal da Frigolaste e ao Ademir como isso realmente funciona...\n\nAbaixo eu fiz uns testes...\nO Micail não soube me confirmar como de fato funciona...ví que o estorno "], "211-81": ["Clientes (ADMI35) — Teste efetuado nesta tarde sobre o cliente ser inativado e bloqueado durante o pedido", "Rotina de Faturamento_Notas Fiscais Saída, situações.pdf", "E-mail — Assunto: Teste efetuado nesta tarde sobre o cliente ser inativado e bloqueado durante o pedido\nTestamos aqui interno o que ocorre quando o cliente está INATIVO e BLOQUEADO:\nAo tentar emitir a NF de saída, sistema da a seguinte mensagem abaixo “ORA-20000: ORA01403: no data found”\n(não chega a trancar...se der OK permite fechar o programa, excluir a NFS...) \nQue achas...precisariamos tratar isso na rotina?\nPorque veja que em tela ele gerou um nro (depois de excluído esta NFS, no controle de Numeração voltou o numero\noriginal...mas vai que por algum motivo esta NF fica “presa”, sem ser excluída no momento) Cliente está assim:  "], "211-84": ["Configuração de Serviços de Documentos Fiscais Eletrônicos (DF-e) (FATU146) — quantidade de horas, ultrapassou a determinada, respeitadas as configurações", "Rotina de Faturamento_Notas Fiscais Saída, situações.pdf", "Pedido Serviço: 28005 Solicitação:\n\nROTINA:\n\nVendas e Distribuição Faturamento Notas Fiscais\nNota Fiscal de Saída\nMesmo configurando horas para cancelamento no FATU4, ao tentar realizar o cancelamento de uma nota fiscal\nocorre o aviso de que já ultrapassou a determinada quantidade de horas (mesmo que estas não tenham passado).\n\nALTERAÇÃO:\n-Verificar a quantidade de horas que está no FATU4 e fazer o disparo da mensagem APENAS quando essa quantidade for ultrapassada.\n*Sugestão se for viável: verificar no programa FATU146 a quantidade de horas de cancelamento, ao invés do FATU4\n(para clientes que utilizem o Kunden Monitor).\n\nDocumentação:\nVendas e Distribuição Faturamento Notas Fiscais\nNota Fis"], "211-85": ["Transferência Externa (MIND15) — centro de trabalho, vir devidamente preenchidos, transferência da manutenção", "Rotina de Faturamento_Notas Fiscais Saída, situações.pdf", "Pedido Serviço: 21771 Solicitação:\n\nROTINA:\n\nVendas e Distribuição Faturamento Notas Fiscais\nNota Fiscal de Saída ALTERAÇÃO:\n\n- Aba Manutenção Industrial deverá ser um campo obrigatório (emissão e lançamento) quando esta aba estiver\nsendo exibida, tanto quando a NF for manual, quanto quando for gerada pelos programas de transferência. Deverá\nser exibido o centro de trabalho 'ORIGEM' (de onde está saindo) e o 'DESTINO' (para onde vai). Ambos os campos\ndeverão vir devidamente preenchidos quando a NF for gerada pelos programas de transferência da Manutenção\nIndustrial (MIND15 - gerador da transferência / MIND16 - gerador da NF).\n\nDocumentação:\nVendas e Distribuição Faturamento Notas Fiscais\nNot"], "211-92": ["Unidade Federativa (ADMI11) — voltar a qtde, fiscais para gerar, configuração de notas", "Rotina de Faturamento_Notas Fiscais Saída, situações.pdf", " \nQuando precisar alterar a configuração de Notas Fiscais, para gerar “Estorno” ao invés de “Cancelamento”:\n\nExemplo na GS em 051020, se já tem CTE na NF, aí não pode cancelar a NFS...neste caso no FATU146, mudar horas\nCancelamento para zero, para permitir Estornar a NF, e depois voltar a qtde de horas para o original."], "211-97": ["Notas Fiscais de Saída (FATU2) — ocorrência das notas, saída consta, venda tenha sido", "Rotina de Faturamento_Notas Fiscais Saída, situações.pdf", "\nPara identificar que determinado Pedido de Venda tenha sido Faturado (efetuado a respectiva NF de Saída) mas que\ntenha ocorrido Cancelamento, Estorno, ou Devolução de Venda desta NF, o que de uma certa maneira “anularia” o\n“Faturamento” deste Pedido de Venda. Identificado nos seguintes campos abaixo:\n\nNo Pedido de Venda:\nNas Ocorrências vai constar:\n\n-Ocorrência das Notas Fiscais Canceladas:\n\n-Ocorrência das Notas Fiscais Devolução:  \n-Ocorrência das Notas Fiscais Estorno:\n\nNas NF Saída vai constar:\n\n-Informação do Cancelamento:  \n-Informação da Devolução: aqui a NF de Devolução (neste não consta o Pedido, apenas o Vinculo da NF de Saida)...\n\n...mas na NF de Saída consta que houve a Devoluç"], "211-103": ["Parâmetros (ADMI8) — homologação do sefaz, gerar a danfe, desenv enviando", "Rotina de Faturamento_Notas Fiscais Saída, situações.pdf", "Visto em 160321...para fazer testes na BD Desenv, enviando para o ambiente Homologação do Sefaz e com isso\ngerar a Danfe e XML, utilizar:\nEmpresa 1\nUnidade de Negocio 1 Estabelecimento 31\n\nMarcio 180326: abaixo exemplo na BD Desenv, de Guilherme:\n“Exemplo autorizado na base desenv” Empresa 210 Estabelecimento 115  Marcio 200326:\nEu mesmo montei um teste para anexo do Pedido Serviço 70547...gerei esta NFS com XML e Danfe (anexados no\nPedido Serviço 70547), com NF gerada a partir do PEDI4...utilizei:\nEmpresa: 210 Unidade Negócio: 1 Estabelecimento: 115 "], "211-104": ["Retorno de Industrialização Depósito Disponível (FATU110) — controle de sku, skus disponíveis, urgência ou algo", "Rotina de Faturamento_Notas Fiscais Saída, situações.pdf", "Visto na Implantação da Smart em 090421, rotina de Faturamento/NF Saída/FATU2 de Produtos Acabados que tem\nconfiguração de controle de SKU (e tendo controle de Estoque para este movimento*):\n\n-Só funciona para tais produtos*, efetuando o faturamento gerando a NFS pelo PEDI4, ou seja, e com isso tendo a\nnecessidade de ter um Pedido de Venda.\n-Não funciona fazer uma NF Saída manualmente tentando informar os SKUs...gera mensagem cfe tela abaixo e não\npermite incluir dados de SKUs e qtdes .\n(esta condição visto em testes, e cfe posicionamento de Deisy/Suporte).\n******************ATENÇÃO: ESTA POSIÇÃO ACIMA DE NÃO PERMITIR INCLUIR SKU MANUALMENTE NUMA\nNFS, POSTERIORMENTE EM MAIS TESTES FUNCIONOU!"], "211-109": ["Retorno de Industrialização Depósito Disponível (FATU110) — gerei a nfs, venda vai gerar, impresso no relatório", "Rotina de Faturamento_Notas Fiscais Saída, situações.pdf", "Testes feitos em 300921, para ver se, informando o campo Complemento no Pedido de Venda, vai gerar na NFS (na\nminha necessidade, não precisaria gerar na NF...preciso deste campo Complemento, para ser impresso no relatório VEND78...\n\n...informei no Pedido de Venda, campo Complemento... \n...gerei a NFS pelo FATU110...e veja que não trouxe o campo Complemento para a NFS:  \n...agora gerei a NFS pelo PEDI4...e veja que por este programa sim trouxe o campo Complemento para a NFS:\nIsso, para o meu caso que queria ver só no Relatório VEND78, é problema...porque vai afetar o faturamento...\nEm todos os casos, funciona para quem usar o PEDI4 com esta funcionalidade:\n\nNo relatório VEND78 geraria assim o"], "211-110": ["Retorno de Industrialização Depósito Disponível (FATU110) — veio deste parâmetro, junto na danfe, excluir o atributo", "Rotina de Faturamento_Notas Fiscais Saída, situações.pdf", "Situação vista em 010621, na implantação da Smart...\n\nNF emitida pelo Kunden, mostrando assim no FATU2 (ver 3º item, que é item de Venda, com Vinculo com Pedido de\nVenda, NF gerada pelo FATU110)...  \n...veja como gerou na Danfe o 3º item...veja o descritivo “cProdCliente: “56427””...que não está diretamente em\nnenhum campo do FATU2...(e não se queria que isso fosse mostrar junto na Danfe)...\n\nMotivo:\n\nVeio deste Parâmetro geral 50085 com este atributo...(foi por engano...) \n\n...e aí como estava informado no Pedido de venda no campo FLEXFIELD1 (das Inf. Complementares), trouxe para a Danfe acima.\nSolução (para não aparecer mais): excluir o atributo do parâmetro acima."], "211-116": ["Processo Exportação (CEXT84) — FATU2 - CRIAÇÃO DE CAMPO LOCAL EMBARQUE NO FATU2 CONFORME ESTA NO CEXT84 PARA GERAR A TAG", "Rotina de Faturamento_Notas Fiscais Saída, situações.pdf", "Pedido Serviço: 46216 Cliente: Pegada Solicitação:\nFATU2 - CRIAÇÃO DE CAMPO LOCAL EMBARQUE NO FATU2 CONFORME ESTA NO CEXT84 PARA GERAR A TAG\n<UFSAIDAPAIS><\/UFSAIDAPAIS> CORRETAMENTE NO XML.\n\nRotina:\n\nVendas e Distribuição Faturamento Notas Fiscais\nNota Fiscal de Saída Alteração:\n\nCriação de campo Local Embarque no FATU2 conforme esta no CEXT84 para gerar a tag\n<UFSaidaPais><\/UFSaidaPais> corretamente no XML.\n\nDocumentação:\nVendas e Distribuição Faturamento Notas Fiscais\nNota Fiscal de Saída Detalhamento:\nNa aba Dados Gerais foi criado o campo \"UF Local Embarque\" que fica ao lado do campo \"Local Embarque\". Esse\ncampo fará com que a tag \"<UFSaidaPais>\" seja gerada com a UF correta."], "211-123": ["Usuários (ADMI1) — vezes o usuario, tinha feito nada, sequencia quis excluir", "Rotina de Faturamento_Notas Fiscais Saída, situações.pdf", "Visto em 240522, na AB, que as vezes o usuario do sistema “simples mortal” / “Não Administrador”, não consegue\nexcluir uma NF que ele gerou anteriormente...\n\nExemplo:\n-usuario gerou a NF pelo programa PEDI4, e na sequencia quis excluir a mesma (cfe informou, não tinha feito nada\nnesta NF, não tentou emitir, não editou, mas, não se tem certeza que talvez tenha feito uma manutenção nela)...\n\nO fato é que na tentativa deste usuario excluir a NF, dava mensagem de “Exclusão de registro não autorizada.”, cfe tela abaixo...\n\nSolução: excluir com o usuário Administrador “Kunden” (aí não deu nenhuma mensagem, sem problemas).\nAline confirmou que as vezes passou pela mesma situação (porém não tem nada "], "211-125": ["Notas Fiscais de Saída (FATU2) — FATU2 - DESCONTO ESTA SENDO APRESENTANDO INDEVIDAMENTE NO PROGRAMA FATU2", "Rotina de Faturamento_Notas Fiscais Saída, situações.pdf", "Pedido Serviço: 59260 Cliente: Pegada Solicitação:\nFATU2 - DESCONTO ESTA SENDO APRESENTANDO INDEVIDAMENTE NO PROGRAMA FATU2.\nGeração de desconto negativo na coluna “Desc.” e no campo “Vlr. Desconto” em Totais.\n\nRotina:\n\nVendas e Distribuição Faturamento Notas Fiscais\nNota Fiscal de Saída Alteração: \nVerificar erro ao gerar controle esta levando desconto erroneamente para o mesmo.   Documentação:\nVendas e Distribuição Faturamento Notas Fiscais\nNota Fiscal de Saída  Detalhamento:\nNada foi feito.\n\nObservação:\nO problema é que o item ter o seu valor unitário com 4 casas decimais não estando arredondando, e o valor unitário\nlíquido, já arredondado com duas casas. Sabendo disso, quando ocorre a qu"], "211-128": ["Parâmetros de Inicialização (ADMI125) — Arquivar esta situação", "Rotina de Faturamento_Notas Fiscais Saída, situações.pdf", "E-mail — Assunto: Arquivar esta situação...\n\nArquivar esta situação...\n\nNF de Saida ficou “travada” sem abrir o monitor (situação ocorrido para Ismael na Season , em 161123)...detalhe:\nera o registro abaixo, mas não tinha nro de NF ainda...  \n...olhando aqui, estava “processando” = sim, e depois de derrubar a sessão aberta que estava “travada” e na\nsequência alterar de “Processando” de SIM para NÃO...\nDetalhe: a 1ª vez olhando aqui, estava mostrando Nro NF = 53, sendo que já existia a NF 54 emitida e autorizada, ou\nseja, ao que parece a rotina não tinha atualizado OK o nro da NF...aí foi alterado manualmente de 53 para 54, mas\nde igual maneira estava travando...foi neste momento que foi alte"], "211-133": ["Lançamentos - Devolução (CPRO29) — NOTA FISCAL DE SAÍDA - CRIAR UMA TRAVA DE CANCELAMENTO E ESTORNO DE NF QUE EXIJA UMA…", "Rotina de Faturamento_Notas Fiscais Saída, situações.pdf", "Pedido Serviço: 60110 Cliente: Frigolaste Solicitação:\nNOTA FISCAL DE SAÍDA - CRIAR UMA TRAVA DE CANCELAMENTO E ESTORNO DE NF QUE EXIJA UMA AUTORIZAÇÃO Rotina:\n\nVendas e Distribuição Faturamento Notas Fiscais\nNota Fiscal de Saída Alteração:\n\nCriar uma trava de cancelamento e estorno de NF que exija uma autorização.\n\nDocumentação:\n\n4503 | Cancelamento necessita de autorização.\n4504 | Estorno necessita de autorização.\n\nVendas e Distribuição Faturamento Notas Fiscais Notas\nNotas Fiscais de Saída Parâmetro Inicialização:\nAUTORIZADO_CANCELAR_ESTORNAR | DEFINE SE É PERMITIDO CANCELAR/ESTORNAR NOTA FISCAL DE SAÍDA.\nEXIGE_EVENTO_CANCELAMENTO_ESTORNO | DEFINE SE EXIGE A INFORMAÇÃO DE EVENTO PARA\nCANC"], "211-147": ["Registro Controle Produção e Estoque (ESTO19) — Revisar o cálculo do custo médio, e custo de entrada de estoque, do Produto 1041196", "Rotina de Faturamento_Notas Fiscais Saída, situações.pdf", "Pedido Serviço: 66983 Cliente: Henrich Solicitação:\nRevisar o cálculo do custo médio, e custo de entrada de estoque, do Produto 1041196.\n(envolvendo movimento de Transferência entre Estabelecimento, sendo que é Estabelecimento em outro Estado, na\nqual há incidência de DIFAL (ICMS Diferencial Alíquota) e na qual é agregado/juntado/aumentado o valor de ICMS ao\ncusto de Estoque com este movimento de Transferência entre Estabelecimento.\n\nRotina:\n\nSuprimentos Estoque Relatórios\nRegistro Controle Produção e Estoque Alteração:\n¿ Revisar o cálculo do custo médio, e custo de entrada de estoque, do Produto 1041196;\n1.1. Revisar:\nPartindo dos movimentos deste produto 1041196, a partir de novembro/24 (a"], "211-162": ["Regras Tributação Especial (ADMI66) — regra de tributação, nota para melhorar, coluna ao item", "Rotina de Faturamento_Notas Fiscais Saída, situações.pdf", "Pedido Serviço: 64431   Cliente: Kunden Solicitação:\n\nRotina:\n\nVendas e Distribuição Faturamento Notas Fiscais\nNota Fiscal de Saída Alteração:\nGravar ID da Regra de Tributação Especial no Item da NFE e NFS.\n\nDocumentação:\n\nVendas e Distribuição Faturamento Notas Fiscais\nNota Fiscal de Saída Detalhamento:\nAdicionada nova coluna ao item da nota para melhorar a rastreabilidade da regra de tributação especial.\n\nSuprimentos Recebimentos Notas Fiscais\nNotas Fiscais de Entrada Detalhamento:\nAdicionada nova coluna ao item da nota para melhorar a rastreabilidade da regra de tributação especial. \nUtilizando o seguinte Select, é visto que o ID da regra de tributação foi gravado na tabela NF S_ITEM: "], "211-164": ["Notas Fiscais de Saída (FATU2) — LIBERAÇÃO PEDIDOS VENDA FATURAMENTO - IDENTIFICAR MOTIVO DE ESTAR SENDO LEVADO DESCONTO", "Rotina de Faturamento_Notas Fiscais Saída, situações.pdf", "Pedido Serviço: 69283 Cliente: Atta Solicitação:\nLIBERAÇÃO PEDIDOS VENDA FATURAMENTO - IDENTIFICAR MOTIVO DE ESTAR SENDO LEVADO DESCONTO\nNEGATIVO PARA A NF Rotina:\n\nVendas e Distribuição Faturamento Notas Fiscais\nLiberação Pedidos Venda Faturamento Alteração:\n\n- Identificar motivo/configuração de estar levando desconto negativo para a NF.\n\n1=Pedido de venda vem do B2B e possui ajuste de preço:  \n2.1. Gerada a NF está levando o valor unitário de 39,1116, quando o correto seria 40,10. E também leva o desconto\nnegativo, quando não deve haver desconto nos itens:\n\nConfigurações que foram revisadas:\n3.1. Parâmetro geral 269 (DESCONTO UTILIZADO - DEFINE O TIPO DE DESCONTO UTILIZADO PELO CLIENTE:\nG="], "211-166": ["Clientes (ADMI35) — horas cancelamento, viram que estava, via monitor retornou", "Rotina de Faturamento_Notas Fiscais Saída, situações.pdf", "Situação em 110326, RA 260311042 da Cristófoli...\nhttps://kundencloud.com.br:3825/atendimento?id=260311042&callType=customer\n\nNa tentativa da Cristófoli em Cancelar uma NFS, que haviam gerado e emitido, e viram que estava errado a Operação\nutilizada nos itens, desta maneira a necessidade de cancelar esta NFS para poder gerar nova NF com a Operação\ncrreta...ao tentar “Cancelar”, o retorno ocorrido a partir do procedimento para cancelar via monitor retornou isso:\n“Rejeicao: Pedido de Cancelamento para NF-e com CT-e ou MDF-e”  \nO cliente então tentou Estornar, porém não possibilitou, porque o Estorno verifica este campo “Horas Cancelamento”\nno FATU146...e não permite estornar quando a qtde de h"], "211-169": ["Consulta Estoque Produto (ESTO7) — knd quantidade insuficiente, mesma entrega, colegas do administrativo", "Rotina de Faturamento_Notas Fiscais Saída, situações.pdf", "Situação ocorrida em 200526, na Cristófoli...\nhttps://kundencloud.com.br:3825/atendimento?id=260520027&callType=customer\n\nNa NF Saída de Faturamento, gerou a mensagem abaixo:\nKND-004786 - Quantidade insuficiente no estoque. Identificação (:A). Qtd. Consumir: (:B), Qtd. Estoque: (:C).\nLocalização (:D), Produto (:E).\n\nAqui os Itens da NFS, do produto informado acima... \nO estoque estava correto:\n\nNeste caso, o que aconteceu foi o seguinte:\nMarcio.Cons 21/05/2026 - 15:01:49 oi,\nconseguiria colocar numa \"fila\" para olhar proxima semana, quando der um tempinho?\n\nO motivo pelo ocorrido é porque tinha 1 dos campos abaixo em destaque como null...foi colocado manualmente como N...\nA pergunta é:\n\n-O q"], "212-9": ["Registro Controle Produção e Estoque (ESTO20) — Situação que ocorria no Henrich, em 08/2011, após migração para a K11", "Rotina de Recebimentos, situações.pdf", "\nSituação que ocorria no Henrich, em 08/2011, após migração para a K11:\n\nEm partes dos lançamentos de NFE, após a a NFE estar confirmada, os usuários acessavam a NFE Confirmada,\nclicavam em “Alterar”, faziam a alteração pretendida, e após tentar novamente confirmar, aparecia a mensagem\nKND-000226 de que não existia saldo Disponível...inclusive pela mensagem KND-000226 e pelas qtdes apresentadas\nnesta mensagem, as qtdes não estavam de acordo com as qtdes registradas no estoque.\nEsta situação foi replicada na BD Suporte.\nA mensagem era a seguinte KND-000226:\n\nVerificando pelos relatórios e consulta do Estoque, não haveria motivo pela mensagem KND-000226...pois havia o saldo:  \nApós vários test"], "212-18": ["ocorrido na adoc, violated child record, int", "Rotina de Recebimentos, situações.pdf", "Erro “ORA-20000: Erro GERA_ATO_CONCESSORIO_INT_P: ORA-02292: integrity constraint\n(KUNDEN.ATO_CONCESSORIO_INT_COMP_FK1) violated - child record found” ocorrido na Adoc, ao tentar excluir um\nlançamento de NF de Entrada:\n\nMotivo:"], "212-20": ["cesar wagner, situação na adoc, pois a condição", "Rotina de Recebimentos, situações.pdf", "x\n\nSituação na Adoc em 19/07/2013:\n\nEstão com uma NFE, que mudaram uma qtde. Diz que digitaram mal.\nSegundo informaram a qtde não estava correta.\n\nAí desconfirmaram a NFE, alteraram e aí agora ao tentar confirmar gera a mensagem “ORA-20000: Erro\nATUALIZA_CONTAS_PAGAR_P(INSERE_DOCUMENTO): ORA-00001: unique constraint (KUNDEN.DOCUMENTO_CP_UK0) violated” abaixo.\n\nNo contas a pagar, a tela é conforme abaixo...não sei se há um pagamento para isso que está bloqueando a nova\nconfirmação (pelo condição de pagamento parece que sim deve ter um pagamento, pois a condição é antecipo).\n\nO sistema permitiu desconfirmar e alterar a NF...se não pudessem ter feito isso, nem deveria de permitir desconfirmar.."], "212-29": ["Gera Nota Fiscal Abastecimento Materiais - Remessa Industrialização (ESTO71) — CRIAR PARAMETROS DE INICIALIZAÇÃO DE ESTABELECIMENTO E SERIE", "Rotina de Recebimentos, situações.pdf", "Pedido Serviço: 12875 Solicitação:\nCRIAR PARAMETROS DE INICIALIZAÇÃO DE ESTABELECIMENTO E SERIE\nCriar os seguintes parametros de inicialização nos programas abaixo:\nFATU3 - Notas Fiscais de Entrada -ESTAB_PADRAO\n\nFATU6 - Devoluções de Venda - ESTAB_PADRAO\n\nRECE7 - Retorno Remessas - ESTAB_PADRAO\n\nMIND16 - Gera NF Ordem Transferência - ESTAB_PADRAO\n\nESTO71 - Gera Nota Fiscal Abastecimento Materiais - ESTAB_PADRAO\n\nPEDI44 - Liberação Pedidos Faturamento - ESTAB_PADRAO\n\nTERC10 - Gera Notas Fiscais Remessa Industrialização - ESTAB_PADRAO\n\nFATU9 - Gera Nota de Devoluções de Empréstimo / Gera Nota de Devoluções de Compra - ESTAB_PADRAO \nA ideia é ter configurado um FATU3, FATU6, RECE7 (os geradore"], "212-36": ["Livro Inventário (ESTO16) — manualmente a data, ficou assim depois, lcto estoque seq", "Rotina de Recebimentos, situações.pdf", "Detalhe: em Livros consegui alterar manualmente a data: ficaram assim Livros e Ctas a Pagar:\nFicou assim depois os estoques: OK \n\nAqui, visto posteriormente em outro ajuste que é necessário também atualizar:\nSQL> [Código: PEDIDO_COMPRA_RECEB_ATM] \n\nEle vai mostrar quais as seq utilizadas...as que não retornar é porque não estão utilizadas.\nAlterar no BETWEEN, porque terá que se ter a ideia de qual intervalo poderá ser utilizado.\nEste script vai olhar nas 3 tabelas que podem estar sendo utilizado a LCTO_ESTOQUE_SEQ. [Código: LCTO_ESTOQUE_ATM NFE_ITEM_ATM NFS_ITEM_ATM]"], "212-66": ["Transferência Externa (MIND15) — centro de trabalho, vir devidamente preenchidos, transferência da manutenção", "Rotina de Recebimentos, situações.pdf", "Pedido Serviço: 21770 Solicitação:\n\nROTINA:\n\nSuprimentos Recebimento Notas Fiscais\nNota Fiscal de Entrada ALTERAÇÃO:\n\n- Aba Manutenção Industrial deverá ser um campo obrigatório (emissão e lançamento) quando esta aba estiver\nsendo exibida, tanto quando a NF for manual, quanto quando for gerada pelos programas de transferência. Deverá\nser exibido o centro de trabalho 'ORIGEM' (de onde está vindo) e o 'DESTINO' (para onde vai). Ambos os campos\ndeverão vir devidamente preenchidos quando a NF for gerada pelos programas de transferência da Manutenção\nIndustrial (MIND15 - gerador da transferência / MIND16 - gerador da NF).\n\nDocumentação:\nSuprimentos Recebimento Notas Fiscais\nNota Fiscal de Entrada"], "212-68": ["Recebimento de Pedidos de Compra (COMP5) — cadastro configuração especial, visto com cesar, sugeridas", "Rotina de Recebimentos, situações.pdf", "Sobre as Operações, que podem ser sugeridas no COMP5 para gerar a NF de Entrada: usar o programa RECE32 -\nCadastro Configuração Especial (Operação):\n\nVisto com Cesar em 092020, para Baenamora:"], "212-78": ["Parâmetros (ADMI8) — PARÂMETROS - ADMI8 - CRIAR PARÂMETRO GERAL VALIDA_LOTE_FAT_REC Rotina", "Rotina de Recebimentos, situações.pdf", "Pedido Serviço: 52559\nCliente: Frigolaste / Duramas / Kunden Solicitação:\nPARÂMETROS - ADMI8 - CRIAR PARÂMETRO GERAL VALIDA_LOTE_FAT_REC Rotina:\n\nAdministração Cadastros Parâmetros - ADMI8 Alteração:\n\nCriar parâmetro geral VALIDA_LOTE_FAT_REC = S/N\nS = Não vai deixar emitir/receber (FATU2/FATU3) o produto sem que seja informado o lote, quando esse produto\npossuir o controle de lote (PADRÃO);\nN = Irá deixar emitir/receber (FATU2/FATU3) o produto sem que seja informado o lote, quando esse produto possuir\no controle de lote.\nA validação deve ser realizada no momento da emitir/confirmar a NF para operações que não controlam estoque.\n\nDocumentação:\nParâmetro Geral:\n50232 | VALIDAR LOTES NO FATURA"], "212-83": ["Pessoas Físicas/Jurídicas (ADMI34) — vista em visita, ismael para identificar, importação de material", "Rotina de Recebimentos, situações.pdf", "Ocorrido em 190523 numa situação na Smart...Situação vista em visita na Smart, e com apoio de Ismael para identificar a situação:\nNuma “Emissão” de NF de Entrada, para gerar a NF de Importação de Material (na qual é necessário a empresa emitir\numa NF de Entrada para buscara mercadoria que foi importada, aguardando a sua retirada/busca)\n\nMensagem de “KND-004040: NF possui vencimentos com modalidade não informada” ao tentar Emitir tal NF de Entrada...  \n...motivo: veja que aqui abaixo não carregou a Modalidade...\n\n...motivo que não tinha a informação abaixo no campo Modalidade (informado posterior)...\n\nNa NF teve que ser informado via update na tabela, para não precisar excluir a NF."], "212-86": ["Configuração Custeio (CUST2) — validação do custeio, retorno de terceiros, ofs já produzidas", "Rotina de Recebimentos, situações.pdf", "Pedido Serviço: 59085 Cliente: HK Solicitação:\n\nROTINA:\n\nSuprimentos Recebimento Notas Fiscais\nNota Fiscal de Entrada ALTERAÇÃO:\n\nAnalisar validação do custeio referente a retorno de terceiros de OFs já produzidas em meses anteriores ao mês de retorno.\n\nAnalisar validação do custeio referente a retorno de terceiros de OFs já produzidas em meses anteriores ao mês de\nretorno. Validação da rotina criada no Pedido 52764.\nOF produzida no mês 05... \nRealizando o retorno agora no mês 06...\n\nMensagem “KND-004363”:   Documentação:\n\nDetalhamento:\nPedido validado sob orientação do Wagner M.\n\nUm novo pedido foi solicitado ao consultor, para entrega em abril e com novo exemplo. Este deve ser mencionado\nn"], "212-93": ["Regras Tributação Especial (ADMI66) — CRIAR UM PARÂMETRO GERAL AONDE TODAS AS NOTAS FISCAIS DE ENTRADA COM PIS/COFINS ENTRARÃO…", "Rotina de Recebimentos, situações.pdf", "Pedido Serviço: 61839 Cliente: Brisa Solicitação:\nCRIAR UM PARÂMETRO GERAL AONDE TODAS AS NOTAS FISCAIS DE ENTRADA COM PIS/COFINS ENTRARÃO COM\nREDUÇÃO NA BASE DE CÁLCULO, AONDE SERÁ DEDUZIDO O VALOR DO ICMS NA BASE DE CALCULO DO PIS/COFINS.\n\nRotina:\n\nSuprimentos Recebimento Notas Fiscais\nNota Fiscal de Entrada Alteração:\n\n- Criar um parâmetro geral aonde todas as notas fiscais de entrada com PIS/COFINS entrarão com redução na base\nde cálculo, aonde será deduzido o valor do ICMS na base de calculo do PIS/COFINS.\n\nDocumentação:\n\nParâmetro Geral:\n50276 | DESCONTA ICMS DA BASE DE CÁLCULO DO PIS E COFINS NFE/COTAÇÃO/FPV | DESCONTA ICMS DA BASE\nDE CÁLCULO DO PIS E COFINS DAS NOTAS DE ENTRADA COM C"], "212-100": ["Registro Controle Produção e Estoque (ESTO19) — Revisar o cálculo do custo médio, e custo de entrada de estoque, do Produto 1041196", "Rotina de Recebimentos, situações.pdf", "Pedido Serviço: 66983 Cliente: Henrich Solicitação:\nRevisar o cálculo do custo médio, e custo de entrada de estoque, do Produto 1041196.\n(envolvendo movimento de Transferência entre Estabelecimento, sendo que é Estabelecimento em outro Estado, na\nqual há incidência de DIFAL (ICMS Diferencial Alíquota) e na qual é agregado/juntado/aumentado o valor de ICMS ao\ncusto de Estoque com este movimento de Transferência entre Estabelecimento.\n\nRotina:\n Suprimentos Estoque Relatórios\nRegistro Controle Produção e Estoque Alteração:\n¿ Revisar o cálculo do custo médio, e custo de entrada de estoque, do Produto 1041196;\n1.1. Revisar:\nPartindo dos movimentos deste produto 1041196, a partir de novembro/24 (a"], "212-110": ["Notas Fiscais de Entrada (FATU3) — Verificar e resolver a razão do erro KND-001039 ao tentar confirmar nota fiscal de…", "Rotina de Recebimentos, situações.pdf", "Pedido Serviço: 64326 Cliente: Planet Solicitação:\nVerificar e resolver a razão do erro KND-001039 ao tentar confirmar nota fiscal de entrada (FATU3), visto que ocorre\nerro de data retroativa, mesmo inserindo a data de hoje como data de entrada.\n\nRotina:\n\nSuprimentos  Recebimento Notas Fiscais\nNota Fiscal de Entrada\n\nAlteração: Verificar e resolver a razão do erro KND-001039 ao tentar confirmar nota fiscal de entrada (FATU3), visto\nque ocorre erro de data retroativa, mesmo inserindo a data de hoje como data de entrada.\n\nPrimeiramente, o cliente estava tentando confirmar a nota com a data 19/12/2023, onde apresentava o erro KND-001039 abaixo:\n\nFizemos alguns testes e verificamos que, mesmo in"], "212-113": ["Livro Inventário (ESTO16) — Verificar e ajustar diferenças entre estoque físico X inventário - EM TRÂNSITO", "Rotina de Recebimentos, situações.pdf", "Pedido Serviço: 70101 Cliente: Pegada Solicitação:\nVerificar e ajustar diferenças entre estoque físico X inventário - EM TRÂNSITO\n\nNota de saída de transferência 238795: Esta nota ela foi emitida dia 19/11/25   Documentação:\n\nSuprimentos Estoque Consultas Consulta Estoque Produto Detalhamento do desenvolvimento:\nNada foi feito.\n\nObservação:\nA operação 152.2 da nota de entrada não controla estoque, por isso não movimentou o estoque. "], "212-115": ["Nota Fiscal de Entrada (CEXC1024) — estoque os lotes, terceirização está ocorrendo, lançada sem vinculo", "Rotina de Recebimentos, situações.pdf", "Apoio no RA 260504014 https://kundencloud.com.br:3825/atendimento?id=260504014&callType=customer Elenir.Frigolaste 04/05/2026 - 09:07:08 Bom dia\n\nPor gentileza favor verificar.\n\nEssa nota de estorno ficou pendente e agora não permite emitir e nem fazer a inutilização Mensagem: “KND-003895” Detalhe:\n-Essa é uma Emissão de NF Entrada de Estorno, que não autorizou no Sefaz em 010426, e agora estão com problema\nem 040526, mais de 1 mês depois...\n-Não conseguem mais nem inutilizar a NF...  Motivo:\nRenan.Sup 04/05/2026 - 10:02:17\nNão é possível emitir a NF novamente pois ela foi emitida no dia 01/04/2026 e teve movimentações posteriores que\nse confirmar a NF novamente pode gerar inconsistências no"], "212-120": ["Implantação de Saldo (ESTO2) — Gabriela.Sup 18/06/2026 - 09:08:56 Bom dia, Flaviane!", "Rotina de Recebimentos, situações.pdf", "Gabriela.Sup 18/06/2026 - 09:08:56 Bom dia, Flaviane! \nPara fazerem isto da forma correta e não ter chance de problemas futuros,\n1- precisarão criar uma nova implantação com a data anterior à ORIGINAL da NF, e com a mesma quantidade que tem na nota.\n2- feito e confirmada a implantação, pode confirmar a nota com a data de 02/12/2025.\n3- após, deverão fazer uma requisição informada, com a data de 02/12/2025.\nSegue, abaixo, demonstrando como deverá ser feito.\nRealizamos no controle 6875 para verificarem, podes fazer com as demais.\n\nxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx  "], "213-10": ["Monitor Notas Fiscais Eletrônicas (FATU61) — Referente a questão de faturamento, envolvendo questões de impressão das Notas Fiscais", "Monitor Notas Fiscais Eletrônicas – FATU61.pdf", "E-mail — Assunto: Referente a questão de faturamento, envolvendo questões de impressão das Notas Fiscais:\nBoa tarde.\nCaso ocorra alguma falha de comunicação no momento do faturamento, deverá ser fechado o monitor e aberto\nnovamente... esse programa está instalado no servidor, e o usuário terá que ter acesso a essa conexão.\nAbaixo o programa aberto, caso falhe, feche e abra novamente no ícone selecionado abaixo... Após este\nprocedimento, poderá dar continuidade no faturamento. \n\nOBSERVAÇÃO: ESSA É A OPÇÃO “EXECUTAVEL” DO MONITOR. FRIGOLASTE É ÚNICA EMPRESA QUE USA ESTA OPÇÃO.\nDEMAIS EMPRESAS USAM OPÇÃO “SERVIÇO”.\nE AÍ ENXERGA-SE E ATIVA-SE A PARTIR DA OPÇÃO “SERVIÇOS” DA MAQUINA ONDE O MONITO"], "213-12": ["Monitor Notas Fiscais Eletrônicas (FATU61) — segurança onde deve-se, possibilitar o envio, host for gmail", "Monitor Notas Fiscais Eletrônicas – FATU61.pdf", "Pedido Serviço: 27463 Solicitação:\n\nROTINA:\n\nVendas e Distribuição Faturamento Notas Fiscais\nMonitor Notas Fiscais Eletrônica\n\nAo cadastrar e-mail no FATU146 com Host do Gmail, ocorre erro ao enviar e-mail para qualquer cliente durante a\nemissão de notas fiscais.\n\nALTERAÇÃO:\nSolicita-se:\n-Possibilitar o envio de e-mail quando o Host for Gmail.\n\nDocumentação:\nO ajuste deve acontecer na conta do Gmail, nas configurações de segurança, onde deve-se permitir outros programas para o envio."], "213-17": ["Monitor Notas Fiscais Eletrônicas (FATU61) — quantidade de horas, ultrapassou a determinada, respeitadas as configurações", "Monitor Notas Fiscais Eletrônicas – FATU61.pdf", "Pedido Serviço: 28005 Solicitação:\n\nROTINA:\n\nVendas e Distribuição Faturamento Notas Fiscais\nNota Fiscal de Saída\n\nMesmo configurando horas para cancelamento no FATU4, ao tentar realizar o cancelamento de uma nota fiscal\nocorre o aviso de que já ultrapassou a determinada quantidade de horas (mesmo que estas não tenham passado).\n\nALTERAÇÃO:\n-Verificar a quantidade de horas que está no FATU4 e fazer o disparo da mensagem APENAS quando essa quantidade for ultrapassada.\n*Sugestão se for viável: verificar no programa FATU146 a quantidade de horas de cancelamento, ao invés do FATU4\n(para clientes que utilizem o Kunden Monitor).\n\nDocumentação:\nVendas e Distribuição Faturamento Notas Fiscais\nNota Fi"], "213-62": ["Monitor Notas Fiscais Eletrônicas (FATU61) — MONITOR NOTAS FISCAIS - CÓDIGO PRODUTO E DESCRIÇÃO DO CLIENTE DEVEM SER LEVADOS PARA XML…", "Monitor Notas Fiscais Eletrônicas – FATU61.pdf", " Pedido Serviço: 46933 Cliente: TEA Solicitação:\nMONITOR NOTAS FISCAIS - CÓDIGO PRODUTO E DESCRIÇÃO DO CLIENTE DEVEM SER LEVADOS PARA XML E DANFE Rotina:\n\nVendas e Distribuição Faturamento Notas Fiscais\nMonitor Notas Fiscais Eletrônica Alteração:\n\n- Código Produto e Descrição Cliente devem ser levados para o XML e Danfe. Esta informação deve ser gerada por\ntamanho, de acordo com o cadastro efetuado no EPRO32.\nTag <cProd> deve ser preenchida com o código do cliente, por tamanho.\nTag <xProd> deve levar a descrição do cliente, concatenando o código cliente e numeração.\n\nDocumentação:\nVendas e Distribuição Faturamento Notas Fiscais\nMonitor Notas Fiscais Eletrônica Detalhamento:\nCódigo do Produto"], "213-80": ["Monitor Notas Fiscais Eletrônicas (FATU61) — mostrando casas decimais, alterei a descrição, erp smg", "Monitor Notas Fiscais Eletrônicas – FATU61.pdf", "Sobre a questão de mostrar 2 ou 4 casas decimais na Danfe...\nCaso da Smart...em 140621...\nEstava mostrando 2 casas decimais na Danfe, apesar de no programa FATU2 estava mostrando as 4 casas decimais...\nSmart estava precisando que seja mostrando 4 casas decimais (idem como já mostra para os Frigorificos)...\n\nPara configurar isso:\n\nNesta pasta “D:\\Kunden_ERP\\SMG\\K11\\Monitor\\MONITOR\\Modelo_Danfe” inclui o arquivo\n“Danfe4CasasDecimais.rpt” (que peguei do Desenvolvimento)...\n\n...em seguida, fui no FATU146 e alterei a descrição desta parte final diretamente aqui onde estou posicionado... \n...cliquei no “Gerar PDF” do FATU61 (mesmo que a respectiva NF já estivesse emitida e enviada ao cliente)...\n\n"], "213-95": ["Monitor Notas Fiscais Eletrônicas (FATU61) — Aniger, POC Aniger, POC", "Monitor Notas Fiscais Eletrônicas – FATU61.pdf", "E-mail — Assunto: Aniger, POC Aniger, POC\nrevisar a questão do FATU124: tem que ter o de/para de produto (Vínculos Produtos), mesmo sendo o mesmo\ncódigo de produto sendo usado em todas as empresas do grupo ?? (configuração de tabela = PRODUTO_ATM = ÚNICO)\n(isso quando houverem as NFs de Saida de uma empresa, e depois o recebimento pelo FATU124 por outra empresa\ndo mesmo grupo (caso do Aniger)....\n\nPosição: cfe testes de Roberto para a POC, nestes casos não precisa o de/para...o sistema funciona sem o de/para."], "213-105": ["Monitor Notas Fiscais Eletrônicas (FATU61) — tudo de novo, teve que intervir, sair desta mensagem", "Monitor Notas Fiscais Eletrônicas – FATU61.pdf", "[\n\nSituação ocorrida entre 090323 e 100323, na implantação Aniger:  \n-NF não autorizava e dava a mensagem aqui...\n\n“Rejeicao: Valor do Produto difere do produto Valor Unitario de Comercializacao e Quantidade Comercial”...\n\n...Ou seja, este tipo de mensagem é quando a qtde X valor unitário é maior que a qtde em centavos (maior que a\ntolerância em centavos admitida pelo Sefaz)...\n\nMotivo:\n\nNa linha abaixo, realmente o valor estava diferente = inicialmente estava 1.140,00 (depois foi arrumado, no exemplo\nabaixo já está arrumado)...\n...o valor não estava de acordo qtde X valor unitário...  Provável...\n\nAntes de emitir, dava esta mensagem KND-000159...e veja o valor total que constava...\n\n...só q"], "213-114": ["Monitor Notas Fiscais Eletrônicas (FATU61) — aline kaefer, num dos itens, erp hml dados", "Monitor Notas Fiscais Eletrônicas – FATU61.pdf", "Visto em 041023...na implantação Aniger...Para esta mensagem...\n\n“Rejeicao: Valor do Produto difere do produto Valor Unitario de Comercializacao e Quantidade Comercial”  \n[15:44] Aline Kaefer | Kunden Systems\nisso significa que a quantidade x o valor unitario é diferente do valor total\nno item da NF exemplo, QTD = 1\nVLR UNI = 1\nValor Total = 3\n[15:44] Aline Kaefer | Kunden Systems\nesse exemplo daria esse mesmo erro ali que ta dando pra ti\n\nEste caso está acontecendo porque tem um agravante, porque na BD Aniger está configurado para agrupar por\nproduto no XML e na Danfe, e aí as diferenças encontradas tendem a ser maiores (porque faz a soma dos itens).\nPara resolver...:\nabri o XML que está ne"], "215-5": ["Relatório Análise Consumo Previsto x Realizado (ESTO30) — RELATÓRIO ANÁLISE DE CONSUMO PREVISTO X REALIZADO | AGRUPAR E FAZER UM TOTALIZADOR POR…", "Relatório Analise Consumo Previsto X Realizado - ESTO30.pdf", "Pedido Serviço: 9896 Solicitação:\nRELATÓRIO ANÁLISE DE CONSUMO PREVISTO X REALIZADO | AGRUPAR E FAZER UM TOTALIZADOR POR SOLICITANTE.\n\nEste agrupamento e subtotal por solicitante deve ser feito para este relatório substituir o relatório que tínhamos na\nV3 de (ANALISE DE CONSUMO INDIVIDUAL).\n\nNo programa de abastecimento adicionar o campo aonde possamos informar o \"solicitante\", que vai receber o material.\n\nDocumentação:\n- Criado programa cadastro de Solicitantes (ESTO84).\n- A partir de agora nos programas \"Apontamento de Requisição (ESTO79)\" e \"Plano Abastecimento Materiais -\nRequisição (ESTO25)\", será possível informar também o solicitante no momento da baixa.\n- No relatório \"Relatório de C"], "215-16": ["Relatório Análise Consumo Previsto x Realizado (ESTO30) — CRIAR UMA NOVA LÓGICA PARA VINCULAR NO PLANO DE PRODUÇÃO QUAL A SUA SITUAÇÃO PARA CONSUMO", "Relatório Analise Consumo Previsto X Realizado - ESTO30.pdf", "Pedido Serviço: 22098 Cliente: Pegada Solicitação:\n\nCRIAR UMA NOVA LÓGICA PARA VINCULAR NO PLANO DE PRODUÇÃO QUAL A SUA SITUAÇÃO PARA CONSUMO.\n\nROTINA:\n\nPrograma / Rotina Nova ALTERAÇÃO:\n\nCriar uma nova coluna no plano de produção(MPSP5) que indicará a situação para consumo. Este coluna deverá ser\numa listagem com base em um novo programa de \"Situações para Consumo\". Este novo pograma terá as\ninformações de Empresa, Unidade de Negócio, Código (sequencial), Descrição e Situação.\n\nCriar também um filtro novo no programa Relatório Análise Consumo Previsto x Realizado (ESTO30) para selecionar\nquais \"Situações para consumo\" devem ser listadas.\n\nCriar um parâmetro de inicialização para permitir so"], "215-19": ["Relatório Análise Consumo Previsto x Realizado (ESTO30) — dados no relatório, materiais que tiveram, rotina não gera", "Relatório Analise Consumo Previsto X Realizado - ESTO30.pdf", "Teste feito na Oksebra, em 190821, que tem o patch 226, referente caso do pedido serviço 51905, na qual Pegada\nestava solicitando que voltasse a gerar as informações no relatório, mesmo de necessidades/materiais que não\ntiveram nenhum consumo até o momento (cfe Pegada, depois da atualização do patch 228, não está mais trazendo\ndados no relatório se não tiver consumo...(inclusive enviaram relatório impresso anteriormente onde comprova que\na rotina gerava dados no relatório com esta condição)...\nPorém no teste feito na Oksebra, pela conclusão deste teste a rotina não gera dados no relatório se não tiver consumo do material:\n\nCfe analisado abaixo, se lista ou não lista materiais não abastecidos"], "232-0": ["Relatório Posição Estoque (ESTO13) — suprimento tmp atm, relatório posição estoque, tabelas temporárias", "Relatório Posição Estoque - ESTO13.pdf", "Relatório Posição Estoque..\n\nO sistema só habilita o filtro de produtos com qtde negativa no Relatório Posição Estoque, quando o parâmetro 32 está D (Diário)\n\nPorque a principio só poderia ter qtdes negativas quando o parâmetro está D.\n\nXxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx\n\nPesquisado para Wolmir, que ficou de criar um relatório excel partindo das tabelas temporárias:\n(isso para obter dados de valores por mês, que não gravados em tabelas Kunden (o sistema apenas gera os dados para os relatórios).\n\ntabelas temporárias do Relatório Posição Estoque, ESTO13, ESTO14, ESTO43, ESTO44:\n\nSUPRIMENTO_5TMP_ATM SUPRIMENTO_6TMP_ATM SUPRIMENTO_7TMP_ATM"], "232-2": ["Relatório Posição Estoque (ESTO13) — localizado um caractere, custo transacional ret, virada ao tentar", "Relatório Posição Estoque - ESTO13.pdf", "Mensagens de “ORA-20000: Erro GERA_CUSTO_TRANSACIONAL_RET_P: ORA-01858: foi localizado um caractere não\nnumérico onde se esperava um numérico”:\n\nMensagem que ocorreu na Pegada, nos primeiros dias pós virada, ao tentar gerar relatórios de Estoque:\n\nMotivo:\n\nO parâmetro 50062 estava com atributo 20-OCT-12.\n\nOu seja, em Ingles...enquanto que o banco estava em português.\n\nTeve que se alterar para 20-OUT-12 para passar a funcionar OK.   Zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz\n\nTambém após o ajuste acima, continuava a mesma mensagem de “ORA-20000: Erro\nGERA_CUSTO_TRANSACIONAL_RET_P: ORA-01858: foi localizado um caractere não numérico onde se esperava um numérico” ocorrendo posteriormente.\n\nVerificado qu"], "232-15": ["Relatório Posição Estoque (ESTO13) — posição de estoque, moeda dólar, gerar as tarifas", "Relatório Posição Estoque - ESTO13.pdf", "Pedido Serviço: 63982 Cliente: Planet Solicitação:\n\nRotina:\n\nSuprimentos Estoque Relatórios\nRelatórios Posição de Estoque\n\nAlteração: - Verificar por qual motivo disparou a mensagem de erro KND-000212 - Cotação de 30/05/2023 na moeda\nUS$ inexistente¿ ao gerar o relatório posição de estoque ¿ ESTO13, sendo que no cliente não possui nenhuma\nmovimentação com a moeda dólar.\n\nCadastramos a cotação no dia 30/05/2023 e foi possível gerar o relatório normalmente:   Documentação:\n\nSuprimentos Estoque Relatórios\nRelatórios Posição de Estoque Detalhamento:\nNada foi feito.\n\nObservação:\nPara gerar as tarifas de custeio, é necessário identificar o maior preço de venda do produto. Para isso, o sistema\nbusc"], "235-46": ["Registro Controle Produção e Estoque (ESTO20) — FATU3 - VERIFICAR ROTINA DE CUSTO DE BENEFICIAMENTO NA BASE DE TESTES Rotina: [Imagem:…", "Situações do Estoque_Valorizações_Custo_ e Estoque.pdf", "Pedido Serviço: 44300 Cliente: Pegada Solicitação:\nFATU3 - VERIFICAR ROTINA DE CUSTO DE BENEFICIAMENTO NA BASE DE TESTES Rotina:   Suprimentos Recebimento Notas Fiscais\nNota Fiscal de Entrada Alteração:\n\nVerificar rotina do custo de beneficiamento feita no pedido de serviço 41284, pois na base de testes da Pegada não\nestá calculando o custo do estoque corretamente.\n\nDocumentação:\nSuprimentos Recebimento Notas Fiscais\nNota Fiscal de Entrada Detalhamento:\nNada foi feito."], "235-47": ["Livro Inventário (ESTO15) — usando esta operação, mob com icms, mão de obra", "Situações do Estoque_Valorizações_Custo_ e Estoque.pdf", "Observação:\nPara que a lógica funcione com correção é necessário configurar a operação da seguinte forma:\nControle\nControla Estoque = Não Apropriação\nEstoque Industrialização = Sim\n\nO item da nota precisa estar com a localização informada.\n\nMarcio 091120:\n-a princípio está certo a definição da Operação de Controla Estoque = Não e ter localização informada, isso para que\na qtde não atualize estoque (porque a qtde foi utilizada no Beneficiamento feito) mas ao mesmo tempo o custo tem\nque incorporar-se ao valor do Estoque do item de Beneficiamento (2º item da NF de Entrada).\n\nExtensão do acima:\n\nMarcio, 120321 \nSituação do Beneficiamento, que a partir de 2020 as empresas necessitam separar a cob"], "235-53": ["Parâmetros (ADMI8) — localização do lançamento, rotinas de estoque, lcto seq", "Situações do Estoque_Valorizações_Custo_ e Estoque.pdf", "Marcio, 041124:\n-Esta rotina foi utilizada para o RA 241029019, VPS.\n-Revisei com Wagner em 041124, e esta rotina pode ser utilizada...mas com responsabilidade, porque com este\nparâmetro não é feita nenhuma validação*: nem de movimentação em data retroativa, nem de possível geração de\nnegativo no Estoque, nem de verificação de saldo insuficiente de estoque...\n-Importante: para funcionar OK o controle de estoque e geração de todos os relatórios de Estoque, o parâmetro geral\n50142-ORDENAÇÃO DAS ROTINAS DE ESTOQUE tem que ter o atributo = 2 (DEFINE A ORDENAÇÃO PARA AS\nROTINAS DE ESTOQUE. (1 = LCTO_SEQ, 2 = DATA, LCTO_SEQ))\n-A VPS tinha necessidade de incluir mais registros de Implantações, de v"], "235-64": ["Estruturação do Produto (EPRO15) — entrada ao estoque, produto e criamos, parte da produção", "Situações do Estoque_Valorizações_Custo_ e Estoque.pdf", "-A Produção de “Botões Forrados” faremos a partir da rotina de geração de OFs de produção, em conjunto com a\nrotina de Terceirização...(detalhes estão no .doc “VPS_Fluxo de Forração de Botões.docx” que enviei em 20/05/24).\nHaverá um procedimento de Apontamento de Produção das OFs produzidas.\ncomo os Botões não terão NF de Venda, nem terão Pedido de Venda, será necessário o preenchimento do\ncampo “Custo Standard” do programa Estruturação do Produto, para a rotina encontrar o valor (e efetuar o\ncalculo conforme descrito acima).\nExemplo tela abaixo da localização do campo (se o valor for o mesmo para os níveis “pais”, pode ser\ninformado nos níveis de cima, e não um a um destes Produtos.  \n-Tamb"], "235-69": ["Relatório Posição Estoque por Empresa (ESTO14) — lcto estoque atm, maior de tempo, irá atualizar", "Situações do Estoque_Valorizações_Custo_ e Estoque.pdf", "Agora, ajustando nas tabelas...\nCfe verificado com Wagner em 020125, basta atualizar na tabela LCTO_ESTOQUE_ATM...\n-na TRANS_ESTOQUE_ATM nem precisaria...(mas vou atualizar para manter com o mesmo valor)...\n-na tabela NENC irá atualizar por trigger, após feito o UPDATE na LCTO_ESTOQUE_ATM...\n-na tabela LCTO_HISTORICO não precisa, e acho que não tem nada relacionado a colunas de valor...\n-Scripts que eu tenho guardado (e que são extensos) talvez seja para situações em que houve muitas\nmovimentações posteriores e de um intervalo maior de tempo.\n\n-As tabelas estavam assim antes...  \n\nEfetuei isso: [Código: LCTO_ESTOQUE_ATM]\n\nResultado:\nOK em todos os programas da tela abaixo...   \nPor final exe"], "235-73": ["Apontamento de Ordem de Fabricação (CFAB1) — lançamentos de estoques, seriam os corretos, trans estoque atm", "Situações do Estoque_Valorizações_Custo_ e Estoque.pdf", "Em 101025, em um apoio ao Henrich, no RA 251009002 Pedido Serviço 69550, tive que pontualmente* “ajustar” a\nsequência a ser mostrados dos lançamentos de estoques, mostrados na Consulta-ESTO7, Relatório Registro Controle\nProdução e Estoque-ESTO19 e Livro Inventario-ESTO15...\n\n*pontualmente porque espero que o Pedido Serviço 69550 resolva em definitivo...\n\n...então, para “ajustar” a sequencia a ser mostrados dos lançamentos de estoques, eu alterei nas tabelas:\n-LCTO_ESTOQUE_ATM\n-LCTO_ESTOQUE_NENC_ATM (essa aqui, até busquei apoio com Wagner, que me orientou a alterar também, até\nporque sem alterar ela, a sequencia não mudava no Relatório Registro Controle Produção e Estoque -ESTO19 e Livro Inv"], "240-7": ["Requisição Informada (ESTO4) — Desabilitar produtos a nível sintético", "Requisição Informada – ESTO4.pdf", "Pedido Serviço: 64851 Cliente: Kunden Solicitação:\nDesabilitar produtos a nível sintético.\n\nRotina:\n\nSuprimentos Estoque Lançamentos Implantação de Saldo Alteração:\n\nAlterar o filtro de \"Produto\" nos programas abaixo para que não seja possivel selecionar produtos de nivel sintético,\nfazendo com que a lista retorne apenas os produtos analiticos (ulitmo nivel).\nIsso evitará que produtos de nivel sintético recebam estoque de maneira equivocada.\nHoje, o filtro de produtos do ESTO15 já faz filtra desta forma.\nProgramas que devem ser alterados:\n- ESTO2 Implantação de Saldo;\n- ESTO3 Devoluções;\n- ESTO23 Transferencia Entre Localizações;\n- COMP3 Pedidos de Compra;\n- FATU3 Notas Fiscais de Entrada;\n-"], "243-0": ["Local Armazenagem (EPRO26) — locais de armazenagem, realizará a entrada, primeiro ele irá", "Rotina de Armazenamento_padrão Estofados_Rotulos.pdf", "Rotina de Armazenamento_padrão Estofados_Pedido serviço 12535..\n\nCadastro de Local de Armazenagem (EPRO26)\n-- Cadastro dos Locais de Armazenagem disponíveis\n-- possibilita a impressão das etiquetas de identificação dos Locais de Armazenagem\n-- na impressora Argox com o tamanho de 10x10cm.\n\nNecessário configurar o caminho da impressora da etiqueta:\n\nXxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx\n\nOperações nova de Coletor: 21 e 22:  xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx\n\nNo coletor marca HONEYWELL, acessar a aplicação “107”.\nColocar nos favoritos, isso para facilitar o trabalho do usuário ao abrir o browser, já abre na pagina certa:\n\nUsuário e senha idem do sis"], "244-3": ["Local Armazenagem (EPRO26) — Melhorias e desenvolvimento de Novas Rotinas - Frigolaste Boa tarde Ademir,", "Rotina de Armazenamento_padrão Frigorificos_Lotes.pdf", "E-mail — Assunto: Melhorias e desenvolvimento de Novas Rotinas - Frigolaste Boa tarde Ademir,\n\nSobre a “Rotina para Paletização”\n\nJá temos uma rotina semelhante meio desenvolvida (mas não concluída), que foi iniciada em 2018/2019 para\njustamente os frigoríficos, que é uma APLICAÇÃO WEB PARA CONTROLE DE ARMAZENAGEM (que havia sido\nlevantada no diagnóstico, mas depois resolveu-se não utilizar)...\n...mas eu entendo que a questão que foi solicitada do “Palete” é algo bem semelhante a isso que temos “meio- desenvolvido”.\nTambém é algo bem semelhante ao que temos na Brisa = só que aí é controle de SKU = imagino que tenhas lembrança disso.\n\nEm resumo, a rotina funcionaria assim (eu queria ter o teu"], "244-5": ["Local Armazenagem (EPRO26) — numero do lote, local de armaze ervado no estoque as qtdes com\nseus respectivos Lotes (pedido de serviço 20435).\nÉ necessário que no faturamento, na NF Saída gerada pelo programa Liberação Pedidos Venda Faturamento - PEDI4,\nverifique esta reserva e passe a mostrar estes Lotes reservados.\nPermitindo que na Liberação as qtdes destes lotes sejam alteradas as qtdes primárias e secundárias, passando a\ngerar a NF de Saída de acordo com esta libe"], "257-48": ["Liberação Pedidos Faturamento (PEDI4) — vezes o usuario, tinha feito nada, sequencia quis excluir", "Liberação Pedidos Faturamento - PEDI4.pdf", "Visto em 240522, na AB, que as vezes o usuario do sistema “simples mortal” / “Não Administrador”, não consegue\nexcluir uma NF que ele gerou anteriormente...\n\nExemplo:\n-usuario gerou a NF pelo programa PEDI4, e na sequencia quis excluir a mesma (cfe informou, não tinha feito nada\nnesta NF, não tentou emitir, não editou, mas, não se tem certeza que talvez tenha feito uma manutenção nela)...\n\nO fato é que na tentativa deste usuario excluir a NF, dava mensagem de “Exclusão de registro não autorizada.”, cfe tela abaixo...\n\nSolução: excluir com o usuário Administrador “Kunden” (aí não deu nenhuma mensagem, sem problemas).\nAline confirmou que as vezes passou pela mesma situação (porém não tem nada "], "257-49": ["Liberação Pedidos Faturamento (PEDI4) — pedidos faturamento controle, grava na liberação, cadastro transportadora preferencial", "Liberação Pedidos Faturamento - PEDI4.pdf", "Sobre a Transportadora que é sugerida nos programas de Liberação para Faturamento (PEDI4, PEDI44, PEDI73,...):\n\n-O sistema “grava” a Transportadora para o faturamento no momento que é feito a aba “Liberação” nos programas\ncitados acima (PEDI4, PEDI44, PEDI73,...)...\n\n-primeiramente olha se tem a Transportadora gravado no Pedido de Venda.\n-Caso não esteja gravado no Pedido de Venda, busca do cadastro Transportadora Preferencial ADMI228.\nE aí grava na Liberação do Pedido de Venda e passa a trazer na aba “Faturamento”, ou aqui no botão Liberação\nPedidos Faturamento – Controle Carga PEDI73:  "], "257-50": ["Liberação Pedidos Faturamento (PEDI4) — PROGRAMA LIBERAÇÃO PEDIDOS FATURAMENTO ¿ PEDI4, ABA ¿FATURAMENTO¿, CAMPOS ¿QTD VOLUME¿ E", "Liberação Pedidos Faturamento - PEDI4.pdf", "Pedido Serviço: 58227 Cliente: AB Solicitação:\nPROGRAMA LIBERAÇÃO PEDIDOS FATURAMENTO ¿ PEDI4, ABA ¿FATURAMENTO¿, CAMPOS ¿QTD VOLUME¿ E\n¿NUMERO¿: ACUMULAR/SOMAR LIBERAÇÕES MANUAIS E COMPLEMENTARES DE RÓTULOS.\n\n1. Programa Liberação Pedidos Faturamento ¿ PEDI4, aba ¿Faturamento¿, bloco ¿Transp./Volumes¿, campos\n¿Qtd Volume¿ e ¿Numero¿:\n- nestes campos acumular/somar a qtde de novas liberações de rótulos, liberados manualmente na aba Liberação,\njuntando às qtdes já existentes anteriores do mesmo ¿agrupamento¿ (juntar nestes 2 campos).\n- Atualmente a rotina substitui as qtdes destes 2 campos, passando a mostrar a qtde da ultima liberação efetuada, e\nnão somando ao que já havia anteriormente lib"], "257-52": ["Liberação Pedidos Faturamento (PEDI4) — gerar o controle, fiscais de saída, faturar produtos", "Liberação Pedidos Faturamento - PEDI4.pdf", "Pedido Serviço: 61520 Cliente: Pegada Solicitação:\n\nRotina:\n\nVendas e Distribuição Faturamento Notas Fiscais\nNotas Fiscais de Saída Alteração:\nNão está sendo possível gerar o controle de uma nota fiscal de saída. Mensagem “KND-003050” Documentação:  Vendas e Distribuição Faturamento Notas Fiscais\nNotas Fiscais de Saída Detalhamento:\nNada foi feito.\n\nObservação:\nNão é possível faturar produtos que controlam rótulo pelo PEDI4."], "258-9": ["Liberação Pedidos Faturamento (PEDI44) — pedidos venda faturamento, fazendo a validação, entrega de avulso", "Liberação Pedidos Faturamento Rotulos - PEDI44.pdf", "Pedido Serviço: 28888 Solicitação:\n\nROTINA:\n\nVendas e Distribuição Faturamento Notas Fiscais\nLiberação Pedidos Venda Faturamento ALTERAÇÃO:\n\n- Quando temos uma entrega de avulso e rótulo, sistema não está fazendo a validação do cancel enda Faturamento Alteração:\nOs pedidos na base de produção serão faturados pelo programa PEDI4 para não atrasar o faturamento.\nErro em produto na liberação de faturamento. O mesmo esta apresentando o seguinte erro \" KND-003050: Os itens\nna nota não foram gerados\" ao selecionar somente ele.\nPedidos que estão ocorrendo erro:\n40.22589.1352 40.22589.1353 40.22589.1357 40.22589.1356 40.22589.1359 40.22589.1358 40.22589.1348 40.22589.1355 Documentação:\nVendas e Distribuição Faturamento Notas Fiscais\nLiberação Pedidos Venda Faturamento Detalhamento:\nNada foi feito.\n\nObserva"], "258-25": ["Liberação Pedidos Faturamento (PEDI44) — pedidos faturamento controle, grava na liberação, cadastro transportadora preferencial", "Liberação Pedidos Faturamento Rotulos - PEDI44.pdf", "\nSobre a Transportadora que é sugerida nos programas de Liberação para Faturamento (PEDI4, PEDI44, PEDI73,...):\n\n-O sistema “grava” a Transportadora para o faturamento no momento que é feito a aba “Liberação” nos programas\ncitados acima (PEDI4, PEDI44, PEDI73,...)...\n\n-primeiramente olha se tem a Transportadora gravado no Pedido de Venda.\n-Caso não esteja gravado no Pedido de Venda, busca do cadastro Transportadora Preferencial ADMI228.\nE aí grava na Liberação do Pedido de Venda e passa a trazer na aba “Faturamento”, ou aqui no botão Liberação\nPedidos Faturamento – Controle Carga PEDI73:"], "258-26": ["Liberação Pedidos Faturamento (PEDI44) — PEDI44 - PROGRAMA PEDI44 NÃO ESTA FAZENDO A VALIDAÇÃO DO CAMPO \"LIMITE CRÉDITO…", "Liberação Pedidos Faturamento Rotulos - PEDI44.pdf", "  Pedido Serviço: 53522 Cliente: Pegada Solicitação:\nPEDI44 - PROGRAMA PEDI44 NÃO ESTA FAZENDO A VALIDAÇÃO DO CAMPO \"LIMITE CRÉDITO FATURAMENTO\"\nQUANDO UM PRODUTO ESTA SENDO FATURADO PARCIALMENTE.\n\nRotina:\n\nVendas e Distribuição Faturamento Notas Fiscais\nLiberação Pedidos Venda Faturamento Alteração:\n\nAjustar programa PEDI44 para que quando um produto ser faturado parcialmente ele deve olhar para o campo\n\"Limite Crédito Faturamento\" e visualizar o valor que esta liberado, e não olhar para o valor total do pedido de venda.\n\nDocumentação:\nVendas e Distribuição Faturamento Notas Fiscais\nLiberação Pedidos Venda Faturamento Detalhamento:\nNada foi feito.\n\nObservações:\nPedido não pode ser classific"], "258-31": ["Liberação Pedidos Faturamento (PEDI44) — LIBERAÇÃO PEDIDOS VENDA FATURAMENTO - IDENTIFICAR MOTIVO DE ESTAR SENDO LEVADO DESCONTO", "Liberação Pedidos Faturamento Rotulos - PEDI44.pdf", "Pedido Serviço: 69283 Cliente: Atta  Solicitação:\nLIBERAÇÃO PEDIDOS VENDA FATURAMENTO - IDENTIFICAR MOTIVO DE ESTAR SENDO LEVADO DESCONTO\nNEGATIVO PARA A NF Rotina:\n\nVendas e Distribuição Faturamento Notas Fiscais\nLiberação Pedidos Venda Faturamento Alteração:\n\n- Identificar motivo/configuração de estar levando desconto negativo para a NF.\n\n1=Pedido de venda vem do B2B e possui ajuste de preço:  \n2.1. Gerada a NF está levando o valor unitário de 39,1116, quando o correto seria 40,10. E também leva o desconto\nnegativo, quando não deve haver desconto nos itens:\n\nConfigurações que foram revisadas:\n3.1. Parâmetro geral 269 (DESCONTO UTILIZADO - DEFINE O TIPO DE DESCONTO UTILIZADO PELO CLIENTE:\nG"], "258-33": ["Liberação Pedidos Faturamento (PEDI44) — Permitir efetuar faturamento antecipado de pedidos com controle de rótulo no estoque…", "Liberação Pedidos Faturamento Rotulos - PEDI44.pdf", "Pedido Serviço: 67166 Cliente: Atta Solicitação:\nPermitir efetuar faturamento antecipado de pedidos com controle de rótulo no estoque Rotina:\n\nVendas e Distribuição Faturamento Notas Fiscais\nLiberação Pedidos Venda Faturamento Alteração:\n1. Criar um parâmetro no programa Liberação Pedidos Faturamento (PEDI44).\nFATURAMENTO_SEM_ESTOQUE\nPadrão = ¿N¿ ¿ Atual rotina \n¿S¿ = vai permitir faturar itens do pedido que ainda não possuem estoque em parte ou total.\n2. Quando parâmetro for ¿S¿, exibe os itens dos pedidos mesmo não tendo apontamento de estoque.\n2.1. Ao faturar (montar NF FATU2), deve carregar a quantidades dos tamanhos de acordo aos rótulos criados para as entregas no FATU16.\n2.2. NF dever"], "258-40": ["Liberação Pedidos Faturamento (PEDI44) — verifica status faturamento, saldo de crédito, questões financeiras", "Liberação Pedidos Faturamento Rotulos - PEDI44.pdf", "Abaixo passo a passo envia para Atta no RA 260709017 https://kundencloud.com.br:3825/atendimento?id=260709017&callType=customer \nPEDI44 com VERIFICA_STATUS_FATURAMENTO = “S”\n\nAvaliação na BD Atta em 130726, no programa PEDI44, a partir de configurado o parâmetro\nVERIFICA_STATUS_FATURAMENTO com atributo “S”...ou seja, validações que ocorrem a partir desta configuração,\nque em resumo são:\n-Validações envolvendo questões financeiras e de saldo de crédito; (Posição Posterior: cfe visto em testes\nposteriores, as questões financeiras e de saldo de crédito independem deste parâmetro\nVERIFICA_STATUS_FATURAMENTO = “S”, ou seja, mesmo com atributo “N” elas ocorrem, desde que as\nconfigurações pertinent"], "258-41": ["Liberação Pedidos Faturamento (PEDI44) — campos: Aceita Embarque Parcial, Permite Embarque Parcial, Ficha Financeira e Classe…", "Liberação Pedidos Faturamento Rotulos - PEDI44.pdf", "Onde é configurada tal Validação:\n-Aqui no Pedido Venda, exemplo tela e campo abaixo “Aceita Embarque Parcial”: neste exemplo de validação\nocorrida acima, veja que no Pedido Venda estava desmarcado a possibilidade de embarque parcial.\n-Detalhe: este campo Aceita Embarque Parcial no Pedido Venda, é sugerido/preenchido de acordo conforme está no\ncadastro do Cliente-ADMI34, campo “Permite Embarque Parcial”...  \n...aqui testando e comprovando:\n-Quando selecionado a opção “Aceita Embarque Parcial”...\n\n...no programa PEDI44 o mesmo item de Pedido Venda passa a ter a situação OK para faturamento (diferentemente\ndo primeiro teste acima) Zzzzzzzzzzzzzzzzzzzzzzzzzzz  \nExemplo 2: mensagem “Entrega não "], "259-9": ["Operações (RECE2) — RECE2 - AO CONFIRMAR CONTROLE COM OPERAÇÃO QUE CONTROLA ESTOQUE, PORÉM O CAMPO \"EXIGE", "Operação - RECE2.pdf", "Pedido Serviço: 56052 Cliente: Pegada Solicitação:\nRECE2 - AO CONFIRMAR CONTROLE COM OPERAÇÃO QUE CONTROLA ESTOQUE, PORÉM O CAMPO \"EXIGE\nLOCALIZAÇÃO\" ESTÁ COMO NÃO, O SISTEMA GERA ERRO NO ESTOQUE POR NÃO GERAR AS MOVIMENTAÇÕES.\n\nRotina:\n\nSuprimentos Recebimento Cadastros Operações Alteração: \nAjustar programa RECE2 para que quando forem cadastradas novas operações com a opção de \"Controla Estoque\"\nestiver \"Sim\" o campo \"Exige Localização\" por padrão deve vir \"Sim\", mas ainda sim deve ser possível alterar para \"Não\".\n\n...complementando e registrado na Validação:\nSegue abaixo posicionamento quanto ao Impedimento registrado em 23/03/2022 (Pedido Com Impedimento\nAlterado Para = Sim. Motivo: \"Agu"], "259-11": ["Operações (RECE2) — Arquivar...este campo faz com que o sistema gere automaticamente o consumo, na requisição", "Operação - RECE2.pdf", "E-mail — Assunto: Arquivar...este campo faz com que o sistema gere automaticamente o consumo, na requisição...\n\nArquivar...este campo “Efetua Consumo” do RECE2 faz com que o sistema gere automaticamente o consumo, na requisição...\nQuando enviado por exemplo materiais para terceirização = atelier, com atualização de estoque e ficando na conta Industrialização do Estoque...\nE na volta tem que voltar ao Disponível e ocorrer o consumo registrado numa requisição.\n(detalhe que para isso, o campo mais abaixo “Apropriação: Estoque Industrialização” tem que estar configurado com\nNÃO....isso para de fato voltar ao disponível e não “desaparecer” e ser incluído junto Produto da Mão de Obra...até\nporque "], "259-15": ["Operações (RECE2) — CRIAR UM PARÂMETRO GERAL AONDE TODAS AS NOTAS FISCAIS DE ENTRADA COM PIS/COFINS ENTRARÃO…", "Operação - RECE2.pdf", "Pedido Serviço: 61839 Cliente: Brisa  Solicitação:\nCRIAR UM PARÂMETRO GERAL AONDE TODAS AS NOTAS FISCAIS DE ENTRADA COM PIS/COFINS ENTRARÃO COM\nREDUÇÃO NA BASE DE CÁLCULO, AONDE SERÁ DEDUZIDO O VALOR DO ICMS NA BASE DE CALCULO DO PIS/COFINS.\n\nRotina:\n\nSuprimentos Recebimento Notas Fiscais\nNota Fiscal de Entrada Alteração:\n- Criar um parâmetro geral aonde todas as notas fiscais de entrada com PIS/COFINS entrarão com redução na base\nde cálculo, aonde será deduzido o valor do ICMS na base de calculo do PIS/COFINS.\n\nDocumentação:\n\nParâmetro Geral:\n50276 | DESCONTA ICMS DA BASE DE CÁLCULO DO PIS E COFINS NFE/COTAÇÃO/FPV | DESCONTA ICMS DA BASE\nDE CÁLCULO DO PIS E COFINS DAS NOTAS DE ENTRADA COM C"], "259-23": ["Operações (RECE2) — OPERAÇÕES (ESTOQUE) - ESTO1 - CRIAR ABA PARA CADASTRAR OS PARAMETROS DE RETORNO DE…", "Operação - RECE2.pdf", "Documentação:\n\nParâmetro Geral:\n114 | CATEGORIA PRODUTO TERCEIRIZAÇÃO\nEste parâmetro é opcional e visa especificar a categoria de produtos a serem criados durante o processo de geração\nde remessa para industrialização. Destina-se exclusivamente a produtos do tipo 'Produto semi-acabado'.\n\nSuprimentos\nPlanejamento Necessidade de Materiais Abastecimento (MRP)\nPlano Abastecimento Materiais - Remessa Industrialização Detalhamento:\n1. Processo de Criação de Produto:\nProgramas Afetados: ESTO25, ESTO129 (com MENU_CLASSE = RI) e TERC1.\nNova Rotina: Ao criar o pedido de compra, primeiro cria-se um produto na engenharia, que será o item do pedido.\nCategoria do Produto: Conforme definido no parâmetro CA"], "259-24": ["Operações (RECE2) — Testes feitos em 10026, para avaliar a situação do RA 260103001 da VPS", "Operação - RECE2.pdf", "Testes feitos em 10026, para avaliar a situação do RA 260103001 da VPS:\n\nAvaliando aqui a sobre a configuração do campo “Controla Depósito” tanto do RECE2-Recebimento como do RECE2-\nFaturamento...e como funciona a rotina de controle do Depósito Disponível...\n\n...testes feitos na Desenv, com estas Operações assim configuradas:\nVeja que acima, que o campo “Controle Depósito” está NÃO...com isso olhando o teste abaixo, isso comprova que:\n-Que a rotina não utiliza este campo “Controle Depósito” para atualizar as qtdes no Controle de Estoque / Tipo Estoque = Depósito...\n...e sim utiliza este campo “Controle Depósito” para atualizar as qtdes no Controle de Estoque / Tipo Estoque\n= Depósito Disponí"], "261-0": ["Regra de Operação (FATU94) — especial de operações, frigorificos, letavo", "Cadastro de Configuração Especial de Operações – FATU94.pdf", "Cadastro de Configuração Especial de Operações – FATU94..\n\n-Funciona no FATU44, FATU4\n-No FATU153 de Frigorificos: a desenvolver...provável para a Letavo."], "261-5": ["Regra de Operação (FATU94) — controlar e integrar, sugerir a operação, rotina do sugere", "Cadastro de Configuração Especial de Operações – FATU94.pdf", "Avaliado em 070624, na implantação VPS...a rotina do RECE94 sugere OK a operação no programa ESTO71:\n\nConfigurei o programa FATU94, para sugerir a Operação para a Emissão da NF de Saída gerada pelo programa\nESTO71, de acordo com os critérios de:\nMatéria Prima: Operação configurada para controlar e integrar o movimento com o Estoque.\nProduto em Fabricação “201-PEÇAS CORTADAS P/ COSTURA”: Operação configurada para NÃO controlar e integrar\no movimento com o Estoque (conforme já esclarecido em treinamentos anteriores, os Produtos em Fabricação só\nsão gerados para o Estoque por ocasião do final do mês, não sendo controlado a sua movimentação durante o mês).\n(e mantive a configuração no ESTO71, pa"], "262-7": ["Cadastro (RECE32) — Não sugerir operação no programa RECE7 #Problemas pós patch# Rotina", "Cadastro de Configuração Especial de Operações – Recebimentos – RECE32.pdf", "Pedido Serviço: 67141 Cliente: Pegada Solicitação:\nNão sugerir operação no programa RECE7 #Problemas pós patch# Rotina:\n\nSuprimentos Recebimento Notas Fiscais\nRetorno de Remessa Industrialização Alteração:\nCorrigir para não sugerir operação automática no programa RECE7.\n\nDocumentação:\n\nSuprimentos Recebimento Notas Fiscais\nRetorno de Remessa Industrialização Detalhamento:\nNada foi feito.\n\nObservação:\nO comportamento relatado teve origem na solicitação do pedido 65769, ou seja, foi implementado conforme\nsolicitado no pedido referido.\n\nExtensão dos 2 Pedidos Serviço acima, apoio no RA 250220023 de Henrich:\n\nTeste efetuado junto com Jhanrie:\nGerado um teste no Henrich:\nPartir deste exemplo...\n."], "263-1": ["Configuração de Serviços de Documentos Fiscais Eletrônicos (DF-e) (FATU146) — configurações de notas, systems, ver o anexo", "Configuração de Serviços de Documentos Fiscais Eletrônicos (DF-e) - FATU146.pdf", "E-mail —\n(Kunden Systems); Augusto Willrich (Kunden Systems); Denise Aparecida de Oliveira Both (Kunden Systems); Ismael\nde Paula; Letierson da Silva (Kunden Systems); Marcio Reni Schneider (Kunden Systems); Martin Schneider (Kunden\nSystems); Marti Bauer; Micail K. Zabalotzki (Kunden Systems); Roberto Schumacher (Kunden Systems); Simão Meyrer\n(Kunden Systems); Angélica Schuh (Kunden Systems); Ericsson G. dos Santos(Kunden Systems); Lucas Schuh (Kunden Systems)\nCc: Cesar André Wagner (Kunden Systems)\nAssunto: Patch 206 - FATU146 Boa tarde,\n\napenas para que todos estejam sabendo: no patch 206 vamos ter a atualização dos pedidos de\nserviço 29041 e 27631. Ambos os pedidos são referentes ao uso d"], "263-9": ["Configuração de Serviços de Documentos Fiscais Eletrônicos (DF-e) (FATU146) — CRIAR UMA NOVA OPÇÃO NO PROGRAMA CONFIGURAÇÕES DE NOTAS FISCAIS- 'GRADE/DESC.COMPL.PROD'…", "Configuração de Serviços de Documentos Fiscais Eletrônicos (DF-e) - FATU146.pdf", "Pedido Serviço: 19007 Cliente: Malu Solicitação:\nCRIAR UMA NOVA OPÇÃO NO PROGRAMA CONFIGURAÇÕES DE NOTAS FISCAIS- 'GRADE/DESC.COMPL.PROD' PARA\nGERAR A GRANDE NOS DADOS ADICIONAIS DO PRODUTO.  ROTINA Faturamento Notas Fiscais\nConfigurações de notas fiscais.\n\nALTERAÇÃO\n\nCliente tem a necessidade de que a grade dos produtos saia na descrição complementar do item.\nIsso porque o campo descrição do item aceita 120 caracteres, e em grande parte dos produtos a descrição ocupa\ntodos esses caracteres, deixando de fora a grade que está sendo digitada de forma manual na descrição complementar do produto.\n\nA sugestão é criar na configuração de Notas uma nova forma de impressão da Grade, manter a atual op"], "267-0": ["Fundamentação Legal (FATU1) — Faturamento", "Conta e Ordem_e_Faturamento_Triangular_Brisa.pdf", "A rotina de NFS conta e orde Brisa foi desenvolvido sob Pedido Serviço 14793..\nObs.: provalvel que na operação 118 3, tem que colocar atualiza estoque = sim.\n\n(Na Brisa é Calçados Cariri, Schmidt,...)\n\nObs.: no exemplo abaixo, na Brisa está sendo utilizado a Intexco no campo Cliente Faturamento.\n\nOperações:\n\nCadastro de Programas: no programa Liberação Pedidos faturamento e Notas Fiscais Saída:\n\nObs.: O pedido é feito para o cliente codigo 19 (cfe este exemplo. Na Brisa é Calçados Cariri, Schmidt,...). A primeira\nNF de cobrança/venda sai para destinatario 35 (na Brisa é Intexco) \n\nImpressão de Nfs de cobrança/venda (o exemplo de impressão é de outra NF em relação à NF acima):\n\nUtilizar o pro"], "269-1": ["Notas Fiscais de Saída (FATU2) — Controle de Entrada e Retorno de Consertos no Kunden ERP - Lutheuz", "Controle de Entrada e Retorno de Consertos.pdf", "E-mail — Assunto: Controle de Entrada e Retorno de Consertos no Kunden ERP - Lutheuz\nBoa tarde, segue o anexo em Word.\nxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx\nControle de Entrada e Retorno de Consertos no Kunden ERP - Lutheuz.\nProgramas:\n• Notas Fiscais de Entrada – FATU3.\n• Notas Fiscais de Saída – FATU2.\n• Retorno de Remessa De Conserto LCTO – FATU9.\n• Relatório Controle de Deposito – Recebimento e Retorno – RECE21.\n• Operações Recebimento – RECE2.\n• Operações Faturamento – RECE2.\nPara simplificar o controle de entradas e saídas de consertos no Kunden ERP pode ser utilizado o Relatório Controle\nde Deposito – Recebimento e Retorno – RECE21. \nNo relatório é possíve"], "272-8": ["Devolução de (FATU9) — NOTA FISCAL DE SAÍDA - AJUSTAR VALOR BASE CÁLCULO DO ICMS QUE NÃO ESTÁ CONTABILIZANDO O…", "Devolução de Compras - FATU9.pdf", "Pedido Serviço: 66272 Cliente: HK Solicitação:\nNOTA FISCAL DE SAÍDA - AJUSTAR VALOR BASE CÁLCULO DO ICMS QUE NÃO ESTÁ CONTABILIZANDO O VALOR DO IPI ROTINA:   Vendas e Distribuição Faturamento Notas Fiscais\nNota Fiscal de Saída ALTERAÇÃO:\n\nQuando operação configurada para aplicar valor IPI, ao realizar uma devolução de compra pelo FATU9, valor base\ncálculo do ICMS não está contabilizando o valor do IPI.\n\nDocumentação:\n\nVendas e Distribuição Faturamento Notas Fiscais\nNota Fiscal de Saída Detalhamento:\nAjustado."], "274-12": ["Devoluções de Venda (FATU104) + Devoluções de Venda (FATU6) — Esta situação creio que também tenha haver com Devolução", "Devolução de Venda - FATU6 e FATU104.pdf", "Esta situação creio que também tenha haver com Devolução:\n\nSituação Frigolaste em 140119\n\nNecessitavam que o Estorno voltasse para o Estoque Reservado, e que o programa de Liberação (no caso do\nprograma FATU153, Liberação Faturamento Pedidos Rotas) permita seu novo faturamento.\n\nNeste caso, o Estorno* da NFS gera uma NF Entrada “Emissão” (como se fosse uma Devolução).\n*Estorno é feito quando não é mais possível “Cancelar” a NFS porque perdeu o tempo hábil de horas disponibilizado\npelo Sefaz para fazer o cancelamento.\n\nExemplo:\nVeja que na NFS fica referenciada a NF de Entrada:\n...e veja aqui a NF de Entrada “Emissão” que é gerada automaticamente após usar o botão “Gera NF Estorno” na tela\nac"], "274-30": ["Devoluções de Venda (FATU104) + Devoluções de Venda (FATU6) — Passo a passo elaborado para Planet e enviado no protocolo 250116015, em 210125", "Devolução de Venda - FATU6 e FATU104.pdf", "Passo a passo elaborado para Planet e enviado no protocolo 250116015, em 210125:\n\nPlanet_250116015_Passo a Passo\n\nCom base na sua documentação registrada no protocolo 250116015, referente à necessidade de controle das\ndevoluções e de acordo com o
