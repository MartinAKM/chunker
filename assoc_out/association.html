, não trazendo/mostrando casas decimais (quando as qtdes\nde fato não tem qtdes decimais);\nPorém quando o cliente estiver trabalhando com casas decimais nesta Unidade de Medida Secundaria, mostrar as\nQuantidade e"], "151-23": ["Plano Abastecimento Materiais e Controle de Ordem de Fabricação (ESTO112) — estoque disponivel", "Plano Abastecimento Materiais e Controle de Ordem de Fabricação - ESTO112.pdf", "E-mail — Assunto: estoque disponivel\n\nEstou zerando os lotes de estoque que de fato não existem mais, e me deparei com alguns casos, que deve ter sido\nimplantado lotes na migração do sistema.\nComo faço para encerrar estes casos, penúltimo e ultimo itens...\n\nOF 7647:\nEstoques estavam assim...\n\nE por aqui encontramos qual a NFE: encontramos quais os números de NF de Entrada envolvidos, através da\nConsulta Estoque Produto, aba Lançamentos, pesquisando pelas qtdes de 3,13 e 33,05 M2 mostrados na tela 1 acima. \nAssim era uma das NF de entrada: detalhe: print dado depois do ajuste nas qtdes...antes as qtdes eram cfe relatório acima.\n\nAjustamos via script:\nUma das NF conseguimos excluir a NFS e a N"], "151-27": ["Plano Abastecimento Materiais e Controle de Ordem de Fabricação (ESTO112) — Este erro KND-003642, registrado em protocolo de 270818...mensagem KND-003642", "Plano Abastecimento Materiais e Controle de Ordem de Fabricação - ESTO112.pdf", "Este erro KND-003642, registrado em protocolo de 270818...mensagem KND-003642:\n\nOcorreu porque fizeram a inclusão de um item de pedido de venda, sendo que os demais itens deste pedido já estava “Produzidos”.\nEntão o que ocorreu:\n-o respectivo Plano de Produção já estava com um campo atualizado como “Produzido”...e aí o novo item não gerou\nnecessidades (utilizam a rotina de Pedido Simplificado, gerando todos os itens de um pedido num mesmo Plano de\nProdução...como este item novo foi incluído num pedido todo produzido, possivelmente este plano fica como\n“Ocultado” para os abastecimentos e passou a gerar a mensagem KND-003642 neste programa).\n\nA atualização do Plano de Produção não resolveu a q"], "151-38": ["Plano Abastecimento Materiais e Controle de Ordem de Fabricação (ESTO112) — Verificar baixas duplicadas de produtos com controle de lotes no estoque", "Plano Abastecimento Materiais e Controle de Ordem de Fabricação - ESTO112.pdf", "Pedido Serviço: 63620 Cliente: Krumenauer Solicitação:\nVerificar baixas duplicadas de produtos com controle de lotes no estoque.\n\nRotina:\n\nSuprimentos Estoque Consultas Consulta Estoque Produto Alteração:\nVerificar movimentações de requisição gerada feita através do programa ESTO112, está duplicando as baixas de\nalguns lotes em estoque.\n\nDocumentação:\n\nDetalhamento:\nCriada a trigger LCTO_ESTOQUE_LOTE_T1 no cliente, caso a situação do pedido venha acontecer novamente.\n\nAbaixo a trigger acessada no Krumenauer:\n\n\"COMPOUND TRIGGER [Código: OF LCTO_ESTOQUE_LOTE_ATM LCTO_ESTOQUE_ATM]\ndiferente da quantidade da LCTO_ESTOQUE_ATM. Por favor, contate o suporte técnico da Kunden .\n\nEm 121124, avaliação"], "151-39": ["Plano Abastecimento Materiais e Controle de Ordem de Fabricação (ESTO112) — linha do material, abastecimento a maior, planejamento necessidades materiais", "Plano Abastecimento Materiais e Controle de Ordem de Fabricação - ESTO112.pdf", "...ao tentar clicar aqui...  \n...gerou mensagem KND-003494...sendo que ó motivo foi que estava a linha do material 13347 sem informação...\n\n...então exclui a linha do material 13347...  \n...com isso limpou a linha do material 13347... \n\n...e ao clicar no botão ENCERRAR ABASTECIMENTO OF aí OK efetivou este consumo...\n\n...e atualizou OK a OF:  \nEntão, tendo realizado este teste, que entendemos resultou corretamente nesta BD, a posição ao questionamento do cliente foi:\n\nJhanrie.Sup 12/11/2024 - 09:18:16\n\nAjustamos a OF 41655, que estava incorreta e devia estar zerada, a principio a situação ocorreu no ESTO25, estamos\navaliando a rotina dele, para verificar o que esta inconsistente.\n\nSe acontece"], "152-4": ["Ajuste Divergências Estoque X Inventário CRI (ESTO73) — controle de rótulo, novamente lido deveria, transito não terão", "Ajuste Divergência Estoque X Inventariado – ESTO73.pdf", "Documentação:\nSuprimentos Estoque Lançamentos\nAjuste Divergência Estoque X Inventariado - CRI Detalhamento:\nPrevisto ajuste de divergência de estoque x inventariado para produtos com controle de rótulo.\n\nMarcio, 151220, validação do pedido de serviço acima, que inclusive criou a Operação de Coletor WEB:\nColetor_Operação 38 para CONTROLE ROTATIVO DE INVENTARIO RÓTULO\nAbaixo algumas telas da validação...e abaixo uma particularidade que pode ocorrer, na qual poderia estar sendo lido\nno CRI um rotulo que já tivesse sido “desmanchado” anteriormente...neste caso, cfe solicitado por Roberto, este\nrotulo novamente lido deveria ser considerado como Avulso e não mais como um rótulo. (é isso?)      ***"], "152-6": ["Ajuste Divergências Estoque X Inventário CRI (ESTO73) — partindo deste estoque, pois gera, zera a qtde", "Ajuste Divergência Estoque X Inventariado – ESTO73.pdf", "Cliente Smart, programa ESTO73, teste realizado na implantação do sistema, em 220521\n\nTeste na Brisa em 220521, para implantação na Smart que trabalha com SKUs (Controle Unidade Armazenamento),\nfunciona “mais ou menos”* na Brisa, sem mensagem de erro ao confirmar o ajuste...\n\n...mas de igual maneira se acessar o botão para mostrar detalhes dos SKUs, gera este erro... \n...mas, permite confirmar o ajuste, gera a movimentação de estoque...   *Observação:\n-na real, olhando dentro do botão de SKus, está ficando a informação dos SKUS...isso não está OK, mas de qualquer\nmaneira, deixaria de mostrar estas qtdes “totais” em relatórios como Livro Inventario e Posição de Estoque.\n(Marcio, 301121, revis"], "153-1": ["Ajuste Estoque (ESTO104) — Melhorias no pedido 61282 - Criar senha para acessar ESTO104 em todos os clientes", "Ajuste Estoque - ESTO104.pdf", "Pedido Serviço: 61579 Cliente: Kunden Solicitação:\nMelhorias no pedido 61282 - Criar senha para acessar ESTO104 em todos os clientes.\n1- Criar algo que invalide o uso de versões anteriores do ESTO104, versões que não tenham senha. (Caso alguém\ntentar usar o programa anterior não irá funcionar mais);\n\n2- Criar tabela de logs das alterações que forem realizadas neste programa;\n\n3- Criar uma aba no ESTO104 \"Log\", assim como existem abas no programa de consulta de estoque ESTO7, para\nconsulta desses logs por produto.\n\nDocumentação:\n\nSuprimentos Estoque Consultas Ajuste Estoque Produto Detalhamento:\nCriado tabela de logs \"ESTOQUE_FISICO_LOG_ATM\" das alterações de quantidades que forem realizadas "], "154-5": ["Ajuste Inventário - Entrada (ESTO76) — utilizar na adoc, lançamento de ajuste, custo médio", "Ajuste Inventário-ESTO76.pdf", "Testes efetuados na BD Suporte, em 06/2012, em função da possibilidade de utilizar na Adoc.\nIMPORTANTE: AO USAR ESTA OPERAÇÃO, A AREA CONTABIL DEVERÁ ESTAR DE ACORDO/AVISADA, POIS ESTARA\nIMPACTANDO DIRETAMENTE NOS RESULTADOS...TERÃO QUE VERIFICAR SE É NECESSÁRIO UM VINCULO DE CONTABILIZAÇÃO NA OPERAÇÃO.\n\nAbaixo, um exemplo de uma situação atual, com qtde e valor no estoque...\n\n...na consulta: mostra também os lançamentos atual. Na sequencia é efetuado o lançamento de ajuste Entrada... \nNo R3: registra este movimento...\n\n...e no Inventario também, com alteração do custo médio. \nNa sequencia: efetuado mais 1 movimento, para comprovar que o sistema passou a assumir o novo custo médio.  \nAgora: "], "156-2": ["Apontamento de Requisição - Lote - Estab (ESTO131) — KUNDEN DESCARGA DE REQUISICION Buenos días", "Apontamento de Requisição – ESTO131.pdf", "E-mail — Assunto: KUNDEN DESCARGA DE REQUISICION Buenos días\n\n-Por favor, solicito que creen un registro en Kunden CRM, para que nuestra área haga una revisión en la rutina…hay\nun problema pendiente por solventar. \n-favor, antes que no utilizar este programa para materiales CON TALLA (ejemplo Falsas y otros materiales que tienen talla)…\nAl momento, antes de esta revisión, solo utilizar en materiales SIN TALLA (ejemplo cueros…)"], "157-14": ["Gerar Requisição Informada (CEXC101) + Gera Requisições - NF Fatura Exportação (CEXC1094) — Permitir efetuar faturamento antecipado de pedidos com controle de rótulo no estoque…", "Baixa de Estoque de NF Emitida sem Estoque - CEXC101 - CEXC1094.pdf", "Pedido Serviço: 67166 Cliente: Atta Solicitação:\nPermitir efetuar faturamento antecipado de pedidos com controle de rótulo no estoque Rotina:\n\nVendas e Distribuição Faturamento Notas Fiscais\nLiberação Pedidos Venda Faturamento Alteração:\n1. Criar um parâmetro no programa Liberação Pedidos Faturamento (PEDI44).\nFATURAMENTO_SEM_ESTOQUE\nPadrão = ¿N¿ ¿ Atual rotina\n¿S¿ = vai permitir faturar itens do pedido que ainda não possuem estoque em parte ou total.\n2. Quando parâmetro for ¿S¿, exibe os itens dos pedidos mesmo não tendo apontamento de estoque.\n2.1. Ao faturar (montar NF FATU2), deve carregar a quantidades dos tamanhos de acordo aos rótulos criados para as entregas no FATU16.\n2.2. NF deverá"], "157-18": ["Gerar Requisição Informada (CEXC101) + Gera Requisições - NF Fatura Exportação (CEXC1094) — ATTA - Sobre notas de faturamento antecipado com problema [Imagem: ESTO7] [Imagem: ESTO7…", "Baixa de Estoque de NF Emitida sem Estoque - CEXC101 - CEXC1094.pdf", "E-mail — Assunto: ATTA - Sobre notas de faturamento antecipado com problema  \n• Reunir com a Joyce e ver ações a serem tomadas.\n-Sugestão criar validação para não permitir excluir o Item da NFS quando tem Requisição gerada a partir de tal NF.\nPosição: sim, criar a validação...mas posteriormente definido que não criaremos um Pedido Serviço (devido\nao custo e falta de tempo do Desenvolvimento)\n\n• Entender o que foi feito nessa nota.\n-Ver com Atta se esta situação pode se repetir (porque excluíram os itens da NFS????)\nPosição: entendido...é cfe escrito acima, e cfe gravação da reunião, Joyce afirmou que não iriam efetuar de novo.\n\n• Acertar os produtos conforme o Roberto falou.\n-Ver com Atta, i"], "159-3": ["Gera Nota Fiscal de Saída Consignação - ARGENTINA (FATU119) — CONFIGURAÇÃO CLASSE DE OPERAÇÕES - CRIAR CLASSE DE OPERAÇÃO PARA TRATAR PROCESSO DE…", "Consignação – Controle de Estoque.pdf", "Pedido Serviço: 14059 Solicitação:\nCONFIGURAÇÃO CLASSE DE OPERAÇÕES - CRIAR CLASSE DE OPERAÇÃO PARA TRATAR PROCESSO DE CONSIGNAÇÃO\nConfiguração Classe de Operações\n\nCriar Classe de Operação que trate o processo de Consignação.\nSeguintes pontos devem ser analisados:\n* Saída do produto - Gerar Nota Fiscal de Remessa em regime de Consignação - estoque deverá tratar esta questão,\nalocando a quantidade remetida do produto 'Em Consignação' (Poder de Terceiros), considerando a localização da saída;\n\n* Retorno do produto - Retorno (Devolução) em regime de Consignação - estoque deverá tratar esta questão,\nretirando a quantidade 'Em Consignação' (Poder de Terceiros) e alocando esta quantidade ao estoq"], "159-7": ["Programas (ADMI6) — PROGRAMA/ROTINA NOVA - CONTROLE DE CONSIGNAÇÃO PARA ROTULOS Rotina", "Consignação – Controle de Estoque.pdf", "Pedido Serviço: 32843 Cliente: Pegada Solicitação:\nPROGRAMA/ROTINA NOVA - CONTROLE DE CONSIGNAÇÃO PARA ROTULOS Rotina:\n\nPrograma Rotina Nova Alteração:\n\n- Criar nova rotina para notas de Consignação com controle de rótulo e avulsos.\n- Rotina deve tratar o estoque, para que movimente corretamente os rótulos e os avulsos para o estoque \"Consignação\".\nE também de volta para o estoque onde estava anteriormente, quando ocorre a devolução simbólica ou efetiva do produto.\n- Rotina deve tratar movimentos de apenas rótulos, apenas avulsos e também movimentos que possuam os dois tipos.\n- Rotina deve prever recebimento parcial da nota de saída, tratando rótulos e avulsos nessa parte também.\n- Rotina de"], "159-8": ["Registro Controle Produção e Estoque (ESTO19) — produção e estoque, versão da rotina, fechamento do custo", "Consignação – Controle de Estoque.pdf", "Pedido Serviço: 32843 Cliente: Pegada Solicitação:\n\nRotina:\n\nSuprimentos Estoque Relatórios\nRegistro Controle Produção e Estoque Alteração:\n\nRevisar a rotina quando os movimentos são de saída/envio para “Consignação”.\nEstá aumentando indevidamente a qtde e valor da coluna Estoque.\nAté versões anteriores do relatório, com este movimento teria que atualizar/aumentar a qtde de controle “Em\nterceiros”, e baixar a qtde de controle “Estoque” \n-no controle de Estoque, há distorção do calculo do custo Médio de tal produto, e também o fechamento do custo\nde estoque considerando valor estoque inicial + entradas – saídas = valor estoque final.\n-talvez um ajuste/correção na situação acima também ajuste "], "159-9": ["Consulta Estoque Produto (ESTO7) — rotina de consignação, estoque fisico, zerando a qtde", "Consignação – Controle de Estoque.pdf", "Em 032022, novas avaliações da rotina de Consignação para Pegada.\nCfe testes feitos na BD Pegada, repetiram-se problemas...\nNo Registro Controle de Produção e Estoque:\n-não está mais colocando “em Terceiros” cfe ultima tela acima...\n- e está aumentado a qtde na coluna “Estoque/Fisico” o que corresponde ao Disponível no controle de Estoque.\n-também quando está retornando do Cliente, está aumentando mais uma vez o “Estoque/Fisico”, ou seja, com isso\nestá triplicando a qtde no “Estoque/Fisico” depois que retornar (ocorre porque no envio para o cliente está\naumentando e não zerando a qtde do “Estoque/Fisico” (deveria colocar “em Terceiros” cfe citado logo acima)).\n\nNo Livro Inventario:\n-identifi"], "159-12": ["Transferência entre Localização - Estab (ESTO23) — ERROS NA ROTINA DE REMESSA DE CONSIGNAÇÃO", "Consignação – Controle de Estoque.pdf", "Pedido Serviço: 62781 Cliente: Pegada Solicitação:\nERROS NA ROTINA DE REMESSA DE CONSIGNAÇÃO.\n\nRotina:\n\nVendas e Distribuição Faturamento Notas Fiscais\nNotas Fiscais de Saída Alteração:\n1. Erros na rotina Remessa de Consignação ao estornar uma nota:\n1.1. Após o estorno da nota fiscal do pedido, os produtos não exibem o rótulo no saldo de reservado.\n1.2. Ao tentar refaturar o pedido o sistema informa que o pedido já foi efetuado o faturamento.\n1.3. Ao excluir o agrupamento do faturamento, e trazer o pedido de volta para a aba de liberação o sistema está\ninformando quantidade muito acima do que a que está no pedido.\n\nDocumentação:\n\nVendas e Distribuição Faturamento Notas Fiscais\nNotas Fiscais "], "159-13": ["Parâmetros de Inicialização (ADMI125) — configuração da operação, efetivamente vendido, vendeu e retornou", "Consignação – Controle de Estoque.pdf", "-Após isso vamos ao programa PEDI44 para efetuar a liberação (no caso, para empresas que não utilizam o controle\nde Rótulo no Estoque, utilizar o programa PEDI4). Para o produto levar a operação 917 correta na aba de\nfaturamento adicionei o mesmo no programa “Cadastro de Config. Especial (Operações)-FATU94”:  \nAqui a configuração da Operação 917 utilizada na geração da NF de Saída...\n-Veja que a Operação está vinculada à “Classe Operação” = “Remessa Consignação”.\n\nFATU94 configurado cfe abaixo, para gerar a Operação correta no FATU44 e FATU4:  \nGeramos o controle da NF Saída pelo FATU44/FATU4 da tela acima e emitimos:\n\nO estoque ficou correto após a emissão da NFS:\n-Veja que no controle de E"], "159-14": ["Registro Controle Produção e Estoque (ESTO19) — efetua a efetiva, remessa oper, saldo no controle", "Consignação – Controle de Estoque.pdf", "Estoque da Localização de “Consignação” ficou zerado e desta maneira encerrando o fluxo.  \nConsultando o relatório ESTO19 que demonstra as saídas e entradas é apresentado corretamente:  \nObs.: Aqui configuração da Operação de Recebimento, quando não vendido a qtde pelo Cliente...\nNeste caso, quando não foi efetivamente vendido (neste caso a NF Entrada será com a Operação 918))\n-Neste caso, retorna ao Estoque, sem ter ocorrido a Venda. Ficará disponível para uma próxima Remessa ou Venda direta.\n\nResumo do fluxo mostrado acima e as Operações utilizadas:\nQuando é feito a Remessa, e o cliente efetua a efetiva venda\n1º Remessa => Oper 917\nOper 919 <= 2º Retorno\n3º Venda => Oper 113  \nQuando é fei"], "160-1": ["Gera Nota Fiscal de Saída Consignação - ARGENTINA (FATU119) — deverão ser informados, itens e caixas, realizar a emissão", "Consignação – Controle de Estoque_passo a passo.pdf", "Na aba ‘Seleção’ do programa deverão ser informados os filtros conforme necessidade e na aba ‘Notas Fiscais’ serão\nexibidos os resultados dos filtros informados: \n\nOs itens serão exibidos assim como em um processo de Devolução convencional, deverão ser informados os dados\nde Nota Fiscal, Localização (caso seja uma localização diferente da NF de Saída), e Operação (neste programa só\nserão habilitadas operações cuja a classe seja ‘Retorno Consignação’). Ao ‘Confirmar Devolução’, os itens marcados\nserão levados para NF de Entrada, para finalizar a devolução:\n\nApós dadas as informações necessárias a NF, a mesma poderá ser confirmada. Após a confirmação da NF as\nquantidades (caixas) serão lançada"], "162-1": ["Consulta Estoque Produto (ESTO7) — saldo zerado, fiscais de industrialização, alterado para listar", "Consulta Estoque Produto - ESTO7.pdf", "Pedido Serviço: 22399 Solicitação:\nALTERAÇÃO:\n- Notas antigas, que não foram retornadas, porém tiveram seu saldo zerado para que não aparecesse para serem\nretornadas, ainda mostra no estoque.\n\nDocumentação:\nO programa Consulta Estoque Produto(ESTO7) foi alterado para listar apenas notas fiscais de industrialização que\nainda não estiverem fnalizadas.\nDessa forma, estas notas que tiveram seu saldo zerado através de update devem, se ainda não foram, ser encerradas\natravés do programa Encerramento Notas Fiscais\nRemessa(FATU111), assim deixarão de aparecer na consulta de estoque."], "162-10": ["Consulta Estoque Produto (ESTO7) — Visto em 260421", "Consulta Estoque Produto - ESTO7.pdf", "Visto em 260421:\n\nMartin Schneider — Hoje às 10:27\nNo botão “Estoque” de Pedidos e Qtdes Reservadas da Consulta...\n\nMarcio Reni Schneider — Hoje às 10:27 [10:27]\nte lembra em que tabela eu precisaria excluir para não mostrar mais reservado aqui?\n\nMartin Schneider — Hoje às 10:28 RESERVA_QTD_PED_ATM [10:28]\nsó zerar o campo QTD_SALDO já resolve zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz\n\nfiz um teste Deletando mesmo... [Código: RESERVA_QTD_PED_ATM]\n\naí limpou o reservado do pedido mas aí ficou negativo...tive que ajustar pelo ESTO104:  Zzzzzzzzzzzzzzzzzzzzzzzz\n\nExtensão do acima, tive que ajustar para Smart, em 072021;\nGerou mensagem “KND-000226...” não sei exatamente o porquê...enfim:\nSmart_El"], "162-15": ["Consulta Estoque Produto (ESTO7) — sequencia de apontamentos, fiz uma nova, deveria ter ocorrido", "Consulta Estoque Produto - ESTO7.pdf", "Aniger_Apontamento de Rótulo gerando mensagem “KND-000325”...\nSituação apresentada por Ernani/Aniger em 020823...\n\nMotivo: porque o estoque está distorcido... [Código: ROTULO_ATM LCTO_HISTORICO_ATM]\n\nExecutei estes DELETES e resolveu...\n*detalhe: o que estava estranho, foi o resultado do [Código: RESERVA_QTD_PED_ATM]\nPEDIDO_VENDA_ENTREGA_ID = 6871; porque mostra 2 linhas de registro, para diferentes empresas, o que parece ser anormal... [Código: RESERVA_QTD_PED_ATM RESERVA_QTD_PED_GRADE_ATM]\n\nAjustou aqui, tirou o Pedido de Venda que mostrava indevido...\n\n...e resolveu aqui as qtdes também as grades...  Zzzzzzzzzzzzzzzzzzzzzzzzzzzzz\n\nCom isso permitiu apontar o rótulo... \nFicou OK aqui o Est"], "162-20": ["Consulta Estoque Produto (ESTO7) — deixar de carregar, controla estoque, localização padrão", "Consulta Estoque Produto - ESTO7.pdf", "Pedido Serviço: XXXXXXXXXXXX Cliente: HK Solicitação:\nNOTA FISCAL DE SAÍDA - DEIXAR DE CARREGAR A LOCALIZAÇÃO PADRÃO DE UM PRODUTO QUANDO INFORMADA\nUMA OPERAÇÃO QUE NÃO CONTROLA ESTOQUE ROTINA:\n\nVendas e Distribuição Faturamento Notas Fiscais\nNota Fiscal de Saída ALTERAÇÃO:\n\nDeixar de carregar a localização padrão de um produto quando informada uma operação que não controla estoque,\npara evitar, por exemplo, que notas de industrialização apareçam indevidamente na consulta de estoque.\n\nDocumentação:\n\nVendas e Distribuição Faturamento Notas Fiscais\nNota Fiscal de Saída Detalhamento:\nFeito com que Notas Fiscais que possuem operações que não controlam estoque, não apareçam na lista de Notas\nFisc"], "168-5": ["Recebimento de Pedidos de Compra (COMP5) — Definições gerais", "Controle de Lote – questões gerais da rotina de Controle de Lote.pdf", "Pedido serviço 16739: definido para a questão de Estoques.\n\nDefinições gerais:\n\n- O numero de controle principal do Lote deverá ser de sequencia automática (1ª opção).\nPorém deverá permitir configurar para ser numero manual, informado manualmente.\n\n- e deverá ser possível vincular um numero de controle secundário, manual, alfanumérico, não obrigatório, para o\nmesmo Lote. Isso para gravar, por exemplo, o numero do Lote do fornecedor.\n\n- Também na tabela do Lote deverá gravar o item da NF de Entrada, quando estiver sendo gerado o controle do Lote\na partir da NF de Entrada (necessário, por exemplo, no programa novo de abastecimento pedido de serviço 16723).\n\n- Quando o produto tiver configurado"], "170-25": ["Plano de Produção (MPSP5) — data base, cabeçario do plano, necessidades de compras", "Plano de Produção_Detalhes Gerais - MPSP5.pdf", "- a hierarquia de busca de data base e recurso base planejamento é, em primeiro lugar, a partir da data base\nprocesso, e, depois, pela data base do cabeçario do plano de produção; quando não é encontrada data base\ninformada em nenhum destes dois níveis, será buscada a data de entrega do pedido; - o ideal é que a data base e o recurso base planejamento sempre sejam informados juntos; - em função de programas e rotinas que buscam o recurso base planejamento sem levar em conta o processo\n(programas e rotinas que não foram avaliados neste pedido serviço, continuando a buscar o recurso base\nplanejamento através da programação), para aqueles planos de produção que tiverem a data base e o recurso b"], "170-63": ["Plano de Produção (MPSP5) — PLANO DE PRODUÇÃO, ROTINA DE GERAÇÃO DE OFS E TALÕES: TALÃO É GERADO POR ROTULO. GRADE…", "Plano de Produção_Detalhes Gerais - MPSP5.pdf", "Pedido Serviço: 10171 Solicitação:\nPLANO DE PRODUÇÃO, ROTINA DE GERAÇÃO DE OFS E TALÕES: TALÃO É GERADO POR ROTULO. GRADE MUSICAL.\n\nDocumentação:\nESTRUTURAÇÃO DE PRODUTO (EPRO15)\n\nQuando o Tipo Cálculo Lote for igual a \"Base Rótulos\" abrirá um opção para identificar se utiliza lote ou não e uma\nopção para informar a quantidade do lote.\n\nAPONTAMENTO/ESTORNO DE LOTE (CFAB1/CFAB10)\n\nO parâmetro de inicialização MENU_CLASSE possuirá um novo atributo \"LOTE\", o qual possibilitará o apontamento/estorno de lote.\n\nCONSULTA DE ORDEM DE FABRICAÇÃO (CFAB2)\n\nFoi acrescentado o filtro de \"Lote\" na seleção.\nFoi acrescentada a aba de \"Lote\" para que seja possível a visualização das ordens de fabricação agru"], "170-88": ["Plano de Produção (MPSP5) — talla del producto, suela, exemplo de estrutura", "Plano de Produção_Detalhes Gerais - MPSP5.pdf", "Situação ocorrida em 05/2016, na Stefmary, posição vinda em protocolo de Alfredo, na qual gerava esta mensagem\n“ORA-20000: Erro OF_CALCULO_NECESSIDADE_P: INCLUSAO_PRODUCAO: ORA-01400: cannot insert null into\n(“KUNDEN”.”NECES_PROD_GRADE_GTB_ATM”.”GRADE_TAMANHO_ID”) ao tentar gerar o Plano de Produção.\n\nMotivo:\n\nEl motivo es la configuración del semi-acabado “suela” producto 8347:\n-Este producto 8347 esta con la configuración de “producto dependiente” (en la Estructuración de Producto)\n-y la talla vinculada a este 8347 es diferente que la talla del producto acabado.\n- y con eso, el material “cuña” vinculado en la Lista de Materiales del semi-acabado 8347 “dependiente” no\nencuentra las variació"], "170-92": ["Plano de Produção (MPSP5) — lote máximo musical, balanceado forma, médio sólido", "Plano de Produção_Detalhes Gerais - MPSP5.pdf", "Pedido Serviço: 22365 Solicitação:\n\nROTINA:\nManufatura\nEngenharia e Desenvolvimento de Produto Engenharia Estruturação de Produto ALTERAÇÃO:\n- Permitir configurar o produto para calcular o lote, quando este possuir o cálculo LOTE MÁXIMO MUSICAL.\nAtualmente, somente existe esta configuração para o cálculo de BASE RÓTULOS.\n\nDocumentação:\nRotina de geração de planos de produção:\n- Tipo de Cálculos:\n- Além do cálculo \"Base Rótulos\", que já permitia a geração de lotes de ordens de fabricação, agora os cálculos abaixo também permitem:\n* Lote Máximo Cálculo 1\n* Lote Máximo Cálculo 2\n* Lote Máximo Musical * Médio Musical * Médio Musical/Rótulos * Médio Sólido\n* Balanceado Forma OF\n* Balanceado Forma"], "170-94": ["Plano de Produção (MPSP5) — quantidade lote, manufatura dados gerais, mestre de produção", "Plano de Produção_Detalhes Gerais - MPSP5.pdf", "Pedido Serviço: 23557 Cliente: Guante Solicitação:\nROTINA:\n\nManufatura\nPlano Mestre de Produção (MPS)\nPlano Mestre de Produção Plano de Produção ALTERAÇÃO:\n\nNo Tipo de Calculo Lote \"Balanceado Forma OF\":  \n1. Remover campo para preenche quantidade do lote. Motivo: O tamanho do lote será de acordo com a quantidade\nmáxima de formas disponíveis no Balanceamento de Formas. Atualmente a rotina já faz desta maneira;\n\n2. Alterar rotina para que leve em conta o que estiver configurado no campo \"Quantidade Lote OF\", e manter a\ngeração das OF sempre com grade sólida.\n\nDocumentação:\nRotina:\nManufatura\nPlano Mestre de Produção (MPS)\nPlano Mestre de Produção Plano de Produção Detalhamento:\nTipo de cálcul"], "170-126": ["Plano de Produção (MPSP5) — PROJETO IMPLANTAÇÃO VENDA ESTOQUE FUTURO", "Plano de Produção_Detalhes Gerais - MPSP5.pdf", "Pedido Serviço: 52378 Cliente: Pegada Solicitação:\nPROJETO IMPLANTAÇÃO VENDA ESTOQUE FUTURO\n1. No programa \"Lote Produção Estoque (LE) - PEDI1\":\n-Necessário campo para informar a Localização.\n-Permitir trocar o cliente e o grupo cliente no LE.\n-Criar regra alteração de data de entrega de lote de produção estoque\n\n2. No programa \"Plano de Produção - MPSP5\":\n-Permitir efetuar aproveitamento de qtdes avulsas em Lotes Produção Estoque.\n-criar Validação para não permitir \"Excluir MRP\" do Plano de Produção. \n3. No programa \"Liberação de Estoque Futuro - MPSP20\":\n-Considerar a tratativa citada no item 2, em relação aproveitamento de qtdes avulsas em Lotes Produção Estoque\n-Necessário campo para inf"], "170-151": ["Plano de Produção (MPSP5) — AJUSTAR A GERAÇÃO DAS OFS E AS NECESSIDADES DE PRODUTOS QUE POSSUEM PROCESSO PRODUTIVO", "Plano de Produção_Detalhes Gerais - MPSP5.pdf", "Pedido Serviço: 60705 Cliente: Aniger Solicitação:\nAJUSTAR A GERAÇÃO DAS OFS E AS NECESSIDADES DE PRODUTOS QUE POSSUEM PROCESSO PRODUTIVO\nINDEPENDENTE DENTRO DE OUTRO PRODUTO COM PROCESSO PRODUTIVO DEPENDENTE.\n\nRotina:\n\nManufatura\nPlano Mestre de Produção (MPS)\nPlano Mestre de Produção Plano de Produção Alteração:\nAjustar a geração das OFs e as necessidades de produtos que possuem processo produtivo independente dentro de\noutro produto com processo produtivo dependente.\n1. Semiacabado com processo produtivo independente, dentro de outro semiacabado com processo produtivo\ndependente, deverá passar a gerar OF e necessidade de materiais;\n1.1. Criar parâmetro VALIDA_PROCESSO_PRODUTIVO_INDEPENDEN"], "170-157": ["Plano de Produção (MPSP5) — variação de consumo, venha ocorrer novamente, produto está vinculado", "Plano de Produção_Detalhes Gerais - MPSP5.pdf", "Pedido Serviço: 66327 Cliente: Atta Solicitação:\n\nRotina:\n\nManufatura\nPlano Mestre de Produção (MPS)\nPlano Mestre de Produção Plano de Produção Alteração:\nGerando erro de variação de consumo inexistente, mensagem “KND-000201”, sendo que existe variação de consumo no material  Documentação:\n\nManufatura\nPlano Mestre de Produção (MPS)\nPlano Mestre de Produção Plano de Produção Detalhamento:\nOs erros KND-000201 na geração do plano estavam acontecendo, pois, o ID dos tamanhos que estavam na tabela de\ngrade do pedido de venda estavam diferentes do ID dos tamanhos da grade do produto, com isso os erros\nKND-000201 informando que não existia variação de consumo para determinados tamanho do produto, e"], "170-158": ["Plano de Produção (MPSP5) — Referente a mensagem de erroo: “Não existe variação de grade entre grade \"GRADE 34 AO 43\"…", "Plano de Produção_Detalhes Gerais - MPSP5.pdf", "Pedido Serviço: 66316 Cliente: Planet Solicitação:\nReferente a mensagem de erroo: “Não existe variação de grade entre grade \"GRADE 34 AO 43\" e grade \"GRADE 34\nAO 44\" na largura \" \" e tamanho \"39\" na variação \"7\".” Rotina:\n\nManufatura\nEngenharia e Desenvolvimento de Produto  Cadastros Variação de Grade Alteração:\nVerificar o motivo de ao tentar criar o plano de produção, é exibida a mensagem de que não existe variação de grade\nsendo que as mesmas estão corretas no programa EPRO19 e estão vinculadas nos materiais no programa EPRO15.\n\nDocumentação:\nManufatura\nEngenharia e Desenvolvimento de Produto Cadastros Variação de Grade Detalhamento:\nOs erros “Não existe Variação de Grade...” na geração d"], "170-166": ["Plano de Produção (MPSP5) — PLANO DE PRODUÇÃO - NÃO ESTÁ GERANDO NECESSIDADE DE COMPRAS DOS CONJUNTOS ESPECIFICADOS…", "Plano de Produção_Detalhes Gerais - MPSP5.pdf", "Pedido Serviço: 59631 Cliente: Aniger Solicitação:\nPLANO DE PRODUÇÃO - NÃO ESTÁ GERANDO NECESSIDADE DE COMPRAS DOS CONJUNTOS ESPECIFICADOS NO PEDIDO Rotina:\nManufatura\nPlano Mestre de Produção (MPS)\nPlano Mestre de Produção Plano de Produção Alteração:\n- Não está gerando necessidade de compras dos conjuntos especificados no pedido, necessário ajustar para gerar\nindiferente do tipo de produto. (pode-se classificar aqui também como semi-acabados)    Documentação:\n\nManufatura\nPlano Mestre de Produção (MPS)\nPlano Mestre de Produção Plano de Produção Detalhamento:\nAjustado."], "170-170": ["Plano de Produção (MPSP5) — mestre de produção, produto com largura, cálculo base rótulo", "Plano de Produção_Detalhes Gerais - MPSP5.pdf", "Pedido Serviço: 64066 Cliente: Kunden Solicitação:\n\nRotina:\n\nManufatura\nPlano Mestre de Produção (MPS)\nPlano Mestre de Produção Plano de Produção Alteração:  \nPlano de produção (MPSP5) - quando produto com largura na grade e tipo de cálculo base rótulo, não está gerando\nOFs, talão e lote Documentação:\n\nManufatura\nPlano Mestre de Produção (MPS)\nPlano Mestre de Produção Plano de Produção Detalhamento:\nAjustado."], "170-175": ["Plano de Produção (MPSP5) — padrão dos produtos, cálculo de lote, revisar tratar motivo", "Plano de Produção_Detalhes Gerais - MPSP5.pdf", "\nSituação vista no RA 251017010 da Atta...\nhttps://kundencloud.com.br:3825/atendimento?id=251017010&callType=customer\n\n...e relatado no Pedido Serviço 69618* (Programa Plano de Produção-MPSP5: revisar/tratar motivo de não estar\ngerando/não gerou as OFs de todos os Produtos/Entregas de Pedido Venda vinculados no Plano de Produção) que\nnão foi desenvolvido, não foi “Confirmado” (por falta de tempo de Desenvolvimento, e/ou por ser algo que possa ser\nconsiderado como específico/especificação para Atta (até o momento nunca ocorreu em outro cliente)). Além do\nmais, situação ficou esclarecida no RA 251017010 deste Pedido, ocorrendo apenas numa situação em que o usuário\nutiliza o programa de uma man"], "171-0": ["Plano Abastecimento Materiais (ESTO25) — mat remessa industrialização, tiveram o consumo, rui na multi-seleção", "Controle dos materiais que são enviados de maneira excedente ao Terceirizado e Interno.pdf", "Controle dos materiais que são enviados de maneira excedente ao Terceirizado e Interno (a maior)..\nVisto no retreinamento Oksebra 280920\nFazer transferência de Localização 1 para 5 = das qtdes que realmente serão enviados ao atelier.\n\nEstoque fica na Localização na Localização 5:\nFazer o consumo real na Localização 5\n\nUsar esta opção de “Agrupamento” para mostrar saldos em tela da Localização desejada: \nEstoque reduziu da Localização 5:  \nPara a questão de NF:\n1º fazer “Remessa” no programa “Plano Abast Mat - Remessa Industrialização - NÃO GERA NF - Baixa na Remessa”\nPara os materiais que terão efetuado o consumo da Localização 1\n\n2º fazer “Remessa” em “Plano Abast Mat - Remessa Industrializ"], "171-1": ["Notas Fiscais de Saída (FATU2) — tambor, diversos planos, selecionando o plano", "Controle dos materiais que são enviados de maneira excedente ao Terceirizado e Interno.pdf", "Quanto à excedentes enviados na Produção Interna (tambor de cola, na qual o Plano necessita uma qtde X, menor\nque a qtde do tambor inteiro)...\n\nVisto na demonstração da Democrata em 290725... \nOpção 1= abastecer pelo “Produto”, não selecionando o Plano de Produção, assim a rotina vai mostrar todos os\nPlanos em aberto, e com isso fazer o consumo “fracionando” para diversos Planos com saldo de\nabastecimento...poderia até usar o agrupamento de “Material” sendo que neste caso a rotina irá se incumbir de\ndistribuir a qtde total entregue do tambor entre os diversos Planos em aberto (sem mostrar necessariamente na aba\n“Necessidades” (pelo agrupamento “Material” que se tenha selecionado/optado)\nOpçã"], "173-0": ["Transferência Produção para Estoque (ESTO5) — data próximo, rotina de leitura, ajuste divergencia estoque", "Controle Rotativo de Inventario CRI_Resumo.pdf", "1\n\nControle Rotativo de Inventario (CRI):..\nPara utilização, efetuar os seguintes procedimentos:\n\n1= definir na Estrutura de Produto: “Prazo Dias” e “Data Próximo” (a primeira vez que utilizar a rotina para o produto\nou família de produtos que se está posicionado. A “Data Próximo” após o primeiro inventariado serão atualizados\nconforme indicado nos próximos passos abaixo).\n 2\n\n2= No Relatório Produtos a Inventariar: fazer a seleção do intervalo de data em que deverá ser feito o inventariado\ndo Estoque. O sistema vai gerar os materiais a serem inventariados de acordo com a “Data Próximo” do item 1 acima.\nDetalhe: na pasta Opções, utilizar a opção “Atualizar...” para que o sistema atualize a d"], "174-0": ["Relatório (ESTO56) — produtos inventário cri, conferencia física, data do próximo", "Controle Rotativo do Inventario_CRI.pdf", "V4_rotina_CRI (do Estoque) = Controle Rotativo Inventário..\n\nObs.: rotina desenvolvida a partir do Pedido Serviço 15816.\n\nProcedimento Resumido:\nUtilizado para conferencias/auditorias/ajustes nos Estoques das empresas.\n\n1= em Manufatura/Engenharia/Engenharia/ Estrutura do Produto:\nestabelecer quais produtos terão controle de CRI, na Estrutura do Produto, pasta Inventário.\nNesta pasta estabelecer a periodicidade e a data do próximo inventariado/conferencia física.\n\n2= em Suprimentos/Estoque/Relatórios/ Relatório Produtos Inventário – CRI (ESTO64/ ESTO65):\nEmitir o Relatório Produtos Inventário - CRI, que vai relacionar os produtos que tem que ser efetuado o inventariado/conferencia física.\nNe"], "174-18": ["Operações (ADMI86) — [Imagem: ADMI86]", "Controle Rotativo do Inventario_CRI.pdf", "Pedido Serviço: 43727 Cliente: Pegada Solicitação: \nESTO4 - REQUISIÇÕES DE CRI ESTÃO COM PROBLEMAS DE CENTRO DE CUSTO E QUANTIDADE DA GRADE Rotina:\n\nSuprimentos Estoque Lançamentos Requisição Informada Alteração:\n\n- Requisições informadas utilizadas para ajuste do CRI (controle rotativo inventário) estão com problemas de centro\nde custo e quantidade da grade.\n\nDocumentação:\nSuprimentos Estoque Lançamentos Requisição Informada Detalhamento:\nVerificado que o problema foi causado devido ao fato de os programas de lançamento e ajuste de divergência de\nestoque x inventariado (ESTO67 e ESTO73) não estarem preparados para produtos com controle de rótulo.\nOs lançamentos de requisição informada gerad"], "174-23": ["Categoria (EPRO2) — gerou um lançamento, baixou as qtdes, veja o relatório", "Controle Rotativo do Inventario_CRI.pdf", "Com base neste estoque... \nFiz o lançame ario CGIRON para excluir los movimientos de las…", "Plano Abastecimento Materiais - Requisição - Controle de Lote – ESTO129.pdf", "E-mail — Assunto: Podrías nuevamente encaminar al usuario CGIRON para excluir los movimientos de las requisiciones\nindicadas en la pantalla abajo?\n\nDe acuerdo correos abajo, estoy revisando movimientos de bajas de consumo do materiales...\n-con el último ajuste que realizamos en 22/03/21 (correo abajo) quedó casi todo resuelto.\n\n-solo, aún he visto que generó un problema, en las requisiciones número 965631 y 965633 creadas en viernes 23/04,\npantalla abajo, donde que no están registrados los Lotes, y con eso genera diferencias en los controle de Lotes…\n\nPor revisiones que he hecho, creo que el motivo es el siguiente:\n-el usuario utilizó el programa configurado para la Bodega 06, pero cambió la"], "200-7": ["Plano Abastecimento Materiais - Requisição - Controle de Lote (ESTO129) — ESTO25, ESTO129 - erro nas baixas de necessidades com origem ¿Solicitação¿, sem plano e…", "Plano Abastecimento Materiais - Requisição - Controle de Lote – ESTO129.pdf", " Pedido Serviço: 66155 Cliente: VPS Solicitação:\nESTO25, ESTO129 - erro nas baixas de necessidades com origem ¿Solicitação¿, sem plano e OF informados, que\ngeram uma Requisição Informada.\n\nRotina:\n\nSuprimentos\nPlanejamento Necessidade de Materiais Abastecimento (MRP)\nPlano Abastecimento Materiais - Requisição Alteração:\nNos programas ESTO25 ¿ Plano de Abastecimento de Materiais ¿ Requisição e ESTO129 ¿ Plano de Abastecimento de\nMateriais ¿ Requisição ¿ Controle de Lote, ao realizar baixas de necessidades com origem ¿Solicitação¿ sem plano e\nOF informados, não está sendo vinculado o lote na Requisição Informada, causando erros nos estoques.\n\nDocumentação:\n\nSuprimentos\nPlanejamento Necessidade"], "200-8": ["Plano Abastecimento Materiais - Requisição - Controle de Lote (ESTO129) — Programa ¿Plano Abastecimento Materiais - Requisição - Controle de Lote-ESTO129¿: Passe a…", " ransferência para Produção ALTERAÇÃO:\n\nRevisar as rotinas do programa Plano Abastecimento Materiais, com o parâmetro MENU_CLASSE = RI, SR, TP.\n\nQuando efetuado o procedimento de Remessa de Industrialização parciais, envolvendo as mesmas OFs e mesma\nseleção das necessidades (do Processo, Recurso, Componente, material,...):\n\n- Atualmente a partir da 2ª Remessa parcial para a mesma seleção, efetua o vinculo da Remessa de Industrialização\nrepetindo para a"], "201-14": ["Plano Abastecimento Materiais (ESTO25) — remessa de terceirização, manufatura terceirizados lançamentos, remessas que possibilite", "Plano Abastecimento Materiais _ Remessa Industrialização ESTO25.pdf", "Pedido Serviço: 31354 Cliente: GS Solicitação:\n\nROTINA:\n\nManufatura Terceirizados Lançamentos Remessa ALTERAÇÃO:\n\nNa geração de remessa:\n-permitir efetuar apontamento de determinado processo (apontamento de Lote e de OF, semelhante rotina do\napontamento efetuado pelo \"Retorno\" de Terceirização).\n\n-Criar parâmetro de inicialização para os programas que geram as remessas, que possibilite configurar para que\nefetue o apontamento ou não no momento da Remessa. Parâmetro semelhante aos programas que geram o\nRetorno de Terceirização, através do parâmetro APONTAR_PRODUCAO = S.\nProgramas que necessitam ter esta funcionalidade:\nRemessa - TERC1\nPlano Abastecimento Materiais - Remessa Industrialização -"], "201-19": ["Plano Abastecimento Materiais (ESTO25) — ESTO25 - MESMO INFORMANDO RECURSO NO PROGRAMA ESTO25 (REMESSA INDUSTRIALIZAÇÃO) ESTA", "Plano Abastecimento Materiais _ Remessa Industrialização ESTO25.pdf", "Pedido Serviço: 55517 Cliente: Pegada Solicitação:\nESTO25 - MESMO INFORMANDO RECURSO NO PROGRAMA ESTO25 (REMESSA INDUSTRIALIZAÇÃO) ESTA\nINFORMAÇÃO NÃO ESTA SENDO GRAVADA QUANDO CONSULTADO NO PROGRAMA ESTO25 (REQUISIÇÃO GIRO).   Rotina:\n\nSuprimentos\nPlanejamento Necessidade de Materiais Abastecimento (MRP)\nPlano Abastecimento Materiais - Remessa Industrialização Alteração:\n\n tra OK a validação...não deixa gerar problema e funciona OK a validação do\nabastecimento a maior"], "202-19": ["Plano Abastecimento Materiais (ESTO25) — PLANO ABASTECIMENTO DE MATERIAIS - REQUISIÇÃO - VALIDAR NA MULTI-SELECÃO PARA NÃO PERMTIR", "Plano Abastecimento Materiais _Requisições ESTO25.pdf", "Pedido Serviço: 8354 Solicitação:\nPLANO ABASTECIMENTO DE MATERIAIS - REQUISIÇÃO - VALIDAR NA MULTI-SELECÃO PARA NÃO PERMTIR\nINFORMAÇÃO DE PLANOS COM SITUAÇÃO DIFERENTE DE FIRME\n\nNo filtro de plano, se informar plano que esteja com situação diferente de Firme, retorna mensagem KND-000389 - Não foram encontradas.......\nO mesmo acontece quando o pano está informado na multi-seleção.\n***Correto****\n\nO Problema, quando informa-se nos filtros multi-seleção, planos cheios, e firmes misturados.\nSe tiver apenas um como situação firme, passa batido, mostrando as necessidades somente dos planos firme, e isso\ngerou falta de materiais na produção.\n\nSolicitação: Não permitir informar planos com situação d"], "202-26": ["Plano Abastecimento Materiais (ESTO25) — MELHORIAS NAS ROTINAS DE ESTOQUES PARA ATENDER AS NECESSIDADES NA CONTABILIZAÇÃO DO…", "Plano Abastecimento Materiais _Requisições ESTO25.pdf", "Pedido Serviço: 11657 Solicitação:\nMELHORIAS NAS ROTINAS DE ESTOQUES PARA ATENDER AS NECESSIDADES NA CONTABILIZAÇÃO DO CUSTEIO:\n\n1) Solicitações de produção programa Esto36.\nAcrescentar centro de custo.\nQuando informado OF sugerir o centro de custo de onde a OF está progrmada.\n\nValidação: Verificar parâmetro 20, se etiver como SIM exigir centro de custo.\nbloquear quando, com OF e a classe de custo estiver informada (obtida através da conta contábil consumo do produto)\n*** essa validaçao deve ser feita no momento de informar o produto\n\n2) Devoluções (Esto3), Requisição informada(Esto4), Implantação(Esto2)\nValidação: Verificar parâmetro 20, se etiver como SIM exigir centro de custo.\n\n3) Plano "], "202-70": ["Plano Abastecimento Materiais (ESTO25) — ESTRUTURAÇÃ  o porquê...enfim:\nSmart_Eliminado saldo reservado de mistura com... [Código: RESERVA_QTD_PED_ATM]\n\nDepois feito baixa via “requisição Informada” Estava assim; \nImportante: Roberto tem um pedido de serviço, Pedido 47701, para permitir selecionar via programa o que se\nprecisa tirar da reserva e tirar da Reserva (vinculado a Plano), e aí fazer poder fazer a Requisição Informada."], "202-90": ["Plano Abastecimento Materiais (ESTO25) — necessidade do material, centro de custo, verificar o porque", "Plano Abastecimento Materiais _Requisições ESTO25.pdf", "Pedido Serviço: 63421 Cliente: Frigolaste Solicitação:\n\nRotina:\n\nSuprimentos\nPlanejamento Necessidade de Materiais Abastecimento (MRP)\nPlano Abastecimento Materiais - Requisição Alteração:\nVerificar de onde está vindo a informação do centro de custo, no campo “Centro Custo”, e verificar o porque não\n“assume” o Centro de Custo que está vindo sugerido.    Documentação:\nSuprimentos\nPlanejamento Necessidade de Materiais Abastecimento (MRP)\nPlano Abastecimento Materiais - Requisição Detalhamento:\nNada foi feito.\n\nObsevação:\nO centro de custo está vindo da solicitação de necessidade do material, ela pode ser vista no programa ESTO93 Solicitação número 445.\nQuando o usuário selecionar uma localizaç"], "202-92": ["Plano Abastecimento Materiais (ESTO25) — linha do material, veja que zerou, trazido no abastecimento", "Plano Abastecimento Materiais _Requisições ESTO25.pdf", "Em 121124, avaliação realizada para atender a um questionamento ao protocolo 241107009/Wellour, referente a...\n\n“Monica.Wellour 07/11/2024 - 10:09:45\n\nconseguem ver a movimentação que foi feita nessa OF? ela foi estornada, a princípio corretamente, porém as peças\ncontinuam aparecendo (olhando a tela abaixo a qtde de 532 PC (TAMBÉM MOSTRA NO CFAB59) Monica.Wellour 11/11/2024 - 14:27:55\nOlá, só existem dois programas que são obrigatórios para estornar uma OF\nprimeiro esse, onde é informada a of nessa tela e após, na aba requisições é
