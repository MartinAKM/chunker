tina dos programas RECE7 e TERC2 tendo o parâmetro\nde inicialização APONTAR_PRODUCAO = S...\n-E, quando o apontamento ocorreu manualmente (e não no momento do Retorno de Terceirização)\nnestes casos no TERC5 NÃO exclui o respectivo Apontamento de Produção = do processo vinculado ao Serviço* .\n\n*pessoal eu não comprovei e"], "716-12": ["Parâmetros de Inicialização (ADMI125) — conserto, setor de custos, porque o preço", "Rotina de Terceirização.pdf", "Sobre Amostras e Consertos,\n\nVisto com João em 13/07/2011, das tratativas que utilizam no HK:\nNa BD HK: informam sempre OF? Posição: sim\nPorque nos consertos permite informar valor e qtde? Posição: qtde porque a qtde de consertos pode ser menor que\na OF. Valor porque o setor de Custos calcula um valor para o conserto, e estes passam para o usuário da Remessa,\nque informa manualmente o valor na Remessa (não abrem uma tarifa específica para este conserto, pois os valores variam muito).\nE nas Amostras permite informar qtde? Posição: sim, porque às vezes há diferenças nas qtdes da OF em relação ao\nque é enviado efetivamente.\nSolução: criar um produto Amostra, um PP/OF fictício apenas para fazer "], "716-18": ["Remessa (TERC1) — RETORNO DE TERCEIRIZAÇÃO: RETORNOS DE SERVIÇOS PODEM SER POR TALÃO", "Rotina de Terceirização.pdf", "Pedido Serviço: 10178 Solicitação:\nRETORNO DE TERCEIRIZAÇÃO: RETORNOS DE SERVIÇOS PODEM SER POR TALÃO.\n\nTratar as rotinas para que as rotinas de retorno possam ser efetuadas por talão.\nPrograma de Retorno de Terceirização e programa Retorno de Remessa de Industrialização.\n\nDocumentação:\nPOSIÇÃO REMESSA/RETORNO (TERC3) EXCLUSÃO REMESSA (TERC4) EXCLUSÃO RETORNO (TERC5) REMESSA (TERC1) RETORNO (TERC2)\n\nTodos os programas receberam o filtro de lote e, sempre que possível, será visualizada a informação do lote."], "716-31": ["Consulta Ordem de Fabricação (CFAB2) — programa de Remessa de Terceirização, já trazer automaticamente os dados", "Rotina de Terceirização.pdf", "E-mail — Assunto: programa de Remessa de Terceirização, já trazer automaticamente os dados\n\nEstamos com a seguinte dúvida:\n\nA entrada do retorno das nf do atelier já devem ser apontadas pelo lançamento da nf o processo da costura externa (processo 2).\nCadastramos hoje pela manhã para que a emissão das notas fiscais já aponte o setor da costura interna (processo 7).\nPorém, a Cintia não estava conseguindo\nSalvar o lançamento desta nf 7921, acusava que o setor 7 já estava baixado. Excluímos o apontamento do proc 7 e\nsalvamos a nf, mas o setor processo 2\nNão foi apontado pelo lançamento da Nota fiscal. Poderia nos informar qual cadastro está faltando?  zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz\n\nEu m"], "716-32": ["Notas Fiscais de Entrada (FATU3) — programa de Remessa de Terceirização, já trazer automaticamente os dados Bom dia", "Rotina de Terceirização.pdf", "E-mail — Assunto: programa de Remessa de Terceirização, já trazer automaticamente os dados Bom dia\n\n-já identifiquei o motivo da rotina estar tentando apontar o processo 7 e não ter apontado o processo 2 (isso quando\nestão fazendo o Retorno da Terceirização no programa RECE7-Retorno de Remessa Terceirização)\nÉ porque estas 2 OFs, que saíram com a NF 26512, tiveram o Processo 7 vinculado na Remessa (deveria ter ocorrido\no vinculo do processo 2). Dá para ver pela tela abaixo (mas o certo teria sido o processo 2, porque o serviço 6002\ntem sim vinculado o processo 2).\n\nTem mais OFs nesta situação...podes ver pela tela abaixo da Consulta\n\nOlhando pela tela abaixo, veja que as vezes está gerando a"], "716-41": ["Notas Fiscais de Entrada (FATU3) — glaucia, verificar o procedimento, tentando realizar dois", "Rotina de Terceirização.pdf", "Depois de confirmar esta NF de entrada, terão que fazer o consumo/baixa manualmente destes materiais da\noperação 902.5, isso ocorre pois deixarão de usar a operação 902.2 e a rotina não vai fazer o consumo.  Zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz\n\nSituação semelhante ocorrida em 06 ue está concluído a terceirização:  "], "720-3": ["Plano Abastecimento Materiais (ESTO25) — Maneiras alternativas de fazer o procedimento de Terceirização", "Rotina de Terceirização_Treinamento interno 280119.pdf", "Maneiras alternativas de fazer o procedimento de Terceirização:\n\nNa Remessa: fazer pelo programa ESTO25 – Plano Abastecimento Materiais Remessa Industrialização:\n\nInformando as OFs... \n\nSeparando o material que tem que ser enviado ao atelier...e ao clicar no botão “Remessa Industrialização” o sistema\ngera automaticamente: a remessa, o pedido de serviço, a NFS.\n\nE no retorno:   \nSistema vai gerar a NF de Entrada, vai automaticamente efetuar o registro do retorno de terceirização, o registro no\nPedido de compra, e apontamento se estiver configurado para fazer apontamento (parâmetro de inicialização do programa).  \nQuando foram necessários exclusão de retorno (ou de remessa): "], "722-2": ["Agendador de Tarefas (ADMI63) — Preciso atualizar os custos standards da Estofados Bom dia Marcio", "Agendador de Tarefas.pdf", "E-mail — Assunto: Preciso atualizar os custos standards da Estofados Bom dia Marcio\n\né uma rotina que desde 15/01/2009, portanto não sei dizer se funciona ou não, rodei na nossa base a princípio\nexecutou o cálculo. Segue um script que chama a rotina.\nApós o script executar o COMMIT;\n\nSQL> BEGIN ATUALIZA_CUSTO_STANDARD_P;\nEND;\n\nDetalhe: ao executar o script, gerou o erro:\n\nSQL> BEGIN ATUALIZA_CUSTO_STANDARD_P;\nERROR at line 1:\nORA-20000: Erro ATUALIZA_CUSTO_STANDARD_P: ORA-20000: Erro GERA_CUSTO_TRANSACIONAL_P:\nORA-20000: Erro BUSCA_COTACAO_MOEDA_F:\nORA-20000: KND-000212: Cotação de 31/12/2012 na moeda US$ inexistente.\nORA-06512: at \"KUNDEN.MENSAGEM_P\", line 129\nORA-06512: at \"KUNDEN.ATUALIZA"], "722-36": ["Agendador de Tarefas (ADMI63) — ESTRUTURAÇÃO DE PRODUTO - EPRO15 / Agendador de Tarefas: GERAÇÃO MRP COMPRA PEDIDOS EM…", "Agendador de Tarefas.pdf", "Pedido Serviço: 44183 Cliente: TEA Solicitação:\nESTRUTURAÇÃO DE PRODUTO - EPRO15 / Agendador de Tarefas: GERAÇÃO MRP COMPRA PEDIDOS EM CARTEIRA Rotina:\n\nManufatura\nEngenharia e Desenvolvimento de Produto Engenharia\nEstruturação de Produto - EPRO15\n\nAgendador de Tarefas: GERAÇÃO MRP COMPRA PEDIDOS EM CARTEIRA Alteração:\n\nVerificar o motivo do log que aparece no agendador de tarefas.\nROTINA do Agendador de Tarefas: GERAÇÃO MRP COMPRA PEDIDOS EM CARTEIRA\n\nMensagem: “KND-000201...Não existe coeficiente na Variação de Consumo...” Documentação:\nManufatura\nEngenharia e Desenvolvimento de Produto Engenharia\nEstruturação de Produto - EPRO15 Detalhamento:\nNada foi feito.\n\nObservação:\nFoi necessário re"], "730-12": ["Clientes (ADMI35) — NECESSÁRIO A CRIAÇÃO DE NOVO PROGRAMA PARA CADASTRO DE SERVIÇO DE INSPEÇÃO, ASSIM COMO…", "Clientes - ADMI35.pdf", "Pedido Serviço: 59839 Cliente: Frigolaste Solicitação:\nNECESSÁRIO A CRIAÇÃO DE NOVO PROGRAMA PARA CADASTRO DE SERVIÇO DE INSPEÇÃO, ASSIM COMO FILTRO\nPARA O MESMO NO ADMI80 E ADMI35.\n\nRotina:\n\nAdministração Cadastros Clientes Alteração:\n\nNecessário a criação de novo programa para cadastro de serviço de inspeção, assim como filtro para o mesmo no ADMI80 e ADMI35.\n\nDocumentação:\nAdministração Cadastros Serviço Inspeção Detalhamento:\nCriado o programa \"Serviço Inspeção\" para a criação de Servicos de Inspeção para clientes.\n\nAdministração Relatórios\nResumo Cadastro de Pessoas Detalhamento:\nNo programa de \"Resumo Cadastro de Clientes\", adicionado o campo de \"Serviço Inspeção\" para filtrar por clie"], "730-15": ["Clientes (ADMI35) — ESTRUTURAÇÃO DE PRODUTO (EPRO15) - TER POSSIBILIDADE DE INFORMAR MAIS DE UM CÓD. DE…", "Clientes - ADMI35.pdf", "Pedido Serviço: 59706 Cliente: Aniger Solicitação:\nESTRUTURAÇÃO DE PRODUTO (EPRO15) - TER POSSIBILIDADE DE INFORMAR MAIS DE UM CÓD. DE BARRAS NA\nGRADE DO MESMO PRODUTO.\n\nRotina:\n\nManufatura\nEngenharia e Desenvolvimento de Produto Engenharia Estruturação de Produto Alteração:\n\nTer possibilidade de informar mais de um cód. de barras na grade do mesmo produto.\nDefinir qual cód. usar no cliente.\nDemanda criação de cadastro: \"Grupo cód. barras\".\n\nDocumentação:\n\nParâmetro Geral:\n50251 | HABILITA O CONTROLE DE GRUPO DE CÓDIGO DE BARRAS | DEFINE SE O SISTEMA HABILITARÁ O\nCONTROLE DE GRUPOS DE CÓDIGOS DE BARRAS NO CADASTRO DO CLIENTE E NA ENGENHARIA DO PRODUTO.\nATRIBUTOS POSSÍVEIS SÃO S (IRÁ HABILITA"], "730-16": ["Clientes (ADMI35) — LIBERAÇÃO PEDIDOS VENDA FATURAMENTO - IDENTIFICAR MOTIVO DE ESTAR SENDO LEVADO DESCONTO", "Clientes - ADMI35.pdf", "Pedido Serviço: 69283 Cliente: Atta Solicitação:\nLIBERAÇÃO PEDIDOS VENDA FATURAMENTO - IDENTIFICAR MOTIVO DE ESTAR SENDO LEVADO DESCONTO\nNEGATIVO PARA A NF Rotina:\n\nVendas e Distribuição Faturamento Notas Fiscais\nLiberação Pedidos Venda Faturamento Alteração:\n\n- Identificar motivo/configuração de estar levando desconto negativo para a NF.\n\n1=Pedido de venda vem do B2B e possui ajuste de preço: \n2.1. Gerada a NF está levando o valor unitário de 39,1116, quando o correto seria 40,10. E também leva o desconto\nnegativo, quando não deve haver desconto nos itens:  \nConfigurações que foram revisadas:\n3.1. Parâmetro geral 269 (DESCONTO UTILIZADO - DEFINE O TIPO DE DESCONTO UTILIZADO PELO CLIENTE:\nG="], "753-9": ["Ocorrências (CPAG3) — Na geração do PDF que deverá ser anexado no email", "Ocorrências – CPAG3.pdf", "-Na geração do PDF que deverá ser anexado no email:\n-utilizar a mesma versão da impressão do Pedido de Venda, no caso, o programa PEDI5, e incluir mais esta\nfuncionalidade de imprimir as Ocorrências “Ativas” vinculadas aos Itens do Pedido de Venda (podem haver mais de 1\nocorrência “Ativa” ao mesmo Item de Pedido de Venda, e neste caso, caso imprimir todas, na mesma sequencia que\nsão listadas na tela de Ocorrências do Item de Pedido de Venda).\n-Imprimir após a impressão dos dados do Item (Produto, qtde e valores), dos Detalhes Técnicos e das Informações Complementares do Item.\n\n3º: No programa “Posição de Pedidos Detalhado (PEDI118)”, idem desenvolvimento do Pedido de Vendas registrado acima:"], "757-39": ["Pessoas Físicas/Jurídicas (ADMI34) — cadastro da pessoa, ver como pegada, rede de lojas", "Pessoas Fisicas_Juridicas - ADMI34.pdf", "Avaliação entre 122024 e 012025 na implantação Grafdil, questão do cadastro da Pessoa, no caso a Pessoa “Principal”\nde um “Grupo” (o “dono” de uma Franquia, por exemplo, ou a Pessoa “Matriz” de uma rede de Lojas)...\n\nNo cadastro desta Pessoa “Principal”, orientei para fazer assim: sem vincular a ela o seu mesmo código de Pessoa no campo “Grupo”...\n\nA orientação é com base nos testes de validação do pedido serviço 66323 (66323_Val_201124)...está assim esta\nparte nesta validação citada: \n\n“Novo teste neste dia: aqui a configuração no cadastro da Pessoa, que é o Cliente definido como “Grupo”, e que\ntambém é o cliente a ser utilizado no B2B como pode ser visto na tela ao fundo...\n\n...aqui acessa"], "757-40": ["Pessoas Físicas/Jurídicas (ADMI34) — vinculado ao usuário, pessoa grupo, clientes vinculados", "Pessoas Fisicas_Juridicas - ADMI34.pdf", "Veja que aqui de igual maneira, como no teste da validação Grafdil acima, também abre os CLIENTES vinculados a este GRUPO...\n\n...DANDO O ok acima, passa a mostrar o CLIENTE = a Pessoa = Grupo, conforme o cadastro do Usuario...até aqui\nparece que está OK assim...\n\nEntão, a partir do teste acima na Pegada, que parece estar OK, vou continuar o teste na Grafdil, tentando fazer o\nPedido de venda da maneira como está...seguindo aqui o teste:\nUtilizando USUÁRIO de uma Pessoa = GRUPO...\n\n...aqui acessando o B2B com este usuario = GRUPO... \n\n...(até mostra estranho, porque o que mostra não é a Pessoa/cliente a qual vou fazer a compra), mas, dando OK abaixo...\n\n...aqui mostra OK a Pessoa/Cliente do us"], "757-43": ["Pessoas Físicas/Jurídicas (ADMI34) — GRUPO: AJUSTE NO CONCEITO DE GRUPO NO SISTEMA", "Pessoas Fisicas_Juridicas - ADMI34.pdf", "Pedido Serviço: 13407 Cliente: Pegad ha de operação, primeiras linhas", "Eficiencia.pdf", "Em 022026, em apoio ao RA 251219027 para Atta, na qual a rotina não gerava a eficiência no programa “Eficiência- PREC12*” https://kundencloud.com.br:3825/atendimento?id=251219027&callType=customer\n\n*este registro abaixo feito teste apontando produção na Desenv, onde repliquei o mesmo problema da Atta\n\n-Primeira pista era de que não estivesse gerando eficiência porque o Processo dos Apontamentos dos exemplos era\nCarga Maquina (Máquina), mas esta hipótese foi descartada usando este select, na qual avaliamos os apontamentos\ngerados para a tabela de eficiência, de Processos definidos com Carga Maquina (Máquina), visto que mostrou que sim\nhá registros de tempo em parte dos registros...  \n(ou seja"], "779-1": ["Eficiência (PREC12) — programa EFICIENCIA: ESTÃO SENDO APAGADOS OS DADOS DE APONTAMENTOS QUANDO SE EFETUA UMA", "Lançamento Recurso Efetivo_Lançamento Recurso Previsto.pdf", "Pedido Serviço: 7246 Solicitação:\nprograma EFICIENCIA: ESTÃO SENDO APAGADOS OS DADOS DE APONTAMENTOS QUANDO SE EFETUA UMA\nEXCLUSÃO DE LANÇAMENTOS DE EVENTOS OU LANÇAMENTOS DE RECURSOS EFETIVOS, do respectivo dia\n\nSituação verificada tanto na BD da Estofados, como no cliente HKuntzler.\n\nDocumentação:\nLANÇAMENTO RECURSO EFETIVO/LANÇAMENTO RECURSO PREVISTO (PREC24)\nAo efetuar uma exclusão de lançamento a partir de registros mostrados na tela de consulta, o programa passa a\nexcluir somente o lançamento que não tiver lançamento de evento ou produção vinculado. Até o momento, quando\nocorria uma exclusão nesta tela, todos os lançamentos de evento e produção eram excluídos para o recurso, data e tur"], "781-1": ["Operações (PREC6) — CADASTRO DE OPERAÇÕES, DE CRP: CRIAR CAMPOS NOVOS QUE SERÃO UTILIZADOS POR SUA ROTINA…", "Operações - PREC6.pdf", "Pedido Serviço: 7494 Solicitação:\nCADASTRO DE OPERAÇÕES, DE CRP: CRIAR CAMPOS NOVOS QUE SERÃO UTILIZADOS POR SUA ROTINA PROPRIA DE\nFOLHA DE PAGAMENTO, E CRIAR CADASTROS PROPRIOS PARA ESTES CAMPOS.\n\nIdea:\n- No cadastro de Operações, criar estes 2 campos ao final do cadastro atual, utilizando a barra de rolagem.\n\n- Estes 2 campos deverão ter um cadastro proprio, abrir apenas as opções deste cadastro para vincular nestes\ncampos (abrir lista de valores neste campo).\n\n- Ideia: criar um cadastro semelhante ao cadastro \"Configuração Especificação Técnica\" utilizado na Engenharia e Estruturação de Produto.\nEste cadastro possibilitaria definir quais os campos novos a serem visualizados no cadastro de"], "781-4": ["Operações (PREC6) — PROGRAMA \"PROCESSOS-PREC7\" MODIFICAR A TRATATIVA DA LISTA DE VALORES DO CAMPO OPERAÇÕES, E", "Operações - PREC6.pdf", "Pedido Serviço: 60410 Cliente: Aniger Solicitação:\nPROGRAMA \"PROCESSOS-PREC7\" MODIFICAR A TRATATIVA DA LISTA DE VALORES DO CAMPO OPERAÇÕES, E\nPROGRAMA \"OPERAÇÕES-PREC6\" AUMENTAR LARGURA DO CAMPO \"DESCRIÇÃO\".\n\n1. Programa \"Processos-PREC7\", bloco/tela \"Ficha de Operações\", campo \"Operação\": modificar a tratativa da\nLista de Valores e possibilidades de vínculo de Operações;\n1.1. A Lista de Valores deverá passar a abrir a Lista considerando:\n-as Operações que tem vinculado o respectivo Processo ao qual se está posicionado para criar a Ficha de Operações\n(já faz assim atualmente);\n-e passar a trazer também nesta Lista de Valores as Operações que não tenham vínculo com Processo no seu\ncadastro, n"], "782-14": ["Processos - Calcula Meta sobre Eficiência (PREC7) — PROGRAMA \"PROCESSOS-PREC7\" MODIFICAR A TRATATIVA DA LISTA DE VALORES DO CAMPO OPERAÇÕES, E", "Processos - PREC7.pdf", "Pedido Serviço: 60410 Cliente: Aniger  Solicitação:\nPROGRAMA \"PROCESSOS-PREC7\" MODIFICAR A TRATATIVA DA LISTA DE VALORES DO CAMPO OPERAÇÕES, E\nPROGRAMA \"OPERAÇÕES-PREC6\" AUMENTAR LARGURA DO CAMPO \"DESCRIÇÃO\".\n\n1. Programa \"Processos-PREC7\", bloco/tela \"Ficha de Operações\", campo \"Operação\": modificar a tratativa da\nLista de Valores e possibilidades de vínculo de Operações;\n1.1. A Lista de Valores deverá passar a abrir a Lista considerando:\n-as Operações que tem vinculado o respectivo Processo ao qual se está posicionado para criar a Ficha de Operações\n(já faz assim atualmente);\n-e passar a trazer também nesta Lista de Valores as Operações que não tenham vínculo com Processo no seu\ncadastro, "], "783-0": ["Propriedade Operações (PREC27) — CADASTRO DE OPERAÇÕES, DE CRP: CRIAR CAMPOS NOVOS QUE SERÃO UTILIZADOS POR SUA ROTINA…", "Propriedade Operações.pdf", "Propriedade Operações..\n\nPedido Serviço: 7494 Solicitação:\nCADASTRO DE OPERAÇÕES, DE CRP: CRIAR CAMPOS NOVOS QUE SERÃO UTILIZADOS POR SUA ROTINA PROPRIA DE\nFOLHA DE PAGAMENTO, E CRIAR CADASTROS PROPRIOS PARA ESTES CAMPOS.\n\nIdea:\n- No cadastro de Operações, criar estes 2 campos ao final do cadastro atual, utilizando a barra de rolagem.\n\n- Estes 2 campos deverão ter um cadastro proprio, abrir apenas as opções deste cadastro para vincular nestes\ncampos (abrir lista de valores neste campo).\n\n- Ideia: criar um cadastro semelhante ao cadastro \"Configuração Especificação Técnica\" utilizado na Engenharia e Estruturação de Produto.\nEste cadastro possibilitaria definir quais os campos novos a serem vi"], "784-1": ["Relatório Eficiência (PREC18) — Sobre a duvida de onde o sistema busca a informação para o “Relatório Eficiência” Bom dia,", "Relatório Eficiencia - PREC18.pdf", "E-mail — Assunto: Sobre a duvida de onde o sistema busca a informação para o “Relatório Eficiência” Bom dia,\n\nSobre a duvida de onde o sistema busca a informação para o “Relatório Eficiência”, a coluna Custo do Resumo de\nEventos e Minutos Perdidos...\n\n...busca do cadastro de Tarifas, da Tarifa Prevista.\nMultiplica o numero de minutos X esta tarifa. \nMais um teste na qual mostra o valor do custo para o Relatório de Eficiencia: \n Xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx\n\nSobre o campo Recursos: teve alterações da maneira como busca as informações para o calculo de da qtde de Recursos.\nFicou assim estabelecido, cfe feito por Jean:\n- busca do total dos minutos dos turnos vinc"], "784-6": ["Relatório Eficiência (PREC18) — Visto em 141022 na implantação Aniger", "Relatório Eficiencia - PREC18.pdf", "Visto em 141022 na implantação Aniger:\nA rotina não gera a informação de Recurso Base Planejamento nos relatórios de Eficiência (gera a informação de SEM RECURSO)...\n\n...mesmo que em outros relatórios de Chão de Fabrica ter informado o Recurso Base Planejamento, como neste...\n\n...e isso ocorre porque para os relatórios de Eficiência o sistema não “encontra” o Recurso Base Planejamento\natravés do Calendário de Recursos...\n\n...ou seja, o Recurso que não está vinculado diretamente num “Recurso Base Planejamento” no cadastro do\nCalendário de Recurso (ou seja, está vinculado num “Grupo”), vai estar mostrando nos relatórios de Eficiencia como SEM RECURSO...  \nEste tipo de cadastro de Recurso no PR"], "785-0": ["Relatório (PREC16) — relatórios de eficiência, recurso base planejamento, tais recursos porque", "Relatório Eficiência Diária – PREC16.pdf", "Relatório Eficiência Diária – PREC16..\n\nExemplo impresso em 131022 Xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx\n\nVisto em 141022 na implantação Aniger:\nA rotina não gera a informação de Recurso Base Planejamento nos relatórios de Eficiência (gera a informação de SEM RECURSO)...  \n...mesmo que em outros relatórios de Chão de Fabrica ter informado o Recurso Base Planejamento, como neste...\n\n...e isso ocorre porque para os relatórios de Eficiência o sistema não “encontra” o Recurso Base Planejamento\natravés do Calendário de Recursos...\n\n...ou seja, o Recurso que não está vinculado diretamente num “Recurso Base Planejamento” no cadastro do\nCalendário de Recurso (ou seja, está vinculado num “Grupo”), vai esta"], "786-4": ["Estruturação do Produto (EPRO15) — Exemplo gerado em 11092024 para a Demo Adoc", "Relatório Ficha de Operações por Produto.pdf", "Exemplo gerado em 11092024 para a Demo Adoc:\n\nAqui selecionando a opção de “Lote Talão”, para para este produto está definido = 12 pares, no EPRO15/Manufatura:\n...gerando com base nestes cadastros:    "], "788-4": ["Alteração Categoria Entrega (PEDI40) — informei a localização, venda sob encomenda, tipo de entrega", "Alteração Categoria Entrega - PEDI40.pdf", "Testes com o programa na VPS em 060824...\n\nPedido de Venda sob Encomenda, consultado aqui... \nTroquei tipo de entrega, e informei a Localização...\n\n...salvou o registro...  \nEstoque: reservou OK (ao fundo antes do procedimento acima)...  \nPedido de Venda atualizou OK aqui:"], "793-13": ["Notas Fiscais de Saída (FATU2) — virada ao tentar, primeiros dias pós, portugues e passou", "Situações Gerais no sistema_mensagens_bloqueios_exclusões.pdf", "Ocorrido no programa de NFS em 16 e 17/10 na Minuano, mas poderia acontecer em qualquer programa:\n\nMensagem “41017”\n\n- aconteceu porque no programa FATU2, original, tem + campos...entre eles, o campo de UF citado abaixo que foi alterado uma propriedade.\n\nMas neste programa FATU2 abaixo, que é o mesmo codigo porém ouro MENU_CLASSE, não mostra estes campos... e\naí por este motivo gerou o erro.  xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx\n\nMensagem “ORA-01858” que ocorreu na Pegada, nos primeiros dias pós virada, ao tentar gerar relatórios de Estoque:\n\nMotivo: \nO parâmetro 50062 estava com atributo 20-OCT-12.\n\nOu seja, em Ingles...enquanto que o banco estava em português.\n\nTeve q"], "793-21": ["apostrofe, produção o motivo, porque de acordo", "Situações Gerais no sistema_mensagens_bloqueios_exclusões.pdf", "Para esta mensagem, que apareceu em todos os programas de MRP de Compras, filtrando um determinado Plano de\nProdução, o motivo é...\n\nMensagens “ORA-20000, ORA-00933”\n\n...é que foi colocado uma apostrofe na Estruturação de Produto, campo “Obs Compras”.\nCfe definição de Jean, não há como prever isso nos programas, nem evitar que ocorra, nem colocar mensagem. Não\nse pode colocar apostrofe em nenhum lugar cadastro do sistema, porque de acordo como são feitos os selects nos\nprogramas podem gerar estes inconvenientes.\n\nVeja abaixo a apostrofe, ao final da Obs."], "793-31": ["Pedidos de Venda (PEDI1) — ora e ora, pieles del sur, situação que passou", "Situações Gerais no sistema_mensagens_bloqueios_exclusões.pdf", "E-mail — Assunto: Por favor me ajuda com uma situação que passou a ocorrer na Pieles del Sur  Caio\n\nNa Pieles del sur tá resolvido.\nA procedure ZI_PEDIDO_VENDA_P não existia lá, tentei rodar a do patch mas deu erro por causa das tabelas, aí rodei\na versão que estou enviando em anexo.\nVamos fazer a mesma coisa que fizemos com a outra ZI, tenta rodar a versão do patch, se der erro, roda essa.\n\nMais uma situação idêntica:\n\nPedido serviço 41054 Rotina:\nVendas e Distribuição Pedidos Pedido Alteração Categoria Entrega Alteração:\nAo tentarmos alterar alguma categoria de um pedido, aparece uma mensagem ORA-06544 e ORA-06553 não\ndeixando efetuar a alteração.\nA mensagem que está aparecendo é a seguint"], "793-35": ["Plano de Necessidades de Formas (Processo (COMP26) — Situação semelhante ao acima ocorrido na Duramas em 010224", "Situações Gerais no sistema_mensagens_bloqueios_exclusões.pdf", "Situação semelhante ao acima ocorrido na Duramas em 010224:\nNo relatório COMP26...\nMensagem “REP-1401: ‘cf_label_inf_tecformula’:...ORA-04062:... Fatal....KUNDEN.TRADUCAO_REP_P...” Solução:\n-fechar o arquivinho “report background” da barra do computador que estava aberto acho que faz bastante tempo,\ne com isso voltou a funcionar o relatório.   Xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx\n\nEsta mensagem começou a aparecer na Pegada, em 040521, no Relatório TERC8...sem motivo aparente a partir\ndesta data, porque não tiveram atualizações últimos dias, e este relatório não teve alterações desde 2014...\n\nMensagem “REP-1401: ‘cf_pÁginaformula’: Ocorreu um erro fatal...ORA-06502:...erro n"], "793-44": ["salva no banco, could not, ora ora", "Situações Gerais no sistema_mensagens_bloqueios_exclusões.pdf", "Mensagem de “could not reserve record...”: é quando a sessão que se quer salvar uma alteração está\nbloqueada...quando tem uma outra sessão aberta e pendente de ser salva no banco de dados (do mesmo registro). Mensagem “ORA-20000, ORA-00001”"], "793-66": ["Aprovação p/Cálculo de Custos (EPRO28) — problema de configuração, dar o erro, parametro geral", "Situações Gerais no sistema_mensagens_bloqueios_exclusões.pdf", "Mensagem genérica como esta “ORA-06502...numeric or valu error...ORA-01403...” Motivo neste caso:\nQtde de atributos no parametro CATEGORIA foi além da capacidade suportada, e aí passou a dar o erro acima...\n...diminuí as ultimas 2 Categorias, e aí o programa funcionou OK.  \nConclusão: se der este manegem de erro, pode ser problema de configuração de Parametro de Inicialização (ou parametro geral mesmo)."], "793-67": ["Parâmetros de Inicialização (ADMI125) — cordato na tentativa, colocamos o atributo, listar somente materiais", "Situações Gerais no sistema_mensagens_bloqueios_exclusões.pdf", "Em 240522, mensagem “ORA-20000: Erro GERA_MANUFATURA_1TMP_P: ORA-00936: missing expression”...\nOcorrido na implantação da Cordato, na tentativa de Emissão de OF – CFAB7...  \nIdentificado que ocorre quando o parâmetro de Inicialização\nLISTAR_SOMENTE_MATERIAIS_COM_NECESSIDADES_GERADAS está com Atributo = N, então gera esta mensagem acima...\n\nPara resolver: colocamos o atributo com S, e aí gerou o relatório: "], "795-0": ["Exportação Dados de Notas Fiscais - NOTFIS (ADMI104) — salvos os arquivos, notas fiscais notfis, configuração dos diretórios", "Exportação Dados de Notas Fiscais – NOTFIS – ADMI104.pdf", "Exportação Dados de Notas Fiscais – NOTFIS – ADMI104..\n\nVisto na implantação Aniger, em 060423, junto com Ismael...\n\nGeração do arquivo Notfis, após o faturamento de NF de Saída...\n\nNecessário primeiramente fazer a configuração dos diretórios/caminho onde serão salvos os arquivos, aqui neste\nprograma “Transportadoras – ADMI89”...o NOTFIS será gerado no bloco Notas Fiscais, “Diretório Entrada”.\n\nFeito a partir deste programa:\n\nExemplo de Seleção:   Selecionar...\nInformar Data Coleta...\nBotão “Gerar EDI”\nVai gerar mensagem de “...arquivo gerado...” ou algo assim... \nBuscar aqui neste diretório/caminho indicado acima, o arquivo gerado...\n\nGera assim (são de 2 NFs vinculadas neste NOTFIS)...\n\nOb"], "796-5": ["Configuração de Funções (ADMI109) — Pegada_201105311_Pedido_45075_Ticket_5172_Frete_Ocorrencia Assunto do Protocolo", "Frete.pdf", " Pegada_201105311_Pedido_45075_Ticket_5172_Frete_Ocorrencia Assunto do Protocolo:\n“CONSULTA DE NOTAS FISCAIS ADMI97\nTem notas que não exibem as ocorrências na tela, no anexo temos a nota 23835 de 13/03/2019\nestabelecimento 20 onde não mostra as ocorrências na tela, ao analisar os dados de entrega\npelo BI constamos que tem notas no sistema que existem as ocorrencias porem elas não são mostradas na tela.”\n\nExemplo de NF que não tem ocorrências sendo mostradas em tela...\n\n...mas pelas tabelas, sim existem dados de Ocorrências: [Código: FRETE_NFS_ATM FRETE_NFS_OCOREN_ATM]\n\nProvável motivo: configuração de Diretórios de Ocorrências não está correto...\nAqui à direita, o cadastro da Transportadora "], "796-6": ["Configuração de Funções (ADMI109) — Fretes - o que é cada arquivo, resumo e ponto de partida", "Frete.pdf", "E-mail —\n<augusto.lehnen@kunden.com.br>; Camile J. Diesel | Kunden Systems <camile.diesel@kunden.com.br>; Fabiane  \nAparecida Brisch | Kunden Systems <fabiane.brisch@kunden.com.br>; Gabriela Prestes | Kunden Systems\n<gabriela.prestes@kunden.com.br>; Tailine Kunzler | Kunden Systems <tailine.kunzler@kunden.com.br>; Alexis\nRafael Villarroel Ramirez | Kunden Systems <alexis.villarroel@kunden.com.br>; Cesar Wagner | Kunden Systems\n<cesar@kunden.com.br>; Deise Nara Souza | Kunden Systems <deise.nara@kunden.com.br>; Guilherme Noschang |\nKunden Systems <guilherme.noschang@kunden.com.br>; Ismael de Paula | Kunden Systems\n<ismael@kunden.com.br>; Leonardo Souza | Kunden Systems <leonardo@kunden.com.br"], "799-2": ["Conhecimento de Frete (ADMI102) — Ver se conseguimos arrumar ou entender de imediato aquele campo da", "Fretes_Demo_Instruções Gerais.pdf", "Ver se conseguimos arrumar ou entender de imediato aquele campo da\nQTD_UNIDADE_PRODUTO da tabela de FRETE_NFS_ATM que não está sendo preenchido...isso\npara concluir OK o fluxo de controle de Frete utilizando a opção de tabela de Frete por “Unidade\nProduto”. Quem gera a tabela FRETE_NFS_ATM é a geração do NOTFIS, então, é essa geração do\nNOTFIS que precisar ser revisado (ver abaixo mais detalhes em *Situações “pendentes”).\nDetalhes:\n-Utilizamos a lógica de testes de Tabela de Fretes pela “Unidade Produto” para Atta, em\n140726...funcionou, mas tivemos que atualizar manualmente as informações das Unidades na seguinte tabela abaixo:\nTabela FRETE_NFS_ATM Campo QTD_UNIDADE_PRODUTO\nPosição posterio"], "799-4": ["Exportação Dados de Notas Fiscais - NOTFIS (ADMI104) — conemb e doccob, módulo de fretes, notfis dados", "Fretes_Demo_Instruções Gerais.pdf", "Abaixo testes na BD Desenv, Organização de testes de Gustavo...\n\nParâmetro Geral que é necessário revisar antes de iniciar implantação do módulo de Fretes:\nParâmetro Geral 104-APENAS SISTEMA DE FRETE\nEntendo que para todas as empresas que passarem a utilizar o módulo de Fretes, mas já utilizam o\nERP , principalmente nos módulos que envolvem Notas Fiscais Saída, então o atributo tem que ser\n“N” cfe tela abaixo.\nPegada por exemplo tem este atributo, e utiliza o módulo de Fretes.\n\nCaminhos e Permissões:  Uma NF Faturamento:\n\nUma rota cadastrada no programa ADMI90...  \nCadastro de Configurações de Funções no programa ADMI109:\n\nAqui ao fundo Cadastro de Configurações de Funções no programa ADMI10"], "799-5": ["Conhecimento de Frete (ADMI102) — importação de conhecimentos, ctas a pagar, leo o funcionamento", "Fretes_Demo_Instruções Gerais.pdf", "O problema desta diferença ocorrida é que não estava preenchido o campo “Unidade” abaixo...\n\nSendo que os 130,34 foram compostos por:\n24,48 Gris 78,84 Valor inicial 4,82 Pedagio 0,00 Tas 22,20 Valor Base Xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx\n\nDiferença entre CTe e CONEMB\n\nCONEMB: é um arquivo TXT que a transportadora disponibiliza para importar no ERP ...\nÉ pelo CONEMB que gera os dados comparativos de valores, visto acima, ADMI102.\n\nCTe: XML da NF de cobrança da transportadora...\nO CTe (Conhecimento de Transporte Eletrônico) é o documento fiscal oficial exigido pela SEFAZ. O\nCONEMB (Conhecimentos Embarcados) é um arquivo digital (padrão EDI/PROCEDA) gerado a partir\ndo CTe para tran"], "799-7": ["Conhecimento de Frete (ADMI102) — transportadora ou via, tabela de frete, sempre na pessoa", "Fretes_Demo_Instruções Gerais.pdf", "-É feito o “Importar” o CONEMB...\n-Detalhe da Validação abaixo que foi solicitado pela Pegada, para não permitir importar\nCONEMB sem ter feito antes o CTe acima...\n-Se ocorrer o importar do CONEMB sem CTe antes, em algum lugar das tabelas faltará informação...\n-Sendo assim, o “Importar” o CONEMB gera dados já com informações do CTe...  \n-o Importar acima, complementa dados na tabela FRETE_CONHECIMENTO_ATM.\n-E faz gerar os dados no programa “Conhecimento de Frete-ADMI102”, sendo que neste\nprograma podem fazer as comparações de Valores de Frete com base na Tabela de Frete cadastrada.\n-A rotina se incumbe da coluna de “Situação”: Liberado se está dentro das Tolerâncias\nde Valores, e Bloqueado s"], "799-8": ["Importação Documento de Cobrança - DOCCOB (ADMI101) — ctas a pagar, documento de cobrança, doccob gera", "Fretes_Demo_Instruções Gerais.pdf", "É feito o “Importar” o DOCCOB...\n-Importante configurar os parâmetros de inicialização... \n- O importar do DOCCOB gera o FATU3 (sem Fatura Duplicatas) e um Documento de Cobrança\n(esse direto no Ctas a Pagar, sem vínculo com o FATU3).\n-Sendo assim, o registro no FATU3 é mais para Livros Fiscais*.\n- O importar do DOCCOB gera no módulo de Frete:\n-O vínculo do número da Fatura (Documento de Cobrança do Ctas a Pagar) e que\ntambém é o mesmo número do FATU3 (detalhe: quando são vários conhecimentos, então a rotina\ngera esta numeração de Documento de Cobrança do Ctas a Pagar e do FATU3, com o 1º numero de Conhecimento).  \n-O importar dom DOCCOB passará a gerar o número da FATURA no ADMI102:\nAqui pes"], "801-0": ["edi de fretes, notfis conemb xml, entrada e contas", "Procedimento_Operacional_EDI_Fretes_Kunden_ERP_por Guilherme.pdf", "PROCEDIMENTO OPERACIONAL..\nEDI DE FRETES\nConfiguração, cálculo, NOTFIS, CONEMB, XML de CT-e, DOCCOB, nota\nfiscal de entrada e contas a pagar\nObjetivo: Padronizar a implantação, a operação e a sustentação do módulo de fretes, deixando claro o\nque deve ser cadastrado, em que ordem os arquivos devem ser processados, como os cálculos devem ser\nmantidos e quais registros precisam existir ao final de cada etapa.\n\nDocumento Versão Data Classificação\nPOP EDI de Fretes 1.1 15/07/2026 Uso interno / implantação e sustentação Fontes consolidadas\nReunião Fretes • Reunião Fretes - ATTA 14/07/2026 • layouts EDI • testes controlados • procedures Oracle analisadas"], "801-8": ["Importação Documento de Cobrança - DOCCOB (ADMI101) — contas a pagar, xml cte entrada, pular essa etapa", "Procedimento_Operacional_EDI_Fretes_Kunden_ERP_por Guilherme.pdf", "6. Execução operacional ponta a ponta\nEtapa 1 — Preparar e faturar a operação\n1. Criar/finalizar o pedido e emitir a nota fiscal de saída.\n2. Confirmar empresa, unidade, estabelecimento, cliente/destinatário, transportadora, cidades, pesos, volumes e quantidades.\n3. Se a fórmula usar Unidade Produto, confirmar a unidade de medida de negócio e a quantidade esperada antes\nda geração do NOTFIS.\nEtapa 2 — Gerar o NOTFIS\n1. Selecionar as notas elegíveis na rotina de geração/exportação NOTFIS.\n2. Gerar o arquivo na pasta NOTFIS\\SAIDA da transportadora.\n3. Validar remetente, destinatário, CNPJ/CPF, número/série da nota, cidade/UF/IBGE, peso, volumes, valor e transportadora.\n4. Confirmar que a geraç"], "801-12": ["Conhecimento de Frete (ADMI102) — tabela de frete, contas a pagar, usa unidade produto", "Procedimento_Operacional_EDI_Fretes_Kunden_ERP_por Guilherme.pdf", "10. Checklist de homologação 10.1 Infraestrutura\n• ☐ Pastas criadas por transportadora e evento.\n• ☐ Caminhos Windows e servidor validados no ADMI122.\n• ☐ Conta do serviço consegue ler, gravar, renomear e mover arquivos.\n• ☐ BAT gera o .KND correto sem incluir o próprio .KND.\n• ☐ Existe um agendador por transportadora/diretório.\n• ☐ Logs e notificações do job estão configurados.\n10.2 Cadastros e cálculo\n• ☐ Transportadora ativa, CNPJ correto e pastas vinculadas.\n• ☐ Cliente/destinatário com CNPJ ou CPF, cidade, UF, CEP e IBGE corretos.\n• ☐ Regiões contêm todas as cidades utilizadas no teste.\n• ☐ Rota vigente e relacionada à transportadora.\n• ☐ Fórmula e tabela de frete vigentes e sem sobrepo"], "801-13": ["sintoma causa provável, origem destino errada, conhecimento não importado", "Procedimento_Operacional_EDI_Fretes_Kunden_ERP_por Guilherme.pdf", "11. Diagnóstico de falhas\nSintoma Causa provável Ação\nCONEMB com ORA-01722 Campo numérico fora da posição ou preenchido com texto.\nRevalidar layout fixo, tamanho de linha e zeros/espaços.\nKND-003357 50116 = S e XML do conhecimento não importado. Importar XML oficial ou revisar a decisão do parâmetro.\nKND-002823 Valor do DOCCOB difere do valor importado pelo XML.\nComparar total, conhecimento e valores XML.\nKND-000885 Nenhum registro importado após erros anteriores. Corrigir a primeira causa; não tratar essa mensagem isoladamente.\nFatura existe, mas não há nota de entrada\nParâmetro 104, 50004, estabelecimento ou\nconfiguração fiscal bloqueou a etapa. Revisar gates fiscais e logs da procedure.\nN"], "801-16": ["Importação Documento de Cobrança - DOCCOB (ADMI101) — versão instalada, conhecimento xml, edi doccob", "Procedimento_Operacional_EDI_Fretes_Kunden_ERP_por Guilherme.pdf", "14. Inventário técnico de referência\n14.1 Procedures e packages analisados\nObjeto Papel no fluxo\nIMPORTA_CONHECIMENTO_NFS_P Importação CONEMB e geração/vínculo do conhecimento com notas.\nIMPORTA_EDI_DOCCOB_P Importação dos registros DOCCOB, fatura, vínculos e gates fiscal/financeiro.\nGERA_IMPORTACAO_EDI_DOCCOB_P Orquestração/job de importação DOCCOB.\nIMPORTA_CONHECIMENTO_XML_P Leitura e atualização do conhecimento a partir do XML de CT-e.\nGERA_IMP_CONHECIMENTO_XML_P Processamento agendado/lista de XMLs.\nIMPORTA_EDI_NFE_P Importação EDI de nota fiscal relacionada ao ecossistema.\nBUSCA_ROTA_TRANSPORTE_P (spec) Interface de busca de rota e cálculo; body ainda necessário.\nRECALCULA_FRETE_LOG_P O"], "808-2": ["Processamento de Leituras (ADMI144) — controle de rótulo, rotulo lido, visto com roberto", "Coletor_Operação 38 para CONTROLE ROTATIVO DE INVENTARIO RÓTULO.pdf", "Documentação:\nSuprimentos Estoque Lançamentos\nAjuste Divergência Estoque X Inventariado - CRI Detalhamento:\nPrevisto ajuste de divergência de estoque x inventariado para produtos com controle de rótulo.\n\nMarcio, 151220, validação do pedido de serviço acima, que inclusive criou a Operação de Coletor WEB:\nColetor_Operação 38 para CONTROLE ROTATIVO DE INVENTARIO RÓTULO\nAbaixo algumas telas da validação...e abaixo uma particularidade que pode ocorrer, na qual poderia estar sendo lido\nno CRI um rotulo que já tivesse sido “desmanchado” anteriormente...neste caso, cfe solicitado por Roberto, este\nrotulo novamente lido deveria ser considerado como Avulso e não mais como um rótulo. (é isso?)\nSobre es"], "810-0": ["Usuários (ADMI1) — utiliza este cadastro, pedi henrich, william e roberto", "Coletor_Operação Fechamento Corrugada_passo a passo.pdf", "Coletor_Operação Fechamento Corrugada: Controle e apontamento do par a par_e geração de rotulo..\n\nAvaliação feita em 011020, para tentar implantar na Baenamora.\nVisto junto com William e Roberto -Primeiramente necessita:\nPedido de Venda Plano de Produção Após:\nNo programa de Emissão de Etiqueta PEDI7:\nUsuarios HK não chegam a imprimir fisicamente, mas geram um arquivo de dados que é enviado e impresso numa\ngráfica a etiqueta (clicam direto no botão de Imprimir do programa, mas a rotina não chega a imprimir efetivamente,\nsó gera os dados na tabela etiqueta_unidade_produto_atm, onde pode ser visto todas as etiquetas impressas).\nDetalhe desta tabela: vai gravando o ROTULO_ID, depois de lido a e"], "810-2": ["Consulta Estoque Produto (ESTO7) — Quando a corrugada está cheia...(pedido ainda não encerrado)", "Coletor_Operação Fechamento Corrugada_passo a passo.pdf", "Quando a corrugada está cheia...(pedido ainda não encerrado):\n-clicar no botão “Oper”...escolher Oper 13 de “Finalizar Rotulo”...\n*quando finalizar o rotulo, gera um arquivo e imprime automaticamente na impressora (mesmo situação acima da\nnecessidade dos bat para impressão)\n*se precisar reimprimir rotulo, utilizar operação 16, e segue mesmo processo: gera um arquivo e imprime\nautomaticamente na impressora (mesmo esquema acima dos bat para impressão) \n...e ler o rotulo (após escolher Oper 13 de “Finalizar Rotulo” acima):\n\nCfe citado acima, a rotina já imprime automaticamente mais um novo rotulo final, que mostra descrição e qtdes de\nProdutos (com isso temos 2 rotulos para 1 caixa)...\n\nEm test"], "810-4": ["Configuração Diretórios Servidor (ADMI122) — pedidos para encaixotamento, partindo desta configuração, cadastro de usuarios", "Coletor_Operação Fechamento Corrugada_passo a passo.pdf", "Novo Teste da rotina acima em 102020, na BD Desenv: Este passo a passo está bem completo:\n\nCriado Pedido de Venda e Plano de Produção Gerado as etiquetas:  \nVisualizo aqui as etiquetas:\n\nGeram relatório pedidos para encaixotamento \nPARTINDO DESTA CONFIGURAÇÃO DE USUARIO...(lembrar que é necessário este usuario estar liberado na opção\nWEB de cadastro de Usuarios)...\n\nACESSO A APLICAÇÃO...  \nSelecionar a operação 9, no botão Oper\n\nCódigo de barras do Relatório Pedidos para Encaixotamento...\n\nCom isso acima, já gerou o rotulo, e vai imprimir automaticamente\n\nLer o ROTULO que mostra acima e foi impresso\n\nLer as etiquetas\n\nEfetuado a leitura das etiquetas de 1 cx = 12 pares lidos...\n\nClicar no bo"], "811-0": ["Usuários (ADMI1) — utiliza este cadastro, cod de barras, rotulo novo", "Coletor_Operação Fechamento Corrugada_Teste Completo.pdf", "Controle do par_e geração de rotulo..\n= ABAIXO TESTE COMPLETO\n\nAvaliação feita em 011020, para tentar implantar na Baenamora.\nVisto junto com William e Roberto -Primeiramente necessita:\nPedido de Venda Plano de Produção Após:\nNo programa de Emissão de Etiqueta PEDI7:\nUsuarios HK não chegam a imprimir fisicamente, mas geram um arquivo de dados que é impresso na gráfica a\netiqueta (clicam direto no botão de Imprimir do programa, mas a rotina não chega a imprimir efetivamente, só gera\nos dados na tabela etiqueta_unidade_produto_atm, onde pode ser visto todas as etiquetas impressas).\nDetalhe desta tabela: vai gravando o ROTULO_ID, depois de lido a etiqueta no rotulo (passo mais abaixo).\n\nUtiliza"], "811-3": ["Consulta Ordem de Fabricação (CFAB2) — estoque e apontamento, necessidade da baenamora, efetuado um novo", "Coletor_Operação Fechamento Corrugada_Teste Completo.pdf", "Efetuado um novo ciclo acima, para gerar mais 1 rotulo do 1 par restante...mensagem KND-002309 OK:\n\nEstranho: qtde 0 abaixo no 2º rotulo: [Código: ROTULO_ATM PEDIDO_VENDA_ATM]\n\nDe qualquer maneira, com os apontamentos realizados acima, ficou liberado para faturamento...\n\n...e também gerou estoque e Apontamento corretamente:\n\n...mas o problema está aqui: não está mostrando para fazer transferência (que é uma necessidade da Baenamora):   "], "814-2": ["Coletores (ADMI84) — APONTAMENTO OF WEB DO PROCESSO DE EXPEDIÇÃO DE SOLADO", "Coletores – ADMI84.pdf", "Pedido Serviço: 61840 Cliente: Pegada Solicitação:\nAPONTAMENTO OF WEB DO PROCESSO DE EXPEDIÇÃO DE SOLADO\n\n1 - Na página de apontamento de OF traga uma lista de localizações para que o usuário possa selecionar uma delas;\n2 - Permitir o cadastro de localizações por usuários no ADMI84 e uma opção de marcar qual será a localização sugerida no campo;\n3 - Critério da lista de localizações:\n3.1 - Se não tiver nada cadastrado no ADMI84: trazer todas as localizações;\n3.2 - Se tiver uma ou várias localizações cadastradas no ADMI84: trazer somente estas localizações com a localização sugerida.\n4 - Não permitir o apontamento de processos de produtos que tenham controle de rótulo no apontamento de OF\ncas"], "817-0": ["Indicadores (CPRO1) — devolución, calidad, venta es posible", "Capacitación_CEP_Adoc.pdf", "Capacitación Modulo CEP (Control Estadístico de Procesos), en 15/06/2016..\nIntegrantes: Equipo de Adoc, Marcio/Kunden.\n\nVista general de los programas del módulo:\n\nPrograma Indicadores:\nCrear los “Indicadores” calidad. Son los grandes grupos, utilizados para filtros en reportes, y son vinculados a los\nEventos. El tipo son “Producción” (para eventos de calidad que ocurren en la planta de producción) y “Devolución”\n(para eventos de calidad que ocurren a través de devoluciones de clientes – facturas de entradas de devoluciones).\nEn campo “Porcentual” es para definir un porcentual de Meta para el Indicador, y es mostrado y comparado con el\nreal en el reporte.\n\nPrograma Eventos:\nCrear los padrone"], "820-1": ["Classificação do Produto (CPRO2) — indicadores no cep, útil em situações, utilizem esta rotina", "Classificação do Produto – CPRO2.pdf", "\nVerificado em testes na implantação da Smart em 052021, referente a coluna “Controle Indicadores no CEP”, que\nestando marcado para a respectiva Classificação, impacta na seguinte situação:\n\nA rotina faz o Apontamento de Produção (gerando o SKU), faz a entrada ao Estoque desta qtde, e na sequencia já faz\numa saída de estoque automaticamente.\nPode ser útil em situações na qual se quer registrar a produção efetuada (mesmo que de um produto com\nproblemas, como Retalhos na Smart), mas não se quer controlar no estoque estas qtdes (é o caso na Smart).\n(imagino que na Brisa também utilizem esta rotina) Exemplo:\n\nAqui configurado o cadastro do programa de Apontamento, com a Classificação 3...\n\nClass"], "822-2": ["Lançamentos - Produção (CPRO4) — exemplo criado, cep, devolução", "Devolução de Vendas.pdf", "Exemplo criado em 15062016, por Gabriel, para apresentação para Adoc, BD Desenvolvimento:\n\nFaturamento:  Devolução com evento:\n\nDevolução:\n\nCep:    Relatório cep:"], "822-3": ["Indicadores (CPRO1) — NOTA FISCAL DE SAÍDA - CRIAR UMA TRAVA DE CANCELAMENTO E ESTORNO DE NF QUE EXIJA UMA…", "Devolução de Vendas.pdf", "Pedido Serviço: 60110 Cliente: Frigolaste Solicitação:\nNOTA FISCAL DE SAÍDA - CRIAR UMA TRAVA DE CANCELAMENTO E ESTORNO DE NF QUE EXIJA UMA AUTORIZAÇÃO Rotina:\n\nVendas e Distribuição Faturamento Notas Fiscais\nNota Fiscal de Saída Alteração:\n\nCriar uma trava de cancelamento e estorno de NF que exija uma autorização.\n\nDocumentação:\n\n4503 | Cancelamento necessita de autorização.\n4504 | Estorno necessita de autorização.\n\nVendas e Distribuição Faturamento Notas Fiscais Notas\nNotas Fiscais de Saída Parâmetro Inicialização:\nAUTORIZADO_CANCELAR_ESTORNAR | DEFINE SE É PERMITIDO CANCELAR/ESTORNAR NOTA FISCAL DE SAÍDA.\nEXIGE_EVENTO_CANCELAMENTO_ESTORNO | DEFINE SE EXIGE A INFORMAÇÃO DE EVENTO PARA\nCANC"], "823-0": ["Eventos (CPRO3) — NOTA FISCAL DE SAÍDA - CRIAR UMA TRAVA DE CANCELAMENTO E ESTORNO DE NF QUE EXIJA UMA…", "Eventos – CPRO3.pdf", "Eventos – CPRO3..\n\nPedido Serviço: 60110 Cliente: Frigolaste Solicitação:\nNOTA FISCAL DE SAÍDA - CRIAR UMA TRAVA DE CANCELAMENTO E ESTORNO DE NF QUE EXIJA UMA AUTORIZAÇÃO Rotina:\n\nVendas e Distribuição Faturamento Notas Fiscais\nNota Fiscal de Saída Alteração:\n\nCriar uma trava de cancelamento e estorno de NF que exija uma autorização.\n\nDocumentação:\n\n4503 | Cancelamento necessita de autorização.\n4504 | Estorno necessita de autorização.\n\nVendas e Distribuição Faturamento Notas Fiscais Notas\nNotas Fiscais de Saída Parâmetro Inicialização:\nAUTORIZADO_CANCELAR_ESTORNAR | DEFINE SE É PERMITIDO CANCELAR/ESTORNAR NOTA FISCAL DE SAÍDA.\nEXIGE_EVENTO_CANCELAMENTO_ESTORNO | DEFINE SE EXIGE A INFORMAÇÃO "], "830-2": ["Relatório de Devoluções de Venda (CPRO17) — CLIENTE SOLICITA A GERAÇÃO EM EXCEL DO RELATÓRIO DE DEVOLUÇÕES DE VENDA - CPRO17 +…", "Relatório de Devoluções de Venda - CPRO17.pdf", "Pedido Serviço: 58593 Cliente: Frigolaste Solicitação:\nCLIENTE SOLICITA A GERAÇÃO EM EXCEL DO RELATÓRIO DE DEVOLUÇÕES DE VENDA - CPRO17 + INCLUSÃO DE FILTRO.\n\nRotina:\n\nManufatura\nControle Estatístico de Processos Relatórios\nRelatório de Devoluções de Venda Alteração:\n\n- Cliente solicita a geração em excel do relatório de Devoluções de venda(CPRO17), incluir filtro de nota fiscal e\ntambém ao gerar em PDF e/ou Excel trazer as informações da nota fiscal(número), nome do cliente e totalizador.\n\nDocumentação:\nManufatura\nControle Estatístico de Processos Relatórios\nRelatório de Devoluções de Venda Detalhamento:\nFoi criado o relatório em Excel.\nFoi adicionado a opção de gerar o relatório por Excel "], "833-1": ["Gera Nota Fiscal Ordem de Transferência (MIND16) — INTEGRAÇÃO NOTAS FISCAIS COM MANUTENÇÃO INDUSTRIAL", "Gera Nota Fiscal Ordem de Transferência – MIND16.pdf", "Pedido Serviço: 1162 Cliente: HK Solicitação:\nINTEGRAÇÃO NOTAS FISCAIS COM MANUTENÇÃO INDUSTRIAL\nIntegrar emissão e devoluções de equipamentos com manutenção industrial.\nLocalização do equipamento.\n\nAtualmente o processo é todo manual.\n\nDocumentação:\nMáquinas/Acessório\n- foram retirados alguns campos desnecessários.\n\nVínculo Situação/Operação Faturamento Recebimento MIND14\n- programa novo utilizado para criar o vinculo entre a situação da manutenção industrial com operações de\nfaturamento/recebimento, quando for feito os lctos de notas será necessário este vinculo para gerar a localização da máquina.\n\nTransferência Interna MIND11\n- programa utilizado para gerar as transferência interna entre"], "835-0": ["Tipos de Equipamento (MIND1) — campos: Código Patrimonial, Categoria, Componente, Manutenção", "Manutenção Industrial_tutorial para Brazservice.pdf", "Manutenção Industrial (documento enviado à Brazservice em 06/2012)..\nSegue fluxo dos cadastros a serem efetuados.\nO caminho dos programas no menu do sistema é de acordo como mostra nas telas de exemplo abaixo.\nOs exemplos das telas abaixo estão na sua Base de Dados e podem consultar diretamente no sistema e utilizar como base.\n\n1= Programa Maquinas e Acessórios:\nCadastrar as famílias de maquinas. No exemplo abaixo: “Fulões” e “Divisoras”.\n\nAbaixo destas famílias, cadastrar as maquina. No exemplo abaixo: “DIVISORA HIDRAÚLICA RIZZI”.\n\nImportante: na pasta “Ficha Técnica” no campo Código Patrimonial, vincular o código do cadastro do Controle\nPatrimonial da respectiva maquina. No cadastro do Con"], "836-0": ["Agendador de Tarefas (ADMI63) — gerar a data, manutenção preventiva, agendador de tarefas", "Manutenção Preventiva, teste do cadastro inicial da Manut Preventiva.pdf", "Manutenção Preventiva, teste do cadastro inicial da Manut Preventiva numa maquina..\n-Testes para a implantação na Aniger.\n-Teste abaixo iniciado a ser feito em 020123, e configurado Agendador de Tarefas para gerar em 030123 (no dia\nposterior, e analisar como se comporta a geração de OSs de Manutenção Preventiva (revisado em 030123).\n-Importante para o abaixo, e para o funcionamento da rotina de Manutenção Preventiva:\nAgendador de Tarefas foi configurado para rodar 1 X ao dia (acho que não precisa mais), configurar\npreferencialmente de madrugada, nas 1ªs horas do dia:\n\nPartindo desta maquina e com esta Configuração...\nNeste caso, coloquei como data “Ultima” = 101222, ou seja, uma data no “pas"], "836-1": ["Agendador de Tarefas (ADMI63) — data da proxima, manutenção preventiva, qualquer maneira vou", "Manutenção Preventiva, teste do cadastro inicial da Manut Preventiva.pdf", "Mais abaixo tem outro exemplo de encerramento de OS e detalhes de como passa a gerar as datas (semelhante ao teste desta maquina). \nNovo teste: num novo cadastro de maquina, coloquei a data da “Próxima” no dia de amanhã (sem informar data “Ultima”)...  \nAtivei o Agendador: rodou no dia de hoje 020123...\n\nE no momento não gerou nada...(parece ser OK, porque a data da PROXIMA é amanhã 030123)...  \nVer no dia de amanhã 030123, se o Agendador vai gerar a OS de Manutenção Preventiva\n\nPosição em 030123 desta maquina 94949.1: cfe previsto acima, o Agendador sim gerou a OS de Manutenção\nPreventiva...veja abaixo OS 298382...\n...e com isso no relatório MIND7 passa a mostrar 2 linhas de registro (agora"], "838-2": ["Máquinas/Acessórios (MIND2) — conseguiu, cali, encontrei", "Manutenção Preventiva.pdf", "TESTES efetuados por Cali, em 02/2018, para um RA 171117003 da Krumenauer de 12/2017:\n\nConseguiu gerar OS aqui...  \n...e encontrei posteriormente esta documentação:"], "838-7": ["Máquinas/Acessórios (MIND2) — sobre a questão do Manutenção Preventiva, para usar no Krumenauer (tela abaixo)", "Manutenção Preventiva.pdf", "E-mail — Assunto: sobre a questão do Manutenção Preventiva, para usar no Krumenauer (tela abaixo).\n\nDias atrás, Cali tava as voltas com o protocolo abaixo nos consultando (ao Roberto) sobre a questão do Manutenção\nPreventiva, para usar no Krumenauer (tela abaixo).\n\nO que eu sei:\nOS de manutenção preventiva deixou de funcionar a partir de um momento que se fez uma alteração na\nManutenção, para atender a uma outra questão, a um outro cliente...não me lembro bem para que, ou para qual\ndesenvolvimento...mas era um assunto que na época tínhamos conhecimento, eu e você.\n\nAcho que foi na época para o cliente Minuano, para fazer entrar no ar o programa MIND27.\n\nEstou lembrado que, anos atrás, a roti"], "838-8": ["Agendador de Tarefas (ADMI63) — cadastro da maquina, agendador de tarefas, manutenção preventiva", "Manutenção Preventiva.pdf", "Testes da Manutenção Preventiva, feitas em 28/07/21, para possível treinamento de usuários da Frigolaste*:\nfuncionou a geração de OS de Manutenção Preventiva (há apenas uma questão num relatório de Custos de\nManutenção citado mais abaixo)...fluxo efetuado:\n\n-criei novos registros de “Componentes” vinculados à maquina (até porque segundo usuários da Frigolaste, vão\nquerer vincular mais de 1 Plano de Manutenção por maquina, com diferentes intervalos/frequência de\nmanutenção...então segundo eu entendo e como era na V3, usava-se a opção de criar “componentes” abaixo do cadastro da maquina).\nNo teste abaixo, a data do campo “Próxima”, é a data atual deste teste, é a mesma data que vai rodar, hoje"], "838-9": ["Tipos de Equipamento (MIND1) — próxima manutenção, rotina que fiz, reabrir o sistema", "Manutenção Preventiva.pdf", "...registrar aqui os materiais utilizados...\n(cfe mais abaixo: esta rotina que fiz, gerou a Req Informada, mas sem vinculo com a OS 5665...e fez o consumo do\nestoque). A rotina faz isso quando é feito o “encerramento” da OS...\n...e ao Reabrir da OS: pelos testes feitos em 120821: quando Reabrir, o sistema faz uma “Devolução” da Requisição\nde material...sendo que se encerrar de novo, faz nova Requisição. \n...e por final fazer o Encerramento desta OS aqui...\n(depois de Encerrado a OS, fica possível Reabrir, cfe tela abaixo)...\n\n...também: veja que a partir do programa acima MIND22, gera um relatório por OS...\nDetalhe: acho que está gerando desconfigurado, misturando dados e campos, e não traz "], "838-15": ["Controle - Ordens de Serviço (MIND22) — utilizam uma empresa, tecnico em alguma, roberto para frigolaste", "Manutenção Preventiva.pdf", "Situação vista em 020822, numa avaliação junto com Roberto para Frigolaste, que envolve Manutenção Preventiva,\nna qual utilizam uma empresa Terceirizada para fazer esta manutençã  no FATU2)...(a não ser que foi “perdida” uma parte do\nDesenvolvimento, porque olhando a documentação acima, não fica claro se a rotina deveria sugerir o campo\n“Situação” no MIND15 ou FATU2, a partir de ter no MIND14).\n\n(então, eu entendo que este programa MIND14 no momento só tem a função da rotina identificar que é necessário\nabrir a aba “Manutenção Industrial” no FA"], "855-19": ["Programas (ADMI6) — Programa Emissão de OF-CFAB7/Relatório CFAB176: criar versão de impressão WEB através da…", "Publisher.pdf", "Pedido Serviço: 66211\nCliente: Kunden / VPS Solicitação:\nPrograma Emissão de OF-CFAB7/Relatório CFAB176: criar versão de impressão WEB através da aplicação Publisher,\ncom base no programa e no report citado.\n\nDocumentação:\nKunden - Publisher Detalhamento:\nCriada forma de geração de relatórios Publisher utilizando as rotinas já presentes no ERP.\n\nObservação:\nNome do relatório criado: Emissão Ordem de Fabricação "], "856-2": ["Gerar Remessa para Embarque (CEXT18) — campos: Informações Complementares/Textos, Itens Pedido, Gerar Packing, Packing List,…", "Comex_Curtumes.pdf", "Programa Processo de Exportação, CEXT84  \nProcesso é para gerar a documentação (Invoice, Packing List, etc...) e gerar a NF de faturamento, além de demais\nfuncionalidade como RE (Registro Exportação, etc...).\n\nComo criar uma novo Processo:\nNormalmente utilizam um padrão por cliente e usam o F6 e depois F4, para sempre fazer uma cópia de um processo\njá existente, que tem determinado padrão (do mesmo clientes normalmente).\nNro do Processo: configurável se automático ou manual. Curtumes usam nro manualmente informado: Ano + sequencia.\n\nTestamos com o processo 2017/160, na BD Teste Amcm Interna.\n\nNo bloco “Dados Gerais”:\nCotação: vem sugerido da cotação do dia.\nTem o campo “Informações Complemen"], "856-3": ["Processo Exportação (CEXT84) — Programa de Faturamento", "Comex_Curtumes.pdf", "Programa de Faturamento:\nCEXT85\nInforma a operação de faturamento.\nClicar no ção “LIBERADO_EMISSAO_NFE”: Ao consultar pelo CNPJ do cliente, são exibidos todos os pedidos vinculados ao CNPJ informado: Pedido faturado: NF gerada e emitida: A mesma possui 4 parcelas: Selecionado “Envio de Duplicatas”: Selecionado os registros referentes a NF 962107, e enviado: Selecionando “Itens Enviados”, é possível visualizar que o envio foi efetuado corretamente: Pesquisando pelo número da NF, é filtrado somente por ela: Aplicação possui também a "]}};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const byFrom = {};
for (const r of D.rules) (byFrom[r[0]] ||= []).push(r);
const name = c => D.names[c] ? `${esc(D.names[c])}` : '';
$('#info').textContent = `Baskets = ${D.unit}s (${D.baskets}). ${D.rules.length} rules. ` +
  `Recommendations combine the rules of every item you enter: an item suggested by several of them ranks higher.`;
$('#all').innerHTML = Object.keys(byFrom).sort().map(i => `<option value="${i}">${D.names[i] || ''}</option>`).join('');

function parse() { return [...new Set($('#items').value.toUpperCase().split(/[\s,;]+/).filter(Boolean))]; }

function recommend() {
  const inputs = parse(), minDocs = +$('#mindocs').value || 1, minLift = +$('#minlift').value || 1;
  const cross = $('#scope').value === 'cross';
  $('#picked').innerHTML = inputs.map(i => `<span class="chip" title="${esc(D.names[i] || '')}">${esc(i)}${D.items[i] ? ` · ${D.items[i][0]} baskets` : ' · not found'}</span>`).join('');
  if (!inputs.length) return overview();
  const cand = {};
  for (const x of inputs) for (const r of byFrom[x] || []) {
    const [, y, tog, docs, conf, lift, isCross, ev] = r;
    if (inputs.includes(y) || docs < minDocs || lift < minLift || (cross && !isCross)) continue;
    const c = cand[y] ||= {y, miss: 1, via: []};
    c.miss *= (1 - conf);                       // noisy-OR of the confidences
    c.via.push({x, tog, docs, conf, lift, isCross, ev});
  }
  const list = Object.values(cand).map(c => ({...c, score: 1 - c.miss})).sort((a, b) => b.score - a.score);
  const unknown = inputs.filter(i => !byFrom[i]);
  let html = unknown.length ? `<p class="muted">No rules for: ${unknown.map(esc).join(', ')} (too rare in the documents, or not a known code).</p>` : '';
  if (!list.length) { $('#result').innerHTML = html + '<div class="empty">No recommendation with these filters.</div>'; return; }
  html += `<h2>${list.length} items to check</h2><div class="wrap"><table><thead><tr>
    <th>Item</th><th>Strength</th><th>Because of</th><th class="num">Together</th><th class="num">Docs</th><th class="num">Conf.</th><th class="num">Lift</th></tr></thead><tbody>`;
  for (const c of list) {
    c.via.sort((a, b) => b.conf - a.conf);
    const v = c.via[0];
    const isCross = c.via.some(z => z.isCross);
    html += `<tr><td><span class="code">${esc(c.y)}</span>${isCross ? '<span class="tag">other module</span>' : ''}<br><span class="muted">${name(c.y)}</span></td>
      <td><div class="bar" title="${Math.round(c.score*100)}%"><i style="width:${Math.round(c.score*100)}%"></i></div>${Math.round(c.score*100)}%</td>
      <td>${c.via.map(z => `<span class="code">${esc(z.x)}</span> <span class="muted">(${Math.round(z.conf*100)}%)</span>`).join('<br>')}
        <details><summary>show evidence</summary>${c.via.map(z => z.ev.map(id => evidence(id, [z.x, c.y])).join('')).join('')}</details></td>
      <td class="num">${v.tog}</td><td class="num">${v.docs}</td><td class="num">${v.conf.toFixed(2)}</td><td class="num">${v.lift.toFixed(1)}</td></tr>`;
  }
  $('#result').innerHTML = html + '</tbody></table></div>';
}

function evidence(id, codes) {
  const c = D.chunks[id]; if (!c) return '';
  let text = esc(c[2]);
  for (const k of codes) text = text.replaceAll(k, `<mark>${k}</mark>`);
  return `<div class="ev"><b>${esc(id)}</b> · ${esc(c[0])}<br><span class="muted">${esc(c[1])}</span><pre>${text}</pre></div>`;
}

function overview() {
  const minDocs = +$('#mindocs').value || 1, minLift = +$('#minlift').value || 1, cross = $('#scope').value === 'cross';
  const top = D.rules.filter(r => r[3] >= minDocs && r[5] >= minLift && (!cross || r[6])).slice(0, 60);
  $('#result').innerHTML = `<h2>Strongest rules</h2><p class="muted">Type a program above to see what to check when it changes. Click a code to use it.</p>
    <div class="wrap"><table><thead><tr><th>If this appears</th><th>then also</th><th class="num">Together</th><th class="num">Docs</th><th class="num">Conf.</th><th class="num">Lift</th></tr></thead><tbody>
    ${top.map(r => `<tr><td><button class="chip" data-add="${r[0]}">${r[0]}</button> <span class="muted">${name(r[0])}</span></td>
      <td><button class="chip${r[6] ? ' cross' : ''}" data-add="${r[1]}">${r[1]}</button> <span class="muted">${name(r[1])}</span></td>
      <td class="num">${r[2]}</td><td class="num">${r[3]}</td><td class="num">${r[4].toFixed(2)}</td><td class="num">${r[5].toFixed(1)}</td></tr>`).join('')}
    </tbody></table></div>`;
}
document.addEventListener('click', e => {
  const a = e.target.dataset && e.target.dataset.add;
  if (a) { $('#items').value = a; recommend(); window.scrollTo(0, 0); }
});
$('#go').onclick = recommend;
$('#items').addEventListener('keydown', e => { if (e.key === 'Enter') recommend(); });
for (const id of ['#mindocs', '#minlift', '#scope']) $(id).addEventListener('change', recommend);
overview();
</script>
