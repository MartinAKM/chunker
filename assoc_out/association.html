<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Program associations</title>
<style>
  :root{--ink:#1d2433;--muted:#5d6678;--line:#d6dbe4;--paper:#f7f8fa;--panel:#fff;--focus:#2f5fd0;--cross:#8a5a00}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 system-ui,"Segoe UI",sans-serif;color:var(--ink);background:var(--paper)}
  header{padding:14px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
  h1{font-size:17px;margin:0 0 4px}
  .muted{color:var(--muted)}
  main{max-width:1100px;margin:0 auto;padding:18px 20px 60px}
  .controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:end;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
  label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
  input,select,button{font:inherit;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 10px;background:#fff}
  #items{min-width:320px}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
  .chip{font:12px ui-monospace,Consolas,monospace;border:1px solid var(--line);border-radius:4px;padding:2px 7px;background:#fff;cursor:pointer}
  .chip.cross{border-color:var(--cross);color:var(--cross)}
  table{border-collapse:collapse;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
  th,td{text-align:left;padding:7px 10px;border-top:1px solid var(--line);vertical-align:top}
  th{background:var(--paper);font-weight:600;font-size:12px;color:var(--muted);border-top:0}
  td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .code{font-family:ui-monospace,Consolas,monospace;font-weight:600}
  .bar{height:6px;background:var(--line);border-radius:3px;min-width:60px}
  .bar i{display:block;height:100%;background:var(--focus);border-radius:3px}
  .tag{font-size:11px;color:var(--cross);border:1px solid var(--cross);border-radius:3px;padding:0 4px;margin-left:4px}
  details{margin-top:4px}
  summary{cursor:pointer;color:var(--focus);font-size:12px}
  .ev{border-left:3px solid var(--line);padding:4px 10px;margin:6px 0}
  .ev pre{white-space:pre-wrap;font:12px/1.5 ui-monospace,Consolas,monospace;margin:4px 0 0;max-height:220px;overflow:auto}
  mark{background:#ffe38a}
  h2{font-size:15px;margin:22px 0 8px}
  .empty{padding:20px;color:var(--muted)}
  .wrap{overflow-x:auto}
</style>
</head>
<body>
<header>
  <h1>Program associations</h1>
  <div class="muted" id="info"></div>
</header>
<main>
  <div class="controls">
    <label>Programs or messages changed (separate with spaces or commas)
      <input id="items" list="all" placeholder="e.g. PEDI4 FATU61" autocomplete="off">
      <datalist id="all"></datalist>
    </label>
    <label>Min. documents <input id="mindocs" type="number" min="1" value="2" style="width:80px"></label>
    <label>Min. lift <input id="minlift" type="number" min="1" step="0.5" value="2" style="width:80px"></label>
    <label>Show <select id="scope"><option value="all">all recommendations</option><option value="cross">other modules only</option></select></label>
    <button id="go">Recommend</button>
  </div>
  <div class="chips" id="picked"></div>
  <section id="result"></section>
</main>

é Faturamento.pdf", "1. Abrir o programa Estruturação de Produto-EPRO15 1.1. Abrir a estrutura da árvore, encontrar e posicionar-se no produto do nível pai ao qual se deseja criar um produto.\n1.1.1. A ferramenta desta busca para encontrar o nível pai pode ser através das seguintes 3 opções a partir de ter aberto o programa:\n1.1.1.1. Tecle F7 para entrar em modo “Entrar Consulta” e limpar a tela do programa permitindo consulta, posicionar-se no campo Descrição, informar a descrição do nível pai desejado.\n\nInformar a descrição completa, ou informar a descrição parcial sendo que neste caso deverá ser utilizado o sinal de ao início e ao final de cada parcial da descrição informada, que representará o início, a inter"], "0-1": ["Pessoas Físicas/Jurídicas (ADMI34) — campos: Empresa, Unidade Negócio, Nome, Cidade, CNPJ", "Documentação IA_Cadastro de Produto até Faturamento.pdf", "2. Abrir o programa Pessoas Físicas/Jurídicas-ADMI34 2.1. Posicionar-se no campo Empresa. Tendo a informação do código da Empresa, informar diretamente o código da Empresa desejada.\nCaso contrário, tecle F9 ou clique no botão Lista para abrir a lista de valores do campo.\n\nLocalizar a Empresa desejada, e efetuar 2 clics sobre esta Empresa ou clique no botão OK, que fechará a lista de valores e voltará à tela inicial do programa Estruturação de Produto-EPRO15 com a Empresa selecionada.\n2.2. Posicionar-se no campo Unidade Negócio. Tendo a informação do código da Unidade Negócio, informar diretamente o código da Unidade Negócio desejada.\nCaso contrário, tecle F9 ou clique no botão Lista para abr"], "0-3": ["Liberação Pedidos Faturamento (PEDI4) — campos: Liberação, Entrega, Liberar, Operação, Faturar", "Documentação IA_Cadastro de Produto até Faturamento.pdf", "4. Abrir o programa Pedido Venda-PEDI4 4.1. Posicionar-se no campo Pedido e informar o Pedido. 4.2. Navegue para a aba Liberação. 4.3. Na sub aba Entrega: selecionar a(s) Entrega(s) que deverão ter realizada a liberação, clicando no(s) respectivo(s) check box da direita da tela.\n\n4.4. Clique no botão Liberar. 4.5. Navegue para a aba Liberação. 4.6. Posicionar-se no campo Operação. Tecle F9 ou clique no botão Lista para abrir a lista de valores do campo. Localizar a Operação desejada, e efetuar 2 clics sobre esta Operação ou clique no botão OK.\n4.7. Clique no botão Faturar. Neste momento será gerada e aberta a tela do programa Nota Fiscal de Saída-FATU2.\n4.8. Navegar para a aba Volume, posici"], "2-0": ["Plano Abastecimento Materiais e Controle de Ordem de Fabricação (ESTO112) — nfs de entrada, quantidade secundária, peso dos animais", "Documentação frigorificos.docx", "Frigorífico recebe suínos de produtores rurais e de cooperativas .\nAs NF são lançadas manualmente, mas poderiam muito bem serem recebimentos de pedidos de compra.\nNas NF de entrada, quando lançado de produtor rural que não possui NF eletrônica, consta apenas um item que na operação movimenta apenas estoque. Quando lançado de cooperativa ou de produtor que emite NF eletrônica, deve ter dois itens na NF, uma com o item da NF que está recebendo, a operação deve controlar entradas, livros, etc , mas não controla o estoque, e o segundo item utiliza uma operação que só controla estoque e não controla outros registros de entrada.\n\nNa NF de entrada, é informado a marca dos animais(suínos) , assim co"], "2-3": ["Analise de Abate Frigorifico - 33443 (CFAB101) — contra nota, itens são exibidos, relatório de análise", "Documentação frigorificos.docx", "No RECE50 também é possível gerar a contra nota , veja que o item de cozido, já exibe a quantidade de quebra .\nNos itens, são exibidos as condenas que na configuração de eventos contra nota, é pago um percentual pela condena.\n\nJá os produtos de graxaria ou que não são pagos nada para o produtor, essas condenas são exibidas nas observações da contra nota.\n\nPara produtores que emitem NF eletrônica, deve ser gerad o o relatório de diferenças no próprio RECE50.\nEste relatório compara os dados que seria dos itens da contra nota em relação ao item que apenas movimenta financeiro . Essa diferença deve ser base para NF complementar ou de devolução.\nNo exemplo abaixo, seria uma NF de devolução com 12"], "3-0": ["Registro Controle Produção e Estoque (ESTO19) — TESTE CONSIGNAÇÃO", "Rotina Consignação.pdf", "TESTE CONSIGNAÇÃO –\nUsaremos o produto 306876 que não tem movimentações:\n\nImplanto saldo:\nCom o saldo na localização vou criar rótulos através do ESTO89:\n\nVamos agora usar o programa ESTO23:\nRótulos estão na localização 166:\n\nCom os rótulos na localização correta vamos criar um pedido de venda:\n\nComo nestes casos estamos selecionando os rótulos da localização de consignados, teríamos que saber quais que\nsão, ou fazer a transferências diretamente do saldo avulso para ser mais simples a identificação do saldo ao selecionar no pedido.\nE para conseguirmos fazer isso será necessário adicionar a localização nos seus respectivos centros de distribuição, conforme fiz aqui:\n\nApós isso vamos ao progra"], "5-0": ["Bases de Rateio por Centro de Custos (CONT40) — contabilizar, relatório do item, geração das tarifas", "Rotina Custeio e Conferencias Pós Custeio Kunden.docx", "1° - Contabilizar estoque, notas de entrada , CPV, notas de saída e financeiro, realizar ajustes e conciliações.\n2° - No programa CUST20, informar o período e fazer uma primeira verificação de tarifas, caso apresente LOGs , deverão ser analisados e corrigidos antes do próximo passo. \n3° - Gerar relatório Publisher para verificação dos tempos trabalhados de todos setores que tiveram apontamento de produção: \n4° - Cadastrar tempos do relatório do item 3 no programa CONT40 nos seus devidos Centro de Custo. \nSugestão: informar 0,00 nos centos de custo que não tiveram apontamento no mês, isso facilita encontrar possíveis diferenças no fechamento.\n5° - Copiar/Criar Tarifas de Mão de Obra e GGF no "], "6-0": ["Gera (CONT59) — geração das tarifas, centros de custo, ste", "Rotina Custeio Kunden.docx", "O proces so de custeio da Kunden toma como base as o rdens de fabricação . Cada ordem de fabricação vai ter seu custo de materiai s, mão de obra , gasto gerais de fabricação e terceirizações . Durante o mês a ordem de fabricação s ó car rega t empos, materia i s e terceiros . Os demais gastos devem ser agregados pela rotina de custeio . Para agregar estes cu sto s , deve -se gerar uma tarifa de cu sto minuto para depois atualizar rodando o r ecalculo de custeio . A ro tina de recalculo va i atualizar o cu sto das ordens de fabricação e também os registros de inventario. Por este motivo é muito importante que inicie o proce s so de cu ste i o depois que toda a contabilidad e do mês esteja con"], "6-1": ["Lançamentos Contábeis (CONT12) — conciliação do custeio, ste, sistema irá atualizar", "Rotina Custeio Kunden.docx", "Isto não pode ser completamente detectado antes da primeira geração de bases de rateio e tarifas, pois o rateio não havia sido executado ainda. Atualização das tarifas. Uma vez rodada a rotina acima, o sistema irá atualizar os valores das novas tarifas no cadastro de tarifas. Tanto para mão de obra, quanto para GGF.  Recálculo do Custeio. Nesta fase do processo, as OF’s com movimentos no mês terão seus movimentos do mês em questão atualizados. Ele irá atualizar Materiais pelo custo médio correto, MOD e GGF pelas tarifas acima geradas. O valor de terceiros não mudará devido a alocação direta por valores da nota de retorno de terceirização. Também serão atualizados os custos de entrada no esto"], "7-0": ["Plano Abastecimento Materiais (ESTO25) — ESSA É A ROTINA CERTO DE GERAÇÃO DO FCI ATRAVES DO esto71 BASE DESENVOVLIMENTO", "teste_69828.docx", "ESSA É A ROTINA CERTO DE GERAÇÃO DO FCI ATRAVES DO esto71 BASE DESENVOVLIMENTO\nUTILIZO O PROGRAMA ESTO25 PARA FAZER A TRASFERÊNCIA DE PRODUÇÃO, INFORMO UM PLANO, INSIRO SALDO POR IMPLANTAÇÃO NOS ITENS QUE NÃO TEM ESTOQUE, E SELECIONO \nAQUI, VOU TRANSFERIR OS MATERIAIS DA LOCALIÇÃO 9938 PARA A 5116 QUE É DE OUTRO ESTABELECIMENTO: \nMOVIMENTO GERADO, ENTÃO AGORA, ELE VAI ESTAR POSICIONADO NO PROGRAMA ESTO71 PARA GERAR A NOTA: \nNO PROGRAMA ESTO71, FILTREI O DESTINO, E VOU INFORMAR A OPERAÇÃO QUE SERÁ UTILIZADA NA NOTA: \nUTILIZO A OPERAÇÃO 151.1 QUE É DE TRANSFERÊNCIA, RETIRANDO O SALDO DE DISPONIVEL PARA O EM TRÂNSITO QUANDO A NOTA FOR CONFIRMADA: \nNOTA FOI GERADA, E O ITEM EM DESTAQUE COM UM QU"], "9-0": ["Transferência entre Localização - Estab (ESTO23) — estoque na localização, transferir as qtdes, sequência é utilizado", "CONSIGNAÇÃO, Passo a Passo.pdf", "CONSIGNAÇÃO, Passo a Passo (este .docx disponibilizado por Guilherme em 160526, porém elaborado em 2022)\nEste passo a passo criado em resposta ao RA 260514017:\nhttps://kundencloud.com.br:3825/atendimento?id=260514017&callType=customer\nImportante: atentar-se às configurações das Operações, às Classes de Operações a serem vinculadas.\nAbaixo exemplo de um Produto, com saldo em Estoque, na Localização padrão dos Produtos Prontos...\n\n-Na sequência, é utilizado o programa “Transferência Localização-ESTO23”, para transferir as qtdes que serão\nenviadas na Remessa de Consignação.\n-É utilizado o controle de uma Localização diferenciada, para facilitar o controle das qtdes enviadas e em saldo “em consi"], "9-1": ["Posição do Plano de Produção (CFAB24) — efetua a efetiva, remessa oper, configuração da operação", "CONSIGNAÇÃO, Passo a Passo.pdf", "Fazer o retorno, com o lançamento da NF Entrada, através do programa “Recebimento Devoluções de Consignação-FATU6”: \nNFE gerada e confirmada:\n\nOperação utilizada na NF Entrada acima: 919 (neste caso foi efetivamente vendido (neste caso a NF Entrada\nserá com a Operação 919)):\nImportante: A Classe Operação desta operação deve ser “Retorno Consignação”: \n\nQuando o controle da NF entrada é confirmado o saldo em consignação atualiza para o estoque disponível:\n\nAgora, criar um novo pedido para selecionar o saldo que o “Cliente” efetivamente vendeu e retornou para o faturamento final:\nTipo de Entrega = Pronta Entrega / Reserva Estoque (o Estoque ficará reservado a tal Pedido Venda)  \nE para faturar"], "10-0": ["Condições de Pagamento (ADMI19) — Estruturação de produto", "Labelli.docx", "Estruturação de produto \nOs produtos acabados estão separados pelas marcas que eles produzem. A estrutura da pegada est á desta maneira e deve continuar assim, para a integração funcionar corretamente. Os processos estão cadastrados a nivel de linha . Pedidos são integrados pela integração. Pedidos\nA grande maioria dos pedidos atualmente do cliente Labelli são da Pegada, com isso foi criado uma integração para tais pedidos. Seguem padrões que precisam ser mantidos para não causarem erros: O campo código referência sempre tem que ser o mesmo que o integrado pela API: \nEntão quando for criado um produto novo no lado da Labelli está informação deve ser colocada, se não apresentaram mensagem de "], "10-1": ["Ocorrências de Tarefas (ADMI171) — cintos, venda interface api, inserir os materiais", "Labelli.docx", "Após estas validações, o pedido sendo pronta entrega, ele vai validar o estoque, que por obvio, irá verificar se tem estoque para fazer a reserva. Programas que podem ser utilizados para consultar os pedidos integrados : PEDI83: \nNeste programa é possivel ver os pedidos que foram liberados pela pegada e os que foram integrados na Labelli. Na aba “Data Envio”, é a data que o pedido saiu da pegada. Na aba “Data processamento” é a data que o pedido integrou no lado da Labelli . Os erros explicados acima, serão apresentados no programa ADMI171, O job que faz a integração e o PROCESSA PEDIDOS DE VENDA - INTERFACE API JB. Para encontrar os JOB deve ser usado a palavra %PROCESSA%:  Planos de produç"], "11-0": ["Pessoas Físicas/Jurídicas (ADMI34) — Cronograma de treinamento Painéis de Manufatura Brisa e Rotinas novas", "Cronograma de treinamento Painel de Manufatura Brisa.docx", "Cronograma de treinamento Painéis de Manufatura Brisa isa estar CONFIRMADO para exportar.\nCaso o JOB apresente algum erro, o sistema irá gerar tais erros no programa PEDI83: \nNo programa PEDI83, devem apar"], "64-0": ["Planejamento (MPSP2) — PLANEJAMENTO – MPSP2 Rotina", "Planejamento – MPSP2.docx", "PLANEJAMENTO – MPSP2 Rotina:\nManufatura\nPlano Mestre de Produção\nPlano Mestre de Produção Planejamento\nPrimeiro passo, entrar no calendário de Recursos (PREC9)\n- Calendario de Recursos\n(F6) - Criar Recurso Base Planejamento Informar: Recurso Nome do recurso \nApós informar os dados na aba “DADOS GERAIS”, utilizar a aba “TURNO”, para fornecer informações pertinentes ao recurso.\nInformar horarios de funcionamento do recurso. Exemplo abaixo.\nNo caso do recurso tiver mais turnos, informar detalhadamente nos campos. Por exemplo, parada ao meio dia, deve ser informado apenas o horario de inicio de funcionamento até o almoço, e após almoço até final de turno.\nExemplo: 07:30 – 12:00 13:00 – 17:30 Inf"], "65-0": ["Plano de Necessidades de Compras (COMP13) — Plano de Necessidade de Compras – COMP13 Rotina", "Plano de Necessidade de Compras – COMP13 160419.docx", "Plano de Necessidade de Compras – COMP13 Rotina:\n- Suprimentos - Compras\n- Pedido - Plano de Necessidade de Compras \nPara filtramos a busca em Seleção, utilizaremos: Empresa Unidade Negócio Plano de Produção\nPart indo do Plano de Produção 13933. Após, clicar na aba de Necessidades \nA compra pode ser feita:\nSelecionando as flags dos itens um a um:  Selecionar Componentes:\nSelecionar um material e logo após clicar em “Selecionar Componentes”.\nTodos os materiais que possuem o mesmo componente vinculado serão marcados.  Selecionar Produto:\nSelecionar um material e logo após clicar em “Selecionar Produto”.\nTodos os materiais que possuem o mesmo código, porém com outro processo ou componente vincu"], "66-0": ["Plano de Produção (MPSP5) — PLANO DE PRODUÇÃO – MPSP5 Rotina", "Plano de Produção – MPSP5.docx", "PLANO DE PRODUÇÃO – MPSP5 Rotina:\nManufatura\nPlano barcar no caminhão.\nEsta leitura, que irá acontecer no controle de embarque, irá validar se todos os volumes da nota foram embarcados, e após todos carregados, irá liberar a impressão da minuta.\nQuando a minuta for impressa, a mesma irá ser assinada e tirada uma foto desta assinada para ser armazenada junto com as informa"], "68-8": ["Notas Fiscais de Saída (FATU2) — Check box para controle de embarque", "Projeto Controle de Embarque.docx", "Check box para controle de embarque\nNo programa de liberação de pedidos de venda e no programa Notas Fiscais de Saída, deverá ser adicionado a check box “Controle de Embarque”. Esta check box servirá para informar se a nota de saída poderá ser selecionada no controle de embarque , sendo que estando marcada é Sim, irá para o controle de embarque, ou não marcada, Não irá para o controle de embarque. Este campo virá como padrão marcado, e deve ser possível alterar ele mesmo que a nota já esteja emitida e autorizada. Na liberação:  Na nota: \nCampo do Controle de Embarque no FATU2\nAdicionar campos no FATU2, aba Volumes, para, quando o for apontada a nota no controle de embarque, vincular as infor"], "70-0": ["Recebimento de Pedidos de Compra (COMP5) — Recebimento de Pedidos de Compra – COMP5 Rotina", "Recebimento de Pedidos de Compra – COMP5 - 160419.docx", "Recebimento de Pedidos de Compra – COMP5 Rotina:\n- Suprimentos - Compras\n- Pedido - Recebimento de Pedidos de Compra \nEm Seleção, i nserir o número do P edido de Compra e clicar na aba Pedidos a Receber : \nInserir Operação e sele cionar pedido a receber, após, Confirmar Recebimento : \nNota Fiscal: Número da Nota Fiscal Data Entrada: Data do recebimento da Nota Fiscal.\nConfirmar : \nO sistema irá gerar a Nota Fiscal de entrada com Situação N.F. “Aguardando Confirmação” , então é necessário C onfirmar : "], "72-0": ["Consulta Estoque Produto (ESTO7) — terceiros no livro, produto que saiu, classe de operação", "Sobre Operações de Insdustrializacao.docx", "Operações com industrialização. Exemplos da VPS. Um couro é enviado para um terceiro para realizar um processo de beneficiamento. Beneficiamento seria, por exemplo, como mandar um couro wet blue para processar ele e transformar em couro acabado. Aqui o couro se transforma em outro produto. \nEnviado com uma operação com classe Remessa Industrialização. Operação REMBEN. Perceba que neste caso, na operação de saída a apropriação, o campo Esto que industrialização está como N ão . \nEntendemos que nesta saída dos couros para o terceiro, as quantidades entraram no estoque Industrialização (terceiros no livro inventario), por ter como classe de operação Remessa de Industrialização. Ou seja, a class"], "72-1": ["Posição do Plano de Produção (CFAB24) — terceiros no livro, classe remessa industrialização, configurar a operação", "Sobre Operações de Insdustrializacao.docx", "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxx\nPor exemplo abai xo com esta remessa de conserto do couro que entrou no exemplo acima, da VPS. \nNesta remessa a operação é de classe Remessa industrialização, ou seja, as quantidades vão para o estoque Industrialização (terceiros no livro inventario).\n\nNa nota de entrada, após realizado o concerto, temos apenas a entrada do produto, neste caso sem dupla pois o fornecedor não cobrou a mão de obra, entendo que por ser um conserto de um serviço que já foi pago. \nNa operação da nota observamos uma configuração errada. O campo na apropriação deveria estar como não, pois neste caso não há transformação de um produto que vai sair de industrialização e vai entrar no es"], "73-0": ["Solicitação de Pedidos (COMP6) — Solicitação de Pedidos – COMP6 Rotina", "Solicitação de Pedidos - COMP6 170419.docx", "Solicitação de Pedidos – COMP6 Rotina:\n- Suprimentos - Compras\n- Pedido - Solicitação de Pedidos  Inserir: Empresa Unidade Negócio Estabelecimento\nData Necessidade Emitente: É preenchido (automático após salvar) com o nome do usuário que está fazendo a solicitação. Solicitante : Quem solicitou no iVendre . - Preço PDV: Preço Origin. - Desconto: Porcentagem de desconto que será aplicado em cima do preço final. Não é obrigatório. - Prazo Comissão: - Royalties: - Entr . Inicial: - Entr . Final: - Tamanho Inicial: Pode-se colocar um tamanho de grade diferente do cadastrado na estruturação de produtos, podendo colocar um número inicial m"], "77-0": ["operação de estoque, ícone do sininho, venda será criado", "Kunden Integrator_MCM.docx", "Introdução: API ( Application Programming Interface , ou Interface de Programação de Aplicações ) é uma forma de integrar sistemas de forma automatizada . Para isto, existem definições e protocolos/manuais de cada campo disponível. Assim, podem-se criar uma comunicação entre 2 aplicações.\nPara a utilização da API, são necessárias configurações prévias no painel administrativo (ou integrador, como chamamos internamente). Link: https://kundencloud.com.br:3604 . Seguem orientações gerais sobre o uso do integrador : OBS.: sobre as configurações específicas de cada plataforma, serão abordadas no decorrer do documento, quando abordarmos sobre os campos integrados de cada site.\n\n- N o canto superio"], "77-2": ["Estruturação do Produto (EPRO15) — campos: Marca, Vendas, Características, Descrição, Detalhe Técnico Venda", "Kunden Integrator_MCM.docx", "- Marca (somente Dooca) : a informação da marca do produto (EPRO15) irá carregar no campo “Marca” do site; \n- Botão Vendas: para habilitar o produto para venda e efetuar configurações de algumas informações que vão para a descrição do produto no site. \nAo clicar no botão Vendas, abrirá o programa EPRO61.\nCaso o produto não esteja habilitado para venda (produção ou estoque), nem será possível adicioná-lo a uma lista de preço. Portanto, primeiro passo é habilitar algum tipo de venda.\nPelo que percebi, o pessoal da engenharia habilita no nível da coleção já. \nO utra informação importante no EPRO61 é, no nível de modelo, preencher a “Descrição Produto Vendas”. Este será o nome do produto (ou tít"], "77-3": ["Estruturação do Produto (EPRO15) — configurado no painel, vinculado ao componente, descrição de vendas", "Kunden Integrator_MCM.docx", "Ainda na Dooca, aproveitando a tela acima, a informação do peso da embalagem (primeiro campo do bloco “Dimensões da embalagem”) é oriundo do campo “Peso Bruto” do EPRO15 – aba ficha técnica: \n- Materiais: para os produtos serem integrados, necessitam ter Ficha Técnica, ou seja, materiais vinculados (aba materiais); \nE xiste integração do material principal (cabedal) com campos das plataformas . A configuração da integração se dá no menu “Componentes” do painel da API: \n\nAtualmente, estão configurados os componentes cód. 1 (CAB 1) e cód. 36 (CAB).\nDesta forma, o material vinculado a um desses componentes na lista de materiais será exibido nos seguintes campos de cada API:\nSHOPIFY\nCampo “Mater"], "77-5": ["Clientes (ADMI35) — painel da api, centro de distribuição, estoque a pronta", "Kunden Integrator_MCM.docx", "na Dooca 1º cria ou atualiza pessoa no ERP. A validação ocorre pela informação do CPF da pessoa: se já existe, atualiza os outros dados (se tiver alguma alteração), se não existe, cria; \n2º cria pedido no ERP, com - a categoria definida no painel da API - e mesmo nº de pedido do site (esta informação também vai para o campo “pedido cliente”: plataforma_nº ped. ) ;\n\nSobre a categoria de pedidos:\n- é utilizada para aplicar regras quando enviado o pedido (opções marcadas ou não na aba dados gerais a direita);\n- é utilizada também para definir o tipo de ação que o pedido terá (lembrando que este item depende também da configuração do site, ex. flag “ Venda Sem Estoque ” , da Docca) . P or exempl"], "77-6": ["Agendador de Tarefas (ADMI63) — contas a receber, criado no erp, condição de pagamento", "Kunden Integrator_MCM.docx", "Vincula campos condição de pagamento e cobrança (de acordo com a configuração do menu “Condições de Pagamento” no painel da API )\n\nEste vínculo se dará da seguinte forma: Quando um pedido é gerado, no site, com um tipo novo de condição, este registro é criado automaticamente na tela abaixo e ficará aguardando o preenchimento dos campos “Modalidade”, “Cobrança” e “Espécie” com os dados do ERP. Somente a partir do momento que esses campos são vinculados, o pedido e contas a receber é criado no ERP.\n\nVincula campos: transportadora e frete . D a mesma forma que funciona a condição de pagamento, existe um menu para vínculo das transportadoras. Surgiu um pedido pago com transportadora que não exis"], "77-7": ["Parâmetros (ADMI8) — Exemplo de como gera com condição boleto", "Kunden Integrator_MCM.docx", "Exemplo de como gera com condição boleto: \nExemplo com condição cartão 3x:\nParcela 1  Parcela 2  Parcela 3 \nConcluindo, então, vimos acima os seguintes itens (destacados em verde) do painel integrador: \nOs menus “Produtos” , “Cores” e “Marcas” servem para exportar produtos do site para o ERP. Permitindo fazer um de/para dessas informações.\n\nParâmetro importante:\n- 50170 (Exclui precificação no bloqueio da lista): para o funcionamento correto da integração com os sites (principalmente do estoque em real time), é necessário que este parâmetro esteja com atributo N. "], "80-2": ["Estruturação do Produto (EPRO15) — Desenvolvido Pedido Serviço 3714 Solicitado", "Estruturação de Produto - EPRO15.pdf", "Desenvolvido Pedido Serviço 3714 Solicitado:\nESTRUTURAÇÃO DE PRODUTO: NA GRADE, POSSIBILITAR DEFINIR TAMANHOS QUE SERÃO HABILITADOS NO PEDIDO DE VENDA\nSemelhante à versão 3, pasta grade, com possibilidade de Ativar/Inativar tamanhos.\nA ser tratado no pedido de venda, permitindo utilizar apenas tamanhos ativos.\nIdéia, na Estrutura do Produto K11, pasta Grade:\nabrir no 2º bloco os tamanhos da grade selecionada no 1º bloco, e permitir \"Inativar\" tamanhos.\n\nDocumentação:\nESTRUTURAÇÃO DO PRODUTO (EPRO15)\nNa aba Grade, abaixo da aba Inventário, quando o produto possuir grade informada, passa a ser exibida em primeiro\nlugar uma nova aba: Grade.\nNesta aba poderá ser alterada a situação de um tamanho"], "80-3": ["Estruturação do Produto (EPRO15) — Desenvolvido Pedido Serviço 4316 Solicitado", "Estruturação de Produto - EPRO15.pdf", "Desenvolvido Pedido Serviço 4316 Solicitado:\nESTRUTURA DE PRODUTOS - VERIFICAR PORQUE É OBRIGATÓRIO VÍNCULAR A IMAGEM EM TODOS OS NÍVEIS, INCLUSIVE NOS SKU\nVerificar porque é obrigatório víncular a imagem em todos os níveis, principalmente no último, mesmo esse sendo um SKU.\nCaso contrário a imagem não aparece nos relatórios.\nEntendo que a solução não é replicar a imagem na estrutura, pois consumirá espaço desnecessário no banco.\nSolução é buscar a imagem onde essa for encontrada, sempre do mais específico para o mais genérico.\nExistirão casos em em a imagem será colocada a nível de cor do produto.\n\nDocumentação:\nTodos os relatórios que imitem a imagem do produto da estruturação do produto a"], "80-5": ["Estruturação do Produto (EPRO15) — produção não permitir, mensagem será exibida, hierarquia da estruturação", "Estruturação de Produto - EPRO15.pdf", "ção):\n\nSolicitação:\nPLANO DE PRODUÇÃO - NÃO PERMITIR GERAR MRP (OF/TALÕES) QUANDO NÃO EXISTIR PROCESSO INFORMADO NO PRODUTO.\n1) No plano de produção, não permitir gerar MRP (OF/Talão) quando no produto não estiver informado os processos.\n2) Também bloquear quando existir processo duplicado.\nAvaliar a possibilidade de fazer esse bloqueio já na estrutura de produtos, algo que Eu(João) acho que é\ncomplicado em função que os processos podem estar vinculados em diversos níveis e ainda em semi-acabados,\nporém, se for feito pela primeira opção, será necessário achar uma solução para permitir que o usuário consiga\nexcluir os processos duplos.\nPoderá acontercer a seguimte situação:\nPara um produto já"], "80-12": ["Estruturação do Produto (EPRO15) — ESTRUTURAÇÃO DO PRODUTO (EPRO15)", "Estruturação de Produto - EPRO15.pdf", "ESTRUTURAÇÃO DO PRODUTO (EPRO15)\nNa aba Lista Materiais, a coluna do segmento do material não será mais uma coluna obrigatória.\nPara representar um registro da lista de materiais sem a informação do segmento do material, passa a ser mostrado na\ndescrição do material o código e a descrição do componente.\nNão será possível vincular materiais alternativos numa lista de materiais com a característica acima. O botão Materiais Alternativos estará bloqueado.\nDetalhe: possivelmente será necessário configurar, via barra de ferramentas superior, na pasta \"Propriedades\", alterando para\n\"Não\" obrigatório o campo de código de material.\n\nNova coluna: Componente Variação Material. Coluna não obrigatória.\nE"], "80-22": ["Estruturação do Produto (EPRO15) — ESTRUTURAÇÃO DO PRODUTO: PERMITIR \"OCULTAR\" PROCESSOS", "Estruturação de Produto - EPRO15.pdf", "Pedido Serviço: 6828 Solicitação:\nESTRUTURAÇÃO DO PRODUTO: PERMITIR \"OCULTAR\" PROCESSOS\n\nSolicitado poder \"ocultar\" Processos, da pasta de Processos da Estrutura de Produto.\nEm resumoo desenvolvimento seria o seguinte:\n- criar campo de \"Ativo/Inativo\"\n- Criar um campo de Data Validade Final na linha do processo na Estrutura do Produto (exemplo abaixo, o campo\npoderia estar \"escondido\" depois do roteiro utilizando barra de rolagem)\n- Quando colocado data de valida de final, os campos Apontamento Processo e Apontamento Obrigatório colocar \"Não\" e inabilitar.\n- Na copia, não copiar este processo;\n- Ocultar da pasta de processos.\nUtilizar o mesmo critério do parâmetro inicialização \"EXIBIR_SOMEN"], "80-31": ["Estruturação do Produto (EPRO15) — ESTR. PRODUTO - CRIAÇÃO DE NOVOS CAMPOS PARA CATEGORIAÇÃO DOS PRODUTOS", "Estruturação de Produto - EPRO15.pdf", "Pedido Serviço: 8381 Solicitação:\nESTR. PRODUTO - CRIAÇÃO DE NOVOS CAMPOS PARA CATEGORIAÇÃO DOS PRODUTOS\n1-Criar novos programas para o cadastro de:\n- Segmento - Grupo - Subgrupo - Subcategoria - Subtipo - Gênero - Sexo - Marca\n- Coleção: considerar período de tempo (de até)\n\nOBS: Grupo e subGrupo são vinculados, ou seja, ao cadastrar um grupo é cadastrado os subGrupos. Os demais campos independentes.\n\n2- Estes cadastros servirão para categorizar e identificar o produto que será criado novo na Estruturação do Produto.\nDeverá ser adicionada nova aba na estruturação de produto que permita classificar o produto dentre estes\ncadastros. Criar uma aba: Caraterísticas do produto dentro da aba \"Fich"], "80-32": ["Estruturação do Produto (EPRO15) — CARACTERÍSTICAS PRODUTO (EPRO49)", "Estruturação de Produto - EPRO15.pdf", "CARACTERÍSTICAS PRODUTO (EPRO49)\nNovo programa disponível em Manufatura/Engenharia e Desenvolvimento de Produto/Cadastros.\nÉ o programa onde serão cadastradas as informações pertinentes a cada umas das características definidas na configuração característica produto.\nParâmetro de inicialização: CARACTERISTICA\nÉ a identificação da característica que será inserida/consultada/alterada quando o programa será acessado.\nEste parâmetro de inicialização é obrigatório.\n\nA primeira coluna exibida pelo programa é a descrição.\nCaso a configuração característica produto tenha definido uma coluna Faz Referência Com, esta coluna será apresentada na sequência.\nCaso a configuração característica produto tenh"], "80-34": ["Estruturação do Produto (EPRO15) — ESTRUTURAÇÃO DE PRODUTO: INCLUIR NA PASTA LISTA DE MATERIAIS COM CAMPOS NECESSÁRIOS PARA…", "Estruturação de Produto - EPRO15.pdf", "Pedido Serviço: 8303 Solicitação:\nESTRUTURAÇÃO DE PRODUTO: INCLUIR NA PASTA LISTA DE MATERIAIS COM CAMPOS NECESSÁRIOS PARA ATENDER\nNECESSIDADES DE DEFINIÇÕES DE FÓRMULAS.\nIdeia:\ncriar 2 pastas abaixo do bloco de materiais (1 para as informações existentes...outra para estas informações\nespecificas). Quanto às informações especificas, seguir a rotina do \"Especificações Tecnicas\". No cadastro de\ncomponentes vincular uma \"Especificação tecnica\" para trazer automatico na Lista de Materiais. Ideia posterior:\nutilizar o mesmo cadastro de especificações tecnicas.\nTambém haviamos registrado na análise interna: \"ver se ajuda se colocarmos no componente padróes de \"Especificação Tecnica\"\" Documentação"], "80-35": ["Estruturação do Produto (EPRO15) — ESTRUTURAÇÃO DO PRODUTO: OPÇÃO PARA INIBIR A MENSAGEM DE QUE O MATERIAL X JÁ ESTÁ…", "Estruturação de Produto - EPRO15.pdf", "Pedido Serviço: 8304 Solicitação:\nESTRUTURAÇÃO DO PRODUTO: OPÇÃO PARA INIBIR A MENSAGEM DE QUE O MATERIAL X JÁ ESTÁ INCLUIDO NA LISTA DE MATERIAIS.\n\nNa inclusão de materiais na Lista de Materiais (nas formulas): opção para inibir a mensagem de que o material X já\nestá incluido na Lista de Materiais. Também opção para já sugerir o mesmo componente do item anterior da Lista de Materiais.\n\nIdeia:\n1= parametro de inicialização para inibir mensagem.\n2=criar um novo parametro no cad de Categoria (aumentar a tela da categoria) e passar a sugerir o componente do material anterior.\n\nNota: ao iniciar o desenvolvimento, contatar a consultoria para obter maiores detalhes sobre a questão.\n\nDocumentação:\n"], "80-45": ["Estruturação do Produto (EPRO15) — Campos “Concentração” e “Densidade”, na pasta Inventario/Dados Gerais", "Estruturação de Produto - EPRO15.pdf", "Campos “Concentração” e “Densidade”, na pasta Inventario/Dados Gerais:\n\nDesenvolvido no pedido serviço 8755:\n- são específicos para alimentar o arquivo de Mapa de Produtos Químicos (arquivo fiscal a ser enviado a um órgão).\n- são campos para o controle junto a policia federal, de alguns produtos controlados.  Xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx\n\nSobre problema na cópia de produto acabado, gerando mensagem estranha cfe abaixo:"], "80-62": ["Estruturação do Produto (EPRO15) — ESTRUTURAÇÃO DE PRODUTO (ENGENHARIA) - EPRO15 - PERMITIR INCLUIR UMA MESMA OPERAÇÃO…", "Estruturação de Produto - EPRO15.pdf", "Pedido Serviço: 15905 Solicitação:\nESTRUTURAÇÃO DE PRODUTO (ENGENHARIA) - EPRO15 - PERMITIR INCLUIR UMA MESMA OPERAÇÃO (PROCESSO)\nMAIS QUE UMA VEZ NO FLUXO OPERACIONAL - CONTROLAR PELA SEQUENCIA ROTINA Manufatura\nEngenharia e Desenvolvimento de Produto Engenharia Estruturação de Produtos ALTERAÇÃO\n\nEm virtude de uma necessidade de mercado de Curtumes precisamos que sejam permitidas as seguintes situações:\n01 - Inclusão de uma mesma operação (processo) mais que uma vez no fluxo operacional de um produto onde sugiro\ncontrolar isto pela sequência do fluxo operacional junto com o operação (processo) a qual nunca serão as mesmas.\n02 - Também é necessário termos o campo de Demãos do lado de cada o"], "80-67": ["Estruturação do Produto (EPRO15) — controle de armazenamento, alterar a configuração, produto estiver configurado", "Estruturação de Produto - EPRO15.pdf", "Pedido Serviço: 19181 Solicitação:\n\nROTINA:\n\nManufatura\nEngenharia de Desenvolvimento de Produto Engenharia Estruturação de Produto ALTERAÇÃO:\n\n1 - Quando um produto estiver configurado, na aba Inventário, \"CONTROLE DE ARMAZENAMENTO RÓTULO: \"SIM\" e\nestiver com registros gravados com esta configuração não deve permitir alterar a configuração para \"CONTROLE DE\nLOTE: \"SIM\", exibir mensagem \"CONFIGURAÇÃO NÃO PERMITIDA\".\n\n2 - Quando um produto estiver configurado, na aba Inventário,\"CONTROLE DE LOTE: \"SIM\" e estiver com registros\ngravados com esta configuração não deve permitir alterar a configuração para \"CONTROLE DE ARMAZENAMENTO\nRÓTULO: \"SIM\", exibir mensagem \"CONFIGURAÇÃO NÃO PERMITIDA\".\n\n3 -"], "80-71": ["Estruturação do Produto (EPRO15) — DIVERSOS: CRIAR O CADASTRO \"CLASSIFICAÇÃO\" PARA SER VINCULADO NA ESTRUTURA DO PRODUTO.…", "Estruturação de Produto - EPRO15.pdf", "  Pedido Serviço: 19839 Solicitação:\nDIVERSOS: CRIAR O CADASTRO \"CLASSIFICAÇÃO\" PARA SER VINCULADO NA ESTRUTURA DO PRODUTO. TRATAR RELATÓRIOS Manufatura\nEngenharia e Desenvolvimento de Produto Cadastros Classificação (cadastro novo) Engenharia Estruturação de Produto Chão de Fábrica Relatórios de Produção\nRelatório de Produção da Classificação - Análise da Classificação - CFAB79\nRelatório Analise de Compras Matéria-Prima Couro / Fornecedor - CFAB101\nRelatório da Ficha Técnica, programas EPRO34 E EPRO35_CURTUME ALTERAÇÃO:\n\n1=Criar cadastro novo \"Classificação\":\nNeste cadastro serão cadastradas as classificações utilizadas pelos curtumes.\nExemplo:\nTR1 TR2 TR3 IV V VI VII\n\n2= Na Estruturação de"], "80-74": ["Estruturação do Produto (EPRO15) — aprovação de custos, engenharia e desenvolvimento, usuário poderá visualizar", "Estruturação de Produto - EPRO15.pdf", "Pedido Serviço: 21859 Solicitação:\n\nROTINA:\nManufatura\nEngenharia e Desenvolvimento de Produto Engenharia Estruturação de Produto ALTERAÇÃO:\n- Na aba de lista de materiais criar um botão para abrir os materiais como se fosse uma tabela. Isto vai facilitar a inserção/edição dos materiais.\n- Criar um programa para poder dizer quais colunas serão exibidas nesta tela nova e a ordem destas. Este programa\nirá conter todos os campos existente na lista de\nmateriais. Até os botões.\n\nDocumentação:\nManufatura\nEngenharia e Desenvolvimento de Produto Engenharia Estruturação de Produto Detalhamento:\n\nCriado na aba \"Manufatura\", a opção de cadastro de um ou mais materiais alternativos para o produto. Se fo"], "80-78": ["Estruturação do Produto (EPRO15) — lote máximo musical, balanceado forma, produto para calcular", "Estruturação de Produto - EPRO15.pdf", "Pedido Serviço: 22365 Solicitação:\n\nROTINA:\nManufatura\nEngenharia e Desenvolvimento de Produto Engenharia Estruturação de Produto ALTERAÇÃO:\n- Permitir configurar o produto para calcular o lote, quando este possuir o cálculo LOTE MÁXIMO MUSICAL.\nAtualmente, somente existe esta configuração para o cálculo de BASE RÓTULOS.\n\nDocumentação:\nRotina de geração de planos de produção:\n- Tipo de Cálculos: \n- Além do cálculo \"Base Rótulos\", que já permitia a geração de lotes de ordens de fabricação, agora os cálculos abaixo também permitem:\n* Lote Máximo Cálculo 1\n* Lote Máximo Cálculo 2\n* Lote Máximo Musical * Médio Musical * Médio Musical/Rótulos * Médio Sólido\n* Balanceado Forma OF\n* Balanceado Form"], "80-82": ["Estruturação do Produto (EPRO15) — Baena Mora - Kunden ERP", "Estruturação de Produto - EPRO15.pdf", "E-mail — Assunto: Baena Mora - Kunden ERP\nPoderias dar uma olhada no abaixo, para podermos vincular as imagens na Baenamora?\nEstá gerando esta mensagem “ORA-22288 file or LOB”, e não mostra nos relatórios. \n...talvez seja algo da configuração abaixo...mas eu não sei ao certo como é o que colocar aí:\nA pasta é esta aí citada que eu quero que coloquem as imagens...\n\nNicolas fez esta alteração aqui, para fazer funcionar:   Zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz\n\nAinda sobre imagens...mensagem “ORA-22288” na implantação na AKS Studio, em 040520:"], "80-85": ["Estruturação do Produto (EPRO15) — realizados por roberto, produtos para compras, olhado na geração", "Estruturação de Produto - EPRO15.pdf", "Definição de campos da Estruturação de Produtos para Compras, testes realizados por Roberto em 042018:\n\nLote Mínimo Produto: este campo é olhado na geração do pedido de compras, não vai eixar criar pedido com qtde\nmenor que o indicado aqui. \nLote Econômico Compra: funciona como um “múltiplo” para comprar. Exemplo: se informado 10, só deixa fazer\npedido de compra de 10 em 10, não permitindo por exemplo 12.\n\nTempo Ressuprimento (dias): isso é olhado para estabelecer o lead time do fornecedor: na real quantos dias antes\ntem que encaminhar o Pedido de compras, para o fornecedor ter prazo hábil para entregar na data de entrega\nprevista. Exemplo 2ª tela abaixo, inclusive numa solicitação este camp"], "80-92": ["Estruturação do Produto (EPRO15) — deixar o campo \"Origem Mercadoria\" em branco por enquanto na GS", "Estruturação de Produto - EPRO15.pdf", "E-mail — Assunto: deixar o campo \"Origem Mercadoria\" em branco por enquanto na GS\nTu vê algum problema em eu deixar o campo “Origem Mercadoria” em branco por enquanto na GS?\nIsso seria problema ou trancar para o faturamento, ou em outro lugar do Administrativo?\nOu só pode refletir no arquivo que é gerado para o escritório contábil Unescon? (será que eles vão precisar?)\nÉ que, como a usuária da engenharia não tem muito claro isso, o que colocar (eles tem hoje um campo “Genero”\nque parece ser algo semelhante – tela 2 abaixo), então acho melhor deixar isso para trás, e atualizar depois...isso\nquando aparecer a necessidade e aí ter mais claro quando e onde vai precisar, e o que colocar de fato. "], "80-97": ["Estruturação do Produto (EPRO15) — remessa de terceirização, remessas que possibilite, posição do novo", "Estruturação de Produto - EPRO15.pdf", "Pedido Serviço: 31354 Cliente: GS Solicitação:\n\nROTINA:\n\nManufatura Terceirizados Lançamentos Remessa ALTERAÇÃO:\n\nNa geração de remessa:\n-permitir efetuar apontamento de determinado processo (apontamento de Lote e de OF, semelhante rotina do\napontamento efetuado pelo \"Retorno\" de Terceirização).\n\n-Criar parâmetro de inicialização para os programas que geram as remessas, que possibilite configurar para que\nefetue o apontamento ou não no momento da Remessa. Parâmetro semelhante aos programas que geram o\nRetorno de Terceirização, através do parâmetro APONTAR_PRODUCAO = S.\nProgramas que necessitam ter esta funcionalidade:\nRemessa - TERC1\nPlano Abastecimento Materiais - Remessa Industrialização -"], "80-104": ["Estruturação do Produto (EPRO15) — dias uteis, tempo segurança entrega, partir da data", "Estruturação de Produto - EPRO15.pdf", "Definição de como calcula dos campos “Tempo Segurança Entrega (Dias)” e “Tempo Ressuprimento (Dias)”:\n\nTeste feito para Baenamora em 200720:\n-considera sempre dias uteis, sendo semana com 5 dias uteis.\nNo exemplo abaixo, os 20 dias passarão a ser 28 dias corridos.\nE os 32 dias, serão em torno de 45 dias corridos.\nDetalhe: o “Tempo Ressuprimento (Dias)” é calculado a partir da data gerada já considerando o “Tempo Segurança\nEntrega (Dias)”. Ou seja, não precisa começar a calcular a partir da data que precisa o Planejamento, e sim a “Data\nNecessidade” já com a margem do “Tempo Segurança Entrega (Dias)”.\n\nVeja exemplo abaixo:\n\nData corte 29/09--------→+20dias uteis(semana de 5 dias) = 01/09-----"], "80-110": ["Estruturação do Produto (EPRO15) — [Imagem: COMP13 | MPSP33 | KND-000263 | KND-000290 | KND-000294 | KND-000264] [Imagem:…", "Estruturação de Produto - EPRO15.pdf", "Pedido Serviço: 44162 Cliente: Baenamora Solicitação:  \nESTRUTURAÇÃO DE PRODUTOS - ABASTECIMENTO: REVISAR A VALIDAÇÃO DE \"TOLERÂNCIA ABASTECIMENTO A MENOR\" Rotina:\n\nManufatura\nEngenharia e Desenvolvimento de Produto Engenharia\nEstruturação de Produtos - Abastecimento Alteração:\n\nRevisar/tratar rotina do programa Estruturação de Produtos - Abastecimento, campo \"Tolerância Abastecimento a Menor\":\n- a rotina não está efetuando a validação indicada.\n\nDocumentação:\nManufatura\nEngenharia e Desenvolvimento de Produto Engenharia\nEstruturação de Produtos - Abastecimento Detalhamento:\n\nRotina de abastecimento alterada para controle a tolerância a menor do material.\n\nMarcio 181120: validação e testes c"], "80-111": ["Estruturação do Produto (EPRO15) — COMP3 - LOTE ECONÔMICO DE COMPRA ESTÁ SENDO VALIDADO DE FORMA INCORRETA", "Estruturação de Produto - EPRO15.pdf", "  Pedido Serviço: 47228 Cliente: TEA Solicitação:\nCOMP3 - LOTE ECONÔMICO DE COMPRA ESTÁ SENDO VALIDADO DE FORMA INCORRETA.\n\nRotina:\n\nSuprimentos Compras Pedido Pedido de Compra Alteração:\n\n- Lote econômico de compra está sendo validado de forma incorreta. Gera mensagem “KND-002533”...\n\nDocumentação:\nSuprimentos Compras Pedido Pedido de Compra Detalhamento:   Nada doi feito.\n\nObservação:\nA validação está sendo feita da maneira planejada, ou seja, quando o lote econômico está cadastrado o produto só\npode ser comprado sendo múltiplo do lote econômico."], "80-128": ["Estruturação do Produto (EPRO15) — Visto nos testes para a POC Aniger, em 090322, testes feitos por Roberto…", "Estruturação de Produto - EPRO15.pdf", "Visto nos testes para a POC Aniger, em 090322, testes feitos por Roberto…\n\nSituação: gerar as necessidades de materiais dos conjuntos de embalagem, cujos conjuntos de\nembalagens serão especificados no Pedido de Venda, na aba Multi-Seleção do Pedido.\n\nPelos testes efetuados, usamos a seguinte configuração:\nNa Lista de materiais do “Modelo”*… \n*Modelo com esta configuração de Categoria de Produto:\n(utilizado “Tipo Produto” = Variação, que é um conceito criado para Henrich, registrado no .doc\n“Estruturação de Produto - EPRO15 com rotina nova de criação de Produto Acabado pelas\nMarcas_Variação, para Henrich”…porém não é a intenção nesta POC em usar esta rotina complete…a\nintenção é usar a rotina"], "80-130": ["Estruturação do Produto (EPRO15) — PROGRAMA ESTRUTURAÇÃO DE PRODUTO ¿ EPRO15, ABA FICHA TÉCNICA, CAMPO COLEÇÃO: PERMITIR…", "Estruturação de Produto - EPRO15.pdf", "Pedido Serviço: 55360 Cliente: Kunden Solicitação:\nPROGRAMA ESTRUTURAÇÃO DE PRODUTO ¿ EPRO15, ABA FICHA TÉCNICA, CAMPO COLEÇÃO: PERMITIR VINCULAR AS DIVERSAS COLEÇÕES\n\n1. Programa Estruturação de Produto ¿ EPRO15, aba Ficha Técnica, campo Coleção;\n1.1. O campo deverá passar a ter um cadastro próprio de ¿Coleção¿.\n1.2. O campo Coleção (no EPRO15) deverá passar a ter um botão para permitir informar multi-seleção de registros de coleções.\n1.3. ; O campo atual será apenas ¿display¿, mostrando a ultima coleção vinculada.\n1.4. ; rotina deverá possibilitar informar este campo nos níveis superiores.\n\nDocumentação:\nOutros Detalhamento:\nCriada versão especial do EPRO15. "], "80-139": ["Estruturação do Produto (EPRO15) — Ferramental e produto acabado mesmo código", "Estruturação de Produto - EPRO15.pdf", "E-mail — Assunto: Ferramental e produto acabado mesmo código\n\nDe acordo testes efetuados em nossa base, é possível criar apenas um código para a produção de um\nproduto que será ferramental em outro, tanto com grade como também sem grade.\nNo exemplo uma matriz com categoria ferramental, permitiu gerar OF para produzir e também vincular\ncomo ferramental no solado, para o FPV esta mesma matriz aparece como ferramental do produto\nacabado e permite fazer o cálculo dela própria, assim como também foi possível apontar, gerar estoque e\ntransferir a mesma, conforme telas abaixo.      Xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx\n\nOpção de cadastro de fórmulas visto na implantaçã"], "80-144": ["Estruturação do Produto (EPRO15) — gerava este erro, lob operation fileopen, deixou de gerar", "Estruturação de Produto - EPRO15.pdf", "Questão de erro ao vincular imagem, na Cordato/Season em 261023...\n\nGerava este erro ao incluir a imagem e ao abrir a tela da imagem:\n\n“ORA-20000: Erro CARREGA_IMAGEM_PRODUTO_XE_P:\nORA-22288: file or LOB operation FILEOPEN falied\nNo such file or...”  \nAo clicar no botão de zoom, gerava este erro...\n“...ORA-00936:...”\n\nMotivo: no nome do arquivo, existia hifens...  \nDepois de copiar e colar e mudar o padrão para “_” ao invés de “-“ como na tela abaixo...e vincular este novo arquivo...\n\n...aí deixou de gerar o erro... "], "80-160": ["Estruturação do Produto (EPRO15) — ESTRUTURAÇÃO DE PRODUTO (EPRO15) - TER POSSIBILIDADE DE INFORMAR MAIS DE UM CÓD. DE…", "Estruturação de Produto - EPRO15.pdf", "Pedido Serviço: 59706 Cliente: Aniger Solicitação:\nESTRUTURAÇÃO DE PRODUTO (EPRO15) - TER POSSIBILIDADE DE INFORMAR MAIS DE UM CÓD. DE BARRAS NA\nGRADE DO MESMO PRODUTO.\n\nRotina:\n\nManufatura\nEngenharia e Desenvolvimento de Produto Engenharia Estruturação de Produto Alteração:\n\nTer possibilidade de informar mais de um cód. de barras na grade do mesmo produto.\nDefinir qual cód. usar no cliente.\nDemanda criação de cadastro: \"Grupo cód. barras\".\n\nDocumentação:\nParâmetro Geral:\n50251 | HABILITA O CONTROLE DE GRUPO DE CÓDIGO DE BARRAS | DEFINE SE O SISTEMA HABILITARÁ O\nCONTROLE DE GRUPOS DE CÓDIGOS DE BARRAS NO CADASTRO DO CLIENTE E NA ENGENHARIA DO PRODUTO.\nATRIBUTOS POSSÍVEIS SÃ do Serviço: 66316 Cliente: Planet Solicitação:\nNão existe variação de grade entre grade \"GRADE 34 AO 43\" e grade \"GRADE 34 AO 44\" na largura \" \" e tamanho\n\"39\" na variação \"7\".\n\nRotina:\n\nManufatura\nEngenharia e Desenvolvimento de Produto Cadastros Variação de Grade Alteração:\nVerificar o motivo de ao tentar criar o plano de produção, é exibida a mensagem de que não existe variação de grade\nsendo que as mesmas estão corretas no programa EPRO19 e estão vinculadas nos materiais no programa EPRO15.\n\nDocumentação:\nManufatura\nEngenharia e Desenvolvimento de Produto Cadastros Variação de Grade Detalhamento:\nOs erros na geração do plano estavam acontecendo, pois, o ID dos tamanhos que estavam na"], "80-184": ["Estruturação do Produto (EPRO15) — superiores e inferiores, nível intermediário, tenha uma categoria", "Estruturação de Produto - EPRO15.pdf", "1.2.1. Quando o “Produto” tenha uma Categoria que tem no botão “Configuração de Características”\na definição de Características:\n-Deverá passar a mostrar e permitir selecionar apenas estas tais Características. Ordenação:\nconforme rotina já existente, olhando o campo “Ordem” do programa “Configuração Características Produto-EPRO48”.\n\n-Uma vez que o usuário preencha alguma das Característica que estejam sendo mostradas na\naba “Características”, então a rotina deverá inabilitar o preenchimento de Características em\nProdutos de níveis superiores e inferiores deste Produto (esta funcionalidade já existe, ou seja,\nneste caso apenas manter da maneira que existe). Exemplo próxima tela abaixo.\n-Outr"], "80-185": ["Estruturação do Produto (EPRO15) — posicionado na característica, características, veja que acessei", "Estruturação de Produto - EPRO15.pdf", "1.2.3 Quando no Produto tenha uma Categoria cujo botão “Configuração de Características” não\ntenha selecionado a definição “Categoria sem Características” e também não tenha vinculado Características:\n-Neste caso manter a rotina como está atualmente, ou seja, na aba Características serão\nmostradas todas as Características cadastradas no programa “Configuração Características\nProduto-EPRO48” (apenas registros “Ativos”).  \n1.3. Revisar a maneira como está sendo mostrado no botão da aba “Propriedades”, a informação do ID\nda Característica vinculada ao Produto.\nExemplo tela abaixo...\nVeja que acessei o botão de Propriedades, e estando posicionado na 1ª característica preenchida, é\nmostrado o ID "], "80-194": ["Estruturação do Produto (EPRO15) — ESTRUTURAÇÃO DE PRODUTO (EPRO15) - TER POSSIBILIDADE DE INFORMAR MAIS DE UM CÓD. DE…", "Estruturação de Produto - EPRO15.pdf", "Pedido Serviço: 59706 Cliente: Aniger Solicitação:\nESTRUTURAÇÃO DE PRODUTO (EPRO15) - TER POSSIBILIDADE DE INFORMAR MAIS DE UM CÓD. DE BARRAS NA\nGRADE DO MESMO PRODUTO.\n\nRotina:\n\nManufatura\nEngenharia e Desenvolvimento de Produto Engenharia Estruturação de Produto Alteração:\n\nTer possibilidade de informar mais de um cód. de barras na grade do mesmo produto.\nDefinir qual cód. usar no cliente.\nDemanda criação de cadastro: \"Grupo cód. barras\".\n\nDocumentação:\n\nParâmetro Geral:\n50251 | HABILITA O CONTROLE DE GRUPO DE CÓDIGO DE BARRAS | DEFINE SE O SISTEMA HABILITARÁ O\nCONTROLE DE GRUPOS DE CÓDIGOS DE BARRAS NO CADASTRO DO CLIENTE E NA ENGENHARIA DO PRODUTO.\nATRIBUTOS POSSÍVEIS SÃO S (IRÁ HABILITA"], "80-195": ["Estruturação do Produto (EPRO15) — PROGRAMA PLANEJAMENTO DE VENDAS - VEND14", "Estruturação de Produto - EPRO15.pdf", "Pedido Serviço: 59007 Cliente: Aniger Solicitação:\nPROGRAMA PLANEJAMENTO DE VENDAS - VEND14\n\n1. Programa Planejamento de Vendas - VEND14:\n- Adicionar mais um campo de filtro/definição junto com o estrutural de produto;\n- Adicionar um novo padrão de periodicidade;\n- Ajustar em todos os lugares onde o sistema usa planejamento de vendas;\n1.1. Necessário criar no programa Estruturação de Produto - EPRO15, aba Ficha Técnica/Dados Gerais, um novo\ncampo \"Grupo de Planejamento Venda\";\n-Este campo deve ção", "Passo a passo para resolver a situação.docx", "Processo que fiz neste lote para resolver a situação:\nComparei o lote com problema 12929360003 com outros lotes que tinham dado certo no fracionamento. [Código: LOTE_PRODUTO_ATM PARA ROTULO_ATM]\nErro no fracionamento continuou: \nAo olhar antes na tabela de ROTULO_ATM identifiquei um ID de PEDIDO_VENDA_ENTREGA_ATM, fiz um select para achar o pedido [Código: PEDIDO_VENDA_ATM PEDIDO_VENDA_ITEM_ATM PEDIDO_VENDA_ENTREGA_ATM] \nNão aparecia nada, só uma informação na aba de observação: \nFiz select na tabela PEDIDO_VENDA_ENTREGA_LOTE_ATM para ver se tinha vinculo: [Código: PEDIDO_VENDA_ENTREGA_LOTE_ATM]\nFiz estas ações e testei de novo, mas novamente sem sucesso: \nFui na tabela de RESERVA_QTD_PED_ A"], "83-23": ["Alteração Lista Material de Produtos (EPRO39) — Evoluir para que, ao realizar qualquer alteração pelo EPRO39, sejam alterados no EPRO15…", "Alteração Lista Materiais de Produtos - EPRO39.pdf", "Situação vista em 2026, para o Henrich, envolvendo a rotina do EPRO15 com Produto Acabado gerado pela rotina de “Variação”:\n\nRA 260601031\n\nPedido Serviço 71049 (até 090626 não tinha sido “aprovado” para Desenvolvimento) Pedido Serviço: 26870 Cliente: Pegada Solicitação:\nEvoluir para que, ao realizar qualquer alteração pelo EPRO39, sejam alterados no EPRO15 somente os campos informados\n\n1- É necessário que, ao utilizar o programa EPRO39 para realizar alguma alteração, sejam alterados somente os campos informados.\n\nAbaixo, exemplo da situação que ocorre atualmente:\n\n- Ao tentar alterar pelo EPRO39 o campo de Insumo por exemplo, o sistema está automaticamente alterando\ntambém o campo ‘Espec. Pe"], "84-0": ["Kunden ERP | EDI de Fretes | Referencia tecnica 1 DOSSIÊ TÉCNICO", "Dossie_Tecnico_EDI_Fretes_Kunden_ERP.pdf", "Kunden ERP | EDI de Fretes | Referencia tecnica 1 DOSSIÊ TÉCNICO\nEDI de Fretes no Kunden ERP\nNOTFIS, CONEMB, DOCCOB, XML, cálculo de frete e integração ﬁscal/ﬁnanceira\nObjetivo: Transferir tro\nORA-02292 Tentativa de excluir pai com ﬁlhos em fatura/log/vínculo\nNão excluir manualmente sem mapa de dependências VBA: esperado End Sub\nNova Function/Sub foi colada dentro de outra rotina Fechar rotina anterior e man"], "87-10": ["Importação Conhecimentos Embarcados - CONEMB (ADMI96) — taxa adm servico, nao era falta, frete calculo atm", "Handoff_Tecnico_Fretes_Kunden_CONEMB_DOCCOB.docx", "10. Caso confirmado: CONEMB com erro em TAXA_ADM_SERVICO Causa raiz confirmada\nO erro de importacao do CONEMB nao estava no layout do arquivo. A rotina encontrava nota, rota e tabela de frete, mas havia configuracao ativa TAXA_ADM_SERVICO sem faixa correspondente na FRETE_CALCULO_FAIXA_PESO_ATM.\nItem Informacao Arquivo 19355763.TXT_CONPEGADA.RET Programa\nADMI96 - Importacao Conhecimentos Embarcados / CONEMB Transportadora\n91 - Expresso Sao Miguel Nota 253244 FRETE_NFS_ATM.ID 2464790 Origem\n5032 - DOIS IRMAOS / RS Destino\n5012 - PORTO ALEGRE / RS Rota FRETE_ROTA_ATM.ID = 982 Tabela de frete FRETE_CALCULO_ATM.ID = 125 Calculo rota FRETE_CALCULO_ROTA_ATM.ID = 4683 Config problematica FRETE_CALC"], "87-11": ["Conhecimento de Frete (ADMI102) — nota fiscal base, rota tabela vigente, frete fatura atm", "Handoff_Tecnico_Fretes_Kunden_CONEMB_DOCCOB.docx", "11. Diagnostico SQL - roteiro rapido\n11.1 Validar nota fiscal base [Código: FRETE_NFS_ATM FRETE_ROTA_ATM FRETE_CALCULO_ATM FRETE_CALCULO_ROTA_ATM FRETE_CALCULO_ROTA_CONFIG_ATM FRETE_CALCULO_FAIXA_PESO_ATM ALL_TAB_COLUMNS]\nA importacao do DOCCOB pode gerar fatura, vincular conhecimentos e, conforme parametro e layout, acionar geracao fiscal/nota de entrada.\nPara gerar por conhecimento, o parametro 50004 precisa estar coerente com registro 353 e valor C.\nQuando o DOCCOB gera fatura mas nao gera nota/contas a pagar, validar caminho fiscal, estabelecimento, operacao, especie de contas a pagar e parametro 50004.\nSe o conhecimento some da tela apos update/importacao, verificar se passou a ter fatu"], "88-0": ["Handoff Tecnico Fretes Kunden ERP - 22/07/2026 Pagina 1", "Handoff_Tecnico_Fretes_Kunden_CONEMB_DOCCOB_LIMPO.pdf", "Handoff Tecnico Fretes Kunden ERP - 22/07/2026 Pagina 1\nHandoff Tecnico - Fretes Kunden ERP\nVersao limpa com prints filtrados deste chat Item Informacao Finalidade\nDocumento de transferencia de contexto para outra IA, analista ou suporte tecnico.\nOrigem\nConsolidacao das analises feitas no chat sobre importacao de fretes no ERP Kunden.\nData de referencia 22/07/2026 Escopo\nFluxo operacional e diagnostico tecnico de NOTFIS, CONEMB, XML, DOCCOB, CTe e calculo de frete.\n<b>Resumo executivo<\/b><br/>A cadeia de frete deve ser analisada por cadastro, arquivo, procedure e tabela. A principal\ndescoberta recente foi que um erro CONEMB em BUSCA_ROTA_TRANSPORTE_P nao estava no TXT, mas em\nTAXA_ADM_SERVIC"], "88-1": ["unidade de calculo, importa conhecimentos embarcados, formula e faixas", "Handoff_Tecnico_Fretes_Kunden_CONEMB_DOCCOB_LIMPO.pdf", "1. Fluxo operacional Artefato Papel Risco tecnico NOTFIS\nCarrega notas fiscais base.\nPode afetar cidade, nota, produto e unidade de calculo.\nCONEMB Importa conhecimentos embarcados.\nPode quebrar no calculo de frete por cadastro incompleto.\nXML CTe\nImporta CTe quando o fluxo usa XML.\nNao usar como obrigatorio se cliente opera sem XML.\nDOCCOB Importa cobranca/fatura.\nDepende do parametro 50004 e registro 352/353.\nTabela de frete\nDefine rota, formula e faixas.\nConfig sem faixa causa ORA-01403/ORA-06502."], "88-8": ["Importação Documento de Cobrança - DOCCOB (ADMI101) — users guilhermenoschang appdata, handoff tecnico fretes, local temp", "Handoff_Tecnico_Fretes_Kunden_CONEMB_DOCCOB_LIMPO.pdf", "Handoff Tecnico Fretes Kunden ERP - 22/07/2026 Pagina 9\nPrint 007 - codex-clipboard-9b38d73b-4949-450b-89b7-1d55ee89fcff.png\n<b>Leitura tecnica:<\/b> Erro na importacao do DOCCOB: XML dos conhecimentos nao importado e divergencia entre\nvalor do frete do DOCCOB e valor importado/calculado. Caminho original: C:\\Users\\Guilhe
