<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chunk viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1d2433; --muted:#5d6678; --line:#d6dbe4; --paper:#f7f8fa; --panel:#ffffff;
    --focus:#2f5fd0;
    --t-pedido:#2f5fd0; --t-email:#8a5a00; --t-teste:#1f7a4d; --t-documentacao:#6b4fa3;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font:14px/1.5 "IBM Plex Sans",system-ui,sans-serif;color:var(--ink);background:var(--paper);display:grid;grid-template-rows:auto auto 1fr}
  #sem{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--paper)}
  #sem b{font-weight:600}
  #sq{min-width:360px;flex:1;max-width:620px}
  #semstat{color:var(--muted)}
  .result{background:var(--panel);border:1px solid var(--line);border-radius:6px;margin:0 0 10px;max-width:900px;cursor:pointer;display:block;width:100%;text-align:left;padding:0}
  .result:hover{border-color:var(--focus)}
  .result .rt{display:flex;gap:10px;align-items:baseline;padding:8px 12px 0}
  .score{font:500 12px "IBM Plex Mono",monospace;background:#e8eefb;color:var(--focus);border-radius:4px;padding:1px 6px}
  .result .rmeta{padding:2px 12px 6px;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line)}
  .result .rtext{margin:0;padding:10px 12px;white-space:pre-wrap;word-break:break-word;font:13px/1.55 "IBM Plex Mono",monospace;color:var(--ink)}
  .result .ropen{padding:6px 12px 8px;font-size:12px;color:var(--focus);border-top:1px solid var(--line)}
  .result{user-select:text}
  .chunk.target{box-shadow:0 0 0 3px #ffe38a}
  header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
  header h1{font-size:15px;font-weight:600;margin:0 8px 0 0}
  input,select,button{font:inherit;color:inherit}
  input[type=search],select{border:1px solid var(--line);border-radius:6px;padding:6px 10px;background:#fff}
  input[type=search]{min-width:260px}
  button,.file{border:1px solid var(--line);border-radius:6px;padding:6px 12px;background:#fff;cursor:pointer}
  .file input{display:none}
  :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  .stat{color:var(--muted);margin-left:auto}
  main{display:grid;grid-template-columns:320px 1fr;min-height:0}
  #docs{overflow:auto;border-right:1px solid var(--line);background:var(--panel)}
  #docs button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:8px 14px;background:none}
  #docs button:hover{background:var(--paper)}
  #docs button[aria-current=true]{background:#e8eefb;box-shadow:inset 3px 0 0 var(--focus)}
  #docs small{display:block;color:var(--muted)}
  #view{overflow:auto;padding:20px 28px 60px}
  .empty{max-width:520px;margin:12vh auto;color:var(--muted)}
  .empty h2{color:var(--ink);font-size:18px;margin:0 0 8px}
  .doctitle{font-size:20px;font-weight:600;margin:0 0 4px}
  .docmeta{color:var(--muted);margin-bottom:20px}
  .record{border-left:3px solid var(--c);padding-left:14px;margin:0 0 26px}
  .rechead{display:flex;gap:10px;align-items:baseline;margin-bottom:8px;color:var(--c);font-weight:600}
  .rechead span{color:var(--muted);font-weight:400}
  .topic{margin:14px 0 8px;font-weight:600}
  .topic span{color:var(--muted);font-weight:400}
  .chunk{background:var(--panel);border:1px solid var(--line);border-radius:6px;margin:0 0 10px;max-width:900px}
  .chunk.hit{border-color:var(--focus)}
  .cmeta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:6px 12px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
  .ctitle{padding:8px 12px 0;font-weight:600}
  .ctitle small{font-weight:400;color:var(--muted);margin-left:6px}
  .cmeta b{font-family:"IBM Plex Mono",monospace;font-weight:500;color:var(--ink)}
  .small{color:#b3261e}
  .chip{font:12px "IBM Plex Mono",monospace;border:1px solid var(--line);border-radius:4px;padding:1px 6px;background:var(--paper);cursor:pointer}
  .chip.main{border-color:var(--ink)}
  pre{margin:0;padding:10px 12px;white-space:pre-wrap;word-break:break-word;font:13px/1.55 "IBM Plex Mono",monospace;max-height:none}
  .header-line{color:var(--focus)}
  .overlap{color:var(--muted)}
  mark{background:#ffe38a;padding:0}
  .tp-pedido{--c:var(--t-pedido)} .tp-email{--c:var(--t-email)} .tp-teste{--c:var(--t-teste)} .tp-documentacao{--c:var(--t-documentacao)}
  @media (max-width:760px){main{grid-template-columns:1fr;grid-template-rows:38vh 1fr}#docs{border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<header>
  <h1>Chunk viewer</h1>
  <label class="file">Open chunks file<input id="file" type="file" accept=".jsonl,.json"></label>
  <input id="q" type="search" placeholder="Search text, document or program (e.g. FATU61)" disabled>
  <select id="type" disabled>
    <option value="">All record types</option>
    <option>pedido</option><option>email</option><option>teste</option><option>documentacao</option>
  </select>
  <label><input id="embed" type="checkbox"> Show embedded text</label>
  <span class="stat" id="stat"></span>
</header>
<div id="sem">
  <b>Semantic search</b>
  <input id="sq" type="search" placeholder="Type a sentence, e.g. como liberar o pedido para faturar" disabled>
  <select id="topk" aria-label="Number of results"><option>10</option><option selected>20</option><option>50</option></select>
  <button id="sgo" disabled>Search</button>
  <span id="semstat"></span>
</div>
<main>
  <nav id="docs" aria-label="Documents"></nav>
  <section id="view">
    <div class="empty">
      <h2>Open a chunks file to start</h2>
      Choose the <code>chunks.jsonl</code> created by <code>chunker.py</code>. The file is read in your browser and is not uploaded anywhere.
      <br><br>For semantic search, start the page with <code>python viewer_server.py</code> instead: it loads the chunks automatically.
    </div>
  </section>
</main>
<script>
const $ = s => document.querySelector(s);
let docs = new Map(), current = null, order = [];
const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function loadChunks(text) {
  docs = new Map(); let n = 0, bad = 0;
  for (const line of text.split('\n')) {
    if (!line.trim()) continue;
    let c; try { c = JSON.parse(line); } catch { bad++; continue; }
    if (!docs.has(c.doc_id)) docs.set(c.doc_id, {id:c.doc_id, name:c.doc_name, chunks:[]});
    const d = docs.get(c.doc_id);
    c._search = (c.text + ' ' + (c.title||'') + ' ' + (c.topic_title||'') + ' ' + c.doc_name + ' ' + c.mentioned_programs + ' ' + c.main_programs + ' ' + c.pedido).toLowerCase();
    d.chunks.push(c); n++;
  }
  for (const d of docs.values()) d.chunks.sort((a,b) => a.position - b.position);
  order = [...docs.values()].sort((a,b) => a.name.localeCompare(b.name));
  $('#q').disabled = $('#type').disabled = false;
  $('#stat').textContent = `${docs.size} documents, ${n} chunks` + (bad ? `, ${bad} unreadable lines skipped` : '');
  renderList();
  if (order.length) open(order[0].id);
}

$('#file').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  $('#stat').textContent = 'Reading…';
  loadChunks(await f.text());
});

function matches(c, q, t) {
  return (!t || c.record_type === t) && (!q || c._search.includes(q));
}

function renderList() {
  const q = $('#q').value.trim().toLowerCase(), t = $('#type').value;
  const nav = $('#docs'); nav.innerHTML = '';
  let shown = 0;
  for (const d of order) {
    const hits = d.chunks.filter(c => matches(c, q, t)).length;
    if ((q || t) && !hits) continue;
    const b = document.createElement('button');
    b.dataset.id = d.id;
    b.setAttribute('aria-current', d.id === current);
    b.innerHTML = `${esc(d.name)}<small>${d.chunks.length} chunks${(q||t) ? `, ${hits} matching` : ''}</small>`;
    b.onclick = () => open(d.id);
    nav.appendChild(b); shown++;
  }
  if (!shown) nav.innerHTML = '<p style="padding:14px;color:var(--muted)">No document matches. Clear the search or pick another record type.</p>';
}

function highlight(html, q) {
  if (!q) return html;
  const re = new RegExp(esc(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
  return html.replace(re, m => `<mark>${m}</mark>`);
}

function open(id) {
  current = id;
  document.querySelectorAll('#docs button').forEach(b => b.setAttribute('aria-current', b.dataset.id == id));
  const d = docs.get(id), q = $('#q').value.trim(), ql = q.toLowerCase(), t = $('#type').value;
  const showEmbed = $('#embed').checked;
  const v = $('#view');
  const sizes = d.chunks.map(c => c.text.length);
  let html = `<h2 class="doctitle">${esc(d.name)}</h2>
    <div class="docmeta">${d.chunks.length} chunks in ${new Set(d.chunks.map(c=>c.record)).size} records and ${new Set(d.chunks.filter(c=>c.topic_number).map(c=>c.topic_id)).size} numbered topics. Chunk size ${Math.min(...sizes)} to ${Math.max(...sizes)} characters.</div>`;
  let rec = null, inRec = false, topic = null;
  for (const c of d.chunks) {
    if (c.record !== rec) {
      if (inRec) html += '</div>';
      rec = c.record; inRec = true;
      html += `<div class="record tp-${c.record_type}"><div class="rechead">Record ${c.record + 1}: ${c.record_type}${c.pedido ? ` <span>pedido ${c.pedido}</span>` : ''}</div>`;
    }
    if (c.topic_number && c.topic_id !== topic) {
      html += `<div class="topic">Topic ${c.topic_number}: ${esc(c.topic_title)}${c.previous_topic_id ? ' <span>(follows the previous topic)</span>' : ''}</div>`;
    }
    topic = c.topic_id;
    const hit = (ql || t) && matches(c, ql, t);
    const main = new Set((c.main_programs || '').split(' ').filter(Boolean));
    const progs = (c.mentioned_programs || '').split(' ').filter(Boolean)
      .map(p => `<span class="chip${main.has(p) ? ' main' : ''}" title="Search this program">${p}</span>`).join('');
    let body;
    if (showEmbed) {
      const [first, ...rest] = c.embed_text.split('\n');
      let restTxt = esc(rest.join('\n'));
      restTxt = restTxt.replace(/^\(\.\.\.\)[^\n]*/, m => `<span class="overlap">${m}</span>`);
      body = `<span class="header-line">${esc(first)}</span>\n${restTxt}`;
    } else body = esc(c.text);
    html += `<article class="chunk${hit ? ' hit' : ''}" id="c-${c.chunk_id}">
      ${c.title ? `<div class="ctitle">${highlight(esc(c.title), q)}<small>${esc(c.title_source||'')}</small></div>` : ''}
      <div class="cmeta"><b>${c.chunk_id}</b>
        <span class="${c.text.length < 400 ? 'small' : ''}">${c.text.length} chars</span>
        ${progs}</div>
      <pre>${highlight(body, q)}</pre></article>`;
  }
  if (inRec) html += '</div>';
  v.innerHTML = html;
  v.scrollTop = 0;
  const first = v.querySelector('.chunk.hit');
  if (first) first.scrollIntoView({block:'start'});
}

let timer;
$('#q').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(() => { renderList(); if (current != null) open(current); }, 250); });
$('#type').addEventListener('change', () => { renderList(); if (current != null) open(current); });
$('#embed').addEventListener('change', () => current != null && open(current));
// ------------------------------------------------------------------ semantic search
// Runs in viewer_server.py (Python + ONNX, same model as cluster.py).
const served = location.protocol.startsWith('http');
let semReady = false;

async function checkServer() {
  if (!served) {
    $('#semstat').textContent = 'Semantic search needs the local server: run  python viewer_server.py  and use the page it opens.';
    return;
  }
  try {
    const info = await (await fetch('/api/info')).json();
    if (!info.embeddings) { $('#semstat').textContent = info.error; return; }
    const base = `${info.count} chunks · ${info.model.split('/').pop()} (${(info.onnx_file || '').split('/').pop()})` +
      (info.missing_ids ? ` · ${info.missing_ids} embedded ids are not in the chunks file: re-run cluster.py` : '');
    if (info.model_state === 'error') { $('#semstat').textContent = 'Model error: ' + info.error; return; }
    semReady = true;
    $('#sq').disabled = $('#sgo').disabled = false;
    $('#semstat').textContent = info.model_state === 'ready' ? base : base + ' · loading the model…';
    if (info.model_state !== 'ready') setTimeout(checkServer, 1500);
  } catch (err) {
    $('#semstat').textContent = 'Local server not reachable: ' + err.message;
  }
}

async function semanticSearch() {
  const q = $('#sq').value.trim();
  if (!q || !semReady) return;
  if (!docs.size) { $('#semstat').textContent = 'The chunks are not loaded yet.'; return; }
  $('#sgo').disabled = true;
  const k = +$('#topk').value;
  $('#semstat').textContent = 'Searching…';
  try {
    const res = await fetch('/api/search', {method: 'POST', headers: {'Content-Type': 'application/json'},
                                            body: JSON.stringify({query: q, k})});
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.status);
    const byId = new Map(); for (const doc of docs.values()) for (const c of doc.chunks) byId.set(c.chunk_id, c);
    current = null;
    document.querySelectorAll('#docs button').forEach(b => b.setAttribute('aria-current', false));
    $('#view').innerHTML = `<h2 class="doctitle">Semantic results</h2>
      <div class="docmeta">Chunks closest in meaning to “${esc(q)}”. Click one to open it in its document.</div>` +
      data.results.map(({chunk_id: id, score}) => {
        const c = byId.get(id);
        if (!c) return `<div class="result"><div class="rt"><span class="score">${score.toFixed(3)}</span><b>${esc(id)}</b> (not in the open chunks file)</div></div>`;
        return `<button class="result" data-doc="${c.doc_id}" data-chunk="${esc(id)}">
          <div class="rt"><span class="score">${score.toFixed(3)}</span><b>${esc(c.title || c.doc_name)}</b></div>
          <div class="rmeta">${esc(c.doc_name)} · ${esc(id)} · ${esc(c.record_type)}${c.pedido ? ' · pedido ' + esc(c.pedido) : ''}</div>
          <pre class="rtext">${esc(c.text)}</pre>
          <div class="ropen">Open in document</div>
        </button>`;
      }).join('');
    $('#view').scrollTop = 0;
    $('#semstat').textContent = `Top ${data.results.length} in ${data.ms} ms.`;
  } catch (err) {
    $('#semstat').textContent = 'Semantic search failed: ' + err.message;
  } finally {
    $('#sgo').disabled = false;
  }
}
$('#sgo').addEventListener('click', semanticSearch);
if (served) {
  $('#stat').textContent = 'Loading chunks from the local server…';
  fetch('/api/chunks').then(r => r.text()).then(loadChunks)
    .catch(err => { $('#stat').textContent = 'Could not load chunks: ' + err.message; });
}
checkServer();
$('#sq').addEventListener('keydown', e => { if (e.key === 'Enter') semanticSearch(); });

$('#view').addEventListener('click', e => {
  const r = e.target.closest('.result[data-doc]');
  if (r && getSelection().toString()) return;          // selecting text, not opening
  if (r) {
    open(docs.has(+r.dataset.doc) ? +r.dataset.doc : r.dataset.doc);
    const el = document.getElementById('c-' + r.dataset.chunk);
    if (el) { el.classList.add('target'); el.scrollIntoView({block: 'start'}); }
    return;
  }
});
$('#view').addEventListener('click', e => {
  if (e.target.classList.contains('chip')) { $('#q').value = e.target.textContent; renderList(); open(current); }
});
</script>
</body>
</html>
